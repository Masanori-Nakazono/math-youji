<style>
/* ===========================================================
   かずのぼうけん — stylesheet
   Visual world: 画用紙とクレヨン (drawing paper & crayons)
   =========================================================== */

/* ---------- tokens ---------- */
:root{
  /* ground & ink */
  --paper:      #FBF4E9;   /* warm drawing paper */
  --paper-2:    #F3E9D8;   /* recessed paper */
  --card:       #FFFDF8;   /* card face */
  --card-edge:  #E4D5BC;   /* pencil edge */
  --ink:        #2E2A3F;   /* blue-violet ink, never pure black */
  --ink-soft:   #6C6480;
  --ink-faint:  #A79CB4;

  /* crayons — semantic content colors */
  /* deepened from #F2604C: this red is the numeral the question is about
     (「5 は 3 と いくつ？」) and it sat at 2.93:1 on the paper — under the 3:1 floor
     for large text, let alone the 4.5:1 for the rest. 4.45:1 now, and still a crayon. */
  --c-red:      #CE3D26;
  --c-orange:   #FF9F1C;
  --c-yellow:   #F5C042;
  --c-green:    #46B87A;
  --c-blue:     #3F8FE0;
  --c-purple:   #8E6FD1;
  --c-pink:     #F384AE;
  --c-brown:    #A9784F;

  /* roles */
  --accent:     #FF9F1C;   /* dandelion — primary action */
  --accent-ink: #6E3D00;
  --good:       #46B87A;
  --good-soft:  #DFF3E7;
  /* What goes ON a saturated crayon fill. White was the default and fails on every
     one of them: 2.05:1 on the orange「?」in the number-bond diagram, 2.50:1 on the
     green a child sees the instant they answer correctly, 1.4–2.8:1 across the
     board in dark mode. One dark ink clears 3:1 on every crayon in both themes,
     and 4.5:1 on all but the two that only ever carry big bold numerals. */
  --on-crayon:  #1C1828;
  --good-ink:   #27804F;   /* green as text, e.g. on --good-soft */
  --oops:       #E9829A;   /* soft rose, never alarm red — borders and fills */
  --oops-ink:   #B03E5A;   /* the same warning as text: #E9829A was 2.37:1 */
  --oops-soft:  #FBE6EB;
  --star:       #FFC533;
  --star-edge:  #D08A00;
  /* the stroke a child is asked to trace is the content — it must be clearly visible */
  --trace-guide:#CBE0F7;

  /* effects */
  --shadow:     0 .25em 0 rgba(46,42,63,.16), 0 .8em 1.6em rgba(46,42,63,.10);
  --shadow-sm:  0 .18em 0 rgba(46,42,63,.14);
  --ring:       #3F8FE0;

  /* geometry — slightly irregular, hand-drawn corners */
  --wob-a: 1.4em 1.1em 1.3em 1.2em;
  --wob-b: 1.1em 1.35em 1.15em 1.3em;

  /* scale unit — refined at runtime by JS */
  --u: clamp(7px, min(1.45vw, 1.65vh), 21px);
  /* Anything a five-year-old has to hit never goes below this, whatever --u says.
     Apple's 44pt minimum is written for adult index fingers. */
  --tap: 64px;

  --fs-jp: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4",
           "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --fs-num: "Baloo 2", "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;

  color-scheme: light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:     #171426;
    --paper-2:   #100E1C;
    --card:      #221E36;
    --card-edge: #3B3455;
    --ink:       #F6EFE4;
    --ink-soft:  #B6ADC6;
    --ink-faint: #776D8E;

    --c-red:     #FF7A66;
    --c-orange:  #FFB24A;
    --c-yellow:  #FFD264;
    --c-green:   #5DD08E;
    --c-blue:    #62A8F0;
    --c-purple:  #A98BE8;
    --c-pink:    #FF9CC1;
    --c-brown:   #C9946A;

    --accent:    #FFB24A;
    --accent-ink:#2A1600;
    --good:      #5DD08E;
    --good-soft: #1E3B2C;
    --good-ink:  #5DD08E;
    --oops:      #F5A0B4;
    --oops-ink:  #F5A0B4;
    --oops-soft: #3A2430;
    --star:      #FFD24D;
    --star-edge: #A87400;
    --trace-guide:#39457A;

    --shadow:    0 .25em 0 rgba(0,0,0,.45), 0 .8em 1.6em rgba(0,0,0,.35);
    --shadow-sm: 0 .18em 0 rgba(0,0,0,.4);
    --ring:      #7CB8F5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:     #171426;
  --paper-2:   #100E1C;
  --card:      #221E36;
  --card-edge: #3B3455;
  --ink:       #F6EFE4;
  --ink-soft:  #B6ADC6;
  --ink-faint: #776D8E;
  --c-red:     #FF7A66;
  --c-orange:  #FFB24A;
  --c-yellow:  #FFD264;
  --c-green:   #5DD08E;
  --c-blue:    #62A8F0;
  --c-purple:  #A98BE8;
  --c-pink:    #FF9CC1;
  --c-brown:   #C9946A;
  --accent:    #FFB24A;
  --accent-ink:#2A1600;
  --good:      #5DD08E;
  --good-soft: #1E3B2C;
  --good-ink:  #5DD08E;
  --oops:      #F5A0B4;
  --oops-ink:  #F5A0B4;
  --oops-soft: #3A2430;
  --star:      #FFD24D;
  --star-edge: #A87400;
  --trace-guide:#39457A;
  --shadow:    0 .25em 0 rgba(0,0,0,.45), 0 .8em 1.6em rgba(0,0,0,.35);
  --shadow-sm: 0 .18em 0 rgba(0,0,0,.4);
  --ring:      #7CB8F5;
  color-scheme: dark;
}

/* ---------- reset / stage ---------- */
*, *::before, *::after{ box-sizing: border-box; }

html, body{
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

body{
  background: var(--paper);
  color: var(--ink);
  font-family: var(--fs-jp);
  font-size: calc(var(--u) * 1.6);
  line-height: 1.5;
  font-weight: 500;
  -webkit-user-select: none;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* faint paper tooth */
body::before{
  content:"";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: .5;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,159,28,.055), transparent 45%),
    radial-gradient(circle at 82% 72%, rgba(63,143,224,.055), transparent 45%);
}

#stage{
  touch-action: manipulation;
  position: fixed;
  inset: 0;
  padding: max(env(safe-area-inset-top), calc(var(--u)*.6))
           max(env(safe-area-inset-right), calc(var(--u)*1))
           max(env(safe-area-inset-bottom), calc(var(--u)*1.5))
           max(env(safe-area-inset-left), calc(var(--u)*1));
  display: grid;
  /* An auto track takes its minimum from the item's min-content width, so one
     nowrap row (なんばんめ with eight animals) could widen the whole stage past
     the iPad and take every ancestor's `max-width:100%` with it. */
  grid-template-columns: minmax(0, 1fr);
  z-index: 1;
}

.screen{
  grid-area: 1 / 1;
  min-height: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * .8);
}
.screen[hidden]{ display: none !important; }

.screen.enter{ animation: screenIn .34s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes screenIn{
  from{ opacity: 0; transform: translateY(calc(var(--u)*1.4)) scale(.985); }
  to  { opacity: 1; transform: none; }
}

/* ---------- generic buttons ---------- */
.btn{
  font: inherit;
  font-weight: 800;
  color: var(--ink);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: var(--wob-a);
  padding: calc(var(--u)*.7) calc(var(--u)*1.3);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .12s cubic-bezier(.2,.9,.3,1.4), box-shadow .12s, background .15s;
  touch-action: manipulation;
  display: inline-flex; align-items: center; justify-content: center;
  gap: calc(var(--u)*.5);
  min-height: calc(var(--u)*4.2);
}
.btn:active{ transform: translateY(.18em); box-shadow: none; }
.btn.wrong{ animation: shake .42s; border-color: var(--oops); background: var(--oops-soft); }
.btn.correct{ background: var(--good); border-color: var(--good); color: var(--on-crayon); }
.btn:focus-visible{ outline: calc(var(--u)*.28) solid var(--ring); outline-offset: calc(var(--u)*.2); }

/* Screen changes move focus to the heading for assistive tech. Hide the browser
   ring on that programmatic focus; keep a ring only for real keyboard focus. */
.screen h1:focus,
.screen h2:focus,
.screen [role="heading"]:focus{ outline: none; }
.screen h1:focus-visible,
.screen h2:focus-visible,
.screen [role="heading"]:focus-visible{
  outline: calc(var(--u)*.28) solid var(--ring);
  outline-offset: calc(var(--u)*.2);
}

.btn-accent{
  background: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 72%, var(--ink) 28%);
  color: var(--accent-ink);
}
.btn-ghost{ background: transparent; border-color: transparent; box-shadow: none; }
.btn-ghost:active{ transform: scale(.94); }

.btn-round{
  width: calc(var(--u)*4.4); height: calc(var(--u)*4.4);
  min-height: 0; padding: 0; border-radius: 50%;
  font-size: calc(var(--u)*2);
}

/* ---------- top bar ---------- */
.topbar{
  display: flex; align-items: center; gap: calc(var(--u)*.8);
  flex: 0 0 auto;
}
.topbar h2{
  margin: 0;
  font-size: calc(var(--u)*2);
  font-weight: 800;
  letter-spacing: .02em;
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* progress pips */
.pips{ display: flex; gap: calc(var(--u)*.35); flex: 0 0 auto; }
.pip{
  width: calc(var(--u)*1.05); height: calc(var(--u)*1.05);
  border-radius: 50%;
  background: var(--card-edge);
  transition: background .3s, transform .3s;
}
.pip.done{ background: var(--good); }

/* ---------- play area ---------- */
.prompt{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: calc(var(--u)*.8);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);

}

  text-wrap: balance;
}

.playfield{
  flex: 1 1 auto;
  min-height: 0;
  min-width: 0;

}

.choice{
  font-family: var(--fs-num);
  font-weight: 800;
  font-size: calc(var(--u)*3.6);
  line-height: 1;
  min-width: calc(var(--u)*8.4);
  min-height: calc(var(--u)*6.8);
  padding: calc(var(--u)*.6) calc(var(--u)*1);

  border: calc(var(--u)*.26) solid var(--card-edge);

  box-shadow: var(--shadow);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform .12s cubic-bezier(.2,.9,.3,1.4), box-shadow .12s, background .2s, border-color .2s;
}
.choice:active{ transform: translateY(.2em) scale(.98); box-shadow: var(--shadow-sm); }
.choice:focus-visible{ outline: calc(var(--u)*.28) solid var(--ring); outline-offset: calc(var(--u)*.24); }
.choice.pic{ font-family: var(--fs-jp); font-size: calc(var(--u)*2.6); }
.choice.correct{ background: var(--good); border-color: var(--good); color: var(--on-crayon); animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
.choice.wrong{ background: var(--oops-soft); border-color: var(--oops); animation: shake .42s; }
.choice.dim{ opacity: .32; pointer-events: none; filter: saturate(.4); }
.choice[disabled]{ pointer-events: none; }

@keyframes pop{ 0%{transform:scale(1)} 45%{transform:scale(1.16)} 100%{transform:scale(1)} }
@keyframes shake{
  0%,100%{ transform: translateX(0) }
  15%{ transform: translateX(-.35em) rotate(-2deg) }
  35%{ transform: translateX(.35em) rotate(2deg) }
  55%{ transform: translateX(-.22em) rotate(-1.2deg) }
  78%{ transform: translateX(.16em) }
}
@keyframes wiggle{
  0%,100%{ transform: rotate(0) }
  25%{ transform: rotate(-5deg) } 75%{ transform: rotate(5deg) }
}
@keyframes floatY{
  0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-.35em) }
}

/* ---------- counting objects ---------- */
.objfield{
  position: relative;
  width: 100%; height: 100%;

  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);

}

  position: absolute;

  display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--u)*5);
  line-height: 1;
  cursor: pointer;
  transform: translate(-50%,-50%);
  transition: transform .18s cubic-bezier(.2,.9,.3,1.5), filter .18s, opacity .3s;

}

}

}

/* rows / groups of items */
.row{ display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: calc(var(--u)*.5); }
.item{ font-size: calc(var(--u)*3.6); line-height: 1; }

.plate{

}

/* ---------- toast / feedback ---------- */
#fx{ position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }

}

@keyframes markIn{

  40%{ opacity:1; transform: translate(-50%,-50%) scale(1.06) rotate(3deg) }

}

/* daily practice banner */
.daily{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: calc(var(--u)*1);
  background: linear-gradient(105deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--c-pink)));
  color: var(--accent-ink);
  border: calc(var(--u)*.26) solid color-mix(in srgb, var(--accent) 65%, var(--ink) 35%);
  border-radius: var(--wob-a);

  box-shadow: var(--shadow);

  text-align: left;
  transition: transform .14s cubic-bezier(.2,.9,.3,1.4), box-shadow .14s;
}

.daily .mascot{ width: calc(var(--u)*5.6); height: calc(var(--u)*5.6); }
.daily.done{
  background: var(--good-soft);
  color: var(--ink);
  border-color: var(--good);
}
.daily .go{ font-size: calc(var(--u)*2.4); line-height: 1; flex: 0 0 auto; }

/* The daily sets share one row. Each of the four (おすすめ / きょうの れんしゅう /
   きのうの ミッション / にがて あつめ) used to be a full-width banner of its own,
   so on a busy day the map they lead to was a strip at the bottom of the screen.
   One row, never wrapping: with one banner it fills the width exactly as before,
   with four they are quarters and the long subtitles clip. */
.dailies{
  flex: 0 0 auto;
  display: flex; flex-wrap: nowrap; align-items: stretch;
  gap: calc(var(--u)*.7);
}
.dailies > .daily{
  flex: 1 1 0; min-width: 0;
  gap: calc(var(--u)*.7);
  padding: calc(var(--u)*.6) calc(var(--u)*1);
}
.dailies > .daily .t{ font-size: calc(var(--u)*1.8); }
.dailies > .daily .s{ font-size: calc(var(--u)*1.25); }
/* one line each: a banner that wraps is a banner that grows the row back */
.dailies > .daily .t,
.dailies > .daily .s{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dailies > .daily .mascot{ width: calc(var(--u)*4.4); height: calc(var(--u)*4.4); }
.dailies > .daily .go{ font-size: calc(var(--u)*2); }
/* three or four banners at once: the name is what the child reads, so the mascot
   gives up its width to it before the words start clipping */
.dailies.n3 > .daily .mascot,
.dailies.n4 > .daily .mascot{ display: none; }
.dailies.n3 > .daily .t,
.dailies.n4 > .daily .t{ font-size: calc(var(--u)*1.55); }
.dailies.n3 > .daily .s,
.dailies.n4 > .daily .s{ font-size: calc(var(--u)*1.1); }
.dailies.n3 > .daily .go,
.dailies.n4 > .daily .go{ font-size: calc(var(--u)*1.6); }

}

.skilltable td.n{ font-family: var(--fs-num); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.bar{
  height: calc(var(--u)*.9);
  background: var(--paper-2);
  border-radius: 999px; overflow: hidden;
  min-width: calc(var(--u)*8);
}
.bar > i{ display: block; height: 100%; background: var(--good); border-radius: 999px; transition: width .6s cubic-bezier(.2,.9,.3,1); }

.gate{
  flex: 1 1 auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u)*1.2); text-align: center;
}
.gate .q{ font-family: var(--fs-num); font-size: calc(var(--u)*4); font-weight: 800; }
.gate .hint{ color: var(--ink-soft); font-size: calc(var(--u)*1.4); }

/* ===========================================================
   TITLE
   =========================================================== */
#title{
  align-items: center; justify-content: center; text-align: center;
  gap: calc(var(--u)*1.4);
}
#title .big{
  font-size: calc(var(--u)*6.4); font-weight: 800; letter-spacing: .06em;
  margin: 0; line-height: 1.1;
}
#title .big span{ display: inline-block; animation: floatY 2.6s ease-in-out infinite; }
#title .big span:nth-child(2){ animation-delay: .12s }
#title .big span:nth-child(3){ animation-delay: .24s }
#title .big span:nth-child(4){ animation-delay: .36s }
#title .big span:nth-child(5){ animation-delay: .48s }
#title .big span:nth-child(6){ animation-delay: .60s }
#title .tag{ font-size: calc(var(--u)*1.7); color: var(--ink-soft); }
#title .mascot{ width: calc(var(--u)*16); height: calc(var(--u)*16); }
#title .btn-accent{ font-size: calc(var(--u)*2.6); padding: calc(var(--u)*1.1) calc(var(--u)*3.4); }
#title .foot{ font-size: calc(var(--u)*1.15); color: var(--ink-soft); }

/* ===========================================================
   TEN FRAME  (十のわく)
   =========================================================== */
.frameset{ display: flex; align-items: center; gap: calc(var(--u)*1.2); flex-wrap: wrap; justify-content: center; }
.tenframe{
  display: grid;
  grid-template-columns: repeat(var(--cols, 5), 1fr);
  gap: calc(var(--u)*.3);
  background: var(--card);
  border: calc(var(--u)*.3) solid var(--ink);
  border-radius: calc(var(--u)*.7);
  padding: calc(var(--u)*.3);
  box-shadow: var(--shadow-sm);
}
.cell{
  width: calc(var(--u)*4.6); height: calc(var(--u)*4.6);
  border-radius: calc(var(--u)*.4);
  background: var(--paper-2);
  display: flex; align-items: center; justify-content: center;
  transition: background .2s;
}
.cell.tappable{ cursor: pointer; box-shadow: inset 0 0 0 calc(var(--u)*.24) color-mix(in srgb, var(--accent) 70%, transparent); }
.cell.tappable:active{ transform: scale(.93); }
.dot{
  width: 74%; height: 74%; border-radius: 50%;
  background: var(--dc, var(--c-blue));
  box-shadow: inset 0 calc(var(--u)*-.25) 0 rgba(0,0,0,.12);
  animation: pop .3s cubic-bezier(.2,.9,.3,1.6);
}
.dot.b{ --dc: var(--c-red); }
.cell.hole{ background: var(--paper-2); box-shadow: inset 0 0 0 calc(var(--u)*.22) var(--card-edge); }
.cell.q{ background: var(--accent); }
.cell.q::after{ content:"?"; font-family: var(--fs-num); font-weight:800; color: var(--on-crayon); font-size: calc(var(--u)*2.6); }

/* number bond house (いくつと いくつ) */
.bond{
  display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*.5);
}
.bond .whole{
  font-family: var(--fs-num); font-weight: 800; font-size: calc(var(--u)*4.4);
  width: calc(var(--u)*8); height: calc(var(--u)*8);
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--c-purple); color: var(--on-crayon);
  box-shadow: var(--shadow);
}
.bond .legs{ width: calc(var(--u)*22); height: calc(var(--u)*3); }
.bond .parts{ display: flex; gap: calc(var(--u)*2.4); }
.bond .part{
  min-width: calc(var(--u)*8); min-height: calc(var(--u)*8);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--fs-num); font-weight: 800; font-size: calc(var(--u)*4);
  border-radius: var(--wob-b);
  background: var(--card);
  border: calc(var(--u)*.3) solid var(--card-edge);
  box-shadow: var(--shadow-sm);
}
.bond .part.known{ background: var(--c-blue); color: var(--on-crayon); border-color: var(--c-blue); }
.bond .part.unknown{ background: var(--accent); color: var(--on-crayon); border-color: var(--accent); animation: floatY 1.6s ease-in-out infinite; }

/* ===========================================================
   EQUATION strip  (しき)
   =========================================================== */
.eq{
  display: flex; align-items: center; justify-content: center;
  gap: calc(var(--u)*.7);
  font-family: var(--fs-num); font-weight: 800;
  font-size: calc(var(--u)*4.6);
  color: var(--ink);
}
.eq .box{
  min-width: calc(var(--u)*6.4); height: calc(var(--u)*6.4);
  display: inline-flex; align-items: center; justify-content: center;
  border: calc(var(--u)*.3) dashed var(--accent);
  border-radius: calc(var(--u)*.9);
  color: var(--accent);
}
.eq .box.filled{ border-style: solid; background: var(--good); border-color: var(--good); color: var(--on-crayon); }
.eq .op{ color: var(--c-red); }

/* ===========================================================
   STORY SCENE (たしざん / ひきざん)
   =========================================================== */
.scene{
  position: relative;
  width: min(100%, calc(var(--u)*54));
  height: calc(var(--u)*22);
  background: var(--card);
  border: calc(var(--u)*.26) solid var(--card-edge);
  border-radius: var(--wob-a);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.scene .ground{
  position: absolute; left:0; right:0; bottom:0; height: 58%;
  background: color-mix(in srgb, var(--c-green) 22%, var(--card));
}
.scene .pond{
  position: absolute; left:0; right:0; bottom:0; height: 58%;
  background: color-mix(in srgb, var(--c-blue) 26%, var(--card));
}
.actor{
  position: absolute;
  font-size: calc(var(--u)*3.8); line-height: 1;
  transform: translate(-50%,-50%);
  transition: transform .7s cubic-bezier(.3,.8,.4,1), opacity .5s;
  will-change: transform, opacity;
}
.actor.leaving{ opacity: 0; }

/* ===========================================================
   DRAG & BINS (なかまわけ)
   =========================================================== */
.bins{ display: flex; gap: calc(var(--u)*1.2); justify-content: center; flex-wrap: wrap; }
.bin{
  min-width: calc(var(--u)*17); min-height: calc(var(--u)*15);
  border: calc(var(--u)*.32) dashed var(--bc, var(--card-edge));
  border-radius: var(--wob-a);
  background: color-mix(in srgb, var(--bc, var(--card-edge)) 12%, var(--card));
  padding: calc(var(--u)*.6);
  display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*.3);
  transition: transform .16s, background .2s, border-color .2s;
}
.bin .lbl{ font-size: calc(var(--u)*1.6); font-weight: 800; color: var(--bc); }
.bin .hold{ display: flex; flex-wrap: wrap; gap: calc(var(--u)*.3); justify-content: center; align-content: flex-start; flex: 1 1 auto; }
.bin .hold .item{ font-size: calc(var(--u)*2.8); animation: pop .3s cubic-bezier(.2,.9,.3,1.6); }
.bin.over{ transform: scale(1.05); background: color-mix(in srgb, var(--bc) 26%, var(--card)); border-style: solid; }
.bin.nope{ animation: shake .4s; }

.tray{
  display: flex; flex-wrap: wrap; gap: calc(var(--u)*.7); justify-content: center;
  min-height: calc(var(--u)*7);
  align-items: center;
}
.tile{
  font-size: calc(var(--u)*3.8); line-height: 1;
  padding: calc(var(--u)*.45);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: var(--wob-b);
  box-shadow: var(--shadow-sm);
  cursor: grab;
  touch-action: none;
  transition: transform .14s, box-shadow .14s, opacity .3s;
}
.tile.sel{ border-color: var(--accent); box-shadow: 0 0 0 calc(var(--u)*.28) color-mix(in srgb, var(--accent) 45%, transparent), var(--shadow-sm); transform: translateY(calc(var(--u)*-.4)); }
.tile.dragging{ opacity: .25; }
.tile.gone{ opacity: 0; transform: scale(.4); pointer-events: none; }
#ghost{
  position: fixed; z-index: 100; pointer-events: none;
  transform: translate(-50%,-50%) scale(1.2) rotate(-4deg);
  filter: drop-shadow(0 .3em .5em rgba(0,0,0,.3));
}

/* ===========================================================
   PATTERN TRAIN
   =========================================================== */
.train{
  display: flex; align-items: center; gap: calc(var(--u)*.4);
  flex-wrap: nowrap; justify-content: center;   /* a pattern must read as one line */
  max-width: 100%; overflow-x: auto; padding: calc(var(--u)*.3);
  scrollbar-width: none;
}
.train::-webkit-scrollbar{ display: none; }
.car{
  flex: 0 0 auto;
  width: calc(var(--u)*6); height: calc(var(--u)*6);
  display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--u)*3.2);
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-b);
  box-shadow: var(--shadow-sm);
}
.car.blank{
  border-style: dashed; border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, var(--card));
  animation: floatY 1.8s ease-in-out infinite;
}
.car.blank::after{ content:"?"; font-family: var(--fs-num); font-weight: 800; color: var(--accent); }
.car.filled{ border-color: var(--good); }
.car.filled::after{ content: none; }

/* ===========================================================
   ORDINAL LINE (なんばんめ)
   =========================================================== */
.queue{
  display: flex; align-items: flex-end; gap: calc(var(--u)*1);
  flex-wrap: nowrap; overflow-x: auto; max-width: 100%;
  padding: calc(var(--u)*.6);
  scrollbar-width: none;
}
.queue::-webkit-scrollbar{ display: none; }
.qi{
  flex: 0 0 auto;
  width: calc(var(--u)*7); height: calc(var(--u)*8);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  font-size: calc(var(--u)*4);
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-b);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .14s cubic-bezier(.2,.9,.3,1.4), border-color .2s, background .2s;
}
.qi:active{ transform: translateY(.15em) scale(.97); }
.qi.correct{ border-color: var(--good); background: var(--good-soft); animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
.qi.wrong{ border-color: var(--oops); background: var(--oops-soft); animation: shake .4s; }
.qi.marked{ border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--card)); }
.dirmark{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: calc(var(--u)*.3);
  font-size: calc(var(--u)*1.5); font-weight: 800; color: var(--c-red);
  white-space: nowrap;
}
.dirmark svg{ width: calc(var(--u)*3); height: calc(var(--u)*1.6); }

/* grid variant */
.qgrid{
  display: grid; gap: calc(var(--u)*.5);
  grid-template-columns: repeat(var(--gc,4), calc(var(--u)*6.4));
}
.qgrid .qi{ width: auto; height: calc(var(--u)*6.4); font-size: calc(var(--u)*3.2); justify-content: center; }

/* ===========================================================
   NUMBER LINE
   =========================================================== */
.numline{
  display: flex; align-items: center; gap: calc(var(--u)*.35);
  flex-wrap: wrap; justify-content: center;
  max-width: 100%;
}
.nn{
  width: calc(var(--u)*5); height: calc(var(--u)*5.4);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--fs-num); font-weight: 800; font-size: calc(var(--u)*2.6);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: calc(var(--u)*.8);
  box-shadow: var(--shadow-sm);
}
.nn.gap{
  border-style: dashed; border-color: var(--accent);
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, var(--card));
}
.nn.gap.now{ animation: floatY 1.5s ease-in-out infinite; box-shadow: 0 0 0 calc(var(--u)*.26) color-mix(in srgb,var(--accent) 40%, transparent); }
.nn.gap.filled{ border-style: solid; border-color: var(--good); background: var(--good-soft); color: var(--ink); }

/* ===========================================================
   CLOCK
   =========================================================== */
.clockwrap{ display:flex; gap: calc(var(--u)*1.4); align-items:center; flex-wrap: wrap; justify-content: center; }
.clock{ width: calc(var(--u)*22); height: calc(var(--u)*22); touch-action: none; }
.clock.pickable{ cursor: pointer; }
.clock-choice{
  padding: calc(var(--u)*.4);
  background: var(--card);
  border: calc(var(--u)*.26) solid var(--card-edge);
  border-radius: var(--wob-a);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .14s, border-color .2s, background .2s;
}
.clock-choice .clock{ width: calc(var(--u)*13); height: calc(var(--u)*13); }
.clock-choice:active{ transform: scale(.96); }
.clock-choice.correct{ border-color: var(--good); background: var(--good-soft); animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
.clock-choice.wrong{ border-color: var(--oops); background: var(--oops-soft); animation: shake .4s; }

/* ===========================================================
   TRACING (すうじを なぞろう)
   =========================================================== */
.tracebox{
  position: relative;
  width: calc(var(--u)*30); height: calc(var(--u)*30);
  max-width: 100%;
  background: var(--card);
  border: calc(var(--u)*.26) solid var(--card-edge);
  border-radius: var(--wob-a);
  box-shadow: var(--shadow-sm);
  touch-action: none;
  overflow: hidden;
}
.tracebox svg{ position: absolute; inset: 0; width: 100%; height: 100%; }
.trace-guide{ stroke: var(--trace-guide); }
.trace-outline{ stroke: var(--ink-faint); stroke-dasharray: 2 5; }
.trace-done{ stroke: var(--c-blue); }
.trace-live{ stroke: var(--accent); }
.trace-start{ fill: var(--c-red); }
.trace-start.pulse{ animation: startPulse 1.2s ease-in-out infinite; transform-origin: center; }
@keyframes startPulse{ 0%,100%{ opacity: 1 } 50%{ opacity: .35 } }
.trace-numlabel{
  position: absolute; top: calc(var(--u)*.4); left: calc(var(--u)*.8);
  font-family: var(--fs-num); font-weight: 800;
  font-size: calc(var(--u)*1.6); color: var(--ink-soft);
}

/* ===========================================================
   MEASUREMENT (おおきさくらべ)
   =========================================================== */
.measure{ display:flex; flex-direction: column; gap: calc(var(--u)*1); align-items: stretch; width: min(100%, calc(var(--u)*52)); }
.mrow{
  display: flex; align-items: center; gap: calc(var(--u)*.8);
  padding: calc(var(--u)*.5) calc(var(--u)*.8);
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-b);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform .14s, border-color .2s, background .2s;
}
.mrow:active{ transform: scale(.985); }
.mrow.correct{ border-color: var(--good); background: var(--good-soft); animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
.mrow.wrong{ border-color: var(--oops); background: var(--oops-soft); animation: shake .4s; }
.mrow.picked{ border-color: var(--accent); }
.mrow .cap{ font-size: calc(var(--u)*2.4); flex: 0 0 auto; }
.mrow .track{ flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }
.mrow .track .gap{ flex: 0 0 auto; }
.mrow .stickbar{
  flex: 0 0 auto;
  height: calc(var(--u)*2.4); border-radius: 999px;
  background: var(--mc, var(--c-orange));
  box-shadow: inset 0 calc(var(--u)*-.3) 0 rgba(0,0,0,.12);
}
.mrow .ordno{
  font-family: var(--fs-num); font-weight: 800; font-size: calc(var(--u)*1.8);
  width: calc(var(--u)*3); height: calc(var(--u)*3); flex: 0 0 auto;
  border-radius: 50%; background: var(--accent); color: var(--on-crayon);
  display: flex; align-items: center; justify-content: center;
}
.vessels{ display: flex; gap: calc(var(--u)*1.6); align-items: flex-end; justify-content: center; }
.vessel{
  display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*.4);
  cursor: pointer;
  padding: calc(var(--u)*.5);
  border: calc(var(--u)*.26) solid transparent;
  border-radius: var(--wob-b);
  transition: transform .14s, border-color .2s, background .2s;
}
.vessel:active{ transform: scale(.97); }
.vessel.correct{ border-color: var(--good); background: var(--good-soft); }
.vessel.wrong{ border-color: var(--oops); background: var(--oops-soft); animation: shake .4s; }
.vessel svg{ display: block; }

/* ===========================================================
   SHAPE PUZZLE
   =========================================================== */
.shapefield{
  position: relative;
  width: min(100%, calc(var(--u)*36));
  height: calc(var(--u)*28.8);
  background: var(--card);
  border: calc(var(--u)*.26) solid var(--card-edge);
  border-radius: var(--wob-a);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  touch-action: none;
}
.shapefield svg{ position: absolute; inset: 0; width: 100%; height: 100%; }
.shapes-tray{ display: flex; gap: calc(var(--u)*.8); flex-wrap: wrap; justify-content: center; }
.shapetile{
  width: calc(var(--u)*7.6); height: calc(var(--u)*7.6);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: var(--wob-b);
  box-shadow: var(--shadow-sm);
  cursor: pointer; touch-action: none;
  display: flex; align-items: center; justify-content: center;
  transition: transform .14s, opacity .3s, box-shadow .14s;
}
.shapetile.sel{ border-color: var(--accent); box-shadow: 0 0 0 calc(var(--u)*.26) color-mix(in srgb,var(--accent) 45%, transparent); transform: translateY(calc(var(--u)*-.4)); }
.shapetile.used{ opacity: .18; pointer-events: none; }
.shapetile svg{ width: 84%; height: 84%; }

.shapegrid{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: calc(var(--u)*1.1);
  width: min(100%, calc(var(--u)*46));
}
.shapebtn{
  aspect-ratio: 1;
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-b);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  padding: calc(var(--u)*.5);
  transition: transform .14s, border-color .2s, background .2s;
}
.shapebtn:active{ transform: scale(.95); }
.shapebtn svg{ width: 100%; height: 100%; }
.shapebtn.correct{ border-color: var(--good); background: var(--good-soft); animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
.shapebtn.wrong{ border-color: var(--oops); background: var(--oops-soft); animation: shake .4s; }
.shapebtn.picked{ border-color: var(--accent); background: color-mix(in srgb,var(--accent) 14%, var(--card)); }

/* ===========================================================
   MISC
   =========================================================== */
.hintline{
  font-size: calc(var(--u)*1.35);
  color: var(--ink-soft);
  background: var(--paper-2);
  border-radius: 999px;
  padding: calc(var(--u)*.3) calc(var(--u)*1.1);
  animation: pop .35s cubic-bezier(.2,.9,.3,1.5);
}
.sr{ position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* ===========================================================
   Feedback, hints and the widgets added after review
   =========================================================== */

/* A wrong answer must be visible, not only audible: plenty of iPads have no
   Japanese voice installed, and those children were getting nothing at all. */
.prompt .txtwrap{ flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u)*.25); }
.feedback{
  align-self: flex-start;
  display: inline-flex; align-items: center; gap: calc(var(--u)*.4);
  font-size: calc(var(--u)*1.35); font-weight: 800;
  border-radius: 999px;
  padding: calc(var(--u)*.2) calc(var(--u)*.9);
}
.feedback .mk{ font-size: 1.15em; }
.feedback.oops{ background: var(--oops-soft); color: color-mix(in srgb, var(--oops) 55%, var(--ink)); }
.feedback.hint{ background: color-mix(in srgb, var(--accent) 18%, var(--card)); color: var(--accent-ink); }

/* a tried-and-wrong answer keeps a quiet mark, so the child can see what is ruled out */
.choice.tried{ border-color: var(--oops); }
.choice.tried::after{
  content: ""; position: absolute; inset: auto calc(var(--u)*.4) calc(var(--u)*.3) auto;
  width: calc(var(--u)*.7); height: calc(var(--u)*.7); border-radius: 50%;
  background: var(--oops);
}
.choice{ position: relative; }
.choice.glow, .bin.glow, .shapetile.glow{
  box-shadow: 0 0 0 calc(var(--u)*.32) color-mix(in srgb, var(--accent) 60%, transparent), var(--shadow);
}
polygon.glow{ stroke: var(--accent) !important; stroke-width: 2.6 !important; }

/* what is left over when the pairing runs out — the answer to every question in

/* ---- 20までの かず ---- */

/* a whole sentence as an answer button: it has to wrap, and it has to stay
   readable at three of them on one iPad */

  line-height: 1.5; text-align: left;

.world.newstage h3 .chip{ white-space: nowrap }

/* ---- a course you can see, and cannot open yet ----
   Not hidden: the four names behind the padlock are the reason to fill the shelf.
   Dimmed enough to read as "not yet", legible enough to read at all. */
.world.shut{ border-style: dashed }

}

#result .stagenext{

  grid-column: 1 / -1;
  width: 100%; margin-top: calc(var(--u)*1.2);

</style>
</head>
<body>
<div id="stage"></div>
<div id="fx" aria-hidden="true"></div>
<noscript><p style="padding:2rem;font-family:sans-serif">このアプリは JavaScript を使います。ブラウザの設定でオンにしてください。</p></noscript>
<script>
(function(){
/* ---- 00-util.js ---- */
/* ===========================================================
   00 — utilities
   =========================================================== */
'use strict';

const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

/** Tiny DOM builder. el('div.foo', {onclick}, child, 'text') */
function el(spec, props, ...kids){
  let tag = 'div', id = null, cls = [];
  const m = String(spec).match(/^([a-zA-Z0-9]*)((?:[.#][\w-]+)*)$/);
  if (m){
    if (m[1]) tag = m[1];
    (m[2].match(/[.#][\w-]+/g) || []).forEach(t => t[0] === '#' ? (id = t.slice(1)) : cls.push(t.slice(1)));
  } else tag = spec;
  const n = document.createElement(tag);
  if (id) n.id = id;
  if (cls.length) n.className = cls.join(' ');
  if (props) for (const k in props){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'style' && typeof v === 'object'){
      for (const prop in v){
        // custom properties (--x) must go through setProperty; Object.assign silently drops them
        if (prop.charCodeAt(0) === 45 && prop.charCodeAt(1) === 45) n.style.setProperty(prop, v[prop]);
        else n.style[prop] = v[prop];
      }
    }
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'dataset') Object.assign(n.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'class') n.className += (n.className ? ' ' : '') + v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(4)){
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
}

function svg(tag, attrs, ...kids){
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(4)) if (kid != null && kid !== false) n.append(kid);
  return n;
}

const clear = n => { while (n.firstChild) n.removeChild(n.firstChild); return n; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---- random ---- */
const ri     = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick   = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const sample = (arr, n) => shuffle(arr).slice(0, n);
const range  = (a, b) => { const o = []; for (let i = a; i <= b; i++) o.push(i); return o; };

/** distinct distractor numbers around `answer` inside [lo,hi] */
function distractors(answer, n, lo, hi, spread){
  const s = spread || 3, out = new Set();
  const near = shuffle(range(Math.max(lo, answer - s), Math.min(hi, answer + s)).filter(v => v !== answer));
  for (const v of near){ if (out.size >= n) break; out.add(v); }
  let guard = 0;
  while (out.size < n && guard++ < 200){ const v = ri(lo, hi); if (v !== answer) out.add(v); }
  return Array.from(out).slice(0, n);
}

/* ---- japanese number readings (for speech) ---- */
const KANA_ONES = ['ゼロ','いち','に','さん','よん','ご','ろく','なな','はち','きゅう'];
function numKana(n){
  n = Math.round(n);
  if (n < 0) return String(n);
  if (n < 10) return KANA_ONES[n];
  if (n === 10) return 'じゅう';
  if (n < 20) return 'じゅう' + KANA_ONES[n - 10];
  if (n < 100){
    const t = Math.floor(n / 10), o = n % 10;
    return KANA_ONES[t] + 'じゅう' + (o ? KANA_ONES[o] : '');
  }
  return String(n);
}
const KO = ['ゼロこ','いっこ','にこ','さんこ','よんこ','ごこ','ろっこ','ななこ','はっこ','きゅうこ','じゅっこ'];
const koKana    = n => (n >= 0 && n <= 10) ? KO[n] : numKana(n) + 'こ';
const TSU = ['ゼロ','ひとつ','ふたつ','みっつ','よっつ','いつつ','むっつ','ななつ','やっつ','ここのつ','とお'];
const tsuKana   = n => (n >= 1 && n <= 10) ? TSU[n] : numKana(n) + 'こ';
const banmeKana = n => numKana(n) + 'ばんめ';
/* Clock hours have their own readings and they are NOT the counting readings. */
const JI = ['','いちじ','にじ','さんじ','よじ','ごじ','ろくじ','しちじ','はちじ','くじ','じゅうじ','じゅういちじ','じゅうにじ'];
const jiKana = (h, half) => (JI[h] || numKana(h) + 'じ') + (half ? 'はん' : '');

/** hiragana display text; digits get the numeral face via <b> */
const numTag = n => `<b>${n}</b>`;

/** Make a node behave like a button for both finger and keyboard. */
function tappable(node, fn){
  node.setAttribute('role', 'button');
  node.dataset.tap = '1';
  if (!node.hasAttribute('tabindex')) node.setAttribute('tabindex', '0');
  node.addEventListener('click', fn);
  node.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(e); }
  });
  return node;
}

/** Rejection sampling with a hard stop: a tightened range must never hang the iPad. */
function until(tryOnce, limit){
  for (let i = 0; i < (limit || 400); i++){ const v = tryOnce(); if (v !== undefined) return v; }
  return undefined;
}

/* ---- geometry ---- */
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

/** Poisson-ish scatter: n points in [0..1]^2 with a minimum separation. */
function scatter(n, minD, tries){
  const pts = [], T = tries || 40;
  const md = minD != null ? minD : Math.min(.34, 0.86 / Math.sqrt(n + 1));
  for (let i = 0; i < n; i++){
    let best = null, bestScore = -1;
    for (let t = 0; t < T; t++){
      const p = [0.10 + Math.random() * 0.80, 0.12 + Math.random() * 0.76];
      let d = 9;
      for (const q of pts) d = Math.min(d, dist(p[0], p[1], q[0], q[1]));
      if (d > bestScore){ bestScore = d; best = p; }
      if (d > md) break;
    }
    pts.push(best);
  }
  return pts;
}

/** points evenly on a horizontal line (for level-1 counting) */
function lineup(n, y){
  const pts = [], yy = y == null ? .5 : y;
  for (let i = 0; i < n; i++) pts.push([0.12 + (0.76 * (n === 1 ? .5 : i / (n - 1))), yy]);
  return pts;
}

/* ---- 01-audio.js ---- */
/* ===========================================================
   01 — sound & speech
   All effects are synthesised: nothing to download, works offline.
   =========================================================== */
'use strict';

const Sound = (() => {
  let ctx = null, master = null;
  let sfxOn = true, voiceOn = true;
  let jaVoice = null, jaVoices = [], voicesReady = false;
  let prefVoice = null;

  function ensure(){
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try{
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.28;
      master.connect(ctx.destination);
    }catch(e){ ctx = null; }
    return ctx;
  }

  /** Must run inside a user gesture (iOS). */
  function unlock(){
    const c = ensure();
    if (c && c.state === 'suspended') c.resume().catch(() => {});
    // prime the speech engine with an empty-ish utterance
    if (window.speechSynthesis){
      try{
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0; u.lang = 'ja-JP';
        speechSynthesis.speak(u);
      }catch(e){}
      loadVoices();
    }
  }

  function tone(freq, t0, dur, type, gain, glideTo){
    const c = ensure(); if (!c || !sfxOn) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain == null ? .5 : gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + .02);
  }

  function seq(notes, type, step, gain){
    const c = ensure(); if (!c || !sfxOn) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    const t0 = c.currentTime + .01, st = step || .09;
    notes.forEach((f, i) => tone(f, t0 + i * st, st * 1.9, type || 'triangle', gain));
  }

  function noiseBurst(dur, gain){
    const c = ensure(); if (!c || !sfxOn) return;
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = .8;
    const g = c.createGain(); g.gain.value = gain == null ? .25 : gain;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  const PENT = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5, 1568, 1760, 2093];

  const S = {
    tap()      { seq([720], 'sine', .05, .35); },
    place()    { seq([420, 620], 'sine', .05, .4); },
    count(i)   { seq([PENT[Math.min(i, PENT.length - 1)]], 'triangle', .07, .42); },
    correct()  { seq([659.25, 830.61, 987.77, 1318.5], 'triangle', .075, .45); },
    wrong()    { seq([311.13, 261.63], 'sine', .13, .32); },
    star(i)    { seq([1046.5 + i * 180, 1568 + i * 200, 2093 + i * 240], 'triangle', .07, .3); noiseBurst(.25, .12); },
    finish()   { seq([523.25, 659.25, 783.99, 1046.5, 1318.5, 1046.5, 1318.5], 'triangle', .1, .42); },
    unlockSfx(){ seq([523.25, 783.99], 'triangle', .1, .35); },
    swoosh()   { noiseBurst(.18, .1); }
  };

  /* ---------- speech ----------
     How natural this sounds is decided by which voice the device has installed,
     not by anything we do here: the bundled "compact" Kyoko is the flat, robotic
     one, while the enhanced / premium download (設定 → アクセシビリティ →
     読み上げコンテンツ → 声) and the Siri voices sound like a person reading.
     So rank the candidates instead of taking the first ja voice, and let the
     parent page override the pick for the device actually in their hands. */
  const VOICE_RANK = [
    [/siri/i,                                     60],
    [/premium|プレミアム/i,                        50],
    [/enhanced|拡張|高品質/i,                       40],
    // Apple's current voice family (Ventura / iOS 16 onward) shares the engine
    // behind Siri, so it phrases a sentence instead of reciting it — it beats the
    // old compact Kyoko even though Kyoko is the name everyone recognises.
    [/^(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\b/i, 30],
    [/^(sandy|flo)\b/i,                            4],  // warmest of that family for a 5-year-old
    [/neural|natural|wavenet|google|microsoft/i,   25],
    [/kyoko|o-?ren|nanami|ayumi|haruka|mizuki/i,   10],
    [/otoya|hattori|ichiro|keita/i,                 5]
  ];
  function voiceScore(v){
    const n = (v.name || '') + ' ' + (v.voiceURI || '');
    let s = v.localService ? 8 : 0;   // offline-first, but never over a much better voice
    for (const [re, w] of VOICE_RANK) if (re.test(n)) s += w;
    return s;
  }

  function loadVoices(){
    if (!window.speechSynthesis) return;
    const vs = speechSynthesis.getVoices();
    if (!vs || !vs.length) return;
    voicesReady = true;
    jaVoices = vs.filter(v => /^ja(-|_|$)/i.test(v.lang || ''))
                 .sort((a, b) => voiceScore(b) - voiceScore(a));
    jaVoice = (prefVoice && jaVoices.find(v => v.voiceURI === prefVoice || v.name === prefVoice))
           || jaVoices[0] || null;
  }
  if (window.speechSynthesis){
    loadVoices();
    speechSynthesis.addEventListener('voiceschanged', loadVoices);
  }

  /** iOS may populate voices asynchronously after the first user gesture. */
  function probeVoice(timeout){
    if (!voiceOn || !window.speechSynthesis) return Promise.resolve(false);
    loadVoices();
    if (jaVoice) return Promise.resolve(true);
    return new Promise(resolve => {
      let done = false;
      const finish = ok => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try{ speechSynthesis.removeEventListener('voiceschanged', changed); }catch(e){}
        resolve(!!ok);
      };
      const changed = () => { loadVoices(); if (jaVoice) finish(true); };
      const timer = setTimeout(() => { loadVoices(); finish(!!jaVoice); },
        timeout == null ? 1200 : timeout);
      try{ speechSynthesis.addEventListener('voiceschanged', changed); }catch(e){}
    });
  }

  /* Japanese TTS decides its phrasing and pitch accent by parsing the sentence,
     and a space inside a sentence breaks that parse — the reason the same line
     can come out either flat or lively. The prompts are written with kanji and
     punctuation for the engine's benefit; this strips any stray spacing left
     between Japanese characters. */
  const JA = /[\u3000-\u30FF\u3400-\u9FFF\uFF00-\uFF9F]/;
  function forSpeech(text){
    return String(text)
      .replace(/[ \u3000]+/g, ' ')
      .replace(/(.) (?=(.))/g, (m, a, b) => JA.test(a) && JA.test(b) ? a : m)
      .trim();
  }

  let speakTimer = null;
  function say(text, opts){
    if (!voiceOn || !text || !window.speechSynthesis) return;
    const o = opts || {};
    clearTimeout(speakTimer);
    const go = () => {
      try{
        if (!voicesReady) loadVoices();
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(forSpeech(text));
        u.lang  = 'ja-JP';
        if (jaVoice) u.voice = jaVoice;
        // 1.0 is the voice's own recorded prosody; pushing rate or pitch away
        // from it is what made this sound synthetic. Only nudge, never shove.
        u.rate   = o.rate   == null ? 0.95 : o.rate;
        u.pitch  = o.pitch  == null ? 1 : o.pitch;
        u.volume = o.volume == null ? 1 : o.volume;
        speechSynthesis.speak(u);
      }catch(e){}
    };
    // a beat of delay lets the sfx land first and avoids iOS cancel/speak races
    speakTimer = setTimeout(go, o.delay == null ? 90 : o.delay);
  }
  function hush(){
    clearTimeout(speakTimer);
    try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){}
  }

  return {
    sfx: S, unlock, say, hush, probeVoice,
    get sfxOn(){ return sfxOn; },  set sfxOn(v){ sfxOn = !!v; },
    get voiceOn(){ return voiceOn; }, set voiceOn(v){ voiceOn = !!v; if (!v) hush(); },
    get hasVoice(){ return !!jaVoice; },
    /** The parent page lists these so a device with a better voice installed can use it. */
    get voices(){ if (!voicesReady) loadVoices(); return jaVoices.slice(); },
    get voiceId(){ return jaVoice ? jaVoice.voiceURI : null; },
    set voiceId(id){ prefVoice = id || null; loadVoices(); }
  };
})();

/* ---- 02-store.js ---- */
/* ===========================================================
   02 — progress storage (per-device, localStorage; degrades to memory)
   =========================================================== */
'use strict';

/* What「考えずに言える」means in milliseconds for the number facts in けいさんの やま.
   Under FAST the answer arrived; over SLOW it was worked out — almost always by
   counting. Between the two it is on its way. These are deliberately generous:
   the point is to tell retrieval from counting, not to run a race. */
const FLUENT_FAST_MS = 3000, FLUENT_SLOW_MS = 9000;

const Store = (() => {
  const KEY = 'kazu-no-bouken.v1';
  const blank = () => ({
    stars: {},        // "gameId:levelIndex" -> 0..3
    plays: {},        // "gameId:levelIndex" -> attempts
    seen:  {},        // gameId -> total questions answered
    firstTry: {},     // gameId -> [correctFirstTry, total] (lifetime)
    /* Per-game aggregates can only ever say "this game is shaky". These two say
       *what* is shaky and *when* — which is what lets the app come back to the
       exact fact the child missed, and lets the parent page name it. */
    facts: {},        // item key -> [asked, firstTryRight, lastDayNumber, label, "gameId:levelIndex", typicalMs]
    recent: {},       // "gameId:levelIndex" -> last 30 first-try outcomes, "1011…"
    last:  {},        // "gameId:levelIndex" -> day number last played
    swift: {},        // "gameId:levelIndex" -> 1 when cleared without counting
    stickers: [],     // earned sticker keys
    daily: {},        // "YYYY-MM-DD" -> questions done
    practice: [0, 0],   // [firstTryRight, total] across きょうの れんしゅう
    diagnostic: null, // { completedDay, outcomes, recommended }
    missions: {},     // "YYYY-MM-DD" -> { id, gameId, text, prompt, done, reviewed }
    name: '',
    sfx: true, voice: true, voiceId: null,
    /* The 小1 world opens by itself when every sticker is on the shelf. This flag is
       the parent's override: a child who is ready but cannot get ★★★ on とけい must
       not be held behind a padlock they cannot move — the same reason a level opens
       after three honest attempts. Once true it stays true. */
    g1Open: false,
    createdAt: Date.now()
  });

  let mem = blank(), ok = true;

  try{
    const raw = localStorage.getItem(KEY);
    if (raw) mem = Object.assign(blank(), JSON.parse(raw));
  }catch(e){ ok = false; }

  let pending = null;
  function writeNow(){
    if (!ok) return;
    clearTimeout(pending); pending = null;
    try{ localStorage.setItem(KEY, JSON.stringify(mem)); }
    catch(e){ ok = false; }          // quota, private mode, or a file:// origin
  }
  function save(){
    if (!ok) return;
    clearTimeout(pending);
    pending = setTimeout(writeNow, 120);
  }
  // the app is usually closed straight after finishing a level; don't lose that write
  addEventListener('pagehide', writeNow);
  addEventListener('visibilitychange', () => { if (document.hidden) writeNow(); });

  const key = (g, l) => g + ':' + l;
  /* Whole-day resolution keeps six months of daily use small enough for
     localStorage, and days are the only unit the scheduling actually needs. */
  const DAY = 86400000;
  const dayNo = () => Math.floor(Date.now() / DAY);
  const todayKey = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  /* ---- backup ----------------------------------------------------------
     localStorage is scoped to one origin and one browser, so the same app on a
     different URL (or after clearing site data) starts empty. Export/import is
     the only thing that makes six months of records actually portable. */
  const FILE_TAG = 'kazu-no-bouken';

  function exportText(){
    return JSON.stringify({ app: FILE_TAG, v: 1, savedAt: new Date().toISOString(), data: mem }, null, 2);
  }

  const isRecord = v => !!v && typeof v === 'object' && !Array.isArray(v);
  const isCount = v => Number.isFinite(v) && v >= 0;
  const safeKey = k => k !== '__proto__' && k !== 'prototype' && k !== 'constructor';

  /** Validate into a fresh object before touching the live record. Older backups
      may omit newer fields, but a field that is present must have the shape the
      rest of Store expects. */
  function normalizeData(data){
    if (!isRecord(data)) return null;
    const out = blank();
    const copyMap = (name, valid) => {
      if (data[name] == null) return data[name] === undefined;
      if (!isRecord(data[name])) return false;
      const next = {};
      for (const k of Object.keys(data[name])){
        if (!safeKey(k) || !valid(data[name][k])) return false;
        next[k] = data[name][k];
      }
      out[name] = next;
      return true;
    };

    if (!copyMap('stars', v => isCount(v) && v <= 3)
     || !copyMap('plays', isCount)
     || !copyMap('seen', isCount)
     || !copyMap('daily', isCount)
     || !copyMap('last', isCount)
     || !copyMap('swift', v => v === 0 || v === 1)
     || !copyMap('recent', v => typeof v === 'string' && /^[01]{0,30}$/.test(v))
     || !copyMap('firstTry', v => Array.isArray(v) && v.length >= 2
          && isCount(v[0]) && isCount(v[1]) && v[0] <= v[1])
     || !copyMap('facts', v => Array.isArray(v) && v.length >= 3
          && isCount(v[0]) && isCount(v[1]) && v[1] <= v[0] && isCount(v[2])
          && (v[3] == null || typeof v[3] === 'string')
          && (v[4] == null || typeof v[4] === 'string')
          && (v[5] == null || isCount(v[5])))) return null;

    if (data.stickers !== undefined){
      if (!Array.isArray(data.stickers) || data.stickers.some(v => typeof v !== 'string')) return null;
      out.stickers = Array.from(new Set(data.stickers));
    }
    if (data.practice !== undefined){
      if (!Array.isArray(data.practice) || data.practice.length < 2
       || !isCount(data.practice[0]) || !isCount(data.practice[1])
       || data.practice[0] > data.practice[1]) return null;
      out.practice = data.practice.slice(0, 2);
    }
    if (data.diagnostic !== undefined && data.diagnostic !== null){
      const d = data.diagnostic;
      if (!isRecord(d) || !isCount(d.completedDay)
       || !Array.isArray(d.outcomes)
       || d.outcomes.some(x => !isRecord(x) || typeof x.gameId !== 'string'
          || !isCount(x.levelIndex) || typeof x.clean !== 'boolean')
       || (d.recommended != null && (!isRecord(d.recommended)
          || typeof d.recommended.gameId !== 'string'
          || !isCount(d.recommended.levelIndex)))) return null;
      out.diagnostic = {
        completedDay: d.completedDay,
        outcomes: d.outcomes.map(x => ({
          gameId: x.gameId, levelIndex: x.levelIndex, clean: x.clean
        })),
        recommended: d.recommended == null ? null : {
          gameId: d.recommended.gameId, levelIndex: d.recommended.levelIndex
        }
      };
    }
    if (data.missions !== undefined){
      if (!isRecord(data.missions)) return null;
      out.missions = {};
      for (const day of Object.keys(data.missions)){
        const m = data.missions[day];
        if (!safeKey(day) || !isRecord(m)
         || typeof m.day !== 'string' || typeof m.id !== 'string'
         || typeof m.gameId !== 'string' || typeof m.text !== 'string'
         || typeof m.prompt !== 'string'
         || (m.done !== undefined && typeof m.done !== 'boolean')
         || (m.reviewed !== undefined && typeof m.reviewed !== 'boolean')
         || (m.doneDay !== undefined && !isCount(m.doneDay))) return null;
        out.missions[day] = {
          day: m.day, id: m.id, gameId: m.gameId, text: m.text, prompt: m.prompt,
          done: !!m.done, reviewed: !!m.reviewed
        };
        if (m.doneDay !== undefined) out.missions[day].doneDay = m.doneDay;
      }
    }
    if (data.name !== undefined){
      if (typeof data.name !== 'string') return null;
      out.name = data.name;
    }
    for (const k of ['sfx', 'voice', 'g1Open']){
      if (data[k] !== undefined){
        if (typeof data[k] !== 'boolean') return null;
        out[k] = data[k];
      }
    }
    if (data.voiceId !== undefined){
      if (data.voiceId !== null && typeof data.voiceId !== 'string') return null;
      out.voiceId = data.voiceId;
    }
    if (data.createdAt !== undefined){
      if (!isCount(data.createdAt)) return null;
      out.createdAt = data.createdAt;
    }
    return out;
  }

  const maxNum = (a, b) => Math.max(a || 0, b || 0);
  function mergeInto(base, add){
    const out = Object.assign(blank(), base);
    ['stars', 'plays', 'seen', 'daily', 'swift'].forEach(k => {
      const src = add[k] || {};
      out[k] = Object.assign({}, base[k] || {});
      // max, never sum: importing the same backup twice must not inflate anything
      for (const id in src) out[k][id] = maxNum(out[k][id], src[id]);
    });
    out.firstTry = Object.assign({}, base.firstTry || {});
    const af = add.firstTry || {};
    for (const g in af){
      const cur = out.firstTry[g];
      if (!cur || (af[g][1] || 0) > (cur[1] || 0)) out.firstTry[g] = af[g].slice();
    }
    // facts: keep the record that has been practised more; never sum
    out.facts = Object.assign({}, base.facts || {});
    const af2 = add.facts || {};
    for (const k in af2){
      const cur = out.facts[k];
      if (!cur || (af2[k][0] || 0) > (cur[0] || 0)) out.facts[k] = af2[k].slice();
      else if (cur){
        cur[2] = maxNum(cur[2], af2[k][2]);
        if (!cur[4] && af2[k][4]) cur[4] = af2[k][4];   // keep whichever side knows where to ask it
      }
    }
    // recent / last: follow whichever side actually played that level more
    out.recent = Object.assign({}, base.recent || {});
    out.last   = Object.assign({}, base.last || {});
    for (const k in (add.recent || {})){
      if ((add.plays && add.plays[k] || 0) > (base.plays && base.plays[k] || 0)) out.recent[k] = add.recent[k];
    }
    for (const k in (add.last || {})) out.last[k] = maxNum(out.last[k], add.last[k]);
    out.stickers = Array.from(new Set((base.stickers || []).concat(add.stickers || [])));
    const bp = base.practice || [0, 0], ap = add.practice || [0, 0];
    out.practice = (ap[1] || 0) > (bp[1] || 0) ? ap.slice() : bp.slice();
    const bd = base.diagnostic, ad = add.diagnostic;
    out.diagnostic = !bd ? ad : !ad ? bd
      : ((ad.completedDay || 0) > (bd.completedDay || 0) ? ad : bd);
    out.missions = Object.assign({}, base.missions || {});
    for (const d in (add.missions || {})){
      const cur = out.missions[d], incoming = add.missions[d];
      if (!cur) out.missions[d] = Object.assign({}, incoming);
      else if (cur.id === incoming.id) out.missions[d] = Object.assign({}, cur, incoming, {
        done: !!(cur.done || incoming.done),
        reviewed: !!(cur.reviewed || incoming.reviewed)
      });
      else {
        // A catalog update can assign a different mission to the same date.
        // Keep one actual record intact; never transfer completion to other text.
        const score = m => (m.reviewed ? 4 : 0) + (m.done ? 2 : 0) + (m.doneDay || 0) / 1e9;
        out.missions[d] = Object.assign({}, score(incoming) > score(cur) ? incoming : cur);
      }
    }
    // a stage that has been opened on either device stays open
    out.g1Open = !!(base.g1Open || add.g1Open);
    out.createdAt = Math.min(base.createdAt || Date.now(), add.createdAt || Date.now());
    return out;
  }

  /** mode: 'merge' (default, never loses or inflates) or 'replace' */
  function importText(text, mode){
    if (typeof text !== 'string' || text.length > 2 * 1024 * 1024){
      return { ok: false, msg: 'ファイルが大きすぎるか、読み取れない形式です。' };
    }
    let parsed;
    try{ parsed = JSON.parse(text); }
    catch(e){ return { ok: false, msg: 'ファイルの中身を読み取れませんでした。' }; }
    const data = (parsed && parsed.app === FILE_TAG && parsed.data) ? parsed.data
               : (parsed && isRecord(parsed.stars)) ? parsed // a bare data object is fine too
               : null;
    const normalized = normalizeData(data);
    if (!normalized) return { ok: false, msg: '記録の形式がこわれているため、読み込みませんでした。' };
    const before = Object.keys(mem.stars || {}).length;
    const next = mode === 'replace' ? normalized : mergeInto(mem, normalized);
    mem = next;
    writeNow();
    const after = Object.keys(mem.stars || {}).length;
    return { ok: true, msg: `読み込みました（★のついたレベル ${before} → ${after}、シール ${mem.stickers.length} 枚）`,
             savedAt: parsed.savedAt || null };
  }

  /** How much this fact is owed a turn: 0 (fresh and solid) … ~2 (missed, or long unseen).
      A fact that has never been asked scores 1, so nothing is starved at the start. */
  function dueOf(k){
    const f = mem.facts[k];
    if (!f || !f[0]) return 1;
    const acc = f[1] / f[0];
    const age = Math.min(30, dayNo() - f[2]);
    /* Right but slow is not the same as known. Right-first-time cannot tell a child
       who remembers「10は4と6」from one who counted the six empty cells for nine
       seconds, and only the first of those makes a carry sum fast. */
    const slow = f[5] ? clamp((f[5] - FLUENT_FAST_MS) / (FLUENT_SLOW_MS - FLUENT_FAST_MS), 0, 1) : 0;
    return (1 - acc) * 1.6 + (age / 30) * 0.6 + (f[0] < 3 ? 0.25 : 0) + slow * 0.5;
  }

  /** The facts this child keeps missing, worst first.
      Only facts they have actually met and actually got wrong: 集中練習 is practice,
      not first contact, and one slip is not a gap. */
  function weakFacts(limit){
    const out = [];
    for (const k in mem.facts){
      const f = mem.facts[k];
      if (!f || !f[0] || !f[4]) continue;        // never asked, or nowhere to ask it again
      const missed = f[0] - f[1];
      // right every time but still being counted out: the case a percentage cannot show
      const slow = f[5] >= FLUENT_SLOW_MS;
      if (missed < 1 && !slow) continue;
      if (!slow && f[1] / f[0] >= 0.8 && missed < 2) continue;   // one slip on a solid fact
      out.push({ key: k, label: f[3] || k, at: f[4], due: dueOf(k), missed, ms: f[5] || null, slow });
    }
    out.sort((a, b) => b.due - a.due || b.missed - a.missed);
    return limit ? out.slice(0, limit) : out;
  }

  return {
    get data(){ return mem; },
    /** false when this device/origin cannot persist — the parent page says so. */
    get persists(){ return ok; },
    get origin(){ return location.origin === 'null' ? 'file://' : location.origin; },
    exportText, importText,
    todayKey,
    flush: writeNow,
    stars: (g, l) => mem.stars[key(g, l)] || 0,
    gameStars(g, levels){
      let s = 0; for (let i = 0; i < levels; i++) s += mem.stars[key(g, i)] || 0; return s;
    },
    totalStars(){ let s = 0; for (const k in mem.stars) s += mem.stars[k]; return s; },
    plays: (g, l) => mem.plays[key(g, l)] || 0,
    /* A pass opens the next level. Three honest attempts also open it: a five-year-old
       must never end up staring at a padlock they cannot move, and the parent page
       shows the low score either way. */
    levelUnlocked(g, l){
      if (l === 0) return true;
      const k = key(g, l - 1);
      return (mem.stars[k] || 0) >= 1 || (mem.plays[k] || 0) >= 3;
    },

    /** One question's first-try result, attributed to the level it came from.
        Recorded per question rather than per level so that a question met inside
        きょうの れんしゅう counts towards that level's recent form too. */
    noteOutcome(g, l, ok){
      const k = key(g, l);
      mem.recent[k] = ((mem.recent[k] || '') + (ok ? '1' : '0')).slice(-30);
      mem.last[k] = dayNo();
      save();
    },

    recordLevel(g, l, stars, right, total){
      const k = key(g, l);
      mem.stars[k] = Math.max(mem.stars[k] || 0, stars);
      mem.plays[k] = (mem.plays[k] || 0) + 1;
      mem.last[k]  = dayNo();
      mem.seen[g]  = (mem.seen[g] || 0) + total;
      const ft = mem.firstTry[g] || [0, 0];
      mem.firstTry[g] = [ft[0] + right, ft[1] + total];
      const t = todayKey();
      mem.daily[t] = (mem.daily[t] || 0) + total;
      save();
    },
    recordPractice(right, total){
      const t = todayKey();
      mem.daily[t] = (mem.daily[t] || 0) + total;
      const p = mem.practice || (mem.practice = [0, 0]);
      p[0] += right; p[1] += total;
      save();
    },
    /* 集中練習 counts towards today's total, but not towards the「きょうの れんしゅう」
       accuracy the parent page reports — that number names one specific set. */
    recordFocus(right, total){
      const t = todayKey();
      mem.daily[t] = (mem.daily[t] || 0) + total;
      save();
    },
    recordDiagnostic(outcomes, recommended){
      mem.diagnostic = {
        completedDay: dayNo(),
        outcomes: (outcomes || []).map(x => ({
          gameId: x.gameId, levelIndex: x.levelIndex || 0, clean: !!x.clean
        })),
        recommended: recommended || null
      };
      save();
    },
    recordMission(mission){
      if (!mission || !mission.day) return;
      mem.missions[mission.day] = Object.assign({}, mission, { done: false, reviewed: false });
      save();
    },
    completeMission(day){
      const m = mem.missions[day];
      if (!m) return false;
      m.done = true;
      m.doneDay = dayNo();
      save();
      return true;
    },
    reviewMission(day){
      const m = mem.missions[day];
      if (!m) return false;
      m.reviewed = true;
      save();
      return true;
    },
    mission: day => mem.missions[day] || null,
    practiceAccuracy(){
      const p = mem.practice;
      return (p && p[1]) ? p[0] / p[1] : null;
    },
    todayCount(){ return mem.daily[todayKey()] || 0; },
    streak(){
      let n = 0; const d = new Date();
      for (;;){
        const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        if ((mem.daily[k] || 0) > 0) n++; else break;
        d.setDate(d.getDate() - 1);
        if (n > 400) break;
      }
      return n;
    },
    accuracy(g){
      const ft = mem.firstTry[g];
      if (!ft || !ft[1]) return null;
      return ft[0] / ft[1];
    },

    /* ---- item-level memory ---- */
    noteFact(k, firstTryOk, label, from, ms){
      if (!k) return;
      const f = mem.facts[k] || (mem.facts[k] = [0, 0, 0]);
      f[0]++;
      if (firstTryOk) f[1]++;
      f[2] = dayNo();
      if (label) f[3] = label;      // so the parent page can say「3と7」, not「ten:3」
      /* Where this fact can be asked again. Without it the app can name a weak fact
         and still have no way to bring it back: the item key says which game, never
         which level. */
      if (from) f[4] = from;
      /* How long the answer took, kept only where speed is the goal and only for
         clean answers — a wrong answer times a guess. A single interrupted question
         (the iPad put down mid-problem) is clamped rather than dropped, so it cannot
         decide the average on its own. */
      if (ms > 0){
        const capped = Math.min(ms, 20000);
        f[5] = f[5] ? Math.round(f[5] * 0.65 + capped * 0.35) : capped;
      }
      save();
    },
    fact: k => mem.facts[k] || null,
    factOrigin(k){ const f = mem.facts[k]; return f && f[4] || null; },
    factSpeed(k){ const f = mem.facts[k]; return f && f[5] || null; },
    /** Typical time to answer this game's facts, in ms — null until something has
        been timed. Median across facts, so one bad question does not move it. */
    gameSpeed(g){
      const xs = [];
      for (const k in mem.facts){
        if (k.indexOf(g + ':') !== 0) continue;
        const f = mem.facts[k];
        if (f && f[5]) xs.push(f[5]);
      }
      if (!xs.length) return null;
      xs.sort((a, b) => a - b);
      return xs[Math.floor(xs.length / 2)];
    },
    /** Cleared with every answer right first time *and* without counting. */
    recordSwift(g, l){ mem.swift[key(g, l)] = 1; save(); },
    isSwift: (g, l) => !!mem.swift[key(g, l)],
    factDue: dueOf,
    weakFacts,

    /* ---- recent (windowed) performance ----
       A lifetime average cannot show that a child recovered, and it cannot show
       that a child has just started slipping. Both are what a parent needs. */
    recentAccuracy(g, l){
      const s = mem.recent[key(g, l)];
      if (!s) return null;
      let r = 0;
      for (let i = 0; i < s.length; i++) if (s[i] === '1') r++;
      return s.length ? r / s.length : null;
    },
    /** how many outcomes the recent window actually holds — a percentage over one
        question must never be presented as a judgement about a child */
    recentCount(g, l){ return (mem.recent[key(g, l)] || '').length; },
    gameRecentAccuracy(g, levels){
      let r = 0, n = 0;
      for (let i = 0; i < levels; i++){
        const s = mem.recent[key(g, i)] || '';
        for (let j = 0; j < s.length; j++){ n++; if (s[j] === '1') r++; }
      }
      return n ? r / n : null;
    },
    /** days since this level was last played; large when never played */
    daysSince(g, l){
      const d = mem.last[key(g, l)];
      return d ? Math.max(0, dayNo() - d) : 99;
    },
    addSticker(k){
      if (mem.stickers.indexOf(k) < 0){ mem.stickers.push(k); save(); return true; }
      return false;
    },
    hasSticker: k => mem.stickers.indexOf(k) >= 0,
    setPref(k, v){ mem[k] = v; save(); },
    reset(){ mem = blank(); save(); }
  };
})();

/* ---- 03-art.js ---- */
/* ===========================================================
   03 — artwork: mascot, stars, shapes, clock, numeral strokes
   =========================================================== */
'use strict';

/* ---------- star ---------- */
const STAR_D = 'M50 6 L62 36 L95 39 L70 61 L78 94 L50 76 L22 94 L30 61 L5 39 L38 36 Z';
function starSVG(on){
  return svg('svg', { viewBox: '0 0 100 100', 'aria-hidden': 'true', class: on ? 'on' : '' },
    svg('path', { d: STAR_D, fill: on ? 'var(--star)' : 'var(--card-edge)',
                  stroke: on ? 'var(--star-edge)' : 'transparent',
                  'stroke-width': 5, 'stroke-linejoin': 'round' }));
}

/* ---------- mascot: かずぴょん ---------- */
const FACES = {
  idle:  { eye: 'open',  mouth: 'M42 66 Q50 73 58 66' },
  happy: { eye: 'arc',   mouth: 'M38 62 Q50 78 62 62 Z' },
  cheer: { eye: 'arc',   mouth: 'M36 60 Q50 82 64 60 Z' },
  think: { eye: 'open',  mouth: 'M43 69 Q50 65 57 69' },
  soft:  { eye: 'open',  mouth: 'M43 70 Q50 64 57 70' }
};
function mascotSVG(mood, cls){
  const f = FACES[mood] || FACES.idle;
  const eye = (cx) => f.eye === 'arc'
    ? svg('path', { d: `M${cx - 7} 52 Q${cx} 44 ${cx + 7} 52`, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 4.5, 'stroke-linecap': 'round' })
    : svg('g', null,
        svg('circle', { cx, cy: 51, r: 6.4, fill: 'var(--ink)' }),
        svg('circle', { cx: cx + 2.2, cy: 48.6, r: 2.1, fill: '#fff' }));
  const ear = (x, rot) => svg('g', { transform: `rotate(${rot} ${x} 30)` },
    svg('rect', { x: x - 7, y: -2, width: 14, height: 36, rx: 7, fill: 'var(--c-yellow)', stroke: 'var(--ink)', 'stroke-width': 3.4 }),
    svg('rect', { x: x - 3.4, y: 4, width: 6.8, height: 24, rx: 3.4, fill: 'var(--c-pink)' }));
  return svg('svg', { viewBox: '0 0 100 100', class: 'mascot' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true' },
    ear(37, -12), ear(63, 12),
    svg('circle', { cx: 50, cy: 62, r: 31, fill: 'var(--c-yellow)', stroke: 'var(--ink)', 'stroke-width': 3.6 }),
    svg('ellipse', { cx: 33, cy: 68, rx: 6.4, ry: 4.2, fill: 'var(--c-pink)', opacity: .85 }),
    svg('ellipse', { cx: 67, cy: 68, rx: 6.4, ry: 4.2, fill: 'var(--c-pink)', opacity: .85 }),
    eye(38), eye(62),
    svg('path', { d: f.mouth, fill: f.mouth.endsWith('Z') ? 'var(--c-red)' : 'none',
                  stroke: 'var(--ink)', 'stroke-width': 3.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
}

/* ---------- arrows ---------- */
function arrowSVG(dir){
  const flip = dir === 'left' ? 'scale(-1,1) translate(-100,0)' : '';
  return svg('svg', { viewBox: '0 0 100 50', 'aria-hidden': 'true' },
    svg('g', { transform: flip },
      svg('path', { d: 'M4 25 H72 M56 8 L78 25 L56 42', fill: 'none', stroke: 'currentColor',
                    'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' })));
}

/* ---------- geometric shapes ---------- */
const SHAPES = {
  circle:    { ja: 'まる',     kind: 'circle',   pts: null },
  square:    { ja: 'しかく',   kind: 'square',   pts: [[10,10],[90,10],[90,90],[10,90]] },
  rect:      { ja: 'しかく',   kind: 'square',   pts: [[6,24],[94,24],[94,76],[6,76]] },
  tri:       { ja: 'さんかく', kind: 'triangle', pts: [[50,8],[92,88],[8,88]] },
  tri2:      { ja: 'さんかく', kind: 'triangle', pts: [[12,10],[92,52],[16,90]] },
  rtri:      { ja: 'さんかく', kind: 'triangle', pts: [[12,12],[12,88],[88,88]] },
  diamond:   { ja: 'ひしがた', kind: 'diamond',  pts: [[50,6],[94,50],[50,94],[6,50]] },
  oval:      { ja: 'まる',     kind: 'circle',   pts: null, rx: 46, ry: 30 },
  pentagon:  { ja: 'ごかっけい', kind: 'poly',   pts: [[50,6],[94,38],[77,90],[23,90],[6,38]] },
  hexagon:   { ja: 'ろっかっけい', kind: 'poly', pts: [[28,10],[72,10],[94,50],[72,90],[28,90],[6,50]] },
  trapezoid: { ja: 'だいけい', kind: 'poly',     pts: [[26,16],[74,16],[94,84],[6,84]] },
  star:      { ja: 'ほし',     kind: 'star',     pts: null },
  heart:     { ja: 'ハート',   kind: 'heart',    pts: null },
  semi:      { ja: 'はんえん', kind: 'semi',     pts: null }
};

function shapeSVG(name, color, rot, size){
  const s = SHAPES[name] || SHAPES.circle;
  const fill = color || 'var(--c-blue)';
  const stroke = 'color-mix(in srgb, ' + fill + ' 62%, var(--ink) 38%)';
  const common = { fill, stroke, 'stroke-width': 4, 'stroke-linejoin': 'round' };
  let node;
  if (name === 'circle')       node = svg('circle', Object.assign({ cx: 50, cy: 50, r: 42 }, common));
  else if (name === 'oval')    node = svg('ellipse', Object.assign({ cx: 50, cy: 50, rx: s.rx, ry: s.ry }, common));
  else if (name === 'star')    node = svg('path', Object.assign({ d: STAR_D }, common));
  else if (name === 'heart')   node = svg('path', Object.assign({ d: 'M50 90 C10 62 8 34 26 22 C38 14 50 22 50 34 C50 22 62 14 74 22 C92 34 90 62 50 90 Z' }, common));
  else if (name === 'semi')    node = svg('path', Object.assign({ d: 'M6 72 A44 44 0 0 1 94 72 Z' }, common));
  else node = svg('polygon', Object.assign({ points: s.pts.map(p => p.join(',')).join(' ') }, common));
  return svg('svg', { viewBox: '0 0 100 100', 'aria-hidden': 'true',
                      width: size || null, height: size || null,
                      style: rot ? `transform:rotate(${rot}deg)` : null }, node);
}

/* ---------- analogue clock ---------- */
function clockSVG(hour, minute, opts){
  const o = opts || {};
  const cx = 50, cy = 50, R = 45;
  const g = [
    svg('circle', { cx, cy, r: R, fill: 'var(--card)', stroke: 'var(--ink)', 'stroke-width': 3.4 }),
    svg('circle', { cx, cy, r: R - 4, fill: 'none', stroke: 'var(--card-edge)', 'stroke-width': 1.2 })
  ];
  for (let i = 0; i < 60; i++){
    const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
    const big = i % 5 === 0;
    const r1 = R - (big ? 8 : 4), r2 = R - 2.5;
    g.push(svg('line', {
      x1: cx + Math.cos(a) * r1, y1: cy + Math.sin(a) * r1,
      x2: cx + Math.cos(a) * r2, y2: cy + Math.sin(a) * r2,
      stroke: big ? 'var(--ink)' : 'var(--ink-faint)', 'stroke-width': big ? 2.6 : 1.1, 'stroke-linecap': 'round'
    }));
  }
  if (o.numerals !== false){
    for (let h = 1; h <= 12; h++){
      const a = (h / 12) * Math.PI * 2 - Math.PI / 2;
      g.push(svg('text', {
        x: cx + Math.cos(a) * (R - 15), y: cy + Math.sin(a) * (R - 15) + 4.4,
        'text-anchor': 'middle', fill: 'var(--ink)', 'font-size': 12, 'font-weight': 800,
        'font-family': 'var(--fs-num)'
      }, String(h)));
    }
  }
  const ma = (minute / 60) * Math.PI * 2 - Math.PI / 2;
  const ha = (((hour % 12) + minute / 60) / 12) * Math.PI * 2 - Math.PI / 2;
  g.push(svg('line', { x1: cx, y1: cy, x2: cx + Math.cos(ha) * 21, y2: cy + Math.sin(ha) * 21,
    stroke: 'var(--c-red)', 'stroke-width': 6.2, 'stroke-linecap': 'round', class: 'hand-h' }));
  g.push(svg('line', { x1: cx, y1: cy, x2: cx + Math.cos(ma) * 33, y2: cy + Math.sin(ma) * 33,
    stroke: 'var(--c-blue)', 'stroke-width': 4, 'stroke-linecap': 'round', class: 'hand-m' }));
  g.push(svg('circle', { cx, cy, r: 3.6, fill: 'var(--ink)' }));
  return svg('svg', { viewBox: '0 0 100 100', class: 'clock' + (o.cls ? ' ' + o.cls : ''), 'aria-hidden': 'true' }, g);
}

/* ---------- Catmull-Rom smoothing (used by numeral strokes) ---------- */
function smooth(ctrl, per){
  if (ctrl.length < 2) return ctrl.slice();
  const p = [ctrl[0]].concat(ctrl, [ctrl[ctrl.length - 1]]);
  const out = [], n = per || 14;
  for (let i = 1; i < p.length - 2; i++){
    const [p0, p1, p2, p3] = [p[i - 1], p[i], p[i + 1], p[i + 2]];
    for (let t = 0; t < n; t++){
      const s = t / n, s2 = s * s, s3 = s2 * s;
      out.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * s + (2*p0[0] - 5*p1[0] + 4*p2[0] - p3[0]) * s2 + (-p0[0] + 3*p1[0] - 3*p2[0] + p3[0]) * s3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * s + (2*p0[1] - 5*p1[1] + 4*p2[1] - p3[1]) * s2 + (-p0[1] + 3*p1[1] - 3*p2[1] + p3[1]) * s3)
      ]);
    }
  }
  out.push(ctrl[ctrl.length - 1]);
  return out;
}
const toPath = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');

/* ---------- numeral stroke data (0-9) in a 100 x 140 box ----------

  6: [[[72,20],[46,32],[28,62],[24,96],[38,120],[62,122],[76,104],[70,80],[46,74],[28,88]]],
