/* ============================================================
   7. おおきさ くらべ — length, capacity, ordering
   ============================================================ */
const MEAS_ICONS = ['✏️','🖍','🧵','🥕','🦴','🪵','🧹','🎋'];

/* one row = icon + a fixed-width track; the bar's width is a share of the track,
   so what the child sees is exactly proportional to the length being compared. */
function barRow(len, offset, color, cap){
  const track = el('div.track', null,
    offset ? el('div.gap', { style: { width: offset + '%' } }) : null,
    el('div.stickbar', { style: { width: len + '%', '--mc': color } }));
  return el('div.mrow', { role: 'button', tabindex: '0' }, el('div.cap', { text: cap }), track);
}

function lengthCompare(api, aligned){
  const n = ri(3, 4);
  const lens = [];
  for (let g = 0; g < 400 && lens.length < n; g++){
    const v = ri(24, 92);
    if (lens.every(x => Math.abs(x - v) >= 12)) lens.push(v);
  }
  while (lens.length < n) lens.push(28 + lens.length * 16);
  const cap = pick(MEAS_ICONS);
  const longest = chance(.55);
  const ans = longest ? Math.max.apply(null, lens) : Math.min.apply(null, lens);
  api.item('len:' + (aligned ? 'aligned' : 'ragged') + ':' + (longest ? 'L' : 'S') + ':' + n,
    (aligned ? 'はしが そろった ' : 'はしが ずれた ') + (longest ? 'いちばん ながい' : 'いちばん みじかい'));
  api.setPrompt(longest ? 'いちばん <b>ながい</b> のは どれ？' : 'いちばん <b>みじかい</b> のは どれ？',
                longest ? '一番長いのは、どれ？' : '一番短いのは、どれ？');
  const wrap = el('div.measure');
  const colors = shuffle(['var(--c-red)','var(--c-blue)','var(--c-green)','var(--c-purple)']);
  lens.forEach((L, i) => {
    const off = aligned ? 0 : ri(0, Math.max(0, Math.min(22, 97 - L)));
    const row = barRow(L, off, colors[i % colors.length], cap);
    tappable(row, () => {
      if (api.locked) return;
      if (L === ans){ row.classList.add('correct'); api.correct(); }
      else { row.classList.add('wrong'); api.later(() => row.classList.remove('wrong'), 460); api.wrong(row); }
    });
    wrap.append(row);
  });
  api.field.append(wrap);
  if (!aligned) api.field.append(el('div.hintline', { text: 'はじまる ところが ちがうよ。ながさ だけを みてね' }));
  // sliding every bar back to a shared start line IS the lesson, so show it
  api.onHint(() => {
    $$('.track .gap', wrap).forEach(g => { g.style.transition = 'width .6s ease'; g.style.width = '0%'; });
    wrap.classList.add('lined');
    api.field.append(el('div.hintline', { text: 'はじまりを そろえて みたよ' }));
  });
}

function vesselSVG(w, h, fill, color){
  const W = 90, H = 130;
  const x = (W - w) / 2;
  const waterH = h * fill;
  return svg('svg', { viewBox: `0 0 ${W} ${H}`, width: 'calc(var(--u)*11)', height: 'calc(var(--u)*16)' },
    svg('rect', { x, y: H - h - 6, width: w, height: h, rx: 4, fill: 'var(--card)', stroke: 'var(--ink)', 'stroke-width': 3 }),
    svg('rect', { x: x + 3, y: H - waterH - 9, width: w - 6, height: waterH, rx: 3, fill: color, opacity: .85 }),
    svg('rect', { x, y: H - h - 6, width: w, height: h, rx: 4, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 3 }));
}

/* A shared unit for every glass in the question.
   The hint tells the child to count squares, so the squares have to be the same
   size in every glass and on both axes — 任意単位は同じ大きさでそろえる is the whole
   point of 1年生「かさくらべ」. The old hint derived its spacing from each glass's
   own width and height (`w / round(w / 13)`), so a wide glass got wide squares and
   a narrow one got narrow squares: counting them gave a tie or the wrong answer in
   about 2% of questions (面積 2442 と 3483 が どちらも18マス), and taught an invalid
   way of comparing in all of them.

   Sizing the water to whole multiples of one unit makes the count exact, so the
   answer the child reaches by counting is always the answer the question wants. */
const CAP_UNIT = 12;                    // SVG units, square
const CAP_COLS = [2, 3, 4];             // water width  = cols * CAP_UNIT
const CAP_ROWS = [5, 6, 7, 8, 9];       // water height = rows * CAP_UNIT
const CAP_FALLBACK = [[2, 9], [4, 6], [2, 5]];

function capSpec(cols, rows){
  return { cols, rows, cells: cols * rows,
           w: cols * CAP_UNIT + 6,      // vesselSVG insets the water by 3 a side
           h: rows * CAP_UNIT, fill: 1 };
}

function capacityCompare(api){
  const n = chance(.5) ? 2 : 3;
  // far enough apart to be a fair question by eye as well as by counting
  const clearOf = (list, s) => list.every(o =>
    Math.abs(o.cells - s.cells) / Math.max(o.cells, s.cells) > 0.18);

  let specs = [];
  for (let attempt = 0; attempt < 60 && !specs.length; attempt++){
    const trial = [];
    for (let g = 0; g < 300 && trial.length < n; g++){
      const s = capSpec(pick(CAP_COLS), pick(CAP_ROWS));
      if (clearOf(trial, s)) trial.push(s);
    }
    if (trial.length < n) continue;
    // "tall" must not mean "much": keep looking for a set where the tallest glass
    // is not the fullest one, and only give up on that near the end
    const tallest = trial.reduce((a, b) => a.rows > b.rows ? a : b);
    const fullest = trial.reduce((a, b) => a.cells > b.cells ? a : b);
    if (attempt < 45 && tallest === fullest) continue;
    specs = trial;
  }
  if (specs.length < n) specs = CAP_FALLBACK.slice(0, n).map(([c, r]) => capSpec(c, r));

  const more = chance(.6);
  const ans = more ? Math.max.apply(null, specs.map(s => s.cells))
                   : Math.min.apply(null, specs.map(s => s.cells));
  api.item('cap:' + (more ? 'more' : 'less') + ':' + n, 'かさが ' + (more ? 'おおい' : 'すくない') + ' コップ');
  api.setPrompt(more ? 'ジュースが <b>おおい</b> のは どれ？' : 'ジュースが <b>すくない</b> のは どれ？',
                more ? 'ジュースが多いのは、どれ？' : 'ジュースが少ないのは、どれ？');
  const colors = shuffle(['var(--c-orange)','var(--c-red)','var(--c-purple)']);
  const wrap = el('div.vessels');
  shuffle(specs).forEach((s, i) => {
    const v = el('div.vessel', null, vesselSVG(s.w, s.h, s.fill, colors[i % colors.length]));
    tappable(v, () => {
      if (api.locked) return;
      if (s.cells === ans){ v.classList.add('correct'); api.correct(); }
      else { v.classList.add('wrong'); api.later(() => v.classList.remove('wrong'), 460); api.wrong(v); }
    });
    wrap.append(v);
  });
  api.field.append(wrap, el('div.hintline', { text: 'せが たかい ＝ おおい とは かぎらないよ' }));
  // one unit, the same in every glass, dividing the water exactly
  api.onHint(() => {
    $$('.vessel svg', wrap).forEach(sv => {
      const water = sv.querySelectorAll('rect')[1];
      if (!water || sv.querySelector('.unitgrid')) return;
      const x = +water.getAttribute('x'), y = +water.getAttribute('y');
      const w = +water.getAttribute('width'), h = +water.getAttribute('height');
      const g = svg('g', { class: 'unitgrid' });
      for (let gx = x; gx <= x + w + 0.1; gx += CAP_UNIT)
        g.append(svg('line', { x1: gx, y1: y, x2: gx, y2: y + h, stroke: 'rgba(255,255,255,.75)', 'stroke-width': 1 }));
      for (let gy = y; gy <= y + h + 0.1; gy += CAP_UNIT)
        g.append(svg('line', { x1: x, y1: gy, x2: x + w, y2: gy, stroke: 'rgba(255,255,255,.75)', 'stroke-width': 1 }));
      sv.append(g);
    });
    api.field.append(el('div.hintline', { text: 'おなじ おおきさの ますが いくつ ぶんか かぞえよう' }));
  });
}

function orderBySize(api){
  const n = ri(3, 4);
  const lens = [];
  for (let g = 0; g < 400 && lens.length < n; g++){
    const v = ri(26, 94);
    if (lens.every(x => Math.abs(x - v) >= 14)) lens.push(v);
  }
  while (lens.length < n) lens.push(30 + lens.length * 18);
  const asc = chance(.5);
  const wanted = lens.slice().sort((a, b) => asc ? a - b : b - a);
  api.item('order:' + (asc ? 'asc' : 'desc') + ':' + n, n + 'つを ' + (asc ? 'みじかい' : 'ながい') + ' じゅんに');
  api.setPrompt(asc ? '<b>みじかい</b> じゅんに タップしよう' : '<b>ながい</b> じゅんに タップしよう',
                asc ? '短い順にタップしよう。' : '長い順にタップしよう。');
  const cap = pick(MEAS_ICONS);
  const colors = shuffle(['var(--c-red)','var(--c-blue)','var(--c-green)','var(--c-purple)']);
  const wrap = el('div.measure');
  let step = 0;
  shuffle(lens).forEach((L, i) => {
    const row = barRow(L, 0, colors[i % colors.length], cap);
    tappable(row, () => {
      if (api.locked || row.classList.contains('picked')) return;
      if (L === wanted[step]){
        step++;
        row.classList.add('picked');
        row.classList.remove('nexthint');
        row.prepend(el('div.ordno', { text: String(step) }));
        Sound.sfx.count(step - 1);
        if (step === n){ $$('.mrow', wrap).forEach(r => r.classList.add('correct')); api.correct(); }
      } else {
        row.classList.add('wrong');
        api.later(() => row.classList.remove('wrong'), 460);
        api.wrong(row);
      }
    });
    wrap.append(row);
  });
  api.field.append(wrap);
  api.onHint(() => {
    const wantNow = wanted[step];
    $$('.mrow', wrap).forEach(r => {
      const bar = $('.stickbar', r);
      if (bar && Math.abs(parseFloat(bar.style.width) - wantNow) < 0.01) r.classList.add('nexthint');
    });
    api.field.append(el('div.hintline', { text: asc ? 'ひかって いるのが つぎに みじかい よ' : 'ひかって いるのが つぎに ながい よ' }));
  });
}

/* ---- 12-g-calc.js ---- */
/* ===========================================================
   12 — WORLD 3「けいさんの やま」 いくつといくつ・10のおともだち・たし／ひき
   =========================================================== */
'use strict';

/** In a 集中練習 session the engine names the exact fact this question should ask.
    These generators read it, so a fact the child keeps missing can come round
    several times in one sitting; きょうの れんしゅう on its own gives one particular
    fact about a turn a fortnight. Returns the numbers in the key, or null. */
function wanted(api, re){
  const m = api.want && re.exec(api.want);
  return m ? m.slice(1).map(Number) : null;
}

/* ---------- shared: bond diagram ---------- */
function bondNode(whole, known, unknownLabel){
  const legs = svg('svg', { viewBox: '0 0 100 20', class: 'legs' },
    svg('path', { d: 'M50 0 L18 18 M50 0 L82 18', stroke: 'var(--ink)', 'stroke-width': 3,
                  'stroke-linecap': 'round', fill: 'none' }));
  return el('div.bond', null,
    el('div.whole', { text: String(whole) }),
    legs,
    el('div.parts', null,
      el('div.part.known', { text: String(known) }),
      el('div.part.unknown', { text: unknownLabel == null ? '?' : String(unknownLabel) })));
}

/* five/ten frame with a known part in blue and the missing part as empty holes */
function partFrame(whole, known){
  const cols = whole > 5 ? 5 : whole;
  const f = el('div.tenframe', { style: { '--cols': cols } });
  for (let i = 0; i < whole; i++){
    const cell = el('div.cell' + (i >= known ? '.hole' : ''));
    if (i < known) cell.append(el('div.dot'));
    f.append(cell);
  }
  return f;
}

/* ============================================================
   8. いくつと いくつ — number bonds (decompose & compose)
   ============================================================ */
function decompose(api, whole, pad){
  const w = wanted(api, /^dec:(\d+)-(\d+)$/);
  const aim = w && w[0] >= 2 && w[1] >= 1 && w[1] < w[0];
  if (aim) whole = w[0];
  const known = aim ? w[1] : ri(1, whole - 1), ans = whole - known;
  api.item('dec:' + whole + '-' + known, whole + ' は ' + known + ' と ' + ans);
  api.setPrompt(`${numTag(whole)} は ${numTag(known)} と いくつ？`,
                `${numKana(whole)}は、${numKana(known)}といくつ？`);
  const frame = partFrame(whole, known);
  const frameset = el('div.frameset', null, frame);
  const bond = bondNode(whole, known, null);
  /* At the top level the picture *is* the answer: 「10は4といくつ」 with a ten-frame
     on screen is solved by counting the six empty cells, not by remembering that
     10 is 4 and 6. The keypad took guessing out of this level; leaving the frame up
     left counting in, which is the strategy the level exists to replace. So the
     frame comes back the moment the child answers — and earlier if they get stuck —
     where it confirms what they said instead of telling them. */
  if (!pad) api.field.append(frameset);
  api.field.append(bond);
  const showFrame = () => { if (!frameset.isConnected) api.field.prepend(frameset); };
  const showParts = {
    correctOpts: { delay: 1500 },
    onPick(){
      showFrame();
      // show the two parts making the whole (scoped to this question's own nodes)
      const cells = $$('.cell', frame);
      for (let i = known; i < whole; i++){
        api.later(() => {
          if (!cells[i].firstChild){ cells[i].classList.remove('hole'); cells[i].append(el('div.dot.b')); Sound.sfx.place(); }
        }, (i - known) * 170 + 200);
      }
      $('.part.unknown', bond).textContent = String(ans);
    }
  };
  if (pad) api.buildPad(ans, showParts);
  else api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 1, whole))), ans, showParts);
  if (pad) api.onHint(showFrame);
}

function compose(api, maxWhole, pad){
  const w = wanted(api, /^com:(\d+)\+(\d+)$/);
  const aim = w && w[0] >= 1 && w[1] >= 1 && w[0] + w[1] <= maxWhole;
  const a = aim ? w[0] : ri(1, maxWhole - 1);
  const b = aim ? w[1] : ri(1, maxWhole - a), ans = a + b;
  api.item('com:' + a + '+' + b, a + ' と ' + b + ' で ' + ans);
  api.setPrompt(`${numTag(a)} と ${numTag(b)} で いくつ？`,
                `${numKana(a)}と${numKana(b)}で、いくつ？`);
  const slots = a + b > 5 ? 10 : 5;
  const f = el('div.tenframe', { style: { '--cols': 5 } });
  for (let i = 0; i < slots; i++){
    const cell = el('div.cell');
    if (i < a) cell.append(el('div.dot'));
    else if (i < a + b) cell.append(el('div.dot.b'));
    f.append(cell);
  }
  const frameset = el('div.frameset', null, f);
  if (!pad) api.field.append(frameset);          // countable at the top level: see decompose
  api.field.append(
    el('div.eq', null, String(a), el('span.op', { text: 'と' }), String(b), el('span.op', { text: 'で' }), el('span.box', { text: '?' })));
  const showFrame = () => { if (!frameset.isConnected) api.field.prepend(frameset); };
  if (pad){
    api.buildPad(ans, { correctOpts: { delay: 1200 }, onPick(){ showFrame(); } });
    api.onHint(showFrame);
  } else {
    api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 1, maxWhole + 2))), ans);
  }
}

/** Make two different decompositions. There is no single hidden answer: every
    split is valid, and the child succeeds by producing a genuinely different one. */
function makeTwoWays(api){
  const whole = ri(6, 9);
  api.item('ways:' + whole, whole + ' を 2とおりに わける');
  api.setPrompt(`${numTag(whole)} を ちがう 2つの やりかたで わけよう`,
                `${numKana(whole)}を、違う二つのやり方で分けよう。`);
  const made = [], board = el('div.ways-board');
  let accepting = true;
  api.field.append(board);

  const draw = () => {
    clear(board);
    made.forEach((a, i) => board.append(
      el('div.way', null,
        el('span.no', { text: String(i + 1) }),
        bondNode(whole, a, whole - a))));
  };
  const build = () => {
    clear(api.choices);
    accepting = true;
    for (let a = 1; a < whole; a++){
      const b = el('button.choice', { type: 'button', text: String(a) });
      b.addEventListener('click', () => {
        if (api.locked || !accepting) return;
        accepting = false;                    // a double tap is one construction
        const same = made.some(x => Math.min(x, whole - x) === Math.min(a, whole - a));
        if (same){
          api.wrong(b);
          Sound.say('同じ分け方だね。違う分け方も作ってみよう。', { delay: 250 });
          api.later(() => { accepting = true; }, 360);
          return;
        }
        made.push(a);
        b.classList.add('correct');
        draw();
        Sound.say(`${numKana(a)}と${numKana(whole-a)}。`, { delay: 120 });
        if (made.length >= 2) api.later(() => api.correct({ quiet: true, delay: 900 }), 350);
        else api.later(build, 350);
      });
      api.choices.append(b);
    }
  };
  draw();
  build();
  api.onHint(() => {
    const used = new Set(made.map(x => Math.min(x, whole - x)));
    const a = Array.from({ length: whole - 1 }, (_, i) => i + 1)
      .find(x => !used.has(Math.min(x, whole - x))) || 1;
    api.field.append(el('div.hintline', {
      text: a + ' と ' + (whole - a) + ' に わけることも できるよ'
    }));
  });
}

  aim: '5や10を<b>2つの数に分けたり、合わせたり</b>する感覚。たし算・ひき算を「数えないで思い出す」ための部品で、くり上がり・くり下がりの計算はこれが土台になります。ここが自動化していると小1は驚くほど楽になります。',
  levels: [

    { t: '10は いくつと いくつ', d: 'すうじを じぶんで えらぶ', make: api => chance(.25) ? compose(api, 10, true) : decompose(api, 10, true) }
  ]
});

/* ============================================================
   9. １０の おともだち — make ten
   ============================================================ */
function fillToTen(api){
  const w = wanted(api, /^fill10:(\d+)$/);
  const start = (w && w[0] >= 2 && w[0] <= 8) ? w[0] : ri(2, 8);
  api.item('fill10:' + start, start + ' から 10 まで あと ' + (10 - start));
  api.setPrompt(`わくが <b>10</b> に なるように タップして たそう`, '枠が10になるように、タップして足そう。');
  const f = el('div.tenframe', { style: { '--cols': 5 } });
  const cells = [];
  for (let i = 0; i < 10; i++){
    const cell = el('div.cell' + (i >= start ? '.tappable' : ''));
    if (i < start) cell.append(el('div.dot'));
    cells.push(cell); f.append(cell);
  }
  let count = start;
  const readout = el('div.hintline', { text: 'いま ' + count + 'こ' });
  cells.forEach((cell, i) => {
    if (i < start) return;
    cell.addEventListener('click', () => {
      if (api.locked || cell.firstChild) return;
      cell.append(el('div.dot.b'));
      count++;
      Sound.sfx.count(count - 1);
      Sound.say(numKana(count), { delay: 0, rate: 1.08 });
      readout.textContent = 'いま ' + count + 'こ';
      if (count === 10){
        api.later(() => {
          api.setPrompt(`${numTag(start)} と ${numTag(10 - start)} で <b>10</b>！`,
                        `${numKana(start)}と${numKana(10 - start)}で、10！`);
          api.correct({ quiet: true, delay: 1400 });
          UI.bigMark('◯');
        }, 300);
      }
    });
  });
  api.field.append(el('div.frameset', null, f), readout);
  api.onHint(() => { readout.textContent = 'いま ' + count + 'こ　／　あと ' + (10 - count) + 'こ'; });
}

function partnerOfTen(api, pad){
  const w = wanted(api, /^ten:(\d+)$/);
  const a = (w && w[0] >= 1 && w[0] <= 9) ? w[0] : ri(1, 9), ans = 10 - a;
  api.item('ten:' + a, a + ' と ' + ans + ' で 10');
  api.setPrompt(`${numTag(a)} と いくつで <b>10</b>？`, `${numKana(a)}といくつで、10？`);
  const f = el('div.tenframe', { style: { '--cols': 5 } });
  const cells = [];
  for (let i = 0; i < 10; i++){
    const cell = el('div.cell' + (i >= a ? '.hole' : ''));
    if (i < a) cell.append(el('div.dot'));
    cells.push(cell); f.append(cell);
  }
  /* Same reason as いくつと いくつ L3: 「2と いくつで 10？」 above two blue dots and
     eight empty cells is a counting question wearing a retrieval question's clothes.
     The equation stays — that is the question; the frame is the answer. */
  const frameset = el('div.frameset', null, f);
  if (!pad) api.field.append(frameset);
  api.field.append(
    el('div.eq', null, String(a), el('span.op', { text: 'と' }), el('span.box', { text: '?' }), el('span.op', { text: 'で' }), '10'));
  const showFrame = () => { if (!frameset.isConnected) api.field.prepend(frameset); };
  if (pad){
    api.buildPad(ans, {
      correctOpts: { delay: 1500 },
      onPick(){
        showFrame();
        for (let i = a; i < 10; i++){
          api.later(() => {
            if (!cells[i].firstChild){ cells[i].classList.remove('hole'); cells[i].append(el('div.dot.b')); Sound.sfx.place(); }
          }, (i - a) * 150 + 200);
        }
      }
    });
    api.onHint(showFrame);
  } else {
    api.buildChoices(shuffle([ans].concat(distractors(ans, 3, 1, 9))), ans);
  }
}

function pairHunt(api){
  const w = wanted(api, /^pair:(\d+)$/);
  const a = (w && w[0] >= 1 && w[0] <= 9) ? w[0] : ri(1, 9), b = 10 - a;
  const others = [];
  while (others.length < 3){
    const v = ri(1, 9);
    if (v !== a && v !== b && others.indexOf(v) < 0) others.push(v);
  }
  const cards = shuffle([a, b].concat(others));
  api.item('pair:' + Math.min(a, b), Math.min(a, b) + ' と ' + Math.max(a, b) + ' の ペア');
  api.setPrompt('たすと <b>10</b> に なる 2まいを えらぼう', '足すと10になる2枚を選ぼう。');
  const picked = [];
  const row = api.choices;
  cards.forEach(v => {
    const c = el('button.choice', { type: 'button', text: String(v) });
    c.addEventListener('click', () => {
      if (api.locked || c.classList.contains('correct')) return;
      if (picked.indexOf(c) >= 0){
        picked.splice(picked.indexOf(c), 1); c.classList.remove('picked');
        c.style.borderColor = ''; Sound.sfx.tap(); return;
      }
      picked.push(c); c.style.borderColor = 'var(--accent)'; Sound.sfx.tap();
      if (picked.length === 2){
        const sum = Number(picked[0].textContent) + Number(picked[1].textContent);
        if (sum === 10){ picked.forEach(p => p.classList.add('correct')); api.correct(); }
        else {
          picked.forEach(p => { p.classList.add('wrong'); p.style.borderColor = ''; api.later(() => p.classList.remove('wrong'), 460); });
          api.wrong();
          Sound.say(`合わせて${numKana(sum)}になったよ。`, { delay: 320 });
          picked.length = 0;
        }
      }
    });
    row.append(c);
  });
  api.field.append(el('div.hintline', { text: '1と9、2と8、3と7、4と6、5と5' }));
  api.onHint(() => {
    const one = $$('.choice', row).find(c => Number(c.textContent) === a);
    if (one) one.classList.add('glow');
  });
}

/** Build ten from three numbers. Multiple answers are accepted; the app evaluates
    the child's construction instead of asking them to recognise one prepared pair. */
function threeMakeTen(api){
  api.item('three10', '3つの かずで 10を つくる');
  api.setPrompt('3つの すうじを えらんで <b>10</b> を つくろう',
                '三つの数字を選んで、10を作ろう。');
  const picked = [];
  let accepting = true;
  const readout = el('div.three-sum', { text: '? ＋ ? ＋ ? ＝ 10' });
  api.field.append(readout);
  const redraw = () => {
    const vals = picked.concat(['?', '?', '?']).slice(0, 3);
    readout.textContent = vals.join(' ＋ ') + ' ＝ 10';
  };
  for (let v = 0; v <= 9; v++){
    const b = el('button.choice.padkey', { type: 'button', text: String(v) });
    b.addEventListener('click', () => {
      if (api.locked || !accepting) return;
      picked.push(v); redraw(); Sound.sfx.tap();
      if (picked.length < 3) return;
      accepting = false;
      const sum = picked.reduce((a, x) => a + x, 0);
      if (sum === 10){
        b.classList.add('correct');
        api.correct({ delay: 1400 });
      } else {
        api.wrong(b);
        Sound.say(`合わせると${numKana(sum)}だね。10になるように変えてみよう。`, { delay: 280 });
        api.later(() => { picked.length = 0; redraw(); accepting = true; }, 650);
      }
    });
    api.choices.append(b);
  }
  api.choices.classList.add('pad');
  api.onHint(() => {
    api.field.append(el('div.hintline', { text: 'まず 5 を えらんで、のこりの 5 を 2つに わけてみよう' }));
  });
}

/* ============================================================
   10-11. たしざん / ひきざん — story scene then symbol
   ============================================================ */
/* Two clusters with a gap between them, so "3 and 2" stays visible as 3 and 2
   even after they have joined. A single evenly-spaced row dissolves the structure
   the question is about. */
function clusterSpots(n, cx){
  const per = Math.min(3, n);
  const rows = Math.ceil(n / per);
  const out = [];
  for (let i = 0; i < n; i++){
    const r = Math.floor(i / per), c = i % per;
    const inRow = Math.min(per, n - r * per);
    out.push([cx + (c - (inRow - 1) / 2) * 12, 48 + (r - (rows - 1) / 2) * 23]);
  }
  return out;
}

function storyScene(api, a, b, op, thing, onReady){
  const scene = el('div.scene');
  scene.append(el('div.' + (thing.e === '🐟' ? 'pond' : 'ground')));
  api.field.append(scene);
  const actors = [];
  const place = (spots, cls, hidden) => spots.forEach(p => {
    const n = el('div.actor.' + cls, { text: thing.e, style: { left: p[0] + '%', top: p[1] + '%' } });
    // offset in % of the scene, not vw: a vw offset left newcomers visible inside the frame
    if (hidden) n.style.transform = 'translate(160%,-50%)';
    scene.append(n); actors.push(n);
  });

  if (op === '+'){
    place(clusterSpots(a, 30), 'g1', false);
    place(clusterSpots(b, 72), 'g2', true);
  } else {
    const spots = clusterSpots(a, 50);
    place(spots.slice(0, a - b), 'g1', false);
    place(spots.slice(a - b), 'g2', false);
  }

  api.later(() => {
    Sound.sfx.swoosh();
    if (op === '+'){
      actors.forEach(n => { if (n.classList.contains('g2')) n.style.transform = 'translate(-50%,-50%)'; });
    } else {
      actors.forEach(n => {
        if (!n.classList.contains('g2')) return;
        n.classList.add('leaving');
        n.style.transform = 'translate(160%,-160%)';
      });
    }
    api.later(onReady, 900);
  }, 950);
}

/** a ＋ b with each number tinted like its group in the picture */
function eqNode(a, b, op){
  return el('div.eq', null,
    el('span.n1', { text: String(a) }),
    el('span.op', { text: op === '+' ? '＋' : '−' }),
    el('span.n2', { text: String(b) }),
    el('span.op', { text: '＝' }),
    el('span.box', { text: '?' }));
}

function addStory(api, max){
  const w = wanted(api, /^sum:(\d+)\+(\d+)$/);
  const aim = w && w[0] >= 1 && w[1] >= 1 && w[0] + w[1] <= max;
  const a = aim ? w[0] : ri(1, max - 1);
  const b = aim ? w[1] : ri(1, max - a), ans = a + b;
  const thing = pick(THINGS);
  api.item('sum:' + a + '+' + b, a + ' ＋ ' + b);
  api.setPrompt(`${thing.e} が ${numTag(a)}つ。${numTag(b)}つ やってきたよ`,
                `${thing.n}が${tsuKana(a)}。${tsuKana(b)}、やってきたよ。`);
  storyScene(api, a, b, '+', thing, () => {
    api.setPrompt('ぜんぶで いくつ？', '全部でいくつ？');
    api.field.append(eqNode(a, b, '+'));
    api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 1, max + 2, 2))), ans);
  });
}

function subStory(api, max){
  const w = wanted(api, /^rest:(\d+)-(\d+)$/);
  const aim = w && w[0] >= 2 && w[0] <= max && w[1] >= 1 && w[1] < w[0];
  const a = aim ? w[0] : ri(2, max);
  const b = aim ? w[1] : ri(1, a - 1), ans = a - b;
  const thing = pick(THINGS);
  api.item('rest:' + a + '-' + b, a + ' − ' + b);
  api.setPrompt(`${thing.e} が ${numTag(a)}つ。${numTag(b)}つ いなくなるよ`,
                `${thing.n}が${tsuKana(a)}。${tsuKana(b)}、いなくなるよ。`);
  storyScene(api, a, b, '-', thing, () => {
    api.setPrompt('のこりは いくつ？', '残りは、いくつ？');
    api.field.append(eqNode(a, b, '-'));
    api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 0, max, 2))), ans);
  });
}

function symbolCalc(api, op, max, pad){
  let a, b, ans;
  const w = wanted(api, op === '+' ? /^sum:(\d+)\+(\d+)$/ : /^rest:(\d+)-(\d+)$/);
  const aim = op === '+'
    ? (w && w[0] >= 1 && w[1] >= 1 && w[0] + w[1] <= max)
    : (w && w[0] >= 2 && w[0] <= max && w[1] >= 1 && w[1] <= w[0]);
  if (aim){ a = w[0]; b = w[1]; ans = op === '+' ? a + b : a - b; }
  else if (op === '+'){ a = ri(1, max - 1); b = ri(1, max - a); ans = a + b; }
  else { a = ri(2, max); b = ri(1, a); ans = a - b; }
  api.item((op === '+' ? 'sum:' + a + '+' + b : 'rest:' + a + '-' + b),
    a + (op === '+' ? ' ＋ ' : ' − ') + b);
  api.setPrompt('しきを みて こたえよう',
    `${numKana(a)}、${op === '+' ? 'たす' : 'ひく'}、${numKana(b)}は？`);
  api.field.append(eqNode(a, b, op));
  if (pad) api.buildPad(ans);
  else api.buildChoices(shuffle([ans].concat(distractors(ans, 3, 0, max + 2, 2))), ans);
  api.onHint(() => {
    if ($('.tenframe', api.field)) return;
    const f = el('div.tenframe', { style: { '--cols': 5 } });
    for (let i = 0; i < 10; i++){
      const cell = el('div.cell');
      if (op === '+'){ if (i < a) cell.append(el('div.dot')); else if (i < a + b) cell.append(el('div.dot.b')); }
      else { if (i < a - b) cell.append(el('div.dot')); else if (i < a) cell.append(el('div.dot.b')); }
      f.append(cell);
    }
    api.field.append(el('div.frameset', null, f),
      el('div.hintline', { text: op === '+' ? 'あおと あかを あわせて かぞえよう' : 'あかは いなくなった ぶん。あおを かぞえよう' }));
  });
}

function differenceQ(api, max, pad){
  const w = wanted(api, /^diff:(\d+)-(\d+)$/);
  const aim = w && w[0] >= 3 && w[0] <= max && w[1] >= 1 && w[1] < w[0];
  const a = aim ? w[0] : ri(3, max);
  const b = aim ? w[1] : ri(1, a - 1), ans = a - b;
  const t1 = pick(THINGS); let t2 = pick(THINGS);
  while (t2.e === t1.e) t2 = pick(THINGS);
  api.item('diff:' + a + '-' + b, a + ' と ' + b + ' の ちがい');
  api.setPrompt(`どちらが <b>いくつ</b> おおい？`, 'どちらが、いくつ多い？');
  const board = el('div.measure');
  [[t1, a], [t2, b]].forEach(([t, n]) => {
    const row = el('div.mrow', { style: { cursor: 'default' } }, el('div.cap', { text: t.e }));
    const g = el('div.row', { style: { gap: 'calc(var(--u)*.25)' } });
    for (let i = 0; i < n; i++) g.append(el('span.item', { text: t.e, style: { fontSize: 'calc(var(--u)*2.4)' } }));
    row.append(g);
    board.append(row);
  });
  api.field.append(board, eqNode(a, b, '-'));
  if (pad) api.buildPad(ans);
  else api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 0, max, 2))), ans);
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', { text: 'うえと したを 1つずつ ペアに して、あまりを かぞえよう' }));
  });
}

/* ===========================================================

   =========================================================== */
'use strict';

const SHAPE_COLORS = ['var(--c-red)','var(--c-blue)','var(--c-green)','var(--c-purple)','var(--c-orange)','var(--c-pink)'];

/* ============================================================
   12. かたち
   ============================================================ */
const KIND_JA = { circle: 'まる', triangle: 'さんかく', square: 'しかく' };
const KIND_MEMBERS = {
  circle:   ['circle', 'oval'],
  triangle: ['tri', 'tri2', 'rtri'],
  square:   ['square', 'rect']
};
const OTHERS = ['diamond', 'pentagon', 'hexagon', 'trapezoid', 'star', 'heart', 'semi'];

function findAllShapes(api){
  const target = pick(['circle', 'triangle', 'square']);
  const nTarget = ri(2, 4);
  const cells = [];
  for (let i = 0; i < nTarget; i++) cells.push({ name: pick(KIND_MEMBERS[target]), hit: true });
  const otherKinds = ['circle', 'triangle', 'square'].filter(k => k !== target);
  // 「しかく」means four-sided, so a rhombus or trapezoid would be a fair answer too:
  // keep every other quadrilateral out of the distractors when squares are the target
  const others = target === 'square'
    ? OTHERS.filter(k => k !== 'diamond' && k !== 'trapezoid')
    : OTHERS;
  const nOther = ri(4, 6);
  for (let i = 0; i < nOther; i++){
    const src = chance(.7) ? KIND_MEMBERS[pick(otherKinds)] : others;
    cells.push({ name: pick(src), hit: false });
  }
  api.item('find:' + target, KIND_JA[target] + ' を さがす');
  api.setPrompt(`<b>${KIND_JA[target]}</b> を ぜんぶ タップしよう`, `${KIND_JA[target]}を全部タップしよう。`);
  const grid = el('div.shapegrid');
  const tally = el('div.tally');
  const drawTally = () => {
    clear(tally);
    tally.append(el('span.lbl', { text: 'みつけた' }));
    for (let i = 0; i < nTarget; i++) tally.append(el('span.dot' + (i < found ? '.on' : '')));
  };
  let found = 0;
  shuffle(cells).forEach((c, i) => {
    const rot = c.name === 'square' || c.name === 'rect' ? ri(-18, 18) : ri(0, 359);
    const b = el('button.shapebtn', { type: 'button' }, shapeSVG(c.name, SHAPE_COLORS[i % SHAPE_COLORS.length], rot));
    b.addEventListener('click', () => {
      if (api.locked || b.classList.contains('picked')) return;
      if (c.hit){
        b.classList.add('picked'); found++; Sound.sfx.count(found - 1); drawTally();
        if (found === nTarget){ $$('.shapebtn.picked', grid).forEach(x => x.classList.add('correct')); api.correct(); }
      } else {
        b.classList.add('wrong'); api.later(() => b.classList.remove('wrong'), 460); api.wrong(b);
      }
    });
    grid.append(b);
  });
  drawTally();
  api.field.append(grid, tally, el('div.hintline', { text: 'むきが かわっても おなじ かたちだよ' }));
  api.onHint(() => {
    if ($('.hint2', api.field)) return;
    api.field.append(el('div.hintline.hint2', { text: KIND_JA[target] + 'は ぜんぶで ' + nTarget + 'こ。のこり ' + (nTarget - found) + 'こ' }));
  });
}

      { pts: [[50,8],[76,38],[24,38]] },
      { pts: [[50,28],[82,60],[18,60]] } ] }
];

function bbox(pts){
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  const y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
}

/* Two pieces are the same piece only if they are the same shape in the same
   orientation. The old signature was 頂点数:幅x高さ, which made ちょうちょ's four
   right triangles — the same triangle in four different orientations — all read as
   `3:32x24`, so any tile fitted any hole and the puzzle could be finished without
   looking at the shapes at all. ロケット's two fins (mirror images) collided the
   same way. Normalising the corners to the piece's own bounding box keeps genuinely
   identical pieces interchangeable while telling ◤ from ◥; sorting makes the
   comparison independent of the order the corners were authored in. */
function signature(pts){
  const b = bbox(pts);
  return pts.map(p => (Math.round((p[0] - b.x0) * 2) / 2) + ',' + (Math.round((p[1] - b.y0) * 2) / 2))
            .sort()
            .join(' ');
}

function shapePuzzle(api){
  const pz = pick(PUZZLES);
  api.item('puz:' + pz.name, pz.name + ' を つくる');
  api.setPrompt(`かたちを はめて <b>${pz.name}</b> を つくろう`, `形をはめて、${pz.name}を作ろう。`);
  const box = el('div.shapefield');
  const s = svg('svg', { viewBox: '0 0 100 80', preserveAspectRatio: 'xMidYMid meet' });
  box.append(s);
  const tray = el('div.shapes-tray');
  api.field.append(box, tray);

  const slots = pz.pieces.map((p, i) => {
    const poly = svg('polygon', {
      points: p.pts.map(q => q.join(',')).join(' '),
      fill: 'var(--trace-guide)', stroke: 'var(--ink-faint)', 'stroke-width': 1.6,
      'stroke-dasharray': '3 2.4', 'data-drop': '', style: 'cursor:pointer'
    });
    poly.dataset.sig = signature(p.pts);
    s.append(poly);
    return poly;
  });

  const colors = shuffle(SHAPE_COLORS);
  let filled = 0;
  const dd = UI.makeDragDrop({
    onDrop(item, target){
      if (api.locked) return;
      if (target.dataset.filled === '1') return;
      if (item.dataset.sig === target.dataset.sig){
        target.setAttribute('fill', item.dataset.color);
        target.setAttribute('stroke', 'color-mix(in srgb, ' + item.dataset.color + ' 60%, var(--ink) 40%)');
        target.setAttribute('stroke-dasharray', '');
        target.setAttribute('stroke-width', '1.6');
        target.dataset.filled = '1';
        item.classList.add('used');
        filled++;
        Sound.sfx.place();
        if (filled === slots.length) api.later(() => api.correct(), 260);
      } else {
        target.animate([{ opacity: 1 }, { opacity: .35 }, { opacity: 1 }], { duration: 300 });
        api.wrong(item);
        dd.select(item);            // stay picked up so the next slot is one tap away
      }
    }
  });
  slots.forEach(sl => dd.bindTarget(sl));

  // each tray tile is cropped around its own piece, on a shared scale, so small
  // pieces stay recognisable while the size difference between pieces stays readable
  const boxes = pz.pieces.map(p => bbox(p.pts));
  const biggest = Math.max.apply(null, boxes.map(b => Math.max(b.w, b.h)));
  shuffle(pz.pieces.map((p, i) => ({ p, i }))).forEach(({ p, i }) => {
    const color = colors[i % colors.length];
    const b = boxes[i];
    const S = Math.max(Math.max(b.w, b.h) * 1.25, biggest * 0.5);
    const t = el('div.shapetile');
    const mini = svg('svg', { viewBox: `${b.cx - S / 2} ${b.cy - S / 2} ${S} ${S}` },
      svg('polygon', { points: p.pts.map(q => q.join(',')).join(' '), fill: color,
        stroke: 'color-mix(in srgb, ' + color + ' 60%, var(--ink) 40%)',
        'stroke-width': S * 0.028, 'stroke-linejoin': 'round' }));
    t.append(mini);
    t.dataset.sig = signature(p.pts);
    t.dataset.color = color;
    dd.bindItem(t);
    tray.append(t);
  });
  api.field.append(el('div.hintline', { text: 'ゆびで はめて みよう' }));
  api.onHint(() => {
    const t = $('.shapetile:not(.used)', tray);
    if (!t) return;
    dd.select(t);
    const slot = slots.find(sl => sl.dataset.filled !== '1' && sl.dataset.sig === t.dataset.sig);
    if (slot) slot.classList.add('glow');
  });
}

const CATS = {
  fruit:   { lbl: 'くだもの', e: '🍎', c: 'var(--c-red)',    items: ['🍎','🍓','🍌','🍇','🍑','🍉','🍊','🍐'] },

  vehicle: { lbl: 'のりもの', e: '🚗', c: 'var(--c-blue)',   items: ['🚗','🚌','🚂','✈️','🚲','🚒','🚕','🛵'] },
  veg:     { lbl: 'やさい',   e: '🥕', c: 'var(--c-green)',  items: ['🥕','🌽','🥦','🍆','🥔','🧅','🫑','🥬'] },
  bug:     { lbl: 'むし',     e: '🐞', c: 'var(--c-purple)', items: ['🐞','🦋','🐝','🐛','🦗','🕷','🐜','🪲'] }
};
/* Solid crayon-coloured shapes: when the axis is colour, the colour has to be the
   only thing that varies, and it must not be at the mercy of an emoji font. */
const COLOR_SHAPES = ['circle', 'square', 'tri', 'star', 'heart', 'oval'];
const COLOR_CATS = {
  red:    { lbl: 'あか',   c: 'var(--c-red)',    swatch: 'circle' },
  blue:   { lbl: 'あお',   c: 'var(--c-blue)',   swatch: 'circle' },
  yellow: { lbl: 'きいろ', c: 'var(--c-yellow)', swatch: 'circle' }
};

function sortGame(api, catset, nBins, byColor){
  const keys = sample(Object.keys(catset), nBins);
  const perBin = nBins === 2 ? 3 : 2;
  api.item('sort:' + keys.slice().sort().join('_'),
    keys.map(k => catset[k].lbl).join('・') + ' に わける');
  api.setPrompt(byColor ? 'おなじ いろの ばしょに いれてね' : 'なかまの ばしょに いれてね',
                byColor ? '同じ色の場所に入れてね。' : '仲間の場所に入れてね。');
  const mark = k => {
    const c = catset[k];
    if (!byColor) return el('span', { text: c.e });
    const sv = shapeSVG(c.swatch, c.c, 0);
    sv.setAttribute('width', 'calc(var(--u)*2)'); sv.setAttribute('height', 'calc(var(--u)*2)');
    return sv;
  };
  const bins = el('div.bins');
  const binMap = {};
  keys.forEach(k => {
    const c = catset[k];
    const b = el('div.bin', { style: { '--bc': c.c } },
      el('div.lbl', null, mark(k), ' ' + c.lbl),
      el('div.hold'));
    b.dataset.cat = k;
    binMap[k] = b;
    bins.append(b);
  });
  const tray = el('div.tray');
  api.field.append(bins, tray);

  const picks = [];
  keys.forEach(k => {
    if (byColor) sample(COLOR_SHAPES, perBin).forEach(shape => picks.push({ shape, k }));
    else sample(catset[k].items, perBin).forEach(e => picks.push({ e, k }));
  });
  let placed = 0;
  const totalItems = picks.length;

  const dd = UI.makeDragDrop({
    onDrop(item, target){
      if (api.locked) return;
      if (item.dataset.cat === target.dataset.cat){
        const copy = item.firstElementChild ? item.firstElementChild.cloneNode(true) : el('span', { text: item.textContent });
        $('.hold', target).append(el('span.item', null, copy));
        item.classList.add('gone');
        placed++;
        Sound.sfx.place();
        if (placed === totalItems) api.later(() => api.correct(), 300);
      } else {
        target.classList.add('nope');
        api.later(() => target.classList.remove('nope'), 440);
        api.wrong(item);
      }
    }
  });
  Object.values(binMap).forEach(b => dd.bindTarget(b));
  shuffle(picks).forEach(p => {
    let t;
    if (byColor){
      const sv = shapeSVG(p.shape, catset[p.k].c, 0);
      sv.setAttribute('width', 'calc(var(--u)*3.4)'); sv.setAttribute('height', 'calc(var(--u)*3.4)');
      t = el('div.tile.shapetile2', null, sv);
    } else {
      t = el('div.tile', { text: p.e });
    }
    t.dataset.cat = p.k;
    dd.bindItem(t);
    tray.append(t);
  });
  api.field.append(el('div.hintline', { text: 'ゆびで はこに いれてね' }));
  api.onHint(() => {
    const t = $('.tile:not(.gone)', tray);
    if (!t) return;
    dd.select(t);
    binMap[t.dataset.cat].classList.add('glow');
  });
}

/* ============================================================
   14. きまり さがし — patterns
   ============================================================ */
const PAT_TOKENS = ['🔴','🔵','🟡','🟢','🟣','🟠','⭐️','🌙','🍎','🍌','🐰','🐻'];

function patternQuestion(api, unitKind, blanks){
  const kinds = { AB: [0, 1], AAB: [0, 0, 1], ABB: [0, 1, 1], ABC: [0, 1, 2], ABBA: [0, 1, 1, 0] };
  const unit = kinds[unitKind];
  const need = Math.max.apply(null, unit) + 1;
  const toks = sample(PAT_TOKENS, need);
  const seq = [];
  const wanted = Math.min(10, unit.length * 3 + ri(0, unit.length - 1));   // must stay on one line
  while (seq.length < wanted) seq.push(toks[unit[seq.length % unit.length]]);
  const total = seq.length;
  const holes = [];
  for (let i = 0; i < blanks; i++) holes.push(total - 1 - i);
  holes.sort((a, b) => a - b);
  api.item('pat:' + unitKind + ':' + blanks, unitKind + ' の くりかえし');
  api.setPrompt('つづきは どれ？ きまりを みつけよう', '続きは、どれ？きまりを見つけよう。');
  const train = el('div.train');
  const cars = seq.map((t, i) => {
    const isHole = holes.indexOf(i) >= 0;
    const c = el('div.car' + (isHole ? '.blank' : ''), { text: isHole ? '' : t });
    train.append(c);
    return c;
  });
  api.field.append(train);

  let hi = 0;
  function askHole(){
    if (hi >= holes.length) return;
    const at = holes[hi];
    cars.forEach(c => c.classList.remove('now'));
    cars[at].classList.add('blank', 'now');
    const ans = seq[at];
    const opts = shuffle(toks.concat(sample(PAT_TOKENS.filter(t => toks.indexOf(t) < 0), Math.max(0, 3 - need))));
    api.buildChoices(opts.slice(0, Math.max(3, need)), ans, {
      cls: 'pic',
      render: v => el('span', { text: v, style: { fontSize: 'calc(var(--u)*3.2)' } }),
      onPick(){
        cars[at].textContent = ans;
        cars[at].classList.remove('blank', 'now');
        cars[at].classList.add('filled');
        Sound.sfx.place();
        hi++;
        if (hi < holes.length){ api.later(askHole, 560); return false; }
        return true;
      }
    });
  }
  askHole();
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    cars.forEach((c, i) => { if (Math.floor(i / unit.length) % 2 === 0) c.classList.add('unitmark'); });
    api.field.append(el('div.hintline', { text: unit.length + 'つずつ おなじ ならびが くりかえして いるよ' }));
  });
}

/** Let the child author the repeating unit, then show the rule they created. */
function createPattern(api){
  const opts = sample(PAT_TOKENS, 5), chosen = [];
  api.item('create:AB', 'じぶんで 2つの くりかえしを つくる');
  api.setPrompt('すきな 2つを えらんで、きまりを つくろう',
                '好きな二つを選んで、きまりを作ろう。');
  const train = el('div.train');
  for (let i = 0; i < 8; i++) train.append(el('div.car.empty'));
  api.field.append(train);
  opts.forEach(v => {
    const b = el('button.choice.pic', { type: 'button', text: v });
    b.addEventListener('click', () => {
      if (api.locked) return;
      if (chosen.indexOf(v) >= 0) return;     // a child's double tap is one choice
      chosen.push(v);
      const cars = $$('.car', train);
      cars.forEach((c, i) => {
        if (i >= chosen.length && chosen.length < 2) return;
        c.classList.remove('empty');
        c.textContent = chosen[i % chosen.length];
      });
      b.classList.add('picked');
      if (chosen.length === 2){
        $$('.choice.picked', api.choices).forEach(x => x.classList.add('correct'));
        api.setPrompt('できた きまりを こえに だして いってみよう',
                      'できた決まりを、声に出して言ってみよう。');
        api.later(() => api.correct({ quiet: true, delay: 1300 }), 500);
      }
    });
    api.choices.append(b);
  });
  api.onHint(() => {
    if (chosen.length) api.field.append(el('div.hintline', { text: chosen[0] + ' の つぎに くるものを えらぼう' }));
  });
}

/* ============================================================
   15. とけい — reading the clock
   ============================================================ */
/* Only times that mean one thing to a five-year-old regardless of am/pm. */
const HOUR_SCENES = { 7: '🌅 あさごはん', 12: '🍛 おひるごはん', 3: '🧃 おやつ' };

function readClock(api, half){
  const h = ri(1, 12);
  const m = half && chance(.5) ? 30 : 0;
  api.item('read:' + h + ':' + m, h + 'じ' + (m === 30 ? 'はん' : '') + ' を よむ');
  api.setPrompt('なんじ かな？', '何時かな？');
  const c = clockSVG(h, m);
  c.style.width = 'calc(var(--u)*22)';
  c.style.height = 'calc(var(--u)*22)';
  api.field.append(c);
  if (m === 0 && HOUR_SCENES[h]) api.field.append(el('div.hintline', { text: HOUR_SCENES[h] }));
  const ans = h + ':' + m;
  const opts = new Set([ans]);
  let guard = 0;
  while (opts.size < 4 && guard++ < 60){
    const hh = ri(1, 12), mm = half ? pick([0, 30]) : 0;
    opts.add(hh + ':' + mm);
  }
  api.buildChoices(shuffle(Array.from(opts)), ans, {
    render: v => {
      const [hh, mm] = v.split(':');
      return hh + 'じ' + (mm === '30' ? 'はん' : '');
    }
  });
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', {
      text: m === 30 ? 'ながい はりが 6 のとき「はん」。みじかい はりは すぎた ほうの すうじ' : 'みじかい はりが さす すうじを よもう' }));
  });
}

function pickClock(api, half){
  const h = ri(1, 12), m = half && chance(.5) ? 30 : 0;
  api.item('pick:' + h + ':' + m, h + 'じ' + (m === 30 ? 'はん' : '') + ' の とけいを えらぶ');
  api.setPrompt(`<b>${h}じ${m === 30 ? 'はん' : ''}</b> の とけいは どれ？`,
                `${jiKana(h, m === 30)}の時計は、どれ？`);
  const opts = [{ h, m }];
  let guard = 0;
  while (opts.length < 3 && guard++ < 60){
    const hh = ri(1, 12), mm = half ? pick([0, 30]) : 0;
    if (!opts.some(o => o.h === hh && o.m === mm)) opts.push({ h: hh, m: mm });
  }
  clear(api.choices);
  shuffle(opts).forEach(o => {
    const wrap = el('div.clock-choice', null, clockSVG(o.h, o.m, { numerals: true }));
    tappable(wrap, () => {
      if (api.locked) return;
      if (o.h === h && o.m === m){ wrap.classList.add('correct'); api.correct(); }
      else { wrap.classList.add('wrong'); api.later(() => wrap.classList.remove('wrong'), 460); api.wrong(wrap); }
    });
    api.choices.append(wrap);
  });
}

function setClock(api, hand){
  const minuteMode = hand === 'minute';
  const targetHour = ri(1, 12), target = minuteMode ? 30 : targetHour;
  api.item(minuteMode ? 'sethalf:' + targetHour : 'set:' + targetHour,
    minuteMode ? targetHour + 'じはん に ながいはりを あわせる' : targetHour + 'じ に みじかいはりを あわせる');
  api.setPrompt(minuteMode
      ? `<b>${targetHour}じはん</b> に なるように ながい はりを うごかそう`
      : `<b>${targetHour}じ</b> に なるように みじかい はりを うごかそう`,
    minuteMode
      ? `${jiKana(targetHour, true)}になるように、長い針を動かそう。`
      : `${jiKana(targetHour)}になるように、短い針を動かそう。`);
  let cur = minuteMode ? pick([0, 5, 10, 15, 20, 40, 45, 50, 55]) : ri(1, 12);
  for (let g = 0; g < 100 && cur === target; g++)
    cur = minuteMode ? pick([0, 5, 10, 15, 20, 40, 45, 50, 55]) : ri(1, 12);
  if (cur === target) cur = minuteMode ? 0 : (targetHour === 12 ? 1 : targetHour + 1);
  const holder = el('div', {
    style: { touchAction: 'none' }, role: 'group',
    'aria-label': minuteMode ? 'ながい はりを うごかす とけい' : 'みじかい はりを うごかす とけい'
  });
  api.field.append(holder);
  const readout = el('div.clock-readout', { role: 'status', 'aria-live': 'polite', 'aria-atomic': 'true' });
  api.field.append(readout);

  const clock = clockSVG(minuteMode ? targetHour : cur, minuteMode ? cur : 0, { cls: 'pickable' });
  clock.style.width = 'calc(var(--u)*26)';
  clock.style.height = 'calc(var(--u)*26)';
  holder.append(clock);
  const hourHand = $('.hand-h', clock);
  const minuteHand = $('.hand-m', clock);

  function paint(){
    if (minuteMode){
      const ma = (cur / 60) * Math.PI * 2 - Math.PI / 2;
      const ha = (((targetHour % 12) + .5) / 12) * Math.PI * 2 - Math.PI / 2;
      minuteHand.setAttribute('x2', (50 + Math.cos(ma) * 33).toFixed(2));
      minuteHand.setAttribute('y2', (50 + Math.sin(ma) * 33).toFixed(2));
      hourHand.setAttribute('x2', (50 + Math.cos(ha) * 21).toFixed(2));
      hourHand.setAttribute('y2', (50 + Math.sin(ha) * 21).toFixed(2));
      readout.textContent = cur === 30 ? targetHour + 'じはん' : 'ながい はりは ' + cur + 'ふん';
      holder.setAttribute('aria-label', readout.textContent + '。ながい はりを うごかす とけい');
    } else {
      // rebuilding the SVG would destroy the node that received pointerdown
      const a = ((cur % 12) / 12) * Math.PI * 2 - Math.PI / 2;
      hourHand.setAttribute('x2', (50 + Math.cos(a) * 21).toFixed(2));
      hourHand.setAttribute('y2', (50 + Math.sin(a) * 21).toFixed(2));
      readout.textContent = 'いま ' + cur + 'じ';
      holder.setAttribute('aria-label', readout.textContent + '。みじかい はりを うごかす とけい');
    }
  }

  let down = false;
  function setFrom(e){
    const r = clock.getBoundingClientRect();
    if (!r.width) return;
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    let ang = Math.atan2(dy, dx) + Math.PI / 2;
    if (ang < 0) ang += Math.PI * 2;
    let v;
    if (minuteMode){
      v = Math.round(ang / (Math.PI * 2) * 12) * 5;
      if (v === 60) v = 0;
    } else {
      v = Math.round(ang / (Math.PI * 2) * 12);
      if (v === 0) v = 12;
    }
    if (v !== cur){ cur = v; Sound.sfx.tap(); paint(); }
  }
  clock.addEventListener('pointerdown', e => {
    if (api.locked) return;
    down = true;
    e.preventDefault();
    try{ if (clock.setPointerCapture) clock.setPointerCapture(e.pointerId); }catch(err){}
    setFrom(e);
  });
  clock.addEventListener('pointermove', e => { if (down && !api.locked){ e.preventDefault(); setFrom(e); } });
  const release = () => { down = false; };
  clock.addEventListener('pointerup', release);
  clock.addEventListener('pointercancel', release);
  paint();

  const check = el('button.btn.btn-accent', { text: 'これで いい？',
    onclick(){
      if (api.locked) return;
      if (cur === target) api.correct(); else { api.wrong(check); }
    } });
  const controls = minuteMode
    ? [
        el('button.btn.clock-adjust', {
          type: 'button', text: 'ながい はりを 12に',
          onclick(){ if (!api.locked){ cur = 0; Sound.sfx.tap(); paint(); } }
        }),
        el('button.btn.clock-adjust', {
          type: 'button', text: 'ながい はりを 6に',
          onclick(){ if (!api.locked){ cur = 30; Sound.sfx.tap(); paint(); } }
        })
      ]
    : [
        el('button.btn.clock-adjust', {
          type: 'button', text: '1じ もどす',
          onclick(){ if (!api.locked){ cur = cur === 1 ? 12 : cur - 1; Sound.sfx.tap(); paint(); } }
        }),
        el('button.btn.clock-adjust', {
          type: 'button', text: '1じ すすめる',
          onclick(){ if (!api.locked){ cur = cur === 12 ? 1 : cur + 1; Sound.sfx.tap(); paint(); } }
        })
      ];
  api.choices.append(...controls, check);
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', { text: minuteMode
      ? '「はん」の とき、ながい はりは 6を さすよ'
      : 'みじかい はりが ' + targetHour + ' を さすように まわそう' }));
    $$('text', clock).forEach(t => {
      if (t.textContent === String(minuteMode ? 6 : targetHour)) t.classList.add('goal');
    });
  });
}

/* ---- 14-g-ichinen.js ---- */
/* ===========================================================
   14 — WORLD 5「1ねんせいの きょうしつ」 小学1年生・はじめの単元
   ===========================================================
   This world is shut until the sticker book is full (see `Progress` in 05).

   What goes in it is not "next year's arithmetic brought forward". The first
   weeks of 小学1年生 go back over ground the child has already walked on — and
   ask for the part the 入学前 games never asked for:

   *「同じものの集まり」*  かぞえよう asks how many are there; a 1年生 is asked to
   *make the group first* —「くだものを ぜんぶ」— and only then to count it. The
   number is a property of a set someone decided on, not of whatever happens to be
   on the table. なかまわけ sorts things into given boxes; here the child chooses
   the rule and gathers to it.

   *「1対1対応」*  どっちが おおい is answered by counting both sides. A 1年生 is
   asked to pair them off instead: put one against one, and read the answer off
   what is left over. That is the same operation as 求差 (「いくつ おおい」) and it
   is where ひきざん's second meaning comes from, so it is worth doing with the
   fingers before it is done with a number.

   The other two games are where those two ideas are heading: 20までの かず
   (10 のまとまりと ばら) and しき (putting a story into ＋ and −, and reading a
   ＋ or − back out as a story).
   =========================================================== */
'use strict';

/* ============================================================
   17. なかまづくり — sets: a group made on purpose, then counted
   ============================================================ */

/** Two kinds of thing scattered together. Tap every one of the named kind — and
    only then say how many there were. Counting comes second here on purpose:
    the group has to exist before it has a number. */
function collectSame(api){
  const [kA, kB] = sample(Object.keys(CATS), 2);
  const target = CATS[kA], other = CATS[kB];
  const n = ri(3, 6), m = ri(2, 5);
  api.item('same:' + kA + ':' + n, target.lbl + ' の なかま ' + n + 'こ');
  api.setPrompt(`<b>${target.lbl}</b> の なかまを ぜんぶ タップしよう`,
                `${target.lbl}の仲間を、全部タップしよう。`);

  const items = shuffle(
    sample(target.items, n).map(e => ({ e, hit: true }))
      .concat(sample(other.items, m).map(e => ({ e, hit: false }))));
  const field = el('div.objfield');
  const pts = scatter(items.length);
  const objs = [];
  items.forEach((it, i) => {
    const o = el('div.obj', { style: { left: (pts[i][0] * 100) + '%', top: (pts[i][1] * 100) + '%' } }, it.e);
    o.dataset.hit = it.hit ? '1' : '0';
    objs.push(o);
    field.append(o);
  });
  api.field.append(field);

  let done = 0;
  objs.forEach(o => tappable(o, () => {
    if (api.locked || o.classList.contains('counted')) return;
    if (o.dataset.hit !== '1'){
      o.classList.add('notmine');
      api.later(() => o.classList.remove('notmine'), 460);
      api.wrong(o);
      Sound.say(`それは${target.lbl}の仲間じゃないね。`, { delay: 260 });
      return;
    }
    done++;
    o.classList.add('counted');
    o.append(el('span.tag', { text: String(done) }));
    Sound.sfx.count(done - 1);
    Sound.say(numKana(done), { delay: 0, rate: 1.08 });
    if (done === n) api.later(ask, 640);
  }));

  function ask(){
    api.setPrompt(`あつめた <b>${target.lbl}</b> は ぜんぶで いくつ？`,
                  `集めた${target.lbl}は、全部でいくつ？`);
    api.buildChoices(shuffle([n].concat(distractors(n, 2, 1, n + 3))), n);
  }

  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', { text: target.lbl + 'は ' + target.items.slice(0, 4).join(' ') + ' の なかま' }));
    const left = objs.find(o => o.dataset.hit === '1' && !o.classList.contains('counted'));
    if (left) left.classList.add('glow');
  });
}

/** The same things laid out one kind per row, ends lined up. This is the picture
    graph 1年生 build in「せいり」: once each group is a row, どれが おおい is read
    off the length instead of counted twice. */
function groupChart(api){
  const keys = sample(Object.keys(CATS), ri(2, 3));
  const counts = [];
  keys.forEach(() => {
    let v = ri(2, 7), guard = 0;
    while (counts.indexOf(v) >= 0 && guard++ < 60) v = ri(2, 7);
    counts.push(v);
  });
  const rows = keys.map((k, i) => ({ k, cat: CATS[k], n: counts[i], items: sample(CATS[k].items, counts[i]) }));
  const board = el('div.measure.chartboard');
  const asCount = chance(.45);
  const most = chance(.6);
  const target = asCount ? pick(rows) : null;
  const wantN = asCount ? target.n
    : (most ? Math.max.apply(null, counts) : Math.min.apply(null, counts));

  rows.forEach(r => {
    const row = el('div.mrow', { style: { cursor: asCount ? 'default' : 'pointer' } },
      el('div.cap', { text: r.cat.e }));
    const g = el('div.row', { style: { gap: 'calc(var(--u)*.3)', justifyContent: 'flex-start' } });
    r.items.forEach(e => g.append(el('span.item', { text: e, style: { fontSize: 'calc(var(--u)*2.4)' } })));
    row.append(g);
    row.dataset.n = r.n;
    if (!asCount){
      tappable(row, () => {
        if (api.locked) return;
        if (r.n === wantN){ row.classList.add('correct'); api.correct(); }
        else {
          row.classList.add('wrong');
          api.later(() => row.classList.remove('wrong'), 460);
          api.wrong(row);
        }
      });
    }
    board.append(row);
  });
  api.field.append(board);

  if (asCount){
    api.item('chart:' + target.k + ':' + target.n, target.cat.lbl + ' は ' + target.n + 'こ');
    api.setPrompt(`${target.cat.e} <b>${target.cat.lbl}</b> の なかまは いくつ？`,
                  `${target.cat.lbl}の仲間は、いくつ？`);
    api.buildChoices(shuffle([wantN].concat(distractors(wantN, 2, 1, 9))), wantN);
  } else {
    api.item('chartcmp:' + counts.slice().sort((a, b) => a - b).join('_') + ':' + (most ? 'g' : 'l'),
      counts.slice().sort((a, b) => a - b).join('と') + ' の ' + (most ? 'おおい' : 'すくない') + ' ほう');
    api.setPrompt(most ? 'いちばん <b>おおい</b> なかまは どれ？' : 'いちばん <b>すくない</b> なかまは どれ？',
                  most ? '一番多い仲間は、どれ？' : '一番少ない仲間は、どれ？');
  }
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    $$('.mrow', board).forEach(r => r.append(el('span.ordno', { text: r.dataset.n })));
    api.field.append(el('div.hintline', { text: 'はしを そろえて ながさを くらべよう' }));
  });
}

/** Five things, four of one kind. Naming the one that does not belong means
    holding the rule in mind, which is the other half of making a group. */
function oddOneOut(api){
  const [kA, kB] = sample(Object.keys(CATS), 2);
  const four = sample(CATS[kA].items, 4);
  const odd = pick(CATS[kB].items);
  api.item('odd:' + kA + '_' + kB, CATS[kA].lbl + ' の なかに ' + CATS[kB].lbl);
  api.setPrompt('なかまはずれは どれ？', '仲間はずれは、どれ？');
  api.field.append(el('div.hintline', { text: 'ほかの 4つと ちがう なかまを さがそう' }));
  api.buildChoices(shuffle(four.concat([odd])), odd);
  api.onHint(() => {
    if ($('.hint2', api.field)) return;
    api.field.append(el('div.hintline.hint2', { text: '4つは ' + CATS[kA].lbl + ' の なかまだよ' }));
  });
}

/** No single right answer: the child picks the rule first, then gathers to it.
    Both rules on the table are true of the same pile, so the app cannot be
    "guessed" — it can only be answered by holding one rule and applying it. */
function ownGroup(api){
  const keys = sample(Object.keys(CATS), 3);
  const per = 3;
  api.item('own:' + keys.slice().sort().join('_'), 'じぶんで きめて あつめる');
  api.setPrompt('あつめる なかまを じぶんで えらぼう', '集める仲間を、自分で選ぼう。');

  const picks = [];
  keys.forEach(k => sample(CATS[k].items, per).forEach(e => picks.push({ e, k })));
  const field = el('div.objfield');
  const pts = scatter(picks.length);
  const objs = [];
  shuffle(picks).forEach((p, i) => {
    const o = el('div.obj', { style: { left: (pts[i][0] * 100) + '%', top: (pts[i][1] * 100) + '%' } }, p.e);
    o.dataset.cat = p.k;
    objs.push(o);
    field.append(o);
  });
  api.field.append(field);

  let chosen = null, done = 0;
  keys.forEach(k => {
    const b = el('button.choice.pic', { type: 'button', text: CATS[k].lbl });
    b.addEventListener('click', () => {
      if (api.locked || chosen) return;
      chosen = k;
      Sound.sfx.tap();
      clear(api.choices);
      const cat = CATS[k];
      api.setPrompt(`<b>${cat.lbl}</b> を ぜんぶ あつめよう`, `${cat.lbl}を、全部集めよう。`);
      objs.forEach(o => tappable(o, () => tap(o)));
    });
    api.choices.append(b);
  });

  function tap(o){
    if (api.locked || o.classList.contains('counted')) return;
    if (o.dataset.cat !== chosen){
      o.classList.add('notmine');
      api.later(() => o.classList.remove('notmine'), 460);
      api.wrong(o);
      Sound.say(`それは${CATS[chosen].lbl}の仲間じゃないね。`, { delay: 260 });
      return;
    }
    done++;
    o.classList.add('counted');
    o.append(el('span.tag', { text: String(done) }));
    Sound.sfx.count(done - 1);
    Sound.say(numKana(done), { delay: 0, rate: 1.08 });
    if (done === per){
      api.later(() => {
        api.setPrompt(`${CATS[chosen].lbl} の なかまが <b>${per}</b>こ あつまったね！`,
                      `${CATS[chosen].lbl}の仲間が、${koKana(per)}集まったね。`);
        api.correct({ quiet: true, delay: 1200 });
        UI.bigMark('◯');
      }, 320);
    }
  }

  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', {
      text: chosen ? CATS[chosen].lbl + 'は ' + CATS[chosen].items.slice(0, 4).join(' ')
                   : 'どれでも いいよ。ひとつ えらんでね' }));
    if (chosen){
      const left = objs.find(o => o.dataset.cat === chosen && !o.classList.contains('counted'));
      if (left) left.classList.add('glow');
    }
  });
}

Games.add({
  id: 'g1set', name: 'なかまづくり', ico: '🎒', world: 'kyoshitsu', color: 'var(--c-orange)', stage: 'g1',
  aim: '<b>同じものの集まりを、自分で作ってから数える</b>力。1年生の最初の単元です。「6こ」という数は、机の上にあるもの全部の数ではなく、「くだもの」という<b>まとまりを決めた人がいて、初めて言える数</b>です。かぞえようが「いくつ？」だけを聞いていたのに対し、ここでは集める→数える、の順に進みます。表やグラフの入り口でもあります。',
  levels: [
    { t: 'なかまを あつめる', d: 'あつめてから かぞえる', make: collectSame },
    { t: 'どの なかまが おおい', d: 'ならべて くらべる', make: groupChart },
    { t: 'じぶんで きめる', d: 'なかまはずれ・じぶんで あつめる',
      make: api => chance(.5) ? oddOneOut(api) : ownGroup(api) }
  ]
});

/* ============================================================
   18. 1たい1で くらべる — one-to-one correspondence
   ============================================================ */
/* Two rows, and a pair is made by touching one from each. The pair takes a number
   on both halves, so the correspondence stays visible after the tap — this is the
   線でむすぶ of the textbook, done with a finger.

   Pairing is never wrong. Any top with any bottom is a legitimate pair, so there
   is nothing to guess at here: the question only starts once the pairing runs out
   and the child can see what is left over. */
function pairUp(api, na, nb, onSettled){
  const t1 = pick(THINGS);
  let t2 = pick(THINGS);
  for (let g = 0; g < 40 && t2.e === t1.e; g++) t2 = pick(THINGS);

  const board = el('div.pairboard');
  const rowA = el('div.pairrow'), rowB = el('div.pairrow');
  const made = { a: t1, b: t2, na, nb, pairs: 0, rowA, rowB, board };
  let marked = null, settled = false;

  function itemsOf(row){ return $$('.pairitem', row); }

  function settle(){
    settled = true;
    [rowA, rowB].forEach(r => itemsOf(r).forEach(x => {
      if (!x.classList.contains('paired')) x.classList.add('leftover');
    }));
    if (marked){ marked.classList.remove('marked'); marked = null; }
    onSettled(made);
  }

  function tap(it){
    // once the pairing has run out the board is the answer, not an input: a tap on
    // a leftover must not put a selection ring round it while the question is being read
    if (api.locked || settled || it.classList.contains('paired')) return;
    if (!marked || marked.dataset.side === it.dataset.side){
      if (marked) marked.classList.remove('marked');
      marked = it;
      it.classList.add('marked');
      Sound.sfx.tap();
      return;
    }
    made.pairs++;
    [marked, it].forEach(x => {
      x.classList.remove('marked');
      x.classList.add('paired');
      x.append(el('span.tag', { text: String(made.pairs) }));
    });
    marked = null;
    Sound.sfx.count(made.pairs - 1);
    Sound.say(numKana(made.pairs), { delay: 0, rate: 1.08 });
    if (made.pairs === Math.min(na, nb)) api.later(settle, 620);
  }

  const fill = (row, thing, n, side) => {
    for (let i = 0; i < n; i++){
      const it = el('div.qi.pairitem', { text: thing.e });
      it.dataset.side = side;
      tappable(it, () => tap(it));
      row.append(it);
    }
  };
  fill(rowA, t1, na, 'a');
  fill(rowB, t2, nb, 'b');
  board.append(rowA, el('div.pairgap', { 'aria-hidden': 'true' }), rowB);
  api.field.append(board);

  api.setPrompt(`${t1.e} と ${t2.e} を <b>1つずつ</b> ペアに しよう`,
                `${t1.n}と${t2.n}を、一つずつペアにしよう。`);
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', { text: 'うえを 1つ タップ、つぎに したを 1つ タップ' }));
    const a = itemsOf(rowA).find(x => !x.classList.contains('paired'));
    if (a) a.classList.add('marked');
  });
  return made;
}

/* Each of these three names its item *before* calling pairUp, not inside the
   settle callback: the engine reads the item straight after make() returns, and an
   unnamed question drops out of the shuffle bag and out of 集中練習. */

/** Which row has something left over — including「おなじ」, which is the case a
    child who only ever counts the longer row never meets. */
function pairWhichMore(api){
  const same = chance(.3);
  const na = ri(3, 7);
  let nb = same ? na : clamp(na + pick([1, 2, -1, -2]), 2, 8);
  if (!same && nb === na) nb = na + 1;
  api.item('more:' + Math.min(na, nb) + '_' + Math.max(na, nb),
    na === nb ? na + ' と ' + nb + ' は おなじ'
              : Math.max(na, nb) + ' と ' + Math.min(na, nb) + ' の くらべ');
  pairUp(api, na, nb, made => {
    const A = made.na, B = made.nb;
    const ans = A === B ? 'おなじ' : (A > B ? made.a.e : made.b.e);
    api.setPrompt('ペアに ならなかったのは どっち？　どちらが <b>おおい</b>？',
                  'ペアにならなかったのは、どっち？　どちらが多い？');
    api.buildChoices(shuffle([made.a.e, made.b.e, 'おなじ']), ans);
  });
}

/** 求差. The leftover *is* the difference — the child reads it off the board
    instead of taking one number away from another. */
function pairHowManyMore(api){
  const na = ri(3, 9);
  let nb = clamp(na + pick([1, 2, 3, -1, -2, -3]), 2, 9);
  if (nb === na) nb = na === 9 ? 8 : na + 1;
  api.item('diff1to1:' + Math.max(na, nb) + '-' + Math.min(na, nb),
    Math.max(na, nb) + ' と ' + Math.min(na, nb) + ' の ちがい');
  pairUp(api, na, nb, made => {
    const A = made.na, B = made.nb;
    const big = A > B ? made.a : made.b, ans = Math.abs(A - B);
    api.setPrompt(`${big.e} は いくつ <b>おおい</b>？`, `${big.n}は、いくつ多い？`);
    api.field.append(el('div.eq', null,
      String(Math.max(A, B)), el('span.op', { text: '−' }), String(Math.min(A, B)),
      el('span.op', { text: '＝' }), el('span.box', { text: '?' })));
    api.buildPad(ans);
    api.onHint(() => {
      const left = $$('.pairitem.leftover', made.board);
      left.forEach((x, i) => { if (!$('.tag', x)) x.append(el('span.tag.left', { text: String(i + 1) })); });
    });
  });
}

/** Making the two rows the same length. Same difference, opposite direction:
    「あと いくつ たすと おなじ」 is where 求補 comes from. */
function pairMakeSame(api){
  const big = ri(4, 8), small = clamp(big - ri(1, 3), 1, 7);
  // either row can be the short one: always shortening the bottom row would let a
  // child answer from where the gap is rather than from how big it is
  const flip = chance(.5);
  const na = flip ? small : big, nb = flip ? big : small;
  const byTapping = chance(.5);
  api.item('same1to1:' + big + '-' + small, small + ' を ' + big + ' に そろえる');
  pairUp(api, na, nb, made => {
    const A = made.na, B = made.nb;
    const short = A < B ? made.rowA : made.rowB;
    const shortThing = A < B ? made.a : made.b;
    const need = Math.abs(A - B);
    if (byTapping){
      api.setPrompt(`${shortThing.e} を たして <b>おなじ かず</b>に しよう`,
                    `${shortThing.n}を足して、同じ数にしよう。`);
      let added = 0;
      for (let i = 0; i < need + 2; i++){
        const slot = el('div.cell.tappable.pairslot');
        tappable(slot, () => {
          if (api.locked || slot.dataset.filled === '1') return;
          slot.dataset.filled = '1';
          slot.classList.remove('tappable');
          slot.textContent = shortThing.e;
          added++;
          Sound.sfx.place();
          if (added === need){
            $$('.pairslot', short).forEach(s => { if (s.dataset.filled !== '1') s.remove(); });
            api.later(() => {
              api.setPrompt(`どちらも <b>${Math.max(A, B)}</b>こ。おなじに なったね！`,
                            `どちらも${koKana(Math.max(A, B))}。同じになったね。`);
              api.correct({ quiet: true, delay: 1300 });
              UI.bigMark('◯');
            }, 300);
          }
        });
        short.append(slot);
      }
      api.onHint(() => {
        $$('.pairitem.leftover', made.board).forEach(x => x.classList.add('marked'));
      });
    } else {
      api.setPrompt(`おなじ かずに するには ${shortThing.e} が あと いくつ？`,
                    `同じ数にするには、${shortThing.n}があといくつ？`);
      api.buildPad(need, {
        correctOpts: { delay: 1400 },
        onPick(){
          for (let i = 0; i < need; i++){
            api.later(() => {
              short.append(el('div.qi.pairitem.paired.added', { text: shortThing.e }));

/* ============================================================
   19. 20までの かず — ten and some more
   ============================================================ */
/* A full ten-frame is one thing, not ten: that is the whole idea of place value,
   and it is the reason 1年生 spend weeks on 11〜20 before touching くり上がり. The
   left frame is never re-counted here — it is always exactly ten. */
function teenFrames(total, opts){
  const o = opts || {};
  const ones = Math.max(0, total - 10);
  const ten = el('div.tenframe.fullten', { style: { '--cols': 5 } });
  for (let i = 0; i < 10; i++) ten.append(el('div.cell', null, el('div.dot')));
  const rest = el('div.tenframe', { style: { '--cols': 5 } });
  for (let i = 0; i < 5; i++){
    const c = el('div.cell' + (i >= ones ? '.hole' : ''));
    if (i < ones) c.append(el('div.dot.b'));
    rest.append(c);
  }
  const set = el('div.frameset', null,
    el('div.framelabel', null, ten, el('small', { text: o.mute ? '' : '10' })),
    el('div.framelabel', null, rest, el('small', { text: o.mute ? '' : String(ones) })));
  return set;
}

function tenAndSome(api){
  const ones = ri(1, 9), total = 10 + ones;
  api.item('teen:' + total, '10と ' + ones + ' で ' + total);
  api.setPrompt(`<b>10</b> と <b>${ones}</b> で いくつ？`, `10と${numKana(ones)}で、いくつ？`);
  api.field.append(teenFrames(total),
    el('div.eq', null, '10', el('span.op', { text: 'と' }), String(ones),
      el('span.op', { text: 'で' }), el('span.box', { text: '?' })));
  api.buildPad(total, { lo: 10, hi: 20 });
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', { text: 'ひだりは かぞえなくて いいよ。ぴったり 10だから、じゅう…' }));
    Sound.say('左は数えなくていいよ。ぴったり10だから、じゅう…', { delay: 200 });
  });
}

/** The other direction: given 14, say how many are left over once ten are taken
    as one group. Reading a teen number as「10と4」is the skill, not saying it. */
function teenSplit(api){
  const total = ri(11, 19), ones = total - 10;
  api.item('teensplit:' + total, total + ' は 10と ' + ones);
  api.setPrompt(`<b>${total}</b> は 10と いくつ？`, `${numKana(total)}は、10といくつ？`);
  api.field.append(teenFrames(total, { mute: true }),
    el('div.eq', null, String(total), el('span.op', { text: 'は' }), '10',
      el('span.op', { text: 'と' }), el('span.box', { text: '?' })));
  api.buildPad(ones, { lo: 0, hi: 10 });
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', { text: 'みぎの わくの あかい ○を かぞえよう' }));
  });
}

/** 12+3, 17−4 — the ten stays whole and only the ones move. This is the last
    step before くり上がり, and the one that makes くり上がり make sense. */
function teenCalc(api){
  const plus = chance(.55);
  const ones = plus ? ri(1, 5) : ri(4, 9);
  const b = plus ? ri(1, 9 - ones) : ri(1, ones - 1);
  const a = 10 + ones, ans = plus ? a + b : a - b;
  api.item((plus ? 'teensum:' : 'teenrest:') + a + (plus ? '+' : '-') + b,
    a + (plus ? ' ＋ ' : ' − ') + b);
  api.setPrompt('しきを みて こたえよう',
                `${numKana(a)}、${plus ? 'たす' : 'ひく'}、${numKana(b)}は？`);
  api.field.append(el('div.eq', null,
    String(a), el('span.op', { text: plus ? '＋' : '−' }), String(b),
    el('span.op', { text: '＝' }), el('span.box', { text: '?' })));
  api.buildPad(ans, { lo: 10, hi: 20 });
  api.onHint(() => {
    if ($('.frameset', api.field)) return;
    api.field.prepend(teenFrames(a, { mute: true }));
    api.field.append(el('div.hintline', {
      text: plus ? '10は そのまま。ばらの ' + ones + ' に ' + b + ' を たそう'
                 : '10は そのまま。ばらの ' + ones + ' から ' + b + ' を ひこう' }));
  });
}

/* ============================================================
   20. しきに かこう — the story and the sentence
   ============================================================ */
/* たしざん / ひきざん already ask for the answer to a story. 1年生 are asked for
   something else first: which sentence the story *is*. Choosing between 5＋2 and
   5−2 for the same picture, and then reading 5−2 back out as a story, is where
   ＋ and − stop being buttons and start being meanings (合併・増加 / 求残・求差). */
function pickEquation(api){
  const plus = chance(.5);
  const a = ri(2, 7), b = ri(1, Math.min(4, a - 1)), thing = pick(THINGS);
  const ans = (plus ? a + '＋' + b : a + '−' + b);
  api.item((plus ? 'shiki+:' : 'shiki-:') + a + '_' + b,
    a + (plus ? ' ＋ ' : ' − ') + b + ' の しき');
  api.setPrompt(
    plus ? `${thing.e} が ${numTag(a)}つ。${numTag(b)}つ やってきたよ`
         : `${thing.e} が ${numTag(a)}つ。${numTag(b)}つ いなくなるよ`,
    plus ? `${thing.n}が${tsuKana(a)}。${tsuKana(b)}、やってきたよ。`
         : `${thing.n}が${tsuKana(a)}。${tsuKana(b)}、いなくなるよ。`);
  storyScene(api, a, b, plus ? '+' : '-', thing, () => {
    api.setPrompt('この おはなしの <b>しき</b> は どれ？', 'このお話の式は、どれ？');
    // a third option with a different second number, kept inside 1..a-1 so that
    // 「5−6」 never appears on a screen a six-year-old is reading
    const pool = range(1, plus ? 9 - a : a - 1).filter(v => v !== b);
    const other = pool.length ? pick(pool) : b + 1;
    const opts = [ans, (plus ? a + '−' + b : a + '＋' + b), a + (plus ? '＋' : '−') + other];
    api.buildChoices(shuffle(opts), ans);
    api.onHint(() => {
      if ($('.hintline', api.field)) return;
      api.field.append(el('div.hintline', {
        text: plus ? 'ふえた ときは ＋（たす）だよ' : 'へった ときは −（ひく）だよ' }));
    });
  });
}

/* A story in words only. Without a picture to count, ＋ or − has to come from
   what happened — which is the thing that actually transfers to 文章題. */
const WORD_STORIES = [
  { op: '+', t: (a, b, x) => `${x.n}が ${a}こ あります。${b}こ もらいました。`,
    s: (a, b, x) => `${x.n}が${koKana(a)}あります。${koKana(b)}もらいました。`, q: 'ぜんぶで いくつ？' },
  { op: '+', t: (a, b, x) => `${x.n}が ${a}こ。あとから ${b}こ ふえました。`,
    s: (a, b, x) => `${x.n}が${koKana(a)}。あとから${koKana(b)}増えました。`, q: 'ぜんぶで いくつ？' },
  { op: '-', t: (a, b, x) => `${x.n}が ${a}こ あります。${b}こ たべました。`,
    s: (a, b, x) => `${x.n}が${koKana(a)}あります。${koKana(b)}食べました。`, q: 'のこりは いくつ？' },
  { op: '-', t: (a, b, x) => `${x.n}が ${a}こ あります。${b}こ あげました。`,
    s: (a, b, x) => `${x.n}が${koKana(a)}あります。${koKana(b)}あげました。`, q: 'のこりは いくつ？' }
];

function plusOrMinus(api){
  const st = pick(WORD_STORIES);
  const plus = st.op === '+';
  const a = plus ? ri(2, 6) : ri(3, 9);
  const b = plus ? ri(1, 10 - a) : ri(1, a - 1);
  const ans = plus ? a + b : a - b;
  const thing = pick(THINGS);
  api.item((plus ? 'word+:' : 'word-:') + a + '_' + b,
    a + (plus ? ' ＋ ' : ' − ') + b + ' の おはなし');
  api.setPrompt('この おはなしは <b>たしざん</b>？ <b>ひきざん</b>？',
                st.s(a, b, thing) + st.q + '足し算か、引き算か、選ぼう。');
  const card = el('div.storycard', null,
    el('div.e', { text: thing.e }),
    el('div.lines', null,
      el('div.tx', { text: st.t(a, b, thing) }),
      el('div.qx', { text: st.q })));
  api.field.append(card);
  const eq = el('div.eq', null,
    String(a), el('span.op.opbox', { text: '?' }), String(b),
    el('span.op', { text: '＝' }), el('span.box', { text: '?' }));
  api.field.append(eq);
  api.buildChoices(['＋', '−'], plus ? '＋' : '−', {
    onPick(v){
      $('.opbox', eq).textContent = v;
      $('.opbox', eq).classList.add('filled');
      Sound.sfx.place();
      api.later(() => {
        api.setPrompt(st.q, st.q);
        api.buildPad(ans);
      }, 420);
      return false;                    // the operation was only half the question
    }
  });
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', {
      text: plus ? 'ふえた・もらった → ＋' : 'へった・たべた・あげた → −' }));
  });
}

/** The reverse direction: here is 5−2, which story is it about? A child who can
    only run stories forwards has not yet got the sentence. */
function matchStory(api){
  const plus = chance(.5);
  const a = plus ? ri(2, 6) : ri(4, 9);
  const b = plus ? ri(1, 10 - a) : ri(1, a - 2);
  const thing = pick(THINGS);
  let c = b + pick([1, 2]);
  if (!plus && c >= a) c = b - 1 || b + 1;
  api.item((plus ? 'read+:' : 'read-:') + a + '_' + b,
    a + (plus ? ' ＋ ' : ' − ') + b + ' に あう おはなし');
  api.setPrompt(`<b>${a} ${plus ? '＋' : '−'} ${b}</b> の おはなしは どれ？`,
                `${numKana(a)}、${plus ? 'たす' : 'ひく'}、${numKana(b)}のお話は、どれ？`);
  api.field.append(el('div.eq', null,
    String(a), el('span.op', { text: plus ? '＋' : '−' }), String(b)));
  const line = (n, verb) => `${thing.n}が ${a}こ。\n${n}こ ${verb}`;
  const right   = plus ? line(b, 'もらった') : line(b, 'たべた');
  const wrongOp = plus ? line(b, 'たべた')   : line(b, 'もらった');
  const wrongN  = plus ? line(c, 'もらった') : line(c, 'たべた');
  api.buildChoices(shuffle([right, wrongOp, wrongN]), right, {
    cls: 'story',
    // one sentence per line: a narrow button breaks Japanese wherever it likes,
    // and 「た/べた」 across two lines is not something a six-year-old should have
    // to reassemble before they can answer
    render: v => el('span', null, v.split('\n').map((t, i) => i ? [el('br'), t] : t))
  });
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', {
      text: plus ? '＋ は ふえる おはなし。かずも おなじか みてね'
                 : '− は へる おはなし。かずも おなじか みてね' }));
  });
}

/* ===========================================================
   89 — first-run diagnostic, recommendations, and real-world missions
   =========================================================== */
'use strict';

const Diagnostic = (() => {
  const ORDER = ['count', 'numeral', 'seq', 'compare', 'ordinal', 'measure',
                 'bond', 'shape', 'pattern', 'clock'];

  function shouldRun(){
    return !Store.data.diagnostic
      && Store.totalStars() === 0
      && Object.keys(Store.data.recent || {}).length === 0;
  }

  function recommendFrom(outcomes){
    const xs = outcomes || [];
    for (const id of ORDER){
      const x = xs.find(o => o.gameId === id);
      if (x && !x.clean) return { gameId: id, levelIndex: 0 };
    }
    return { gameId: 'flash', levelIndex: 0 };
  }

  function current(){
    let weakest = null;
    Games.list.forEach(g => g.levels.forEach((lv, i) => {
      if (!levelOpen(g, i)) return;
      const n = Store.recentCount(g.id, i);
      if (n < 4) return;
      const acc = Store.recentAccuracy(g.id, i);
      if (!weakest || acc < weakest.acc) weakest = { gameId: g.id, levelIndex: i, acc };
    }));
    if (weakest && weakest.acc < .75) return weakest;

    const first = Store.data.diagnostic && Store.data.diagnostic.recommended;
    if (first && Games.byId[first.gameId]
        && levelOpen(Games.byId[first.gameId], first.levelIndex || 0)
        && Store.stars(first.gameId, first.levelIndex || 0) < 2) return first;

    /* Once the 入学前 half is finished there is nothing left under 2 stars to
       recommend there, so the queue continues into the classroom. */
    const order = Progress.g1Open()
      ? ['count', 'flash', 'numeral', 'seq', 'bond', 'g1set', 'g1pair', 'g1teen', 'g1shiki']
      : ['count', 'flash', 'numeral', 'seq', 'bond'];
    for (const id of order){
      const g = Games.byId[id];
      if (!g) continue;
      for (let i = 0; i < g.levels.length; i++){
        if (levelOpen(g, i) && Store.stars(id, i) < 2) return { gameId: id, levelIndex: i };
      }
    }
    return { gameId: 'bond', levelIndex: 0 };
  }

  function startRecommended(){
    const r = current(), g = r && Games.byId[r.gameId];
    if (g && g.levels[r.levelIndex]) Session.startLevel(g, r.levelIndex);
    else Session.startDaily(10);
  }

  return { shouldRun, recommendFrom, current, startRecommended };
})();

    let m = Store.mission(day);
