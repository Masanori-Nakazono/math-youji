const IslandJobs = (() => {
  const SCENES = {
    boat: { icon: '⛵️', item: '🐥', label: 'ふねに のせる', unit: 'ひき' },
    snack: { icon: '🧺', item: '🍎', label: 'おやつを つめる', unit: 'こ' }
  };
  let node, sceneButtons, prompt, slots, actions, message, scene = 'boat';
  function build(){
    if (node) return node;
    sceneButtons = el('div.job-scenes'); prompt = el('div.job-prompt');
    slots = el('div.job-slots'); actions = el('div.job-actions');
    message = el('div.job-message', { role: 'status', 'aria-live': 'polite' });
    node = el('div#island-jobs', null,
      el('div.topbar', null,
        el('button.btn.btn-ghost.btn-round', { type: 'button', 'aria-label': 'しまに もどる',
          onclick(){ Sound.sfx.tap(); StickerWorld.open(); } }, '←'),
        el('h2', { text: 'しまの おしごと' }), speakBtn(() => jobSpeech())),
      sceneButtons, prompt, slots, message, actions);
    Object.keys(SCENES).forEach(k => sceneButtons.append(el('button.btn.job-scene', {
      type: 'button', onclick(){ Sound.sfx.tap(); scene = k; Store.startIslandJob(k); render(); Sound.say(jobSpeech(), { delay: 120 }); }
    }, SCENES[k].icon + ' ' + SCENES[k].label)));
    return UI.register('island-jobs', node);
  }
  function jobSpeech(){
    const j = Store.islandJob(scene), s = SCENES[scene];
    if (!j) return '島のお仕事を選んでね。';
    if (j.done) return j.start + 'と' + (j.size - j.start) + 'で' + j.size + '。できた場面が島に残ったよ。';
    if (j.placed === j.size - j.start) return 'いくつ増やしたかな。新しく置いたものを数えてね。';
    return j.size + 'この場所に、' + j.start + s.unit + 'いるよ。空いているところに一つずつ置こう。';
  }
  const action = (label, fn, accent) => el('button.btn' + (accent ? '.btn-accent' : ''),
    { type: 'button', onclick(){ Sound.sfx.tap(); fn(); } }, label);
  function render(){
    build();
    const j = Store.startIslandJob(scene), s = SCENES[scene];
    $$('.job-scene', sceneButtons).forEach((b, i) => b.classList.toggle('selected',
      Object.keys(SCENES)[i] === scene));
    prompt.textContent = j.done ? s.icon + '　' + s.label + '　かんせい！'
      : j.placed === j.size - j.start ? 'あたらしく いくつ いれたかな？'
      : s.icon + '　' + j.size + 'この ばしょに ' + j.start + s.unit + '。あいた ところに いれよう';
    clear(slots);
    for (let i = 0; i < j.size; i++){
      const next = !j.done && i === j.start + j.placed && j.placed < j.size - j.start;
      slots.append(el((next ? 'button' : 'span') + '.job-slot' + (i >= j.start ? '.new' : '')
        + (next ? '.next' : ''), {
        type: next ? 'button' : undefined,
        text: i < j.start + j.placed ? s.item : '·',
        'aria-label': next ? 'ここに ひとつ いれる'
          : i < j.start + j.placed ? (i < j.start ? 'はじめから いた' : 'あたらしく いれた') : 'あいている',
        onclick: next ? () => { Store.addIslandJobPiece(scene); Sound.sfx.place(); render();
          Sound.say(jobSpeech(), { delay: 100 }); } : undefined
      }));
    }
    clear(actions); message.textContent = '';
    if (j.done){
      message.textContent = j.start + ' と ' + (j.size - j.start) + ' で ' + j.size + '！';
      actions.append(action('🏡 しまを みる', () => StickerWorld.open(), true),
        action('🔄 あたらしい おしごと', () => { Store.startIslandJob(scene, true); render(); Sound.say(jobSpeech(), { delay: 120 }); }));
    } else if (j.placed < j.size - j.start){
      actions.append(action('+1 ' + s.item + ' ひとつ いれる', () => {
        Store.addIslandJobPiece(scene); render(); Sound.say(jobSpeech(), { delay: 100 });
      }, true));
    } else {
      const answer = j.size - j.start;
      const options = [answer, answer - 1, answer + 1].filter(x => x >= 1 && x <= 10).sort((a, b) => a - b);
      options.forEach(n => actions.append(action(n + s.unit, () => {
        if (n !== answer){
          message.textContent = 'あたらしく いれた ' + s.item + ' を かぞえてみよう';
          Sound.say('新しく入れたものを数えてみよう。', { delay: 100 });
          return;
        }
        Store.finishIslandJob(scene); Sound.sfx.finish(); render();
        Sound.say(jobSpeech(), { delay: 180 });
      }, false)));
    }
  }
  function open(which){
    if (SCENES[which]) scene = which;
    render(); UI.show('island-jobs'); Sound.say(jobSpeech(), { delay: 150 });
  }
  return { build, render, open };
})();

/* ---- 89-experience.js ---- */
/* ===========================================================
   89 — first-run diagnostic, recommendations, and real-world missions
   =========================================================== */
'use strict';

const Diagnostic = (() => {
  const ORDER = ['count', 'numeral', 'seq', 'compare', 'ordinal', 'measure',
                 'bond', 'shape', 'pattern', 'clock'];

  function shouldRun(){
    return !Store.data.diagnostic
      && Store.totalStars() === 0
      && Object.keys(Store.data.recent || {}).length === 0;
  }

  function recommendFrom(outcomes){
    const xs = outcomes || [];
    for (const id of ORDER){
      const x = xs.find(o => o.gameId === id);
      if (x && !x.clean) return { gameId: id, levelIndex: 0 };
    }
    return { gameId: 'flash', levelIndex: 0 };
  }

  /* The order the six-month roadmap actually walks. 「いまの おすすめ」 used to know
     only five of the sixteen 入学前 games, so a child who followed it every day was
     told to replay いくつと いくつ L1 for the rest of the year: 180 simulated days of
     きょうの れんしゅう + おすすめ cleared 15 of the 48 levels at 95% accuracy and 33 at
     75% — the door that opens 小学1年生 never opened, and the *more* accurate the
     child, the less they were moved on, because the only way past those five games
     was the「struggling」rescue below, which an accurate child never trips.

     Everything registered is walked, in curriculum order; a game added later and
     not named here still lands at the end rather than dropping out. */
  const ROADMAP = ['count', 'flash', 'numeral', 'seq', 'trace',
                   'compare', 'ordinal', 'measure',
                   'bond', 'ten', 'add', 'sub',
                   'shape', 'sort', 'pattern', 'clock',
                   'g1set', 'g1pair', 'g1teen', 'g1shiki'];
  function roadmap(){
    const seen = new Set(), out = [];
    ROADMAP.forEach(id => { if (Games.byId[id]){ out.push(id); seen.add(id); } });
    Games.list.forEach(g => { if (!seen.has(g.id)) out.push(g.id); });
    return out;
  }

  /* Done with a level = it has its clear sticker. Deliberately the same thing the
     door counts, so the level おすすめ names is always a level the door is waiting
     for — and a ★★★ level can never be recommended again. */
  /* A provisional clear counts as done here — the day it was earned, naming it again
     would send the child straight back — until a check on another day fails. Then
     the gap is real, and おすすめ goes back for it. */
  const cleared = (id, i) => Store.hasSticker(id + ':' + i) && !Store.checkFailed(id + ':' + i);

  /* A level tried three times without a pass has already opened the next one — the
     rule that no child is left at a padlock. おすすめ did not follow it: it named the
     first uncleared level, so one level a child could not yet pass was named every
     day and nothing after it ever came up. Once it has had its three goes it rests
     for a few days, and the roadmap moves on; it comes back afterwards, and it comes
     back at once if there is nothing else left to name. */
  const REST_DAYS = 3;
  const resting = (id, i) => !cleared(id, i) && Store.plays(id, i) >= 3 && Store.daysSince(id, i) < REST_DAYS;

  function nextUncleared(){
    for (const skipResting of [true, false]){
      for (const id of roadmap()){
        const g = Games.byId[id];
        if (!g) continue;
        for (let i = 0; i < g.levels.length; i++){
          if (!levelOpen(g, i) || cleared(id, i)) continue;
          if (skipResting && resting(id, i)) continue;
          return { gameId: id, levelIndex: i };
        }
      }
    }
    return null;
  }

  /** The weakest open level with enough evidence to say so, or null.
      `unclearedOnly` leaves out levels that already have their clear sticker. */
  function weakestLevel(unclearedOnly){
    let weakest = null;
    Games.list.forEach(g => g.levels.forEach((lv, i) => {
      if (!levelOpen(g, i)) return;
      if (unclearedOnly && (cleared(g.id, i) || resting(g.id, i))) return;
      const n = Store.recentCount(g.id, i);
      if (n < 4) return;
      const acc = Store.recentAccuracy(g.id, i);
      if (!weakest || acc < weakest.acc) weakest = { gameId: g.id, levelIndex: i, acc };
    }));
    return weakest;
  }

  /* Below this, the child is not making progress and the day is better spent going
     back. It used to be .75 — but 75% first-try is a pass (★★), so an ordinary child
     was held on the same level instead of being shown the next one. Rescue is for
     being stuck, not for being imperfect. */
  const STUCK = 0.60;

  function current(){
    /* Rescue is for a level the child has not got past yet. A cleared level that
       has gone shaky is what きょうの れんしゅう and にがて あつめ are for — rescuing it
       here had no exit: a child at 40% on a cleared level was named it day after day
       (a median of 49 days in simulation) while nothing new came up. An uncleared
       level does have one: clearing it takes it out of here. */
    const stuck = weakestLevel(true);
    if (stuck && stuck.acc < STUCK) return stuck;

    /* はじめの ぼうけん picked a starting point; honour it until it is cleared. */
    const first = Store.data.diagnostic && Store.data.diagnostic.recommended;
    if (first && Games.byId[first.gameId]
        && levelOpen(Games.byId[first.gameId], first.levelIndex || 0)
        && !cleared(first.gameId, first.levelIndex || 0)
        && !resting(first.gameId, first.levelIndex || 0)) return first;

    const next = nextUncleared();
    if (next) return next;

    // everything open is cleared: go back to whatever is shakiest rather than
    // naming a level that has nothing left to give
    const weakest = weakestLevel();
    if (weakest) return weakest;
    let lowest = null;
    Games.list.forEach(g => g.levels.forEach((lv, i) => {
      if (!levelOpen(g, i)) return;
      const s = Store.stars(g.id, i);
      if (!lowest || s < lowest.stars) lowest = { gameId: g.id, levelIndex: i, stars: s };
    }));
    return lowest || { gameId: 'count', levelIndex: 0 };
  }

  function startRecommended(){
    const r = current(), g = r && Games.byId[r.gameId];
    if (g && g.levels[r.levelIndex]){
      if (g.intro !== false && !Store.introduced(g.id, r.levelIndex)) FirstSteps.open(g, r.levelIndex);
      else Session.startLevel(g, r.levelIndex);
    }
    else Session.startDaily(10);
  }

  return { shouldRun, recommendFrom, current, startRecommended, nextUncleared };
})();

  const today = () => Store.todayKey();

          }))));

     1-digit sums in a row, and five seconds' wait after a slip — which is the lock
     on「記録をすべて消す」, for the lightest thing an adult does all day, often with
     a pan in the other hand. So it was mostly never pressed, and the next day's
     「どうやったか」never came. A two-second press says an adult was there; a tap
     only says how. */
  const HOLD_MS = 2000;
  let holdTimer = null, holdDone = null, held = false;
  function stopHold(){
    clearTimeout(holdTimer); holdTimer = null; holdDone = null;
    if (doneBtn) doneBtn.classList.remove('holding');
  }
  function holdToConfirm(onDone){
    doneBtn.classList.add('holdbtn');
    doneBtn.style.setProperty('--hold', HOLD_MS + 'ms');
    doneBtn.onpointerdown = e => {
      e.preventDefault();
      stopHold();
      doneBtn.classList.add('holding');
      holdDone = () => { stopHold(); held = true; onDone(); };
      holdTimer = setTimeout(holdDone, HOLD_MS);
    };
    doneBtn.onpointerup = doneBtn.onpointerleave = doneBtn.onpointercancel = stopHold;
    doneBtn.onclick = () => {
      if (held){ held = false; return; }             // the click that ends a finished press
      Sound.say('おうちの人が、2秒長押ししてね。', { delay: 60 });
    };
  }
  function plainButton(onclick){
    stopHold();
    doneBtn.classList.remove('holdbtn');
    doneBtn.onpointerdown = doneBtn.onpointerup = doneBtn.onpointerleave = doneBtn.onpointercancel = null;
    doneBtn.onclick = onclick;
  }

  function open(mission){
    build();
    titleEl.textContent = 'きょうの さんすう ミッション';
    promptEl.textContent = mission.text;
    noteEl.textContent = mission.prompt;
    doneBtn.textContent = 'おうちのひとが ながおし（2びょう）';

      Store.completeMission(mission.day);
      Sound.sfx.finish();
      Home.render();
      UI.show('home', { replace: true });
    });
    UI.show('mission');
    Sound.say(mission.text + '。' + mission.prompt, { delay: 250 });
  }

  function openReview(mission){
    build();
    titleEl.textContent = 'きのうの ミッション';
    promptEl.textContent = mission.text;
    noteEl.textContent = 'どんな ふうに できたか、おうちのひとに おはなししよう';
    doneBtn.textContent = 'おはなし できた！';
    plainButton(() => {
      Store.reviewMission(mission.day);
      Sound.sfx.correct();
      Home.render();
      UI.show('home', { replace: true });
    });
    UI.show('mission');
    Sound.say('昨日のミッション、どんなふうにできたかお話ししよう。', { delay: 250 });
  }

  function resultCard(gameId){
    const m = forGame(gameId || 'count');
    const b = el('button.result-mission', { type: 'button', onclick(){ open(m); } },
      el('b', { text: 'きょうの さんすう ミッション' }),
      el('span', { text: m.text }),
      el('small', { text: m.done ? 'できました！' : 'おうちのひとと やってみよう' }));
    return b;
  }

  return { forGame, yesterdayReview, open, openReview, resultCard,
           /** test seam: end a press that has started, without waiting two seconds */
           _test: { finishHold(){ if (holdDone) holdDone(); } } };
})();

  const BANNER_ICON = { recommend: '🗺️', first: '🧭', daily: '📅', review: '💬', focus: '🎯' };
  function homeSpeech(){
    const names = [recommendEl, dailyEl, reviewEl, focusEl]
      .filter(b => b && !b.hidden).map(b => ($('.t', b) || {}).textContent).filter(Boolean);
    return '上のボタンから選んでね。' + names.join('、') + '。下の地図から、好きな遊びも選べるよ。';

  function gameCard(g){
    /* These used to count "levels with any star at all", so three scraped passes

    const earned = Store.gameStars(g.id, g.levels.length);
    const max = g.levels.length * 3;
    /* The three home stars are a rounded summary, so ★★★ can also mean a game

       another sticker to earn.  The gold frame uses the shelf itself as the
       source of truth: every level must have both its clear and gold sticker. */
    const collected = g.levels.every((lv, i) =>
      Store.hasSticker(g.id + ':' + i) && Store.hasSticker(g.id + ':' + i + ':g'));
    const done = earned === 0 ? 0 : Math.max(1, Math.round((earned / max) * 3));
    const st = el('div.st');
    for (let i = 0; i < 3; i++) st.append(starSVG(i < done));
    return el('button.gamecard' + (collected ? '.collected' : ''), {
      type: 'button', title: g.name + '　★ ' + earned + '/' + max
        + (collected ? '　シール ぜんぶ ゲット' : '　まだ シールが あるよ'),
      onclick(){
        Sound.sfx.tap();
        Levels.render(g);
        UI.show('levels');
        // the child picked a picture; say the name of what they picked
        Sound.say(Levels.speech(), { delay: 120 });
      }
    },
      el('div.ico', { text: g.ico }),
      el('div.nm', { text: g.name }),
      st,
      collected ? el('div.collectmark', {
        text: '👑', 'aria-label': 'シール ぜんぶ ゲット'
      }) : null);
  }

  /* The classroom is on this screen from the first day, behind a padlock.

     It was hidden until the shelf was half full, on the theory that a lock a child
     cannot open yet is discouraging. That is true of a lock with nothing behind it
     — and this one has four named games behind it. Seeing 「なかまづくり」 and
     「20までの かず」 sitting there, greyed out, is the reason to fill the shelf;
     an empty space where they would be is not. Tapping one says how to get in and
     goes to the sticker book, which is where the count lives.

     What opens it is clearing all 48 入学前 levels — the plain stickers. The gold
     ones (a run with every answer right first time) stay a thing worth going back
     for; they are not part of the key. */
  function lockedCard(g){
    return el('button.gamecard.locked', {
      type: 'button', title: g.name + '　' + Progress.unlockHint(g),
      onclick(){
        Sound.sfx.tap();
        Book.render();
        UI.show('book');
        // after the switch: UI.show hushes anything queued before it
        Sound.say(Progress.unlockHint(g), { delay: 120 });
      }
    },
      el('div.ico', { text: g.ico }),
      el('div.nm', { text: g.name }),
      el('div.lockhint', { text: Progress.pathProgress(g).got + '／' + Progress.pathProgress(g).total }),
      el('div.lockmark', { text: '🔒' }));
  }

  function render(){
    build();
    starEl.textContent = String(Store.totalStars());
    /* A quiet mark for the adult, on the button only they press. The child sees a
       dot; the parent sees that the records have not been written out in a month.
       Nothing on the child's half of the screen changes, and nothing is spoken. */
    const due = Store.backupDue();
    parentBtn.classList.toggle('due', !!due);
    parentBtn.setAttribute('title', due
      ? 'おうちのかたへ（記録の書き出しを おすすめします）' : 'おうちのかたへ');
    const n = Store.todayCount(), streak = Store.streak();
    const firstRun = Diagnostic.shouldRun();
    const rec = Diagnostic.current();
    const recGame = rec && Games.byId[rec.gameId];
    clear(recommendEl);
    recommendEl.hidden = !recGame;
    if (recGame){
      const lv = recGame.levels[rec.levelIndex] || recGame.levels[0];
      recommendEl.append(
        el('div.ico', { text: firstRun ? BANNER_ICON.first : BANNER_ICON.recommend, 'aria-hidden': 'true' }),
        el('div.grow', null,
          el('div.t', { text: firstRun ? 'はじめの ぼうけん' : 'いまの おすすめ' }),
          el('div.s', { text: firstRun
            ? '10もんで ぴったりの はじまりを みつけよう'
            : recGame.name + '　《' + lv.t + '》' })),
        el('div.go', { text: '▶' }));
      recommendEl.onclick = () => {
        Sound.sfx.tap();
        if (firstRun) Session.startDiagnostic(); else Diagnostic.startRecommended();
      };
    }
    updateVoiceWarning();
    if (!voiceWarnEl.hidden){
      Sound.probeVoice(3000).then(ok => {
        if (ok){ voiceWarnEl.hidden = true; voiceWarnEl.textContent = ''; }
      });
    }
    const review = Missions.yesterdayReview();
    reviewEl.hidden = !review;
    if (review){
      clear(reviewEl);
      reviewEl.append(
        el('div.ico', { text: BANNER_ICON.review, 'aria-hidden': 'true' }),
        el('div.grow', null,
          el('div.t', { text: 'きのうの ミッション' }),
          el('div.s', { text: 'どんな ふうに できたか おはなししよう' })),
        el('div.go', { text: '▶' }));
      reviewEl.onclick = () => Missions.openReview(review);
    }
    const learnedCount = Games.list.reduce((n, g) => n + g.levels.filter((lv, i) => Store.introduced(g.id, i)).length, 0);
    dailyEl.hidden = learnedCount === 0;
    clear(dailyEl);
    dailyEl.classList.toggle('done', n >= 10);
    dailyEl.append(
      el('div.ico', { text: BANNER_ICON.daily, 'aria-hidden': 'true' }),
      el('div.grow', null,
        el('div.t', { text: n >= 10 ? 'きょうの れんしゅう おわり！' : 'きょうの れんしゅう' }),
        el('div.s', { text: n >= 10
          ? `きょうは ${n}もん がんばったね　･　${streak}にち れんぞく`
          : 'あそんだ もんだいから 10もん でるよ' })),
      el('div.go', { text: n >= 10 ? '🎉' : '▶' }));

    const weak = Store.weakFacts(4);
    focusEl.hidden = weak.length < 2;      // one wobbly fact is not a practice set
    if (!focusEl.hidden){
      clear(focusEl);
      focusEl.append(
        el('div.ico', { text: BANNER_ICON.focus, 'aria-hidden': 'true' }),
        el('div.grow', null,
          // 「にがて」is a word for the parent page: to a five-year-old it is a verdict
          el('div.t', { text: 'とっくん' }),
          el('div.s', { text: weak.slice(0, 2).map(w => w.label).join('　･　')
                              + (weak.length > 2 ? '　ほか' : '') })),
        el('div.go', { text: '▶' }));
      focusEl.onclick = () => { Sound.sfx.tap(); Session.startFocus(weak.map(w => w.key), { n: 10 }); };
    }

    /* The prize choice is a separate, picture-led entry point.  It must not be
       squeezed into the four daily banners: those are routines, while this is a
       child's choice of what to do next.  The short adventure sits alongside it
       because it answers a different moment — "I want to try, but this is hard." */
    clear(questsEl);
    const stickerQuest = StickerMissions.homeCard();
    const adventure = Adventures.homeCard();
    const firstStep = FirstSteps.homeCard();
    if (stickerQuest) questsEl.append(stickerQuest);
    if (firstStep) questsEl.append(firstStep);
    if (adventure) questsEl.append(adventure);
    questsEl.hidden = !questsEl.childElementCount;

    const got = Store.data.stickers;
    clear(shelfEl);
    const strip = el('div.strip');
    if (got.length){
      got.slice(-16).reverse().forEach(k => strip.append(el('span' + (Store.isPending(k) ? '.pending' : ''), { text: stickerFor(k) })));
    } else {
      strip.append(el('span.empty', { text: 'レベルを クリアすると シールが たまるよ' }));
    }
    /* The padlocked 1ねんせい cards are meant to be the reason to fill the shelf, but
       on a 1024×768 iPad the world list scrolls: 509px of window over 1079px of map,
       so those cards sit at y≈900 and a child has to scroll two thirds of the way
       down to meet them. Rather than move the map around, the count goes on the one
       strip that is on screen whatever happens — the shelf the child already taps. */
    const gate = Progress.preStickers();
    const toGo = Progress.g1Open() ? 0 : 1;
    shelfEl.classList.toggle('nearly', toGo > 0 && toGo <= 6);
    /* The same picture the result screen draws: a bar filling towards 🎓, and dots to
       count once there are few enough. 「あと 34レベル」 is a number for the adult,
       so it stays in the label for them. */
    let sub;
    if (toGo){
      const say = '1ねんせいの きょうしつは、あそびごとに じゅんびが できると ひらくよ';
      const middle = el('span.leftdots');
      for (let i = 0; i < 3; i++) middle.append(el('span', { text: '●' }));
      sub = el('small.togo', { role: 'img', 'aria-label': say, title: say },
        middle, el('span', { text: '🎓', 'aria-hidden': 'true' }));
    } else {
      sub = el('small', { text: Progress.g1Open() ? '1ねんせいの きょうしつが ひらいて いるよ'
                                                  : 'タップで シールブック' });
    }
    shelfEl.append(
      el('span.bk', { text: '📖' }),
      el('div.lbl', null, 'シール ' + got.length + 'まい', sub),
      strip);

    /* how many banners share the row decides how much of each one fits: with three
       or four up, the mascot's width is worth more to the name than the mascot is */
    const shown = [...dailiesEl.children].filter(c => !c.hidden).length;
    dailiesEl.className = 'dailies n' + shown;

    clear(worldsEl);
    WORLDS.forEach(w => {
      const games = Games.list.filter(g => g.world === w.id);
      if (!games.length) return;
      const grid = el('div.gamegrid');
      const shut = games.every(g => !stageOpen(g));
      games.forEach(g => grid.append(stageOpen(g) ? gameCard(g) : lockedCard(g)));
      // the world's own name already says 1ねんせい; a second badge saying it again
      // only takes the room the name needs to stay on one line
      worldsEl.append(el('div.world' + ((w.stage || 'pre') !== 'pre' ? '.newstage' : '')
        + (shut ? '.shut' : ''),
        { style: { '--wc': w.color } },
        el('div.world-heading', null,
          el('h3', null, el('span.chip', { text: w.name }),
            el('span.sub', { text: shut ? 'じゅんびが できると ひらくよ' : w.sub })),
          Treasures.card(w.id)), grid));
    });
  }
  return { build, render };
})();

/* ---------------------------------------------------------- LEVELS */
const Levels = (() => {
  let node, titleEl, listEl, chestEl, game = null;
  function build(){
    if (node) return node;
    titleEl = el('h2');
    listEl  = el('div.levels');
    chestEl = el('div.level-treasure');
    node = el('div#levels', null,
      el('div.topbar', null,
        el('button.btn.btn-ghost.btn-round', { 'aria-label': 'もどる',
          onclick(){ Sound.sfx.tap(); Home.render(); UI.show('home', { replace: true }); } }, '←'),
        titleEl, speakBtn(() => speech())),
      chestEl, listEl);
    return UI.register('levels', node);
  }
  function speech(){
    return game ? game.name + '。レベルを選んでね。金色で囲まれたレベルは、金のシールをもらっているよ。鍵のついたレベルは、前のレベルをクリアすると遊べるよ。' : '';
  }
  function render(g){
    build();
    game = g;
    titleEl.textContent = g.ico + '　' + g.name;
    clear(chestEl); chestEl.append(Treasures.card(g.world));
    clear(listEl);
    g.levels.forEach((lv, i) => {
      const stars = Store.stars(g.id, i);
      const unlocked = Store.levelUnlocked(g.id, i);
      const goldKey = g.id + ':' + i + ':g';
      const gold = Store.hasSticker(goldKey);
      const card = el('button.levelcard' + (unlocked ? '' : '.locked') + (gold ? '.gold' : ''), {
        type: 'button', style: { '--lc': g.color },
        title: lv.t + (gold ? '　きんの シールを ゲット' : '　きんの シールは まだ'),
        onclick(){
          Sound.sfx.tap();
          if (!unlocked){ Sound.say('前のレベルをクリアすると、遊べるよ。', { delay: 120 }); return; }
          if (g.intro !== false && !Store.introduced(g.id, i)) FirstSteps.open(g, i);
          else Session.startLevel(g, i);
        }
      },
        el('div.num', { text: unlocked ? String(i + 1) : '🔒' }),
        el('div.body', null, el('div.t', { text: lv.t }), el('div.d', { text: lv.d })),
        // ★★★ is "all right first time"; this is "and without counting"
        Store.isSwift(g.id, i) ? el('span.swiftmark', { title: 'すぐ こたえられた', text: '⚡️' }) : null,
        UI.stars(stars),
        gold ? el('span.goldmark', {
          text: stickerFor(goldKey), 'aria-label': 'きんの シールを ゲット'
        }) : null);
      const entry = el('div.level-entry', null, card);
      if (unlocked && g.intro !== false) entry.append(el('button.btn.first-retry', {
        type: 'button', 'aria-label': lv.t + 'の やりかたを みる', title: 'もういちど やりかたを みる',
        onclick(){ Sound.sfx.tap(); FirstSteps.open(g, i); }
      }, '👀'));
      listEl.append(entry);
    });

  }
  return { build, render, speech, get game(){ return game; } };
})();

/* ---------------------------------------------------------- RESULT */
const Result = (() => {
  let node, inner, lastSpoken = '';
  const DAY_ENOUGH = 18;          // questions: one level (8) and one きょうの れんしゅう (10)
  function build(){
    if (node) return node;
    inner = el('div.inner');
    /* Every other screen can say itself again; this was the one that could not —
       and it is the one where a child who cannot read has to pick a button. */
    node = el('div#result', null, speakBtn(() => lastSpoken), inner);
    return UI.register('result', node);
  }
  function show(r){
    build();
    clear(inner);
    const nxt = r.mode === 'level' ? r.levelIndex + 1 : -1;
    const canNext = r.mode === 'level' && nxt < r.game.levels.length && Store.levelUnlocked(r.game.id, nxt);
    const shakyKeys = (r.shaky || []).map(x => x.key).filter(k => Store.factOrigin(k));
    const aimed = r.mode === 'focus' ? (r.focusKeys || []) : shakyKeys;
    /* Practising what just went wrong leads — unless the level went well, or it
       went badly enough that the words on this screen say「もう いちど」. After ★★
       the thing to do is the next level; after ★0 in a level the heading and the
       voice both say try again, and a bright「とっくん」there started a different
       ten questions under a child who had pressed the button they were told about.
       Either way the facts stay one tap away as the second button. */
    const drill = aimed.length > 0 && r.mode !== 'diagnostic' && r.mode !== 'focus' && r.mode !== 'adventure';
    const lead = drill && !(canNext && r.stars >= 2) && !(r.mode === 'level' && r.stars === 0);
    const supportedRetry = r.mode === 'level' && r.stars === 0 && r.game.intro !== false;
    const msg = r.mode === 'diagnostic' ? 'さいしょの ぼうけん クリア！'
              : r.mode === 'adventure' ? 'ぼうけん かんせい！'
              : r.stars === 3 ? 'パーフェクト！'
              : r.stars === 2 ? 'よく できました！'
              : r.stars === 1 ? 'クリア！'
              : supportedRetry ? 'やりかたを みてみよう'
              : lead ? 'おしい！ とっくん してみよう'
              : 'おしい！ もう いちど やってみよう';
    // the children read `msg`, so it stays hiragana; the voice gets kanji, which
    // is what lets a Japanese engine phrase it instead of droning it out
    const spoken = (r.unlockedG1 ? 'じゅんびが できたね！小学校一年生の新しい問題ができるよ！'
                 : r.mode === 'diagnostic' ? '最初の冒険、クリア！おすすめを見つけたよ。'
                 : r.mode === 'adventure' ? '小さな冒険、完成！ヒントを使って、最後までできたね。'
                 : r.swift ? 'パーフェクト！すぐ答えられたね！'
                 : r.stars === 3 ? 'パーフェクト！'
                 : r.stars === 2 ? 'よくできました！'
                 : r.stars === 1 ? 'クリア！'
                 : supportedRetry ? '一緒に一つやってみよう。'
                 : lead ? '惜しい！特訓してみよう。'
                 : '惜しい！もう一度やってみよう。');
    // 「やったね」 and 「やったね、みおちゃん」 are not the same sentence to a five-year-old
    const called = Store.name && r.stars >= 2 && r.mode !== 'diagnostic'
      ? Store.name + '、' : '';
    /* A run that earned nothing is not shown three empty stars, a sad face and
       「8もん中 2もん」: that is a verdict. It is shown that the child got to the end.
       The count is for a run good enough to be proud of; the parent page has the rest. */
    const tried = r.mode !== 'diagnostic' && r.stars === 0;
    inner.append(
      mascotSVG(tried ? 'happy' : 'cheer', tried ? 'talk' : 'cheer'),
      r.mode === 'diagnostic'
        ? el('div.diagnostic-badge', { text: '10もん たんけん できたね' })
        : r.mode === 'adventure' ? el('div.diagnostic-badge', { text: '🧭　さいごまで できたね' })
        : tried ? el('div.tried', { text: 'さいごまで がんばったね' })
        : UI.stars(r.stars, true),
      el('div.result-msg', { text: msg }));
    if (r.mode === 'diagnostic') inner.append(el('div.result-sub', { text: 'ぴったりの はじまりを みつけたよ' }));
    else if (r.stars >= 2 && r.mode !== 'adventure') inner.append(el('div.result-sub', { text: `${r.total}もんの うち ${r.right}もん いっかいめで せいかい` }));
    /* Every level cleared is a step towards a door the child can already see on
       the home screen. Saying how many are left, at the moment one is earned, is
       what turns「クリアした」into「あと 3レベル」. Levels, not stickers: the gold
       ones no longer move this number, so counting stickers here would stall. */
    const stickers = r.stickers || [];
    /* 「あと 47レベル」 is a number a five-year-old cannot hold. A bar filling up
       towards 🎓 is something they can see move; and once few enough are left to
       count on a hand or two, they become dots to count. The number stays for the
       adult, in the label. It rides inside the sticker card: one piece of news. */
    const coloured = r.confirmed || [];
    let toDoor = null;
    if ((stickers.length || coloured.length) && !r.unlockedG1 && !Progress.g1Open()){
      const st = Progress.preStickers();
      const left = 1;
      if (left){
        const say = '1ねんせいの きょうしつは、あそびごとに じゅんびが できると ひらくよ';
        let middle;
        if (left <= 10){
          middle = el('div.leftdots');
          for (let i = 0; i < left; i++) middle.append(el('span', { text: '●' }));
        } else {
          middle = el('div.gauge', null, el('div.fill', { style: { width: '35%' } }));
        }
        toDoor = el('div.stagenext' + (left <= 10 ? '.nearly' : ''),
          { role: 'img', 'aria-label': say, title: say },
          el('span.mk', { text: '🔒' }), middle, el('span.mk', { text: '🎓' }));
      }
    }
    /* The last sticker. This is the one screen in the app that says the child has
       finished 入学前 — it has to say it in words a six-year-old reads, on the
       screen they are already looking at, not in a menu they might find later. It
       goes above the sticker and the mission: on a screen this tall, the thing
       that has to be read first cannot be the thing furthest down. */
    if (r.unlockedG1){
      inner.append(el('div.unlocked', null,
        el('div.e', { text: '🎓' }),
        el('div.l', { text: 'じゅんびが できた！' }),
        el('b', { text: 'しょうがっこう 1ねんせいの あたらしい もんだいが できるよ！' }),
        el('div.l', { text: '「1ねんせいの きょうしつ」が ホームに ふえたよ' })));
    }
    /* The thing ★★★ could never say. These levels are for an answer that arrives,
       and a child who counted their way to every right answer used to get exactly
       the same three stars as one who remembered. */
    if (r.swift){
      inner.append(el('div.swift', null,
        el('span.mk', { text: '⚡️' }), 'かぞえないで こたえられたね！'));
    }
    if (r.milestone){
      inner.append(el('button.result-milestone', { type: 'button',
        onclick(){ Sound.sfx.tap(); ProgressAlbum.open(); } },
        el('span', { text: '📒', 'aria-hidden': 'true' }),
        el('span', { text: (r.milestone.label ? r.milestone.label + '　' : '')
          + Store.milestoneText(r.milestone.kind) })));
    }
    /* Name what went wrong. "62%" tells a child nothing; "3と7" is something they
       can carry to tomorrow — and it is exactly what the app will bring back.

       Named, not pressed: each name used to be a small button of its own — three
       43px buttons that all started the same practice and looked like three
       different choices. The way back to them is the one「とっくん」button below. */
    const runFocus = () => { Sound.sfx.tap(); Session.startFocus(aimed, { n: 10 }); };
    if (r.shaky && r.shaky.length){
      const list = el('div.shakylist');
      r.shaky.forEach(x => list.append(el('span.shakyitem', { text: x.label })));
      inner.append(el('div.shaky', null,
        el('div.l', { text: 'つぎは これを もういちど' }), list));
    }
    /* A sticker confirmed by today's check turns from outline to colour — and that
       is the moment the door gauge moves, so the gauge rides with it. */
    if (coloured.length){
      inner.append(el('div.newsticker.confirmed', null,
        el('div.e', { text: coloured.map(x => x.emoji).join(' ') }),
        el('div.l', { text: 'シールに いろが ついた！' }),
        stickers.length ? null : toDoor));
    }
    if (stickers.length){
      const gold = stickers.some(x => x.gold), provisional = stickers.some(x => x.pending);
      const adventure = stickers.some(x => x.adventure);
      const chosen = r.rewardTarget && stickers.some(x => x.emoji === stickerFor(r.rewardTarget.key));
      inner.append(el('div.newsticker' + (gold ? '.gold' : '') + (provisional ? '.pending' : ''), null,
        el('div.e', { text: stickers.map(x => x.emoji).join(' ') }),
        el('div.l', { text: adventure ? 'ぼうけんシール を ゲット！'
                          : chosen ? 'えらんだ シールを ゲット！'
                          : provisional ? 'かりの シール！ べつの ひに また できたら いろが つくよ'
                          : stickers.length > 1 ? 'シール と きんの シール を ゲット！'
                          : gold ? 'きんの シール を ゲット！' : 'シール を ゲット！' }),
        toDoor));
    }
    const treasureReady = r.mode === 'level' && r.game && stickers.some(x => x.gold)
      && Treasures.status(r.game.world).ready && !Store.hasTreasure(r.game.world);
    if (treasureReady) inner.append(el('div.result-treasure', null,
      el('b', { text: 'きんの シールが ぜんぶ そろった！' }), Treasures.card(r.game.world)));
    if (r.mode === 'diagnostic' && r.recommended){
      const g = Games.byId[r.recommended.gameId];
      if (g){
        const lv = g.levels[r.recommended.levelIndex] || g.levels[0];
        inner.append(el('div.diagnostic-next', null,
          el('div.l', { text: 'つぎの おすすめ' }),
          el('b', { text: g.name + '　《' + lv.t + '》' })));
      }
    }
    /* A real-world mission is the next learning action after a successful run.
       It remains visible alongside a sticker: earning a sticker must not hide the
       bridge from screen maths to objects at home. */
    if (!r.unlockedG1 && !(r.shaky && r.shaky.length)
        && (r.mode === 'daily' || (r.mode === 'level' && r.stars >= 1))) {
      /* one piece of news per screen: the classroom outranks today's kitchen-table
         task, and so do a new sticker and the facts to practise — the mission comes
         up on the next pass */
      inner.append(Missions.resultCard(r.lastGameId));
    }
    const actions = el('div.result-actions');
    /* A picture first on every way off this screen: a child who cannot read
       「つぎの レベルへ」yet can still tell ▶ from ↻ from 🏠. */
    /* The voice says which button is the way on, by its colour: 「クリア！」 alone
       left a child who cannot read in front of three or four buttons to guess from. */
    let nextLine = '';
    const act = (cls, icon, label, onclick, say) => {
      if (!nextLine && say && /btn-accent/.test(cls)) nextLine = 'オレンジのボタンで、' + say;
      return el('button.btn' + cls, { onclick },
        el('span.bi', { text: icon, 'aria-hidden': 'true' }), el('span.bl', { text: label }));
    };
    const home = () => { Sound.sfx.tap(); Home.render(); UI.show('home', { replace: true }); };
    const again = r.stars === 0 && !lead;
    if (r.mode === 'focus'){
      actions.append(act('.btn-accent.primary', '🎯', 'もういちど', runFocus, 'もう一度特訓できるよ。'));
    } else if (lead){
      actions.append(act('.btn-accent.primary', '🎯', 'とっくん する', runFocus, '特訓できるよ。'));
    }
    if (r.mode === 'diagnostic'){
      actions.append(act('.btn-accent.primary', '🗺️', 'おすすめで あそぶ',
        () => { Sound.sfx.tap(); Diagnostic.startRecommended(); }, 'おすすめを遊べるよ。'));
    } else if (r.mode === 'level'){
      // when nothing was earned, another go is the obvious next step, not a footnote
      const againBtn = act(again && !supportedRetry ? '.btn-accent.primary' : '', '↻', 'もういちど',
        () => { Sound.sfx.tap(); Session.startLevel(r.game, r.levelIndex); }, 'もう一度できるよ。');
      if (supportedRetry) actions.append(act('.btn-accent.primary', '👀', 'いっしょに ひとつ',
        () => { Sound.sfx.tap(); FirstSteps.open(r.game, r.levelIndex); }, '一緒に一つできるよ。'));
      const nextBtn = canNext ? act(lead || again ? '' : '.btn-accent.primary', '▶', 'つぎの レベルへ',
        () => { Sound.sfx.tap();
          if (r.game.intro !== false && !Store.introduced(r.game.id, nxt)) FirstSteps.open(r.game, nxt);
          else Session.startLevel(r.game, nxt);
        }, '次のレベルに行けるよ。') : null;
      /* the way on is also the first button, not only the brightest: after a good
         run「もういちど」 in front of it read as the suggestion */
      if (nextBtn && !lead && !again) actions.append(nextBtn, againBtn);
      else actions.append(againBtn, ...(nextBtn ? [nextBtn] : []));
      if (drill && !lead) actions.append(act('', '🎯', 'とっくん する', runFocus));
    } else if (r.mode === 'daily'){
      actions.append(act(again ? '.btn-accent.primary' : '', '↻', 'もういちど',
        () => { Sound.sfx.tap(); Session.startDaily(10); }, 'もう一度できるよ。'));
    } else if (r.mode === 'adventure'){
      actions.append(act('', '🧭', 'もういちど',
        () => { Sound.sfx.tap(); Session.startAdventure(r.adventureTarget); }, 'もう一度、小さな冒険ができるよ。'));
    }
    if (r.unlockedG1){
      actions.append(act('.btn-accent.primary', '🎓', '1ねんせいの きょうしつへ', home, '一年生の教室に行けるよ。'));
    }
    const homeBtn = act(r.mode === 'level' || r.mode === 'diagnostic' || r.mode === 'adventure' || lead || again || r.mode === 'focus' || r.unlockedG1 ? '' : '.btn-accent',
      '🏠', 'あそびを えらぶ', home, '遊びを選べるよ。');
    actions.append(homeBtn);
    /* 1日10分 — one level and one れんしゅう — is the whole plan, and nothing on the
       child's side of the app ever said so: every result offered another go, and
       とっくん's「もういちど」went round for as long as the child kept pressing it.
       Once today holds that much, this screen says it is enough and the bright
       button is the way home. Nothing is locked; the other buttons still work. */
    if (r.mode !== 'diagnostic' && !r.unlockedG1 && Store.todayCount() >= DAY_ENOUGH){
      inner.append(el('div.enough', null,
        el('span.mk', { text: '🌙', 'aria-hidden': 'true' }), 'きょうは ここまで で じゅうぶん！ また あした あそぼう'));
      $$('.btn', actions).forEach(b => b.classList.remove('btn-accent', 'primary'));
      homeBtn.classList.add('btn-accent', 'primary');
      homeBtn.querySelector('.bl').textContent = 'きょうは おしまい';
      actions.prepend(homeBtn);
      nextLine = '今日は、ここまでで十分だよ。オレンジのボタンで、おしまいにしよう。';
    }
    inner.append(actions);
    UI.show('result', { replace: true });
    const news = (coloured.length ? 'シールに、色がついたね！' : '')
      + (stickers.some(x => x.pending) ? '別の日にまたできたら、シールに色がつくよ。' : '')
      + (treasureReady ? '金のシールが全部そろったね！宝箱を開けられるよ。' : '');
    const albumNews = r.milestone ? (r.milestone.label ? r.milestone.label + '。' : '')
      + Store.milestoneText(r.milestone.kind) + '。' : '';
    lastSpoken = called + spoken + albumNews + news + nextLine;
    Sound.say(lastSpoken, { delay: 700 });
    for (let i = 0; i < r.stars; i++) setTimeout(() => Sound.sfx.star(i), 400 + i * 260);
  }
  return { show, build };
})();

/* ---------------------------------------------------------- STICKER BOOK */
const Book = (() => {
  let node, grid, count, missing, headEl;
  function build(){
    if (node) return node;
    grid = el('div.book');
    count = el('div.aim');
    /* 「あと 4レベル」 without saying *which* four is a number a child cannot act on
       and a parent cannot help with: the shelf's empty slots are anonymous dots, and
       working out which level each one belongs to means counting slot positions. */
    missing = el('div.book-todo');
    node = el('div#book', null,
      el('div.topbar', null,
        el('button.btn.btn-ghost.btn-round', { 'aria-label': 'もどる',
          onclick(){ Sound.sfx.tap(); UI.show('home', { replace: true }); } }, '←'),
        headEl = el('h2'), speakBtn(() => speech())),
      count, missing, grid);
    return UI.register('book', node);
  }
  /** Said on the way in: the count under the heading is a sentence a child cannot read yet. */
  function speech(){
    if (Progress.g1Open()) return 'シールブックだよ。集めたシールが並んでいるよ。';
    const st = Progress.preStickers();
    const left = Math.max(0, st.total - st.got);
    return 'シールブックだよ。あと' + left + 'レベルで、1年生の教室が開くよ。';
  }
  function open(){
    render();
    UI.show('book');
    Sound.say(speech(), { delay: 200 });      // after the switch, which hushes
  }
  function render(){
    build();
    headEl.textContent = '📖　' + (Store.name ? Store.name + 'の シールブック' : 'シールブック');
    clear(grid);
    grid.append(Treasures.collection());
    let got = 0;
    const drawSlots = keys => keys.forEach(key => {
      const has = Store.hasSticker(key);
      if (has) got++;
      grid.append(el('div.sticker' + (has ? (key.endsWith(':g') ? '.got.gold' : '.got') : '')
          + (has && Store.isPending(key) ? '.pending' : ''),
        { text: has ? stickerFor(key) : '･' }));
    });
    /* The 入学前 shelf is the one that opens the 小1 classroom, so it is the one
       this page counts towards a goal. The classroom's own stickers go in a second
       group below, and only once it is open — an empty row of slots for a world a
       child cannot reach would make the goal look further away than it is. */
    const pre = Progress.preStickers();
    drawSlots(Progress.slots('pre'));
    Store.data.stickers.filter(k => k.indexOf('daily:') === 0 || k.indexOf('focus:') === 0 || k.indexOf('adventure:') === 0).forEach(k => {
      got++;
      const isAdventureMemento = k.indexOf('adventure:') === 0;
      grid.append(el('div.sticker.got' + (isAdventureMemento ? '.adventure' : '.gold'), { text: stickerFor(k) }));
    });
    if (Progress.g1Open()){
      grid.append(el('div.bookgroup', { text: '🎓　1ねんせいの きょうしつ' }));
      drawSlots(Progress.slots('g1'));
    } else {
      /* Shown, but plainly not part of the count above: a shelf a child can see
         waiting for them is the reason to fill the one they are on. */
      grid.append(el('div.bookgroup.shut', { text: '🔒　1ねんせいの きょうしつ　レベルを ぜんぶ クリアすると ここが ひらくよ' }));
      Progress.slots('g1').forEach(() => grid.append(el('div.sticker.shut', { text: '🔒' })));
    }
    /* Two numbers, and they count different things on purpose: the stickers are
       the shelf (96 of them, gold included), the levels are the door (48). Saying
       「あと ◯まい」for the door would stall the moment a gold sticker was earned
       for a level that was already cleared. */
    /* Name the levels the door is still waiting for, and make each one a way in.
       The same list the「いまの おすすめ」walks, shown all at once. */
    clear(missing);
    const todo = Progress.gateSlots('pre')
      .filter(k => !Store.hasConfirmed(k))
      .map(k => {
        const cut = k.lastIndexOf(':');
        const g = Games.byId[k.slice(0, cut)], i = Number(k.slice(cut + 1));
        return g && g.levels[i] ? { g, i, lv: g.levels[i], waiting: Store.isPending(k) } : null;
      })
      .filter(Boolean);
    if (todo.length){
      const row = el('div.todorow');
      todo.slice(0, 10).forEach(({ g, i, lv, waiting }) => {
        const open = Store.levelUnlocked(g.id, i);
        row.append(el('button.todochip' + (open ? '' : '.shut') + (waiting ? '.pending' : ''), {
          type: 'button', style: { '--lc': g.color },
          title: g.name + '　' + lv.t,
          onclick(){
            Sound.sfx.tap();
            if (open){
              if (g.intro !== false && !Store.introduced(g.id, i)) FirstSteps.open(g, i);
              else Session.startLevel(g, i);
              return;
            }
            // not open yet: show the child where it lives, and what comes first
            Levels.render(g);
            UI.show('levels');
          }
        },
          el('span.i', { text: open ? g.ico : '🔒' }),
          el('span.t', null, g.name, el('small', { text: lv.t + (waiting ? '・たしかめ' : '') }))));
      });
      missing.append(
        el('div.l', { text: 'のこりの レベル' + (todo.length > 10 ? '（さいしょの 10こ）' : '') }),
        row);
    }

    const left = Math.max(0, pre.total - pre.got);
    const waiting = Progress.pendingCount('pre');
    count.innerHTML = `<b>${got}まい</b> あつめたよ　･　レベルを クリアすると シールが 1まい。ぜんぶ せいかい で きんいろの シール`
      + (waiting ? `<br>かりの シール ${waiting}まい（べつの ひに また できたら いろが つくよ）` : '')
      + (left
        ? `<br><b>あと ${left}レベル</b> クリアすると しょうがっこう 1ねんせいの もんだいが ひらくよ（${pre.got}／${pre.total}）`
        : '<br><b>レベルを ぜんぶ クリアしたね！</b> しょうがっこう 1ねんせいの もんだいが できるよ');
  }
  return { build, render, open, speech };
})();

/* ---- 91-parent.js ---- */
/* ===========================================================
   91 — おうちのかたへ (parent area): progress, why it matters, settings
   =========================================================== */
'use strict';

const Parent = (() => {
  let gateNode, sheetNode, sheetInner, justReset = false, afterGate = null;
  let persistState = '確認中';
  let lastBackupMsg = null;   // survives the re-render that a successful import triggers
  let a = 0, b = 0, want = 0;

  /* ---- adult gate ----
     One four-way question with no wait let a child through by tapping: 25% a tap,
     94% within ten taps, and the mission's「できた」button gave them every reason to
     try. Behind it are「記録をすべて消す」and「1年生を開く」. Two right answers in a
     row, and a wait after a miss, put a random tapper at 1 in 16 per run and at
     five seconds a run — slow enough to stop being a game. An adult who knows the
     answer is through in two taps. */
  const GATE_RUN = 2, GATE_WAIT_S = 5;
  let streak = 0, waitTimer = null;
  function buildGate(){
    if (gateNode) return gateNode;
    const q = el('div.q');
    const choices = el('div.choices');
    const step = el('div.hint.gatestep', { 'aria-live': 'polite' });
    function roll(){
      clearTimeout(waitTimer); waitTimer = null;
      a = ri(12, 19); b = ri(3, 9); want = a * b;
      q.textContent = a + ' × ' + b + ' = ?';
      step.textContent = (streak + 1) + ' / ' + GATE_RUN + ' もんめ';
      clear(choices);
      const opts = shuffle([want, want + ri(3, 9), want - ri(3, 9), want + ri(10, 20)]);
      opts.forEach(v => choices.append(el('button.choice', {
        type: 'button', text: String(v),
        onclick(e){
          if (waitTimer) return;
          if (v === want){
            Sound.sfx.correct();
            if (++streak < GATE_RUN){ roll(); return; }
            streak = 0;
            const next = afterGate;
            afterGate = null;
            if (next) next();
            else { render(); UI.show('parent'); }
            return;
          }
          streak = 0;
          e.currentTarget.classList.add('wrong');
          Sound.sfx.wrong();
          $$('.choice', choices).forEach(x => { x.disabled = true; });
          let left = GATE_WAIT_S;
          const tick = () => {
            if (left <= 0){ roll(); return; }
            step.textContent = 'ちがいます。' + left + 'びょう まってください';
            left--;
            waitTimer = setTimeout(tick, 1000);
          };
          tick();
        }
      })));
    }
    gateNode = el('div#gate', null,
      el('div.topbar', null,
        el('button.btn.btn-ghost.btn-round', { 'aria-label': 'もどる',
          onclick(){ Sound.sfx.tap(); clearTimeout(waitTimer); waitTimer = null; UI.show('home', { replace: true }); } }, '←'),
        el('h2', { text: 'おうちの かたへ' })),
      el('div.gate', null,
        el('div.hint', { text: 'おとなの かた だけが すすめます。けいさんの こたえを ' + GATE_RUN + 'もん つづけて えらんで ください。' }),
        step, q, choices));
    UI.register('gate', gateNode);
    gateNode._roll = roll;
    return gateNode;
  }

  /** An iPhone/iPad in a Safari tab — not the home-screen app, not a file:// copy. */
  function inSafariTab(){
    const ios = /iP(hone|ad|od)/.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);   // iPadOS asks for the desktop site
    const standalone = navigator.standalone === true
      || !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    return ios && !standalone && /^https?:$/.test(location.protocol);
  }

  function open(onSuccess){
    buildGate();
    afterGate = typeof onSuccess === 'function' ? onSuccess : null;
    streak = 0;
    gateNode._roll();
    UI.show('gate');
  }

  /* ---- dashboard ---- */
  function buildSheet(){
    if (sheetNode) return sheetNode;
    sheetInner = el('div.sheet-inner');
    sheetNode = el('div#parent', null,
      el('div.topbar', null,
        el('button.btn.btn-ghost.btn-round', { 'aria-label': 'もどる',
          onclick(){ Sound.sfx.tap(); Home.render(); UI.show('home', { replace: true }); } }, '←'),
        el('h2', { text: 'おうちの かたへ' })),
      el('div.sheet', null, sheetInner));
    return UI.register('parent', sheetNode);
  }

  const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
  const secs = ms => ms == null ? '—' : (ms / 1000).toFixed(1) + '秒';

  function progressSection(){
    const sec = el('section');
    sec.append(el('div.eyebrow', { text: 'progress' }), el('h3', { text: 'ここまでのようす' }));
    const t = el('table.skilltable');
    t.append(el('thead', null, el('tr', null,
      el('th', { text: '遊び' }), el('th', { text: '到達' }),
      el('th', { class: 'n', text: '★' }),
      el('th', { class: 'n', text: '直近30問' }),
      el('th', { class: 'n', text: 'こたえるまで' }),
      el('th', { class: 'n', text: '通算' }),
      el('th', { class: 'n', text: '問題数' }))));
    const body = el('tbody');
    WORLDS.forEach(w => {
      const games = Games.list.filter(g => g.world === w.id);
      if (!games.length || ((w.stage || 'pre') !== 'pre' && !Progress.g1Open())) return;
      body.append(el('tr', null, el('td', { colspan: 7, style: { color: w.color, fontWeight: 800, paddingTop: 'calc(var(--u)*.8)' }, text: w.name })));
      games.forEach(g => {
        const s = Store.gameStars(g.id, g.levels.length);
        const max = g.levels.length * 3;
        const now = Store.gameRecentAccuracy(g.id, g.levels.length);   // the one to act on
        const acc = Store.accuracy(g.id);                              // lifetime, for context
        const seen = Store.data.seen[g.id] || 0;
        /* The second axis. 「1回目で正解」cannot separate a child who remembers
           「10は4と6」from one who counted the six empty cells for nine seconds —
           and only the first of those is what くり上がり needs. */
        const ms = g.fluent ? Store.gameSpeed(g.id) : null;
        const slowNow = ms != null && ms >= FLUENT_SLOW_MS;
        const fastNow = ms != null && ms <= FLUENT_FAST_MS;
        body.append(el('tr', null,
          el('td', { text: g.name }),
          el('td', null, el('div.bar', null, el('i', { style: { width: (max ? (s / max) * 100 : 0) + '%',
            background: now != null && now < .6 ? 'var(--oops)' : 'var(--good)' } }))),
          el('td', { class: 'n', text: s + '/' + max }),
          el('td', { class: 'n', style: { color: now != null && now < .6 ? 'var(--oops-ink)' : null, fontWeight: 800 }, text: pct(now) }),
          // amber, not the warning red: counting it out is where most children are at five
          el('td', { class: 'n', style: { color: slowNow ? 'var(--accent-ink)' : fastNow ? 'var(--good-ink)' : 'var(--ink-soft)',
                                          fontWeight: slowNow || fastNow ? 800 : 500 },
                     text: g.fluent ? secs(ms) : '—' }),
          el('td', { class: 'n', style: { color: 'var(--ink-soft)' }, text: pct(acc) }),
          el('td', { class: 'n', text: String(seen) })));
      });
    });
    t.append(body);
    sec.append(el('div', { style: { overflowX: 'auto' } }, t));
    sec.append(el('p', { style: { marginTop: 'calc(var(--u)*.8)' },
      text: '「直近30問」「通算」はどちらも「1回目のタップで正解した割合」です。判断に使うのは直近30問のほうです。通算は開始以来の平均なので、1か月目に苦戦した記録がいつまでも分母に残り、いま伸びていることも、いまつまずき始めたことも映しません。直近が60%を下回っている遊びは赤で出ます。' }));
    sec.append(el('p', {
      text: '「こたえるまで」は、けいさんの やま の4つの遊びだけに出ます。問題が出てから最初に答えるまでの時間で、正解だったときだけ記録しています。3.0秒までなら緑（思い出している）、9.0秒を超えると茶色（数えて出している）。正答率だけを見ていると「できている」と「数えればできる」が同じ数字になりますが、くり上がりの計算で効くのは前者だけです。茶色はこの時期には自然な段階で、まちがいではありません。次は「かたまりで見る」練習がいちばん効きます（下の「できるけれど、数えている」）。' }));
    return sec;
  }

  /* ---- 今週やること ----
     The dashboard used to be a table plus an essay, and deciding what the child
     should practise was left entirely to the reader. The app has the data. */
  function nextUpSection(){
    const sec = el('section');
    sec.append(el('div.eyebrow', { text: 'next' }), el('h3', { text: '今週やること' }));

    /* One question answered wrong is not a diagnosis. Nothing is named here until
       there is a level's worth of evidence behind it. */
    const ENOUGH = 8;
    const levels = [];
    Games.list.forEach(g => g.levels.forEach((lv, i) => {
      if (!levelOpen(g, i)) return;
      const n = Store.recentCount(g.id, i);
      if (n < ENOUGH) return;
      levels.push({ g, lv, i, n, acc: Store.recentAccuracy(g.id, i), cold: Store.daysSince(g.id, i) });
    }));

    if (!levels.length){
      sec.append(el('p', { text: '判断できるだけの回数がまだありません（1レベル＝8問を、どれか1つ最後まで）。「かずの しま」の《かぞえよう》から始めてください。1日1レベルで十分です。' }));
      return sec;
    }

    const focus = levels.slice().sort((a, b) => a.acc - b.acc)[0];
    const stale = levels.slice()
      .filter(x => x.acc >= .75 && x.cold >= 7)
      .sort((a, b) => b.cold - a.cold)[0];

    const line = (mark, head, body2) => el('div.todo', null,
      el('div.mk', { text: mark }),
      el('div', null, el('b', { text: head }), el('div', { text: body2 })));

    if (focus.acc < .75){
      sec.append(line('◎', focus.g.name + '　《' + focus.lv.t + '》',
        '直近' + focus.n + '問の初回正答率 ' + pct(focus.acc) + '。ここを中心に、1日1回。8問を最後までやりきれば十分です。'));
    } else {
      /* Levels are judged on eight questions or more, facts on two misses — so a page
         could say「よく仕上がっています」and list three gaps directly under it. Say
         only what both halves agree on. */
      const facts0 = Store.data.facts || {};
      const gaps = Object.keys(facts0).some(k => {
        const f = facts0[k];
        return f && (f[0] - f[1]) >= 2 && f[1] / f[0] < .6;
      });
      sec.append(line('◎', focus.g.name + '　《' + focus.lv.t + '》',
        '直近' + focus.n + '問で ' + pct(focus.acc) + '。' + (gaps
          ? 'レベルとしては安定しています。次のレベルに進みながら、下の「つまずいている中身」だけを「とっくん」で拾ってください。'
          : 'いちばん低いところがこれなら、よく仕上がっています。次のレベルに進んで構いません。')));
    }
    // what that game is actually for — the one place a parent is most likely to read it
    if (focus.g.aim) sec.append(el('div.aimnote', { html: focus.g.aim }));
    if (stale && stale !== focus){
      sec.append(line('○', stale.g.name + '　《' + stale.lv.t + '》',
        stale.cold + '日ふれていません。できていたことなので、思い出す時間として1回だけ。'));
    }

    /* the exact facts that are missing — the thing a per-game percentage can never say */
    const facts = Store.data.facts || {};
    const weak = [];
    for (const k in facts){
      const f = facts[k];
      // "missed it at least twice", not "missed it once" — one slip is not a gap
      if (!f || (f[0] - f[1]) < 2) continue;
      const acc = f[1] / f[0];
      if (acc >= .6) continue;
      const gid = k.slice(0, k.indexOf(':'));
      weak.push({ acc, n: f[0], label: f[3] || k, game: (Games.byId[gid] || {}).name || gid,
                  miss: Store.factMiss(k) });
    }
    weak.sort((a, b) => a.acc - b.acc || b.n - a.n);
    if (weak.length){
      sec.append(el('h4', { text: 'つまずいている中身' }));
      const chips = el('div.factchips');
      weak.slice(0, 8).forEach(w => chips.append(
        el('span.factchip', null, el('small', { text: w.game }), w.label,
          w.miss ? el('em', { text: missParent(w.miss.kind) }) : null)));
      sec.append(chips);
      sec.append(el('p', { text: 'ここに出た項目は「きょうの れんしゅう」が自動で多めに出します。声かけに使うなら、答えを教えるより、おはじきやお菓子で同じ数を作ってみせるほうが早いです。' }));
    } else {
      sec.append(el('p', { style: { marginTop: 'calc(var(--u)*.8)' },
        text: '取りこぼしている項目はいまのところありません。' }));
    }

    sec.append(missSection());

    /* Right every time, and still counted out. Invisible to every number on this
       page until answers were timed, and the single most useful thing to work on
       once the accuracy is already there. */
    const slowOnes = [];
    for (const k in facts){
      const f = facts[k];
      if (!f || !f[0] || !f[5] || f[5] < FLUENT_SLOW_MS) continue;
      if (f[1] / f[0] < .6) continue;                 // already named above
      const gid = k.slice(0, k.indexOf(':'));
      slowOnes.push({ ms: f[5], label: f[3] || k, game: (Games.byId[gid] || {}).name || gid });
    }
    slowOnes.sort((a, b) => b.ms - a.ms);
    if (slowOnes.length){
      sec.append(el('h4', { text: 'できるけれど、数えている' }));
      const chips = el('div.factchips');
      slowOnes.slice(0, 8).forEach(w => chips.append(
        el('span.factchip.slow', null, el('small', { text: w.game + '　' + secs(w.ms) }), w.label)));
      sec.append(chips);
      sec.append(el('p', { text: '正解はしていますが、答えが出るまでに時間がかかっています。指を折る、枠のマスを数える、というやり方で合わせている状態です。まちがいではないので放っておかれがちですが、くり上がりのたし算は「9+4 を 9+1+3 にする」途中でこの答えを即座に使うので、ここが遅いとその先が進みません。「とっくん」はこれらも拾います。家では、答えを急がせるより、おはじきを5と5、6と4 のように置いて見せて「かたまりで見る」経験を足すほうが早いです。' }));
    }
    return sec;
  }

  /* ---- まちがえ方の型 ----
     A percentage says how often. It cannot say that the same child answers「10は4と
     いくつ」with 4 — reading back the part they can see — and that the fix is to
     cover the four rather than to drill the fact. The app throws away nothing now:
     the value pressed on the first mistake is classified and counted (06-miss.js),
     so this is the one place on the page that says what to actually do. */
  function missSection(){
    const facts = Store.data.facts || {};
    const tally = {};                   // kind -> { n, games:Set, examples:[] }
    let taught = 0;
    for (const k in facts){
      const m = facts[k] && facts[k][6];
      if (!m) continue;
      const gid = k.slice(0, k.indexOf(':'));
      const gname = (Games.byId[gid] || {}).name || gid;
      for (const kind in m){
        if (kind === 'taught'){ taught += m[kind]; continue; }
        if (MISS_DIAGNOSTIC.indexOf(kind) < 0) continue;
        const t = tally[kind] || (tally[kind] = { n: 0, games: {}, examples: [] });
        t.n += m[kind];
        t.games[gname] = true;
        if (t.examples.length < 3) t.examples.push(facts[k][3] || k);
      }
    }
    const kinds = Object.keys(tally).filter(k => tally[k].n >= 3)
      .sort((a, b) => tally[b].n - tally[a].n);
    if (!kinds.length && !taught) return el('span', { hidden: true });

    const s = el('div');
    s.append(el('h4', { text: 'まちがえ方の型' }));
    if (kinds.length){
      s.append(el('p', { text: '同じ「不正解」でも中身は違います。1回目に押した答えを分類して数えたものです。正答率だけを見ていても出てこない情報で、家庭での声かけを変えられるのはここです。' }));
      const list = el('div.misslist');
      kinds.forEach(k => {
        const t = tally[k];
        list.append(el('div.missrow', null,
          el('b', { text: missParent(k) }),
          el('span.n', { text: 'のべ ' + t.n + '回' }),
          el('small', { text: Object.keys(t.games).join('・') + '　例：' + t.examples.join('、') })));
      });
      s.append(list);
    }
    if (taught){
      s.append(el('p', { style: { marginTop: 'calc(var(--u)*.7)' },
        text: '※ 自力では届かず、アプリが答えを見せて終えた回が ' + taught
            + ' 回あります（6回まちがえると出ます）。★にも「1回目で正解」にも数えていません。'
            + 'この回の項目は「とっくん」が必ず拾います。' }));
    }
    return s;
  }

  /* ---- なぜこの遊びなのか ----
     Every game carries an `aim`: a short piece on the thing it is for. All fifteen

  /* ---- 入学まで ----
     「入学までの半年で」 is the premise of the app, and the app had no idea when that
     was. `createdAt` was stored and never read, there was no 入学日, and the roadmap
     below was fixed prose: it could tell a parent what the third month should look
     like without knowing whether this child is in it. This is the same numbers the
     app already has, put on a calendar. */
  function scheduleSection(){
    const s = el('section');
    const school = Store.schoolDate();
    const toSchool = Store.daysToSchool();
    const elapsed = Store.daysSinceStart();
    const pre = Progress.preStickers();
    const left = Math.max(0, pre.total - pre.got);
    s.append(el('div.eyebrow', { text: 'calendar' }), el('h3', { text: '入学まで' }));

    const fmt = d => d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
    const head = el('div.schedule');
    head.append(
      el('div.big', null, toSchool > 0 ? el('b', { text: 'あと ' + toSchool + '日' })
                                       : el('b', { text: '入学しています' }),
        el('small', { text: fmt(school) + ' 入学の予定' })),
      el('div.big', null, el('b', { text: pre.got + ' / ' + pre.total + ' レベル' }),
        el('small', { text: left ? 'のこり ' + left + 'レベルで 1ねんせいの きょうしつが開きます' : 'すべてクリア済み' })));
    s.append(head);

    /* Pace, stated plainly enough that a parent can check it: levels cleared,
       divided by the days since this app was first opened. It is a blunt average
       and it says so — but it is the difference between a roadmap and a plan. */
    if (!left){
      s.append(el('p', { text: '入学前の48レベルはすべてクリア済みです。あとは「きょうの れんしゅう」と'
        + '「とっくん」で保つのと、「1ねんせいの きょうしつ」を進めるので十分です。' }));
    } else if (elapsed < 7 || pre.got === 0){
      s.append(el('p', { text: 'ペースを見積もれるだけの日数がまだありません（1週間ほど使うと出ます）。'
        + '目安は1日1レベル・10分です。48レベルなら、休む日を入れても2〜3か月で終わる分量です。' }));
    } else {
      const rate = pre.got / Math.max(1, elapsed);            // levels per calendar day
      const eta = Math.ceil(left / rate);
      const done = new Date(Date.now() + eta * 86400000);
      const inTime = toSchool <= 0 ? false : eta <= toSchool;
      const perWeek = (rate * 7).toFixed(1);
      // a plain forecast, not an alarm: nothing is lost if it runs past April
      s.append(el('div.todo', null,
        el('div.mk', { text: inTime ? '◎' : '○' }),
        el('div', null,
          el('b', { text: inTime
            ? 'このペースなら ' + fmt(done) + 'ごろ、入学に間に合います'
            : 'このペースだと、全部おわるのは ' + fmt(done) + 'ごろの見込みです'
              + (toSchool > 0 ? '（入学の ' + (eta - toSchool) + '日あと）' : '') }),
          el('div', { text: '使い始めてから ' + elapsed + '日で ' + pre.got + 'レベル（週 ' + perWeek + 'レベル）。'
            + 'のこり ' + left + 'レベルを同じペースで進めた場合の見込みです。' }))));
      if (!inTime){
        s.append(el('p', { text: '追いつき方は2つです。1つは「いまの おすすめ」を毎日1回、最後まで（8問）。'
          + 'これがそのまま1日1レベルになります。もう1つは、間違いが多いレベルを繰り返すより'
          + '「とっくん」で該当する項目だけを10問回すほうが、同じ10分で進みます。'
          + 'なお、間に合わなくても内容が消えるわけではありません——入学後も続けられます。' }));
      }
    }

    /* The auto-guess is right for a 年長 and wrong for a 年中; one tap either way. */
    const shift = n => el('button.btn', {
      text: n < 0 ? '1年 早める' : '1年 遅らせる',
      onclick(){
        Store.setSchoolYear(school.getFullYear() + n);
        render();
      }
    });
    s.append(el('p', { style: { marginTop: 'calc(var(--u)*.8)' },
      text: '入学の年は、はじめて使った日から推定しています。ちがうときは動かしてください。' }));
    s.append(el('div', { style: { display: 'flex', gap: 'calc(var(--u)*.7)', flexWrap: 'wrap' } },
      shift(-1), shift(1)));
    return s;
  }
