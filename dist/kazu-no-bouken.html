    const pool = BANK.filter(x => x[0] === gameId);
    const src = (pool.length ? pool : BANK)[hash(day + ':' + gameId) % (pool.length || BANK.length)];
    m = { day, id: src[0] + ':' + hash(day + src[1]), gameId: src[0], text: src[1], prompt: src[2] };
    Store.recordMission(m);
    return Store.mission(day);
  }

  function yesterdayReview(){
    const d = new Date();
    d.setDate(d.getDate() - 1);
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
      + '-' + String(d.getDate()).padStart(2, '0');
    const m = Store.mission(key);
    return m && m.done && !m.reviewed ? m : null;
  }

  let node, titleEl, promptEl, noteEl, doneBtn;
  function build(){
    if (node) return node;
    titleEl = el('h2', { text: 'きょうの さんすう ミッション' });
    promptEl = el('div.mission-main');
    noteEl = el('div.mission-note');
    doneBtn = el('button.btn.btn-accent', { type: 'button' });
    node = el('div#mission', null,
      el('div.topbar', null,
        el('button.btn.btn-ghost.btn-round', {
          'aria-label': 'もどる',
          onclick(){ Home.render(); UI.show('home', { replace: true }); }
        }, '←'),
        titleEl),
      el('div.mission-sheet', null, mascotSVG('happy', 'talk'), promptEl, noteEl,
        el('div.mission-actions', null, doneBtn,
          el('button.btn', {
            text: 'あとで',
            onclick(){ Home.render(); UI.show('home', { replace: true }); }
          }))));
    return UI.register('mission', node);
  }

  function open(mission){
    build();
    titleEl.textContent = 'きょうの さんすう ミッション';
    promptEl.textContent = mission.text;
    noteEl.textContent = mission.prompt;
    doneBtn.textContent = 'おうちのひとに かくにんしてもらう';
    doneBtn.onclick = () => {
      Parent.open(() => {
        Store.completeMission(mission.day);
        Sound.sfx.finish();
        Home.render();
        UI.show('home', { replace: true });
      });
    };
    UI.show('mission');
    Sound.say(mission.text + '。' + mission.prompt, { delay: 250 });
  }

  function openReview(mission){
    build();
    titleEl.textContent = 'きのうの ミッション';
    promptEl.textContent = mission.text;
    noteEl.textContent = 'どんな ふうに できたか、おうちのひとに おはなししよう';
    doneBtn.textContent = 'おはなし できた！';
    doneBtn.onclick = () => {
      Store.reviewMission(mission.day);
      Sound.sfx.correct();
      Home.render();
      UI.show('home', { replace: true });
    };
    UI.show('mission');
    Sound.say('昨日のミッション、どんなふうにできたかお話ししよう。', { delay: 250 });
  }

  function resultCard(gameId){
    const m = forGame(gameId || 'count');
    const b = el('button.result-mission', { type: 'button', onclick(){ open(m); } },
      el('b', { text: 'きょうの さんすう ミッション' }),
      el('span', { text: m.text }),
      el('small', { text: m.done ? 'できました！' : 'おうちのひとと やってみよう' }));
    return b;
  }

  return { forGame, yesterdayReview, open, openReview, resultCard };
})();

/* ---- 90-screens.js ---- */
/* ===========================================================
   90 — shell screens: title, home, levels, result, sticker book, parents
   =========================================================== */
'use strict';

/* ---------------------------------------------------------- TITLE */
const Title = (() => {
  let node, starting = false;
  function build(){
    if (node) return node;
    const logo = el('h1.big', null,
      el('span', { text: 'か', style: { color: 'var(--c-red)' } }),
      el('span', { text: 'ず', style: { color: 'var(--c-orange)' } }),
      el('span', { text: 'の', style: { color: 'var(--c-green)' } }),
      el('span', { text: 'ぼ', style: { color: 'var(--c-blue)' } }),
      el('span', { text: 'う', style: { color: 'var(--c-purple)' } }),
      el('span', { text: 'けん', style: { color: 'var(--c-pink)' } }));
    const start = el('button.btn.btn-accent', {
      text: 'はじめる',
      onclick(){
        if (starting) return;
        starting = true;
        Sound.unlock();
        Sound.sfx.unlockSfx();
        Sound.say('数の冒険へ、ようこそ！', { delay: 260 });
        Sound.probeVoice(1200).then(hasVoice => {
          starting = false;
          if (Sound.voiceOn && !hasVoice){
            Home.render();
            UI.show('home', { replace: true });
          } else if (Diagnostic.shouldRun()) Session.startDiagnostic();
          else {
            Home.render();
            UI.show('home', { replace: true });
          }
        });
      }
    });
    node = el('div#title', null,
      mascotSVG('happy', 'talk'),
      logo,
      el('div.tag', { text: Progress.g1Open()
        ? 'しょうがっこう 1ねんせいの もんだいも あるよ'
        : 'しょうがっこうへ いく まえに　さんすうの ちからを あそんで つける' }),
      start,
      el('div.foot', { text: 'おと が でます。iPad は よこむき が おすすめ です' }));
    return UI.register('title', node);
  }
  return { build };
})();

/* ---------------------------------------------------------- HOME */
const Home = (() => {
  let node, worldsEl, starEl, dailyEl, focusEl, recommendEl, reviewEl, voiceWarnEl, shelfEl, dailiesEl;

  function build(){
    if (node) return node;
    starEl   = el('span', { text: '0' });
    worldsEl = el('div.worlds');
    dailyEl  = el('button.daily', { type: 'button', onclick(){ Sound.sfx.tap(); Session.startDaily(10); } });
    recommendEl = el('button.daily.recommended', {
      type: 'button', onclick(){ Sound.sfx.tap(); Diagnostic.startRecommended(); }
    });
    reviewEl = el('button.daily.reviewmission', { type: 'button', hidden: true });
    voiceWarnEl = el('div.voice-warning', {
      hidden: true, role: 'status', 'aria-live': 'polite'
    });
    node = el('div#home', null,
      el('div.home-head', null,
        el('h1.logo', null,
          el('span.k', { text: 'かず' }), el('span.n', { text: 'の' }), el('span.b', { text: 'ぼうけん' })),
        el('div.spacer'),
        el('div.starcount', null, starSVG(true), starEl),
        el('button.btn.btn-round', { 'aria-label': 'シールブック', title: 'シールブック',
          onclick(){ Sound.sfx.tap(); Book.render(); UI.show('book'); } }, '📖'),
        el('button.btn.btn-round', { 'aria-label': 'おうちのかたへ', title: 'おうちのかたへ',
          onclick(){ Sound.sfx.tap(); Parent.open(); } }, '👤')));
    /* きょうの れんしゅう reviews everything the child has unlocked, which means a
       single weak fact comes round about once a fortnight. This is the aimed set:
       three or four facts, ten questions, each fact several times. */
    focusEl = el('button.daily.focusset', { type: 'button', hidden: true });
    shelfEl = el('button.shelf', { type: 'button',
      onclick(){ Sound.sfx.tap(); Book.render(); UI.show('book'); } });
    /* The door to 1ねんせい used to have a progress banner of its own down here.
       It said what the locked cards on the map already say, and between it and the
       sticker shelf the map itself was the smallest thing on its own screen. The
       padlocked cards in the 1ねんせい world carry the message now. */
    /* one row, never a stack: four banners each on their own line pushed the
       map itself off the bottom of an iPad */
    dailiesEl = el('div.dailies', null, recommendEl, dailyEl, reviewEl, focusEl);
    node.append(voiceWarnEl, dailiesEl, worldsEl, shelfEl);
    return UI.register('home', node);
  }

  function gameCard(g){
    /* These used to count "levels with any star at all", so three scraped passes
       looked exactly like three perfect ones — and did not match the 3/9 the
       parent page showed for the same child. Same arithmetic on both screens now. */
    const earned = Store.gameStars(g.id, g.levels.length);
    const max = g.levels.length * 3;
    const perfect = earned === max;
    const done = earned === 0 ? 0 : Math.max(1, Math.round((earned / max) * 3));
    const st = el('div.st');
    for (let i = 0; i < 3; i++) st.append(starSVG(i < done));
    return el('button.gamecard', {
      type: 'button', title: g.name + '　★ ' + earned + '/' + max,
      onclick(){ Sound.sfx.tap(); Levels.render(g); UI.show('levels'); }
    },
      el('div.ico', { text: perfect ? '👑' : g.ico }),
      el('div.nm', { text: g.name }),
      st);
  }

  /* The classroom is on this screen from the first day, behind a padlock.

     It was hidden until the shelf was half full, on the theory that a lock a child
     cannot open yet is discouraging. That is true of a lock with nothing behind it
     — and this one has four named games behind it. Seeing 「なかまづくり」 and
     「20までの かず」 sitting there, greyed out, is the reason to fill the shelf;
     an empty space where they would be is not. Tapping one says how to get in and
     goes to the sticker book, which is where the count lives. */
  function lockedCard(g){
    return el('button.gamecard.locked', {
      type: 'button', title: g.name + '　シールを ぜんぶ あつめると あそべるよ',
      onclick(){
        Sound.sfx.tap();
        Sound.say('シールが全部そろうと、遊べるようになるよ。', { delay: 120 });
        Book.render();
        UI.show('book');
      }
    },
      el('div.ico', { text: g.ico }),
      el('div.nm', { text: g.name }),
      el('div.lockmark', { text: '🔒' }));
  }

  function render(){
    build();
    starEl.textContent = String(Store.totalStars());
    const n = Store.todayCount(), streak = Store.streak();
    const firstRun = Diagnostic.shouldRun();
    const rec = Diagnostic.current();
    const recGame = rec && Games.byId[rec.gameId];
    clear(recommendEl);
    recommendEl.hidden = !recGame;
    if (recGame){
      const lv = recGame.levels[rec.levelIndex] || recGame.levels[0];
      recommendEl.append(
        mascotSVG('happy', 'talk'),
        el('div.grow', null,
          el('div.t', { text: firstRun ? 'はじめの ぼうけん' : 'いまの おすすめ' }),
          el('div.s', { text: firstRun
            ? '10もんで ぴったりの はじまりを みつけよう'
            : recGame.name + '　《' + lv.t + '》' })),
        el('div.go', { text: '▶' }));
      recommendEl.onclick = () => {
        Sound.sfx.tap();
        if (firstRun) Session.startDiagnostic(); else Diagnostic.startRecommended();
      };
    }
    voiceWarnEl.hidden = !Sound.voiceOn || (!!window.speechSynthesis && Sound.hasVoice);
    voiceWarnEl.textContent = voiceWarnEl.hidden ? ''
      : 'よみあげる こえが みつかりません。おうちの ひとと せっていを みてね。';
    if (!voiceWarnEl.hidden){
      Sound.probeVoice(3000).then(ok => {
        if (ok){ voiceWarnEl.hidden = true; voiceWarnEl.textContent = ''; }
      });
    }
    const review = Missions.yesterdayReview();
    reviewEl.hidden = !review;
    if (review){
      clear(reviewEl);
      reviewEl.append(
        el('div.grow', null,
          el('div.t', { text: 'きのうの ミッション' }),
          el('div.s', { text: 'どんな ふうに できたか おはなししよう' })),
        el('div.go', { text: '▶' }));
      reviewEl.onclick = () => Missions.openReview(review);
    }
    clear(dailyEl);
    dailyEl.classList.toggle('done', n >= 10);
    dailyEl.append(
      mascotSVG(n >= 10 ? 'cheer' : 'happy', 'talk'),
      el('div.grow', null,
        el('div.t', { text: n >= 10 ? 'きょうの れんしゅう おわり！' : 'きょうの れんしゅう' }),
        el('div.s', { text: n >= 10
          ? `きょうは ${n}もん がんばったね　･　${streak}にち れんぞく`
          : 'ぜんぶの あそびから 10もん でるよ' })),
      el('div.go', { text: n >= 10 ? '🎉' : '▶' }));

    const weak = Store.weakFacts(4);
    focusEl.hidden = weak.length < 2;      // one wobbly fact is not a practice set
    if (!focusEl.hidden){
      clear(focusEl);
      focusEl.append(
        mascotSVG('soft', 'talk'),
        el('div.grow', null,
          el('div.t', { text: 'にがて あつめ' }),
          el('div.s', { text: weak.slice(0, 2).map(w => w.label).join('　･　')
                              + (weak.length > 2 ? '　ほか' : '') })),
        el('div.go', { text: '▶' }));
      focusEl.onclick = () => { Sound.sfx.tap(); Session.startFocus(weak.map(w => w.key), { n: 10 }); };
    }

    const got = Store.data.stickers;
    clear(shelfEl);
    const strip = el('div.strip');
    if (got.length){
      got.slice(-16).reverse().forEach(k => strip.append(el('span', { text: stickerFor(k) })));
    } else {
      strip.append(el('span.empty', { text: 'レベルを クリアすると シールが たまるよ' }));
    }
    shelfEl.append(
      el('span.bk', { text: '📖' }),
      el('div.lbl', null, 'シール ' + got.length + 'まい', el('small', { text: 'タップで シールブック' })),
      strip);

    /* how many banners share the row decides how much of each one fits: with three
       or four up, the mascot's width is worth more to the name than the mascot is */
    const shown = [...dailiesEl.children].filter(c => !c.hidden).length;
    dailiesEl.className = 'dailies n' + shown;

    const open1 = Progress.g1Open();

    clear(worldsEl);
    WORLDS.forEach(w => {
      const games = Games.list.filter(g => g.world === w.id);
      if (!games.length) return;
      const shut = (w.stage || 'pre') !== 'pre' && !open1;
      const grid = el('div.gamegrid');
      games.forEach(g => grid.append(shut ? lockedCard(g) : gameCard(g)));
      // the world's own name already says 1ねんせい; a second badge saying it again
      // only takes the room the name needs to stay on one line
      worldsEl.append(el('div.world' + ((w.stage || 'pre') !== 'pre' ? '.newstage' : '')
        + (shut ? '.shut' : ''),
        { style: { '--wc': w.color } },
        el('h3', null, el('span.chip', { text: w.name }),
          el('span.sub', { text: shut ? 'シールが ぜんぶ そろうと ひらくよ' : w.sub })), grid));
    });
  }
  return { build, render };
})();

/* ---------------------------------------------------------- LEVELS */
const Levels = (() => {
  let node, titleEl, listEl, game = null;
  function build(){
    if (node) return node;
    titleEl = el('h2');
    listEl  = el('div.levels');
    node = el('div#levels', null,
      el('div.topbar', null,
        el('button.btn.btn-ghost.btn-round', { 'aria-label': 'もどる',
          onclick(){ Sound.sfx.tap(); Home.render(); UI.show('home', { replace: true }); } }, '←'),
        titleEl),
      listEl);
    return UI.register('levels', node);
  }
  function render(g){
    build();
    game = g;
    titleEl.textContent = g.ico + '　' + g.name;
    clear(listEl);
    g.levels.forEach((lv, i) => {
      const stars = Store.stars(g.id, i);
      const unlocked = Store.levelUnlocked(g.id, i);
      const card = el('button.levelcard' + (unlocked ? '' : '.locked'), {
        type: 'button', style: { '--lc': g.color },
        onclick(){
          Sound.sfx.tap();
          if (!unlocked){ Sound.say('前のレベルをクリアすると、遊べるよ。', { delay: 120 }); return; }
          Session.startLevel(g, i);
        }
      },
        el('div.num', { text: unlocked ? String(i + 1) : '🔒' }),
        el('div.body', null, el('div.t', { text: lv.t }), el('div.d', { text: lv.d })),
        // ★★★ is "all right first time"; this is "and without counting"
        Store.isSwift(g.id, i) ? el('span.swiftmark', { title: 'すぐ こたえられた', text: '⚡️' }) : null,
        UI.stars(stars));
      listEl.append(card);
    });

  }
  return { build, render, get game(){ return game; } };
})();

/* ---------------------------------------------------------- RESULT */
const Result = (() => {
  let node, inner;
  function build(){
    if (node) return node;
    inner = el('div.inner');
    node = el('div#result', null, inner);
    return UI.register('result', node);
  }
  function show(r){
    build();
    clear(inner);
    const msg = r.mode === 'diagnostic' ? 'さいしょの ぼうけん クリア！'
              : r.stars === 3 ? 'パーフェクト！'
              : r.stars === 2 ? 'よく できました！'
              : r.stars === 1 ? 'クリア！'
              : 'おしい！ もう いちど やってみよう';
    // the children read `msg`, so it stays hiragana; the voice gets kanji, which
    // is what lets a Japanese engine phrase it instead of droning it out
    const spoken = (r.unlockedG1 ? 'シールが全部そろったね！小学校一年生の問題ができるよ！'
                 : r.mode === 'diagnostic' ? '最初の冒険、クリア！おすすめを見つけたよ。'
                 : r.swift ? 'パーフェクト！すぐ答えられたね！'
                 : r.stars === 3 ? 'パーフェクト！'
                 : r.stars === 2 ? 'よくできました！'
                 : r.stars === 1 ? 'クリア！'
                 : '惜しい！もう一度やってみよう。');
    inner.append(
      mascotSVG(r.stars === 0 ? 'soft' : 'cheer', r.stars === 0 ? 'talk' : 'cheer'),
      r.mode === 'diagnostic'
        ? el('div.diagnostic-badge', { text: '10もん たんけん できたね' })
        : UI.stars(r.stars, true),
      el('div.result-msg', { text: msg }),
      el('div.result-sub', { text: r.mode === 'diagnostic'
        ? 'ぴったりの はじまりを みつけたよ'
        : `${r.total}もん中 ${r.right}もん を いっかいめで せいかい` }));
    /* Every sticker is now a step towards a door the child can already see on the
       home screen. Saying how many are left, at the moment one is earned, is what
       turns「シールを もらった」into「あと 3まい」. */
    if (r.sticker && !r.unlockedG1 && !Progress.g1Open()){
      const st = Progress.preStickers();
      const left = Math.max(0, st.total - st.got);
      if (left) inner.append(el('div.stagenext' + (left <= 6 ? '.nearly' : ''), null,
        el('span.mk', { text: '🔒' }),
        '1ねんせいの きょうしつまで ',
        el('b', { text: 'あと ' + left + 'まい' })));
    }
    /* The last sticker. This is the one screen in the app that says the child has
       finished 入学前 — it has to say it in words a six-year-old reads, on the
       screen they are already looking at, not in a menu they might find later. It
       goes above the sticker and the mission: on a screen this tall, the thing
       that has to be read first cannot be the thing furthest down. */
    if (r.unlockedG1){
      inner.append(el('div.unlocked', null,
        el('div.e', { text: '🎓' }),
        el('div.l', { text: 'シールが ぜんぶ そろった！' }),
        el('b', { text: 'しょうがっこう 1ねんせいの もんだいが できるよ！' }),
        el('div.l', { text: '「1ねんせいの きょうしつ」が ホームに ふえたよ' })));
    }
    /* The thing ★★★ could never say. These levels are for an answer that arrives,
       and a child who counted their way to every right answer used to get exactly
       the same three stars as one who remembered. */
    if (r.swift){
      inner.append(el('div.swift', null,
        el('span.mk', { text: '⚡️' }), 'かぞえないで こたえられたね！'));
    }
    /* Name what went wrong. "62%" tells a child nothing; "3と7" is something they
       can carry to tomorrow — and it is exactly what the app will bring back.

       The names are also the way back to them. This screen used to list the facts
       and then offer「つぎの レベルへ」as the only bright button: it named the gap
       and walked the child straight past it. */
    const shakyKeys = (r.shaky || []).map(x => x.key).filter(k => Store.factOrigin(k));
    const aimed = r.mode === 'focus' ? (r.focusKeys || []) : shakyKeys;
    const runFocus = () => { Sound.sfx.tap(); Session.startFocus(aimed, { n: 10 }); };
    if (r.shaky && r.shaky.length){
      const list = el('div.shakylist');
      r.shaky.forEach(x => {
        const usable = aimed.indexOf(x.key) >= 0 || (r.mode !== 'focus' && shakyKeys.indexOf(x.key) >= 0);
        list.append(usable
          ? el('button.shakyitem', { type: 'button', text: x.label, onclick: runFocus })
          : el('span.shakyitem', { text: x.label }));
      });
      inner.append(el('div.shaky', null,
        el('div.l', { text: aimed.length ? 'つぎは これを もういちど（タップで れんしゅう）'
                                         : 'つぎは これを もういちど' }), list));
    }
    if (r.sticker){
      inner.append(el('div.newsticker' + (r.sticker.gold ? '.gold' : ''), null,
        el('div.e', { text: r.sticker.emoji }),
        el('div.l', { text: r.sticker.gold ? 'きんの シール を ゲット！' : 'シール を ゲット！' })));
    }
    if (r.mode === 'diagnostic' && r.recommended){
      const g = Games.byId[r.recommended.gameId];
      if (g){
        const lv = g.levels[r.recommended.levelIndex] || g.levels[0];
        inner.append(el('div.diagnostic-next', null,
          el('div.l', { text: 'つぎの おすすめ' }),
          el('b', { text: g.name + '　《' + lv.t + '》' })));
      }
    } else if (!r.unlockedG1 && (r.mode === 'daily' || (r.mode === 'level' && r.stars >= 1))) {
      // one piece of news per screen: the classroom outranks today's kitchen-table task
      inner.append(Missions.resultCard(r.lastGameId));
    }
    const actions = el('div.result-actions');
    // practising the facts that just went wrong outranks anything else on offer
    const lead = aimed.length > 0 && r.mode !== 'diagnostic';
    if (r.mode === 'focus'){
      actions.append(el('button.btn.btn-accent.primary', { text: 'もういちど', onclick: runFocus }));
    } else if (lead){
      actions.append(el('button.btn.btn-accent.primary', { text: 'にがてを れんしゅう', onclick: runFocus }));
    }
    if (r.mode === 'diagnostic'){
      actions.append(el('button.btn.btn-accent.primary', {
        text: 'おすすめで あそぶ',
        onclick(){ Sound.sfx.tap(); Diagnostic.startRecommended(); }
      }));
    } else if (r.mode === 'level'){
      // when nothing was earned, another go is the obvious next step, not a footnote
      actions.append(el('button.btn' + (r.stars === 0 && !lead ? '.btn-accent.primary' : ''), { text: 'もういちど',
        onclick(){ Sound.sfx.tap(); Session.startLevel(r.game, r.levelIndex); } }));
      const nxt = r.levelIndex + 1;
      if (nxt < r.game.levels.length && Store.levelUnlocked(r.game.id, nxt)){
        actions.append(el('button.btn' + (lead ? '' : '.btn-accent.primary'), { text: 'つぎの レベルへ',
          onclick(){ Sound.sfx.tap(); Session.startLevel(r.game, nxt); } }));
      }
    } else if (r.mode === 'daily'){
      actions.append(el('button.btn', { text: 'もういちど', onclick(){ Sound.sfx.tap(); Session.startDaily(10); } }));
    }
    if (r.unlockedG1){
      actions.append(el('button.btn.btn-accent.primary', { text: '1ねんせいの きょうしつへ',
        onclick(){ Sound.sfx.tap(); Home.render(); UI.show('home', { replace: true }); } }));
    }
    actions.append(el('button.btn' + (r.mode === 'level' || r.mode === 'diagnostic' || lead || r.mode === 'focus' || r.unlockedG1 ? '' : '.btn-accent'),
      { text: 'あそびを えらぶ',
        onclick(){ Sound.sfx.tap(); Home.render(); UI.show('home', { replace: true }); } }));
    inner.append(actions);
    UI.show('result', { replace: true });
    Sound.say(spoken, { delay: 700 });
    for (let i = 0; i < r.stars; i++) setTimeout(() => Sound.sfx.star(i), 400 + i * 260);
  }
  return { show, build };
})();

/* ---------------------------------------------------------- STICKER BOOK */
const Book = (() => {
  let node, grid, count;
  function build(){
    if (node) return node;
    grid = el('div.book');
    count = el('div.aim');
    node = el('div#book', null,
      el('div.topbar', null,
        el('button.btn.btn-ghost.btn-round', { 'aria-label': 'もどる',
          onclick(){ Sound.sfx.tap(); UI.show('home', { replace: true }); } }, '←'),
        el('h2', { text: '📖　シールブック' })),
      count, grid);
    return UI.register('book', node);
  }
  function render(){
    build();
    clear(grid);
    let got = 0;
    const drawSlots = keys => keys.forEach(key => {
      const has = Store.hasSticker(key);
      if (has) got++;
      grid.append(el('div.sticker' + (has ? (key.endsWith(':g') ? '.got.gold' : '.got') : ''),
        { text: has ? stickerFor(key) : '･' }));
    });
    /* The 入学前 shelf is the one that opens the 小1 classroom, so it is the one
       this page counts towards a goal. The classroom's own stickers go in a second
       group below, and only once it is open — an empty row of slots for a world a
       child cannot reach would make the goal look further away than it is. */
    const pre = Progress.preStickers();
    drawSlots(Progress.slots('pre'));
    Store.data.stickers.filter(k => k.indexOf('daily:') === 0 || k.indexOf('focus:') === 0).forEach(k => {
      got++;
      grid.append(el('div.sticker.got.gold', { text: stickerFor(k) }));
    });
    if (Progress.g1Open()){
      grid.append(el('div.bookgroup', { text: '🎓　1ねんせいの きょうしつ' }));
      drawSlots(Progress.slots('g1'));
    } else {
      /* Shown, but plainly not part of the count above: a shelf a child can see
         waiting for them is the reason to fill the one they are on. */
      grid.append(el('div.bookgroup.shut', { text: '🔒　1ねんせいの きょうしつ　ぜんぶ そろうと ここが ひらくよ' }));
      Progress.slots('g1').forEach(() => grid.append(el('div.sticker.shut', { text: '🔒' })));
    }
    const left = Math.max(0, pre.total - pre.got);
    count.innerHTML = `<b>${got}まい</b> あつめたよ　･　レベルを クリアすると シールが 1まい。ぜんぶ せいかい で きんいろの シール`
      + (left
        ? `<br><b>あと ${left}まい</b> で しょうがっこう 1ねんせいの もんだいが ひらくよ（${pre.got}／${pre.total}）`
        : '<br><b>ぜんぶ そろったね！</b> しょうがっこう 1ねんせいの もんだいが できるよ');
  }
  return { build, render };
})();

/* ===========================================================
   91 — おうちのかたへ (parent area): progress, why it matters, settings
   =========================================================== */
'use strict';

const Parent = (() => {
  let gateNode, sheetNode, sheetInner, justReset = false, afterGate = null;
  let persistState = '確認中';
  let lastBackupMsg = null;   // survives the re-render that a successful import triggers
  let a = 0, b = 0, want = 0;

  /* ---- simple adult gate ---- */
  function buildGate(){
    if (gateNode) return gateNode;
    const q = el('div.q');
    const choices = el('div.choices');
    function roll(){
      a = ri(12, 19); b = ri(3, 9); want = a * b;
      q.textContent = a + ' × ' + b + ' = ?';
      clear(choices);
      const opts = shuffle([want, want + ri(3, 9), want - ri(3, 9), want + ri(10, 20)]);
      opts.forEach(v => choices.append(el('button.choice', {
        type: 'button', text: String(v),
        onclick(e){
          if (v === want){
            Sound.sfx.correct();
            const next = afterGate;
            afterGate = null;
            if (next) next();
            else { render(); UI.show('parent'); }
          }
          else { e.currentTarget.classList.add('wrong'); Sound.sfx.wrong(); setTimeout(roll, 500); }
        }
      })));
    }
    gateNode = el('div#gate', null,
      el('div.topbar', null,
        el('button.btn.btn-ghost.btn-round', { 'aria-label': 'もどる',
          onclick(){ Sound.sfx.tap(); UI.show('home', { replace: true }); } }, '←'),
        el('h2', { text: 'おうちの かたへ' })),
      el('div.gate', null,
        el('div.hint', { text: 'おとなの かた だけが すすめます。けいさんの こたえを えらんで ください。' }),
        q, choices));
    UI.register('gate', gateNode);
    gateNode._roll = roll;
    return gateNode;
  }

  function open(onSuccess){
    buildGate();
    afterGate = typeof onSuccess === 'function' ? onSuccess : null;
    gateNode._roll();
    UI.show('gate');
  }

  /* ---- dashboard ---- */
  function buildSheet(){
    if (sheetNode) return sheetNode;
    sheetInner = el('div.sheet-inner');
    sheetNode = el('div#parent', null,
      el('div.topbar', null,
        el('button.btn.btn-ghost.btn-round', { 'aria-label': 'もどる',
          onclick(){ Sound.sfx.tap(); Home.render(); UI.show('home', { replace: true }); } }, '←'),
        el('h2', { text: 'おうちの かたへ' })),
      el('div.sheet', null, sheetInner));
    return UI.register('parent', sheetNode);
  }

  const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
  const secs = ms => ms == null ? '—' : (ms / 1000).toFixed(1) + '秒';

  function progressSection(){
    const sec = el('section');
    sec.append(el('div.eyebrow', { text: 'progress' }), el('h3', { text: 'ここまでのようす' }));
    const t = el('table.skilltable');
    t.append(el('thead', null, el('tr', null,
      el('th', { text: '遊び' }), el('th', { text: '到達' }),
      el('th', { class: 'n', text: '★' }),
      el('th', { class: 'n', text: '直近30問' }),
      el('th', { class: 'n', text: 'こたえるまで' }),
      el('th', { class: 'n', text: '通算' }),
      el('th', { class: 'n', text: '問題数' }))));
    const body = el('tbody');
    WORLDS.forEach(w => {
      const games = Games.list.filter(g => g.world === w.id);
      if (!games.length || ((w.stage || 'pre') !== 'pre' && !Progress.g1Open())) return;
      body.append(el('tr', null, el('td', { colspan: 7, style: { color: w.color, fontWeight: 800, paddingTop: 'calc(var(--u)*.8)' }, text: w.name })));
      games.forEach(g => {
        const s = Store.gameStars(g.id, g.levels.length);
        const max = g.levels.length * 3;
        const now = Store.gameRecentAccuracy(g.id, g.levels.length);   // the one to act on
        const acc = Store.accuracy(g.id);                              // lifetime, for context
        const seen = Store.data.seen[g.id] || 0;
        /* The second axis. 「1回目で正解」cannot separate a child who remembers
           「10は4と6」from one who counted the six empty cells for nine seconds —
           and only the first of those is what くり上がり needs. */
        const ms = g.fluent ? Store.gameSpeed(g.id) : null;
        const slowNow = ms != null && ms >= FLUENT_SLOW_MS;
        const fastNow = ms != null && ms <= FLUENT_FAST_MS;
        body.append(el('tr', null,
          el('td', { text: g.name }),
          el('td', null, el('div.bar', null, el('i', { style: { width: (max ? (s / max) * 100 : 0) + '%',
            background: now != null && now < .6 ? 'var(--oops)' : 'var(--good)' } }))),
          el('td', { class: 'n', text: s + '/' + max }),
          el('td', { class: 'n', style: { color: now != null && now < .6 ? 'var(--oops-ink)' : null, fontWeight: 800 }, text: pct(now) }),
          el('td', { class: 'n', style: { color: slowNow ? 'var(--oops-ink)' : fastNow ? 'var(--good-ink)' : 'var(--ink-soft)',
                                          fontWeight: slowNow || fastNow ? 800 : 500 },
                     text: g.fluent ? secs(ms) : '—' }),
          el('td', { class: 'n', style: { color: 'var(--ink-soft)' }, text: pct(acc) }),
          el('td', { class: 'n', text: String(seen) })));
      });
    });
    t.append(body);
    sec.append(el('div', { style: { overflowX: 'auto' } }, t));
    sec.append(el('p', { style: { marginTop: 'calc(var(--u)*.8)' },
      text: '「直近30問」「通算」はどちらも「1回目のタップで正解した割合」です。判断に使うのは直近30問のほうです。通算は開始以来の平均なので、1か月目に苦戦した記録がいつまでも分母に残り、いま伸びていることも、いまつまずき始めたことも映しません。直近が60%を下回っている遊びは赤で出ます。' }));
    sec.append(el('p', {
      text: '「こたえるまで」は、けいさんの やま の4つの遊びだけに出ます。問題が出てから最初に答えるまでの時間で、正解だったときだけ記録しています。3.0秒までなら緑（思い出している）、9.0秒を超えると赤（数えて出している）。正答率だけを見ていると「できている」と「数えればできる」が同じ数字になりますが、くり上がりの計算で効くのは前者だけです。ここが赤い遊びは、正答率が高くても、まだ仕上がっていません。' }));
    return sec;
  }

  /* ---- 今週やること ----
     The dashboard used to be a table plus an essay, and deciding what the child
     should practise was left entirely to the reader. The app has the data. */
  function nextUpSection(){
    const sec = el('section');
    sec.append(el('div.eyebrow', { text: 'next' }), el('h3', { text: '今週やること' }));

    /* One question answered wrong is not a diagnosis. Nothing is named here until
       there is a level's worth of evidence behind it. */
    const ENOUGH = 8;
    const levels = [];
    Games.list.forEach(g => g.levels.forEach((lv, i) => {
      if (!levelOpen(g, i)) return;
      const n = Store.recentCount(g.id, i);
      if (n < ENOUGH) return;
      levels.push({ g, lv, i, n, acc: Store.recentAccuracy(g.id, i), cold: Store.daysSince(g.id, i) });
    }));

    if (!levels.length){
      sec.append(el('p', { text: '判断できるだけの回数がまだありません（1レベル＝8問を、どれか1つ最後まで）。「かずの しま」の《かぞえよう》から始めてください。1日1レベルで十分です。' }));
      return sec;
    }

    const focus = levels.slice().sort((a, b) => a.acc - b.acc)[0];
    const stale = levels.slice()
      .filter(x => x.acc >= .75 && x.cold >= 7)
      .sort((a, b) => b.cold - a.cold)[0];

    const line = (mark, head, body2) => el('div.todo', null,
      el('div.mk', { text: mark }),
      el('div', null, el('b', { text: head }), el('div', { text: body2 })));

    if (focus.acc < .75){
      sec.append(line('◎', focus.g.name + '　《' + focus.lv.t + '》',
        '直近' + focus.n + '問の初回正答率 ' + pct(focus.acc) + '。ここを中心に、1日1回。8問を最後までやりきれば十分です。'));
    } else {
      sec.append(line('◎', focus.g.name + '　《' + focus.lv.t + '》',
        '直近' + focus.n + '問で ' + pct(focus.acc) + '。いちばん低いところがこれなら、よく仕上がっています。次のレベルに進んで構いません。'));
    }
    // what that game is actually for — the one place a parent is most likely to read it
    if (focus.g.aim) sec.append(el('div.aimnote', { html: focus.g.aim }));
    if (stale && stale !== focus){
      sec.append(line('○', stale.g.name + '　《' + stale.lv.t + '》',
        stale.cold + '日ふれていません。できていたことなので、思い出す時間として1回だけ。'));
    }

    /* the exact facts that are missing — the thing a per-game percentage can never say */
    const facts = Store.data.facts || {};
    const weak = [];
    for (const k in facts){
      const f = facts[k];
      // "missed it at least twice", not "missed it once" — one slip is not a gap
      if (!f || (f[0] - f[1]) < 2) continue;
      const acc = f[1] / f[0];
      if (acc >= .6) continue;
      const gid = k.slice(0, k.indexOf(':'));
      weak.push({ acc, n: f[0], label: f[3] || k, game: (Games.byId[gid] || {}).name || gid });
    }
    weak.sort((a, b) => a.acc - b.acc || b.n - a.n);
    if (weak.length){
      sec.append(el('h4', { text: 'つまずいている中身' }));
      const chips = el('div.factchips');
      weak.slice(0, 8).forEach(w => chips.append(
        el('span.factchip', null, el('small', { text: w.game }), w.label)));
      sec.append(chips);
      sec.append(el('p', { text: 'ここに出た項目は「きょうの れんしゅう」が自動で多めに出します。声かけに使うなら、答えを教えるより、おはじきやお菓子で同じ数を作ってみせるほうが早いです。' }));
    } else {
      sec.append(el('p', { style: { marginTop: 'calc(var(--u)*.8)' },
        text: '取りこぼしている項目はいまのところありません。' }));
    }

    /* Right every time, and still counted out. Invisible to every number on this
       page until answers were timed, and the single most useful thing to work on
       once the accuracy is already there. */
    const slowOnes = [];
    for (const k in facts){
      const f = facts[k];
      if (!f || !f[0] || !f[5] || f[5] < FLUENT_SLOW_MS) continue;
      if (f[1] / f[0] < .6) continue;                 // already named above
      const gid = k.slice(0, k.indexOf(':'));
      slowOnes.push({ ms: f[5], label: f[3] || k, game: (Games.byId[gid] || {}).name || gid });
    }
    slowOnes.sort((a, b) => b.ms - a.ms);
    if (slowOnes.length){
      sec.append(el('h4', { text: 'できるけれど、数えている' }));
      const chips = el('div.factchips');
      slowOnes.slice(0, 8).forEach(w => chips.append(
        el('span.factchip.slow', null, el('small', { text: w.game + '　' + secs(w.ms) }), w.label)));
      sec.append(chips);
      sec.append(el('p', { text: '正解はしていますが、答えが出るまでに時間がかかっています。指を折る、枠のマスを数える、というやり方で合わせている状態です。まちがいではないので放っておかれがちですが、くり上がりのたし算は「9+4 を 9+1+3 にする」途中でこの答えを即座に使うので、ここが遅いとその先が進みません。「にがて あつめ」はこれらも拾います。家では、答えを急がせるより、おはじきを5と5、6と4 のように置いて見せて「かたまりで見る」経験を足すほうが早いです。' }));
    }
    return sec;
  }

  /* ---- なぜこの遊びなのか ----
     Every game carries an `aim`: a short piece on the thing it is for. All fifteen
     were written, the README says they appear here, and nothing ever rendered
     them — a page of reasoning that no parent could reach. */
  function aimsSection(){
    const sec = el('section');
    sec.append(el('div.eyebrow', { text: 'why each game' }),
      el('h3', { text: 'それぞれの遊びで つく ちから' }),
      el('p', { text: '「うちの子はこれをやって何が身につくのか」への答えです。上の表で数字が低い遊びがあったら、まずここを読んでから、下の「おうちでできること」を試してみてください。' }));
    WORLDS.forEach(w => {
      const games = Games.list.filter(g => g.world === w.id && g.aim);
      if (!games.length || ((w.stage || 'pre') !== 'pre' && !Progress.g1Open())) return;
      sec.append(el('h4', { text: w.name, style: { color: w.color } }));
      const list = el('div.aimlist');
      games.forEach(g => list.append(el('div.aimrow', null,
        el('div.ico', { text: g.ico }),
        el('div', null,
          el('b', { text: g.name }),
          el('div', { html: g.aim })))));
      sec.append(list);
    });
    return sec;
  }

  function statsSection(){
    const s = el('section');
    const row = (k, v) => el('div', { style: { display: 'flex', justifyContent: 'space-between', gap: 'calc(var(--u)*1)' } },
      el('span', { text: k }), el('b', { style: { fontFamily: 'var(--fs-num)' }, text: v }));
    // a locked world must not inflate the denominator: 48/48 has to be reachable
    const levels = Games.list.reduce((n, g) => n + (stageOpen(g) ? g.levels.length : 0), 0);
    const pre = Progress.preStickers();
    s.append(el('div.eyebrow', { text: 'summary' }), el('h3', { text: 'これまでの積み重ね' }),
      row('続けた日数（連続）', Store.streak() + '日'),
      row('今日といた問題', Store.todayCount() + '問'),
      row('集めた ★', Store.totalStars() + ' / ' + levels * 3),
      row('集めたシール', Store.data.stickers.length + '枚'),
      row('入学前のシール（1年生が開く条件）', pre.got + ' / ' + pre.total),
      row('「きょうの れんしゅう」初回正答率', pct(Store.practiceAccuracy())));
    return s;
  }

  /* ---- 小学1年生の問題 ----
     The one thing on this page a parent has to be able to decide: the door opens
     itself when the sticker book is full, and it can be opened by hand when the
     child is plainly ready and the book is not. */
  function stageSection(){
    const s = el('section');
    const pre = Progress.preStickers();
    const open1 = Progress.g1Open();
    const byHand = !!Store.data.g1Open;
    s.append(el('div.eyebrow', { text: 'next stage' }),
      el('h3', { text: '小学1年生の問題について' }));
    s.append(el('p', { html: '入学前の48レベルのシールを<b>すべて集めると</b>、ホームに'
      + '<b>「1ねんせいの きょうしつ」</b>が増えます。シールはレベルごとに2枚（クリアで1枚、'
      + '全問1回目で正解するともう1枚・金色）で、全部で' + pre.total + '枚。'
      + 'いまは <b>' + pre.got + ' / ' + pre.total + '</b> 枚です。' }));
    s.append(el('p', { text: '中身は「先取りの計算」ではありません。1年生の1学期は、'
      + '入学前にやったことをもう一度、ちがう聞き方でたどり直します。'
      + '「同じものの集まり」（自分でまとまりを決めてから数える）と'
      + '「1対1対応」（両方を数えるのではなく、ペアにして余りを見る）の2つが中心で、'
      + 'そこから「20までの数（10のまとまりとばら）」と「式に書く（＋か−か）」に進みます。' }));
    const list = el('div.aimlist');
    Games.list.filter(g => Progress.stageOf(g) === 'g1').forEach(g => list.append(el('div.aimrow', null,
      el('div.ico', { text: g.ico }),
      el('div', null, el('b', { text: g.name }), el('div', { html: g.aim })))));
    s.append(list);
    if (open1){
      s.append(el('p', { style: { color: 'var(--good-ink)', fontWeight: 800 },
        text: byHand && pre.got < pre.total
          ? '※ この端末では、おうちの方の操作で先に開いています。'
          : '✓ 開いています。ホームの「1ねんせいの きょうしつ」から遊べます。' }));
      return s;
    }
    s.append(el('p', { text: 'シールが全部そろう前でも、ここから開けられます。'
      + '「かぞえよう」や「いくつと いくつ」が安定していて、本人が先に進みたがっているなら、'
      + '★★★を集めきるのを待つ必要はありません。開けたあとも入学前の遊びはそのまま残りますし、'
      + '一度開けると閉じられません。' }));
    let armed = false;
    const openBtn = el('button.btn', { text: '1ねんせいの もんだいを いま開く' });
    openBtn.addEventListener('click', () => {
      if (!armed){
        armed = true;
        openBtn.textContent = '開きますか？（もう一度タップ）';
        setTimeout(() => { armed = false; openBtn.textContent = '1ねんせいの もんだいを いま開く'; }, 4000);
        return;
      }
      Progress.openG1();
      Sound.sfx.finish();
      Home.render();
      render();
    });
    s.append(openBtn);
    return s;
  }

  const WHY = [
    ['数えられる、ということ',
     'ものを1つずつ指さして「いち、に、さん」と対応させ、最後に言った数がそのまとまり全体の数だと分かる——これが数の出発点です。数唱（1〜10をすらすら言える）ができても、この対応づけができていない子は珍しくありません。「かぞえよう」の◯こちょうだいは、その仕上げの課題です。'],
    ['5と10を分けられる、ということ',
     '入学後にいちばん効くのが「いくつといくつ」です。7は3と4、10は6と4——これを考えずに言えるかどうかで、くり上がりのあるたし算（9+4を9+1+3にする）の習得速度が変わります。半年あるなら、ここは毎日少しずつ触れておきたい単元です。'],
    ['数と見た目を切り離す、ということ',
     '大きいものが少しある方を「多い」と答えるのは、5歳では自然な反応です。並べ方を変えても数は変わらない（数の保存）と気づくには、数えて確かめる経験の量が要ります。「どっちがおおい」は、わざと見た目と数がずれる問題を混ぜています。'],
    ['「3こ」と「3ばんめ」を区別する、ということ',
     '集合の大きさ（基数）と順番（序数）は別物です。1年生の最初の単元でここが混ざる子が多く、「まえから3人」と「まえから3番目の人」で答えが変わることを、体験として持っておくと安心です。'],
    ['きまりを見つける、ということ',
     '繰り返しのパターンを見つけて先を予想する経験は、算数の「見方」そのものです。数だけが算数ではありません。形・分類・規則性は、後の図形や関数の学習に静かにつながっていきます。']
  ];

  const HOME_TIPS = [
    ['おふろ・階段で数える', '10まで数えるより、「10から逆に」数える方が難しく、効果があります。階段を1段ずつ数えるのは一対一対応の練習そのものです。'],
    ['おやつを分ける', '「クッキー10枚を2人で分けよう」は10の分解の実物版。「5と5」以外の分け方も試すと、合成分解の幅が広がります。'],
    ['食卓の配膳', '「4人だからおはしを4膳とってきて」は、数だけ取り出す課題（◯こちょうだい）と同じです。数唱ではなく数の取り出しを求めるのがポイント。'],
    ['買い物のレシート', '「りんごとバナナ、どっちが多い？」など、身の回りのものを比べる声かけを。答えより「どうしてそう思った？」を聞くと、根拠を言葉にする練習になります。'],
    ['時計を生活に結ぶ', '「長い針が12にきたらおやつね」のように、時刻を出来事とセットで使うと、数字の読み取りだけの学習より定着します。']
  ];

  const PLAN = [
    ['1〜2か月め', 'かずの しま を中心に', 'かぞえよう / すうじ どれかな / かずの じゅんばん。まず10までを確実に。数字のなぞり書きも並行して少しずつ。'],
    ['3〜4か月め', 'けいさんの やま に入る', 'いくつと いくつ → 10の おともだち の順で。ここが半年計画の山場です。毎日「きょうの れんしゅう」を1回。'],
    ['5〜6か月め', 'たしざん・ひきざん と 生活の数', '式の形に慣れ、とけい・おおきさくらべ・なんばんめ で入学後の単元に先に触れておきます。'],
    ['そのあと', '1ねんせいの きょうしつ', 'シールが全部そろうと開きます。なかまづくり（同じものの集まり）と 1たい1で くらべる（一対一対応）から、20までの数・式へ。1年生の1学期の順番そのままです。']
  ];

  function textSection(eyebrow, title, pairs){
    const s = el('section');
    s.append(el('div.eyebrow', { text: eyebrow }), el('h3', { text: title }));
    pairs.forEach(([h, p]) => {
      s.append(el('h4', { text: h }));
      s.append(el('p', { text: p }));
    });
    return s;
  }

  function planSection(){
    const s = el('section');
    s.append(el('div.eyebrow', { text: 'roadmap' }), el('h3', { text: '入学までの半年、どう進めるか' }),
      el('p', { text: '1日10分・1レベル（8問）を目安に。「きょうの れんしゅう」は解けるようになった遊びから10問を混ぜて出すので、復習にちょうど良い分量です。' }));
    const t = el('table.skilltable');
    t.append(el('thead', null, el('tr', null,
      el('th', { text: '時期' }), el('th', { text: '中心にする世界' }), el('th', { text: 'ねらい' }))));
    const tb = el('tbody');
    PLAN.forEach(([a2, b2, c]) => tb.append(el('tr', null,
      el('td', { style: { whiteSpace: 'nowrap', fontWeight: 800 }, text: a2 }),
      el('td', { style: { whiteSpace: 'nowrap' }, text: b2 }),
      el('td', { text: c }))));
    t.append(tb);
    s.append(el('div', { style: { overflowX: 'auto' } }, t));
    return s;
  }

  /** Which Japanese voice reads the questions.
      The voice bundled with a device is the “compact” one — flat and robotic.
      The enhanced / premium download is a different recording of the same name,
      so we cannot tell them apart from here: the honest fix is to list what the
      device actually has, let a parent hear each one, and remember the choice. */
  function voiceRow(){
    const wrap = el('div', { style: { marginTop: 'calc(var(--u)*.7)' } });
    const list = Sound.voices;
    if (!list.length){
      wrap.append(el('p', { style: { color: 'var(--oops-ink)' },
        text: '※ この端末で日本語の読み上げ音声が見つかりませんでした。iPad の 設定 → アクセシビリティ → 読み上げコンテンツ → 声 → 日本語 で音声を追加すると、問題文が音声で読まれます。文字だけでも遊べます。' }));
      // Safari fills the voice list asynchronously, so an empty list here often
      // just means "not yet" — swap the warning for the picker when it arrives.
      if (window.speechSynthesis){
        speechSynthesis.addEventListener('voiceschanged', function again(){
          if (!Sound.voices.length) return;
          speechSynthesis.removeEventListener('voiceschanged', again);
          wrap.replaceWith(voiceRow());
        });
      }
      return wrap;
    }
    const sel = el('select.btn', { style: { maxWidth: '100%' } });
    list.forEach(v => {
      const o = el('option', { value: v.voiceURI, text: v.name });
      if (v.voiceURI === Sound.voiceId) o.selected = true;
      sel.append(o);
    });
    const apply = () => {
      Sound.voiceId = sel.value;
      Store.setPref('voiceId', sel.value);
      Sound.say('こんにちは。今日も一緒に、数を数えよう！', { delay: 60 });
    };
    sel.addEventListener('change', apply);
    const test = el('button.btn', { text: '試しに聴く', onclick: apply });
    wrap.append(el('div', { style: { display: 'flex', gap: 'calc(var(--u)*.7)', flexWrap: 'wrap', alignItems: 'center' } },
      el('span', { text: '読み上げの声：' }), sel, test));
    wrap.append(el('p', { style: { marginTop: 'calc(var(--u)*.4)' },
      text: '※ 機械的な声に聞こえるときは、iPad の 設定 → アクセシビリティ → 読み上げコンテンツ → 声 → 日本語 で「高品質」または「プレミアム」の音声をダウンロードしてください（無料・オフラインで使えます）。同じ名前のまま、声だけが自然になります。' }));
    return wrap;
  }

  function settingsSection(){
    const s = el('section');
    s.append(el('div.eyebrow', { text: 'settings' }), el('h3', { text: '設定' }));
    const toggle = (label, get, set) => {
      const b = el('button.btn', { text: label + '：' + (get() ? 'オン' : 'オフ') });
      b.addEventListener('click', () => {
        set(!get());
        b.textContent = label + '：' + (get() ? 'オン' : 'オフ');
        if (get()) Sound.sfx.tap();
      });
      return b;
    };
    const row = el('div', { style: { display: 'flex', gap: 'calc(var(--u)*.7)', flexWrap: 'wrap' } },
      toggle('効果音', () => Sound.sfxOn, v => { Sound.sfxOn = v; Store.setPref('sfx', v); }),
      toggle('読み上げ', () => Sound.voiceOn, v => { Sound.voiceOn = v; Store.setPref('voice', v); }));
    s.append(row);
    s.append(voiceRow());
    const reset = el('button.btn', { text: justReset ? '消しました' : '記録をすべて消す',
      style: { borderColor: 'var(--oops)', color: 'var(--oops-ink)' } });
    justReset = false;
    let armed = false;
    reset.addEventListener('click', () => {
      if (!armed){
        armed = true;
        reset.textContent = '本当に消しますか？（もう一度タップ）';
        setTimeout(() => { armed = false; reset.textContent = '記録をすべて消す'; }, 4000);
        return;
      }
      Store.reset();
      justReset = true;      // render() replaces this button, so the message goes on the new one
      Home.render();
      render();
    });
    if (!Store.persists){
      s.append(el('p', { style: { color: 'var(--oops-ink)', fontWeight: 800 },
        text: 'この開き方では記録が保存できません（ファイルを直接開いた場合やプライベートブラウズでは、iPad 側がデータの保存を許可しません）。Safari で開いてから 共有 → ホーム画面に追加 し、そのアイコンから起動してください。' }));
    }
    s.append(el('p', { style: { marginTop: 'calc(var(--u)*.9)' },
      text: '記録はこの端末の中だけに保存されます。サーバーには何も送信されません。' }), reset);
    return s;
  }

  function backupSection(){
    const s = el('section');
    s.append(el('div.eyebrow', { text: 'backup' }), el('h3', { text: '記録の保存とバックアップ' }));

    s.append(el('p', { html:
      '学習の記録は、<b>いま開いている URL ごとに、この端末のブラウザの中だけ</b>に保存されます。' +
      'ちがう URL で開くと、同じアプリでも記録は共有されません。' +
      '端末を変えるとき、Safari の履歴やサイトデータを消すとき、別の URL に引っ越すときは、' +
      '下のボタンで書き出したファイルを保管しておいてください。' }));

    const rows = el('div', { style: { display: 'grid', gap: 'calc(var(--u)*.3)', margin: 'calc(var(--u)*.8) 0' } });
    const row = (k, v, warn) => el('div', { style: { display: 'flex', justifyContent: 'space-between', gap: 'calc(var(--u)*1)' } },
      el('span', { text: k }),
      el('b', { text: v, style: { color: warn ? 'var(--oops-ink)' : 'var(--ink)', textAlign: 'right' } }));
    rows.append(row('いまの保存先', Store.origin, Store.origin === 'file://'));
    rows.append(row('保存の可否', Store.persists ? '保存できます' : '保存できません', !Store.persists));
    rows.append(row('ブラウザが記録を保持する設定', persistState, false));
    s.append(rows);
    if (persistState !== '許可されています'){
      s.append(el('p', { text:
        'この設定はブラウザが判断するもので、許可されていなくてもすぐ消えるわけではありません。' +
        'iPad では Safari で開いて 共有 → ホーム画面に追加 し、そのアイコンから起動していれば、' +
        'しばらく使わなくても記録は保持されます。逆に Safari のタブのまま数日使わないと、' +
        'iPadOS が自動的に消すことがあります。' }));
    }

    const status = el('p', { style: { fontWeight: 800, color: lastBackupMsg && lastBackupMsg.ok ? 'var(--good-ink)' : 'var(--oops-ink)' },
      text: lastBackupMsg ? lastBackupMsg.msg : '' });
    lastBackupMsg = null;
    const stamp = () => {
      const d = new Date();
      return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    };

    const dl = el('button.btn', { text: '記録を書き出す（ファイル）', onclick(){
      try{
        const blob = new Blob([Store.exportText()], { type: 'application/json' });
        const a = el('a', { href: URL.createObjectURL(blob), download: 'kazu-no-bouken-' + stamp() + '.json' });
        document.body.append(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        status.textContent = '書き出しました。ファイルアプリや iCloud Drive に保管してください。';
      }catch(e){ status.textContent = 'この環境ではファイルに書き出せません。下の「コピー」を使ってください。'; }
    } });

    const copy = el('button.btn', { text: 'コピー（貼り付けで復元）', onclick(){
      const text = Store.exportText();
      const done = () => { status.textContent = 'コピーしました。メモアプリなどに貼り付けて保管してください。'; };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done, () => { box.value = text; box.select(); status.textContent = '下の枠に出しました。長押しして「コピー」してください。'; });
      } else { box.value = text; box.select(); status.textContent = '下の枠に出しました。長押しして「コピー」してください。'; }
    } });

    const file = el('input', { type: 'file', accept: 'application/json,.json', style: { display: 'none' },
      onchange(e){
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => apply(String(r.result));
        r.readAsText(f);
        e.target.value = '';
      } });
    const pick = el('button.btn', { text: '記録を読み込む（ファイル）', onclick(){ file.click(); } });

    const box = el('textarea.backupbox', { rows: 4, spellcheck: 'false',
      placeholder: 'ここに、書き出した記録を貼り付けて「貼り付けから読み込む」を押してください' });
    const paste = el('button.btn', { text: '貼り付けから読み込む', onclick(){
      if (!box.value.trim()){ status.textContent = '枠が空です。'; return; }
      apply(box.value);
    } });

    let mode = 'merge';
    const modeBtn = el('button.btn', { text: '読み込み方：合体する', onclick(){
      mode = mode === 'merge' ? 'replace' : 'merge';
      modeBtn.textContent = '読み込み方：' + (mode === 'merge' ? '合体する' : 'おきかえる');
    } });

    function apply(text){
      const r = Store.importText(text, mode);
      if (r.ok){ lastBackupMsg = r; Home.render(); render(); return; }
      status.textContent = r.msg;
      status.style.color = 'var(--oops-ink)';
    }

    s.append(el('div', { style: { display: 'flex', gap: 'calc(var(--u)*.7)', flexWrap: 'wrap' } }, dl, copy),
             el('div', { style: { display: 'flex', gap: 'calc(var(--u)*.7)', flexWrap: 'wrap', marginTop: 'calc(var(--u)*.6)' } }, pick, paste, modeBtn),
             file, box, status,
             el('p', { text: '「合体する」は、いまの記録と読み込んだ記録の良いほうを残します（同じファイルを二度読み込んでも数字は増えません）。「おきかえる」は、いまの記録を捨てて読み込んだ内容にします。' }));
    return s;
  }

  function render(){
    buildSheet();
    clear(sheetInner);
    sheetInner.append(
      el('section', null,
        el('div.eyebrow', { text: 'about' }),
        el('h3', { text: 'このアプリがねらっていること' }),
        // counted, not typed: the sentence used to say 15 and quietly went stale
        el('p', { text: '小学校1年生の算数は「数える」「数を分ける・合わせる」「比べる」「形をとらえる」の4つの土台の上に立っています。逆に言えば、入学前にやるべきことは計算の先取りではなく、この土台を手と目と声で確かめておくことです。このアプリは入学前の'
          + Games.list.filter(g => Progress.stageOf(g) === 'pre').length
          + 'の遊びを4つの世界に分け、1レベル8問・1日10分で回せる分量にしています。'
          + 'それを全部終えると、小学1年生の1学期にあたる「1ねんせいの きょうしつ」が開きます。' }),
        el('p', { text: '答えを間違えても減点や時間制限はありません。2回間違えると自動でヒントが出て、必ず自分で正解にたどり着いて終われるようにしてあります。' })),
      nextUpSection(),
      statsSection(),
      stageSection(),
      progressSection(),
      aimsSection(),
      planSection(),
      textSection('why', '入学前に育てておきたい力', WHY),
      textSection('at home', 'おうちでできること', HOME_TIPS),
      backupSection(),
      settingsSection(),
      el('div', { style: { height: 'calc(var(--u)*2)' } }));
  }

  // Safari drops script-writable storage for sites that are not used for a while;
  // asking for persistence (and adding the app to the Home Screen) prevents that
  if (navigator.storage && navigator.storage.persisted){
    navigator.storage.persisted()
      .then(p => p ? true : (navigator.storage.persist ? navigator.storage.persist() : false))
      .then(p => { persistState = p ? '許可されています' : '許可されていません'; })
      .catch(() => { persistState = 'この端末では確認できません'; });
  } else {
    persistState = 'この端末では確認できません';
  }

  return { open, render };
})();

/* ---- 99-main.js ---- */
/* ===========================================================
   99 — bootstrap
   =========================================================== */
'use strict';

(function main(){
  /* viewport: the Artifact host injects its own meta; make it iPad-app-like */
  (function fixViewport(){
    let m = document.querySelector('meta[name="viewport"]');
    if (!m){ m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
    m.setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover');
  })();

  /* scale unit from the real stage size so the layout is identical on any iPad */
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    // the base unit sizes the chrome (topbar, prompt, answer buttons); the question
    // itself is grown to fill its own box afterwards by UI.fitPlayfield
    const u = clamp(Math.min(w * 0.0145, h * 0.0165), 7, 21).toFixed(2) + 'px';
    if (document.documentElement.style.getPropertyValue('--u') !== u){
      document.documentElement.style.setProperty('--u', u);
    }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  UI.init();
  Sound.sfxOn   = Store.data.sfx   !== false;
  Sound.voiceOn = Store.data.voice !== false;
  if (Store.data.voiceId) Sound.voiceId = Store.data.voiceId;

  Title.build();
  Home.build();
  Levels.build();
  Session.build();
  Result.build();
  Book.build();

  UI.show('title', { replace: true });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) Sound.hush(); else resize();
  });

  /* Offline. The app is one self-contained file, so caching it is a few lines —
     and without them the route the README recommends (ホーム画面に追加 from GitHub
     Pages) cannot open with no network, which is exactly when an iPad gets handed
     to a child in a car. Only the hosted build ships a manifest, so use that as
     the signal: the AirDropped file:// copy and the Artifact build skip this. */
  if ('serviceWorker' in navigator
      && /^https?:$/.test(location.protocol)
      && document.querySelector('link[rel="manifest"]')){
    // not deferred to 'load': that waits on the Google Fonts stylesheet, which is
    // exactly the request that stalls on the flaky connection we want to survive
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();

/* Expose the internals for debugging / automated checks. */
window.KazuApp = {
  Games, WORLDS, Store, Sound, UI, Session, Home, Levels, Result, Book, Parent,
  Diagnostic, Missions, Progress, stageOpen, levelOpen,
  el, svg, clear, $, $$,
  STICKER_POOL, stickerFor,
  numKana, koKana, tsuKana, banmeKana, jiKana, distractors
};

})();
</script>
