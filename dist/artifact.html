<title>かずのぼうけん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;800&family=Baloo+2:wght@700;800&display=swap">
<style>
/* ===========================================================
   かずのぼうけん — stylesheet
   Visual world: 画用紙とクレヨン (drawing paper & crayons)
   =========================================================== */

/* ---------- tokens ---------- */
:root{
  /* ground & ink */
  --paper:      #FBF4E9;   /* warm drawing paper */
  --paper-2:    #F3E9D8;   /* recessed paper */
  --card:       #FFFDF8;   /* card face */
  --card-edge:  #E4D5BC;   /* pencil edge */
  --ink:        #2E2A3F;   /* blue-violet ink, never pure black */
  --ink-soft:   #6C6480;
  --ink-faint:  #A79CB4;

  /* crayons — semantic content colors */
  /* deepened from #F2604C: this red is the numeral the question is about
     (「5 は 3 と いくつ？」) and it sat at 2.93:1 on the paper — under the 3:1 floor
     for large text, let alone the 4.5:1 for the rest. 4.45:1 now, and still a crayon. */
  --c-red:      #CE3D26;
  --c-orange:   #FF9F1C;
  --c-yellow:   #F5C042;
  --c-green:    #46B87A;
  --c-blue:     #3F8FE0;
  --c-purple:   #8E6FD1;
  --c-pink:     #F384AE;
  --c-brown:    #A9784F;

  /* roles */
  --accent:     #FF9F1C;   /* dandelion — primary action */
  --accent-ink: #6E3D00;
  --good:       #46B87A;
  --good-soft:  #DFF3E7;
  /* What goes ON a saturated crayon fill. White was the default and fails on every
     one of them: 2.05:1 on the orange「?」in the number-bond diagram, 2.50:1 on the
     green a child sees the instant they answer correctly, 1.4–2.8:1 across the
     board in dark mode. One dark ink clears 3:1 on every crayon in both themes,
     and 4.5:1 on all but the two that only ever carry big bold numerals. */
  --on-crayon:  #1C1828;
  --good-ink:   #27804F;   /* green as text, e.g. on --good-soft */
  --oops:       #E9829A;   /* soft rose, never alarm red — borders and fills */
  --oops-ink:   #B03E5A;   /* the same warning as text: #E9829A was 2.37:1 */
  --oops-soft:  #FBE6EB;
  --star:       #FFC533;
  --star-edge:  #D08A00;
  /* the stroke a child is asked to trace is the content — it must be clearly visible */
  --trace-guide:#CBE0F7;

  /* effects */
  --shadow:     0 .25em 0 rgba(46,42,63,.16), 0 .8em 1.6em rgba(46,42,63,.10);
  --shadow-sm:  0 .18em 0 rgba(46,42,63,.14);
  --ring:       #3F8FE0;

  /* geometry — slightly irregular, hand-drawn corners */
  --wob-a: 1.4em 1.1em 1.3em 1.2em;
  --wob-b: 1.1em 1.35em 1.15em 1.3em;

  /* scale unit — refined at runtime by JS */
  --u: clamp(7px, min(1.45vw, 1.65vh), 21px);
  /* Anything a five-year-old has to hit never goes below this, whatever --u says.
     Apple's 44pt minimum is written for adult index fingers. */
  --tap: 64px;

  --fs-jp: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4",
           "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --fs-num: "Baloo 2", "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;

  color-scheme: light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:     #171426;
    --paper-2:   #100E1C;
    --card:      #221E36;
    --card-edge: #3B3455;
    --ink:       #F6EFE4;
    --ink-soft:  #B6ADC6;
    --ink-faint: #776D8E;

    --c-red:     #FF7A66;
    --c-orange:  #FFB24A;
    --c-yellow:  #FFD264;
    --c-green:   #5DD08E;
    --c-blue:    #62A8F0;
    --c-purple:  #A98BE8;
    --c-pink:    #FF9CC1;
    --c-brown:   #C9946A;

    --accent:    #FFB24A;
    --accent-ink:#2A1600;
    --good:      #5DD08E;
    --good-soft: #1E3B2C;
    --good-ink:  #5DD08E;
    --oops:      #F5A0B4;
    --oops-ink:  #F5A0B4;
    --oops-soft: #3A2430;
    --star:      #FFD24D;
    --star-edge: #A87400;
    --trace-guide:#39457A;

    --shadow:    0 .25em 0 rgba(0,0,0,.45), 0 .8em 1.6em rgba(0,0,0,.35);
    --shadow-sm: 0 .18em 0 rgba(0,0,0,.4);
    --ring:      #7CB8F5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:     #171426;
  --paper-2:   #100E1C;
  --card:      #221E36;
  --card-edge: #3B3455;
  --ink:       #F6EFE4;
  --ink-soft:  #B6ADC6;
  --ink-faint: #776D8E;
  --c-red:     #FF7A66;
  --c-orange:  #FFB24A;
  --c-yellow:  #FFD264;
  --c-green:   #5DD08E;
  --c-blue:    #62A8F0;
  --c-purple:  #A98BE8;
  --c-pink:    #FF9CC1;
  --c-brown:   #C9946A;
  --accent:    #FFB24A;
  --accent-ink:#2A1600;
  --good:      #5DD08E;
  --good-soft: #1E3B2C;
  --good-ink:  #5DD08E;
  --oops:      #F5A0B4;
  --oops-ink:  #F5A0B4;
  --oops-soft: #3A2430;
  --star:      #FFD24D;
  --star-edge: #A87400;
  --trace-guide:#39457A;
  --shadow:    0 .25em 0 rgba(0,0,0,.45), 0 .8em 1.6em rgba(0,0,0,.35);
  --shadow-sm: 0 .18em 0 rgba(0,0,0,.4);
  --ring:      #7CB8F5;
  color-scheme: dark;
}

/* ---------- reset / stage ---------- */
*, *::before, *::after{ box-sizing: border-box; }

html, body{
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

body{
  background: var(--paper);
  color: var(--ink);
  font-family: var(--fs-jp);
  font-size: calc(var(--u) * 1.6);
  line-height: 1.5;
  font-weight: 500;
  -webkit-user-select: none;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* faint paper tooth */
body::before{
  content:"";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: .5;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,159,28,.055), transparent 45%),
    radial-gradient(circle at 82% 72%, rgba(63,143,224,.055), transparent 45%);
}

#stage{
  touch-action: manipulation;
  position: fixed;
  inset: 0;
  padding: max(env(safe-area-inset-top), calc(var(--u)*.6))
           max(env(safe-area-inset-right), calc(var(--u)*1))
           max(env(safe-area-inset-bottom), calc(var(--u)*1.5))
           max(env(safe-area-inset-left), calc(var(--u)*1));
  display: grid;
  /* An auto track takes its minimum from the item's min-content width, so one
     nowrap row (なんばんめ with eight animals) could widen the whole stage past
     the iPad and take every ancestor's `max-width:100%` with it. */
  grid-template-columns: minmax(0, 1fr);
  z-index: 1;
}

.screen{
  grid-area: 1 / 1;
  min-height: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * .8);
}
.screen[hidden]{ display: none !important; }

.screen.enter{ animation: screenIn .34s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes screenIn{
  from{ opacity: 0; transform: translateY(calc(var(--u)*1.4)) scale(.985); }
  to  { opacity: 1; transform: none; }
}

/* ---------- generic buttons ---------- */
.btn{
  font: inherit;
  font-weight: 800;
  color: var(--ink);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: var(--wob-a);
  padding: calc(var(--u)*.7) calc(var(--u)*1.3);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .12s cubic-bezier(.2,.9,.3,1.4), box-shadow .12s, background .15s;
  touch-action: manipulation;
  display: inline-flex; align-items: center; justify-content: center;
  gap: calc(var(--u)*.5);
  min-height: calc(var(--u)*4.2);
}
.btn:active{ transform: translateY(.18em); box-shadow: none; }
.btn.wrong{ animation: shake .42s; border-color: var(--oops); background: var(--oops-soft); }
.btn.correct{ background: var(--good); border-color: var(--good); color: var(--on-crayon); }
.btn:focus-visible{ outline: calc(var(--u)*.28) solid var(--ring); outline-offset: calc(var(--u)*.2); }

.btn-accent{
  background: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 72%, var(--ink) 28%);
  color: var(--accent-ink);
}
.btn-ghost{ background: transparent; border-color: transparent; box-shadow: none; }
.btn-ghost:active{ transform: scale(.94); }

.btn-round{
  width: calc(var(--u)*4.4); height: calc(var(--u)*4.4);
  min-height: 0; padding: 0; border-radius: 50%;
  font-size: calc(var(--u)*2);
}

/* ---------- top bar ---------- */
.topbar{
  display: flex; align-items: center; gap: calc(var(--u)*.8);
  flex: 0 0 auto;
}
.topbar h2{
  margin: 0;
  font-size: calc(var(--u)*2);
  font-weight: 800;
  letter-spacing: .02em;
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* progress pips */
.pips{ display: flex; gap: calc(var(--u)*.35); flex: 0 0 auto; }
.pip{
  width: calc(var(--u)*1.05); height: calc(var(--u)*1.05);
  border-radius: 50%;
  background: var(--card-edge);
  transition: background .3s, transform .3s;
}
.pip.done{ background: var(--good); }
.pip.miss{ background: var(--oops); }
.pip.now { background: var(--accent); transform: scale(1.35); }

/* ---------- play area ---------- */
.prompt{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: calc(var(--u)*.8);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: var(--wob-b);
  padding: calc(var(--u)*.6) calc(var(--u)*1);
  box-shadow: var(--shadow-sm);
}
.prompt .txt{
  flex: 1 1 auto;
  font-size: calc(var(--u)*2.1);
  font-weight: 800;
  line-height: 1.25;
  text-wrap: balance;
}
.prompt .txt b{ color: var(--c-red); font-family: var(--fs-num); font-size: 1.25em; }

.playfield{
  flex: 1 1 auto;
  min-height: 0;
  min-width: 0;
  width: 100%;
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u)*1);
  padding: calc(var(--u)*.4);
}

.choices{
  flex: 0 0 auto;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: calc(var(--u)*1.5);
  padding-top: calc(var(--u)*.2);
}

.choice{
  font-family: var(--fs-num);
  font-weight: 800;
  font-size: calc(var(--u)*3.6);
  line-height: 1;
  min-width: calc(var(--u)*8.4);
  min-height: calc(var(--u)*6.8);
  padding: calc(var(--u)*.6) calc(var(--u)*1);
  background: var(--card);
  color: var(--ink);
  border: calc(var(--u)*.26) solid var(--card-edge);
  border-radius: var(--wob-a);
  box-shadow: var(--shadow);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform .12s cubic-bezier(.2,.9,.3,1.4), box-shadow .12s, background .2s, border-color .2s;
}
.choice:active{ transform: translateY(.2em) scale(.98); box-shadow: var(--shadow-sm); }
.choice:focus-visible{ outline: calc(var(--u)*.28) solid var(--ring); outline-offset: calc(var(--u)*.24); }
.choice.pic{ font-family: var(--fs-jp); font-size: calc(var(--u)*2.6); }
.choice.correct{ background: var(--good); border-color: var(--good); color: var(--on-crayon); animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
.choice.wrong{ background: var(--oops-soft); border-color: var(--oops); animation: shake .42s; }
.choice.dim{ opacity: .32; pointer-events: none; filter: saturate(.4); }
.choice[disabled]{ pointer-events: none; }

@keyframes pop{ 0%{transform:scale(1)} 45%{transform:scale(1.16)} 100%{transform:scale(1)} }
@keyframes shake{
  0%,100%{ transform: translateX(0) }
  15%{ transform: translateX(-.35em) rotate(-2deg) }
  35%{ transform: translateX(.35em) rotate(2deg) }
  55%{ transform: translateX(-.22em) rotate(-1.2deg) }
  78%{ transform: translateX(.16em) }
}
@keyframes wiggle{
  0%,100%{ transform: rotate(0) }
  25%{ transform: rotate(-5deg) } 75%{ transform: rotate(5deg) }
}
@keyframes floatY{
  0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-.35em) }
}

/* ---------- counting objects ---------- */
.objfield{
  position: relative;
  width: 100%; height: 100%;
  min-height: calc(var(--u)*16);
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-a);
  box-shadow: inset 0 calc(var(--u)*.3) calc(var(--u)*1) rgba(46,42,63,.05);
  overflow: hidden;
}
.obj{
  position: absolute;
  padding: calc(var(--u)*.8);          /* hit area, not visual size */
  display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--u)*5);
  line-height: 1;
  cursor: pointer;
  transform: translate(-50%,-50%);
  transition: transform .18s cubic-bezier(.2,.9,.3,1.5), filter .18s, opacity .3s;
  will-change: transform;
}
.obj:active{ transform: translate(-50%,-50%) scale(1.14); }
.obj.counted{ filter: drop-shadow(0 0 calc(var(--u)*.5) var(--good)); }
.obj .tag{
  position: absolute;
  top: -.45em; right: -.45em;
  font-family: var(--fs-num); font-weight: 800;
  font-size: .42em; line-height: 1;
  color: var(--on-crayon); background: var(--good);
  border-radius: 50%;
  width: 1.5em; height: 1.5em;
  display: flex; align-items: center; justify-content: center;
  animation: pop .34s cubic-bezier(.2,.9,.3,1.6);
  box-shadow: 0 .1em .2em rgba(0,0,0,.2);
}
.obj.picked{ filter: drop-shadow(0 0 calc(var(--u)*.55) var(--accent)); }
.obj.picked::after{
  content:""; position:absolute; inset:-12%;
  border: calc(var(--u)*.26) dashed var(--accent);
  border-radius: 50%;
}

/* rows / groups of items */
.row{ display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: calc(var(--u)*.5); }
.item{ font-size: calc(var(--u)*3.6); line-height: 1; }

.plate{
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-b);
  padding: calc(var(--u)*1);
  box-shadow: var(--shadow);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .14s cubic-bezier(.2,.9,.3,1.4), border-color .2s, background .2s;
  min-width: calc(var(--u)*14);
  min-height: calc(var(--u)*13);
}
.plate:active{ transform: scale(.97); }
.plate.correct{ border-color: var(--good); background: var(--good-soft); animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
.plate.wrong{ border-color: var(--oops); background: var(--oops-soft); animation: shake .42s; }

/* ---------- mascot ---------- */
.mascot{ width: calc(var(--u)*7); height: calc(var(--u)*7); flex: 0 0 auto; }
.mascot.talk{ animation: floatY 1.8s ease-in-out infinite; }
.mascot.cheer{ animation: wiggle .5s ease-in-out 3; }

/* ---------- toast / feedback ---------- */
#fx{ position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
.confetti{
  position: absolute; width: calc(var(--u)*.9); height: calc(var(--u)*1.4);
  border-radius: .2em;
  will-change: transform, opacity;
}
.bigmark{
  position: fixed; left: 50%; top: 46%;
  transform: translate(-50%,-50%);
  font-size: calc(var(--u)*16);
  z-index: 95; pointer-events: none;
  animation: markIn .75s cubic-bezier(.2,.9,.3,1.4) both;
}
@keyframes markIn{
  0%{ opacity:0; transform: translate(-50%,-50%) scale(.4) rotate(-14deg) }
  40%{ opacity:1; transform: translate(-50%,-50%) scale(1.06) rotate(3deg) }
  75%{ opacity:1; transform: translate(-50%,-50%) scale(1) rotate(0) }
  100%{ opacity:0; transform: translate(-50%,-50%) scale(1.1) }
}

/* ===========================================================
   HOME — たんけんマップ
   =========================================================== */
#home{ gap: calc(var(--u)*.7); }

.home-head{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: calc(var(--u)*1);
}
.logo{
  display: flex; align-items: baseline; gap: calc(var(--u)*.5);
  font-size: calc(var(--u)*2.9); font-weight: 800; letter-spacing: .04em;
  margin: 0;
}
.logo .k{ color: var(--c-red); }
.logo .n{ color: var(--c-blue); }
.logo .b{ color: var(--c-green); }
.home-head .spacer{ flex: 1 1 auto; }

.starcount{
  display: inline-flex; align-items: center; gap: calc(var(--u)*.4);
  font-family: var(--fs-num); font-weight: 800;
  font-size: calc(var(--u)*2.2);
  color: var(--ink);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: 999px;
  padding: calc(var(--u)*.3) calc(var(--u)*1.1);
  box-shadow: var(--shadow-sm);
}
.starcount svg{ width: calc(var(--u)*2); height: calc(var(--u)*2); }

/* daily practice banner */
.daily{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: calc(var(--u)*1);
  background: linear-gradient(105deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--c-pink)));
  color: var(--accent-ink);
  border: calc(var(--u)*.26) solid color-mix(in srgb, var(--accent) 65%, var(--ink) 35%);
  border-radius: var(--wob-a);
  padding: calc(var(--u)*.7) calc(var(--u)*1.2);
  box-shadow: var(--shadow);
  cursor: pointer;
  text-align: left;
  transition: transform .14s cubic-bezier(.2,.9,.3,1.4), box-shadow .14s;
}
.daily:active{ transform: translateY(.2em); box-shadow: var(--shadow-sm); }
.daily .t{ font-size: calc(var(--u)*2.1); font-weight: 800; line-height: 1.2; }
.daily .s{ font-size: calc(var(--u)*1.4); font-weight: 500; opacity: .82; }
.daily .grow{ flex: 1 1 auto; min-width: 0; }
.daily .mascot{ width: calc(var(--u)*5.6); height: calc(var(--u)*5.6); }
.daily.done{
  background: var(--good-soft);
  color: var(--ink);
  border-color: var(--good);
}

/* worlds */
.worlds{
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(calc(var(--u)*38), 1fr));
  grid-auto-rows: auto;
  align-content: safe center;   /* centred when there is room, never clipped when there isn't */
  gap: calc(var(--u)*.9);
  padding-bottom: calc(var(--u)*.2);
}
.world{
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-a);
  padding: calc(var(--u)*.9);
  box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column;
}
/* the world's name sits on a crayon chip — a tab on a notebook divider */
.world h3{
  margin: calc(var(--u)*-1.7) 0 calc(var(--u)*.7) calc(var(--u)*-.3);
  font-size: calc(var(--u)*1.7); font-weight: 800;
  display: flex; align-items: center; gap: calc(var(--u)*.5);
  color: var(--ink);
}
.world h3 .chip{
  background: var(--wc);
  color: var(--on-crayon);
  border-radius: 999px calc(var(--u)*1.2) 999px calc(var(--u)*1.1);
  padding: calc(var(--u)*.25) calc(var(--u)*1.1);
  box-shadow: var(--shadow-sm);
}
/* recently earned stickers, along the foot of the map */
.shelf{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: calc(var(--u)*.7);
  padding: calc(var(--u)*.55) calc(var(--u)*1);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: var(--wob-b);
  box-shadow: var(--shadow-sm);
  cursor: pointer; font: inherit; color: var(--ink); text-align: left;
  transition: transform .14s cubic-bezier(.2,.9,.3,1.4);
}
.shelf:active{ transform: translateY(.15em); }
.shelf .lbl{ font-size: calc(var(--u)*1.35); font-weight: 800; white-space: nowrap; padding-left: calc(var(--u)*.3); }
.shelf .bk{ font-size: calc(var(--u)*2); flex: 0 0 auto; }
.shelf .lbl small{ display: block; font-size: calc(var(--u)*1.1); font-weight: 500; color: var(--ink-soft); }
.shelf .strip{
  flex: 1 1 auto; min-width: 0;
  display: flex; gap: calc(var(--u)*.3); overflow: hidden;

  const n = document.createElement(tag);
  if (id) n.id = id;
  if (cls.length) n.className = cls.join(' ');
  if (props) for (const k in props){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'style' && typeof v === 'object'){
      for (const prop in v){
        // custom properties (--x) must go through setProperty; Object.assign silently drops them
        if (prop.charCodeAt(0) === 45 && prop.charCodeAt(1) === 45) n.style.setProperty(prop, v[prop]);
        else n.style[prop] = v[prop];
      }
    }
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'dataset') Object.assign(n.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'class') n.className += (n.className ? ' ' : '') + v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(4)){
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
}

function svg(tag, attrs, ...kids){
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(4)) if (kid != null && kid !== false) n.append(kid);
  return n;
}

const clear = n => { while (n.firstChild) n.removeChild(n.firstChild); return n; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---- random ---- */
const ri     = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick   = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const sample = (arr, n) => shuffle(arr).slice(0, n);
const range  = (a, b) => { const o = []; for (let i = a; i <= b; i++) o.push(i); return o; };

/** distinct distractor numbers around `answer` inside [lo,hi] */
function distractors(answer, n, lo, hi, spread){
  const s = spread || 3, out = new Set();
  const near = shuffle(range(Math.max(lo, answer - s), Math.min(hi, answer + s)).filter(v => v !== answer));
  for (const v of near){ if (out.size >= n) break; out.add(v); }
  let guard = 0;
  while (out.size < n && guard++ < 200){ const v = ri(lo, hi); if (v !== answer) out.add(v); }
  return Array.from(out).slice(0, n);
}

/* ---- japanese number readings (for speech) ---- */
const KANA_ONES = ['ゼロ','いち','に','さん','よん','ご','ろく','なな','はち','きゅう'];
function numKana(n){
  n = Math.round(n);
  if (n < 0) return String(n);
  if (n < 10) return KANA_ONES[n];
  if (n === 10) return 'じゅう';
  if (n < 20) return 'じゅう' + KANA_ONES[n - 10];
  if (n < 100){
    const t = Math.floor(n / 10), o = n % 10;
    return KANA_ONES[t] + 'じゅう' + (o ? KANA_ONES[o] : '');
  }
  return String(n);
}
const KO = ['ゼロこ','いっこ','にこ','さんこ','よんこ','ごこ','ろっこ','ななこ','はっこ','きゅうこ','じゅっこ'];
const koKana    = n => (n >= 0 && n <= 10) ? KO[n] : numKana(n) + 'こ';
const TSU = ['ゼロ','ひとつ','ふたつ','みっつ','よっつ','いつつ','むっつ','ななつ','やっつ','ここのつ','とお'];
const tsuKana   = n => (n >= 1 && n <= 10) ? TSU[n] : numKana(n) + 'こ';
const banmeKana = n => numKana(n) + 'ばんめ';
/* Clock hours have their own readings and they are NOT the counting readings. */
const JI = ['','いちじ','にじ','さんじ','よじ','ごじ','ろくじ','しちじ','はちじ','くじ','じゅうじ','じゅういちじ','じゅうにじ'];
const jiKana = (h, half) => (JI[h] || numKana(h) + 'じ') + (half ? 'はん' : '');

/** hiragana display text; digits get the numeral face via <b> */
const numTag = n => `<b>${n}</b>`;

/** Make a node behave like a button for both finger and keyboard. */
function tappable(node, fn){
  node.setAttribute('role', 'button');
  node.dataset.tap = '1';
  if (!node.hasAttribute('tabindex')) node.setAttribute('tabindex', '0');
  node.addEventListener('click', fn);
  node.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(e); }
  });
  return node;
}

/** Rejection sampling with a hard stop: a tightened range must never hang the iPad. */
function until(tryOnce, limit){
  for (let i = 0; i < (limit || 400); i++){ const v = tryOnce(); if (v !== undefined) return v; }
  return undefined;
}

/* ---- geometry ---- */
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

/** Poisson-ish scatter: n points in [0..1]^2 with a minimum separation. */
function scatter(n, minD, tries){
  const pts = [], T = tries || 40;
  const md = minD != null ? minD : Math.min(.34, 0.86 / Math.sqrt(n + 1));
  for (let i = 0; i < n; i++){
    let best = null, bestScore = -1;
    for (let t = 0; t < T; t++){
      const p = [0.10 + Math.random() * 0.80, 0.12 + Math.random() * 0.76];
      let d = 9;
      for (const q of pts) d = Math.min(d, dist(p[0], p[1], q[0], q[1]));
      if (d > bestScore){ bestScore = d; best = p; }
      if (d > md) break;
    }
    pts.push(best);
  }
  return pts;
}

/** points evenly on a horizontal line (for level-1 counting) */
function lineup(n, y){
  const pts = [], yy = y == null ? .5 : y;
  for (let i = 0; i < n; i++) pts.push([0.12 + (0.76 * (n === 1 ? .5 : i / (n - 1))), yy]);
  return pts;
}

/* ---- 01-audio.js ---- */
/* ===========================================================
   01 — sound & speech
   All effects are synthesised: nothing to download, works offline.
   =========================================================== */
'use strict';

const Sound = (() => {
  let ctx = null, master = null;
  let sfxOn = true, voiceOn = true;
  let jaVoice = null, jaVoices = [], voicesReady = false;
  let prefVoice = null;

  function ensure(){
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try{
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.28;
      master.connect(ctx.destination);
    }catch(e){ ctx = null; }
    return ctx;
  }

  /** Must run inside a user gesture (iOS). */
  function unlock(){
    const c = ensure();
    if (c && c.state === 'suspended') c.resume().catch(() => {});
    // prime the speech engine with an empty-ish utterance
    if (window.speechSynthesis){
      try{
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0; u.lang = 'ja-JP';
        speechSynthesis.speak(u);
      }catch(e){}
      loadVoices();
    }
  }

  function tone(freq, t0, dur, type, gain, glideTo){
    const c = ensure(); if (!c || !sfxOn) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain == null ? .5 : gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + .02);
  }

  function seq(notes, type, step, gain){
    const c = ensure(); if (!c || !sfxOn) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    const t0 = c.currentTime + .01, st = step || .09;
    notes.forEach((f, i) => tone(f, t0 + i * st, st * 1.9, type || 'triangle', gain));
  }

  function noiseBurst(dur, gain){
    const c = ensure(); if (!c || !sfxOn) return;
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = .8;
    const g = c.createGain(); g.gain.value = gain == null ? .25 : gain;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  const PENT = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5, 1568, 1760, 2093];

  const S = {
    tap()      { seq([720], 'sine', .05, .35); },
    place()    { seq([420, 620], 'sine', .05, .4); },
    count(i)   { seq([PENT[Math.min(i, PENT.length - 1)]], 'triangle', .07, .42); },
    correct()  { seq([659.25, 830.61, 987.77, 1318.5], 'triangle', .075, .45); },
    wrong()    { seq([311.13, 261.63], 'sine', .13, .32); },
    star(i)    { seq([1046.5 + i * 180, 1568 + i * 200, 2093 + i * 240], 'triangle', .07, .3); noiseBurst(.25, .12); },
    finish()   { seq([523.25, 659.25, 783.99, 1046.5, 1318.5, 1046.5, 1318.5], 'triangle', .1, .42); },
    unlockSfx(){ seq([523.25, 783.99], 'triangle', .1, .35); },
    swoosh()   { noiseBurst(.18, .1); }
  };

  /* ---------- speech ----------
     How natural this sounds is decided by which voice the device has installed,
     not by anything we do here: the bundled "compact" Kyoko is the flat, robotic
     one, while the enhanced / premium download (設定 → アクセシビリティ →
     読み上げコンテンツ → 声) and the Siri voices sound like a person reading.
     So rank the candidates instead of taking the first ja voice, and let the
     parent page override the pick for the device actually in their hands. */
  const VOICE_RANK = [
    [/siri/i,                                     60],
    [/premium|プレミアム/i,                        50],
    [/enhanced|拡張|高品質/i,                       40],
    // Apple's current voice family (Ventura / iOS 16 onward) shares the engine
    // behind Siri, so it phrases a sentence instead of reciting it — it beats the
    // old compact Kyoko even though Kyoko is the name everyone recognises.
    [/^(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\b/i, 30],
    [/^(sandy|flo)\b/i,                            4],  // warmest of that family for a 5-year-old
    [/neural|natural|wavenet|google|microsoft/i,   25],
    [/kyoko|o-?ren|nanami|ayumi|haruka|mizuki/i,   10],
    [/otoya|hattori|ichiro|keita/i,                 5]
  ];
  function voiceScore(v){
    const n = (v.name || '') + ' ' + (v.voiceURI || '');
    let s = v.localService ? 8 : 0;   // offline-first, but never over a much better voice
    for (const [re, w] of VOICE_RANK) if (re.test(n)) s += w;
    return s;
  }

  function loadVoices(){
    if (!window.speechSynthesis) return;
    const vs = speechSynthesis.getVoices();
    if (!vs || !vs.length) return;
    voicesReady = true;
    jaVoices = vs.filter(v => /^ja(-|_|$)/i.test(v.lang || ''))
                 .sort((a, b) => voiceScore(b) - voiceScore(a));
    jaVoice = (prefVoice && jaVoices.find(v => v.voiceURI === prefVoice || v.name === prefVoice))
           || jaVoices[0] || null;
  }
  if (window.speechSynthesis){
    loadVoices();
    speechSynthesis.addEventListener('voiceschanged', loadVoices);
  }

  /* Japanese TTS decides its phrasing and pitch accent by parsing the sentence,
     and a space inside a sentence breaks that parse — the reason the same line
     can come out either flat or lively. The prompts are written with kanji and
     punctuation for the engine's benefit; this strips any stray spacing left
     between Japanese characters. */
  const JA = /[\u3000-\u30FF\u3400-\u9FFF\uFF00-\uFF9F]/;
  function forSpeech(text){
    return String(text)
      .replace(/[ \u3000]+/g, ' ')
      .replace(/(.) (?=(.))/g, (m, a, b) => JA.test(a) && JA.test(b) ? a : m)
      .trim();
  }

  let speakTimer = null;
  function say(text, opts){
    if (!voiceOn || !text || !window.speechSynthesis) return;
    const o = opts || {};
    clearTimeout(speakTimer);
    const go = () => {
      try{
        if (!voicesReady) loadVoices();
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(forSpeech(text));
        u.lang  = 'ja-JP';
        if (jaVoice) u.voice = jaVoice;
        // 1.0 is the voice's own recorded prosody; pushing rate or pitch away
        // from it is what made this sound synthetic. Only nudge, never shove.
        u.rate   = o.rate   == null ? 0.95 : o.rate;
        u.pitch  = o.pitch  == null ? 1 : o.pitch;
        u.volume = o.volume == null ? 1 : o.volume;
        speechSynthesis.speak(u);
      }catch(e){}
    };
    // a beat of delay lets the sfx land first and avoids iOS cancel/speak races
    speakTimer = setTimeout(go, o.delay == null ? 90 : o.delay);
  }
  function hush(){
    clearTimeout(speakTimer);
    try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){}
  }

  return {
    sfx: S, unlock, say, hush,
    get sfxOn(){ return sfxOn; },  set sfxOn(v){ sfxOn = !!v; },
    get voiceOn(){ return voiceOn; }, set voiceOn(v){ voiceOn = !!v; if (!v) hush(); },
    get hasVoice(){ return !!jaVoice; },
    /** The parent page lists these so a device with a better voice installed can use it. */
    get voices(){ if (!voicesReady) loadVoices(); return jaVoices.slice(); },
    get voiceId(){ return jaVoice ? jaVoice.voiceURI : null; },
    set voiceId(id){ prefVoice = id || null; loadVoices(); }
  };
})();

/* ---- 02-store.js ---- */
/* ===========================================================
   02 — progress storage (per-device, localStorage; degrades to memory)
   =========================================================== */
'use strict';

/* What「考えずに言える」means in milliseconds for the number facts in けいさんの やま.
   Under FAST the answer arrived; over SLOW it was worked out — almost always by
   counting. Between the two it is on its way. These are deliberately generous:
   the point is to tell retrieval from counting, not to run a race. */
const FLUENT_FAST_MS = 3000, FLUENT_SLOW_MS = 9000;

const Store = (() => {
  const KEY = 'kazu-no-bouken.v1';
  const blank = () => ({
    stars: {},        // "gameId:levelIndex" -> 0..3
    plays: {},        // "gameId:levelIndex" -> attempts
    seen:  {},        // gameId -> total questions answered
    firstTry: {},     // gameId -> [correctFirstTry, total] (lifetime)
    /* Per-game aggregates can only ever say "this game is shaky". These two say
       *what* is shaky and *when* — which is what lets the app come back to the
       exact fact the child missed, and lets the parent page name it. */
    facts: {},        // item key -> [asked, firstTryRight, lastDayNumber, label, "gameId:levelIndex", typicalMs]
    recent: {},       // "gameId:levelIndex" -> last 30 first-try outcomes, "1011…"
    last:  {},        // "gameId:levelIndex" -> day number last played
    swift: {},        // "gameId:levelIndex" -> 1 when cleared without counting
    stickers: [],     // earned sticker keys
    daily: {},        // "YYYY-MM-DD" -> questions done
    practice: [0, 0],   // [firstTryRight, total] across きょうの れんしゅう
    name: '',
    sfx: true, voice: true, voiceId: null,
    createdAt: Date.now()
  });

  let mem = blank(), ok = true;

  try{
    const raw = localStorage.getItem(KEY);
    if (raw) mem = Object.assign(blank(), JSON.parse(raw));
  }catch(e){ ok = false; }

  let pending = null;
  function writeNow(){
    if (!ok) return;
    clearTimeout(pending); pending = null;
    try{ localStorage.setItem(KEY, JSON.stringify(mem)); }
    catch(e){ ok = false; }          // quota, private mode, or a file:// origin
  }
  function save(){
    if (!ok) return;
    clearTimeout(pending);
    pending = setTimeout(writeNow, 120);
  }
  // the app is usually closed straight after finishing a level; don't lose that write
  addEventListener('pagehide', writeNow);
  addEventListener('visibilitychange', () => { if (document.hidden) writeNow(); });

  const key = (g, l) => g + ':' + l;
  /* Whole-day resolution keeps six months of daily use small enough for
     localStorage, and days are the only unit the scheduling actually needs. */
  const DAY = 86400000;
  const dayNo = () => Math.floor(Date.now() / DAY);
  const todayKey = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  /* ---- backup ----------------------------------------------------------
     localStorage is scoped to one origin and one browser, so the same app on a
     different URL (or after clearing site data) starts empty. Export/import is
     the only thing that makes six months of records actually portable. */
  const FILE_TAG = 'kazu-no-bouken';

  function exportText(){
    return JSON.stringify({ app: FILE_TAG, v: 1, savedAt: new Date().toISOString(), data: mem }, null, 2);
  }

  const maxNum = (a, b) => Math.max(a || 0, b || 0);
  function mergeInto(base, add){
    const out = Object.assign(blank(), base);
    ['stars', 'plays', 'seen', 'daily', 'swift'].forEach(k => {
      const src = add[k] || {};
      out[k] = Object.assign({}, base[k] || {});
      // max, never sum: importing the same backup twice must not inflate anything
      for (const id in src) out[k][id] = maxNum(out[k][id], src[id]);
    });
    out.firstTry = Object.assign({}, base.firstTry || {});
    const af = add.firstTry || {};
    for (const g in af){
      const cur = out.firstTry[g];
      if (!cur || (af[g][1] || 0) > (cur[1] || 0)) out.firstTry[g] = af[g].slice();
    }
    // facts: keep the record that has been practised more; never sum
    out.facts = Object.assign({}, base.facts || {});
    const af2 = add.facts || {};
    for (const k in af2){
      const cur = out.facts[k];
      if (!cur || (af2[k][0] || 0) > (cur[0] || 0)) out.facts[k] = af2[k].slice();
      else if (cur){
        cur[2] = maxNum(cur[2], af2[k][2]);
        if (!cur[4] && af2[k][4]) cur[4] = af2[k][4];   // keep whichever side knows where to ask it
      }
    }
    // recent / last: follow whichever side actually played that level more
    out.recent = Object.assign({}, base.recent || {});
    out.last   = Object.assign({}, base.last || {});
    for (const k in (add.recent || {})){
      if ((add.plays && add.plays[k] || 0) > (base.plays && base.plays[k] || 0)) out.recent[k] = add.recent[k];
    }
    for (const k in (add.last || {})) out.last[k] = maxNum(out.last[k], add.last[k]);
    out.stickers = Array.from(new Set((base.stickers || []).concat(add.stickers || [])));
    const bp = base.practice || [0, 0], ap = add.practice || [0, 0];
    out.practice = (ap[1] || 0) > (bp[1] || 0) ? ap.slice() : bp.slice();
    out.createdAt = Math.min(base.createdAt || Date.now(), add.createdAt || Date.now());
    return out;
  }

  /** mode: 'merge' (default, never loses or inflates) or 'replace' */
  function importText(text, mode){
    let parsed;
    try{ parsed = JSON.parse(text); }
    catch(e){ return { ok: false, msg: 'ファイルの中身を読み取れませんでした。' }; }
    const data = (parsed && parsed.app === FILE_TAG && parsed.data) ? parsed.data
               : (parsed && parsed.stars) ? parsed        // a bare data object is fine too
               : null;
    if (!data || typeof data !== 'object') return { ok: false, msg: 'このファイルは かずのぼうけん の記録ではないようです。' };
    const before = Object.keys(mem.stars || {}).length;
    mem = mode === 'replace' ? Object.assign(blank(), data) : mergeInto(mem, data);
    writeNow();
    const after = Object.keys(mem.stars || {}).length;
    return { ok: true, msg: `読み込みました（★のついたレベル ${before} → ${after}、シール ${mem.stickers.length} 枚）`,
             savedAt: parsed.savedAt || null };
  }

  /** How much this fact is owed a turn: 0 (fresh and solid) … ~2 (missed, or long unseen).
      A fact that has never been asked scores 1, so nothing is starved at the start. */
  function dueOf(k){
    const f = mem.facts[k];
    if (!f || !f[0]) return 1;
    const acc = f[1] / f[0];
    const age = Math.min(30, dayNo() - f[2]);
    /* Right but slow is not the same as known. Right-first-time cannot tell a child
       who remembers「10は4と6」from one who counted the six empty cells for nine
       seconds, and only the first of those makes a carry sum fast. */
    const slow = f[5] ? clamp((f[5] - FLUENT_FAST_MS) / (FLUENT_SLOW_MS - FLUENT_FAST_MS), 0, 1) : 0;
    return (1 - acc) * 1.6 + (age / 30) * 0.6 + (f[0] < 3 ? 0.25 : 0) + slow * 0.5;
  }

  /** The facts this child keeps missing, worst first.
      Only facts they have actually met and actually got wrong: 集中練習 is practice,
      not first contact, and one slip is not a gap. */
  function weakFacts(limit){
    const out = [];
    for (const k in mem.facts){
      const f = mem.facts[k];
      if (!f || !f[0] || !f[4]) continue;        // never asked, or nowhere to ask it again
      const missed = f[0] - f[1];
      // right every time but still being counted out: the case a percentage cannot show
      const slow = f[5] >= FLUENT_SLOW_MS;
      if (missed < 1 && !slow) continue;
      if (!slow && f[1] / f[0] >= 0.8 && missed < 2) continue;   // one slip on a solid fact
      out.push({ key: k, label: f[3] || k, at: f[4], due: dueOf(k), missed, ms: f[5] || null, slow });
    }
    out.sort((a, b) => b.due - a.due || b.missed - a.missed);
    return limit ? out.slice(0, limit) : out;
  }

  return {
    get data(){ return mem; },
    /** false when this device/origin cannot persist — the parent page says so. */
    get persists(){ return ok; },
    get origin(){ return location.origin === 'null' ? 'file://' : location.origin; },
    exportText, importText,
    todayKey,
    flush: writeNow,
    stars: (g, l) => mem.stars[key(g, l)] || 0,
    gameStars(g, levels){
      let s = 0; for (let i = 0; i < levels; i++) s += mem.stars[key(g, i)] || 0; return s;
    },
    totalStars(){ let s = 0; for (const k in mem.stars) s += mem.stars[k]; return s; },
    plays: (g, l) => mem.plays[key(g, l)] || 0,
    /* A pass opens the next level. Three honest attempts also open it: a five-year-old
       must never end up staring at a padlock they cannot move, and the parent page
       shows the low score either way. */
    levelUnlocked(g, l){
      if (l === 0) return true;
      const k = key(g, l - 1);
      return (mem.stars[k] || 0) >= 1 || (mem.plays[k] || 0) >= 3;
    },

    /** One question's first-try result, attributed to the level it came from.
        Recorded per question rather than per level so that a question met inside
        きょうの れんしゅう counts towards that level's recent form too. */
    noteOutcome(g, l, ok){
      const k = key(g, l);
      mem.recent[k] = ((mem.recent[k] || '') + (ok ? '1' : '0')).slice(-30);
      mem.last[k] = dayNo();
      save();
    },

    recordLevel(g, l, stars, right, total){
      const k = key(g, l);
      mem.stars[k] = Math.max(mem.stars[k] || 0, stars);
      mem.plays[k] = (mem.plays[k] || 0) + 1;
      mem.last[k]  = dayNo();
      mem.seen[g]  = (mem.seen[g] || 0) + total;
      const ft = mem.firstTry[g] || [0, 0];
      mem.firstTry[g] = [ft[0] + right, ft[1] + total];
      const t = todayKey();
      mem.daily[t] = (mem.daily[t] || 0) + total;
      save();
    },
    recordPractice(right, total){
      const t = todayKey();
      mem.daily[t] = (mem.daily[t] || 0) + total;
      const p = mem.practice || (mem.practice = [0, 0]);
      p[0] += right; p[1] += total;
      save();
    },
    /* 集中練習 counts towards today's total, but not towards the「きょうの れんしゅう」
       accuracy the parent page reports — that number names one specific set. */
    recordFocus(right, total){
      const t = todayKey();
      mem.daily[t] = (mem.daily[t] || 0) + total;
      save();
    },
    practiceAccuracy(){
      const p = mem.practice;
      return (p && p[1]) ? p[0] / p[1] : null;
    },
    todayCount(){ return mem.daily[todayKey()] || 0; },
    streak(){
      let n = 0; const d = new Date();
      for (;;){
        const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        if ((mem.daily[k] || 0) > 0) n++; else break;
        d.setDate(d.getDate() - 1);
        if (n > 400) break;
      }
      return n;
    },
    accuracy(g){
      const ft = mem.firstTry[g];
      if (!ft || !ft[1]) return null;
      return ft[0] / ft[1];
    },

    /* ---- item-level memory ---- */
    noteFact(k, firstTryOk, label, from, ms){
      if (!k) return;
      const f = mem.facts[k] || (mem.facts[k] = [0, 0, 0]);
      f[0]++;
      if (firstTryOk) f[1]++;
      f[2] = dayNo();
      if (label) f[3] = label;      // so the parent page can say「3と7」, not「ten:3」
      /* Where this fact can be asked again. Without it the app can name a weak fact
         and still have no way to bring it back: the item key says which game, never
         which level. */
      if (from) f[4] = from;
      /* How long the answer took, kept only where speed is the goal and only for
         clean answers — a wrong answer times a guess. A single interrupted question
         (the iPad put down mid-problem) is clamped rather than dropped, so it cannot
         decide the average on its own. */
      if (ms > 0){
        const capped = Math.min(ms, 20000);
        f[5] = f[5] ? Math.round(f[5] * 0.65 + capped * 0.35) : capped;
      }
      save();
    },
    fact: k => mem.facts[k] || null,
    factOrigin(k){ const f = mem.facts[k]; return f && f[4] || null; },
    factSpeed(k){ const f = mem.facts[k]; return f && f[5] || null; },
    /** Typical time to answer this game's facts, in ms — null until something has
        been timed. Median across facts, so one bad question does not move it. */
    gameSpeed(g){
      const xs = [];
      for (const k in mem.facts){
        if (k.indexOf(g + ':') !== 0) continue;
        const f = mem.facts[k];
        if (f && f[5]) xs.push(f[5]);
      }
      if (!xs.length) return null;
      xs.sort((a, b) => a - b);
      return xs[Math.floor(xs.length / 2)];
    },
    /** Cleared with every answer right first time *and* without counting. */
    recordSwift(g, l){ mem.swift[key(g, l)] = 1; save(); },
    isSwift: (g, l) => !!mem.swift[key(g, l)],
    factDue: dueOf,
    weakFacts,

    /* ---- recent (windowed) performance ----
       A lifetime average cannot show that a child recovered, and it cannot show
       that a child has just started slipping. Both are what a parent needs. */
    recentAccuracy(g, l){
      const s = mem.recent[key(g, l)];
      if (!s) return null;
      let r = 0;
      for (let i = 0; i < s.length; i++) if (s[i] === '1') r++;
      return s.length ? r / s.length : null;
    },
    /** how many outcomes the recent window actually holds — a percentage over one
        question must never be presented as a judgement about a child */
    recentCount(g, l){ return (mem.recent[key(g, l)] || '').length; },
    gameRecentAccuracy(g, levels){
      let r = 0, n = 0;
      for (let i = 0; i < levels; i++){
        const s = mem.recent[key(g, i)] || '';
        for (let j = 0; j < s.length; j++){ n++; if (s[j] === '1') r++; }
      }
      return n ? r / n : null;
    },
    /** days since this level was last played; large when never played */
    daysSince(g, l){
      const d = mem.last[key(g, l)];
      return d ? Math.max(0, dayNo() - d) : 99;
    },
    addSticker(k){
      if (mem.stickers.indexOf(k) < 0){ mem.stickers.push(k); save(); return true; }
      return false;
    },
    hasSticker: k => mem.stickers.indexOf(k) >= 0,
    setPref(k, v){ mem[k] = v; save(); },
    reset(){ mem = blank(); save(); }
  };
})();

function shapeSVG(name, color, rot, size){

/* ---------- analogue clock ---------- */
function clockSVG(hour, minute, opts){
  const o = opts || {};
  const cx = 50, cy = 50, R = 45;
  const g = [
    svg('circle', { cx, cy, r: R, fill: 'var(--card)', stroke: 'var(--ink)', 'stroke-width': 3.4 }),
    svg('circle', { cx, cy, r: R - 4, fill: 'none', stroke: 'var(--card-edge)', 'stroke-width': 1.2 })
  ];
  for (let i = 0; i < 60; i++){
    const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
    const big = i % 5 === 0;
    const r1 = R - (big ? 8 : 4), r2 = R - 2.5;
    g.push(svg('line', {
      x1: cx + Math.cos(a) * r1, y1: cy + Math.sin(a) * r1,
      x2: cx + Math.cos(a) * r2, y2: cy + Math.sin(a) * r2,
      stroke: big ? 'var(--ink)' : 'var(--ink-faint)', 'stroke-width': big ? 2.6 : 1.1, 'stroke-linecap': 'round'
    }));
  }
  if (o.numerals !== false){
    for (let h = 1; h <= 12; h++){
      const a = (h / 12) * Math.PI * 2 - Math.PI / 2;
      g.push(svg('text', {
        x: cx + Math.cos(a) * (R - 15), y: cy + Math.sin(a) * (R - 15) + 4.4,
        'text-anchor': 'middle', fill: 'var(--ink)', 'font-size': 12, 'font-weight': 800,
        'font-family': 'var(--fs-num)'
      }, String(h)));
    }
  }
  const ma = (minute / 60) * Math.PI * 2 - Math.PI / 2;
  const ha = (((hour % 12) + minute / 60) / 12) * Math.PI * 2 - Math.PI / 2;
  g.push(svg('line', { x1: cx, y1: cy, x2: cx + Math.cos(ha) * 21, y2: cy + Math.sin(ha) * 21,
    stroke: 'var(--c-red)', 'stroke-width': 6.2, 'stroke-linecap': 'round', class: 'hand-h' }));
  g.push(svg('line', { x1: cx, y1: cy, x2: cx + Math.cos(ma) * 33, y2: cy + Math.sin(ma) * 33,
    stroke: 'var(--c-blue)', 'stroke-width': 4, 'stroke-linecap': 'round', class: 'hand-m' }));
  g.push(svg('circle', { cx, cy, r: 3.6, fill: 'var(--ink)' }));
  return svg('svg', { viewBox: '0 0 100 100', class: 'clock' + (o.cls ? ' ' + o.cls : ''), 'aria-hidden': 'true' }, g);
}

/* ---------- Catmull-Rom smoothing (used by numeral strokes) ---------- */
function smooth(ctrl, per){
  if (ctrl.length < 2) return ctrl.slice();
  const p = [ctrl[0]].concat(ctrl, [ctrl[ctrl.length - 1]]);
  const out = [], n = per || 14;
  for (let i = 1; i < p.length - 2; i++){
    const [p0, p1, p2, p3] = [p[i - 1], p[i], p[i + 1], p[i + 2]];
    for (let t = 0; t < n; t++){
      const s = t / n, s2 = s * s, s3 = s2 * s;
      out.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * s + (2*p0[0] - 5*p1[0] + 4*p2[0] - p3[0]) * s2 + (-p0[0] + 3*p1[0] - 3*p2[0] + p3[0]) * s3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * s + (2*p0[1] - 5*p1[1] + 4*p2[1] - p3[1]) * s2 + (-p0[1] + 3*p1[1] - 3*p2[1] + p3[1]) * s3)
      ]);
    }
  }
  out.push(ctrl[ctrl.length - 1]);
  return out;
}
const toPath = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');

/* ---------- numeral stroke data (0-9) in a 100 x 140 box ----------
   Forms and stroke order follow Japanese elementary handwriting practice. */
const DIGIT_CTRL = {

  1: [[[30,34],[50,16],[52,40],[52,126]]],

  5: [[[32,22],[28,64],[52,54],[74,68],[76,96],[56,120],[28,118],[20,108]], [[32,22],[80,22]]],
  6: [[[72,20],[46,32],[28,62],[24,96],[38,120],[62,122],[76,104],[70,80],[46,74],[28,88]]],
  7: [[[22,26],[80,26],[62,66],[44,126]]],

  9: [[[70,44],[58,26],[38,26],[26,44],[32,64],[54,70],[70,58],[72,34],[72,84],[66,114],[48,128],[32,126]]]

const DIGIT_STROKES = (() => {

/* ===========================================================
   04 — screens, feedback effects, drag helper
   =========================================================== */
'use strict';

const UI = (() => {
  const screens = {};
  let stage = null, fx = null, current = null;

  function init(){
    stage = $('#stage');
    fx    = $('#fx');
  }
  function register(name, node){
    node.classList.add('screen');
    node.hidden = true;
    screens[name] = node;
    stage.append(node);
    return node;
  }
  function show(name, opts){
    const o = opts || {};
    Sound.hush();
    for (const k in screens) screens[k].hidden = true;
    const n = screens[name];
    if (!n) return null;
    n.hidden = false;
    n.classList.remove('enter');
    void n.offsetWidth;
    n.classList.add('enter');
    current = name;
    n.scrollTop = 0;
    const sc = $('.worlds, .sheet, .levels, .book', n);
    if (sc) sc.scrollTop = o.keepScroll ? sc.scrollTop : 0;
    return n;
  }
  const currentName = () => current;

  /* ---------- feedback ---------- */
  const CRAYONS = ['--c-red','--c-orange','--c-yellow','--c-green','--c-blue','--c-purple','--c-pink'];
  const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function confetti(count, originX, originY){
    if (reduced()) return;
    const n = count || 26;
    const w = innerWidth, h = innerHeight;
    const ox = originX == null ? w / 2 : originX;
    const oy = originY == null ? h * 0.45 : originY;
    for (let i = 0; i < n; i++){
      const p = el('div.confetti');
      p.style.background = `var(${CRAYONS[i % CRAYONS.length]})`;
      p.style.left = ox + 'px';
      p.style.top  = oy + 'px';
      fx.append(p);
      const a  = (-Math.PI / 2) + (Math.random() - .5) * 2.1;
      const v  = 260 + Math.random() * 420;
      const dx = Math.cos(a) * v, dy = Math.sin(a) * v;
      const dur = 900 + Math.random() * 700;
      p.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx * .6}px, ${dy * .6 + 90}px) rotate(${180 + Math.random()*360}deg)`, opacity: 1, offset: .55 },
        { transform: `translate(${dx}px, ${dy + h * .75}px) rotate(${540 + Math.random()*360}deg)`, opacity: 0 }
      ], { duration: dur, easing: 'cubic-bezier(.2,.6,.4,1)' }).finished.then(() => p.remove()).catch(() => p.remove());
    }
  }

  function bigMark(txt, color){
    const n = el('div.bigmark', { text: txt, style: { color: color || 'var(--good)' } });
    document.body.append(n);
    setTimeout(() => n.remove(), 760);
  }

  function stars(count, big){
    const wrap = el(big ? 'div.bigstars' : 'div.st');
    for (let i = 0; i < 3; i++){
      const s = starSVG(i < count);
      s.classList.add('s');
      if (i < count) s.classList.add('on');
      s.style.animationDelay = (i * 0.22) + 's';
      wrap.append(s);
    }
    return wrap;
  }

  /* ---------- fit the question to the space it was given ----------
     The whole layout is expressed in --u, and --u came from the viewport's short
     side, capped at 17px. So a question was always the same small island in the
     middle of the iPad no matter how much room there was: the ten-frame in
     「10の おともだち」 covered 3.5% of a 1024x768 screen and 4.5% of a 12.9-inch
     one — a bigger iPad only bought more margin, and the tracing box, the thing a
     finger most needs to be large, sat at 345px on a 1024px-wide screen.

     The playfield's box does not depend on its own contents (its siblings are
     flex:0 0 auto and it has min-height:0), so we can grow --u inside it and
     stop at the largest value where nothing sticks out. */
  /* Grow to fill the room, but also shrink a little when a question is naturally
     too wide (a row of eight animals on a portrait iPad): a row the child has to
     count is worthless once it scrolls out of sight. */
  const FIT_MAX = 2.4, FIT_MIN = 0.72;

  function fitsInside(field, kids){
    const b = field.getBoundingClientRect();
    const slack = 2;
    for (let i = 0; i < kids.length; i++){
      const n = kids[i];
      const r = n.getBoundingClientRect();
      if (!r.width && !r.height) continue;              // hidden / zero-sized
      if (r.left < b.left - slack || r.right > b.right + slack
       || r.top  < b.top  - slack || r.bottom > b.bottom + slack) return false;
      /* Staying inside the playfield is not enough: なんばんめ's row of animals
         scrolls inside its own container, so it can sit within the field and still
         hide half the animals the child is being asked to count. Only real scroll
         containers count — plenty of boxes report harmless overflow from borders,
         shadows and emoji glyphs. */
      if (n.scrollWidth > n.clientWidth + 4 || n.scrollHeight > n.clientHeight + 4){
        const ov = getComputedStyle(n);
        if (ov.overflowX === 'auto' || ov.overflowX === 'scroll'
         || ov.overflowY === 'auto' || ov.overflowY === 'scroll') return false;
      }
    }
    return true;
  }

  function fitPlayfield(field){
    if (!field || !field.isConnected) return;
    field.style.removeProperty('--u');
    const box = field.getBoundingClientRect();
    if (box.width < 60 || box.height < 60) return;      // off-screen or mid-transition
    const base = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 12;
    // the search only changes sizes, never the tree, so collect the nodes once
    const kids = field.querySelectorAll('*');
    const at = m => {
      field.style.setProperty('--u', (base * m).toFixed(2) + 'px');
      return fitsInside(field, kids);
    };
    let lo = FIT_MIN, hi = FIT_MAX;
    for (let i = 0; i < 6; i++){                        // ~1.5% precision
      const m = (lo + hi) / 2;
      if (at(m)) lo = m; else hi = m;
    }
    at(lo);
  }

  /** Re-fit whenever the question's contents change — story scenes, hints and
      multi-blank questions all add nodes after the first draw. */
  function watchFit(field){
    let queued = false;
    const run = () => { queued = false; fitPlayfield(field); };
    const ping = () => {
      if (queued) return;
      queued = true;
      (window.requestAnimationFrame || setTimeout)(run, 0);
    };
    if (window.MutationObserver){
      new MutationObserver(ping).observe(field, { childList: true, subtree: true, characterData: true });
    }
    window.addEventListener('resize', ping);
    return ping;
  }

  /* ---------- drag & drop (pointer based, with tap fallback) ---------- */
  function makeDragDrop(opts){
    // opts: { items(), targets(), onDrop(item, target), tapSelect: bool }
    let selected = null, dragging = null, ghost = null, sx = 0, sy = 0, moved = false, overEl = null;
    let activeId = null;
    // a five-year-old's "tap" slides a few millimetres; 8px turned taps into drags
    const THRESH = 18;

    function clearSel(){
      if (selected) selected.classList.remove('sel');
      selected = null;
    }
    function setOver(t){
      if (overEl === t) return;
      if (overEl) overEl.classList.remove('over');
      overEl = t;
      if (overEl) overEl.classList.add('over');
    }
    function targetAt(x, y){
      const e = document.elementFromPoint(x, y);
      return e ? e.closest('[data-drop]') : null;
    }
    function endDrag(x, y){
      if (ghost){ ghost.remove(); ghost = null; }
      if (dragging) dragging.classList.remove('dragging');
      const t = (x != null) ? targetAt(x, y) : null;
      setOver(null);
      const it = dragging; dragging = null;
      if (it && moved){
        if (t) opts.onDrop(it, t);
        return true;
      }
      return false;
    }

    function onDown(e){
      const it = e.currentTarget;
      if (e.button != null && e.button > 0) return;
      if (dragging) return;                 // a second finger must not hijack the first
      activeId = e.pointerId;
      dragging = it; moved = false;
      sx = e.clientX; sy = e.clientY;
      window.addEventListener('pointermove', onMove, { passive: false });
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    }
    function onMove(e){
      if (!dragging || e.pointerId !== activeId) return;
      if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < THRESH) return;
      e.preventDefault();
      if (!moved){
        moved = true;
        clearSel();
        dragging.classList.add('dragging');
        ghost = dragging.cloneNode(true);
        ghost.id = 'ghost';
        ghost.classList.remove('dragging', 'sel');
        const r = dragging.getBoundingClientRect();
        ghost.style.width = r.width + 'px';
        ghost.style.height = r.height + 'px';
        document.body.append(ghost);
      }
      ghost.style.left = e.clientX + 'px';
      ghost.style.top  = e.clientY + 'px';
      setOver(targetAt(e.clientX, e.clientY));
    }
    function onUp(e){
      if (e.pointerId !== activeId) return;
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      activeId = null;
      const it = dragging;
      const dropped = endDrag(moved ? e.clientX : null, moved ? e.clientY : null);
      if (!it) return;
      if (!dropped){
        // a tap, or a drag that landed on nothing — either way, leave it selected
        // so the child can just tap the bin instead of dragging again
        if (!moved && selected === it) clearSel();
        else { clearSel(); selected = it; it.classList.add('sel'); Sound.sfx.tap(); }
      }
    }
    function bindItem(it){ it.addEventListener('pointerdown', onDown); }
    function bindTarget(t){
      t.setAttribute('data-drop', '');
      t.addEventListener('click', () => {
        if (selected){ const s = selected; opts.onDrop(s, t); if (s.classList.contains('gone')) clearSel(); }
      });
    }
    function select(it){ clearSel(); selected = it; it.classList.add('sel'); }
    return { bindItem, bindTarget, clearSel, select, get selected(){ return selected; } };
  }

  return { init, register, show, currentName, confetti, bigMark, stars, makeDragDrop, screens,
           fitPlayfield, watchFit };
})();
