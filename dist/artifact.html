    src.start();
  }

  const PENT = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5, 1568, 1760, 2093];

  const S = {
    tap()      { seq([720], 'sine', .05, .35); },
    place()    { seq([420, 620], 'sine', .05, .4); },
    count(i)   { seq([PENT[Math.min(i, PENT.length - 1)]], 'triangle', .07, .42); },
    correct()  { seq([659.25, 830.61, 987.77, 1318.5], 'triangle', .075, .45); },
    wrong()    { seq([311.13, 261.63], 'sine', .13, .32); },
    star(i)    { seq([1046.5 + i * 180, 1568 + i * 200, 2093 + i * 240], 'triangle', .07, .3); noiseBurst(.25, .12); },
    finish()   { seq([523.25, 659.25, 783.99, 1046.5, 1318.5, 1046.5, 1318.5], 'triangle', .1, .42); },
    unlockSfx(){ seq([523.25, 783.99], 'triangle', .1, .35); },
    swoosh()   { noiseBurst(.18, .1); }
  };

  /* ---------- speech ----------
     How natural this sounds is decided by which voice the device has installed,
     not by anything we do here: the bundled "compact" Kyoko is the flat, robotic
     one, while the enhanced / premium download (設定 → アクセシビリティ →
     読み上げコンテンツ → 声) and the Siri voices sound like a person reading.
     So rank the candidates instead of taking the first ja voice, and let the
     parent page override the pick for the device actually in their hands. */
  const VOICE_RANK = [
    [/siri/i,                                     60],
    [/premium|プレミアム/i,                        50],
    [/enhanced|拡張|高品質/i,                       40],
    // Apple's current voice family (Ventura / iOS 16 onward) shares the engine
    // behind Siri, so it phrases a sentence instead of reciting it — it beats the
    // old compact Kyoko even though Kyoko is the name everyone recognises.
    [/^(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\b/i, 30],
    [/^(sandy|flo)\b/i,                            4],  // warmest of that family for a 5-year-old
    [/neural|natural|wavenet|google|microsoft/i,   25],
    [/kyoko|o-?ren|nanami|ayumi|haruka|mizuki/i,   10],
    [/otoya|hattori|ichiro|keita/i,                 5]
  ];
  function voiceScore(v){
    const n = (v.name || '') + ' ' + (v.voiceURI || '');
    let s = v.localService ? 8 : 0;   // offline-first, but never over a much better voice
    for (const [re, w] of VOICE_RANK) if (re.test(n)) s += w;
    return s;
  }

  function loadVoices(){
    if (!window.speechSynthesis) return;
    const vs = speechSynthesis.getVoices();
    if (!vs || !vs.length) return;
    voicesReady = true;
    jaVoices = vs.filter(v => /^ja(-|_|$)/i.test(v.lang || ''))
                 .sort((a, b) => voiceScore(b) - voiceScore(a));
    jaVoice = (prefVoice && jaVoices.find(v => v.voiceURI === prefVoice || v.name === prefVoice))
           || jaVoices[0] || null;
  }
  if (window.speechSynthesis){
    loadVoices();
    speechSynthesis.addEventListener('voiceschanged', loadVoices);
  }

  /** iOS may populate voices asynchronously after the first user gesture. */
  function probeVoice(timeout){
    if (!voiceOn || !window.speechSynthesis) return Promise.resolve(false);
    loadVoices();
    if (jaVoice) return Promise.resolve(true);
    return new Promise(resolve => {
      let done = false;
      const finish = ok => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try{ speechSynthesis.removeEventListener('voiceschanged', changed); }catch(e){}
        resolve(!!ok);
      };
      const changed = () => { loadVoices(); if (jaVoice) finish(true); };
      const timer = setTimeout(() => { loadVoices(); finish(!!jaVoice); },
        timeout == null ? 1200 : timeout);
      try{ speechSynthesis.addEventListener('voiceschanged', changed); }catch(e){}
    });
  }

  /* Japanese TTS decides its phrasing and pitch accent by parsing the sentence,
     and a space inside a sentence breaks that parse — the reason the same line
     can come out either flat or lively. The prompts are written with kanji and
     punctuation for the engine's benefit; this strips any stray spacing left
     between Japanese characters. */
  const JA = /[\u3000-\u30FF\u3400-\u9FFF\uFF00-\uFF9F]/;
  function forSpeech(text){
    return String(text)
      .replace(/[ \u3000]+/g, ' ')
      .replace(/(.) (?=(.))/g, (m, a, b) => JA.test(a) && JA.test(b) ? a : m)
      .trim();
  }

  let speakTimer = null;
  /* `opts.onend` hears when a line is over: finished, cut off by a newer line or by
     hush(), or never going to be spoken at all (voice off, no engine). The engine
     times an answer from the end of the question, not from the first word of it —
     a question read aloud for four seconds is not four seconds of thinking. */
  let ending = null;                  // { f } for the line currently owed an onend
  /* The utterance being spoken, held on purpose: Chrome can collect one nothing
     references and then never fire its onend — and a line whose end never comes
     leaves every answer timed as instant. */
  let speaking = null;
  /* And if the end still never comes (some engines drop it on iOS too), stop
     waiting after roughly how long the line takes to say. */
  const sayMs = (t, rate) => 700 + t.length * 250 / (rate || 1);
  function ended(){
    const t = ending; ending = null;
    if (t) try{ t.f(); }catch(e){}
  }
  function say(text, opts){
    const o = opts || {};
    if (!voiceOn || !text || !window.speechSynthesis){
      if (o.onend) try{ o.onend(); }catch(e){}
      return;
    }
    clearTimeout(speakTimer);
    ended();                          // the line this one replaces will not be heard
    const mine = o.onend ? { f: o.onend } : null;
    ending = mine;
    let guard = null;
    const fire = () => { clearTimeout(guard); if (mine && ending === mine) ended(); };
    const go = () => {
      try{
        if (!voicesReady) loadVoices();
        speechSynthesis.cancel();
        const line = forSpeech(text);
        const u = new SpeechSynthesisUtterance(line);
        speaking = u;
        u.lang  = 'ja-JP';
        if (jaVoice) u.voice = jaVoice;
        // 1.0 is the voice's own recorded prosody; pushing rate or pitch away
        // from it is what made this sound synthetic. Only nudge, never shove.
        u.rate   = o.rate   == null ? 0.95 : o.rate;
        u.pitch  = o.pitch  == null ? 1 : o.pitch;
        u.volume = o.volume == null ? 1 : o.volume;
        u.onend = u.onerror = () => { if (speaking === u) speaking = null; fire(); };
        speechSynthesis.speak(u);
        if (mine) guard = setTimeout(fire, sayMs(line, u.rate));
      }catch(e){ fire(); }
    };
    // a beat of delay lets the sfx land first and avoids iOS cancel/speak races
    speakTimer = setTimeout(go, o.delay == null ? 90 : o.delay);
  }
  function hush(){
    clearTimeout(speakTimer);
    try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){}
    ended();
  }

  return {
    sfx: S, unlock, say, hush, probeVoice,
    get sfxOn(){ return sfxOn; },  set sfxOn(v){ sfxOn = !!v; },
    get voiceOn(){ return voiceOn; }, set voiceOn(v){ voiceOn = !!v; if (!v) hush(); },
    get hasVoice(){ return !!jaVoice; },
    /** The parent page lists these so a device with a better voice installed can use it. */
    get voices(){ if (!voicesReady) loadVoices(); return jaVoices.slice(); },
    get voiceId(){ return jaVoice ? jaVoice.voiceURI : null; },
    set voiceId(id){ prefVoice = id || null; loadVoices(); }
  };
})();

/* ---- 02-store.js ---- */
/* ===========================================================
   02 — progress storage (per-device, localStorage; degrades to memory)
   =========================================================== */
'use strict';

/* What「考えずに言える」means in milliseconds for the number facts in けいさんの やま.
   Under FAST the answer arrived; over SLOW it was worked out — almost always by
   counting. Between the two it is on its way. These are deliberately generous:
   the point is to tell retrieval from counting, not to run a race. */
const FLUENT_FAST_MS = 3000, FLUENT_SLOW_MS = 9000;

const Store = (() => {
  const KEY = 'kazu-no-bouken.v1';
  const blank = () => ({
    stars: {},        // "gameId:levelIndex" -> 0..3
    plays: {},        // "gameId:levelIndex" -> attempts
    seen:  {},        // gameId -> total questions answered
    firstTry: {},     // gameId -> [correctFirstTry, total] (lifetime)
    /* Per-game aggregates can only ever say "this game is shaky". These two say
       *what* is shaky and *when* — which is what lets the app come back to the
       exact fact the child missed, and lets the parent page name it. */
    /* facts: item key -> [asked, firstTryRight, lastDayNumber, label,
                           "gameId:levelIndex", typicalMs, {missKind: count}]
       The last slot is *what kind* of wrong it was. Right/wrong is one bit and it
       cannot separate a child who read back the part they could see from one who
       was a single count out — see 06-miss.js. */
    facts: {},
    factRecent: {},  // item key -> last 12 first-try outcomes; recovered facts can graduate
    recent: {},       // "gameId:levelIndex" -> last 30 first-try outcomes, "1011…"
    last:  {},        // "gameId:levelIndex" -> day number last played
    swift: {},        // "gameId:levelIndex" -> 1 when cleared without counting
    /* "gameId:levelIndex" -> 1 once the hand has shown this level's method and the
       child has done one alongside it. Until then, opening the level starts with
       those two questions instead of a test. */
    intro: {},
    /* "gameId:levelIndex" -> [clearDay, lastCheckDay, failedChecks]. A clear below
       ★★★ goes on the shelf provisionally: eight questions at 4 right is a pass that
       random tapping reaches on a three-choice level about one time in four. It is
       confirmed by two of three right on another day (or by clearing it again on
       another day, or by ★★★). The door and おすすめ count confirmed clears. */
    pending: {},
    stickers: [],     // earned sticker keys
    daily: {},        // "YYYY-MM-DD" -> questions done
    practice: [0, 0],   // [firstTryRight, total] across きょうの れんしゅう
    diagnostic: null, // { completedDay, outcomes, recommended }
    orientation: false,
    missions: {},     // "YYYY-MM-DD" -> { id, gameId, text, prompt, done, reviewed }
    name: '',
    sfx: true, voice: true, voiceId: null,
    /* The 小1 world opens by itself when every sticker is on the shelf. This flag is
       the parent's override: a child who is ready but cannot get ★★★ on とけい must
       not be held behind a padlock they cannot move — the same reason a level opens
       after three honest attempts. Once true it stays true. */
    g1Open: false,
    /* Set by the app the first time every 入学前 level is cleared. The door is
       worked out from the shelf, and a release that adds a 入学前 level would
       otherwise shut it again on a child who had already gone through. */
    g1Reached: false,
    /* Day number of the last export. Six months of records live in one localStorage
       key on a device whose OS is documented to throw them away, and the only
       defence — 書き出す — sat behind an adult gate that nobody had a reason to open.
       Nothing here backs anything up by itself; it just knows when to ask. */
    backupAt: 0,
    /* The April the child starts school. Guessed from the first day of use and
       overridable, because「入学までの半年」is the premise of the whole app and until
       now the app had no idea when that was: the roadmap on the parent page was
       fixed prose that could not say which month this child is actually in. */
    schoolYear: 0,
    createdAt: Date.now()
  });

  /* Three different failures, kept apart because each needs a different sentence
     on the parent page:
       avail      — can this page use localStorage at all (blocked site data,
                    some file:// origins). Nothing is written.
       ok         — did the last write land. A full disk is not permanent, so the
                    next save tries again instead of giving up for good.
       unreadable — there was a record and it would not parse. It used to switch
                    saving off for ever on that device, and「消す」and「読み込む」
                    reported success while writing nothing. Now the bytes are set
                    aside under their own key and a fresh record starts. */
  let mem = blank(), avail = true, ok = true, unreadable = false;
  const ASIDE = KEY + '.unreadable';

  try{
    const raw = localStorage.getItem(KEY);
    if (raw){
      let parsed = null;
      try{ parsed = JSON.parse(raw); }catch(e){}
      if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)){
        mem = Object.assign(blank(), parsed);
        /* It parsed, but a field can still have the wrong shape — `stickers` that is
           not a list stopped Home from drawing at all, so the app never opened and
           the record could not even be written out. A field like that goes back to
           empty, and the whole record as it was is kept aside first. (The full
           check in normalizeData needs 06-miss.js, which has not loaded yet here.) */
        const fresh = blank();
        const shape = v => Array.isArray(v) ? 'array' : v === null ? 'null' : typeof v;
        let bent = false;
        for (const k of Object.keys(fresh)){
          const want = shape(fresh[k]), got = shape(mem[k]);
          if (want === got) continue;
          if ((k === 'diagnostic' && got === 'object') || (k === 'voiceId' && got === 'string')) continue;
          mem[k] = fresh[k];
          bent = true;
        }
        if (bent){ try{ localStorage.setItem(ASIDE, raw); }catch(e){} }
      } else {
        unreadable = true;
        // if the copy cannot be made, the original is the only one: leave it be
        try{ localStorage.setItem(ASIDE, raw); }catch(e){ avail = false; }
      }
    }
  }catch(e){ avail = false; }

  let pending = null;
  function writeNow(){
    if (!avail) return;
    clearTimeout(pending); pending = null;
    try{ localStorage.setItem(KEY, JSON.stringify(mem)); ok = true; }
    catch(e){ ok = false; }          // quota or private mode: the next save tries again
  }
  function save(){
    if (!avail) return;
    clearTimeout(pending);
    pending = setTimeout(writeNow, 120);
  }
  // the app is usually closed straight after finishing a level; don't lose that write
  addEventListener('pagehide', writeNow);
  addEventListener('visibilitychange', () => { if (document.hidden) writeNow(); });

  const key = (g, l) => g + ':' + l;
  /* Whole-day resolution keeps six months of daily use small enough for
     localStorage, and days are the only unit the scheduling actually needs. */
  const DAY = 86400000;
  /* The local calendar day, not the UTC one. Counted in UTC, a day in Japan ended at
     9 in the morning: a backup written at 8:30 was「1日前」by 9:30, and every
     「何日ふれていない」and the pace to 入学 were a day out for half of each morning. */
  const dayOf = ms => Math.floor((ms - new Date(ms).getTimezoneOffset() * 60000) / DAY);
  const dayNo = () => dayOf(Date.now());
  const todayKey = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  /* ---- backup ----------------------------------------------------------
     localStorage is scoped to one origin and one browser, so the same app on a
     different URL (or after clearing site data) starts empty. Export/import is
     the only thing that makes six months of records actually portable. */
  const FILE_TAG = 'kazu-no-bouken';

  function exportText(){
    return JSON.stringify({ app: FILE_TAG, v: 1, savedAt: new Date().toISOString(), data: mem }, null, 2);
  }

  const isRecord = v => !!v && typeof v === 'object' && !Array.isArray(v);
  const isCount = v => Number.isFinite(v) && v >= 0;
  const safeKey = k => k !== '__proto__' && k !== 'prototype' && k !== 'constructor';
  /** {missKind: count} — a small tally, and every key has to be one we know */
  const isMissMap = v => isRecord(v) && Object.keys(v).every(
    k => safeKey(k) && MISS_KINDS[k] && isCount(v[k]));

  /** Validate into a fresh object before touching the live record. Older backups
      may omit newer fields, but a field that is present must have the shape the
      rest of Store expects. */
  function normalizeData(data){
    if (!isRecord(data)) return null;
    const out = blank();
    const copyMap = (name, valid) => {
      if (data[name] == null) return data[name] === undefined;
      if (!isRecord(data[name])) return false;
      const next = {};
      for (const k of Object.keys(data[name])){
        if (!safeKey(k) || !valid(data[name][k])) return false;
        next[k] = data[name][k];
      }
      out[name] = next;
      return true;
    };

    if (!copyMap('stars', v => isCount(v) && v <= 3)
     || !copyMap('plays', isCount)
     || !copyMap('seen', isCount)
     || !copyMap('daily', isCount)
     || !copyMap('last', isCount)
     || !copyMap('swift', v => v === 0 || v === 1)
     || !copyMap('intro', v => v === 1)
     || !copyMap('pending', v => Array.isArray(v) && v.length >= 3 && v.slice(0, 3).every(isCount))
     || !copyMap('recent', v => typeof v === 'string' && /^[01]{0,30}$/.test(v))
     || !copyMap('firstTry', v => Array.isArray(v) && v.length >= 2
          && isCount(v[0]) && isCount(v[1]) && v[0] <= v[1])
     || !copyMap('facts', v => Array.isArray(v) && v.length >= 3
          && isCount(v[0]) && isCount(v[1]) && v[1] <= v[0] && isCount(v[2])
          && (v[3] == null || typeof v[3] === 'string')
          && (v[4] == null || typeof v[4] === 'string')
          && (v[5] == null || isCount(v[5]))
          && (v[6] == null || isMissMap(v[6])))) return null;

    if (data.stickers !== undefined){
      if (!Array.isArray(data.stickers) || data.stickers.some(v => typeof v !== 'string')) return null;
      out.stickers = Array.from(new Set(data.stickers));
    }
    if (data.practice !== undefined){
      if (!Array.isArray(data.practice) || data.practice.length < 2
       || !isCount(data.practice[0]) || !isCount(data.practice[1])
       || data.practice[0] > data.practice[1]) return null;
      out.practice = data.practice.slice(0, 2);
    }
    if (data.diagnostic !== undefined && data.diagnostic !== null){
      const d = data.diagnostic;
      if (!isRecord(d) || !isCount(d.completedDay)
       || !Array.isArray(d.outcomes)
       || d.outcomes.some(x => !isRecord(x) || typeof x.gameId !== 'string'
          || !isCount(x.levelIndex) || typeof x.clean !== 'boolean')
       || (d.recommended != null && (!isRecord(d.recommended)
          || typeof d.recommended.gameId !== 'string'
          || !isCount(d.recommended.levelIndex)))) return null;
      out.diagnostic = {
        completedDay: d.completedDay,
        outcomes: d.outcomes.map(x => ({
          gameId: x.gameId, levelIndex: x.levelIndex, clean: x.clean
        })),
        recommended: d.recommended == null ? null : {
          gameId: d.recommended.gameId, levelIndex: d.recommended.levelIndex
        }
      };
    }
    if (data.missions !== undefined){
      if (!isRecord(data.missions)) return null;
      out.missions = {};
      for (const day of Object.keys(data.missions)){
        const m = data.missions[day];
        if (!safeKey(day) || !isRecord(m)
         || typeof m.day !== 'string' || typeof m.id !== 'string'
         || typeof m.gameId !== 'string' || typeof m.text !== 'string'
         || typeof m.prompt !== 'string'
         || (m.done !== undefined && typeof m.done !== 'boolean')
         || (m.reviewed !== undefined && typeof m.reviewed !== 'boolean')
         || (m.doneDay !== undefined && !isCount(m.doneDay))) return null;
        out.missions[day] = {
          day: m.day, id: m.id, gameId: m.gameId, text: m.text, prompt: m.prompt,
          done: !!m.done, reviewed: !!m.reviewed
        };
        if (m.doneDay !== undefined) out.missions[day].doneDay = m.doneDay;
      }
    }
    if (data.name !== undefined){
      if (typeof data.name !== 'string') return null;
      out.name = data.name.slice(0, 12);
    }
    for (const k of ['sfx', 'voice', 'g1Open', 'g1Reached']){
      if (data[k] !== undefined){
        if (typeof data[k] !== 'boolean') return null;
        out[k] = data[k];
      }
    }
    if (data.voiceId !== undefined){
      if (data.voiceId !== null && typeof data.voiceId !== 'string') return null;
      out.voiceId = data.voiceId;
    }
    for (const k of ['backupAt', 'schoolYear', 'createdAt']){
      if (data[k] !== undefined){
        if (!isCount(data[k])) return null;
        out[k] = data[k];
      }
    }
    return out;
  }

  const maxNum = (a, b) => Math.max(a || 0, b || 0);
  function mergeInto(base, add){
    const out = Object.assign(blank(), base);
    ['stars', 'plays', 'seen', 'daily', 'swift', 'intro'].forEach(k => {
      const src = add[k] || {};
      out[k] = Object.assign({}, base[k] || {});
      // max, never sum: importing the same backup twice must not inflate anything
      for (const id in src) out[k][id] = maxNum(out[k][id], src[id]);
    });
    out.firstTry = Object.assign({}, base.firstTry || {});
    const af = add.firstTry || {};
    for (const g in af){
      const cur = out.firstTry[g];
      if (!cur || (af[g][1] || 0) > (cur[1] || 0)) out.firstTry[g] = af[g].slice();
    }
    // facts: keep the record that has been practised more; never sum
    out.facts = Object.assign({}, base.facts || {});
    const af2 = add.facts || {};
    for (const k in af2){
      const cur = out.facts[k];
      const mine = (base.facts && base.facts[k] && base.facts[k][6]) || null;
      const theirs = af2[k][6] || null;
      if (!cur || (af2[k][0] || 0) > (cur[0] || 0)) out.facts[k] = af2[k].slice();
      else if (cur){
        cur[2] = maxNum(cur[2], af2[k][2]);
        if (!cur[4] && af2[k][4]) cur[4] = af2[k][4];   // keep whichever side knows where to ask it
      }
      // miss tallies: max per kind, never sum — the same rule the rest of the
      // merge follows, so importing one backup twice cannot invent mistakes
      if (mine || theirs){
        const m = {};
        if (mine) for (const t in mine) m[t] = mine[t];
        if (theirs) for (const t in theirs) m[t] = maxNum(m[t], theirs[t]);
        out.facts[k] = out.facts[k].slice();
        out.facts[k][6] = m;
      }
    }
    /* recent / last: follow whichever side actually played that level more, and on
       a tie the side that met it last. `plays` only counts whole levels, so a level
       met only inside きょうの れんしゅう or とっくん is 0 on both sides — and a strict
       「more」 dropped its record even when this device had none at all. */
    out.recent = Object.assign({}, base.recent || {});
    out.last   = Object.assign({}, base.last || {});
    for (const k in (add.recent || {})){
      const ap = (add.plays && add.plays[k]) || 0, bp = (base.plays && base.plays[k]) || 0;
      const newer = ((add.last && add.last[k]) || 0) > ((base.last && base.last[k]) || 0);
      if (!(k in out.recent) || ap > bp || (ap === bp && newer)) out.recent[k] = add.recent[k];
    }
    for (const k in (add.last || {})) out.last[k] = maxNum(out.last[k], add.last[k]);
    out.stickers = Array.from(new Set((base.stickers || []).concat(add.stickers || [])));
    const bp = base.practice || [0, 0], ap = add.practice || [0, 0];
    out.practice = (ap[1] || 0) > (bp[1] || 0) ? ap.slice() : bp.slice();
    const bd = base.diagnostic, ad = add.diagnostic;
    out.diagnostic = !bd ? ad : !ad ? bd
      : ((ad.completedDay || 0) > (bd.completedDay || 0) ? ad : bd);
    out.missions = Object.assign({}, base.missions || {});
    for (const d in (add.missions || {})){
      const cur = out.missions[d], incoming = add.missions[d];
      if (!cur) out.missions[d] = Object.assign({}, incoming);
      else if (cur.id === incoming.id) out.missions[d] = Object.assign({}, cur, incoming, {
        done: !!(cur.done || incoming.done),
        reviewed: !!(cur.reviewed || incoming.reviewed)
      });
      else {
        // A catalog update can assign a different mission to the same date.
        // Keep one actual record intact; never transfer completion to other text.
        const score = m => (m.reviewed ? 4 : 0) + (m.done ? 2 : 0) + (m.doneDay || 0) / 1e9;
        out.missions[d] = Object.assign({}, score(incoming) > score(cur) ? incoming : cur);
      }
    }
    /* provisional clears: confirmed on either device (on that shelf, not waiting)
       stays confirmed; otherwise keep the earliest clear and the latest check */
    out.pending = {};
    const bpend = base.pending || {}, apend = add.pending || {};
    const shelved = (rec, k) => (rec.stickers || []).indexOf(k) >= 0;
    new Set(Object.keys(bpend).concat(Object.keys(apend))).forEach(k => {
      if ((shelved(base, k) && !bpend[k]) || (shelved(add, k) && !apend[k])) return;
      const x = bpend[k], y = apend[k];
      if (!x || !y){ out.pending[k] = (x || y).slice(0, 3); return; }
      out.pending[k] = [Math.min(x[0], y[0]), Math.max(x[1], y[1]), Math.max(x[2], y[2])];
    });
    // a stage that has been opened on either device stays open
    out.g1Open = !!(base.g1Open || add.g1Open);
    out.g1Reached = !!(base.g1Reached || add.g1Reached);
    out.backupAt = maxNum(base.backupAt, add.backupAt);
    out.schoolYear = base.schoolYear || add.schoolYear || 0;
    out.name = base.name || add.name || '';
    out.createdAt = Math.min(base.createdAt || Date.now(), add.createdAt || Date.now());
    return out;
  }

  /** mode: 'merge' (default, never loses or inflates) or 'replace' */
  function importText(text, mode){
    if (typeof text !== 'string' || text.length > 2 * 1024 * 1024){
      return { ok: false, msg: 'ファイルが大きすぎるか、読み取れない形式です。' };
    }
    let parsed;
    try{ parsed = JSON.parse(text); }
    catch(e){ return { ok: false, msg: 'ファイルの中身を読み取れませんでした。' }; }
    const data = (parsed && parsed.app === FILE_TAG && parsed.data) ? parsed.data
               : (parsed && isRecord(parsed.stars)) ? parsed // a bare data object is fine too
               : null;
    const normalized = normalizeData(data);
    if (!normalized) return { ok: false, msg: '記録の形式がこわれているため、読み込みませんでした。' };
    const before = Object.keys(mem.stars || {}).length;
    const next = mode === 'replace' ? normalized : mergeInto(mem, normalized);
    mem = next;
    writeNow();
    const after = Object.keys(mem.stars || {}).length;
    const summary = `（★のついたレベル ${before} → ${after}、シール ${mem.stickers.length} 枚）`;
    // the record is in use either way; say plainly when it will not outlive the app
    if (!(avail && ok)){
      return { ok: true, saved: false, savedAt: parsed.savedAt || null,
               msg: '読み込みましたが、この端末に保存できませんでした' + summary
                  + '。アプリを閉じると元に戻ります。' };
    }
    return { ok: true, saved: true, msg: '読み込みました' + summary, savedAt: parsed.savedAt || null };
  }

  /** How much this fact is owed a turn: 0 (fresh and solid) … ~2 (missed, or long unseen).
      A fact that has never been asked scores 1, so nothing is starved at the start. */
  function dueOf(k){
    const f = mem.facts[k];
    if (!f || !f[0]) return 1;
    const acc = f[1] / f[0];
    const age = Math.min(30, dayNo() - f[2]);
    /* Right but slow is not the same as known. Right-first-time cannot tell a child
       who remembers「10は4と6」from one who counted the six empty cells for nine
       seconds, and only the first of those makes a carry sum fast. */
    const slow = f[5] ? clamp((f[5] - FLUENT_FAST_MS) / (FLUENT_SLOW_MS - FLUENT_FAST_MS), 0, 1) : 0;
    return (1 - acc) * 1.6 + (age / 30) * 0.6 + (f[0] < 3 ? 0.25 : 0) + slow * 0.5;
  }

  /** The facts this child keeps missing, worst first.
      Only facts they have actually met and actually got wrong: 集中練習 is practice,
      not first contact, and one slip is not a gap. */
  function weakFacts(limit){
    const out = [];
    for (const k in mem.facts){
      const f = mem.facts[k];
      if (!f || !f[0] || !f[4]) continue;        // never asked, or nowhere to ask it again
      const missed = f[0] - f[1];
      const recent = (mem.factRecent && mem.factRecent[k]) || '';
      const recentRight = recent.split('').filter(x => x === '1').length;
      const recovered = recent.length >= 6 && recentRight / recent.length >= .85;
      // right every time but still being counted out: the case a percentage cannot show
      const slow = f[5] >= FLUENT_SLOW_MS;
      if ((missed < 1 || recovered) && !slow) continue;
      if (!slow && f[1] / f[0] >= 0.8 && missed < 2) continue;   // one slip on a solid fact
      out.push({ key: k, label: f[3] || k, at: f[4], due: dueOf(k), missed, ms: f[5] || null, slow });
    }
    out.sort((a, b) => b.due - a.due || b.missed - a.missed);
    return limit ? out.slice(0, limit) : out;
  }

  return {
    get data(){ return mem; },
    /** false when this device/origin cannot persist — the parent page says so. */
    get persists(){ return avail && ok; },
    /** why not: 'ok' | 'unavailable' (no storage for this page) | 'failed' (a write did not land) */
    get storage(){ return !avail ? 'unavailable' : ok ? 'ok' : 'failed'; },
    /** the record on this device would not parse; its bytes were kept aside */
    get unreadable(){ return unreadable; },
    get origin(){ return location.origin === 'null' ? 'file://' : location.origin; },
    exportText, importText,
    todayKey,
    flush: writeNow,
    stars: (g, l) => mem.stars[key(g, l)] || 0,
    gameStars(g, levels){
      let s = 0; for (let i = 0; i < levels; i++) s += mem.stars[key(g, i)] || 0; return s;
    },
    totalStars(){ let s = 0; for (const k in mem.stars) s += mem.stars[k]; return s; },
    plays: (g, l) => mem.plays[key(g, l)] || 0,
    /* A pass opens the next level. Three honest attempts also open it: a five-year-old
       must never end up staring at a padlock they cannot move, and the parent page
       shows the low score either way. */
    levelUnlocked(g, l){
      if (l === 0) return true;
      const k = key(g, l - 1);
      return (mem.stars[k] || 0) >= 1 || (mem.plays[k] || 0) >= 3;
    },

    /** One question's first-try result, attributed to the level it came from.
        Recorded per question rather than per level so that a question met inside
        きょうの れんしゅう counts towards that level's recent form too. */
    noteOutcome(g, l, ok){
      const k = key(g, l);
      mem.recent[k] = ((mem.recent[k] || '') + (ok ? '1' : '0')).slice(-30);
      mem.last[k] = dayNo();
      save();
    },

    recordLevel(g, l, stars, right, total){
      const k = key(g, l);
      mem.stars[k] = Math.max(mem.stars[k] || 0, stars);
      mem.plays[k] = (mem.plays[k] || 0) + 1;
      mem.last[k]  = dayNo();
      mem.seen[g]  = (mem.seen[g] || 0) + total;
      const ft = mem.firstTry[g] || [0, 0];
      mem.firstTry[g] = [ft[0] + right, ft[1] + total];
      const t = todayKey();
      mem.daily[t] = (mem.daily[t] || 0) + total;
      save();
    },
    recordPractice(right, total){
      const t = todayKey();
      mem.daily[t] = (mem.daily[t] || 0) + total;
      const p = mem.practice || (mem.practice = [0, 0]);
      p[0] += right; p[1] += total;
      save();
    },
    /* 集中練習 counts towards today's total, but not towards the「きょうの れんしゅう」
       accuracy the parent page reports — that number names one specific set. */
    recordFocus(right, total){
      const t = todayKey();
      mem.daily[t] = (mem.daily[t] || 0) + total;
      save();
    },
    recordDiagnostic(outcomes, recommended){
      mem.diagnostic = {
        completedDay: dayNo(),
        outcomes: (outcomes || []).map(x => ({
          gameId: x.gameId, levelIndex: x.levelIndex || 0, clean: !!x.clean
        })),
        recommended: recommended || null
      };
      save();
    },
    recordMission(mission){
      if (!mission || !mission.day) return;
      mem.missions[mission.day] = Object.assign({}, mission, { done: false, reviewed: false });
      save();
    },
    completeMission(day){
      const m = mem.missions[day];
      if (!m) return false;
      m.done = true;
      m.doneDay = dayNo();
      save();
      return true;
    },
    reviewMission(day){
      const m = mem.missions[day];
      if (!m) return false;
      m.reviewed = true;
      save();
      return true;
    },
    mission: day => mem.missions[day] || null,
    practiceAccuracy(){
      const p = mem.practice;
      return (p && p[1]) ? p[0] / p[1] : null;
    },
    todayCount(){ return mem.daily[todayKey()] || 0; },
    /** Questions answered today that no grade counts — the lesson and check questions.
        They took the child's time, so「きょうは ここまで」has to count them too. */
    countToday(n){
      if (!(n > 0)) return;
      const t = todayKey();
      mem.daily[t] = (mem.daily[t] || 0) + n;
      save();
    },
    /** calendar days this app has actually been used on — how much there is to lose */
    usedDays(){ return Object.keys(mem.daily || {}).length; },
    /** calendar days since the app was first opened on this device */
    daysSinceStart(){
      return Math.max(0, dayNo() - dayOf(mem.createdAt || Date.now()));
    },
    /** 1 April of the year this child starts school — set, or guessed from day one.
        School starts in April, so a first run in April or later belongs to next April. */
    schoolDate(){
      if (mem.schoolYear) return new Date(mem.schoolYear, 3, 1);
      const d = new Date(mem.createdAt || Date.now());
      return new Date(d.getFullYear() + (d.getMonth() >= 3 ? 1 : 0), 3, 1);
    },
    setSchoolYear(y){ mem.schoolYear = y || 0; save(); },
    /** calendar days from today to 入学 (negative once it has passed). Days, not
        rounded milliseconds: rounded, 31 March said「入学しています」from 1 p.m. */
    daysToSchool(){
      return dayOf(this.schoolDate().getTime()) - dayNo();
    },
    noteBackup(){ mem.backupAt = dayNo(); writeNow(); },
    lastBackupDays(){ return mem.backupAt ? Math.max(0, dayNo() - mem.backupAt) : null; },
    /** { never, days } when it is time to ask again, otherwise null.
        Never on the first days: there is nothing yet worth the interruption. */
    backupDue(){
      if (this.usedDays() < 10) return null;
      const d = this.lastBackupDays();
      if (d == null) return { never: true, days: null };
      return d >= 30 ? { never: false, days: d } : null;
    },
    streak(){
      let n = 0; const d = new Date();
      for (;;){
        const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        if ((mem.daily[k] || 0) > 0) n++; else break;
        d.setDate(d.getDate() - 1);
        if (n > 400) break;
      }
      return n;
    },
    accuracy(g){
      const ft = mem.firstTry[g];
      if (!ft || !ft[1]) return null;
      return ft[0] / ft[1];
    },

    /* ---- item-level memory ---- */
    noteFact(k, firstTryOk, label, from, ms, miss){
      if (!k) return;
      const f = mem.facts[k] || (mem.facts[k] = [0, 0, 0]);
      f[0]++;
      if (firstTryOk) f[1]++;
      f[2] = dayNo();
      if (label) f[3] = label;      // so the parent page can say「3と7」, not「ten:3」
      /* Where this fact can be asked again. Without it the app can name a weak fact
         and still have no way to bring it back: the item key says which game, never
         which level. */
      if (from) f[4] = from;
      const recent = mem.factRecent || (mem.factRecent = {});
      recent[k] = ((recent[k] || '') + (firstTryOk ? '1' : '0')).slice(-12);
      /* How long the answer took, kept only where speed is the goal and only for
         clean answers — a wrong answer times a guess. A single interrupted question
         (the iPad put down mid-problem) is clamped rather than dropped, so it cannot
         decide the average on its own. An answer given while the question was still
         being read out arrives as 0 — the fastest answer there is, not a missing one:
         dropping it left the average made of the slow answers alone, and a fact the
         child knew cold was reported as「数えている」and sent to とっくん. */
      if (ms != null && ms >= 0){
        const capped = Math.max(1, Math.min(ms, 20000));
        f[5] = f[5] ? Math.round(f[5] * 0.65 + capped * 0.35) : capped;
      }
      /* What kind of wrong it was, from the first mistake on this question. A
         percentage says how often; this says what to do about it. */
      if (miss && MISS_KINDS[miss]){
        const m = f[6] || (f[6] = {});
        m[miss] = (m[miss] || 0) + 1;
      }
      save();
    },
    fact: k => mem.facts[k] || null,
    /** The mistake this child keeps making on this fact: { kind, n, of } or null.
        Only the diagnostic kinds, only when it has happened more than once, and
        only when it is actually the dominant reading — one stray tap is not a
        pattern, and naming the wrong pattern is worse than naming none. */
    factMiss(k){
      const f = mem.facts[k];
      const m = f && f[6];
      if (!m) return null;
      let best = null, total = 0;
      for (const t in m){
        total += m[t];
        if (MISS_DIAGNOSTIC.indexOf(t) < 0) continue;
        if (!best || m[t] > best.n) best = { kind: t, n: m[t] };
      }
      if (!best || best.n < 2 || best.n * 2 < total) return null;
      best.of = total;
      return best;
    },
    factOrigin(k){ const f = mem.facts[k]; return f && f[4] || null; },
    factSpeed(k){ const f = mem.facts[k]; return f && f[5] || null; },
    /** Typical time to answer this game's facts, in ms — null until something has
        been timed. Median across facts, so one bad question does not move it. */
    gameSpeed(g){
      const xs = [];
      for (const k in mem.facts){
        if (k.indexOf(g + ':') !== 0) continue;
        const f = mem.facts[k];
        if (f && f[5]) xs.push(f[5]);
      }
      if (!xs.length) return null;
      xs.sort((a, b) => a - b);
      return xs[Math.floor(xs.length / 2)];
    },
    /** Cleared with every answer right first time *and* without counting. */
    recordSwift(g, l){ mem.swift[key(g, l)] = 1; save(); },
    introduced: (g, l) => !!(mem.intro && mem.intro[key(g, l)]),
    markIntroduced(g, l){ (mem.intro || (mem.intro = {}))[key(g, l)] = 1; save(); },
    completeOrientation(){ mem.orientation = true; save(); },

    /* ---- provisional clears ---- */
    dayNumber: () => dayNo(),
    /** on the shelf, but waiting for another day to confirm it */
    addPending(k){
      if (mem.stickers.indexOf(k) >= 0) return false;
      mem.stickers.push(k);
      (mem.pending || (mem.pending = {}))[k] = [dayNo(), 0, 0];
      save();
      return true;
    },
    isPending: k => !!(mem.pending && mem.pending[k]),
    hasConfirmed: k => mem.stickers.indexOf(k) >= 0 && !(mem.pending && mem.pending[k]),
    pendingFrom: k => (mem.pending && mem.pending[k]) ? mem.pending[k][0] : null,
    checkFailed: k => !!(mem.pending && mem.pending[k] && mem.pending[k][2] > 0),
    /** waiting clears from an earlier day that have not been checked today, oldest first */
    pendingDue(){
      const t = dayNo(), p = mem.pending || {};
      return Object.keys(p).filter(k => p[k][0] < t && p[k][1] < t).sort((a, b) => p[a][0] - p[b][0]);
    },
    confirmSticker(k){
      if (!mem.pending || !mem.pending[k]) return false;
      delete mem.pending[k];
      save();
      return true;
    },
    failCheck(k){
      const p = mem.pending && mem.pending[k];
      if (!p) return;
      p[1] = dayNo(); p[2]++;
      save();
    },
    isSwift: (g, l) => !!mem.swift[key(g, l)],
    factDue: dueOf,
    weakFacts,

    /* ---- recent (windowed) performance ----
       A lifetime average cannot show that a child recovered, and it cannot show
       that a child has just started slipping. Both are what a parent needs. */
    recentAccuracy(g, l){
      const s = mem.recent[key(g, l)];
      if (!s) return null;
      let r = 0;
      for (let i = 0; i < s.length; i++) if (s[i] === '1') r++;
      return s.length ? r / s.length : null;
    },
    /** how many outcomes the recent window actually holds — a percentage over one
        question must never be presented as a judgement about a child */
    recentCount(g, l){ return (mem.recent[key(g, l)] || '').length; },
    gameRecentAccuracy(g, levels){
      let r = 0, n = 0;
      for (let i = 0; i < levels; i++){
        const s = mem.recent[key(g, i)] || '';
        for (let j = 0; j < s.length; j++){ n++; if (s[j] === '1') r++; }
      }
      return n ? r / n : null;
    },
    /** days since this level was last played; large when never played */
    daysSince(g, l){
      const d = mem.last[key(g, l)];
      return d ? Math.max(0, dayNo() - d) : 99;
    },
    addSticker(k){
      if (mem.stickers.indexOf(k) < 0){ mem.stickers.push(k); save(); return true; }
      return false;
    },
    hasSticker: k => mem.stickers.indexOf(k) >= 0,
    setPref(k, v){ mem[k] = v; save(); },
    /** What to call this child. Kept short: it is spoken and it goes in a heading. */
    get name(){ return mem.name || ''; },
    setName(v){ mem.name = String(v || '').trim().slice(0, 12); save(); },
    reset(){ mem = blank(); save(); }
  };
})();

/* ===========================================================
   03 — artwork: mascot, stars, shapes, clock, numeral strokes
   =========================================================== */
'use strict';

/* ---------- star ---------- */
const STAR_D = 'M50 6 L62 36 L95 39 L70 61 L78 94 L50 76 L22 94 L30 61 L5 39 L38 36 Z';
function starSVG(on){
  return svg('svg', { viewBox: '0 0 100 100', 'aria-hidden': 'true', class: on ? 'on' : '' },
    svg('path', { d: STAR_D, fill: on ? 'var(--star)' : 'var(--card-edge)',
                  stroke: on ? 'var(--star-edge)' : 'transparent',
                  'stroke-width': 5, 'stroke-linejoin': 'round' }));
}

/* ---------- mascot: かずぴょん ---------- */
const FACES = {
  idle:  { eye: 'open',  mouth: 'M42 66 Q50 73 58 66' },
  happy: { eye: 'arc',   mouth: 'M38 62 Q50 78 62 62 Z' },
  cheer: { eye: 'arc',   mouth: 'M36 60 Q50 82 64 60 Z' },
  think: { eye: 'open',  mouth: 'M43 69 Q50 65 57 69' },
  soft:  { eye: 'open',  mouth: 'M43 70 Q50 64 57 70' }
};
function mascotSVG(mood, cls){
  const f = FACES[mood] || FACES.idle;
  const eye = (cx) => f.eye === 'arc'
    ? svg('path', { d: `M${cx - 7} 52 Q${cx} 44 ${cx + 7} 52`, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 4.5, 'stroke-linecap': 'round' })
    : svg('g', null,
        svg('circle', { cx, cy: 51, r: 6.4, fill: 'var(--ink)' }),
        svg('circle', { cx: cx + 2.2, cy: 48.6, r: 2.1, fill: '#fff' }));
  const ear = (x, rot) => svg('g', { transform: `rotate(${rot} ${x} 30)` },
    svg('rect', { x: x - 7, y: -2, width: 14, height: 36, rx: 7, fill: 'var(--c-yellow)', stroke: 'var(--ink)', 'stroke-width': 3.4 }),
    svg('rect', { x: x - 3.4, y: 4, width: 6.8, height: 24, rx: 3.4, fill: 'var(--c-pink)' }));
  return svg('svg', { viewBox: '0 0 100 100', class: 'mascot' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true' },
    ear(37, -12), ear(63, 12),
    svg('circle', { cx: 50, cy: 62, r: 31, fill: 'var(--c-yellow)', stroke: 'var(--ink)', 'stroke-width': 3.6 }),
    svg('ellipse', { cx: 33, cy: 68, rx: 6.4, ry: 4.2, fill: 'var(--c-pink)', opacity: .85 }),
    svg('ellipse', { cx: 67, cy: 68, rx: 6.4, ry: 4.2, fill: 'var(--c-pink)', opacity: .85 }),
    eye(38), eye(62),
    svg('path', { d: f.mouth, fill: f.mouth.endsWith('Z') ? 'var(--c-red)' : 'none',
                  stroke: 'var(--ink)', 'stroke-width': 3.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
}

/* ---------- arrows ---------- */
function arrowSVG(dir){
  const flip = dir === 'left' ? 'scale(-1,1) translate(-100,0)' : '';
  return svg('svg', { viewBox: '0 0 100 50', 'aria-hidden': 'true' },
    svg('g', { transform: flip },
      svg('path', { d: 'M4 25 H72 M56 8 L78 25 L56 42', fill: 'none', stroke: 'currentColor',
                    'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' })));
}

/* ---------- geometric shapes ---------- */
const SHAPES = {
  circle:    { ja: 'まる',     kind: 'circle',   pts: null },
  square:    { ja: 'しかく',   kind: 'square',   pts: [[10,10],[90,10],[90,90],[10,90]] },
  rect:      { ja: 'しかく',   kind: 'square',   pts: [[6,24],[94,24],[94,76],[6,76]] },
  tri:       { ja: 'さんかく', kind: 'triangle', pts: [[50,8],[92,88],[8,88]] },
  tri2:      { ja: 'さんかく', kind: 'triangle', pts: [[12,10],[92,52],[16,90]] },
  rtri:      { ja: 'さんかく', kind: 'triangle', pts: [[12,12],[12,88],[88,88]] },
  diamond:   { ja: 'ひしがた', kind: 'diamond',  pts: [[50,6],[94,50],[50,94],[6,50]] },
  oval:      { ja: 'まる',     kind: 'circle',   pts: null, rx: 46, ry: 30 },
  pentagon:  { ja: 'ごかっけい', kind: 'poly',   pts: [[50,6],[94,38],[77,90],[23,90],[6,38]] },
  hexagon:   { ja: 'ろっかっけい', kind: 'poly', pts: [[28,10],[72,10],[94,50],[72,90],[28,90],[6,50]] },
  trapezoid: { ja: 'だいけい', kind: 'poly',     pts: [[26,16],[74,16],[94,84],[6,84]] },
  star:      { ja: 'ほし',     kind: 'star',     pts: null },
  heart:     { ja: 'ハート',   kind: 'heart',    pts: null },
  semi:      { ja: 'はんえん', kind: 'semi',     pts: null }
};

function shapeSVG(name, color, rot, size){
  const s = SHAPES[name] || SHAPES.circle;
  const fill = color || 'var(--c-blue)';
  const stroke = 'color-mix(in srgb, ' + fill + ' 62%, var(--ink) 38%)';
  const common = { fill, stroke, 'stroke-width': 4, 'stroke-linejoin': 'round' };
  let node;
  if (name === 'circle')       node = svg('circle', Object.assign({ cx: 50, cy: 50, r: 42 }, common));
  else if (name === 'oval')    node = svg('ellipse', Object.assign({ cx: 50, cy: 50, rx: s.rx, ry: s.ry }, common));
  else if (name === 'star')    node = svg('path', Object.assign({ d: STAR_D }, common));
  else if (name === 'heart')   node = svg('path', Object.assign({ d: 'M50 90 C10 62 8 34 26 22 C38 14 50 22 50 34 C50 22 62 14 74 22 C92 34 90 62 50 90 Z' }, common));
  else if (name === 'semi')    node = svg('path', Object.assign({ d: 'M6 72 A44 44 0 0 1 94 72 Z' }, common));
  else node = svg('polygon', Object.assign({ points: s.pts.map(p => p.join(',')).join(' ') }, common));
  return svg('svg', { viewBox: '0 0 100 100', 'aria-hidden': 'true',
                      width: size || null, height: size || null,
                      style: rot ? `transform:rotate(${rot}deg)` : null }, node);
}

/* ---------- analogue clock ---------- */
function clockSVG(hour, minute, opts){
  const o = opts || {};
  const cx = 50, cy = 50, R = 45;
  const g = [
    svg('circle', { cx, cy, r: R, fill: 'var(--card)', stroke: 'var(--ink)', 'stroke-width': 3.4 }),
    svg('circle', { cx, cy, r: R - 4, fill: 'none', stroke: 'var(--card-edge)', 'stroke-width': 1.2 })
  ];
  for (let i = 0; i < 60; i++){
    const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
    const big = i % 5 === 0;
    const r1 = R - (big ? 8 : 4), r2 = R - 2.5;
    g.push(svg('line', {
      x1: cx + Math.cos(a) * r1, y1: cy + Math.sin(a) * r1,
      x2: cx + Math.cos(a) * r2, y2: cy + Math.sin(a) * r2,
      stroke: big ? 'var(--ink)' : 'var(--ink-faint)', 'stroke-width': big ? 2.6 : 1.1, 'stroke-linecap': 'round'
    }));
  }
  if (o.numerals !== false){
    for (let h = 1; h <= 12; h++){
      const a = (h / 12) * Math.PI * 2 - Math.PI / 2;
      g.push(svg('text', {
        x: cx + Math.cos(a) * (R - 15), y: cy + Math.sin(a) * (R - 15) + 4.4,
        'text-anchor': 'middle', fill: 'var(--ink)', 'font-size': 12, 'font-weight': 800,
        'font-family': 'var(--fs-num)'
      }, String(h)));
    }
  }
  const ma = (minute / 60) * Math.PI * 2 - Math.PI / 2;
  const ha = (((hour % 12) + minute / 60) / 12) * Math.PI * 2 - Math.PI / 2;
  g.push(svg('line', { x1: cx, y1: cy, x2: cx + Math.cos(ha) * 21, y2: cy + Math.sin(ha) * 21,
    stroke: 'var(--c-red)', 'stroke-width': 6.2, 'stroke-linecap': 'round', class: 'hand-h' }));
  g.push(svg('line', { x1: cx, y1: cy, x2: cx + Math.cos(ma) * 33, y2: cy + Math.sin(ma) * 33,
    stroke: 'var(--c-blue)', 'stroke-width': 4, 'stroke-linecap': 'round', class: 'hand-m' }));
  g.push(svg('circle', { cx, cy, r: 3.6, fill: 'var(--ink)' }));
  return svg('svg', { viewBox: '0 0 100 100', class: 'clock' + (o.cls ? ' ' + o.cls : ''), 'aria-hidden': 'true' }, g);
}

/* ---------- Catmull-Rom smoothing (used by numeral strokes) ---------- */
function smooth(ctrl, per){
  if (ctrl.length < 2) return ctrl.slice();
  const p = [ctrl[0]].concat(ctrl, [ctrl[ctrl.length - 1]]);
  const out = [], n = per || 14;
  for (let i = 1; i < p.length - 2; i++){
    const [p0, p1, p2, p3] = [p[i - 1], p[i], p[i + 1], p[i + 2]];
    for (let t = 0; t < n; t++){
      const s = t / n, s2 = s * s, s3 = s2 * s;
      out.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * s + (2*p0[0] - 5*p1[0] + 4*p2[0] - p3[0]) * s2 + (-p0[0] + 3*p1[0] - 3*p2[0] + p3[0]) * s3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * s + (2*p0[1] - 5*p1[1] + 4*p2[1] - p3[1]) * s2 + (-p0[1] + 3*p1[1] - 3*p2[1] + p3[1]) * s3)
      ]);
    }
  }
  out.push(ctrl[ctrl.length - 1]);
  return out;
}
const toPath = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');

   Forms and stroke order follow Japanese elementary handwriting practice. */

/* ===========================================================
   04 — screens, feedback effects, drag helper
   =========================================================== */
'use strict';

const UI = (() => {
  const screens = {};
  let stage = null, fx = null, current = null;

  function init(){
    stage = $('#stage');
    fx    = $('#fx');
  }
  function register(name, node){
    node.classList.add('screen');
    node.hidden = true;
    screens[name] = node;
    stage.append(node);
    return node;
  }
  function show(name, opts){
    const o = opts || {};
    Sound.hush();
    // the coaching hand belongs to the question it was pointing at, never to the next screen
    if (typeof Coach !== 'undefined') Coach.hide();
    for (const k in screens) screens[k].hidden = true;
    const n = screens[name];
    if (!n) return null;
    n.hidden = false;
    n.classList.remove('enter');
    void n.offsetWidth;
    n.classList.add('enter');
    current = name;
    n.scrollTop = 0;
    const sc = $('.worlds, .sheet, .levels, .book', n);
    if (sc) sc.scrollTop = o.keepScroll ? sc.scrollTop : 0;
    /* A visual transition is otherwise silent to screen readers and leaves
       keyboard/switch focus on a control that just became hidden. */
    if (o.focus !== false){
      const heading = $('h1, h2, [role="heading"]', n);
      if (heading){
        if (!heading.hasAttribute('tabindex')) heading.setAttribute('tabindex', '-1');
        requestAnimationFrame(() => {
          if (current === name && !n.hidden) heading.focus({ preventScroll: true });
        });
      }
    }
    return n;
  }
  const currentName = () => current;

  /* ---------- feedback ---------- */
  const CRAYONS = ['--c-red','--c-orange','--c-yellow','--c-green','--c-blue','--c-purple','--c-pink'];
  const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function confetti(count, originX, originY){
    if (reduced()) return;
    const n = count || 26;
    const w = innerWidth, h = innerHeight;
    const ox = originX == null ? w / 2 : originX;
    const oy = originY == null ? h * 0.45 : originY;
    for (let i = 0; i < n; i++){
      const p = el('div.confetti');
      p.style.background = `var(${CRAYONS[i % CRAYONS.length]})`;
      p.style.left = ox + 'px';
      p.style.top  = oy + 'px';
      fx.append(p);
      const a  = (-Math.PI / 2) + (Math.random() - .5) * 2.1;
      const v  = 260 + Math.random() * 420;
      const dx = Math.cos(a) * v, dy = Math.sin(a) * v;
      const dur = 900 + Math.random() * 700;
      p.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx * .6}px, ${dy * .6 + 90}px) rotate(${180 + Math.random()*360}deg)`, opacity: 1, offset: .55 },
        { transform: `translate(${dx}px, ${dy + h * .75}px) rotate(${540 + Math.random()*360}deg)`, opacity: 0 }
      ], { duration: dur, easing: 'cubic-bezier(.2,.6,.4,1)' }).finished.then(() => p.remove()).catch(() => p.remove());
    }
  }

  function bigMark(txt, color){
    const n = el('div.bigmark', { text: txt, style: { color: color || 'var(--good)' } });
    document.body.append(n);
    setTimeout(() => n.remove(), 760);
  }

  function stars(count, big){
    const wrap = el(big ? 'div.bigstars' : 'div.st');
    for (let i = 0; i < 3; i++){
      const s = starSVG(i < count);
      s.classList.add('s');
      if (i < count) s.classList.add('on');
      s.style.animationDelay = (i * 0.22) + 's';
      wrap.append(s);
    }
    return wrap;
  }

  /* ---------- fit the question to the space it was given ----------
     The whole layout is expressed in --u, and --u came from the viewport's short
     side, capped at 17px. So a question was always the same small island in the
     middle of the iPad no matter how much room there was: the ten-frame in
     「10の おともだち」 covered 3.5% of a 1024x768 screen and 4.5% of a 12.9-inch
     one — a bigger iPad only bought more margin, and the tracing box, the thing a
     finger most needs to be large, sat at 345px on a 1024px-wide screen.

     The playfield's box does not depend on its own contents (its siblings are
     flex:0 0 auto and it has min-height:0), so we can grow --u inside it and
     stop at the largest value where nothing sticks out. */
  /* Grow to fill the room, but also shrink a little when a question is naturally
     too wide (a row of eight animals on a portrait iPad): a row the child has to
     count is worthless once it scrolls out of sight. */
  /* 2.4 was leaving room on the table. かぞえよう L1 on a portrait iPad puts five
     objects on one line: the row is capped by how wide the field is, the field is
     751px tall, and the objects used 159px of it — 79% of the box empty while the
     things a finger has to land on stayed at the cap. The search only ever grows to
     where something would stick out, so a higher ceiling costs nothing on the
     questions that were already filling their box. */
  const FIT_MAX = 2.9, FIT_MIN = 0.72;

  function fitsInside(field, kids){
    const b = field.getBoundingClientRect();
    const slack = 2;
    for (let i = 0; i < kids.length; i++){
      const n = kids[i];
      const r = n.getBoundingClientRect();
      if (!r.width && !r.height) continue;              // hidden / zero-sized
      if (r.left < b.left - slack || r.right > b.right + slack
       || r.top  < b.top  - slack || r.bottom > b.bottom + slack) return false;
      /* Staying inside the playfield is not enough: なんばんめ's row of animals
         scrolls inside its own container, so it can sit within the field and still
         hide half the animals the child is being asked to count. Only real scroll
         containers count — plenty of boxes report harmless overflow from borders,
         shadows and emoji glyphs. */
      if (n.scrollWidth > n.clientWidth + 4 || n.scrollHeight > n.clientHeight + 4){
        const ov = getComputedStyle(n);
        if (ov.overflowX === 'auto' || ov.overflowX === 'scroll'
         || ov.overflowY === 'auto' || ov.overflowY === 'scroll') return false;
      }
    }
    return true;
  }

  function fitPlayfield(field){
    if (!field || !field.isConnected) return;
    field.style.removeProperty('--u');
    const box = field.getBoundingClientRect();
    if (box.width < 60 || box.height < 60) return;      // off-screen or mid-transition
    const base = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 12;
    // the search only changes sizes, never the tree, so collect the nodes once
    const kids = field.querySelectorAll('*');
    const at = m => {
      field.style.setProperty('--u', (base * m).toFixed(2) + 'px');
      return fitsInside(field, kids);
    };
    let lo = FIT_MIN, hi = FIT_MAX;
    for (let i = 0; i < 7; i++){                        // ~1.5% precision over a wider range
      const m = (lo + hi) / 2;
      if (at(m)) lo = m; else hi = m;
    }
    at(lo);
  }

  /** Re-fit whenever the question's contents change — story scenes, hints and
      multi-blank questions all add nodes after the first draw. */
  function watchFit(field){
    let queued = false;
    const run = () => { queued = false; fitPlayfield(field); };
    const ping = () => {
      if (queued) return;
      queued = true;
      (window.requestAnimationFrame || setTimeout)(run, 0);
    };
    if (window.MutationObserver){
      new MutationObserver(ping).observe(field, { childList: true, subtree: true, characterData: true });
    }
    /* The room changes size too, not only its contents: answer buttons that arrive
       after the question (かぞえよう asks only once everything is counted) take
       height from the field, and a board still sized for the taller room spilled
       up over the question and the hint. Fitting only resizes what is inside, so
       the field's own box settles and this does not loop. */
    if (window.ResizeObserver){
      let w = 0, h = 0;
      new ResizeObserver(entries => {
        const r = entries[entries.length - 1].contentRect;
        if (Math.abs(r.width - w) < 1 && Math.abs(r.height - h) < 1) return;
        w = r.width; h = r.height;
        ping();
      }).observe(field);
    }
    window.addEventListener('resize', ping);
    return ping;
  }

  /* ---------- drag & drop (pointer based, with tap fallback) ---------- */
  function makeDragDrop(opts){
    // opts: { items(), targets(), onDrop(item, target), tapSelect: bool }
    let selected = null, dragging = null, ghost = null, sx = 0, sy = 0, moved = false, overEl = null;
    let activeId = null;
    // a five-year-old's "tap" slides a few millimetres; 8px turned taps into drags
    const THRESH = 18;

    function clearSel(){
      if (selected) selected.classList.remove('sel');
      selected = null;
    }
    function setOver(t){
      if (overEl === t) return;
      if (overEl) overEl.classList.remove('over');
      overEl = t;
      if (overEl) overEl.classList.add('over');
    }
    function targetAt(x, y){
      const e = document.elementFromPoint(x, y);
      return e ? e.closest('[data-drop]') : null;
    }
    function endDrag(x, y){
      if (ghost){ ghost.remove(); ghost = null; }
      if (dragging) dragging.classList.remove('dragging');
      const t = (x != null) ? targetAt(x, y) : null;
      setOver(null);
      const it = dragging; dragging = null;
      if (it && moved){
        // where the finger let go, so a target can be generous about a near miss
        if (t) opts.onDrop(it, t, { x, y });
        return true;
      }
      return false;
    }

    function onDown(e){
      const it = e.currentTarget;
      if (e.button != null && e.button > 0) return;
      if (dragging) return;                 // a second finger must not hijack the first
      activeId = e.pointerId;
      dragging = it; moved = false;
      sx = e.clientX; sy = e.clientY;
      window.addEventListener('pointermove', onMove, { passive: false });
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    }
    function onMove(e){
      if (!dragging || e.pointerId !== activeId) return;
      if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < THRESH) return;
      e.preventDefault();
      if (!moved){
        moved = true;
        clearSel();
        dragging.classList.add('dragging');
        // a game may hand back its own node — the shape puzzle draws the piece at
        // the size of the hole it is heading for, so the child can see it fit
        const custom = opts.ghost ? opts.ghost(dragging) : null;
        ghost = custom || dragging.cloneNode(true);
        ghost.id = 'ghost';
        ghost.classList.remove('dragging', 'sel');
        if (!custom){
          const r = dragging.getBoundingClientRect();
          ghost.style.width = r.width + 'px';
          ghost.style.height = r.height + 'px';
        }
        document.body.append(ghost);
      }
      ghost.style.left = e.clientX + 'px';
      ghost.style.top  = e.clientY + 'px';
      setOver(targetAt(e.clientX, e.clientY));
    }
    function onUp(e){
      if (e.pointerId !== activeId) return;
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      activeId = null;
      const it = dragging;
      const dropped = endDrag(moved ? e.clientX : null, moved ? e.clientY : null);
      if (!it) return;
      if (!dropped){
        // a tap, or a drag that landed on nothing — either way, leave it selected
        // so the child can just tap the bin instead of dragging again
        if (!moved && selected === it) clearSel();
        else { clearSel(); selected = it; it.classList.add('sel'); Sound.sfx.tap(); }
      }
    }
    function bindItem(it){ it.addEventListener('pointerdown', onDown); }
    function bindTarget(t){
      t.setAttribute('data-drop', '');
      t.addEventListener('click', e => {
        if (!selected) return;
        // targets may nest (a puzzle hole inside the picture field): the inner one
        // wins, or one tap would be counted twice
        e.stopPropagation();
        const s = selected;
        opts.onDrop(s, t, { x: e.clientX, y: e.clientY });
        // a piece that has been used up must not stay in the child's hand: the next
        // tap on the board would otherwise be scored as putting it in the wrong place
        if (s.classList.contains('gone') || s.classList.contains('used')) clearSel();
      });
    }
    function select(it){ clearSel(); selected = it; it.classList.add('sel'); }
    return { bindItem, bindTarget, clearSel, select, get selected(){ return selected; } };
  }

  return { init, register, show, currentName, confetti, bigMark, stars, makeDragDrop, screens,
           fitPlayfield, watchFit };
})();

const STICKER_POOL = ['🐰','🐻','🐼','🦊','🐯','🦁','🐨','🐸','🐵','🐧','🐤','🦉','🦄','🐢','🐬','🐳','🦋','🐝','🐞','🦕','🦖','🐙','🦀','🐡','🐘','🦒','🦓','🦔','🐿','🦥','🐠','🐟','🦈','🐌','🐛','🕊','🦩','🦜','🐴','🐑','🌻','🌸','🌈','🍎','🍓','🍇','🍑','🍉','🍌','🥕','🌽','🍄','🍒','🥝','🍍','🥥','🌷','🌼','🌺','🍀','🍰','🧁','🍩','🎂','🍬','🍭','🍦','🍪','🍫','🥐','🚀','🚂','⛵️','🎈','🎁','🏆','👑','💎','🔔','🎨','🎺','🪁','🧸','🪀','🎏','🎐','🛼','🎠','🎪','🏰','⚽️','🏀','🎾','🥁','🎹','⭐️','🌙','☀️','⛄️','🌟',
/* the 小1 classroom adds 12 levels, and a sticker slot must never reuse an emoji another slot already has */
'🦭','🦦','🦫','🦃','🕊️','🦚','🦢','🐖','🐄','🦌','🐫','🦙','🐊','🦎','🦂','🪰','🍋','🍈','🥭','🫐','🍅','🥦','🌰','🥨','🍿','🍮','🍯','🧃','🎃','🎄','🪗','🪄','🧭','🔭','🎲','🪩','🛴','🚁','🚤','🗿'];
/* Stickers are handed out by slot position, not by hash, so no level shares an
   emoji with another while the pool is large enough. */
let STICKER_INDEX = null;
function stickerSlots(){
  if (STICKER_INDEX) return STICKER_INDEX;
  STICKER_INDEX = {};
  let i = 0;
  Games.list.forEach(g => g.levels.forEach((lv, li) => {
    STICKER_INDEX[g.id + ':' + li] = i++;
    STICKER_INDEX[g.id + ':' + li + ':g'] = i++;
  }));
  return STICKER_INDEX;
}
function stickerFor(key){
  const slots = stickerSlots();
  if (key in slots) return STICKER_POOL[slots[key] % STICKER_POOL.length];
  let h = 0;                                   // daily-streak stickers etc.
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return STICKER_POOL[h % STICKER_POOL.length];
}

/* ===========================================================
   stages — what has to be finished before 小学1年生 opens
   ===========================================================
   The 入学前 half of the app is 48 levels and 96 sticker slots: one sticker for
   clearing a level, a gold one for clearing it with every answer right first time.
   Clearing all 48 — the plain stickers — is the 小1 classroom's entrance
   requirement, so the goal a child is already working towards is the same goal
   that opens the next room: no separate test, no adult judgement.

   The gold stickers are NOT part of the key. Each one needs a run with every
   answer right first time, and needing forty-eight of those put the classroom
   somewhere around the three-hundredth day of use for a child working at the
   pace this app recommends (one level a day) — which is to say, after 1年生 had
   already started, and after the material in the classroom had stopped being
   preparation. They stay on the shelf as something to come back for; they are
   not a door the child has to get through.

   Two things this deliberately does NOT do. It never counts 小1's own stickers
   (that would be circular), and it never *closes* again: a shelf cannot lose a
   sticker, but a future release could add a 入学前 level, and a child who walked
   through the door must not find it locked afterwards. */
const Progress = (() => {
  const stageOf = g => g.stage || 'pre';

  /** every sticker slot belonging to one stage, plain and gold — what the book draws */
  function slots(stage){
    const out = [];
    Games.list.forEach(g => {
      if (stageOf(g) !== stage) return;
      g.levels.forEach((lv, i) => out.push(g.id + ':' + i, g.id + ':' + i + ':g'));
    });
    return out;
  }

  /** the slots the door actually counts: one per level, earned by clearing it */
  function gateSlots(stage){
    const out = [];
    Games.list.forEach(g => {
      if (stageOf(g) !== stage) return;
      g.levels.forEach((lv, i) => out.push(g.id + ':' + i));
    });
    return out;
  }

  function count(stage){
    const all = gateSlots(stage);
    let got = 0;
    // confirmed clears only: a provisional one has not yet been shown on another day
    all.forEach(k => { if (Store.hasConfirmed(k)) got++; });
    return { got, total: all.length };
  }

  /* Each 小1 game has a short, relevant preparation route. Clearing a level
     confirms it; sustained daily retrieval can confirm readiness as well. */
  const G1_PATHS = {
    g1set:   [['count', 0], ['numeral', 0]],
    g1pair:  [['count', 1], ['compare', 1]],
    g1teen:  [['numeral', 2], ['bond', 2], ['ten', 1]],
    g1shiki: [['add', 0], ['sub', 0]]
  };
  function levelReady(id, i){
    if (Store.hasConfirmed(id + ':' + i)) return true;
    return Store.recentCount(id, i) >= 6 && Store.recentAccuracy(id, i) >= .75;
  }
  function g1GameOpen(g){
    if (Store.data.g1Open || Store.data.g1Reached) return true;
    const path = G1_PATHS[g.id] || [];
    return path.length > 0 && path.every(([id, i]) => levelReady(id, i));
  }
  function pathProgress(g){
    const path = G1_PATHS[g.id] || [];
    return { got: path.filter(([id, i]) => levelReady(id, i)).length, total: path.length };
  }
  function unlockHint(g){
    const p = pathProgress(g);
    return p.total ? 'じゅんびの あそびを ' + p.got + '／' + p.total + ' できたら ひらくよ' : 'じゅんびが できたら ひらくよ';
  }

  /** true once every 入学前 level is cleared — or once a parent opened the door by hand */
  function g1Open(){
    if (Store.data.g1Open || Store.data.g1Reached) return true;
    return Games.list.some(g => stageOf(g) === 'g1' && g1GameOpen(g));
  }

  return {
    stageOf,
    slots,
    gateSlots,
    /** { got, total } over the levels the door counts — cleared levels, not stickers */
    preStickers: () => count('pre'),
    levelReady,
    g1GameOpen,
    pathProgress,
    unlockHint,
    /** levels cleared provisionally, waiting for another day */
    pendingCount: stage => gateSlots(stage).filter(k => Store.isPending(k)).length,
    g1Open,
    /** opened by hand from the parent page; never reversible */
    openG1(){ Store.setPref('g1Open', true); }
  };
})();

/** Is this game's half of the app open at all? */
function stageOpen(g){ return Progress.stageOf(g) === 'pre' || Progress.g1GameOpen(g); }
/** The gate every question-drawing surface asks: open stage AND unlocked level. */
function levelOpen(g, i){ return stageOpen(g) && Store.levelUnlocked(g.id, i); }

const Session = (() => {
  let node, titleEl, pipsEl, promptTxt, fieldEl, choicesEl, speakBtn, showBtn, backBtn, moodEl, feedbackEl;
  let refit = () => {};
  let plan = [];          // [{game, level, levelIndex}]
  let idx = 0, mistakes = 0, firstTryRight = 0, wrongThisQ = 0;
  let locked = false, mode = 'level', curGame = null, curLevelIdx = 0;
  let hintBtns = [], hintExtras = [], hintShown = false, lastSpeech = '';
  /* Most questions keep their hint back until a second mistake, so the child
     gets a real second try first. A question whose picture is already hidden
     (ぱっと みて いくつ) has nothing to try with: 「もういちど」 over a covered
     board is an invitation to guess. Those games ask for their hint at 1. */
  let hintAfter = 2, extrasShown = false;
  /* ---------- the help ladder ----------
     One hint used to be the whole of it. After that the screen stopped answering:
     the game's own hint fires once, and the choice-dimming fallback only has
     something to dim when the question was built with `buildChoices` — 28 of the
     60 levels never build one (every keypad, every hand-made answer surface), so
     the third, fourth and fifth mistake there changed nothing at all, down to the
     pixel, with the speech bubble still reading「ヒントを だすね」.

     Now every mistake past the first moves something, and the bottom of the ladder
     is a way out: 「こたえを みる」 appears, and if it is not taken the app takes it
     itself. Reaching the answer that way is recorded as `taught` — it is not a
     first-try success, it does not earn ★, and 「にがて あつめ」 comes back for it.
     Same reasoning as「3回まじめに挑戦すれば次のレベルは開く」: a five-year-old must
     never be left in front of a door they cannot move. */
  const STRONG_AFTER = 2, TEACH_AFTER = 4;   // mistakes past the game's own hint
  let hintStrongFns = [], showFn = null, answerBtn = null, answerText = null, taught = false;
  /* `taught` guards one answer surface and is reset with it; this one is the
     record, and belongs to the whole question. With several blanks, the next blank
     used to wipe it, and a question the app had answered was saved as the child's
     own mistake. */
  let taughtQ = false;
  /* ---------- the coach ----------
     What the game hands over when the child gets stuck. `tool` changes the board
     into something to work with (dots to count, holes to fill, bars lined up);
     `text`/`say` are the words for it, in the bubble and out loud; `walk` returns the
     steps the hand goes through to show the method. The hint used to be a line of
     small text in the playfield that nothing read out, so a child who cannot read
     yet was told「ヒントを だすね」and then shown nothing they could use. */
  let coach = null, hintSpeech = '', walkToken = 0, walked = false;
  /* ---------- meeting a level for the first time ----------
     A new idea used to arrive as a test: the first「なんじはん」a child ever saw was a
     question to get right, and the explanation of「はん」only came as a hint after two
     misses. The first time a level is opened, two questions go in front of it:
       'show'     — the hand goes through the method and answers; input waits
       'together' — the tool is on the board from the start and the child answers
     Neither is recorded or graded: they are the lesson, not the child's work.
     `helped` is the 👀 button — help asked for before a mistake, which is fine and
     also means the answer was not the child's alone. */
  let introOn = true, demo = null, demoRunning = false, demoWalked = null, demoWaits = 0;
  let touched = false, helped = false;
  /* ---------- checking a clear on another day ----------
     Three questions from a provisionally cleared level, asked on a later day, first
     thing: two right first time confirms the sticker. They are not graded as the
     level being played. See `pending` in 02-store.js. */
  const CHECK_N = 3, CHECK_PASS = 2;
  let checkTally = {}, announced = new Set();
  function checkSteps(exceptKey, maxLevels){
    const out = [];
    for (const key of Store.pendingDue()){
      if (out.length >= maxLevels * CHECK_N) break;
      if (key === exceptKey) continue;               // replaying it is the check
      const cut = key.lastIndexOf(':');
      const g = Games.byId[key.slice(0, cut)], li = Number(key.slice(cut + 1));
      if (!g || !g.levels[li] || !levelOpen(g, li) || !Store.introduced(g.id, li)) continue;
      for (let i = 0; i < CHECK_N; i++) out.push({ game: g, level: g.levels[li], levelIndex: li, check: key });
    }
    return out;
  }
  /* What this question is *about*. Every generator names its item, so the app can
     avoid asking the same fact twice in one sitting, steer toward the facts this
     child keeps missing, and tell the parent which ones they are. */
  let curItem = null, curLabel = null;
  /* What the answer was, and what kind of wrong the first mistake was. Right/wrong
     is one bit; it cannot separate 「見えている方を言った」 from 「1つ ずれた」, and those
     are different children. See 06-miss.js. */
  let curAnswer = null, missType = null;
  let focusKeys = [];             // the facts a 集中練習 session is aimed at
  /* ---------- how long the answer took ----------
     けいさんの やま is named for「考えずに言える」— an answer that arrives rather than
     one that is worked out. Right-first-time cannot tell those apart: a child who
     counts eight empty cells for nine seconds and a child who remembers both score a
     clean answer, and only the second makes a carry sum fast. So time the first
     response, and only where speed is actually the goal (`game.fluent`). */
  let askedAt = 0, respondedMs = null, swiftCount = 0;
  /* When the question had finished being read out (0 while it still is). Timing
     from the moment it appeared counted the reading as thinking: with the voice on,
     「3秒以内」was nearly out of reach and「9秒以上 = 数えている」came easily, and that
     bias went straight into the parent page and into what gets practised. An answer
     given before the reading ends counts as instant — the child did not need it. */
  let spokenAt = 0;
  function markResponse(){
    if (respondedMs != null || !askedAt) return;
    const now = performance.now();
    respondedMs = Math.round(Math.max(0, now - Math.max(askedAt, spokenAt || now)));
  }
  /* A keypad key sits beside the keys one either side of it, so a finger that
     lands a key over reads exactly like「1つ多く数えた」. A ±1 miss put right at
     once is taken as the finger, not the counting: the question still is not a
     first-try right, but the parent page is not told the child counts one too many. */
  const PAD_SLIP_MS = 1500;
  let slipAt = 0;
  let usedItems = new Set();      // the shuffle bag for the current session
  let shaky = [];                 // facts missed this session, for the result screen
  let sessionOutcomes = [];       // [{ gameId, levelIndex, clean }] for diagnostic/recommendation
  let quitArmed = false, quitTimer = null;

  /* ---------- timer lifecycle ----------
     Every delayed callback in a question is tied to an epoch. Leaving a question
     (next question, quit, a new level) bumps the epoch and clears the pending
     timers, so a slow animation from the previous question can never write into
     the current one — or, worse, answer it. */
  let epoch = 0;
  const timers = new Map();          // id -> { fn, epoch }, so tests can run them on demand
  function later(fn, ms){
    const mine = epoch;
    const id = setTimeout(() => { timers.delete(id); if (mine === epoch) fn(); }, ms);
    timers.set(id, { fn, epoch: mine });
    return id;
  }
  function killTimers(){
    epoch++;
    timers.forEach((v, id) => clearTimeout(id));
    timers.clear();
    endWalk();
  }

  /** Test seam: run every pending question timer now instead of waiting for it.
      Lets the regression suite check what happens *after* an answer, which is where
      the interaction bugs live. */
  function flushTimers(limit){
    let ran = 0;
    for (let pass = 0; pass < (limit || 12) && timers.size; pass++){
      const due = Array.from(timers.entries());
      due.forEach(([id, t]) => { clearTimeout(id); timers.delete(id); if (t.epoch === epoch){ t.fn(); ran++; } });
    }
    return ran;
  }

  function build(){
    if (node) return node;
    titleEl   = el('h2');
    pipsEl    = el('div.pips');
    promptTxt = el('div.txt', { 'aria-live': 'polite', 'aria-atomic': 'true' });
    fieldEl   = el('div.playfield');
    choicesEl = el('div.choices');
    feedbackEl = el('div.feedback', {
      hidden: true, 'aria-live': 'polite', 'aria-atomic': 'true', role: 'status'
    });
    speakBtn  = el('button.btn.btn-ghost.btn-round', {
      'aria-label': 'もういちど きく', title: 'もういちど きく',
      // the question, and the hint if one is up: a child who missed the hint's words
      // has no other way to hear them again
      onclick(){ Sound.sfx.tap(); if (lastSpeech || hintSpeech) Sound.say(lastSpeech + hintSpeech, { delay: 40 }); }
    }, '🔊');
    /* 👀: the help a child can ask for before getting it wrong. Help that only ever
       arrives after two mistakes teaches that being wrong is how you get help. */
    showBtn = el('button.btn.btn-ghost.btn-round.showbtn', {
      type: 'button', 'aria-label': 'みせて', title: 'みせて',
      onclick(){ Sound.sfx.tap(); askForHelp(); }
    }, '👀');
    moodEl = mascotSVG('idle', 'talk');
    moodEl.style.width = 'calc(var(--u)*4.6)';
    moodEl.style.height = 'calc(var(--u)*4.6)';

    backBtn = el('button.btn.btn-ghost.btn-round.backbtn', {
      'aria-label': 'もどる', onclick: quit
    }, '←');
    node = el('div#play', null,
      el('div.topbar', null,
        backBtn,
        titleEl, pipsEl),
      el('div.prompt', null, moodEl,
        el('div.txtwrap', null, promptTxt, feedbackEl), speakBtn, showBtn),
      fieldEl, choicesEl);
    UI.register('play', node);
    // has a finger been on this question yet — the together-tool must not wipe the child's own work
    const touch = () => { touched = true; };
    node.addEventListener('pointerdown', touch, true);
    node.addEventListener('click', touch, true);
    refit = UI.watchFit(fieldEl);
    return node;
  }

  function setMood(m){
    const fresh = mascotSVG(m, m === 'cheer' ? 'cheer' : 'talk');
    fresh.style.width = 'calc(var(--u)*4.6)';
    fresh.style.height = 'calc(var(--u)*4.6)';
    moodEl.replaceWith(fresh);
    moodEl = fresh;
  }

  /** Wrong answers have to be visible, not just audible: a device with no
      Japanese voice must still show the child that something happened. */
  function showFeedback(kind, text, extra){
    feedbackEl.hidden = false;
    feedbackEl.className = 'feedback ' + kind;
    clear(feedbackEl);
    feedbackEl.append(el('span.mk', { text: kind === 'oops' ? '？' : '💡' }), text);
    if (extra) feedbackEl.append(extra);
    feedbackEl.animate && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)
      && feedbackEl.animate([{ transform: 'translateX(-.4em)' }, { transform: 'none' }], { duration: 260 });
  }
  function clearFeedback(){ feedbackEl.hidden = true; clear(feedbackEl); }

  /** Is there anything on the board the child could count right now? The recall
      levels keep the ten-frame back until the hint, and ぱっと みて hides its dots
      on purpose — telling a child to point at things that are not there is noise. */
  const COUNTABLE = '.obj, .dot, .item, .qi, .pairitem, .cell.tappable';
  function hasCountables(){
    return $$(COUNTABLE, fieldEl).some(n => {
      /* Not opacity: the whole screen fades in, and a tap during that fade is
         still a tap over things to count. ぱっと みて lays a cover over its dots. */
      if (n.closest('.flashboard:not(.open)')) return false;
      if (n.checkVisibility && !n.checkVisibility({ visibilityProperty: true })) return false;
