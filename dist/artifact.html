/* ===========================================================
   11 — WORLD 2「くらべる うみ」 くらべる・なんばんめ・おおきさ
   =========================================================== */
'use strict';

/* ============================================================
   5. どっちが おおい — quantity beats appearance
   ============================================================ */
function platesCompare(api, opts){
  const o = opts || {};
  const thing = pick(THINGS);
  const want = o.least ? 'least' : 'most';
  const counts = o.counts;
  const answer = want === 'most' ? Math.max.apply(null, counts) : Math.min.apply(null, counts);
  const sorted = counts.slice().sort((x, y) => x - y);
  api.item('cmp:' + sorted.join('_') + ':' + want,
    sorted.join(' と ') + ' の ' + (want === 'most' ? 'おおい ほう' : 'すくない ほう'));
  api.setPrompt(want === 'most' ? 'どっちが <b>おおい</b>？' : 'どっちが <b>すくない</b>？',
                want === 'most' ? 'どっちが おおい' : 'どっちが すくない');
  if (counts.length > 2){
    api.setPrompt(want === 'most' ? 'いちばん <b>おおい</b> のは どれ？' : 'いちばん <b>すくない</b> のは どれ？',
                  want === 'most' ? 'いちばん おおいのは どれ' : 'いちばん すくないのは どれ');
  }
  const wrap = el('div.row', { style: { gap: 'calc(var(--u)*1.4)' } });
  const order = shuffle(counts.map((c, i) => ({ c, i })));
  let solved = false;
  order.forEach(({ c, i }) => {
    const size = o.sizes ? o.sizes[i] : null;
    const plate = el('div.plate', {
      style: { minWidth: 'calc(var(--u)*' + (counts.length > 2 ? 11 : 15) + ')' } });
    const g = el('div.row', { style: { maxWidth: 'calc(var(--u)*' + (counts.length > 2 ? 10 : 14) + ')' } });
    for (let k = 0; k < c; k++){
      g.append(el('span.item', { text: thing.e, style: { fontSize: 'calc(var(--u)*' + (size || 2.8) + ')' } }));
    }
    plate.append(g);
    tappable(plate, () => {
      if (api.locked || solved) return;
      if (c === answer){ solved = true; plate.classList.add('correct'); api.correct(); }
      else { plate.classList.add('wrong'); api.later(() => plate.classList.remove('wrong'), 460); api.wrong(plate); }
    });
    wrap.append(plate);
    plate.dataset.count = c;
  });
  api.field.append(wrap);
  api.onHint(() => {
    $$('.plate', wrap).forEach(p => {
      if (!$('.hintline', p)) p.append(el('div.hintline', { text: p.dataset.count + 'こ' }));
    });
  });
}

function compareEasy(api){
  let a = ri(1, 8), b = ri(1, 8);
  for (let g = 0; g < 200 && Math.abs(a - b) < 3; g++){ a = ri(1, 8); b = ri(1, 8); }
  if (Math.abs(a - b) < 3){ a = 2; b = 7; }
  platesCompare(api, { counts: [a, b], least: chance(.3) });
}
function compareClose(api){
  // same count-difference of 1-2, but the smaller group is drawn LARGER on purpose:
  // the child has to count instead of judging by how much space it fills.
  let a = ri(4, 11), b = a + pick([1, 2]) * (chance(.5) ? 1 : -1);
  b = clamp(b, 2, 12);
  if (a === b) b = a + 1;
  const sizes = [2.6, 2.6];
  if (chance(.6)){ const small = a < b ? 0 : 1; sizes[small] = 4.4; sizes[1 - small] = 2.2; }
  platesCompare(api, { counts: [a, b], sizes, least: chance(.35) });
}
function compareThree(api){
  const set = new Set();
  for (let g = 0; g < 300 && set.size < 3; g++) set.add(ri(2, 12));
  [2, 7, 12].forEach(v => { if (set.size < 3) set.add(v); });
  platesCompare(api, { counts: Array.from(set), least: chance(.45) });
}
function compareNumerals(api){
  let a = ri(1, 20), b = ri(1, 20);
  for (let g = 0; g < 200 && a === b; g++) b = ri(1, 20);
  if (a === b) b = a === 20 ? 1 : a + 1;
  const most = chance(.6);
  const ans = most ? Math.max(a, b) : Math.min(a, b);
  api.item('numcmp:' + Math.min(a, b) + '_' + Math.max(a, b) + ':' + (most ? 'g' : 'l'),
    'すうじ ' + a + ' と ' + b + ' の くらべ');
  api.setPrompt(most ? 'かずが <b>おおきい</b> のは どっち？' : 'かずが <b>ちいさい</b> のは どっち？',
                most ? 'かずが おおきいのは どっち' : 'かずが ちいさいのは どっち');
  api.field.append(el('div.hintline', { text: 'すうじで くらべよう' }));
  api.buildChoices(shuffle([a, b]), ans);
}

/* ============================================================
   6. なんばんめ — ordinal position vs cardinal amount
   ============================================================ */
const CRITTERS = ['🐰','🐻','🦊','🐯','🐨','🐸','🐷','🐮','🐼','🐵','🦁','🐔','🐧','🦉'];

function ordinalRow(api, n, dir, target){
  const critters = sample(CRITTERS, n);
  const label = { front: 'まえ', back: 'うしろ', left: 'ひだり', right: 'みぎ' }[dir];
  api.item('ord:' + dir + ':' + target, label + 'から ' + target + 'ばんめ');
  api.setPrompt(`${label}から ${numTag(target)}ばんめ の どうぶつを タップ`,
                `${label}から ${banmeKana(target)}の どうぶつを タップ`);
  const idxWanted = (dir === 'front' || dir === 'left') ? target - 1 : n - target;
  const q = el('div.queue');
  critters.forEach((c, i) => {
    const item = el('div.qi', { text: c });
    tappable(item, () => {
      if (api.locked) return;
      if (i === idxWanted){ item.classList.add('correct'); api.correct(); }
      else { item.classList.add('wrong'); api.later(() => item.classList.remove('wrong'), 460); api.wrong(item); }
    });
    q.append(item);
  });
  // the marker sits at the end you count from and points into the line
  const fromLeft = (dir === 'front' || dir === 'left');
  const marker = fromLeft
    ? el('div.dirmark', null, label + 'から', arrowSVG('right'))
    : el('div.dirmark', null, arrowSVG('left'), label + 'から');
  api.field.append(el('div.row', { style: { flexWrap: 'nowrap', gap: 'calc(var(--u)*.6)', maxWidth: '100%' } },
    fromLeft ? marker : null, q, fromLeft ? null : marker));
  api.onHint(() => {
    $$('.qi', q).forEach((item, i) => {
      const k = fromLeft ? i + 1 : n - i;
      if (!$('.hintline', item)) item.prepend(el('div.hintline', { text: String(k), style: { fontSize: 'calc(var(--u)*1.1)' } }));
    });
  });
}

function ordinalVsCount(api, n){
  const critters = sample(CRITTERS, n);
  const k = ri(2, Math.min(4, n - 1));
  const countMode = chance(.5);
  api.item('ovc:' + (countMode ? 'ko' : 'me') + ':' + k, k + (countMode ? 'こ（ぜんぶ）' : 'ばんめ（ひとり）'));
  api.setPrompt(countMode
      ? `まえから ${numTag(k)}<b>こ</b> タップ　（${k}ひき ぜんぶ）`
      : `まえから ${numTag(k)}<b>ばんめ</b> だけ タップ`,
    countMode ? `まえから ${koKana(k)} タップしてね` : `まえから ${banmeKana(k)}だけ タップしてね`);
  const q = el('div.queue');
  const marked = new Set();
  critters.forEach((c, i) => {
    const item = el('div.qi', { text: c });
    tappable(item, () => {
      if (api.locked) return;
      if (countMode){
        if (marked.has(i)){ marked.delete(i); item.classList.remove('marked'); Sound.sfx.tap(); return; }
        marked.add(i); item.classList.add('marked'); Sound.sfx.count(marked.size - 1);
        if (marked.size === k){
          const ok = Array.from(marked).every(v => v < k);
          if (ok){ $$('.qi', q).forEach((x, j) => { if (j < k) x.classList.add('correct'); }); api.correct(); }
          else {
            api.wrong();
            marked.forEach(v => $$('.qi', q)[v].classList.remove('marked'));
            marked.clear();
          }
        }
      } else {
        if (i === k - 1){ item.classList.add('correct'); api.correct(); }
        else { item.classList.add('wrong'); api.later(() => item.classList.remove('wrong'), 460); api.wrong(item); }
      }
    });
    q.append(item);
  });
  api.field.append(el('div.row', { style: { flexWrap: 'nowrap', gap: 'calc(var(--u)*.6)', maxWidth: '100%' } },
    el('div.dirmark', null, 'まえ', arrowSVG('right')), q));
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', {
      text: countMode ? '「◯こ」は まえから その かずだけ ぜんぶ' : '「◯ばんめ」は そのひとり だけ' }));
  });
}

function gridPosition(api, cols, rows){
  const cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push({ r, c });
  const pool = shuffle(CRITTERS.concat(CRITTERS)).slice(0, cols * rows);
  const tr = ri(1, rows), tc = ri(1, cols);
  api.item('grid:' + tr + '_' + tc, 'うえから ' + tr + '・ひだりから ' + tc);
  api.setPrompt(`うえから ${numTag(tr)}ばんめ、ひだりから ${numTag(tc)}ばんめ は だれ？`,
                `うえから ${banmeKana(tr)}、ひだりから ${banmeKana(tc)}は だれ`);
  const g = el('div.qgrid', { style: { '--gc': cols } });
  cells.forEach((cell, i) => {
    const item = el('div.qi', { text: pool[i] });
    tappable(item, () => {
      if (api.locked) return;
      if (cell.r === tr - 1 && cell.c === tc - 1){ item.classList.add('correct'); api.correct(); }
      else { item.classList.add('wrong'); api.later(() => item.classList.remove('wrong'), 460); api.wrong(item); }
    });
    g.append(item);
  });
  // two axes at once is hard enough without having to guess where counting starts
  api.field.append(el('div.axes', null,
    el('div.axis-x', null, 'ひだりから', arrowSVG('right')),
    el('div.axis-row', null,
      el('div.axis-y', null, 'うえ', arrowSVG('right')),
      g)));
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    $$('.qi', g).forEach((item, i) => {
      if (cells[i].c === tc - 1) item.classList.add('colhint');
      if (cells[i].r === tr - 1) item.classList.add('rowhint');
    });
    api.field.append(el('div.hintline', { text: 'まず うえから かぞえて、つぎに ひだりから かぞえよう' }));
  });
}

/* ============================================================
   7. おおきさ くらべ — length, capacity, ordering
   ============================================================ */
const MEAS_ICONS = ['✏️','🖍','🧵','🥕','🦴','🪵','🧹','🎋'];

/* one row = icon + a fixed-width track; the bar's width is a share of the track,
   so what the child sees is exactly proportional to the length being compared. */
function barRow(len, offset, color, cap){
  const track = el('div.track', null,
    offset ? el('div.gap', { style: { width: offset + '%' } }) : null,
    el('div.stickbar', { style: { width: len + '%', '--mc': color } }));
  return el('div.mrow', { role: 'button', tabindex: '0' }, el('div.cap', { text: cap }), track);
}

function lengthCompare(api, aligned){
  const n = ri(3, 4);
  const lens = [];
  for (let g = 0; g < 400 && lens.length < n; g++){
    const v = ri(24, 92);
    if (lens.every(x => Math.abs(x - v) >= 12)) lens.push(v);
  }
  while (lens.length < n) lens.push(28 + lens.length * 16);
  const cap = pick(MEAS_ICONS);
  const longest = chance(.55);
  const ans = longest ? Math.max.apply(null, lens) : Math.min.apply(null, lens);
  api.item('len:' + (aligned ? 'aligned' : 'ragged') + ':' + (longest ? 'L' : 'S') + ':' + n,
    (aligned ? 'はしが そろった ' : 'はしが ずれた ') + (longest ? 'いちばん ながい' : 'いちばん みじかい'));
  api.setPrompt(longest ? 'いちばん <b>ながい</b> のは どれ？' : 'いちばん <b>みじかい</b> のは どれ？',
                longest ? 'いちばん ながいのは どれ' : 'いちばん みじかいのは どれ');
  const wrap = el('div.measure');
  const colors = shuffle(['var(--c-red)','var(--c-blue)','var(--c-green)','var(--c-purple)']);
  lens.forEach((L, i) => {
    const off = aligned ? 0 : ri(0, Math.max(0, Math.min(22, 97 - L)));
    const row = barRow(L, off, colors[i % colors.length], cap);
    tappable(row, () => {
      if (api.locked) return;
      if (L === ans){ row.classList.add('correct'); api.correct(); }
      else { row.classList.add('wrong'); api.later(() => row.classList.remove('wrong'), 460); api.wrong(row); }
    });
    wrap.append(row);
  });
  api.field.append(wrap);
  if (!aligned) api.field.append(el('div.hintline', { text: 'はじまる ところが ちがうよ。ながさ だけを みてね' }));
  // sliding every bar back to a shared start line IS the lesson, so show it
  api.onHint(() => {
    $$('.track .gap', wrap).forEach(g => { g.style.transition = 'width .6s ease'; g.style.width = '0%'; });
    wrap.classList.add('lined');
    api.field.append(el('div.hintline', { text: 'はじまりを そろえて みたよ' }));
  });
}

function vesselSVG(w, h, fill, color){
  const W = 90, H = 130;
  const x = (W - w) / 2;
  const waterH = h * fill;
  return svg('svg', { viewBox: `0 0 ${W} ${H}`, width: 'calc(var(--u)*11)', height: 'calc(var(--u)*16)' },
    svg('rect', { x, y: H - h - 6, width: w, height: h, rx: 4, fill: 'var(--card)', stroke: 'var(--ink)', 'stroke-width': 3 }),
    svg('rect', { x: x + 3, y: H - waterH - 9, width: w - 6, height: waterH, rx: 3, fill: color, opacity: .85 }),
    svg('rect', { x, y: H - h - 6, width: w, height: h, rx: 4, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 3 }));
}

function capacityCompare(api){
  // Deliberately decouple "tall" from "much": the taller glass is often the narrower one.
  const n = chance(.5) ? 2 : 3;
  const specs = [];
  for (let g = 0; g < 400 && specs.length < n; g++){
    const w = ri(26, 60), h = ri(52, 112), fill = 1;
    const vol = (w - 6) * h * fill;   // the drawn water rect, so the answer matches the picture
    if (specs.every(s => Math.abs(s.vol - vol) / Math.max(s.vol, vol) > 0.18)) specs.push({ w, h, fill, vol });
  }
  while (specs.length < n){
    const w = 30 + specs.length * 14, h = 100 - specs.length * 22;
    specs.push({ w, h, fill: 1, vol: (w - 6) * h });
  }
  const more = chance(.6);
  const ans = more ? Math.max.apply(null, specs.map(s => s.vol)) : Math.min.apply(null, specs.map(s => s.vol));
  api.item('cap:' + (more ? 'more' : 'less') + ':' + n, 'かさが ' + (more ? 'おおい' : 'すくない') + ' コップ');
  api.setPrompt(more ? 'ジュースが <b>おおい</b> のは どれ？' : 'ジュースが <b>すくない</b> のは どれ？',
                more ? 'ジュースが おおいのは どれ' : 'ジュースが すくないのは どれ');
  const colors = shuffle(['var(--c-orange)','var(--c-red)','var(--c-purple)']);
  const wrap = el('div.vessels');
  shuffle(specs).forEach((s, i) => {
    const v = el('div.vessel', null, vesselSVG(s.w, s.h, s.fill, colors[i % colors.length]));
    tappable(v, () => {
      if (api.locked) return;
      if (s.vol === ans){ v.classList.add('correct'); api.correct(); }
      else { v.classList.add('wrong'); api.later(() => v.classList.remove('wrong'), 460); api.wrong(v); }
    });
    wrap.append(v);
  });
  api.field.append(wrap, el('div.hintline', { text: 'せが たかい ＝ おおい とは かぎらないよ' }));
  // an arbitrary unit grid: count the squares instead of eyeballing the height
  api.onHint(() => {
    $$('.vessel svg', wrap).forEach(sv => {
      const water = sv.querySelectorAll('rect')[1];
      if (!water || sv.querySelector('.unitgrid')) return;
      const x = +water.getAttribute('x'), y = +water.getAttribute('y');
      const w = +water.getAttribute('width'), h = +water.getAttribute('height');
      const g = svg('g', { class: 'unitgrid' });
      for (let gx = x; gx <= x + w + 0.1; gx += w / Math.max(1, Math.round(w / 13)))
        g.append(svg('line', { x1: gx, y1: y, x2: gx, y2: y + h, stroke: 'rgba(255,255,255,.75)', 'stroke-width': 1 }));
      for (let gy = y; gy <= y + h + 0.1; gy += h / Math.max(1, Math.round(h / 13)))
        g.append(svg('line', { x1: x, y1: gy, x2: x + w, y2: gy, stroke: 'rgba(255,255,255,.75)', 'stroke-width': 1 }));
      sv.append(g);
    });
    api.field.append(el('div.hintline', { text: 'ますの かずを かぞえて くらべよう' }));
  });
}

function orderBySize(api){
  const n = ri(3, 4);
  const lens = [];
  for (let g = 0; g < 400 && lens.length < n; g++){
    const v = ri(26, 94);
    if (lens.every(x => Math.abs(x - v) >= 14)) lens.push(v);
  }
  while (lens.length < n) lens.push(30 + lens.length * 18);
  const asc = chance(.5);
  const wanted = lens.slice().sort((a, b) => asc ? a - b : b - a);
  api.item('order:' + (asc ? 'asc' : 'desc') + ':' + n, n + 'つを ' + (asc ? 'みじかい' : 'ながい') + ' じゅんに');
  api.setPrompt(asc ? '<b>みじかい</b> じゅんに タップしよう' : '<b>ながい</b> じゅんに タップしよう',
                asc ? 'みじかい じゅんに タップしよう' : 'ながい じゅんに タップしよう');
  const cap = pick(MEAS_ICONS);
  const colors = shuffle(['var(--c-red)','var(--c-blue)','var(--c-green)','var(--c-purple)']);
  const wrap = el('div.measure');
  let step = 0;
  shuffle(lens).forEach((L, i) => {
    const row = barRow(L, 0, colors[i % colors.length], cap);
    tappable(row, () => {
      if (api.locked || row.classList.contains('picked')) return;
      if (L === wanted[step]){
        step++;
        row.classList.add('picked');
        row.classList.remove('nexthint');
        row.prepend(el('div.ordno', { text: String(step) }));
        Sound.sfx.count(step - 1);
        if (step === n){ $$('.mrow', wrap).forEach(r => r.classList.add('correct')); api.correct(); }
      } else {
        row.classList.add('wrong');
        api.later(() => row.classList.remove('wrong'), 460);
        api.wrong(row);
      }
    });
    wrap.append(row);
  });
  api.field.append(wrap);
  api.onHint(() => {
    const wantNow = wanted[step];
    $$('.mrow', wrap).forEach(r => {
      const bar = $('.stickbar', r);
      if (bar && Math.abs(parseFloat(bar.style.width) - wantNow) < 0.01) r.classList.add('nexthint');
    });
    api.field.append(el('div.hintline', { text: asc ? 'ひかって いるのが つぎに みじかい よ' : 'ひかって いるのが つぎに ながい よ' }));
  });
}

'use strict';

/* ---------- shared: bond diagram ---------- */
function bondNode(whole, known, unknownLabel){
  const legs = svg('svg', { viewBox: '0 0 100 20', class: 'legs' },
    svg('path', { d: 'M50 0 L18 18 M50 0 L82 18', stroke: 'var(--ink)', 'stroke-width': 3,
                  'stroke-linecap': 'round', fill: 'none' }));
  return el('div.bond', null,
    el('div.whole', { text: String(whole) }),
    legs,
    el('div.parts', null,
      el('div.part.known', { text: String(known) }),
      el('div.part.unknown', { text: unknownLabel == null ? '?' : String(unknownLabel) })));
}

/* five/ten frame with a known part in blue and the missing part as empty holes */
function partFrame(whole, known){
  const cols = whole > 5 ? 5 : whole;
  const f = el('div.tenframe', { style: { '--cols': cols } });
  for (let i = 0; i < whole; i++){
    const cell = el('div.cell' + (i >= known ? '.hole' : ''));
    if (i < known) cell.append(el('div.dot'));
    f.append(cell);
  }
  return f;
}

/* ============================================================
   8. いくつと いくつ — number bonds (decompose & compose)
   ============================================================ */
function decompose(api, whole){
  const known = ri(1, whole - 1), ans = whole - known;
  api.item('dec:' + whole + '-' + known, whole + ' は ' + known + ' と ' + ans);
  api.setPrompt(`${numTag(whole)} は ${numTag(known)} と いくつ？`,
                `${numKana(whole)}は ${numKana(known)}と いくつ`);
  const frame = partFrame(whole, known);
  const bond = bondNode(whole, known, null);
  api.field.append(el('div.frameset', null, frame), bond);
  api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 1, whole))), ans, {
    correctOpts: { delay: 1500 },
    onPick(){
      // show the two parts making the whole (scoped to this question's own nodes)
      const cells = $$('.cell', frame);
      for (let i = known; i < whole; i++){
        api.later(() => {
          if (!cells[i].firstChild){ cells[i].classList.remove('hole'); cells[i].append(el('div.dot.b')); Sound.sfx.place(); }
        }, (i - known) * 170 + 200);
      }
      $('.part.unknown', bond).textContent = String(ans);
    }
  });
}

function compose(api, maxWhole){
  const a = ri(1, maxWhole - 1), b = ri(1, maxWhole - a), ans = a + b;
  api.item('com:' + a + '+' + b, a + ' と ' + b + ' で ' + ans);
  api.setPrompt(`${numTag(a)} と ${numTag(b)} で いくつ？`,
                `${numKana(a)}と ${numKana(b)}で いくつ`);
  const slots = a + b > 5 ? 10 : 5;
  const f = el('div.tenframe', { style: { '--cols': 5 } });
  for (let i = 0; i < slots; i++){
    const cell = el('div.cell');
    if (i < a) cell.append(el('div.dot'));
    else if (i < a + b) cell.append(el('div.dot.b'));
    f.append(cell);
  }
  api.field.append(el('div.frameset', null, f),
    el('div.eq', null, String(a), el('span.op', { text: 'と' }), String(b), el('span.op', { text: 'で' }), el('span.box', { text: '?' })));
  api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 1, maxWhole + 2))), ans);
}

/* ============================================================
   10-11. たしざん / ひきざん — story scene then symbol
   ============================================================ */
/* Two clusters with a gap between them, so "3 and 2" stays visible as 3 and 2
   even after they have joined. A single evenly-spaced row dissolves the structure
   the question is about. */
function clusterSpots(n, cx){
  const per = Math.min(3, n);
  const rows = Math.ceil(n / per);
  const out = [];
  for (let i = 0; i < n; i++){
    const r = Math.floor(i / per), c = i % per;
    const inRow = Math.min(per, n - r * per);
    out.push([cx + (c - (inRow - 1) / 2) * 12, 48 + (r - (rows - 1) / 2) * 23]);
  }
  return out;
}

function storyScene(api, a, b, op, thing, onReady){
  const scene = el('div.scene');
  scene.append(el('div.' + (thing.e === '🐟' ? 'pond' : 'ground')));
  api.field.append(scene);
  const actors = [];
  const place = (spots, cls, hidden) => spots.forEach(p => {
    const n = el('div.actor.' + cls, { text: thing.e, style: { left: p[0] + '%', top: p[1] + '%' } });
    // offset in % of the scene, not vw: a vw offset left newcomers visible inside the frame
    if (hidden) n.style.transform = 'translate(160%,-50%)';
    scene.append(n); actors.push(n);
  });

  if (op === '+'){
    place(clusterSpots(a, 30), 'g1', false);
    place(clusterSpots(b, 72), 'g2', true);
  } else {
    const spots = clusterSpots(a, 50);
    place(spots.slice(0, a - b), 'g1', false);
    place(spots.slice(a - b), 'g2', false);
  }

  api.later(() => {
    Sound.sfx.swoosh();
    if (op === '+'){
      actors.forEach(n => { if (n.classList.contains('g2')) n.style.transform = 'translate(-50%,-50%)'; });
    } else {
      actors.forEach(n => {
        if (!n.classList.contains('g2')) return;
        n.classList.add('leaving');
        n.style.transform = 'translate(160%,-160%)';
      });
    }
    api.later(onReady, 900);
  }, 950);
}

function subStory(api, max){

function symbolCalc(api, op, max){
  let a, b, ans;
  if (op === '+'){ a = ri(1, max - 1); b = ri(1, max - a); ans = a + b; }
  else { a = ri(2, max); b = ri(1, a); ans = a - b; }
  api.item((op === '+' ? 'sum:' + a + '+' + b : 'rest:' + a + '-' + b),
    a + (op === '+' ? ' ＋ ' : ' − ') + b);
  api.setPrompt('しきを みて こたえよう',
    `${numKana(a)} ${op === '+' ? 'たす' : 'ひく'} ${numKana(b)} は`);
  api.field.append(eqNode(a, b, op));
  api.buildChoices(shuffle([ans].concat(distractors(ans, 3, 0, max + 2, 2))), ans);
  api.onHint(() => {
    if ($('.tenframe', api.field)) return;
    const f = el('div.tenframe', { style: { '--cols': 5 } });
    for (let i = 0; i < 10; i++){
      const cell = el('div.cell');
      if (op === '+'){ if (i < a) cell.append(el('div.dot')); else if (i < a + b) cell.append(el('div.dot.b')); }
      else { if (i < a - b) cell.append(el('div.dot')); else if (i < a) cell.append(el('div.dot.b')); }
      f.append(cell);
    }
    api.field.append(el('div.frameset', null, f),
      el('div.hintline', { text: op === '+' ? 'あおと あかを あわせて かぞえよう' : 'あかは いなくなった ぶん。あおを かぞえよう' }));
  });
}

function differenceQ(api, max){

  api.setPrompt(`どちらが <b>いくつ</b> おおい？`, 'どちらが いくつ おおい');
  const board = el('div.measure');
  [[t1, a], [t2, b]].forEach(([t, n]) => {

    const g = el('div.row', { style: { gap: 'calc(var(--u)*.25)' } });

    row.append(g);

  api.field.append(board, eqNode(a, b, '-'));
  api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 0, max, 2))), ans);
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', { text: 'うえと したを 1つずつ ペアに して、あまりを かぞえよう' }));
  });
}

'use strict';

const SHAPE_COLORS = ['var(--c-red)','var(--c-blue)','var(--c-green)','var(--c-purple)','var(--c-orange)','var(--c-pink)'];

/* ============================================================
   12. かたち
   ============================================================ */
const KIND_JA = { circle: 'まる', triangle: 'さんかく', square: 'しかく' };
const KIND_MEMBERS = {
  circle:   ['circle', 'oval'],
  triangle: ['tri', 'tri2', 'rtri'],
  square:   ['square', 'rect']
};
const OTHERS = ['diamond', 'pentagon', 'hexagon', 'trapezoid', 'star', 'heart', 'semi'];

function findAllShapes(api){
  const target = pick(['circle', 'triangle', 'square']);
  const nTarget = ri(2, 4);
  const cells = [];
  for (let i = 0; i < nTarget; i++) cells.push({ name: pick(KIND_MEMBERS[target]), hit: true });
  const otherKinds = ['circle', 'triangle', 'square'].filter(k => k !== target);
  // 「しかく」means four-sided, so a rhombus or trapezoid would be a fair answer too:
  // keep every other quadrilateral out of the distractors when squares are the target
  const others = target === 'square'
    ? OTHERS.filter(k => k !== 'diamond' && k !== 'trapezoid')
    : OTHERS;
  const nOther = ri(4, 6);
  for (let i = 0; i < nOther; i++){
    const src = chance(.7) ? KIND_MEMBERS[pick(otherKinds)] : others;
    cells.push({ name: pick(src), hit: false });
  }
  api.item('find:' + target, KIND_JA[target] + ' を さがす');
  api.setPrompt(`<b>${KIND_JA[target]}</b> を ぜんぶ タップしよう`, `${KIND_JA[target]}を ぜんぶ タップしよう`);
  const grid = el('div.shapegrid');
  const tally = el('div.tally');
  const drawTally = () => {
    clear(tally);
    tally.append(el('span.lbl', { text: 'みつけた' }));
    for (let i = 0; i < nTarget; i++) tally.append(el('span.dot' + (i < found ? '.on' : '')));
  };
  let found = 0;

/* --- silhouette puzzles: build a picture out of shapes --- */
const PUZZLES = [
  { name: 'おうち', pieces: [
      { pts: [[20,34],[80,34],[80,72],[20,72]] },
      { pts: [[50,6],[86,34],[14,34]] } ] },
  { name: 'ヨット', pieces: [
      { pts: [[14,54],[86,54],[74,72],[26,72]] },
      { pts: [[48,8],[48,50],[18,50]] },
      { pts: [[54,14],[54,50],[82,50]] } ] },
  { name: 'ロケット', pieces: [
      { pts: [[38,26],[62,26],[62,64],[38,64]] },
      { pts: [[50,4],[64,26],[36,26]] },
      { pts: [[38,50],[38,72],[24,72]] },
      { pts: [[62,50],[62,72],[76,72]] } ] },
  { name: 'ちょうちょ', pieces: [
      { pts: [[48,38],[16,14],[16,38]] },
      { pts: [[52,38],[84,14],[84,38]] },
      { pts: [[48,42],[16,66],[16,42]] },
      { pts: [[52,42],[84,66],[84,42]] } ] },
  { name: 'おおきな き', pieces: [
      { pts: [[44,58],[56,58],[56,74],[44,74]] },
      { pts: [[50,8],[76,38],[24,38]] },
      { pts: [[50,28],[82,60],[18,60]] } ] }
];

function bbox(pts){
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  const y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
}

function signature(pts){
  // rough shape signature so identical pieces are interchangeable
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const w = Math.max.apply(null, xs) - Math.min.apply(null, xs);
  const h = Math.max.apply(null, ys) - Math.min.apply(null, ys);
  return pts.length + ':' + Math.round(w) + 'x' + Math.round(h);
}

function shapePuzzle(api){
  const pz = pick(PUZZLES);
  api.item('puz:' + pz.name, pz.name + ' を つくる');
  api.setPrompt(`かたちを はめて <b>${pz.name}</b> を つくろう`, `かたちを はめて ${pz.name}を つくろう`);
  const box = el('div.shapefield');
  const s = svg('svg', { viewBox: '0 0 100 80', preserveAspectRatio: 'xMidYMid meet' });
  box.append(s);
  const tray = el('div.shapes-tray');
  api.field.append(box, tray);

  const slots = pz.pieces.map((p, i) => {
    const poly = svg('polygon', {
      points: p.pts.map(q => q.join(',')).join(' '),
      fill: 'var(--trace-guide)', stroke: 'var(--ink-faint)', 'stroke-width': 1.6,
      'stroke-dasharray': '3 2.4', 'data-drop': '', style: 'cursor:pointer'
    });
    poly.dataset.sig = signature(p.pts);
    s.append(poly);
    return poly;
  });

  const colors = shuffle(SHAPE_COLORS);
  let filled = 0;
  const dd = UI.makeDragDrop({
    onDrop(item, target){
      if (api.locked) return;
      if (target.dataset.filled === '1') return;
      if (item.dataset.sig === target.dataset.sig){
        target.setAttribute('fill', item.dataset.color);
        target.setAttribute('stroke', 'color-mix(in srgb, ' + item.dataset.color + ' 60%, var(--ink) 40%)');
        target.setAttribute('stroke-dasharray', '');
        target.setAttribute('stroke-width', '1.6');
        target.dataset.filled = '1';
        item.classList.add('used');
        filled++;
        Sound.sfx.place();
        if (filled === slots.length) api.later(() => api.correct(), 260);
      } else {
        target.animate([{ opacity: 1 }, { opacity: .35 }, { opacity: 1 }], { duration: 300 });
        api.wrong(item);
        dd.select(item);            // stay picked up so the next slot is one tap away
      }
    }
  });
  slots.forEach(sl => dd.bindTarget(sl));

  // each tray tile is cropped around its own piece, on a shared scale, so small
  // pieces stay recognisable while the size difference between pieces stays readable
  const boxes = pz.pieces.map(p => bbox(p.pts));
  const biggest = Math.max.apply(null, boxes.map(b => Math.max(b.w, b.h)));
  shuffle(pz.pieces.map((p, i) => ({ p, i }))).forEach(({ p, i }) => {
    const color = colors[i % colors.length];
    const b = boxes[i];
    const S = Math.max(Math.max(b.w, b.h) * 1.25, biggest * 0.5);
    const t = el('div.shapetile');
    const mini = svg('svg', { viewBox: `${b.cx - S / 2} ${b.cy - S / 2} ${S} ${S}` },
      svg('polygon', { points: p.pts.map(q => q.join(',')).join(' '), fill: color,
        stroke: 'color-mix(in srgb, ' + color + ' 60%, var(--ink) 40%)',
        'stroke-width': S * 0.028, 'stroke-linejoin': 'round' }));
    t.append(mini);
    t.dataset.sig = signature(p.pts);
    t.dataset.color = color;
    dd.bindItem(t);
    tray.append(t);
  });
  api.field.append(el('div.hintline', { text: 'ゆびで はめて みよう' }));
  api.onHint(() => {
    const t = $('.shapetile:not(.used)', tray);
    if (!t) return;
    dd.select(t);
    const slot = slots.find(sl => sl.dataset.filled !== '1' && sl.dataset.sig === t.dataset.sig);
    if (slot) slot.classList.add('glow');
  });
}

/* Solid crayon-coloured shapes: when the axis is colour, the colour has to be the

const COLOR_SHAPES = ['circle', 'square', 'tri', 'star', 'heart', 'oval'];

function sortGame(api, catset, nBins, byColor){
  const keys = sample(Object.keys(catset), nBins);
  const perBin = nBins === 2 ? 3 : 2;
  api.item('sort:' + keys.slice().sort().join('_'),
    keys.map(k => catset[k].lbl).join('・') + ' に わける');
  api.setPrompt(byColor ? 'おなじ いろの ばしょに いれてね' : 'なかまの ばしょに いれてね',
                byColor ? 'おなじ いろの ばしょに いれてね' : 'なかまの ばしょに いれてね');
  const mark = k => {
    const c = catset[k];
    if (!byColor) return el('span', { text: c.e });
    const sv = shapeSVG(c.swatch, c.c, 0);
    sv.setAttribute('width', 'calc(var(--u)*2)'); sv.setAttribute('height', 'calc(var(--u)*2)');
    return sv;
  };
  const bins = el('div.bins');
  const binMap = {};
  keys.forEach(k => {
    const c = catset[k];
    const b = el('div.bin', { style: { '--bc': c.c } },
      el('div.lbl', null, mark(k), ' ' + c.lbl),
      el('div.hold'));
    b.dataset.cat = k;
    binMap[k] = b;
    bins.append(b);
  });
  const tray = el('div.tray');
  api.field.append(bins, tray);

  const picks = [];
  keys.forEach(k => {
    if (byColor) sample(COLOR_SHAPES, perBin).forEach(shape => picks.push({ shape, k }));
    else sample(catset[k].items, perBin).forEach(e => picks.push({ e, k }));
  });
  let placed = 0;
  const totalItems = picks.length;

  const dd = UI.makeDragDrop({
    onDrop(item, target){
      if (api.locked) return;
      if (item.dataset.cat === target.dataset.cat){
        const copy = item.firstElementChild ? item.firstElementChild.cloneNode(true) : el('span', { text: item.textContent });
        $('.hold', target).append(el('span.item', null, copy));
        item.classList.add('gone');
        placed++;
        Sound.sfx.place();
        if (placed === totalItems) api.later(() => api.correct(), 300);
      } else {
        target.classList.add('nope');
        api.later(() => target.classList.remove('nope'), 440);
        api.wrong(item);
      }
    }
  });
  Object.values(binMap).forEach(b => dd.bindTarget(b));
  shuffle(picks).forEach(p => {
    let t;
    if (byColor){
      const sv = shapeSVG(p.shape, catset[p.k].c, 0);
      sv.setAttribute('width', 'calc(var(--u)*3.4)'); sv.setAttribute('height', 'calc(var(--u)*3.4)');
      t = el('div.tile.shapetile2', null, sv);
    } else {
      t = el('div.tile', { text: p.e });
    }
    t.dataset.cat = p.k;
    dd.bindItem(t);
    tray.append(t);
  });
  api.field.append(el('div.hintline', { text: 'ゆびで はこに いれてね' }));
  api.onHint(() => {
    const t = $('.tile:not(.gone)', tray);
    if (!t) return;
    dd.select(t);
    binMap[t.dataset.cat].classList.add('glow');
  });
}

   ============================================================ */
const PAT_TOKENS = ['🔴','🔵','🟡','🟢','🟣','🟠','⭐️','🌙','🍎','🍌','🐰','🐻'];

function patternQuestion(api, unitKind, blanks){
  const kinds = { AB: [0, 1], AAB: [0, 0, 1], ABB: [0, 1, 1], ABC: [0, 1, 2], ABBA: [0, 1, 1, 0] };
  const unit = kinds[unitKind];
  const need = Math.max.apply(null, unit) + 1;
  const toks = sample(PAT_TOKENS, need);
  const seq = [];
  const wanted = Math.min(10, unit.length * 3 + ri(0, unit.length - 1));   // must stay on one line
  while (seq.length < wanted) seq.push(toks[unit[seq.length % unit.length]]);
  const total = seq.length;
  const holes = [];
  for (let i = 0; i < blanks; i++) holes.push(total - 1 - i);
  holes.sort((a, b) => a - b);
  api.item('pat:' + unitKind + ':' + blanks, unitKind + ' の くりかえし');
  api.setPrompt('つづきは どれ？ きまりを みつけよう', 'つづきは どれ。きまりを みつけよう');
  const train = el('div.train');
  const cars = seq.map((t, i) => {
    const isHole = holes.indexOf(i) >= 0;
    const c = el('div.car' + (isHole ? '.blank' : ''), { text: isHole ? '' : t });
    train.append(c);
    return c;
  });
  api.field.append(train);

  let hi = 0;
  function askHole(){
    if (hi >= holes.length) return;
    const at = holes[hi];
    cars.forEach(c => c.classList.remove('now'));
    cars[at].classList.add('blank', 'now');
    const ans = seq[at];
    const opts = shuffle(toks.concat(sample(PAT_TOKENS.filter(t => toks.indexOf(t) < 0), Math.max(0, 3 - need))));
    api.buildChoices(opts.slice(0, Math.max(3, need)), ans, {
      cls: 'pic',
      render: v => el('span', { text: v, style: { fontSize: 'calc(var(--u)*3.2)' } }),
      onPick(){
        cars[at].textContent = ans;
        cars[at].classList.remove('blank', 'now');
        cars[at].classList.add('filled');
        Sound.sfx.place();
        hi++;
        if (hi < holes.length){ api.later(askHole, 560); return false; }
        return true;
      }
    });
  }
  askHole();
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    cars.forEach((c, i) => { if (Math.floor(i / unit.length) % 2 === 0) c.classList.add('unitmark'); });
    api.field.append(el('div.hintline', { text: unit.length + 'つずつ おなじ ならびが くりかえして いるよ' }));
  });
}

/* ============================================================
   15. とけい — reading the clock
   ============================================================ */
/* Only times that mean one thing to a five-year-old regardless of am/pm. */
const HOUR_SCENES = { 7: '🌅 あさごはん', 12: '🍛 おひるごはん', 3: '🧃 おやつ' };

function readClock(api, half){
  const h = ri(1, 12);
  const m = half && chance(.5) ? 30 : 0;
  api.item('read:' + h + ':' + m, h + 'じ' + (m === 30 ? 'はん' : '') + ' を よむ');
  api.setPrompt('なんじ かな？', 'なんじ かな');
  const c = clockSVG(h, m);
  c.style.width = 'calc(var(--u)*22)';
  c.style.height = 'calc(var(--u)*22)';
  api.field.append(c);
  if (m === 0 && HOUR_SCENES[h]) api.field.append(el('div.hintline', { text: HOUR_SCENES[h] }));
  const ans = h + ':' + m;
  const opts = new Set([ans]);
  let guard = 0;
  while (opts.size < 4 && guard++ < 60){
    const hh = ri(1, 12), mm = half ? pick([0, 30]) : 0;
    opts.add(hh + ':' + mm);
  }
  api.buildChoices(shuffle(Array.from(opts)), ans, {
    render: v => {
      const [hh, mm] = v.split(':');
      return hh + 'じ' + (mm === '30' ? 'はん' : '');
    }
  });
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', {
      text: m === 30 ? 'ながい はりが 6 のとき「はん」。みじかい はりは すぎた ほうの すうじ' : 'みじかい はりが さす すうじを よもう' }));
  });
}

function pickClock(api, half){
  const h = ri(1, 12), m = half && chance(.5) ? 30 : 0;
  api.item('pick:' + h + ':' + m, h + 'じ' + (m === 30 ? 'はん' : '') + ' の とけいを えらぶ');
  api.setPrompt(`<b>${h}じ${m === 30 ? 'はん' : ''}</b> の とけいは どれ？`,
                `${jiKana(h, m === 30)}の とけいは どれ`);
  const opts = [{ h, m }];
  let guard = 0;
  while (opts.length < 3 && guard++ < 60){
    const hh = ri(1, 12), mm = half ? pick([0, 30]) : 0;
    if (!opts.some(o => o.h === hh && o.m === mm)) opts.push({ h: hh, m: mm });
  }
  clear(api.choices);
  shuffle(opts).forEach(o => {
    const wrap = el('div.clock-choice', null, clockSVG(o.h, o.m, { numerals: true }));
    tappable(wrap, () => {
      if (api.locked) return;
      if (o.h === h && o.m === m){ wrap.classList.add('correct'); api.correct(); }
      else { wrap.classList.add('wrong'); api.later(() => wrap.classList.remove('wrong'), 460); api.wrong(wrap); }
    });
    api.choices.append(wrap);
  });
}

function setClock(api){
  const target = ri(1, 12);
  api.item('set:' + target, target + 'じ に はりを あわせる');
  api.setPrompt(`<b>${target}じ</b> に なるように みじかい はりを うごかそう`,
                `${jiKana(target)}に なるように、みじかい はりを うごかそう`);
  let cur = ri(1, 12);
  for (let g = 0; g < 100 && cur === target; g++) cur = ri(1, 12);
  if (cur === target) cur = target === 12 ? 1 : target + 1;
  const holder = el('div', { style: { touchAction: 'none' } });
  api.field.append(holder);
  const readout = el('div.hintline', { text: 'いま ' + cur + 'じ' });
  api.field.append(readout);

  const clock = clockSVG(cur, 0, { cls: 'pickable' });
  clock.style.width = 'calc(var(--u)*26)';
  clock.style.height = 'calc(var(--u)*26)';
  holder.append(clock);
  const hourHand = $('.hand-h', clock);

  function paint(){
    // rebuilding the SVG here would destroy the node that received pointerdown,
    // which is exactly why dragging the hand never worked
    const a = ((cur % 12) / 12) * Math.PI * 2 - Math.PI / 2;
    hourHand.setAttribute('x2', (50 + Math.cos(a) * 21).toFixed(2));
    hourHand.setAttribute('y2', (50 + Math.sin(a) * 21).toFixed(2));
    readout.textContent = 'いま ' + cur + 'じ';
  }

  let down = false;
  function setFrom(e){
    const r = clock.getBoundingClientRect();
    if (!r.width) return;
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    let ang = Math.atan2(dy, dx) + Math.PI / 2;
    if (ang < 0) ang += Math.PI * 2;
    let h = Math.round(ang / (Math.PI * 2) * 12);
    if (h === 0) h = 12;
    if (h !== cur){ cur = h; Sound.sfx.tap(); paint(); }
  }
  clock.addEventListener('pointerdown', e => {
    if (api.locked) return;
    down = true;
    e.preventDefault();
    if (clock.setPointerCapture) clock.setPointerCapture(e.pointerId);
    setFrom(e);
  });
  clock.addEventListener('pointermove', e => { if (down && !api.locked){ e.preventDefault(); setFrom(e); } });
  const release = () => { down = false; };
  clock.addEventListener('pointerup', release);
  clock.addEventListener('pointercancel', release);
  paint();

  const check = el('button.btn.btn-accent', { text: 'これで いい？',
    onclick(){
      if (api.locked) return;
      if (cur === target) api.correct(); else { api.wrong(check); }
    } });
  api.choices.append(check);
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', { text: 'みじかい はりが ' + target + ' を さすように まわそう' }));
    $$('text', clock).forEach(t => { if (t.textContent === String(target)) t.classList.add('goal'); });
  });
}

      a = ri(12, 19); b = ri(3, 9); want = a * b;
      q.textContent = a + ' × ' + b + ' = ?';
      clear(choices);
      const opts = shuffle([want, want + ri(3, 9), want - ri(3, 9), want + ri(10, 20)]);
      opts.forEach(v => choices.append(el('button.choice', {
        type: 'button', text: String(v),
        onclick(e){
          if (v === want){ Sound.sfx.correct(); render(); UI.show('parent'); }

    const tb = el('tbody');
    PLAN.forEach(([a2, b2, c]) => tb.append(el('tr', null,
      el('td', { style: { whiteSpace: 'nowrap', fontWeight: 800 }, text: a2 }),
      el('td', { style: { whiteSpace: 'nowrap' }, text: b2 }),
      el('td', { text: c }))));
    t.append(tb);
    s.append(el('div', { style: { overflowX: 'auto' } }, t));
    return s;
  }

  function settingsSection(){
    const s = el('section');
    s.append(el('div.eyebrow', { text: 'settings' }), el('h3', { text: '設定' }));
    const toggle = (label, get, set) => {
      const b = el('button.btn', { text: label + '：' + (get() ? 'オン' : 'オフ') });
      b.addEventListener('click', () => {
        set(!get());
        b.textContent = label + '：' + (get() ? 'オン' : 'オフ');
        if (get()) Sound.sfx.tap();
      });
      return b;
    };
    const row = el('div', { style: { display: 'flex', gap: 'calc(var(--u)*.7)', flexWrap: 'wrap' } },
      toggle('効果音', () => Sound.sfxOn, v => { Sound.sfxOn = v; Store.setPref('sfx', v); }),
      toggle('読み上げ', () => Sound.voiceOn, v => { Sound.voiceOn = v; Store.setPref('voice', v); }));
    s.append(row);
    if (!Sound.hasVoice){
      s.append(el('p', { style: { color: 'var(--oops)' },
        text: '※ この端末で日本語の読み上げ音声が見つかりませんでした。iPad の 設定 → アクセシビリティ → 読み上げコンテンツ → 声 で日本語（Kyoko など）を追加すると、問題文が音声で読まれます。文字だけでも遊べます。' }));
    }
    const reset = el('button.btn', { text: justReset ? '消しました' : '記録をすべて消す',
      style: { borderColor: 'var(--oops)', color: 'var(--oops)' } });
    justReset = false;
    let armed = false;
    reset.addEventListener('click', () => {
      if (!armed){
        armed = true;
        reset.textContent = '本当に消しますか？（もう一度タップ）';
        setTimeout(() => { armed = false; reset.textContent = '記録をすべて消す'; }, 4000);
        return;
      }
      Store.reset();
      justReset = true;      // render() replaces this button, so the message goes on the new one
      Home.render();
      render();
    });
    if (!Store.persists){
      s.append(el('p', { style: { color: 'var(--oops)', fontWeight: 800 },
        text: 'この開き方では記録が保存できません（ファイルを直接開いた場合やプライベートブラウズでは、iPad 側がデータの保存を許可しません）。Safari で開いてから 共有 → ホーム画面に追加 し、そのアイコンから起動してください。' }));
    }
    s.append(el('p', { style: { marginTop: 'calc(var(--u)*.9)' },
      text: '記録はこの端末の中だけに保存されます。サーバーには何も送信されません。' }), reset);
    return s;
  }

  function backupSection(){
    const s = el('section');
    s.append(el('div.eyebrow', { text: 'backup' }), el('h3', { text: '記録の保存とバックアップ' }));

    s.append(el('p', { html:
      '学習の記録は、<b>いま開いている URL ごとに、この端末のブラウザの中だけ</b>に保存されます。' +
      'ちがう URL で開くと、同じアプリでも記録は共有されません。' +
      '端末を変えるとき、Safari の履歴やサイトデータを消すとき、別の URL に引っ越すときは、' +
      '下のボタンで書き出したファイルを保管しておいてください。' }));

    const rows = el('div', { style: { display: 'grid', gap: 'calc(var(--u)*.3)', margin: 'calc(var(--u)*.8) 0' } });
    const row = (k, v, warn) => el('div', { style: { display: 'flex', justifyContent: 'space-between', gap: 'calc(var(--u)*1)' } },
      el('span', { text: k }),
      el('b', { text: v, style: { color: warn ? 'var(--oops)' : 'var(--ink)', textAlign: 'right' } }));
    rows.append(row('いまの保存先', Store.origin, Store.origin === 'file://'));
    rows.append(row('保存の可否', Store.persists ? '保存できます' : '保存できません', !Store.persists));
    rows.append(row('ブラウザが記録を保持する設定', persistState, false));
    s.append(rows);
    if (persistState !== '許可されています'){
      s.append(el('p', { text:
        'この設定はブラウザが判断するもので、許可されていなくてもすぐ消えるわけではありません。' +
        'iPad では Safari で開いて 共有 → ホーム画面に追加 し、そのアイコンから起動していれば、' +
        'しばらく使わなくても記録は保持されます。逆に Safari のタブのまま数日使わないと、' +
        'iPadOS が自動的に消すことがあります。' }));
    }

    const status = el('p', { style: { fontWeight: 800, color: lastBackupMsg && lastBackupMsg.ok ? 'var(--good)' : 'var(--oops)' },
      text: lastBackupMsg ? lastBackupMsg.msg : '' });
    lastBackupMsg = null;
    const stamp = () => {
      const d = new Date();
      return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    };

    const dl = el('button.btn', { text: '記録を書き出す（ファイル）', onclick(){
      try{
        const blob = new Blob([Store.exportText()], { type: 'application/json' });
        const a = el('a', { href: URL.createObjectURL(blob), download: 'kazu-no-bouken-' + stamp() + '.json' });
        document.body.append(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        status.textContent = '書き出しました。ファイルアプリや iCloud Drive に保管してください。';
      }catch(e){ status.textContent = 'この環境ではファイルに書き出せません。下の「コピー」を使ってください。'; }
    } });

    const copy = el('button.btn', { text: 'コピー（貼り付けで復元）', onclick(){
      const text = Store.exportText();
      const done = () => { status.textContent = 'コピーしました。メモアプリなどに貼り付けて保管してください。'; };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done, () => { box.value = text; box.select(); status.textContent = '下の枠に出しました。長押しして「コピー」してください。'; });
      } else { box.value = text; box.select(); status.textContent = '下の枠に出しました。長押しして「コピー」してください。'; }
    } });

    const file = el('input', { type: 'file', accept: 'application/json,.json', style: { display: 'none' },
      onchange(e){
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => apply(String(r.result));
        r.readAsText(f);
        e.target.value = '';
      } });
    const pick = el('button.btn', { text: '記録を読み込む（ファイル）', onclick(){ file.click(); } });

    const box = el('textarea.backupbox', { rows: 4, spellcheck: 'false',
      placeholder: 'ここに、書き出した記録を貼り付けて「貼り付けから読み込む」を押してください' });
    const paste = el('button.btn', { text: '貼り付けから読み込む', onclick(){
      if (!box.value.trim()){ status.textContent = '枠が空です。'; return; }
      apply(box.value);
    } });

    let mode = 'merge';
    const modeBtn = el('button.btn', { text: '読み込み方：合体する', onclick(){
      mode = mode === 'merge' ? 'replace' : 'merge';
      modeBtn.textContent = '読み込み方：' + (mode === 'merge' ? '合体する' : 'おきかえる');
    } });

    function apply(text){
      const r = Store.importText(text, mode);
      if (r.ok){ lastBackupMsg = r; Home.render(); render(); return; }
      status.textContent = r.msg;
      status.style.color = 'var(--oops)';
    }

    s.append(el('div', { style: { display: 'flex', gap: 'calc(var(--u)*.7)', flexWrap: 'wrap' } }, dl, copy),
             el('div', { style: { display: 'flex', gap: 'calc(var(--u)*.7)', flexWrap: 'wrap', marginTop: 'calc(var(--u)*.6)' } }, pick, paste, modeBtn),
             file, box, status,
             el('p', { text: '「合体する」は、いまの記録と読み込んだ記録の良いほうを残します（同じファイルを二度読み込んでも数字は増えません）。「おきかえる」は、いまの記録を捨てて読み込んだ内容にします。' }));
    return s;
  }

  function render(){
    buildSheet();
    clear(sheetInner);
    sheetInner.append(
      el('section', null,
        el('div.eyebrow', { text: 'about' }),
        el('h3', { text: 'このアプリがねらっていること' }),
        el('p', { text: '小学校1年生の算数は「数える」「数を分ける・合わせる」「比べる」「形をとらえる」の4つの土台の上に立っています。逆に言えば、入学前にやるべきことは計算の先取りではなく、この土台を手と目と声で確かめておくことです。このアプリは15の遊びを4つの世界に分け、1レベル8問・1日10分で回せる分量にしています。' }),
        el('p', { text: '答えを間違えても減点や時間制限はありません。2回間違えると自動でヒントが出て、必ず自分で正解にたどり着いて終われるようにしてあります。' })),
      statsSection(),
      progressSection(),
      planSection(),
      textSection('why', '入学前に育てておきたい力', WHY),
      textSection('at home', 'おうちでできること', HOME_TIPS),
      backupSection(),
      settingsSection(),
      el('div', { style: { height: 'calc(var(--u)*2)' } }));
  }

  // Safari drops script-writable storage for sites that are not used for a while;
  // asking for persistence (and adding the app to the Home Screen) prevents that
  if (navigator.storage && navigator.storage.persisted){
    navigator.storage.persisted()
      .then(p => p ? true : (navigator.storage.persist ? navigator.storage.persist() : false))
      .then(p => { persistState = p ? '許可されています' : '許可されていません'; })
      .catch(() => { persistState = 'この端末では確認できません'; });
  } else {
    persistState = 'この端末では確認できません';
  }

  return { open, render };
})();

'use strict';

(function main(){
  /* viewport: the Artifact host injects its own meta; make it iPad-app-like */
  (function fixViewport(){
    let m = document.querySelector('meta[name="viewport"]');
    if (!m){ m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
    m.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
  })();

  /* scale unit from the real stage size so the layout is identical on any iPad */
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    const u = clamp(Math.min(w * 0.0135, h * 0.0152), 7, 17).toFixed(2) + 'px';
    if (document.documentElement.style.getPropertyValue('--u') !== u){
      document.documentElement.style.setProperty('--u', u);
    }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  /* stop iOS double-tap zoom and rubber-band scrolling on the stage */
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => {
    if (!e.target.closest('.worlds, .sheet, .levels, .book, .queue, .train')) e.preventDefault();
  }, { passive: false });
  UI.init();
  Sound.sfxOn   = Store.data.sfx   !== false;
  Sound.voiceOn = Store.data.voice !== false;

  Title.build();
  Home.build();
  Levels.build();
  Session.build();
  Result.build();
  Book.build();

  UI.show('title', { replace: true });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) Sound.hush(); else resize();
  });
})();

/* Expose the internals for debugging / automated checks. */
window.KazuApp = {
  Games, WORLDS, Store, Sound, UI, Session, Home, Levels, Result, Book, Parent,
  el, svg, clear, $, $$,
  STICKER_POOL, stickerFor,
  numKana, koKana, tsuKana, banmeKana, jiKana, distractors
};

})();
