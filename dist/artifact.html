<title>かずのぼうけん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;800&family=Baloo+2:wght@700;800&display=swap">
<style>
/* ===========================================================
   かずのぼうけん — stylesheet
   Visual world: 画用紙とクレヨン (drawing paper & crayons)
   =========================================================== */

/* ---------- tokens ---------- */
:root{
  /* ground & ink */
  --paper:      #FBF4E9;   /* warm drawing paper */
  --paper-2:    #F3E9D8;   /* recessed paper */
  --card:       #FFFDF8;   /* card face */
  --card-edge:  #E4D5BC;   /* pencil edge */
  --ink:        #2E2A3F;   /* blue-violet ink, never pure black */
  --ink-soft:   #6C6480;
  --ink-faint:  #A79CB4;

  /* crayons — semantic content colors */
  /* deepened from #F2604C: this red is the numeral the question is about
     (「5 は 3 と いくつ？」) and it sat at 2.93:1 on the paper — under the 3:1 floor
     for large text, let alone the 4.5:1 for the rest. 4.45:1 now, and still a crayon. */
  --c-red:      #CE3D26;
  --c-orange:   #FF9F1C;
  --c-yellow:   #F5C042;
  --c-green:    #46B87A;
  --c-blue:     #3F8FE0;
  --c-purple:   #8E6FD1;
  --c-pink:     #F384AE;
  --c-brown:    #A9784F;

  /* roles */
  --accent:     #FF9F1C;   /* dandelion — primary action */
  --accent-ink: #6E3D00;
  --good:       #46B87A;
  --good-soft:  #DFF3E7;
  /* What goes ON a saturated crayon fill. White was the default and fails on every
     one of them: 2.05:1 on the orange「?」in the number-bond diagram, 2.50:1 on the
     green a child sees the instant they answer correctly, 1.4–2.8:1 across the
     board in dark mode. One dark ink clears 3:1 on every crayon in both themes,
     and 4.5:1 on all but the two that only ever carry big bold numerals. */
  --on-crayon:  #1C1828;
  --good-ink:   #27804F;   /* green as text, e.g. on --good-soft */
  --oops:       #E9829A;   /* soft rose, never alarm red — borders and fills */
  --oops-ink:   #B03E5A;   /* the same warning as text: #E9829A was 2.37:1 */
  --oops-soft:  #FBE6EB;
  --star:       #FFC533;
  --star-edge:  #D08A00;
  /* the stroke a child is asked to trace is the content — it must be clearly visible */
  --trace-guide:#CBE0F7;

  /* effects */
  --shadow:     0 .25em 0 rgba(46,42,63,.16), 0 .8em 1.6em rgba(46,42,63,.10);
  --shadow-sm:  0 .18em 0 rgba(46,42,63,.14);
  --ring:       #3F8FE0;

  /* geometry — slightly irregular, hand-drawn corners */
  --wob-a: 1.4em 1.1em 1.3em 1.2em;
  --wob-b: 1.1em 1.35em 1.15em 1.3em;

  /* scale unit — refined at runtime by JS */
  --u: clamp(7px, min(1.45vw, 1.65vh), 21px);
  /* Anything a five-year-old has to hit never goes below this, whatever --u says.
     Apple's 44pt minimum is written for adult index fingers. */
  --tap: 64px;

  --fs-jp: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4",
           "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --fs-num: "Baloo 2", "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;

  color-scheme: light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:     #171426;
    --paper-2:   #100E1C;
    --card:      #221E36;
    --card-edge: #3B3455;
    --ink:       #F6EFE4;
    --ink-soft:  #B6ADC6;
    --ink-faint: #776D8E;

    --c-red:     #FF7A66;
    --c-orange:  #FFB24A;
    --c-yellow:  #FFD264;
    --c-green:   #5DD08E;
    --c-blue:    #62A8F0;
    --c-purple:  #A98BE8;
    --c-pink:    #FF9CC1;
    --c-brown:   #C9946A;

    --accent:    #FFB24A;
    --accent-ink:#2A1600;
    --good:      #5DD08E;
    --good-soft: #1E3B2C;
    --good-ink:  #5DD08E;
    --oops:      #F5A0B4;
    --oops-ink:  #F5A0B4;
    --oops-soft: #3A2430;
    --star:      #FFD24D;
    --star-edge: #A87400;
    --trace-guide:#39457A;

    --shadow:    0 .25em 0 rgba(0,0,0,.45), 0 .8em 1.6em rgba(0,0,0,.35);
    --shadow-sm: 0 .18em 0 rgba(0,0,0,.4);
    --ring:      #7CB8F5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:     #171426;
  --paper-2:   #100E1C;
  --card:      #221E36;
  --card-edge: #3B3455;
  --ink:       #F6EFE4;
  --ink-soft:  #B6ADC6;
  --ink-faint: #776D8E;
  --c-red:     #FF7A66;
  --c-orange:  #FFB24A;
  --c-yellow:  #FFD264;
  --c-green:   #5DD08E;
  --c-blue:    #62A8F0;
  --c-purple:  #A98BE8;
  --c-pink:    #FF9CC1;
  --c-brown:   #C9946A;
  --accent:    #FFB24A;
  --accent-ink:#2A1600;
  --good:      #5DD08E;
  --good-soft: #1E3B2C;
  --good-ink:  #5DD08E;
  --oops:      #F5A0B4;
  --oops-ink:  #F5A0B4;
  --oops-soft: #3A2430;
  --star:      #FFD24D;
  --star-edge: #A87400;
  --trace-guide:#39457A;
  --shadow:    0 .25em 0 rgba(0,0,0,.45), 0 .8em 1.6em rgba(0,0,0,.35);
  --shadow-sm: 0 .18em 0 rgba(0,0,0,.4);
  --ring:      #7CB8F5;
  color-scheme: dark;
}

/* ---------- reset / stage ---------- */
*, *::before, *::after{ box-sizing: border-box; }

html, body{
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

body{
  background: var(--paper);
  color: var(--ink);
  font-family: var(--fs-jp);
  font-size: calc(var(--u) * 1.6);
  line-height: 1.5;
  font-weight: 500;
  -webkit-user-select: none;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* faint paper tooth */
body::before{
  content:"";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: .5;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,159,28,.055), transparent 45%),
    radial-gradient(circle at 82% 72%, rgba(63,143,224,.055), transparent 45%);
}

#stage{
  touch-action: manipulation;
  position: fixed;
  inset: 0;
  padding: max(env(safe-area-inset-top), calc(var(--u)*.6))
           max(env(safe-area-inset-right), calc(var(--u)*1))
           max(env(safe-area-inset-bottom), calc(var(--u)*1.5))
           max(env(safe-area-inset-left), calc(var(--u)*1));
  display: grid;
  /* An auto track takes its minimum from the item's min-content width, so one
     nowrap row (なんばんめ with eight animals) could widen the whole stage past
     the iPad and take every ancestor's `max-width:100%` with it. */
  grid-template-columns: minmax(0, 1fr);
  z-index: 1;
}

.screen{
  grid-area: 1 / 1;
  min-height: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * .8);
}
.screen[hidden]{ display: none !important; }

.screen.enter{ animation: screenIn .34s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes screenIn{
  from{ opacity: 0; transform: translateY(calc(var(--u)*1.4)) scale(.985); }
  to  { opacity: 1; transform: none; }
}

/* ---------- generic buttons ---------- */
.btn{
  font: inherit;
  font-weight: 800;
  color: var(--ink);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: var(--wob-a);
  padding: calc(var(--u)*.7) calc(var(--u)*1.3);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .12s cubic-bezier(.2,.9,.3,1.4), box-shadow .12s, background .15s;
  touch-action: manipulation;
  display: inline-flex; align-items: center; justify-content: center;
  gap: calc(var(--u)*.5);
  min-height: calc(var(--u)*4.2);
}
.btn:active{ transform: translateY(.18em); box-shadow: none; }
.btn.wrong{ animation: shake .42s; border-color: var(--oops); background: var(--oops-soft); }
.btn.correct{ background: var(--good); border-color: var(--good); color: var(--on-crayon); }
.btn:focus-visible{ outline: calc(var(--u)*.28) solid var(--ring); outline-offset: calc(var(--u)*.2); }

/* Screen changes move focus to the heading for assistive tech. Hide the browser
   ring on that programmatic focus; keep a ring only for real keyboard focus. */
.screen h1:focus,
.screen h2:focus,
.screen [role="heading"]:focus{ outline: none; }
.screen h1:focus-visible,
.screen h2:focus-visible,
.screen [role="heading"]:focus-visible{
  outline: calc(var(--u)*.28) solid var(--ring);
  outline-offset: calc(var(--u)*.2);
}

.btn-accent{
  background: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 72%, var(--ink) 28%);
  color: var(--accent-ink);
}
.btn-ghost{ background: transparent; border-color: transparent; box-shadow: none; }
.btn-ghost:active{ transform: scale(.94); }

.btn-round{
  width: calc(var(--u)*4.4); height: calc(var(--u)*4.4);
  min-height: 0; padding: 0; border-radius: 50%;
  font-size: calc(var(--u)*2);
}

/* ---------- top bar ---------- */
.topbar{
  display: flex; align-items: center; gap: calc(var(--u)*.8);
  flex: 0 0 auto;
}
.topbar h2{
  margin: 0;
  font-size: calc(var(--u)*2);
  font-weight: 800;
  letter-spacing: .02em;
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* progress pips */
.pips{ display: flex; gap: calc(var(--u)*.35); flex: 0 0 auto; }
.pip{
  width: calc(var(--u)*1.05); height: calc(var(--u)*1.05);
  border-radius: 50%;
  background: var(--card-edge);
  transition: background .3s, transform .3s;
}
.pip.done{ background: var(--good); }
.pip.miss{ background: var(--oops); }
.pip.now { background: var(--accent); transform: scale(1.35); }

/* ---------- play area ---------- */
.prompt{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: calc(var(--u)*.8);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: var(--wob-b);
  padding: calc(var(--u)*.6) calc(var(--u)*1);
  box-shadow: var(--shadow-sm);
}
.prompt .txt{
  flex: 1 1 auto;
  font-size: calc(var(--u)*2.1);
  font-weight: 800;
  line-height: 1.25;
  text-wrap: balance;
}
.prompt .txt b{ color: var(--c-red); font-family: var(--fs-num); font-size: 1.25em; }

.playfield{
  flex: 1 1 auto;
  min-height: 0;
  min-width: 0;
  width: 100%;
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u)*1);
  padding: calc(var(--u)*.4);
}

.choices{
  flex: 0 0 auto;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: calc(var(--u)*1.5);
  padding-top: calc(var(--u)*.2);
}

.choice{
  font-family: var(--fs-num);
  font-weight: 800;
  font-size: calc(var(--u)*3.6);
  line-height: 1;
  min-width: calc(var(--u)*8.4);
  min-height: calc(var(--u)*6.8);
  padding: calc(var(--u)*.6) calc(var(--u)*1);
  background: var(--card);
  color: var(--ink);
  border: calc(var(--u)*.26) solid var(--card-edge);
  border-radius: var(--wob-a);
  box-shadow: var(--shadow);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform .12s cubic-bezier(.2,.9,.3,1.4), box-shadow .12s, background .2s, border-color .2s;
}
.choice:active{ transform: translateY(.2em) scale(.98); box-shadow: var(--shadow-sm); }
.choice:focus-visible{ outline: calc(var(--u)*.28) solid var(--ring); outline-offset: calc(var(--u)*.24); }
.choice.pic{ font-family: var(--fs-jp); font-size: calc(var(--u)*2.6); }
.choice.correct{ background: var(--good); border-color: var(--good); color: var(--on-crayon); animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
.choice.wrong{ background: var(--oops-soft); border-color: var(--oops); animation: shake .42s; }
.choice.dim{ opacity: .32; pointer-events: none; filter: saturate(.4); }
.choice[disabled]{ pointer-events: none; }

@keyframes pop{ 0%{transform:scale(1)} 45%{transform:scale(1.16)} 100%{transform:scale(1)} }
@keyframes shake{
  0%,100%{ transform: translateX(0) }
  15%{ transform: translateX(-.35em) rotate(-2deg) }
  35%{ transform: translateX(.35em) rotate(2deg) }
  55%{ transform: translateX(-.22em) rotate(-1.2deg) }
  78%{ transform: translateX(.16em) }
}
@keyframes wiggle{
  0%,100%{ transform: rotate(0) }
  25%{ transform: rotate(-5deg) } 75%{ transform: rotate(5deg) }
}
@keyframes floatY{
  0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-.35em) }
}

/* ---------- counting objects ---------- */
.objfield{
  position: relative;
  width: 100%; height: 100%;
  min-height: calc(var(--u)*16);
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-a);
  box-shadow: inset 0 calc(var(--u)*.3) calc(var(--u)*1) rgba(46,42,63,.05);
  overflow: hidden;
}
.obj{
  position: absolute;
  padding: calc(var(--u)*.8);          /* hit area, not visual size */
  display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--u)*5);
  line-height: 1;
  cursor: pointer;
  transform: translate(-50%,-50%);
  transition: transform .18s cubic-bezier(.2,.9,.3,1.5), filter .18s, opacity .3s;
  will-change: transform;
}
.obj:active{ transform: translate(-50%,-50%) scale(1.14); }
.obj.counted{ filter: drop-shadow(0 0 calc(var(--u)*.5) var(--good)); }
/* inside the object's own box: hung outside it, the badge on a flower near the
   edge was cut by the board — and the last number said is the answer */
.obj .tag{
  position: absolute;
  top: 0; right: 0;
  font-family: var(--fs-num); font-weight: 800;
  font-size: .42em; line-height: 1;
  color: var(--on-crayon); background: var(--good);
  border-radius: 50%;
  width: 1.5em; height: 1.5em;
  display: flex; align-items: center; justify-content: center;
  animation: pop .34s cubic-bezier(.2,.9,.3,1.6);
  box-shadow: 0 .1em .2em rgba(0,0,0,.2);
}
.obj.picked{ filter: drop-shadow(0 0 calc(var(--u)*.55) var(--accent)); }
.obj.picked::after{
  content:""; position:absolute; inset:-12%;
  border: calc(var(--u)*.26) dashed var(--accent);
  border-radius: 50%;
}

/* rows / groups of items */
.row{ display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: calc(var(--u)*.5); }
.item{ font-size: calc(var(--u)*3.6); line-height: 1; }

.plate{
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-b);
  padding: calc(var(--u)*1);
  box-shadow: var(--shadow);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .14s cubic-bezier(.2,.9,.3,1.4), border-color .2s, background .2s;
  min-width: calc(var(--u)*14);
  min-height: calc(var(--u)*13);
}
.plate:active{ transform: scale(.97); }
.plate.correct{ border-color: var(--good); background: var(--good-soft); animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
.plate.wrong{ border-color: var(--oops); background: var(--oops-soft); animation: shake .42s; }

/* ---------- mascot ---------- */
.mascot{ width: calc(var(--u)*7); height: calc(var(--u)*7); flex: 0 0 auto; }
.mascot.talk{ animation: floatY 1.8s ease-in-out infinite; }
.mascot.cheer{ animation: wiggle .5s ease-in-out 3; }

/* ---------- toast / feedback ---------- */
#fx{ position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
.confetti{
  position: absolute; width: calc(var(--u)*.9); height: calc(var(--u)*1.4);
  border-radius: .2em;
  will-change: transform, opacity;
}
.bigmark{
  position: fixed; left: 50%; top: 46%;
  transform: translate(-50%,-50%);
  font-size: calc(var(--u)*16);
  z-index: 95; pointer-events: none;
  animation: markIn .75s cubic-bezier(.2,.9,.3,1.4) both;
}
@keyframes markIn{
  0%{ opacity:0; transform: translate(-50%,-50%) scale(.4) rotate(-14deg) }
  40%{ opacity:1; transform: translate(-50%,-50%) scale(1.06) rotate(3deg) }
  75%{ opacity:1; transform: translate(-50%,-50%) scale(1) rotate(0) }
  100%{ opacity:0; transform: translate(-50%,-50%) scale(1.1) }
}

/* ===========================================================
   HOME — たんけんマップ
   =========================================================== */
#home{ gap: calc(var(--u)*.7); }

.home-head{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: calc(var(--u)*1);
}
.logo{
  display: flex; align-items: baseline; gap: calc(var(--u)*.5);
  font-size: calc(var(--u)*2.9); font-weight: 800; letter-spacing: .04em;
  margin: 0;
}
.logo .k{ color: var(--c-red); }
.logo .n{ color: var(--c-blue); }
.logo .b{ color: var(--c-green); }
.home-head .spacer{ flex: 1 1 auto; }

.starcount{
  display: inline-flex; align-items: center; gap: calc(var(--u)*.4);
  font-family: var(--fs-num); font-weight: 800;
  font-size: calc(var(--u)*2.2);
  color: var(--ink);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: 999px;
  padding: calc(var(--u)*.3) calc(var(--u)*1.1);
  box-shadow: var(--shadow-sm);
}
.starcount svg{ width: calc(var(--u)*2); height: calc(var(--u)*2); }

/* daily practice banner */
.daily{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: calc(var(--u)*1);
  background: linear-gradient(105deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--c-pink)));
  color: var(--accent-ink);
  border: calc(var(--u)*.26) solid color-mix(in srgb, var(--accent) 65%, var(--ink) 35%);
  border-radius: var(--wob-a);
  padding: calc(var(--u)*.7) calc(var(--u)*1.2);
  box-shadow: var(--shadow);
  cursor: pointer;
  text-align: left;
  transition: transform .14s cubic-bezier(.2,.9,.3,1.4), box-shadow .14s;
}
.daily:active{ transform: translateY(.2em); box-shadow: var(--shadow-sm); }
.daily .t{ font-size: calc(var(--u)*2.1); font-weight: 800; line-height: 1.2; }
.daily .s{ font-size: calc(var(--u)*1.4); font-weight: 500; opacity: .82; }
.daily .grow{ flex: 1 1 auto; min-width: 0; }
.daily .mascot{ width: calc(var(--u)*5.6); height: calc(var(--u)*5.6); }
/* each banner's own picture: the thing a child who cannot read yet tells them apart by */
.daily .ico{ font-size: calc(var(--u)*3.6); line-height: 1; flex: 0 0 auto; }
.daily.done{
  background: var(--good-soft);
  color: var(--ink);
  border-color: var(--good);
}
.daily .go{ font-size: calc(var(--u)*2.4); line-height: 1; flex: 0 0 auto; }

/* The daily sets share one row. Each of the four (おすすめ / きょうの れんしゅう /
   きのうの ミッション / にがて あつめ) used to be a full-width banner of its own,
   so on a busy day the map they lead to was a strip at the bottom of the screen.
   One row, never wrapping: with one banner it fills the width exactly as before,
   with four they are quarters and the long subtitles clip. */
.dailies{
  flex: 0 0 auto;
  display: flex; flex-wrap: nowrap; align-items: stretch;
  gap: calc(var(--u)*.7);
}
.dailies > .daily{
  flex: 1 1 0; min-width: 0;
  gap: calc(var(--u)*.7);
  padding: calc(var(--u)*.6) calc(var(--u)*1);
}
.dailies > .daily .t{ font-size: calc(var(--u)*1.8); }
.dailies > .daily .s{ font-size: calc(var(--u)*1.25); }
/* one line each: a banner that wraps is a banner that grows the row back */
.dailies > .daily .t,
.dailies > .daily .s{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dailies > .daily .mascot{ width: calc(var(--u)*4.4); height: calc(var(--u)*4.4); }
.dailies > .daily .go{ font-size: calc(var(--u)*2); }
.dailies > .daily .ico{ font-size: calc(var(--u)*3); }
/* three or four banners at once: the picture is how a child who cannot read yet
   tells them apart, so it stays; the small print under the name goes instead */
.dailies.n3 > .daily .t,
.dailies.n4 > .daily .t{ font-size: calc(var(--u)*1.55); }
/* with the small print gone there is room for the name to take two lines instead
   of being cut to「いまの おす…」 */
.dailies.n3 > .daily .t,

.dot{
  width: 74%; height: 74%; border-radius: 50%;
  background: var(--dc, var(--c-blue));
  box-shadow: inset 0 calc(var(--u)*-.25) 0 rgba(0,0,0,.12);
  animation: pop .3s cubic-bezier(.2,.9,.3,1.6);
}
.dot.b{ --dc: var(--c-red); }
.cell.hole{ background: var(--paper-2); box-shadow: inset 0 0 0 calc(var(--u)*.22) var(--card-edge); }
.cell.q{ background: var(--accent); }
.cell.q::after{ content:"?"; font-family: var(--fs-num); font-weight:800; color: var(--on-crayon); font-size: calc(var(--u)*2.6); }

/* number bond house (いくつと いくつ) */
.bond{
  display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*.5);
}
.bond .whole{
  font-family: var(--fs-num); font-weight: 800; font-size: calc(var(--u)*4.4);
  width: calc(var(--u)*8); height: calc(var(--u)*8);
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: var(--c-purple); color: var(--on-crayon);
  box-shadow: var(--shadow);
}
.bond .legs{ width: calc(var(--u)*22); height: calc(var(--u)*3); }
.bond .parts{ display: flex; gap: calc(var(--u)*2.4); }
.bond .part{
  min-width: calc(var(--u)*8); min-height: calc(var(--u)*8);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--fs-num); font-weight: 800; font-size: calc(var(--u)*4);
  border-radius: var(--wob-b);
  background: var(--card);
  border: calc(var(--u)*.3) solid var(--card-edge);
  box-shadow: var(--shadow-sm);
}
.bond .part.known{ background: var(--c-blue); color: var(--on-crayon); border-color: var(--c-blue); }
.bond .part.unknown{ background: var(--accent); color: var(--on-crayon); border-color: var(--accent); animation: floatY 1.6s ease-in-out infinite; }

/* ===========================================================
   EQUATION strip  (しき)
   =========================================================== */
.eq{
  display: flex; align-items: center; justify-content: center;
  gap: calc(var(--u)*.7);
  font-family: var(--fs-num); font-weight: 800;
  font-size: calc(var(--u)*4.6);
  color: var(--ink);
}
.eq .box{
  min-width: calc(var(--u)*6.4); height: calc(var(--u)*6.4);
  display: inline-flex; align-items: center; justify-content: center;
  border: calc(var(--u)*.3) dashed var(--accent);
  border-radius: calc(var(--u)*.9);
  color: var(--accent);
}
.eq .box.filled{ border-style: solid; background: var(--good); border-color: var(--good); color: var(--on-crayon); }
.eq .op{ color: var(--c-red); }

/* ===========================================================
   STORY SCENE (たしざん / ひきざん)
   =========================================================== */
.scene{
  position: relative;
  width: min(100%, calc(var(--u)*54));
  height: calc(var(--u)*22);
  background: var(--card);
  border: calc(var(--u)*.26) solid var(--card-edge);
  border-radius: var(--wob-a);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.scene .ground{
  position: absolute; left:0; right:0; bottom:0; height: 58%;
  background: color-mix(in srgb, var(--c-green) 22%, var(--card));
}
.scene .pond{
  position: absolute; left:0; right:0; bottom:0; height: 58%;
  background: color-mix(in srgb, var(--c-blue) 26%, var(--card));
}
.actor{
  position: absolute;
  font-size: calc(var(--u)*3.8); line-height: 1;
  transform: translate(-50%,-50%);
  transition: left .7s cubic-bezier(.3,.8,.4,1), transform .7s cubic-bezier(.3,.8,.4,1), opacity .5s;
  will-change: transform, opacity;
}
.actor.leaving{ opacity: 0; }

/* ===========================================================
   DRAG & BINS (なかまわけ)
   =========================================================== */
.bins{ display: flex; gap: calc(var(--u)*1.2); justify-content: center; flex-wrap: wrap; }
.bin{
  min-width: calc(var(--u)*17); min-height: calc(var(--u)*15);
  border: calc(var(--u)*.32) dashed var(--bc, var(--card-edge));
  border-radius: var(--wob-a);
  background: color-mix(in srgb, var(--bc, var(--card-edge)) 12%, var(--card));
  padding: calc(var(--u)*.6);
  display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*.3);
  transition: transform .16s, background .2s, border-color .2s;
}
.bin .lbl{ font-size: calc(var(--u)*1.6); font-weight: 800; color: var(--bc); }
.bin .hold{ display: flex; flex-wrap: wrap; gap: calc(var(--u)*.3); justify-content: center; align-content: flex-start; flex: 1 1 auto; }
.bin .hold .item{ font-size: calc(var(--u)*2.8); animation: pop .3s cubic-bezier(.2,.9,.3,1.6); }
.bin.over{ transform: scale(1.05); background: color-mix(in srgb, var(--bc) 26%, var(--card)); border-style: solid; }
.bin.nope{ animation: shake .4s; }

.tray{
  display: flex; flex-wrap: wrap; gap: calc(var(--u)*.7); justify-content: center;
  min-height: calc(var(--u)*7);
  align-items: center;
}
.tile{
  font-size: calc(var(--u)*3.8); line-height: 1;
  padding: calc(var(--u)*.45);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: var(--wob-b);
  box-shadow: var(--shadow-sm);
  cursor: grab;
  touch-action: none;
  transition: transform .14s, box-shadow .14s, opacity .3s;
}
.tile.sel{ border-color: var(--accent); box-shadow: 0 0 0 calc(var(--u)*.28) color-mix(in srgb, var(--accent) 45%, transparent), var(--shadow-sm); transform: translateY(calc(var(--u)*-.4)); }
.tile.dragging{ opacity: .25; }
.tile.gone{ opacity: 0; transform: scale(.4); pointer-events: none; }
#ghost{
  position: fixed; z-index: 100; pointer-events: none;
  transform: translate(-50%,-50%) scale(1.2) rotate(-4deg);
  filter: drop-shadow(0 .3em .5em rgba(0,0,0,.3));
}
/* the puzzle piece is carried at the exact size of the hole, so it must not be
   scaled or tilted on the way there */
#ghost.piece-ghost{ transform: translate(-50%,-50%); }
#ghost.piece-ghost svg{ display: block; overflow: visible; }

/* ===========================================================
   PATTERN TRAIN
   =========================================================== */
.train{
  display: flex; align-items: center; gap: calc(var(--u)*.4);
  flex-wrap: nowrap; justify-content: center;   /* a pattern must read as one line */
  max-width: 100%; overflow-x: auto; padding: calc(var(--u)*.3);
  scrollbar-width: none;
}
.train::-webkit-scrollbar{ display: none; }
.car{
  flex: 0 0 auto;
  width: calc(var(--u)*6); height: calc(var(--u)*6);
  display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--u)*3.2);
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-b);
  box-shadow: var(--shadow-sm);
}
.car.blank{
  border-style: dashed; border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, var(--card));
  animation: floatY 1.8s ease-in-out infinite;
}
.car.blank::after{ content:"?"; font-family: var(--fs-num); font-weight: 800; color: var(--accent); }
.car.filled{ border-color: var(--good); }
.car.filled::after{ content: none; }

/* ===========================================================
   ORDINAL LINE (なんばんめ)
   =========================================================== */
.queue{
  display: flex; align-items: flex-end; gap: calc(var(--u)*1);
  flex-wrap: nowrap; overflow-x: auto; max-width: 100%;
  padding: calc(var(--u)*.6);
  scrollbar-width: none;
}
.queue::-webkit-scrollbar{ display: none; }
.qi{
  flex: 0 0 auto;
  width: calc(var(--u)*7); height: calc(var(--u)*8);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  font-size: calc(var(--u)*4);
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-b);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .14s cubic-bezier(.2,.9,.3,1.4), border-color .2s, background .2s;
}
.qi:active{ transform: translateY(.15em) scale(.97); }
.qi.correct{ border-color: var(--good); background: var(--good-soft); animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
.qi.wrong{ border-color: var(--oops); background: var(--oops-soft); animation: shake .4s; }
.qi.marked{ border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--card)); }
.dirmark{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: calc(var(--u)*.3);
  font-size: calc(var(--u)*1.5); font-weight: 800; color: var(--c-red);
  white-space: nowrap;
}
.dirmark svg{ width: calc(var(--u)*3); height: calc(var(--u)*1.6); }

/* grid variant */
.qgrid{
  display: grid; gap: calc(var(--u)*.5);
  grid-template-columns: repeat(var(--gc,4), calc(var(--u)*6.4));
}
.qgrid .qi{ width: auto; height: calc(var(--u)*6.4); font-size: calc(var(--u)*3.2); justify-content: center; }

/* ===========================================================
   NUMBER LINE
   =========================================================== */
.numline{
  display: flex; align-items: center; gap: calc(var(--u)*.35);
  flex-wrap: wrap; justify-content: center;
  max-width: 100%;
}
.nn{
  width: calc(var(--u)*5); height: calc(var(--u)*5.4);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--fs-num); font-weight: 800; font-size: calc(var(--u)*2.6);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: calc(var(--u)*.8);
  box-shadow: var(--shadow-sm);
}
.nn.gap{
  border-style: dashed; border-color: var(--accent);
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, var(--card));
}
.nn.gap.now{ animation: floatY 1.5s ease-in-out infinite; box-shadow: 0 0 0 calc(var(--u)*.26) color-mix(in srgb,var(--accent) 40%, transparent); }
.nn.gap.filled{ border-style: solid; border-color: var(--good); background: var(--good-soft); color: var(--ink); }

/* ===========================================================
   CLOCK
   =========================================================== */
.clockwrap{ display:flex; gap: calc(var(--u)*1.4); align-items:center; flex-wrap: wrap; justify-content: center; }
.clock{ width: calc(var(--u)*22); height: calc(var(--u)*22); touch-action: none; }
.clock.pickable{ cursor: pointer; }
.clock-choice{
  padding: calc(var(--u)*.4);
  background: var(--card);
  border: calc(var(--u)*.26) solid var(--card-edge);
  border-radius: var(--wob-a);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .14s, border-color .2s, background .2s;
}
.clock-choice .clock{ width: calc(var(--u)*13); height: calc(var(--u)*13); }
.clock-choice:active{ transform: scale(.96); }
.clock-choice.correct{ border-color: var(--good); background: var(--good-soft); animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
.clock-choice.wrong{ border-color: var(--oops); background: var(--oops-soft); animation: shake .4s; }

/* ===========================================================
   TRACING (すうじを なぞろう)
   =========================================================== */
.tracebox{
  position: relative;
  width: calc(var(--u)*30); height: calc(var(--u)*30);
  max-width: 100%;
  background: var(--card);
  border: calc(var(--u)*.26) solid var(--card-edge);
  border-radius: var(--wob-a);
  box-shadow: var(--shadow-sm);
  touch-action: none;
  overflow: hidden;
}
.tracebox svg{ position: absolute; inset: 0; width: 100%; height: 100%; }
.trace-guide{ stroke: var(--trace-guide); }
.trace-outline{ stroke: var(--ink-faint); stroke-dasharray: 2 5; }
.trace-done{ stroke: var(--c-blue); }
.trace-live{ stroke: var(--accent); }
.trace-start{ fill: var(--c-red); }
.trace-start.pulse{ animation: startPulse 1.2s ease-in-out infinite; transform-origin: center; }
@keyframes startPulse{ 0%,100%{ opacity: 1 } 50%{ opacity: .35 } }
.trace-numlabel{
  position: absolute; top: calc(var(--u)*.4); left: calc(var(--u)*.8);
  font-family: var(--fs-num); font-weight: 800;
  font-size: calc(var(--u)*1.6); color: var(--ink-soft);
}

/* ===========================================================
   MEASUREMENT (おおきさくらべ)
   =========================================================== */
.measure{ display:flex; flex-direction: column; gap: calc(var(--u)*1); align-items: stretch; width: min(100%, calc(var(--u)*52)); }
.mrow{
  display: flex; align-items: center; gap: calc(var(--u)*.8);
  padding: calc(var(--u)*.5) calc(var(--u)*.8);
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-b);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: transform .14s, border-color .2s, background .2s;
}
.mrow:active{ transform: scale(.985); }
.mrow.correct{ border-color: var(--good); background: var(--good-soft); animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
.mrow.wrong{ border-color: var(--oops); background: var(--oops-soft); animation: shake .4s; }
.mrow.picked{ border-color: var(--accent); }
.mrow .cap{ font-size: calc(var(--u)*2.4); flex: 0 0 auto; }
/* A picture-graph row is labelled with a word, at a fixed width so every row's
   items still start on the same line. An emoji here would be one more of the very
   things the child has been asked to count. */
.mrow .cap.caplbl{
  width: calc(var(--u)*7); text-align: right;
  font-size: calc(var(--u)*1.5); font-weight: 800; line-height: 1.15;
  color: var(--ink-soft);
}
/* two rows a child pairs off by eye: a line break destroys the correspondence */
.row.pairline{ flex-wrap: nowrap; justify-content: flex-start; }
.mrow .track{ flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }
.mrow .track .gap{ flex: 0 0 auto; }
.mrow .stickbar{
  flex: 0 0 auto;
  height: calc(var(--u)*2.4); border-radius: 999px;
  background: var(--mc, var(--c-orange));
  box-shadow: inset 0 calc(var(--u)*-.3) 0 rgba(0,0,0,.12);
}
.mrow .ordno{
  font-family: var(--fs-num); font-weight: 800; font-size: calc(var(--u)*1.8);
  width: calc(var(--u)*3); height: calc(var(--u)*3); flex: 0 0 auto;
  border-radius: 50%; background: var(--accent); color: var(--on-crayon);
  display: flex; align-items: center; justify-content: center;
}
.vessels{ display: flex; gap: calc(var(--u)*1.6); align-items: flex-end; justify-content: center; }
.vessel{
  display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*.4);
  cursor: pointer;
  padding: calc(var(--u)*.5);
  border: calc(var(--u)*.26) solid transparent;
  border-radius: var(--wob-b);
  transition: transform .14s, border-color .2s, background .2s;
}
.vessel:active{ transform: scale(.97); }
.vessel.correct{ border-color: var(--good); background: var(--good-soft); }
.vessel.wrong{ border-color: var(--oops); background: var(--oops-soft); animation: shake .4s; }
.vessel svg{ display: block; }

/* ===========================================================
   SHAPE PUZZLE
   =========================================================== */
.shapefield{
  /* The picture must keep its own size. As a shrinkable flex item it collapsed to
     a letterbox on the iPad — the fit search only checks that nothing sticks out of
     the playfield, so a squashed picture reads as "fits" and --u grows again. The
     holes then ended up several times smaller than the tray tiles they take. */
  flex: 0 0 auto;
  position: relative;
  width: min(100%, calc(var(--u)*36));
  height: calc(var(--u)*28.8);
  background: var(--card);
  border: calc(var(--u)*.26) solid var(--card-edge);
  border-radius: var(--wob-a);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  touch-action: none;
}
.shapefield svg{ position: absolute; inset: 0; width: 100%; height: 100%; }
.shapes-tray{ flex: 0 0 auto; display: flex; gap: calc(var(--u)*.8); flex-wrap: wrap; justify-content: center; }
.shapetile{
  width: calc(var(--u)*7.6); height: calc(var(--u)*7.6);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: var(--wob-b);
  box-shadow: var(--shadow-sm);
  cursor: pointer; touch-action: none;
  display: flex; align-items: center; justify-content: center;
  transition: transform .14s, opacity .3s, box-shadow .14s;
}
.shapetile.sel{ border-color: var(--accent); box-shadow: 0 0 0 calc(var(--u)*.26) color-mix(in srgb,var(--accent) 45%, transparent); transform: translateY(calc(var(--u)*-.4)); }
.shapetile.used{ opacity: .18; pointer-events: none; }
.shapetile.dragging{ opacity: .25; }
.shapetile svg{ width: 84%; height: 84%; }

.shapegrid{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: calc(var(--u)*1.1);
  width: min(100%, calc(var(--u)*46));
}
.shapebtn{
  aspect-ratio: 1;
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-b);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  padding: calc(var(--u)*.5);
  transition: transform .14s, border-color .2s, background .2s;
}
.shapebtn:active{ transform: scale(.95); }
.shapebtn svg{ width: 100%; height: 100%; }
.shapebtn.correct{ border-color: var(--good); background: var(--good-soft); animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
.shapebtn.wrong{ border-color: var(--oops); background: var(--oops-soft); animation: shake .4s; }
.shapebtn.picked{ border-color: var(--accent); background: color-mix(in srgb,var(--accent) 14%, var(--card)); }

/* ===========================================================
   MISC
   =========================================================== */
.hintline{
  font-size: calc(var(--u)*1.35);
  color: var(--ink-soft);
  background: var(--paper-2);
  border-radius: 999px;
  padding: calc(var(--u)*.3) calc(var(--u)*1.1);
  /* the pill's own padding can push a long line a few pixels past the playfield,
     which the auto-scaler then has to shrink the whole question to fix */
  max-width: 100%; box-sizing: border-box; text-align: center;
  animation: pop .35s cubic-bezier(.2,.9,.3,1.5);
}
.sr{ position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  /* The big ◯ is not decoration, it is the answer being right — and cut to
     .01ms, an animation that ends at opacity 0 showed nothing at all. Still,
     not moving: on, held, then gone. */
  .bigmark{ animation: markStill .75s linear both !important; }
}
@keyframes markStill{
  0%, 80%{ opacity: 1 }
  100%{ opacity: 0 }
}

/* ===========================================================
   Feedback, hints and the widgets added after review
   =========================================================== */

/* A wrong answer must be visible, not only audible: plenty of iPads have no
   Japanese voice installed, and those children were getting nothing at all. */
.prompt .txtwrap{ flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u)*.25); }
.feedback{
  align-self: flex-start;
  display: inline-flex; align-items: center; gap: calc(var(--u)*.4);
  /* on a device with no Japanese voice this bubble is the only thing that answers
     a mistake, so it has to be readable by a child who has just started reading:
     1.35u was 17px on a 1024 iPad and under 15px on an iPad mini held upright */
  font-size: max(20px, calc(var(--u)*1.5)); font-weight: 800;
  border-radius: 999px;
  padding: calc(var(--u)*.2) calc(var(--u)*.9);
}
.feedback .mk{ font-size: 1.15em; }
.feedback.oops{ background: var(--oops-soft); color: color-mix(in srgb, var(--oops) 55%, var(--ink)); }
.feedback.hint{ background: color-mix(in srgb, var(--accent) 18%, var(--card)); color: var(--accent-ink); }
/* the way out, once the ladder has run out of rungs: offered, not forced — among
   the answers, at the size of an answer */
.choices .teachbtn{
  font-size: calc(var(--u)*1.8); font-weight: 800;
  padding: calc(var(--u)*.3) calc(var(--u)*1.4);
  min-height: var(--tap); min-width: var(--tap);
  border-radius: 999px;
  border: calc(var(--u)*.24) solid var(--accent); color: var(--accent-ink);
  background: var(--card); box-shadow: var(--shadow-sm);
}
.choices .teachbtn .bi{ font-size: 1.3em; line-height: 1; margin-right: .3em; }
/* in the 6 + 5 keypad grid it gets a row of its own rather than a keypad cell */
.choices.pad .teachbtn{ grid-column: 1 / -1; }
.feedback{ flex-wrap: wrap; }
/* the answer, about to be pressed for the child — it has to be watchable */
.choice.showme{
  border-color: var(--accent); background: color-mix(in srgb, var(--accent) 26%, var(--card));
  animation: showme .7s ease-in-out 2;
}
@keyframes showme{ 0%,100%{ transform: none } 50%{ transform: scale(1.12) } }
@media (prefers-reduced-motion: reduce){ .choice.showme{ animation: none } }

/* a tried-and-wrong answer keeps a quiet mark, so the child can see what is ruled out */
.choice.tried{ border-color: var(--oops); }
.choice.tried::after{
  content: ""; position: absolute; inset: auto calc(var(--u)*.4) calc(var(--u)*.3) auto;
  width: calc(var(--u)*.7); height: calc(var(--u)*.7); border-radius: 50%;
  background: var(--oops);
}
.choice{ position: relative; }
.choice.glow, .bin.glow, .shapetile.glow{
  box-shadow: 0 0 0 calc(var(--u)*.32) color-mix(in srgb, var(--accent) 60%, transparent), var(--shadow);
}
polygon.glow{ stroke: var(--accent) !important; stroke-width: 2.6 !important; }
.btn.primary{ font-size: calc(var(--u)*2.1); padding: calc(var(--u)*1.05) calc(var(--u)*2.4); }

/* number line: which "?" is being asked has to be unmistakable */
.nn.gap:not(.now){ opacity: .38; }
.nn.gap.now{

}

/* the hole the child just filled: their answer, written into the run of numbers */

/* the basket the prompt keeps talking about */
.basket{
  position: absolute; right: calc(var(--u)*.8); bottom: calc(var(--u)*.8);
  min-width: calc(var(--u)*13);
  display: grid; grid-template-columns: auto 1fr auto; align-items: center;

}
.basket .b{ font-size: calc(var(--u)*3); line-height: 1; }
.basket .items{ display: flex; flex-wrap: wrap; gap: calc(var(--u)*.1); max-width: calc(var(--u)*8); font-size: calc(var(--u)*1.2); }

}

/* every plate is the same size, so width can no longer give the answer away */
.plate.fixed{ min-width: 0; width: calc(var(--u)*17); height: calc(var(--u)*10.5); padding: calc(var(--u)*.6); }
.slots{

}

}

/* measurement hints */
.mrow.nexthint{ border-color: var(--accent); box-shadow: 0 0 0 calc(var(--u)*.24) color-mix(in srgb, var(--accent) 45%, transparent); }
.measure.lined .mrow{ border-left: calc(var(--u)*.4) solid var(--accent); }

/* two-axis grid needs to say where counting starts */
.axes{ display: flex; flex-direction: column; gap: calc(var(--u)*.4); align-items: flex-start; }

.axis-x, .axis-y{

}
.axis-x svg, .axis-y svg{ width: calc(var(--u)*2.6); height: calc(var(--u)*1.4); }
.axis-y{ flex-direction: column; gap: 0; }
.axis-y svg{ transform: rotate(90deg); }
.qi.rowhint{ box-shadow: 0 calc(var(--u)*-.3) 0 var(--accent) inset; }
.qi.colhint{ box-shadow: calc(var(--u)*.3) 0 0 var(--accent) inset; }
.qi.rowhint.colhint{ box-shadow: 0 calc(var(--u)*-.3) 0 var(--accent) inset, calc(var(--u)*.3) 0 0 var(--accent) inset; }

/* addition keeps its two groups apart, and the equation is tinted to match */

.actor.g2{ filter: drop-shadow(0 0 calc(var(--u)*.45) color-mix(in srgb, var(--c-red) 70%, transparent)); }
.eq .n1{ color: var(--c-blue); }

/* "how many have I found" for the shape hunt */
.tally{ display: flex; align-items: center; gap: calc(var(--u)*.4); }
.tally .lbl{ font-size: calc(var(--u)*1.35); font-weight: 800; color: var(--ink-soft); }

}

.tile.shapetile2{ display: flex; align-items: center; justify-content: center; padding: calc(var(--u)*.5); }
.bin .hold .item svg{ width: calc(var(--u)*2.4); height: calc(var(--u)*2.4); display: block; }

.car.now{ border-color: var(--accent); box-shadow: 0 0 0 calc(var(--u)*.26) color-mix(in srgb, var(--accent) 45%, transparent); }

/* the reward is the point of the screen; it should not be its smallest element */

/* scroll containers must not hide their start when content overflows */
.levels{ justify-content: safe center; }

.queue{ justify-content: safe center; }

/* backup box on the parent page */
.backupbox{

  font-size: calc(var(--u)*1.1);

/* ---------- result: the facts that were shaky this session ---------- */

  font-family:var(--fs-num); font-weight:800; font-size:calc(var(--u)*1.7); color:var(--ink);
}

/* ---------- ぱっと みて いくつ ----------
   The dots have to be genuinely gone when the cover is up, and genuinely legible
   in the moment they are not. Nothing here animates in: the whole task is the
   difference between what was on screen for 0.9s and what the child kept. */
.flashboard{
  position: relative;
  padding: calc(var(--u)*1.6);
  background: var(--card);
  border: calc(var(--u)*.26) solid var(--card-edge);
  border-radius: var(--wob-a);
  box-shadow: var(--shadow-sm);
}

.flashcover{
  position: absolute; inset: 0;
  display: grid; place-items: center;
  background: var(--paper-2);

  font-size: calc(var(--u)*5); line-height: 1;
  transition: opacity .12s linear;
}

.dice{ display: grid; grid-template-columns: repeat(3, auto); gap: calc(var(--u)*.6); }
.flashrows{ display: grid; gap: calc(var(--u)*.6); }
.frow{ display: grid; grid-template-columns: repeat(5, auto); gap: calc(var(--u)*.6); }
.fdot{
  width: calc(var(--u)*2.6); height: calc(var(--u)*2.6);

}

.fdot.on.b{ background: var(--c-red); }

.choice.flashgo{ font-size: calc(var(--u)*2.2); }

/* ---------- 「かぞえないで こたえられた」 ----------
   ★★★ says every answer was right first time. This says they arrived rather than
   being worked out, which is what these levels are actually for. */
#result .swift{
  display:flex; align-items:center; justify-content:center; gap:calc(var(--u)*.5);
  margin-top:calc(var(--u)*.8);
  padding:calc(var(--u)*.45) calc(var(--u)*1.2);
  background:color-mix(in srgb, var(--star) 26%, var(--card));
  border:calc(var(--u)*.16) solid var(--star-edge);
  border-radius:var(--wob-b);
  font-weight:800; font-size:calc(var(--u)*1.6); color:var(--ink);
}
#result .swift .mk{ font-size:calc(var(--u)*2) }
.levelcard .swiftmark{
  flex:0 0 auto; font-size:calc(var(--u)*1.7); line-height:1;
  filter:drop-shadow(0 0 calc(var(--u)*.3) color-mix(in srgb, var(--star) 70%, transparent));
}

/* ---------- home: the aimed practice set ----------
   A quieter second door than きょうの れんしゅう: the daily habit stays the loud
   one, and this appears only when there is actually something to aim at. */
.daily.focusset{
  background: linear-gradient(105deg, var(--card), color-mix(in srgb, var(--c-blue) 15%, var(--card)));
  color: var(--ink);

}

}

}

}

/* ---------- parent: 今週やること ---------- */
#parent .todo{

}

}
#parent .todo b{ display:block }
#parent .factchips{ display:flex; flex-wrap:wrap; gap:calc(var(--u)*.4); margin:calc(var(--u)*.5) 0 }

}
#parent .factchip small{ font-weight:500; color:var(--ink-soft); font-size:.72em }
/* right every time, and still counted out — a different thing from a wrong answer,

#parent .factchip.slow{ background:color-mix(in srgb, var(--c-yellow) 32%, var(--card)); }
/* what kind of wrong it was — the sentence, not the percentage */
#parent .factchip em{ font-style:normal; font-weight:500; color:var(--oops-ink); font-size:.78em }
#parent .misslist{ display:grid; gap:calc(var(--u)*.4); margin:calc(var(--u)*.6) 0 }
#parent .missrow{

  background:var(--paper-2); border-radius:calc(var(--u)*.6);

}
#parent .missrow b{ font-weight:800 }
#parent .missrow .n{ font-family:var(--fs-num); font-weight:800; color:var(--oops-ink); white-space:nowrap }

/* ---------- floors for anything a finger has to hit ----------
   The question is scaled up to fill its box, but the smallest iPad in portrait
   still has to give a five-year-old something they can actually land on. */
.choice{ min-width: max(calc(var(--u)*8.4), var(--tap)); min-height: max(calc(var(--u)*6.8), var(--tap)); }
.cell.tappable{ width: max(calc(var(--u)*4.6), var(--tap)); height: max(calc(var(--u)*4.6), var(--tap)); }
.tile{ width: max(calc(var(--u)*4.6), var(--tap)); height: max(calc(var(--u)*4.6), var(--tap)); }

.qi{ min-width: max(calc(var(--u)*5.4), var(--tap)); min-height: max(calc(var(--u)*5.4), var(--tap)); }
.btn-round{ width: max(calc(var(--u)*4.4), var(--tap)); height: max(calc(var(--u)*4.4), var(--tap)); }

/* ---------- parent: what each game is for ---------- */
#parent .aimnote{
  margin-top:calc(var(--u)*.6); padding:calc(var(--u)*.6) calc(var(--u)*.9);
  background:var(--paper-2); border-radius:calc(var(--u)*.7);
  border-left:calc(var(--u)*.3) solid var(--card-edge);
  color:var(--ink-soft);
}
#parent .aimlist{ display:grid; gap:calc(var(--u)*.7); margin:calc(var(--u)*.5) 0 calc(var(--u)*1) }
#parent .aimrow{ display:flex; gap:calc(var(--u)*.7); align-items:flex-start }
#parent .aimrow .ico{ flex:0 0 auto; font-size:calc(var(--u)*1.9); line-height:1.2 }
/* only the game's name is a block; the <b> inside the copy itself stays inline */
#parent .aimrow > div > b:first-child{ display:block; margin-bottom:calc(var(--u)*.15) }
#parent .aimrow > div > div{ color:var(--ink-soft) }
#parent .aimnote b, #parent .aimrow > div > div b{ color:var(--ink); font-weight:800 }

/* ---------- number keypad ----------
   A fixed 0–10 row, in the same place every time: the child learns where the
   numbers live, so answering stays about the arithmetic. */
.choices.pad{ gap: calc(var(--u)*.7); }
/* eleven keys fit one row in landscape; where they cannot, break 6 + 5 rather
   than letting a lone "10" wrap onto a line of its own */
@media (max-width: 900px){
  /* in portrait the keys stack 6 + 5 and there is room to part them: at .7u they
     were 7px apart on a 768-wide iPad, and a finger a key over reads as a counting
     mistake */
  .choices.pad{
    display: grid; grid-template-columns: repeat(6, auto);
    justify-content: center; justify-items: center;
    gap: max(16px, calc(var(--u)*1.2));
  }
}
.choice.padkey{
  /* the keypad is now the way the answer is given, so it gets real estate:
     eleven of these still fit one row in landscape, and wrap to two in portrait */
  min-width: max(calc(var(--u)*5.6), var(--tap));
  min-height: max(calc(var(--u)*6), var(--tap));
  font-size: calc(var(--u)*3.2);
  padding: calc(var(--u)*.4) calc(var(--u)*.5);
}

/* ---------- diagnostic and real-world mission ---------- */
#result .inner{ overflow-y: auto; justify-content: safe center; padding: calc(var(--u)*.4); }

}

}

}

}

}

/* ---------- constructive reasoning activities ---------- */
.conserve-row{
  width:min(100%, calc(var(--u)*46));
  display:flex; justify-content:center; align-items:center;
  gap:calc(var(--u)*.25);
  min-height:calc(var(--u)*9);

}

.ways-board .bond .legs{ width:calc(var(--u)*12); height:calc(var(--u)*1.8) }
.ways-board .bond .part{ min-width:calc(var(--u)*4.5); min-height:calc(var(--u)*4.5); font-size:calc(var(--u)*2.4) }

  padding:calc(var(--u)*.7) calc(var(--u)*1.2);

}
.clock-adjust{ min-height:var(--tap); padding-inline:calc(var(--u)*1.1) }
.clock-readout{
  font-size:calc(var(--u)*1.35);
  color:var(--ink-soft);
  font-weight:800;
  min-height:calc(var(--u)*2.2);
}

/* ===========================================================
   1ねんせいの きょうしつ — the 小学1年生 stage
   =========================================================== */

/* a tap on something that is not in the group being collected: it bounces, it is
   never taken away — a wrong guess about a rule is part of learning the rule */
.obj.notmine{ animation: shake .42s; filter: grayscale(.7) opacity(.55) }
/* the hint points at one thing still to collect. It must not use `.picked`, which
   means「this is in my basket」 everywhere else in the app. */
.obj.glow{ filter: drop-shadow(0 0 calc(var(--u)*.6) var(--accent)) }

/* the picture graph: rows start at the same edge, so length *is* the comparison */
.chartboard .mrow{ justify-content: flex-start }
.chartboard .mrow .row{ flex: 1 1 auto; min-width: 0 }

/* ---- 1たい1で くらべる ---- */
.pairboard{
  display: flex; flex-direction: column; align-items: stretch;
  gap: calc(var(--u)*.5);
  width: fit-content; max-width: 100%; margin-inline: auto;
}
/* One column per pair position, the same width in both rows, and no wrapping.
   Centred flex rows put five stars over five fish and the other two on a second
   line, and centred rows of different lengths never stood one item above its
   partner — so the thing this whole game is about, the bit left over at the end,
   was the one thing the picture could not show. */
.pairrow{
  display: grid;
  grid-template-columns: repeat(var(--pn, 5), calc(var(--u)*6));
  gap: calc(var(--u)*.7);
  justify-content: start; align-items: center;
}
/* the line the textbook draws between the two rows */
.pairgap{
  width: 100%; height: 0;
  border-top: calc(var(--u)*.2) dashed var(--card-edge);
}
.pairitem{
  position: relative;
  width: calc(var(--u)*6); height: calc(var(--u)*6);
  justify-content: center;
  font-size: calc(var(--u)*3.2);
}
.pairitem.marked{ border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--card)); }

<script>
(function(){
/* ---- 00-util.js ---- */
/* ===========================================================
   00 — utilities
   =========================================================== */
'use strict';

const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

/** Tiny DOM builder. el('div.foo', {onclick}, child, 'text') */
function el(spec, props, ...kids){
  let tag = 'div', id = null, cls = [];
  const m = String(spec).match(/^([a-zA-Z0-9]*)((?:[.#][\w-]+)*)$/);
  if (m){
    if (m[1]) tag = m[1];
    (m[2].match(/[.#][\w-]+/g) || []).forEach(t => t[0] === '#' ? (id = t.slice(1)) : cls.push(t.slice(1)));
  } else tag = spec;
  const n = document.createElement(tag);
  if (id) n.id = id;
  if (cls.length) n.className = cls.join(' ');
  if (props) for (const k in props){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'style' && typeof v === 'object'){
      for (const prop in v){
        // custom properties (--x) must go through setProperty; Object.assign silently drops them
        if (prop.charCodeAt(0) === 45 && prop.charCodeAt(1) === 45) n.style.setProperty(prop, v[prop]);
        else n.style[prop] = v[prop];
      }
    }
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'dataset') Object.assign(n.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'class') n.className += (n.className ? ' ' : '') + v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(4)){
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
}

function svg(tag, attrs, ...kids){
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(4)) if (kid != null && kid !== false) n.append(kid);
  return n;
}

const clear = n => { while (n.firstChild) n.removeChild(n.firstChild); return n; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---- random ---- */
const ri     = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick   = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const sample = (arr, n) => shuffle(arr).slice(0, n);
const range  = (a, b) => { const o = []; for (let i = a; i <= b; i++) o.push(i); return o; };

/** distinct distractor numbers around `answer` inside [lo,hi] */
function distractors(answer, n, lo, hi, spread){
  const s = spread || 3, out = new Set();
  const near = shuffle(range(Math.max(lo, answer - s), Math.min(hi, answer + s)).filter(v => v !== answer));
  for (const v of near){ if (out.size >= n) break; out.add(v); }
  let guard = 0;
  while (out.size < n && guard++ < 200){ const v = ri(lo, hi); if (v !== answer) out.add(v); }
  return Array.from(out).slice(0, n);
}

/* ---- japanese number readings (for speech) ---- */
const KANA_ONES = ['ゼロ','いち','に','さん','よん','ご','ろく','なな','はち','きゅう'];
function numKana(n){
  n = Math.round(n);
  if (n < 0) return String(n);
  if (n < 10) return KANA_ONES[n];
  if (n === 10) return 'じゅう';
  if (n < 20) return 'じゅう' + KANA_ONES[n - 10];
  if (n < 100){
    const t = Math.floor(n / 10), o = n % 10;
    return KANA_ONES[t] + 'じゅう' + (o ? KANA_ONES[o] : '');
  }
  return String(n);
}
const KO = ['ゼロこ','いっこ','にこ','さんこ','よんこ','ごこ','ろっこ','ななこ','はっこ','きゅうこ','じゅっこ'];
const koKana    = n => (n >= 0 && n <= 10) ? KO[n] : numKana(n) + 'こ';
const TSU = ['ゼロ','ひとつ','ふたつ','みっつ','よっつ','いつつ','むっつ','ななつ','やっつ','ここのつ','とお'];
const tsuKana   = n => (n >= 1 && n <= 10) ? TSU[n] : numKana(n) + 'こ';
const banmeKana = n => numKana(n) + 'ばんめ';
/* Clock hours have their own readings and they are NOT the counting readings. */
const JI = ['','いちじ','にじ','さんじ','よじ','ごじ','ろくじ','しちじ','はちじ','くじ','じゅうじ','じゅういちじ','じゅうにじ'];
const jiKana = (h, half) => (JI[h] || numKana(h) + 'じ') + (half ? 'はん' : '');

/** hiragana display text; digits get the numeral face via <b> */
const numTag = n => `<b>${n}</b>`;

/* ---- showing the child their own answer ----
   A question that ends with「?」still on screen never lets the child see what they
   said inside the sentence they said it about. 「7 と 1 で ?」 only finishes meaning
   something when it reads 「7 と 1 で 8」, and the beat where it does is the whole
   of what a five-year-old takes away from getting it right. Two levels already did
   this by hand (いくつと いくつ L3, 10の おともだち L2); these make it the default. */

/** Write the answer into the blank a question left open. Works for the「?」box in
    an equation and for a hole in a number line. */
function fillBlank(node, value){
  if (!node) return;
  node.textContent = String(value);
  node.classList.remove('gap', 'now');
  node.classList.add('filled');
}

/** buildChoices / buildPad options that run `show` on the correct answer and hold
    the screen long enough to read what it wrote. Any other options are passed
    through, and an existing `onPick` still decides whether the question ends. */
function revealed(show, opts){
  const o = opts || {};
  const out = Object.assign({}, o);
  delete out.delay;
  out.correctOpts = Object.assign({ delay: o.delay || 1300 }, o.correctOpts);
  out.onPick = (v, b) => {
    try{ show(v, b); }catch(e){ console.error('reveal failed', e); }
    return o.onPick ? o.onPick(v, b) : undefined;
  };
  return out;
}

/** Make a node behave like a button for both finger and keyboard. */
function tappable(node, fn){
  node.setAttribute('role', 'button');
  node.dataset.tap = '1';
  if (!node.hasAttribute('tabindex')) node.setAttribute('tabindex', '0');
  node.addEventListener('click', fn);
  node.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(e); }
  });
  return node;
}

/** Rejection sampling with a hard stop: a tightened range must never hang the iPad. */
function until(tryOnce, limit){
  for (let i = 0; i < (limit || 400); i++){ const v = tryOnce(); if (v !== undefined) return v; }
  return undefined;
}

/* ---- geometry ---- */
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

/** Poisson-ish scatter: n points in [0..1]^2 with a minimum separation. */
function scatter(n, minD, tries){
  const pts = [], T = tries || 40;
  const md = minD != null ? minD : Math.min(.34, 0.86 / Math.sqrt(n + 1));
  for (let i = 0; i < n; i++){
    let best = null, bestScore = -1;
    for (let t = 0; t < T; t++){
      const p = [0.10 + Math.random() * 0.80, 0.12 + Math.random() * 0.76];
      let d = 9;
      for (const q of pts) d = Math.min(d, dist(p[0], p[1], q[0], q[1]));
      if (d > bestScore){ bestScore = d; best = p; }
      if (d > md) break;
    }
    pts.push(best);
  }
  return pts;
}

/** points evenly on a horizontal line (for level-1 counting) */
function lineup(n, y){
  const pts = [], yy = y == null ? .5 : y;
  for (let i = 0; i < n; i++) pts.push([0.12 + (0.76 * (n === 1 ? .5 : i / (n - 1))), yy]);
  return pts;
}

/* ---- 01-audio.js ---- */
/* ===========================================================
   01 — sound & speech
   All effects are synthesised: nothing to download, works offline.
   =========================================================== */
'use strict';

const Sound = (() => {
  let ctx = null, master = null;
  let sfxOn = true, voiceOn = true;
  let jaVoice = null, jaVoices = [], voicesReady = false;
  let prefVoice = null;

  function ensure(){
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try{
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.28;
      master.connect(ctx.destination);
    }catch(e){ ctx = null; }

  function unlock(){
    const c = ensure();
    if (c && c.state === 'suspended') c.resume().catch(() => {});
    // prime the speech engine with an empty-ish utterance
    if (window.speechSynthesis){
      try{
        const u = new SpeechSynthesisUtterance(' ');

    const c = ensure(); if (!c || !sfxOn) return;

    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain == null ? .5 : gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + .02);
  }

  function seq(notes, type, step, gain){
    const c = ensure(); if (!c || !sfxOn) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    const t0 = c.currentTime + .01, st = step || .09;
    notes.forEach((f, i) => tone(f, t0 + i * st, st * 1.9, type || 'triangle', gain));
  }

  function noiseBurst(dur, gain){
    const c = ensure(); if (!c || !sfxOn) return;
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = .8;
    const g = c.createGain(); g.gain.value = gain == null ? .25 : gain;
