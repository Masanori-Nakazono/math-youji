<title>かずのぼうけん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;800&family=Baloo+2:wght@700;800&display=swap">
<style>
/* ===========================================================
   かずのぼうけん — stylesheet
   Visual world: 画用紙とクレヨン (drawing paper & crayons)
   =========================================================== */

/* ---------- tokens ---------- */
:root{
  /* ground & ink */
  --paper:      #FBF4E9;   /* warm drawing paper */
  --paper-2:    #F3E9D8;   /* recessed paper */
  --card:       #FFFDF8;   /* card face */
  --card-edge:  #E4D5BC;   /* pencil edge */
  --ink:        #2E2A3F;   /* blue-violet ink, never pure black */
  --ink-soft:   #6C6480;
  --ink-faint:  #A79CB4;

  /* crayons — semantic content colors */
  --c-red:      #F2604C;
  --c-orange:   #FF9F1C;
  --c-yellow:   #F5C042;
  --c-green:    #46B87A;
  --c-blue:     #3F8FE0;
  --c-purple:   #8E6FD1;
  --c-pink:     #F384AE;
  --c-brown:    #A9784F;

  /* roles */
  --accent:     #FF9F1C;   /* dandelion — primary action */
  --accent-ink: #6E3D00;
  --good:       #46B87A;
  --good-soft:  #DFF3E7;
  --oops:       #E9829A;   /* soft rose, never alarm red */
  --oops-soft:  #FBE6EB;
  --star:       #FFC533;
  --star-edge:  #D08A00;
  /* the stroke a child is asked to trace is the content — it must be clearly visible */
  --trace-guide:#CBE0F7;

  /* effects */
  --shadow:     0 .25em 0 rgba(46,42,63,.16), 0 .8em 1.6em rgba(46,42,63,.10);
  --shadow-sm:  0 .18em 0 rgba(46,42,63,.14);
  --ring:       #3F8FE0;

  /* geometry — slightly irregular, hand-drawn corners */
  --wob-a: 1.4em 1.1em 1.3em 1.2em;
  --wob-b: 1.1em 1.35em 1.15em 1.3em;

  /* scale unit — refined at runtime by JS */
  --u: clamp(7px, min(1.35vw, 1.52vh), 17px);

  --fs-jp: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4",
           "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --fs-num: "Baloo 2", "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;

  color-scheme: light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:     #171426;
    --paper-2:   #100E1C;
    --card:      #221E36;
    --card-edge: #3B3455;
    --ink:       #F6EFE4;
    --ink-soft:  #B6ADC6;
    --ink-faint: #776D8E;

    --c-red:     #FF7A66;
    --c-orange:  #FFB24A;
    --c-yellow:  #FFD264;
    --c-green:   #5DD08E;
    --c-blue:    #62A8F0;
    --c-purple:  #A98BE8;
    --c-pink:    #FF9CC1;
    --c-brown:   #C9946A;

    --accent:    #FFB24A;
    --accent-ink:#2A1600;
    --good:      #5DD08E;
    --good-soft: #1E3B2C;
    --oops:      #F5A0B4;
    --oops-soft: #3A2430;
    --star:      #FFD24D;
    --star-edge: #A87400;
    --trace-guide:#39457A;

    --shadow:    0 .25em 0 rgba(0,0,0,.45), 0 .8em 1.6em rgba(0,0,0,.35);
    --shadow-sm: 0 .18em 0 rgba(0,0,0,.4);
    --ring:      #7CB8F5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:     #171426;
  --paper-2:   #100E1C;
  --card:      #221E36;
  --card-edge: #3B3455;
  --ink:       #F6EFE4;
  --ink-soft:  #B6ADC6;
  --ink-faint: #776D8E;
  --c-red:     #FF7A66;
  --c-orange:  #FFB24A;
  --c-yellow:  #FFD264;
  --c-green:   #5DD08E;
  --c-blue:    #62A8F0;
  --c-purple:  #A98BE8;
  --c-pink:    #FF9CC1;
  --c-brown:   #C9946A;
  --accent:    #FFB24A;
  --accent-ink:#2A1600;
  --good:      #5DD08E;
  --good-soft: #1E3B2C;
  --oops:      #F5A0B4;
  --oops-soft: #3A2430;
  --star:      #FFD24D;
  --star-edge: #A87400;
  --trace-guide:#39457A;
  --shadow:    0 .25em 0 rgba(0,0,0,.45), 0 .8em 1.6em rgba(0,0,0,.35);
  --shadow-sm: 0 .18em 0 rgba(0,0,0,.4);
  --ring:      #7CB8F5;
  color-scheme: dark;
}

/* ---------- reset / stage ---------- */
*, *::before, *::after{ box-sizing: border-box; }

html, body{
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

body{
  background: var(--paper);
  color: var(--ink);
  font-family: var(--fs-jp);
  font-size: calc(var(--u) * 1.6);
  line-height: 1.5;
  font-weight: 500;
  -webkit-user-select: none;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* faint paper tooth */
body::before{
  content:"";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: .5;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,159,28,.055), transparent 45%),
    radial-gradient(circle at 82% 72%, rgba(63,143,224,.055), transparent 45%);
}

#stage{
  touch-action: manipulation;
  position: fixed;
  inset: 0;
  padding: max(env(safe-area-inset-top), calc(var(--u)*.6))
           max(env(safe-area-inset-right), calc(var(--u)*1))
           max(env(safe-area-inset-bottom), calc(var(--u)*1.5))
           max(env(safe-area-inset-left), calc(var(--u)*1));
  display: grid;
  z-index: 1;
}

.screen{
  grid-area: 1 / 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * .8);
}
.screen[hidden]{ display: none !important; }

.screen.enter{ animation: screenIn .34s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes screenIn{
  from{ opacity: 0; transform: translateY(calc(var(--u)*1.4)) scale(.985); }
  to  { opacity: 1; transform: none; }
}

/* ---------- generic buttons ---------- */
.btn{
  font: inherit;
  font-weight: 800;
  color: var(--ink);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: var(--wob-a);
  padding: calc(var(--u)*.7) calc(var(--u)*1.3);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .12s cubic-bezier(.2,.9,.3,1.4), box-shadow .12s, background .15s;
  touch-action: manipulation;
  display: inline-flex; align-items: center; justify-content: center;
  gap: calc(var(--u)*.5);
  min-height: calc(var(--u)*4.2);
}
.btn:active{ transform: translateY(.18em); box-shadow: none; }
.btn.wrong{ animation: shake .42s; border-color: var(--oops); background: var(--oops-soft); }
.btn.correct{ background: var(--good); border-color: var(--good); color: #fff; }
.btn:focus-visible{ outline: calc(var(--u)*.28) solid var(--ring); outline-offset: calc(var(--u)*.2); }

.btn-accent{
  background: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 72%, var(--ink) 28%);
  color: var(--accent-ink);
}
.btn-ghost{ background: transparent; border-color: transparent; box-shadow: none; }
.btn-ghost:active{ transform: scale(.94); }

.btn-round{
  width: calc(var(--u)*4.4); height: calc(var(--u)*4.4);
  min-height: 0; padding: 0; border-radius: 50%;
  font-size: calc(var(--u)*2);
}

/* ---------- top bar ---------- */
.topbar{
  display: flex; align-items: center; gap: calc(var(--u)*.8);
  flex: 0 0 auto;
}
.topbar h2{
  margin: 0;
  font-size: calc(var(--u)*2);
  font-weight: 800;
  letter-spacing: .02em;
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* progress pips */
.pips{ display: flex; gap: calc(var(--u)*.35); flex: 0 0 auto; }
.pip{
  width: calc(var(--u)*1.05); height: calc(var(--u)*1.05);
  border-radius: 50%;
  background: var(--card-edge);
  transition: background .3s, transform .3s;
}
.pip.done{ background: var(--good); }
.pip.miss{ background: var(--oops); }
.pip.now { background: var(--accent); transform: scale(1.35); }

/* ---------- play area ---------- */
.prompt{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: calc(var(--u)*.8);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: var(--wob-b);
  padding: calc(var(--u)*.6) calc(var(--u)*1);
  box-shadow: var(--shadow-sm);
}
.prompt .txt{
  flex: 1 1 auto;
  font-size: calc(var(--u)*2.1);
  font-weight: 800;
  line-height: 1.25;
  text-wrap: balance;
}
.prompt .txt b{ color: var(--c-red); font-family: var(--fs-num); font-size: 1.25em; }

.playfield{
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u)*1);
  padding: calc(var(--u)*.4);
}

.choices{
  flex: 0 0 auto;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: calc(var(--u)*1.5);
  padding-top: calc(var(--u)*.2);
}

.choice{
  font-family: var(--fs-num);
  font-weight: 800;
  font-size: calc(var(--u)*3.6);
  line-height: 1;
  min-width: calc(var(--u)*8.4);
  min-height: calc(var(--u)*6.8);
  padding: calc(var(--u)*.6) calc(var(--u)*1);
  background: var(--card);
  color: var(--ink);
  border: calc(var(--u)*.26) solid var(--card-edge);
  border-radius: var(--wob-a);
  box-shadow: var(--shadow);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform .12s cubic-bezier(.2,.9,.3,1.4), box-shadow .12s, background .2s, border-color .2s;
}
.choice:active{ transform: translateY(.2em) scale(.98); box-shadow: var(--shadow-sm); }
.choice:focus-visible{ outline: calc(var(--u)*.28) solid var(--ring); outline-offset: calc(var(--u)*.24); }
.choice.pic{ font-family: var(--fs-jp); font-size: calc(var(--u)*2.6); }
.choice.correct{ background: var(--good); border-color: var(--good); color: #fff; animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
.choice.wrong{ background: var(--oops-soft); border-color: var(--oops); animation: shake .42s; }
.choice.dim{ opacity: .32; pointer-events: none; filter: saturate(.4); }
.choice[disabled]{ pointer-events: none; }

@keyframes pop{ 0%{transform:scale(1)} 45%{transform:scale(1.16)} 100%{transform:scale(1)} }
@keyframes shake{
  0%,100%{ transform: translateX(0) }
  15%{ transform: translateX(-.35em) rotate(-2deg) }
  35%{ transform: translateX(.35em) rotate(2deg) }
  55%{ transform: translateX(-.22em) rotate(-1.2deg) }
  78%{ transform: translateX(.16em) }
}
@keyframes wiggle{
  0%,100%{ transform: rotate(0) }
  25%{ transform: rotate(-5deg) } 75%{ transform: rotate(5deg) }
}
@keyframes floatY{
  0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-.35em) }
}

/* ---------- counting objects ---------- */
.objfield{
  position: relative;
  width: 100%; height: 100%;
  min-height: calc(var(--u)*16);
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-a);
  box-shadow: inset 0 calc(var(--u)*.3) calc(var(--u)*1) rgba(46,42,63,.05);
  overflow: hidden;
}
.obj{
  position: absolute;
  padding: calc(var(--u)*.8);          /* hit area, not visual size */
  display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--u)*5);
  line-height: 1;
  cursor: pointer;
  transform: translate(-50%,-50%);
  transition: transform .18s cubic-bezier(.2,.9,.3,1.5), filter .18s, opacity .3s;
  will-change: transform;
}
.obj:active{ transform: translate(-50%,-50%) scale(1.14); }
.obj.counted{ filter: drop-shadow(0 0 calc(var(--u)*.5) var(--good)); }
.obj .tag{
  position: absolute;
  top: -.45em; right: -.45em;
  font-family: var(--fs-num); font-weight: 800;
  font-size: .42em; line-height: 1;
  color: #fff; background: var(--good);
  border-radius: 50%;
  width: 1.5em; height: 1.5em;
  display: flex; align-items: center; justify-content: center;
  animation: pop .34s cubic-bezier(.2,.9,.3,1.6);
  box-shadow: 0 .1em .2em rgba(0,0,0,.2);
}
.obj.picked{ filter: drop-shadow(0 0 calc(var(--u)*.55) var(--accent)); }
.obj.picked::after{
  content:""; position:absolute; inset:-12%;
  border: calc(var(--u)*.26) dashed var(--accent);
  border-radius: 50%;
}

/* rows / groups of items */
.row{ display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: calc(var(--u)*.5); }
.item{ font-size: calc(var(--u)*3.6); line-height: 1; }

.plate{
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-b);
  padding: calc(var(--u)*1);
  box-shadow: var(--shadow);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .14s cubic-bezier(.2,.9,.3,1.4), border-color .2s, background .2s;
  min-width: calc(var(--u)*14);
  min-height: calc(var(--u)*13);
}
.plate:active{ transform: scale(.97); }
.plate.correct{ border-color: var(--good); background: var(--good-soft); animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
.plate.wrong{ border-color: var(--oops); background: var(--oops-soft); animation: shake .42s; }

/* ---------- mascot ---------- */
.mascot{ width: calc(var(--u)*7); height: calc(var(--u)*7); flex: 0 0 auto; }
.mascot.talk{ animation: floatY 1.8s ease-in-out infinite; }
.mascot.cheer{ animation: wiggle .5s ease-in-out 3; }

/* ---------- toast / feedback ---------- */
#fx{ position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
.confetti{
  position: absolute; width: calc(var(--u)*.9); height: calc(var(--u)*1.4);
  border-radius: .2em;
  will-change: transform, opacity;
}
.bigmark{
  position: fixed; left: 50%; top: 46%;
  transform: translate(-50%,-50%);
  font-size: calc(var(--u)*16);
  z-index: 95; pointer-events: none;
  animation: markIn .75s cubic-bezier(.2,.9,.3,1.4) both;
}
@keyframes markIn{
  0%{ opacity:0; transform: translate(-50%,-50%) scale(.4) rotate(-14deg) }
  40%{ opacity:1; transform: translate(-50%,-50%) scale(1.06) rotate(3deg) }
  75%{ opacity:1; transform: translate(-50%,-50%) scale(1) rotate(0) }
  100%{ opacity:0; transform: translate(-50%,-50%) scale(1.1) }
}

/* ===========================================================
   HOME — たんけんマップ
   =========================================================== */
#home{ gap: calc(var(--u)*.7); }

.home-head{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: calc(var(--u)*1);
}
.logo{
  display: flex; align-items: baseline; gap: calc(var(--u)*.5);
  font-size: calc(var(--u)*2.9); font-weight: 800; letter-spacing: .04em;
  margin: 0;
}
.logo .k{ color: var(--c-red); }
.logo .n{ color: var(--c-blue); }
.logo .b{ color: var(--c-green); }
.home-head .spacer{ flex: 1 1 auto; }

.starcount{
  display: inline-flex; align-items: center; gap: calc(var(--u)*.4);
  font-family: var(--fs-num); font-weight: 800;
  font-size: calc(var(--u)*2.2);
  color: var(--ink);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: 999px;
  padding: calc(var(--u)*.3) calc(var(--u)*1.1);
  box-shadow: var(--shadow-sm);
}
.starcount svg{ width: calc(var(--u)*2); height: calc(var(--u)*2); }

/* daily practice banner */
.daily{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: calc(var(--u)*1);
  background: linear-gradient(105deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--c-pink)));
  color: var(--accent-ink);
  border: calc(var(--u)*.26) solid color-mix(in srgb, var(--accent) 65%, var(--ink) 35%);
  border-radius: var(--wob-a);
  padding: calc(var(--u)*.7) calc(var(--u)*1.2);
  box-shadow: var(--shadow);
  cursor: pointer;
  text-align: left;
  transition: transform .14s cubic-bezier(.2,.9,.3,1.4), box-shadow .14s;
}
.daily:active{ transform: translateY(.2em); box-shadow: var(--shadow-sm); }
.daily .t{ font-size: calc(var(--u)*2.1); font-weight: 800; line-height: 1.2; }
.daily .s{ font-size: calc(var(--u)*1.4); font-weight: 500; opacity: .82; }
.daily .grow{ flex: 1 1 auto; min-width: 0; }
.daily .mascot{ width: calc(var(--u)*5.6); height: calc(var(--u)*5.6); }
.daily.done{
  background: var(--good-soft);
  color: var(--ink);
  border-color: var(--good);
}

/* worlds */
.worlds{
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(calc(var(--u)*38), 1fr));
  grid-auto-rows: auto;
  align-content: safe center;   /* centred when there is room, never clipped when there isn't */
  gap: calc(var(--u)*.9);
  padding-bottom: calc(var(--u)*.2);
}
.world{
  background: var(--card);
  border: calc(var(--u)*.24) solid var(--card-edge);
  border-radius: var(--wob-a);
  padding: calc(var(--u)*.9);
  box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column;
}
/* the world's name sits on a crayon chip — a tab on a notebook divider */
.world h3{
  margin: calc(var(--u)*-1.7) 0 calc(var(--u)*.7) calc(var(--u)*-.3);
  font-size: calc(var(--u)*1.7); font-weight: 800;
  display: flex; align-items: center; gap: calc(var(--u)*.5);
  color: var(--ink);
}
.world h3 .chip{
  background: var(--wc);
  color: #fff;
  border-radius: 999px calc(var(--u)*1.2) 999px calc(var(--u)*1.1);
  padding: calc(var(--u)*.25) calc(var(--u)*1.1);
  box-shadow: var(--shadow-sm);
}
/* recently earned stickers, along the foot of the map */
.shelf{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: calc(var(--u)*.7);
  padding: calc(var(--u)*.55) calc(var(--u)*1);
  background: var(--card);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: var(--wob-b);
  box-shadow: var(--shadow-sm);
  cursor: pointer; font: inherit; color: var(--ink); text-align: left;
  transition: transform .14s cubic-bezier(.2,.9,.3,1.4);
}
.shelf:active{ transform: translateY(.15em); }
.shelf .lbl{ font-size: calc(var(--u)*1.35); font-weight: 800; white-space: nowrap; padding-left: calc(var(--u)*.3); }
.shelf .bk{ font-size: calc(var(--u)*2); flex: 0 0 auto; }
.shelf .lbl small{ display: block; font-size: calc(var(--u)*1.1); font-weight: 500; color: var(--ink-soft); }
.shelf .strip{
  flex: 1 1 auto; min-width: 0;
  display: flex; gap: calc(var(--u)*.3); overflow: hidden;
  font-size: calc(var(--u)*2.2); line-height: 1;
}
.shelf .strip span{ flex: 0 0 auto; }
.shelf .strip .empty{ font-size: calc(var(--u)*1.3); color: var(--ink-faint); font-weight: 500; }

.world h3 .sub{
  font-size: calc(var(--u)*1.15); font-weight: 500; color: var(--ink-soft);
  margin-left: auto;
}
.world{ padding-top: calc(var(--u)*2.1); }
.gamegrid{
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(calc(var(--u)*9.6), 1fr));
  gap: calc(var(--u)*1.3);   /* ~16px: still double the old 8.7px, but 4 cards stay on one row */
  align-content: center;
}

.gamecard{
  position: relative;
  aspect-ratio: 1 / .92;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u)*.25);
  padding: calc(var(--u)*.7) calc(var(--u)*.3) calc(var(--u)*.5);
  background: var(--paper);
  border: calc(var(--u)*.22) solid var(--card-edge);
  border-radius: var(--wob-b);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  font: inherit; color: var(--ink);
  transition: transform .14s cubic-bezier(.2,.9,.3,1.4), box-shadow .14s, border-color .2s;
}
.gamecard:active{ transform: translateY(.18em) scale(.98); box-shadow: none; }
.gamecard:focus-visible{ outline: calc(var(--u)*.28) solid var(--ring); outline-offset: calc(var(--u)*.2); }

/* ===========================================================

}

}

}

}

/* ===========================================================

}

/* ===========================================================

    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain == null ? .5 : gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + .02);
  }

  function seq(notes, type, step, gain){
    const c = ensure(); if (!c || !sfxOn) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    const t0 = c.currentTime + .01, st = step || .09;
    notes.forEach((f, i) => tone(f, t0 + i * st, st * 1.9, type || 'triangle', gain));
  }

  function noiseBurst(dur, gain){
    const c = ensure(); if (!c || !sfxOn) return;
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = .8;
    const g = c.createGain(); g.gain.value = gain == null ? .25 : gain;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  const PENT = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5, 1568, 1760, 2093];

  const S = {
    tap()      { seq([720], 'sine', .05, .35); },
    place()    { seq([420, 620], 'sine', .05, .4); },
    count(i)   { seq([PENT[Math.min(i, PENT.length - 1)]], 'triangle', .07, .42); },
    correct()  { seq([659.25, 830.61, 987.77, 1318.5], 'triangle', .075, .45); },
    wrong()    { seq([311.13, 261.63], 'sine', .13, .32); },
    star(i)    { seq([1046.5 + i * 180, 1568 + i * 200, 2093 + i * 240], 'triangle', .07, .3); noiseBurst(.25, .12); },
    finish()   { seq([523.25, 659.25, 783.99, 1046.5, 1318.5, 1046.5, 1318.5], 'triangle', .1, .42); },
    unlockSfx(){ seq([523.25, 783.99], 'triangle', .1, .35); },
    swoosh()   { noiseBurst(.18, .1); }
  };

  /* ---------- speech ---------- */
  function loadVoices(){
    if (!window.speechSynthesis) return;
    const vs = speechSynthesis.getVoices();
    if (!vs || !vs.length) return;
    voicesReady = true;
    const ja = vs.filter(v => /^ja(-|_|$)/i.test(v.lang || ''));
    jaVoice = ja.find(v => /kyoko|o-ren|otoya|hattori/i.test(v.name))
           || ja.find(v => v.localService)
           || ja[0] || null;
  }
  if (window.speechSynthesis){
    loadVoices();
    speechSynthesis.addEventListener('voiceschanged', loadVoices);
  }

  let speakTimer = null;
  function say(text, opts){
    if (!voiceOn || !text || !window.speechSynthesis) return;
    const o = opts || {};
    clearTimeout(speakTimer);
    const go = () => {
      try{
        if (!voicesReady) loadVoices();
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(String(text));
        u.lang  = 'ja-JP';
        if (jaVoice) u.voice = jaVoice;
        u.rate   = o.rate   == null ? 0.92 : o.rate;
        u.pitch  = o.pitch  == null ? 1.15 : o.pitch;
        u.volume = o.volume == null ? 1 : o.volume;
        speechSynthesis.speak(u);
      }catch(e){}
    };
    // a beat of delay lets the sfx land first and avoids iOS cancel/speak races
    speakTimer = setTimeout(go, o.delay == null ? 90 : o.delay);
  }
  function hush(){
    clearTimeout(speakTimer);
    try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){}
  }

  return {
    sfx: S, unlock, say, hush,
    get sfxOn(){ return sfxOn; },  set sfxOn(v){ sfxOn = !!v; },
    get voiceOn(){ return voiceOn; }, set voiceOn(v){ voiceOn = !!v; if (!v) hush(); },
    get hasVoice(){ return !!jaVoice; }
  };
})();

/* ---- 02-store.js ---- */
/* ===========================================================
   02 — progress storage (per-device, localStorage; degrades to memory)
   =========================================================== */
'use strict';

const Store = (() => {
  const KEY = 'kazu-no-bouken.v1';
  const blank = () => ({
    stars: {},        // "gameId:levelIndex" -> 0..3
    plays: {},        // "gameId:levelIndex" -> attempts
    seen:  {},        // gameId -> total questions answered
    firstTry: {},     // gameId -> [correctFirstTry, total] (lifetime)
    /* Per-game aggregates can only ever say "this game is shaky". These two say
       *what* is shaky and *when* — which is what lets the app come back to the
       exact fact the child missed, and lets the parent page name it. */
    facts: {},        // item key -> [asked, firstTryRight, lastDayNumber]
    recent: {},       // "gameId:levelIndex" -> last 30 first-try outcomes, "1011…"
    last:  {},        // "gameId:levelIndex" -> day number last played
    stickers: [],     // earned sticker keys
    daily: {},        // "YYYY-MM-DD" -> questions done
    practice: [0, 0],   // [firstTryRight, total] across きょうの れんしゅう
    name: '',
    sfx: true, voice: true,
    createdAt: Date.now()
  });

  let mem = blank(), ok = true;

  try{
    const raw = localStorage.getItem(KEY);
    if (raw) mem = Object.assign(blank(), JSON.parse(raw));
  }catch(e){ ok = false; }

  let pending = null;
  function writeNow(){
    if (!ok) return;
    clearTimeout(pending); pending = null;
    try{ localStorage.setItem(KEY, JSON.stringify(mem)); }
    catch(e){ ok = false; }          // quota, private mode, or a file:// origin
  }
  function save(){
    if (!ok) return;
    clearTimeout(pending);
    pending = setTimeout(writeNow, 120);
  }
  // the app is usually closed straight after finishing a level; don't lose that write
  addEventListener('pagehide', writeNow);
  addEventListener('visibilitychange', () => { if (document.hidden) writeNow(); });

  const key = (g, l) => g + ':' + l;
  /* Whole-day resolution keeps six months of daily use small enough for
     localStorage, and days are the only unit the scheduling actually needs. */
  const DAY = 86400000;
  const dayNo = () => Math.floor(Date.now() / DAY);
  const todayKey = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  /* ---- backup ----------------------------------------------------------
     localStorage is scoped to one origin and one browser, so the same app on a
     different URL (or after clearing site data) starts empty. Export/import is
     the only thing that makes six months of records actually portable. */
  const FILE_TAG = 'kazu-no-bouken';

  function exportText(){
    return JSON.stringify({ app: FILE_TAG, v: 1, savedAt: new Date().toISOString(), data: mem }, null, 2);
  }

  const maxNum = (a, b) => Math.max(a || 0, b || 0);
  function mergeInto(base, add){
    const out = Object.assign(blank(), base);
    ['stars', 'plays', 'seen', 'daily'].forEach(k => {
      const src = add[k] || {};
      out[k] = Object.assign({}, base[k] || {});
      // max, never sum: importing the same backup twice must not inflate anything
      for (const id in src) out[k][id] = maxNum(out[k][id], src[id]);
    });
    out.firstTry = Object.assign({}, base.firstTry || {});
    const af = add.firstTry || {};
    for (const g in af){
      const cur = out.firstTry[g];
      if (!cur || (af[g][1] || 0) > (cur[1] || 0)) out.firstTry[g] = af[g].slice();
    }
    // facts: keep the record that has been practised more; never sum
    out.facts = Object.assign({}, base.facts || {});
    const af2 = add.facts || {};
    for (const k in af2){
      const cur = out.facts[k];
      if (!cur || (af2[k][0] || 0) > (cur[0] || 0)) out.facts[k] = af2[k].slice();
      else if (cur) cur[2] = maxNum(cur[2], af2[k][2]);
    }
    // recent / last: follow whichever side actually played that level more
    out.recent = Object.assign({}, base.recent || {});
    out.last   = Object.assign({}, base.last || {});
    for (const k in (add.recent || {})){
      if ((add.plays && add.plays[k] || 0) > (base.plays && base.plays[k] || 0)) out.recent[k] = add.recent[k];
    }
    for (const k in (add.last || {})) out.last[k] = maxNum(out.last[k], add.last[k]);
    out.stickers = Array.from(new Set((base.stickers || []).concat(add.stickers || [])));
    const bp = base.practice || [0, 0], ap = add.practice || [0, 0];
    out.practice = (ap[1] || 0) > (bp[1] || 0) ? ap.slice() : bp.slice();
    out.createdAt = Math.min(base.createdAt || Date.now(), add.createdAt || Date.now());
    return out;
  }

  /** mode: 'merge' (default, never loses or inflates) or 'replace' */
  function importText(text, mode){
    let parsed;
    try{ parsed = JSON.parse(text); }
    catch(e){ return { ok: false, msg: 'ファイルの中身を読み取れませんでした。' }; }
    const data = (parsed && parsed.app === FILE_TAG && parsed.data) ? parsed.data
               : (parsed && parsed.stars) ? parsed        // a bare data object is fine too
               : null;
    if (!data || typeof data !== 'object') return { ok: false, msg: 'このファイルは かずのぼうけん の記録ではないようです。' };
    const before = Object.keys(mem.stars || {}).length;
    mem = mode === 'replace' ? Object.assign(blank(), data) : mergeInto(mem, data);
    writeNow();
    const after = Object.keys(mem.stars || {}).length;
    return { ok: true, msg: `読み込みました（★のついたレベル ${before} → ${after}、シール ${mem.stickers.length} 枚）`,
             savedAt: parsed.savedAt || null };
  }

  return {
    get data(){ return mem; },
    /** false when this device/origin cannot persist — the parent page says so. */
    get persists(){ return ok; },
    get origin(){ return location.origin === 'null' ? 'file://' : location.origin; },
    exportText, importText,
    todayKey,
    flush: writeNow,
    stars: (g, l) => mem.stars[key(g, l)] || 0,
    gameStars(g, levels){
      let s = 0; for (let i = 0; i < levels; i++) s += mem.stars[key(g, i)] || 0; return s;
    },
    totalStars(){ let s = 0; for (const k in mem.stars) s += mem.stars[k]; return s; },
    levelUnlocked(g, l){ return l === 0 || (mem.stars[key(g, l - 1)] || 0) >= 1; },

    /** One question's first-try result, attributed to the level it came from.
        Recorded per question rather than per level so that a question met inside
        きょうの れんしゅう counts towards that level's recent form too. */
    noteOutcome(g, l, ok){
      const k = key(g, l);
      mem.recent[k] = ((mem.recent[k] || '') + (ok ? '1' : '0')).slice(-30);
      mem.last[k] = dayNo();
      save();
    },

    recordLevel(g, l, stars, right, total){
      const k = key(g, l);
      mem.stars[k] = Math.max(mem.stars[k] || 0, stars);
      mem.plays[k] = (mem.plays[k] || 0) + 1;
      mem.last[k]  = dayNo();
      mem.seen[g]  = (mem.seen[g] || 0) + total;
      const ft = mem.firstTry[g] || [0, 0];
      mem.firstTry[g] = [ft[0] + right, ft[1] + total];
      const t = todayKey();
      mem.daily[t] = (mem.daily[t] || 0) + total;
      save();
    },
    recordPractice(right, total){
      const t = todayKey();
      mem.daily[t] = (mem.daily[t] || 0) + total;
      const p = mem.practice || (mem.practice = [0, 0]);
      p[0] += right; p[1] += total;
      save();
    },
    practiceAccuracy(){
      const p = mem.practice;
      return (p && p[1]) ? p[0] / p[1] : null;
    },
    todayCount(){ return mem.daily[todayKey()] || 0; },
    streak(){
      let n = 0; const d = new Date();
      for (;;){
        const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        if ((mem.daily[k] || 0) > 0) n++; else break;
        d.setDate(d.getDate() - 1);
        if (n > 400) break;
      }
      return n;
    },
    accuracy(g){
      const ft = mem.firstTry[g];
      if (!ft || !ft[1]) return null;
      return ft[0] / ft[1];
    },

    /* ---- item-level memory ---- */
    noteFact(k, firstTryOk){
      if (!k) return;
      const f = mem.facts[k] || (mem.facts[k] = [0, 0, 0]);
      f[0]++;
      if (firstTryOk) f[1]++;
      f[2] = dayNo();
      save();
    },
    fact: k => mem.facts[k] || null,
    /** How much this fact is owed a turn: 0 (fresh and solid) … ~2 (missed, or long unseen).
        A fact that has never been asked scores 1, so nothing is starved at the start. */
    factDue(k){
      const f = mem.facts[k];
      if (!f || !f[0]) return 1;
      const acc = f[1] / f[0];
      const age = Math.min(30, dayNo() - f[2]);
      return (1 - acc) * 1.6 + (age / 30) * 0.6 + (f[0] < 3 ? 0.25 : 0);
    },

    /* ---- recent (windowed) performance ----
       A lifetime average cannot show that a child recovered, and it cannot show
       that a child has just started slipping. Both are what a parent needs. */
    recentAccuracy(g, l){
      const s = mem.recent[key(g, l)];
      if (!s) return null;
      let r = 0;
      for (let i = 0; i < s.length; i++) if (s[i] === '1') r++;
      return s.length ? r / s.length : null;
    },
    gameRecentAccuracy(g, levels){
      let r = 0, n = 0;
      for (let i = 0; i < levels; i++){
        const s = mem.recent[key(g, i)] || '';
        for (let j = 0; j < s.length; j++){ n++; if (s[j] === '1') r++; }
      }
      return n ? r / n : null;
    },
    /** days since this level was last played; large when never played */
    daysSince(g, l){
      const d = mem.last[key(g, l)];
      return d ? Math.max(0, dayNo() - d) : 99;
    },
    addSticker(k){
      if (mem.stickers.indexOf(k) < 0){ mem.stickers.push(k); save(); return true; }
      return false;
    },
    hasSticker: k => mem.stickers.indexOf(k) >= 0,
    setPref(k, v){ mem[k] = v; save(); },
    reset(){ mem = blank(); save(); }
  };
})();

/* ===========================================================
   03 — artwork: mascot, stars, shapes, clock, numeral strokes
   =========================================================== */
'use strict';

/* ---------- star ---------- */
const STAR_D = 'M50 6 L62 36 L95 39 L70 61 L78 94 L50 76 L22 94 L30 61 L5 39 L38 36 Z';
function starSVG(on){
  return svg('svg', { viewBox: '0 0 100 100', 'aria-hidden': 'true', class: on ? 'on' : '' },
    svg('path', { d: STAR_D, fill: on ? 'var(--star)' : 'var(--card-edge)',
                  stroke: on ? 'var(--star-edge)' : 'transparent',
                  'stroke-width': 5, 'stroke-linejoin': 'round' }));
}

/* ---------- mascot: かずぴょん ---------- */
const FACES = {
  idle:  { eye: 'open',  mouth: 'M42 66 Q50 73 58 66' },
  happy: { eye: 'arc',   mouth: 'M38 62 Q50 78 62 62 Z' },
  cheer: { eye: 'arc',   mouth: 'M36 60 Q50 82 64 60 Z' },
  think: { eye: 'open',  mouth: 'M43 69 Q50 65 57 69' },
  soft:  { eye: 'open',  mouth: 'M43 70 Q50 64 57 70' }
};
function mascotSVG(mood, cls){
  const f = FACES[mood] || FACES.idle;
  const eye = (cx) => f.eye === 'arc'
    ? svg('path', { d: `M${cx - 7} 52 Q${cx} 44 ${cx + 7} 52`, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 4.5, 'stroke-linecap': 'round' })
    : svg('g', null,
        svg('circle', { cx, cy: 51, r: 6.4, fill: 'var(--ink)' }),
        svg('circle', { cx: cx + 2.2, cy: 48.6, r: 2.1, fill: '#fff' }));
  const ear = (x, rot) => svg('g', { transform: `rotate(${rot} ${x} 30)` },
    svg('rect', { x: x - 7, y: -2, width: 14, height: 36, rx: 7, fill: 'var(--c-yellow)', stroke: 'var(--ink)', 'stroke-width': 3.4 }),
    svg('rect', { x: x - 3.4, y: 4, width: 6.8, height: 24, rx: 3.4, fill: 'var(--c-pink)' }));
  return svg('svg', { viewBox: '0 0 100 100', class: 'mascot' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true' },
    ear(37, -12), ear(63, 12),
    svg('circle', { cx: 50, cy: 62, r: 31, fill: 'var(--c-yellow)', stroke: 'var(--ink)', 'stroke-width': 3.6 }),
    svg('ellipse', { cx: 33, cy: 68, rx: 6.4, ry: 4.2, fill: 'var(--c-pink)', opacity: .85 }),
    svg('ellipse', { cx: 67, cy: 68, rx: 6.4, ry: 4.2, fill: 'var(--c-pink)', opacity: .85 }),
    eye(38), eye(62),
    svg('path', { d: f.mouth, fill: f.mouth.endsWith('Z') ? 'var(--c-red)' : 'none',
                  stroke: 'var(--ink)', 'stroke-width': 3.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
}

/* ---------- arrows ---------- */
function arrowSVG(dir){
  const flip = dir === 'left' ? 'scale(-1,1) translate(-100,0)' : '';
  return svg('svg', { viewBox: '0 0 100 50', 'aria-hidden': 'true' },
    svg('g', { transform: flip },
      svg('path', { d: 'M4 25 H72 M56 8 L78 25 L56 42', fill: 'none', stroke: 'currentColor',
                    'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' })));
}

/* ---------- geometric shapes ---------- */
const SHAPES = {
  circle:    { ja: 'まる',     kind: 'circle',   pts: null },
  square:    { ja: 'しかく',   kind: 'square',   pts: [[10,10],[90,10],[90,90],[10,90]] },
  rect:      { ja: 'しかく',   kind: 'square',   pts: [[6,24],[94,24],[94,76],[6,76]] },
  tri:       { ja: 'さんかく', kind: 'triangle', pts: [[50,8],[92,88],[8,88]] },
  tri2:      { ja: 'さんかく', kind: 'triangle', pts: [[12,10],[92,52],[16,90]] },
  rtri:      { ja: 'さんかく', kind: 'triangle', pts: [[12,12],[12,88],[88,88]] },
  diamond:   { ja: 'ひしがた', kind: 'diamond',  pts: [[50,6],[94,50],[50,94],[6,50]] },
  oval:      { ja: 'まる',     kind: 'circle',   pts: null, rx: 46, ry: 30 },
  pentagon:  { ja: 'ごかっけい', kind: 'poly',   pts: [[50,6],[94,38],[77,90],[23,90],[6,38]] },
  hexagon:   { ja: 'ろっかっけい', kind: 'poly', pts: [[28,10],[72,10],[94,50],[72,90],[28,90],[6,50]] },
  trapezoid: { ja: 'だいけい', kind: 'poly',     pts: [[26,16],[74,16],[94,84],[6,84]] },
  star:      { ja: 'ほし',     kind: 'star',     pts: null },
  heart:     { ja: 'ハート',   kind: 'heart',    pts: null },
  semi:      { ja: 'はんえん', kind: 'semi',     pts: null }
};

function shapeSVG(name, color, rot, size){
  const s = SHAPES[name] || SHAPES.circle;
  const fill = color || 'var(--c-blue)';
  const stroke = 'color-mix(in srgb, ' + fill + ' 62%, var(--ink) 38%)';
  const common = { fill, stroke, 'stroke-width': 4, 'stroke-linejoin': 'round' };
  let node;
  if (name === 'circle')       node = svg('circle', Object.assign({ cx: 50, cy: 50, r: 42 }, common));
  else if (name === 'oval')    node = svg('ellipse', Object.assign({ cx: 50, cy: 50, rx: s.rx, ry: s.ry }, common));
  else if (name === 'star')    node = svg('path', Object.assign({ d: STAR_D }, common));
  else if (name === 'heart')   node = svg('path', Object.assign({ d: 'M50 90 C10 62 8 34 26 22 C38 14 50 22 50 34 C50 22 62 14 74 22 C92 34 90 62 50 90 Z' }, common));
  else if (name === 'semi')    node = svg('path', Object.assign({ d: 'M6 72 A44 44 0 0 1 94 72 Z' }, common));
  else node = svg('polygon', Object.assign({ points: s.pts.map(p => p.join(',')).join(' ') }, common));
  return svg('svg', { viewBox: '0 0 100 100', 'aria-hidden': 'true',
                      width: size || null, height: size || null,
                      style: rot ? `transform:rotate(${rot}deg)` : null }, node);
}

/* ---------- analogue clock ---------- */
function clockSVG(hour, minute, opts){
  const o = opts || {};
  const cx = 50, cy = 50, R = 45;
  const g = [
    svg('circle', { cx, cy, r: R, fill: 'var(--card)', stroke: 'var(--ink)', 'stroke-width': 3.4 }),
    svg('circle', { cx, cy, r: R - 4, fill: 'none', stroke: 'var(--card-edge)', 'stroke-width': 1.2 })
  ];
  for (let i = 0; i < 60; i++){
    const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
    const big = i % 5 === 0;
    const r1 = R - (big ? 8 : 4), r2 = R - 2.5;
    g.push(svg('line', {
      x1: cx + Math.cos(a) * r1, y1: cy + Math.sin(a) * r1,
      x2: cx + Math.cos(a) * r2, y2: cy + Math.sin(a) * r2,
      stroke: big ? 'var(--ink)' : 'var(--ink-faint)', 'stroke-width': big ? 2.6 : 1.1, 'stroke-linecap': 'round'
    }));
  }
  if (o.numerals !== false){
    for (let h = 1; h <= 12; h++){
      const a = (h / 12) * Math.PI * 2 - Math.PI / 2;
      g.push(svg('text', {
        x: cx + Math.cos(a) * (R - 15), y: cy + Math.sin(a) * (R - 15) + 4.4,
        'text-anchor': 'middle', fill: 'var(--ink)', 'font-size': 12, 'font-weight': 800,
        'font-family': 'var(--fs-num)'
      }, String(h)));
    }
  }
  const ma = (minute / 60) * Math.PI * 2 - Math.PI / 2;
  const ha = (((hour % 12) + minute / 60) / 12) * Math.PI * 2 - Math.PI / 2;
  g.push(svg('line', { x1: cx, y1: cy, x2: cx + Math.cos(ha) * 21, y2: cy + Math.sin(ha) * 21,
    stroke: 'var(--c-red)', 'stroke-width': 6.2, 'stroke-linecap': 'round', class: 'hand-h' }));
  g.push(svg('line', { x1: cx, y1: cy, x2: cx + Math.cos(ma) * 33, y2: cy + Math.sin(ma) * 33,
    stroke: 'var(--c-blue)', 'stroke-width': 4, 'stroke-linecap': 'round', class: 'hand-m' }));
  g.push(svg('circle', { cx, cy, r: 3.6, fill: 'var(--ink)' }));
  return svg('svg', { viewBox: '0 0 100 100', class: 'clock' + (o.cls ? ' ' + o.cls : ''), 'aria-hidden': 'true' }, g);
}

/* ---------- Catmull-Rom smoothing (used by numeral strokes) ---------- */
function smooth(ctrl, per){
  if (ctrl.length < 2) return ctrl.slice();
  const p = [ctrl[0]].concat(ctrl, [ctrl[ctrl.length - 1]]);
  const out = [], n = per || 14;
  for (let i = 1; i < p.length - 2; i++){
    const [p0, p1, p2, p3] = [p[i - 1], p[i], p[i + 1], p[i + 2]];
    for (let t = 0; t < n; t++){
      const s = t / n, s2 = s * s, s3 = s2 * s;
      out.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * s + (2*p0[0] - 5*p1[0] + 4*p2[0] - p3[0]) * s2 + (-p0[0] + 3*p1[0] - 3*p2[0] + p3[0]) * s3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * s + (2*p0[1] - 5*p1[1] + 4*p2[1] - p3[1]) * s2 + (-p0[1] + 3*p1[1] - 3*p2[1] + p3[1]) * s3)
      ]);
    }
  }
  out.push(ctrl[ctrl.length - 1]);
  return out;
}

const UI = (() => {

    stage = $('#stage');
    fx    = $('#fx');
  }
  function register(name, node){
    node.classList.add('screen');
    node.hidden = true;
    screens[name] = node;
    stage.append(node);
    return node;
  }
  function show(name, opts){
    const o = opts || {};
    Sound.hush();
    for (const k in screens) screens[k].hidden = true;
    const n = screens[name];
    if (!n) return null;
    n.hidden = false;
    n.classList.remove('enter');
    void n.offsetWidth;
    n.classList.add('enter');
    current = name;
    n.scrollTop = 0;
    const sc = $('.worlds, .sheet, .levels, .book', n);
    if (sc) sc.scrollTop = o.keepScroll ? sc.scrollTop : 0;
    return n;
  }
  const currentName = () => current;

  /* ---------- feedback ---------- */
  const CRAYONS = ['--c-red','--c-orange','--c-yellow','--c-green','--c-blue','--c-purple','--c-pink'];
  const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function confetti(count, originX, originY){
    if (reduced()) return;
    const n = count || 26;
    const w = innerWidth, h = innerHeight;
    const ox = originX == null ? w / 2 : originX;
    const oy = originY == null ? h * 0.45 : originY;
    for (let i = 0; i < n; i++){
      const p = el('div.confetti');
      p.style.background = `var(${CRAYONS[i % CRAYONS.length]})`;
      p.style.left = ox + 'px';
      p.style.top  = oy + 'px';
      fx.append(p);
      const a  = (-Math.PI / 2) + (Math.random() - .5) * 2.1;
      const v  = 260 + Math.random() * 420;
      const dx = Math.cos(a) * v, dy = Math.sin(a) * v;
      const dur = 900 + Math.random() * 700;
      p.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx * .6}px, ${dy * .6 + 90}px) rotate(${180 + Math.random()*360}deg)`, opacity: 1, offset: .55 },
        { transform: `translate(${dx}px, ${dy + h * .75}px) rotate(${540 + Math.random()*360}deg)`, opacity: 0 }
      ], { duration: dur, easing: 'cubic-bezier(.2,.6,.4,1)' }).finished.then(() => p.remove()).catch(() => p.remove());
    }
  }

  function bigMark(txt, color){
    const n = el('div.bigmark', { text: txt, style: { color: color || 'var(--good)' } });
    document.body.append(n);
    setTimeout(() => n.remove(), 760);
  }

  function stars(count, big){
    const wrap = el(big ? 'div.bigstars' : 'div.st');
    for (let i = 0; i < 3; i++){
      const s = starSVG(i < count);
      s.classList.add('s');
      if (i < count) s.classList.add('on');
      s.style.animationDelay = (i * 0.22) + 's';
      wrap.append(s);
    }
    return wrap;
  }

  /* ---------- drag & drop (pointer based, with tap fallback) ---------- */
  function makeDragDrop(opts){
    // opts: { items(), targets(), onDrop(item, target), tapSelect: bool }
    let selected = null, dragging = null, ghost = null, sx = 0, sy = 0, moved = false, overEl = null;
    let activeId = null;
    // a five-year-old's "tap" slides a few millimetres; 8px turned taps into drags
    const THRESH = 18;

    function clearSel(){
      if (selected) selected.classList.remove('sel');
      selected = null;
    }
    function setOver(t){
      if (overEl === t) return;
      if (overEl) overEl.classList.remove('over');
      overEl = t;
      if (overEl) overEl.classList.add('over');
    }
    function targetAt(x, y){
      const e = document.elementFromPoint(x, y);
      return e ? e.closest('[data-drop]') : null;
    }
    function endDrag(x, y){
      if (ghost){ ghost.remove(); ghost = null; }
      if (dragging) dragging.classList.remove('dragging');
      const t = (x != null) ? targetAt(x, y) : null;
      setOver(null);
      const it = dragging; dragging = null;
      if (it && moved){
        if (t) opts.onDrop(it, t);
        return true;
      }
      return false;
    }

    function onDown(e){
      const it = e.currentTarget;
      if (e.button != null && e.button > 0) return;
      if (dragging) return;                 // a second finger must not hijack the first
      activeId = e.pointerId;
      dragging = it; moved = false;
      sx = e.clientX; sy = e.clientY;
      window.addEventListener('pointermove', onMove, { passive: false });
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    }
    function onMove(e){
      if (!dragging || e.pointerId !== activeId) return;
      if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < THRESH) return;
      e.preventDefault();
      if (!moved){
        moved = true;
        clearSel();
        dragging.classList.add('dragging');
        ghost = dragging.cloneNode(true);
        ghost.id = 'ghost';
        ghost.classList.remove('dragging', 'sel');
        const r = dragging.getBoundingClientRect();
        ghost.style.width = r.width + 'px';
        ghost.style.height = r.height + 'px';
        document.body.append(ghost);
      }
      ghost.style.left = e.clientX + 'px';
      ghost.style.top  = e.clientY + 'px';
      setOver(targetAt(e.clientX, e.clientY));
    }
    function onUp(e){
      if (e.pointerId !== activeId) return;
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      activeId = null;
      const it = dragging;
      const dropped = endDrag(moved ? e.clientX : null, moved ? e.clientY : null);
      if (!it) return;
      if (!dropped){
        // a tap, or a drag that landed on nothing — either way, leave it selected
        // so the child can just tap the bin instead of dragging again
        if (!moved && selected === it) clearSel();
        else { clearSel(); selected = it; it.classList.add('sel'); Sound.sfx.tap(); }
      }
    }
    function bindItem(it){ it.addEventListener('pointerdown', onDown); }
    function bindTarget(t){
      t.setAttribute('data-drop', '');
      t.addEventListener('click', () => {
        if (selected){ const s = selected; opts.onDrop(s, t); if (s.classList.contains('gone')) clearSel(); }
      });
    }
    function select(it){ clearSel(); selected = it; it.classList.add('sel'); }
    return { bindItem, bindTarget, clearSel, select, get selected(){ return selected; } };
  }

  return { init, register, show, currentName, confetti, bigMark, stars, makeDragDrop, screens };
})();

function stickerSlots(){
  if (STICKER_INDEX) return STICKER_INDEX;

const Session = (() => {
  let node, titleEl, pipsEl, promptTxt, fieldEl, choicesEl, speakBtn, moodEl, feedbackEl;
  let plan = [];          // [{game, level, levelIndex}]
  let idx = 0, mistakes = 0, firstTryRight = 0, wrongThisQ = 0;
  let locked = false, mode = 'level', curGame = null, curLevelIdx = 0;
  let hintBtns = [], hintFn = null, hintShown = false, lastSpeech = '';
  /* What this question is *about*. Every generator names its item, so the app can
     avoid asking the same fact twice in one sitting, steer toward the facts this
     child keeps missing, and tell the parent which ones they are. */
  let curItem = null, curLabel = null;
  let usedItems = new Set();      // the shuffle bag for the current session
  let shaky = [];                 // facts missed this session, for the result screen

  /* ---------- timer lifecycle ----------
     Every delayed callback in a question is tied to an epoch. Leaving a question
     (next question, quit, a new level) bumps the epoch and clears the pending
     timers, so a slow animation from the previous question can never write into
     the current one — or, worse, answer it. */
  let epoch = 0;
  const timers = new Map();          // id -> { fn, epoch }, so tests can run them on demand
  function later(fn, ms){
    const mine = epoch;
    const id = setTimeout(() => { timers.delete(id); if (mine === epoch) fn(); }, ms);
    timers.set(id, { fn, epoch: mine });
    return id;
  }
  function killTimers(){
    epoch++;
    timers.forEach((v, id) => clearTimeout(id));
    timers.clear();
  }

  /** Test seam: run every pending question timer now instead of waiting for it.
      Lets the regression suite check what happens *after* an answer, which is where
      the interaction bugs live. */
  function flushTimers(limit){
    let ran = 0;
    for (let pass = 0; pass < (limit || 12) && timers.size; pass++){
      const due = Array.from(timers.entries());
      due.forEach(([id, t]) => { clearTimeout(id); timers.delete(id); if (t.epoch === epoch){ t.fn(); ran++; } });
    }
    return ran;
  }

  function build(){
    if (node) return node;
    titleEl   = el('h2');
    pipsEl    = el('div.pips');
    promptTxt = el('div.txt');
    fieldEl   = el('div.playfield');
    choicesEl = el('div.choices');
    feedbackEl = el('div.feedback', { hidden: true });
    speakBtn  = el('button.btn.btn-ghost.btn-round', {
      'aria-label': 'もういちど きく', title: 'もういちど きく',
      onclick(){ Sound.sfx.tap(); if (lastSpeech) Sound.say(lastSpeech, { delay: 40 }); }
    }, '🔊');
    moodEl = mascotSVG('idle', 'talk');
    moodEl.style.width = 'calc(var(--u)*4.6)';
    moodEl.style.height = 'calc(var(--u)*4.6)';

    node = el('div#play', null,
      el('div.topbar', null,
        el('button.btn.btn-ghost.btn-round.backbtn', { 'aria-label': 'もどる', onclick: quit }, '←'),
        titleEl, pipsEl),
      el('div.prompt', null, moodEl,
        el('div.txtwrap', null, promptTxt, feedbackEl), speakBtn),
      fieldEl, choicesEl);
    return UI.register('play', node);
  }

  function setMood(m){
    const fresh = mascotSVG(m, m === 'cheer' ? 'cheer' : 'talk');
    fresh.style.width = 'calc(var(--u)*4.6)';
    fresh.style.height = 'calc(var(--u)*4.6)';
    moodEl.replaceWith(fresh);
    moodEl = fresh;
  }

  /** Wrong answers have to be visible, not just audible: a device with no
      Japanese voice must still show the child that something happened. */
  function showFeedback(kind, text){
    feedbackEl.hidden = false;
    feedbackEl.className = 'feedback ' + kind;
    clear(feedbackEl);
    feedbackEl.append(el('span.mk', { text: kind === 'oops' ? '？' : '💡' }), text);
    feedbackEl.animate
      && feedbackEl.animate([{ transform: 'translateX(-.4em)' }, { transform: 'none' }], { duration: 260 });
  }
  function clearFeedback(){ feedbackEl.hidden = true; clear(feedbackEl); }

  function quit(){
    killTimers();
    Sound.hush();
    Sound.sfx.tap();
    if (mode === 'daily') Home.render(); else Levels.render(curGame);
    UI.show(mode === 'daily' ? 'home' : 'levels', { replace: true });
  }

  /* ---------- public entry points ---------- */
  function startLevel(game, levelIndex){
    build();
    killTimers();
    mode = 'level'; curGame = game; curLevelIdx = levelIndex;
    const lv = game.levels[levelIndex];
    const n = lv.n || 8;
    plan = [];
    for (let i = 0; i < n; i++) plan.push({ game, level: lv, levelIndex });
    titleEl.textContent = game.name + '　' + lv.t;
    begin();
  }

  function startDaily(count){
    build();
    killTimers();
    mode = 'daily'; curGame = null;
    const pool = [];
    Games.list.forEach(g => {
      g.levels.forEach((lv, i) => {
        if (Store.levelUnlocked(g.id, i)) pool.push({ game: g, level: lv, levelIndex: i });
      });
    });
    if (!pool.length){                       // nothing unlocked yet — never leave an empty plan
      Home.render();
      UI.show('home', { replace: true });
      return;
    }
    const n = count || 10;
    plan = drawDailyPlan(pool, n);
    titleEl.textContent = 'きょうの れんしゅう';
    begin();
  }

  /** How badly this child needs this level today.
      The old round-robin handed every game the same ~0.66 questions a day whether
      the child was at 10% or 97%, which made the daily set a sampler rather than
      practice. This is the same 10 questions, aimed. */
  function dailyWeight(p){
    const acc  = Store.recentAccuracy(p.game.id, p.levelIndex);
    const need = acc == null ? 1 : 1 - acc;                    // 0 solid … 1 struggling
    const cold = Math.min(1, Store.daysSince(p.game.id, p.levelIndex) / 14);
    const focus = p.game.focus || 1;                           // curriculum priority
    const done  = Store.stars(p.game.id, p.levelIndex) >= 3 ? 0.45 : 1;
    return (0.35 + need * 1.6 + cold * 0.8) * focus * done;
  }

  function drawDailyPlan(pool, n){
    const bag = pool.map(p => ({ p, w: dailyWeight(p) }));
    const out = [], perGame = {}, perLevel = {};
    // caps keep an aimed set from turning into a single-topic grind, and keep the
    // ten questions coming from at least four different games
    const MAX_GAME = 3, MAX_LEVEL = 2;
    for (let guard = 0; out.length < n && guard < n * 40; guard++){
      let total = 0;
      for (const x of bag) total += x.w;
      if (total <= 0) break;
      let r = Math.random() * total, hit = null;
      for (const x of bag){ r -= x.w; if (r <= 0){ hit = x; break; } }
      if (!hit) break;
      const gid = hit.p.game.id, lk = gid + ':' + hit.p.levelIndex;
      if ((perGame[gid] || 0) >= MAX_GAME || (perLevel[lk] || 0) >= MAX_LEVEL){ hit.w = 0; continue; }
      perGame[gid] = (perGame[gid] || 0) + 1;
      perLevel[lk] = (perLevel[lk] || 0) + 1;
      hit.w *= 0.45;                       // taper, so the weakest topic leads without owning the set
      out.push(hit.p);
    }
    while (out.length < n) out.push(pool[ri(0, pool.length - 1)]);
    return shuffle(out);                   // interleave: the same topic should not run in a block
  }

  function begin(){
    idx = 0; mistakes = 0; firstTryRight = 0;
    usedItems = new Set(); shaky = [];
    clear(pipsEl);
    plan.forEach(() => pipsEl.append(el('div.pip')));
    UI.show('play');
    nextQuestion();
  }

  /* ---------- question lifecycle ---------- */
  function api(){
    const mine = epoch;
    const stale = () => mine !== epoch;
    const a = {
      field: fieldEl,
      choices: choicesEl,
      level: plan[idx].level,
      levelIndex: plan[idx].levelIndex,
      game: plan[idx].game,
      setPrompt(html, speech){
        if (stale()) return;
        promptTxt.innerHTML = html;
        lastSpeech = speech != null ? speech : String(html).replace(/<[^>]*>/g, '');
        Sound.say(lastSpeech, { delay: 220 });
      },
      say(t, o){ if (stale()) return; lastSpeech = t; Sound.say(t, o); },
      /** Name the fact this question asks. `label` is what the result screen and
          the parent page will call it. Optional: a game that names nothing simply
          keeps the old purely-random behaviour. */
      item(key, label){
        if (stale() || key == null) return;
        curItem = a.game.id + ':' + key;
        curLabel = label || null;
      },
      onHint(fn){ if (!stale()) hintFn = fn; },
      correct(o){ if (!stale()) onCorrect(o || {}); },
      wrong(target){ if (!stale()) onWrong(target); },
      /** delayed work that dies with the question */
      later(fn, ms){ return later(fn, ms); },
      get locked(){ return locked; },

      /** Big tappable answer buttons.
          opts.onPick(value, button) runs on a correct pick; returning false keeps
          the question open (used by questions that ask for several answers). */
      buildChoices(values, answer, opts){
        if (stale()) return choicesEl;
        const o = opts || {};
        clear(choicesEl);
        choicesEl.dataset.built = '1';
        hintBtns = [];
        values.forEach(v => {
          const val = (v && typeof v === 'object' && 'v' in v) ? v.v : v;
          const b = el('button.choice' + (o.cls ? '.' + o.cls : ''), { type: 'button' });
          const content = o.render ? o.render(val, v) : String(val);
          if (content && content.nodeType) b.append(content); else b.textContent = content;
          const hit = o.match ? o.match(val, answer) : val === answer;
          b.addEventListener('click', () => {
            if (locked || stale()) return;
            if (hit){
              b.classList.add('correct');
              $$('.choice', choicesEl).forEach(x => { if (x !== b) x.disabled = true; });
              if (o.onPick && o.onPick(val, b) === false) return;
              a.correct(o.correctOpts);
            } else {
              b.classList.add('wrong', 'tried');
              later(() => b.classList.remove('wrong'), 460);
              a.wrong(b);
            }
          });
          if (!hit) hintBtns.push(b);
          choicesEl.append(b);
        });
        return choicesEl;
      }
    };
    return a;
  }

  function resetSurface(){
    locked = false; hintBtns = []; hintFn = null; hintShown = false;
    curItem = null; curLabel = null;
    clear(fieldEl); clear(choicesEl); delete choicesEl.dataset.built; clearFeedback();
    fieldEl.className = 'playfield';
  }

  /* How hard to look for a better question before settling.
     TRIES builds are cheap (the whole build-storm test does 25 per level), and a
     rejected build dies with its epoch, so nothing it scheduled can survive. */
  const TRIES = 6, PICKY = 3, DUE_ENOUGH = 0.55;

  /** Draw a question, re-rolling to avoid repeating a fact and to favour the ones
      this child owes practice to. The generator is random, so we cannot go back to
      an earlier draw — we accept the one that is on screen when we stop. */
  function drawQuestion(step){
    for (let t = 0; t < TRIES; t++){
      killTimers();
      resetSurface();
      try{
        step.level.make(api());
      }catch(err){
        console.error('question build failed', err);
        promptTxt.textContent = 'よみこみに しっぱいしました';
        return;
      }
      if (!curItem) return;                      // this game does not name its items
      if (t === TRIES - 1){
        // the bag is empty (every fact has come up already): start a fresh pass
        if (usedItems.has(curItem)) usedItems.clear();
        usedItems.add(curItem);
        return;
      }
      if (usedItems.has(curItem)) continue;
      if (t >= PICKY || Store.factDue(curItem) >= DUE_ENOUGH){
        usedItems.add(curItem);
        return;
      }
    }
  }

  function nextQuestion(){
    killTimers();
    wrongThisQ = 0;
    $$('.pip', pipsEl).forEach((p, i) => p.classList.toggle('now', i === idx));
    setMood('idle');
    const step = plan[idx];
    if (mode === 'daily') titleEl.textContent = 'きょうの れんしゅう　' + step.game.name;
    drawQuestion(step);
  }

  function onWrong(target){
    if (locked) return;
    wrongThisQ++;
    mistakes++;
    Sound.sfx.wrong();
    setMood('soft');
    if (target && target.classList){
      target.classList.add('wrong');
      later(() => target.classList.remove('wrong'), 460);
    }
    if (wrongThisQ === 1){
      showFeedback('oops', 'もういちど やってみよう');
      Sound.say('おしいね。もういちど やってみよう', { delay: 260 });
    } else if (wrongThisQ >= 2){
      // The game's own hint is preferred, but the choice-dimming fallback runs too:
      // a hint that only speaks would leave a muted device with no feedback at all.
      if (!hintShown){
        hintShown = true;
        showFeedback('hint', 'ヒントを だすね');
        Sound.say('ヒントを だすね', { delay: 260 });
        if (hintFn){ try{ hintFn(wrongThisQ); }catch(e){ console.error('hint failed', e); } }
      }
      const live = hintBtns.filter(b => !b.classList.contains('dim'));
      if (live.length > 1) live[ri(0, live.length - 1)].classList.add('dim');
    }
  }

  function onCorrect(o){
    if (locked) return;
    locked = true;
    clearFeedback();
    const clean = wrongThisQ === 0;
    if (clean) firstTryRight++;
    Store.noteOutcome(plan[idx].game.id, plan[idx].levelIndex, clean);
    if (curItem){
      Store.noteFact(curItem, clean);
      if (!clean && !shaky.some(x => x.key === curItem)){
        shaky.push({ key: curItem, label: curLabel || plan[idx].game.name });
      }
    }
    Sound.sfx.correct();
    setMood('happy');
    const pip = $$('.pip', pipsEl)[idx];
    if (pip){ pip.classList.remove('now'); pip.classList.add(wrongThisQ === 0 ? 'done' : 'miss'); }
    if (!o.quiet){
      UI.bigMark('◯');
      const praise = wrongThisQ === 0
        ? pick(['やったね', 'せいかい', 'すごい', 'じょうずだね', 'ばっちり', 'その ちょうし'])
        : pick(['できたね', 'よく がんばったね', 'そのとおり']);
      Sound.say(praise, { delay: 320 });
    }
    if ((idx + 1) % 4 === 0) UI.confetti(22);
    later(() => {
      idx++;
      if (idx >= plan.length) finish();
      else nextQuestion();
    }, o.delay || 950);
  }

  function finish(){
    killTimers();
    Sound.sfx.finish();
    UI.confetti(60);
    const total = plan.length;
    const stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
    let newSticker = null;
    if (mode === 'level'){
      const key = curGame.id + ':' + curLevelIdx;
      Store.recordLevel(curGame.id, curLevelIdx, stars, firstTryRight, total);
      if (Store.addSticker(key)) newSticker = { emoji: stickerFor(key), gold: stars === 3 };
      else if (stars === 3 && Store.addSticker(key + ':g')){
        newSticker = { emoji: stickerFor(key + ':g'), gold: true };
      }
    } else {
      Store.recordPractice(firstTryRight, total);
      const key = 'daily:' + Store.todayKey();   // one sticker per calendar day
      if (Store.addSticker(key)) newSticker = { emoji: stickerFor(key), gold: stars === 3 };
    }
    Result.show({ stars, right: firstTryRight, total, mode, game: curGame, levelIndex: curLevelIdx,
                  sticker: newSticker, shaky: shaky.slice(0, 3) });
  }

  return {
    startLevel, startDaily, build,
    _test: {
      flushTimers,
      get idx(){ return idx; },
      get planLength(){ return plan.length; },
      get planGames(){ return plan.map(p => p.game.id + ':' + p.levelIndex); },
      get item(){ return curItem; },
      get shaky(){ return shaky.slice(); },
      get locked(){ return locked; },
      get mistakes(){ return mistakes; },
      get pending(){ return timers.size; },
      get mode(){ return mode; }
    }
  };
})();

/* ===========================================================

'use strict';

const THINGS = [

  { e: '🍇', n: 'ぶどう' }, { e: '🐟', n: 'さかな' }, { e: '🐤', n: 'ひよこ' },
  { e: '🐱', n: 'ねこ' },   { e: '🐶', n: 'いぬ' },   { e: '🚗', n: 'くるま' },
  { e: '⚽️', n: 'ボール' }, { e: '🌸', n: 'おはな' }, { e: '⭐️', n: 'ほし' },
  { e: '🧁', n: 'ケーキ' }, { e: '🎈', n: 'ふうせん' }, { e: '🐞', n: 'てんとうむし' },

/* ============================================================
   1. かぞえよう — one-to-one correspondence & cardinality
   ============================================================ */
function makeCountField(api, count, thing, layout){
  const field = el('div.objfield');
  const pts = layout === 'line' ? lineup(count, .5) : scatter(count);
  const objs = [];
  pts.forEach((p, i) => {
    const o = el('div.obj', { style: { left: (p[0] * 100) + '%', top: (p[1] * 100) + '%' } }, thing.e);
    o.dataset.i = i;
    objs.push(o);
    field.append(o);
  });
  api.field.append(field);
  return objs;
}

function countQuestion(api, lo, hi, layout){
  const thing = pick(THINGS);
  const count = ri(lo, hi);
  api.item('count' + (layout === 'line' ? 'L' : 'S') + ':' + count, count + 'こ を かぞえる');
  api.setPrompt(`${thing.n}を ひとつずつ タップして かぞえよう`, `${thing.n}を、ひとつずつ タップして かぞえよう`);
  const objs = makeCountField(api, count, thing, layout);
  let done = 0;
  const tap = (o) => {
    if (o.classList.contains('counted') || api.locked) return;
    done++;
    o.classList.add('counted');
    o.append(el('span.tag', { text: String(done) }));
    Sound.sfx.count(done - 1);
    Sound.say(numKana(done), { delay: 0, rate: 1.2 });
    if (done === count) api.later(ask, 620);
  };
  objs.forEach(o => {
    tappable(o, () => tap(o));
  });

  function ask(){
    api.setPrompt(`${thing.n}は ぜんぶで いくつ？`, `${thing.n}は、ぜんぶで いくつ`);
    const n = hi <= 5 ? 3 : 4;
    const vals = shuffle([count].concat(distractors(count, n - 1, 1, Math.max(hi + 2, 6))));
    api.buildChoices(vals, count);
  }
}

function giveQuestion(api, lo, hi){
  const thing = pick(THINGS);
  const target = ri(lo, hi);
  const total = Math.min(14, target + ri(3, 5));
  api.item('give:' + target, target + 'こ だけ とりだす');
  api.setPrompt(`${thing.n}を ${numTag(target)}こ とって かごに いれよう`, `${thing.n}を、${koKana(target)} とって、かごに いれよう`);
  const objs = makeCountField(api, total, thing, 'scatter');
  const picked = new Set();
  const basketCount = el('div.n', { text: '0' });
  const basketItems = el('div.items');
  const basket = el('div.basket', null,
    el('div.b', { text: '🧺' }), basketItems, basketCount);
  $('.objfield', api.field).append(basket);
  const doneBtn = el('button.btn.btn-accent', { text: 'できた！' });
  api.choices.append(doneBtn);
  const refresh = () => {
    basketCount.textContent = String(picked.size);
    clear(basketItems);
    for (let i = 0; i < Math.min(picked.size, 12); i++) basketItems.append(el('span', { text: thing.e }));
  };
  refresh();
  objs.forEach(o => tappable(o, () => {
    if (api.locked) return;
    const i = o.dataset.i;
    if (picked.has(i)){ picked.delete(i); o.classList.remove('picked'); Sound.sfx.tap(); }
    else { picked.add(i); o.classList.add('picked'); Sound.sfx.count(picked.size - 1); Sound.say(numKana(picked.size), { delay: 0, rate: 1.2 }); }
    refresh();
  }));
  doneBtn.addEventListener('click', () => {
    if (api.locked) return;
    if (picked.size === target){ doneBtn.classList.add('choice', 'correct'); api.correct(); }
    else {
      api.wrong(doneBtn);
      Sound.say(picked.size > target ? 'ちょっと おおいみたい' : 'ちょっと たりないみたい', { delay: 300 });
    }
  });
  api.onHint(() => {
    basket.classList.add('want');
    basket.append(el('div.want', { text: 'ほしいのは ' + target + 'こ' }));
  });
}

/* ============================================================
   2. すうじ どれかな — numeral ↔ quantity
   ============================================================ */
/* Every plate is the same size with the same 6x2 lattice of slots: the child has
   to count, because the card that looks biggest is no longer the one with most. */
function groupNode(count, thing){
  const rows = count > 6 ? 2 : 1;          // keep the group vertically centred in the plate
  const g = el('div.slots', { style: { '--rows': rows } });
  for (let i = 0; i < rows * 6; i++) g.append(el('span.slot', null, i < count ? thing.e : ''));
  return g;
}

function numToQty(api, lo, hi){        // numeral shown → pick the matching group
  const n = ri(lo, hi), thing = pick(THINGS);
  api.item('n2q:' + n, 'すうじ ' + n + ' → その かず');
  api.setPrompt(`${thing.e} が ${numTag(n)}こ あるのは どれ？`, `${thing.n}が ${koKana(n)} あるのは どれ`);
  const big = el('div', { style: { fontFamily: 'var(--fs-num)', fontWeight: 800, fontSize: 'calc(var(--u)*11)', lineHeight: 1, color: 'var(--c-red)' }, text: String(n) });
  api.field.append(big);
  const opts = shuffle([n].concat(distractors(n, 2, Math.max(1, lo - 1), Math.min(12, hi + 2), 2)));
  clear(api.choices);
  opts.forEach(v => {
    const plate = el('div.plate.fixed', null, groupNode(v, thing));
    tappable(plate, () => {
      if (api.locked) return;
      if (v === n){ plate.classList.add('correct'); api.correct(); }
      else { plate.classList.add('wrong'); api.later(() => plate.classList.remove('wrong'), 460); api.wrong(plate); }
    });
    api.choices.append(plate);
  });
}

function qtyToNum(api, lo, hi){        // group shown → pick the numeral
  const n = ri(lo, hi), thing = pick(THINGS);
  api.item('q2n:' + n, n + 'こ → すうじ ' + n);
  api.setPrompt(`${thing.n}は いくつ？ すうじを えらぼう`, `${thing.n}は いくつ。すうじを えらぼう`);
  const wrap = el('div.row', { style: { maxWidth: 'calc(var(--u)*40)' } });
  for (let i = 0; i < n; i++) wrap.append(el('span.item', { text: thing.e, style: { fontSize: 'calc(var(--u)*4.4)' } }));
  api.field.append(wrap);
  const c = hi <= 5 ? 3 : 4;
  api.buildChoices(shuffle([n].concat(distractors(n, c - 1, 1, hi + 3))), n);
}

function tenFrameNode(count, cols, opts){
  const o = opts || {};
  const f = el('div.tenframe', { style: { '--cols': cols } });
  const total = o.total != null ? o.total : cols * 2;
  for (let i = 0; i < total; i++){
    const cell = el('div.cell');
    if (i < count) cell.append(el('div.dot' + (o.second != null && i >= o.second ? '.b' : '')));
    f.append(cell);
  }
  return f;
}

function teenQuestion(api){            // 11-20 with a filled ten-frame + loose ones
  const n = ri(11, 20), thing = pick(THINGS);
  api.item('teen:' + n, n + ' を 10と ' + (n - 10) + ' で みる');
  api.setPrompt('ぜんぶで いくつ？', 'ぜんぶで いくつ');

}

/* ============================================================
   3. かずの じゅんばん — sequence, next/before, skip counting
   ============================================================ */
function lineFill(api, lo, hi, gaps){
  const nums = range(lo, hi);
  const inner = nums.slice(1, -1);
  const holes = sample(inner, Math.min(gaps, inner.length)).sort((a, b) => a - b);
  api.item('fill:' + holes[0], holes[0] + ' が ぬけた ならび');
  const line = el('div.numline');
  const cells = {};
  nums.forEach(v => {
    const isHole = holes.indexOf(v) >= 0;
    const n = el('div.nn' + (isHole ? '.gap' : ''), { text: isHole ? '?' : String(v) });
    cells[v] = n;
    line.append(n);
  });
  api.field.append(line);

  let qi = 0;
  function askNext(){
    nums.forEach(v => cells[v].classList.remove('now'));
    const target = holes[qi];
    cells[target].classList.add('now');
    api.setPrompt('ひかって いる ところに はいる かずは？', 'ひかって いる ところに はいる かずは');

    // A distractor must never be another hole's answer — that answer is also
    // "correct" on the number line, and marking it wrong is simply unfair.
    const banned = holes.filter(v => v !== target);
    const pool = nums.filter(v => v !== target && banned.indexOf(v) < 0)
                     .sort((a, b) => Math.abs(a - target) - Math.abs(b - target));
    const wrong = sample(pool.slice(0, 5), Math.min(2, pool.length));

    api.buildChoices(shuffle([target].concat(wrong)), target, {
      onPick(){
        cells[target].textContent = String(target);
        cells[target].classList.remove('now', 'gap');
        cells[target].classList.add('filled');
        Sound.sfx.place();
        qi++;
        if (qi < holes.length){
          api.later(askNext, 620);
          return false;            // more holes to go: keep this question open
        }
        return true;               // last hole — let the engine finish the question
      }
    });
    api.onHint(() => {
      [target - 1, target + 1].forEach(v => { if (cells[v]) cells[v].classList.add('near'); });
    });
  }
  askNext();
}

function nextBefore(api, hi){
  const mode = pick(['next', 'before', 'between']);
  const n = ri(2, hi - 1);
  let ans, html, speech;
  if (mode === 'next'){ ans = n + 1; html = `${numTag(n)} の つぎの かずは？`; speech = `${numKana(n)}の つぎの かずは`; }
  else if (mode === 'before'){ ans = n - 1; html = `${numTag(n)} の まえの かずは？`; speech = `${numKana(n)}の まえの かずは`; }
  else { ans = n; html = `${numTag(n - 1)} と ${numTag(n + 1)} の あいだの かずは？`; speech = `${numKana(n-1)}と ${numKana(n+1)}の あいだの かずは`; }
  api.item('nb:' + mode + ':' + ans,
    mode === 'next' ? n + ' の つぎ' : mode === 'before' ? n + ' の まえ' : (n - 1) + ' と ' + (n + 1) + ' の あいだ');
  api.setPrompt(html, speech);
  const line = el('div.numline');
  for (let v = Math.max(1, ans - 3); v <= Math.min(hi, ans + 3); v++){
    line.append(el('div.nn' + (v === ans ? '.gap.now' : ''), { text: v === ans ? '?' : String(v) }));
  }
  api.field.append(line);
  api.buildChoices(shuffle([ans].concat(distractors(ans, 3, 1, hi))), ans);
}

function skipCount(api){
  const step = pick([2, 5, 2, 10]);
  const start = step === 2 ? pick([2, 4, 6]) : step;
  const seq = [0, 1, 2, 3].map(i => start + i * step);
  const ans = seq[3];
  api.item('skip' + step + ':' + ans, step + 'ずつ ふえて ' + ans);
  api.setPrompt(`${step}ずつ ふえて いくよ。つぎは？`, `${numKana(step)}ずつ ふえて いくよ。つぎは`);
  const line = el('div.numline');
  seq.forEach((v, i) => line.append(el('div.nn' + (i === 3 ? '.gap.now' : ''), { text: i === 3 ? '?' : String(v) })));
  api.field.append(line);
  api.buildChoices(shuffle([ans].concat(distractors(ans, 3, 1, ans + step * 2, step))), ans);
}

Games.add({
  id: 'seq', name: 'かずの じゅんばん', ico: '🪜', world: 'shima', color: 'var(--c-blue)',
  aim: '数を<b>並びとして</b>とらえ、「つぎ・まえ・あいだ」が言える力。数直線の感覚は、くり上がりの計算やものさしの読み取りにそのままつながります。',

/* ============================================================
   4. すうじを なぞろう — numeral formation
   ============================================================ */
function traceQuestion(api, digits){
  const d = String(pick(digits));
  const strokes = DIGIT_STROKES[d];
  api.item('trace:' + d, d + ' の かきかた');
  api.setPrompt(`${numTag(d)} を ゆびで なぞろう`, `${numKana(Number(d))}を ゆびで なぞろう`);

  const box = el('div.tracebox');
  const s = svg('svg', { viewBox: '0 0 100 140', preserveAspectRatio: 'xMidYMid meet' });
  const gGuide = svg('g'), gDone = svg('g'), gLive = svg('g'), gMark = svg('g');
  s.append(gGuide, gDone, gLive, gMark);
  box.append(s, el('div.trace-numlabel', { text: 'なぞりがき' }));
  api.field.append(box);

  strokes.forEach(st => {
    gGuide.append(svg('path', { d: toPath(st), class: 'trace-guide', fill: 'none',
      'stroke-width': 17, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    gGuide.append(svg('path', { d: toPath(st), class: 'trace-outline', fill: 'none',
      'stroke-width': 2, 'stroke-linecap': 'round' }));
  });

  let si = 0, progress = 0, drawing = false;
  let strays = 0, nudged = false, idleTimer = null;
  const TOL = 15, START_TOL = 22;

  function armIdle(){
    clearTimeout(idleTimer);
    idleTimer = api.later(() => {           // no progress for a while: show, don't scold
      if (si >= strokes.length) return;
      nudged = true;
      showGuide();
      Sound.say('あかい てんから なぞって みよう', { delay: 100 });
    }, 9000);
  }
  function showGuide(){
    if ($('.trace-ghost', box) || si >= strokes.length) return;
    gMark.append(svg('path', { d: toPath(strokes[si]), class: 'trace-ghost', stroke: 'var(--accent)',
      'stroke-width': 3, 'stroke-dasharray': '4 4', fill: 'none', opacity: .9 }));
  }

  function startMark(){
    clear(gMark);
    if (si >= strokes.length) return;
    const p = strokes[si][0];
    const q = strokes[si][Math.min(6, strokes[si].length - 1)];
    gMark.append(svg('circle', { cx: p[0], cy: p[1], r: 6.5, class: 'trace-start pulse' }));
    gMark.append(svg('text', { x: p[0], y: p[1] + 2.6, 'text-anchor': 'middle', fill: '#fff',
      'font-size': 7.5, 'font-weight': 800, 'font-family': 'var(--fs-num)' }, String(si + 1)));
    const a = Math.atan2(q[1] - p[1], q[0] - p[0]);
    gMark.append(svg('path', {
      d: `M${p[0] + Math.cos(a) * 11} ${p[1] + Math.sin(a) * 11} l${Math.cos(a) * 8} ${Math.sin(a) * 8}`,
      stroke: 'var(--c-red)', 'stroke-width': 3, 'stroke-linecap': 'round', opacity: .7
    }));
  }
  function redraw(){
    clear(gLive);
    if (si < strokes.length && progress > 1){
      gLive.append(svg('path', { d: toPath(strokes[si].slice(0, progress)), class: 'trace-live', fill: 'none',
        'stroke-width': 13, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    }
  }
  function pt(e){
    const m = s.getScreenCTM();
    if (!m) return null;
    const p = s.createSVGPoint();
    p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(m.inverse());
    return [q.x, q.y];
  }
  function onDown(e){
    const p = pt(e); if (!p || si >= strokes.length) return;
    const st = strokes[si];
    const near = dist(p[0], p[1], st[progress ? Math.min(progress, st.length - 1) : 0][0],
                                  st[progress ? Math.min(progress, st.length - 1) : 0][1]);
    if (near <= START_TOL){
      drawing = true;
      clearTimeout(idleTimer);
      box.setPointerCapture && box.setPointerCapture(e.pointerId);
      e.preventDefault();
    } else {
      // touched the wrong place: bounce the start dot toward the finger, and after a
      // couple of tries count it as a miss so the hint fires and the stars are honest
      const dot = $('.trace-start', box);
      if (dot && dot.animate) dot.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.6)' }, { transform: 'scale(1)' }],
        { duration: 420 });
      if (++strays % 2 === 0) api.wrong();
      armIdle();
    }
  }
  function onMove(e){
    if (!drawing || si >= strokes.length) return;
    e.preventDefault();
    const p = pt(e); if (!p) return;
    const st = strokes[si];
    const look = Math.min(st.length - 1, progress + 26);
    for (let i = Math.max(progress, 1); i <= look; i++){
      if (dist(p[0], p[1], st[i][0], st[i][1]) <= TOL) progress = Math.max(progress, i + 1);
    }
    redraw();
    armIdle();
    if (progress >= st.length - 2) completeStroke();
  }
  function completeStroke(){
    drawing = false;
    clearTimeout(idleTimer);
    gDone.append(svg('path', { d: toPath(strokes[si]), class: 'trace-done', fill: 'none',
      'stroke-width': 13, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    clear(gLive);
    Sound.sfx.place();
    si++; progress = 0;
    if (si >= strokes.length){
      clear(gMark);
      api.later(() => api.correct(), 220);
    } else {
      startMark();
      armIdle();
      Sound.say('つぎの せんも なぞってね', { delay: 150 });
    }
  }
  function onUp(){ drawing = false; }

  box.addEventListener('pointerdown', onDown);
  box.addEventListener('pointermove', onMove);
  box.addEventListener('pointerup', onUp);
  box.addEventListener('pointercancel', onUp);
  box.addEventListener('pointerleave', onUp);

  api.onHint(showGuide);
  box.addEventListener('pointerdown', () => { if (nudged) clearTimeout(idleTimer); });
  startMark();
  redraw();
  armIdle();
}
