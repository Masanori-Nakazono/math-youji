/* ============================================================
   4. すうじを なぞろう — numeral formation
   ============================================================ */
function traceQuestion(api, digits){
  const d = String(pick(digits));
  const strokes = DIGIT_STROKES[d];
  api.item('trace:' + d, d + ' の かきかた');
  api.setPrompt(`${numTag(d)} を ゆびで なぞろう`, `${numKana(Number(d))}を指でなぞろう。`);

  const box = el('div.tracebox');
  const s = svg('svg', { viewBox: '0 0 100 140', preserveAspectRatio: 'xMidYMid meet' });
  const gGuide = svg('g'), gDone = svg('g'), gLive = svg('g'), gMark = svg('g');
  s.append(gGuide, gDone, gLive, gMark);
  box.append(s, el('div.trace-numlabel', { text: 'なぞりがき' }));
  api.field.append(box);

  strokes.forEach(st => {
    gGuide.append(svg('path', { d: toPath(st), class: 'trace-guide', fill: 'none',
      'stroke-width': 17, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    gGuide.append(svg('path', { d: toPath(st), class: 'trace-outline', fill: 'none',
      'stroke-width': 2, 'stroke-linecap': 'round' }));
  });

  let si = 0, progress = 0, drawing = false;
  let strays = 0, nudged = false, idleTimer = null;
  const TOL = 15, START_TOL = 22;

  function armIdle(){
    clearTimeout(idleTimer);
    idleTimer = api.later(() => {           // no progress for a while: show, don't scold
      if (si >= strokes.length) return;
      nudged = true;
      showGuide();
      Sound.say('赤い点から、なぞってみよう。', { delay: 100 });
    }, 9000);
  }
  function showGuide(){
    if ($('.trace-ghost', box) || si >= strokes.length) return;
    gMark.append(svg('path', { d: toPath(strokes[si]), class: 'trace-ghost', stroke: 'var(--accent)',
      'stroke-width': 3, 'stroke-dasharray': '4 4', fill: 'none', opacity: .9 }));
  }

  function startMark(){
    clear(gMark);
    if (si >= strokes.length) return;
    const p = strokes[si][0];
    const q = strokes[si][Math.min(6, strokes[si].length - 1)];
    gMark.append(svg('circle', { cx: p[0], cy: p[1], r: 6.5, class: 'trace-start pulse' }));
    gMark.append(svg('text', { x: p[0], y: p[1] + 2.6, 'text-anchor': 'middle', fill: '#fff',
      'font-size': 7.5, 'font-weight': 800, 'font-family': 'var(--fs-num)' }, String(si + 1)));
    const a = Math.atan2(q[1] - p[1], q[0] - p[0]);
    gMark.append(svg('path', {
      d: `M${p[0] + Math.cos(a) * 11} ${p[1] + Math.sin(a) * 11} l${Math.cos(a) * 8} ${Math.sin(a) * 8}`,
      stroke: 'var(--c-red)', 'stroke-width': 3, 'stroke-linecap': 'round', opacity: .7
    }));
  }
  function redraw(){
    clear(gLive);
    if (si < strokes.length && progress > 1){
      gLive.append(svg('path', { d: toPath(strokes[si].slice(0, progress)), class: 'trace-live', fill: 'none',
        'stroke-width': 13, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    }
  }
  function pt(e){
    const m = s.getScreenCTM();
    if (!m) return null;
    const p = s.createSVGPoint();
    p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(m.inverse());
    return [q.x, q.y];
  }
  function onDown(e){
    const p = pt(e); if (!p || si >= strokes.length) return;
    const st = strokes[si];
    const near = dist(p[0], p[1], st[progress ? Math.min(progress, st.length - 1) : 0][0],
                                  st[progress ? Math.min(progress, st.length - 1) : 0][1]);
    if (near <= START_TOL){
      drawing = true;
      clearTimeout(idleTimer);
      box.setPointerCapture && box.setPointerCapture(e.pointerId);
      e.preventDefault();
    } else {
      // Starting outside the dot is a motor-control slip, not evidence that the
      // child misunderstood the numeral. Nudge visually without lowering math stars.
      const dot = $('.trace-start', box);
      if (dot && dot.animate) dot.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.6)' }, { transform: 'scale(1)' }],
        { duration: 420 });
      if (++strays % 2 === 0){
        nudged = true;
        showGuide();
        Sound.say('赤い点から、なぞってみよう。', { delay: 100 });
      }
      armIdle();
    }
  }
  function onMove(e){
    if (!drawing || si >= strokes.length) return;
    e.preventDefault();
    const p = pt(e); if (!p) return;
    const st = strokes[si];
    const look = Math.min(st.length - 1, progress + 26);
    for (let i = Math.max(progress, 1); i <= look; i++){
      if (dist(p[0], p[1], st[i][0], st[i][1]) <= TOL) progress = Math.max(progress, i + 1);
    }
    redraw();
    armIdle();
    if (progress >= st.length - 2) completeStroke();
  }
  function completeStroke(){
    drawing = false;
    clearTimeout(idleTimer);
    gDone.append(svg('path', { d: toPath(strokes[si]), class: 'trace-done', fill: 'none',
      'stroke-width': 13, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    clear(gLive);
    Sound.sfx.place();
    si++; progress = 0;
    if (si >= strokes.length){
      clear(gMark);
      api.later(() => api.correct(), 220);
    } else {
      startMark();
      armIdle();
      Sound.say('次の線も、なぞってね。', { delay: 150 });
    }
  }
  function onUp(){ drawing = false; }

  box.addEventListener('pointerdown', onDown);
  box.addEventListener('pointermove', onMove);
  box.addEventListener('pointerup', onUp);
  box.addEventListener('pointercancel', onUp);
  box.addEventListener('pointerleave', onUp);

  api.onHint(showGuide);
  box.addEventListener('pointerdown', () => { if (nudged) clearTimeout(idleTimer); });
  startMark();
  redraw();
  armIdle();
}

  intro: false,
  aim: '数字を<b>正しい書き順・向き</b>で書く運筆。左右反転（鏡文字）は年長ではよくあることですが、入学前に始点と向きを体で覚えておくと、算数の時間を「書く練習」に取られずに済みます。',

/* ===========================================================
   11 — WORLD 2「くらべる うみ」 くらべる・なんばんめ・おおきさ
   =========================================================== */
'use strict';

/* ============================================================
   5. どっちが おおい — quantity beats appearance
   ============================================================ */
function platesCompare(api, opts){
  const o = opts || {};
  const thing = pick(THINGS);
  const want = o.least ? 'least' : 'most';
  const counts = o.counts;
  const answer = want === 'most' ? Math.max.apply(null, counts) : Math.min.apply(null, counts);
  const sorted = counts.slice().sort((x, y) => x - y);
  api.item('cmp:' + sorted.join('_') + ':' + want,
    sorted.join(' と ') + ' の ' + (want === 'most' ? 'おおい ほう' : 'すくない ほう'));
  api.setPrompt(want === 'most' ? 'どっちが <b>おおい</b>？' : 'どっちが <b>すくない</b>？',
                want === 'most' ? 'どっちが多い？' : 'どっちが少ない？');
  if (counts.length > 2){
    api.setPrompt(want === 'most' ? 'いちばん <b>おおい</b> のは どれ？' : 'いちばん <b>すくない</b> のは どれ？',
                  want === 'most' ? '一番多いのは、どれ？' : '一番少ないのは、どれ？');
  }
  const wrap = el('div.row', { style: { gap: 'calc(var(--u)*1.4)' } });
  const order = shuffle(counts.map((c, i) => ({ c, i })));
  /* ちかい かず draws the *smaller* group with bigger icons on purpose. Choosing by
     how much space a plate fills instead of by counting is the misconception this
     level exists to catch — so when that is what happened, say which it was. */
  const bigIcon = o.sizes ? Math.max.apply(null, o.sizes) : null;
  const smallIcon = o.sizes ? Math.min.apply(null, o.sizes) : null;
  let solved = false;
  order.forEach(({ c, i }) => {
    const size = o.sizes ? o.sizes[i] : null;
    const plate = el('div.plate', {
      style: { minWidth: 'calc(var(--u)*' + (counts.length > 2 ? 11 : 15) + ')' } });
    const g = el('div.row', { style: { maxWidth: 'calc(var(--u)*' + (counts.length > 2 ? 10 : 14) + ')' } });
    for (let k = 0; k < c; k++){
      g.append(el('span.item', { text: thing.e, style: { fontSize: 'calc(var(--u)*' + (size || 2.8) + ')' } }));
    }
    plate.append(g);
    tappable(plate, () => {
      if (api.locked || solved) return;
      if (c === answer){ solved = true; plate.classList.add('correct'); api.correct(); }
      else {
        plate.classList.add('wrong');
        api.later(() => plate.classList.remove('wrong'), 460);
        const looks = o.sizes && bigIcon !== smallIcon
          && size === (want === 'most' ? bigIcon : smallIcon);
        api.wrong(plate, looks ? 'looks' : null);
      }
    });
    wrap.append(plate);
    plate.dataset.count = c;
  });
  api.field.append(wrap);
  api.onShow(() => {
    const p = $$('.plate', wrap).find(x => Number(x.dataset.count) === answer);
    if (p) p.click();
  });
  /* The hint used to write「5こ」on each plate, which answered the question for
     the child. Now it takes the trick away instead: every item the same size, five
     to a row, starting at the same edge — the longer arrangement is the bigger
     number, and the child still has to see which that is. */
  const lineUp = () => $$('.plate', wrap).forEach(p => {
    const g = $('.row', p);
    g.classList.add('lined');
    $$('.item', g).forEach(it => { it.style.fontSize = 'calc(var(--u)*2.6)'; });
  });
  api.coach({
    text: 'おなじ おおきさで 5こずつ ならべたよ',
    say: '同じ大きさで、5個ずつ並べたよ。' + (want === 'most' ? '多いのは、どれ？' : '少ないのは、どれ？'),
    tool: lineUp,
    walk(){
      lineUp();
      return $$('.plate', wrap).map(p => {
        const c = Number(p.dataset.count), items = $$('.item', p);
        return { at: p, act(){ Coach.tag(items[items.length - 1], c); }, say: koKana(c), ms: 1300 };
      });
    }
  });
}

/* Three counts at least `gap` apart. Two plates are a coin toss, which is no way to
   confirm a clear on another day (see `api.check`). */
function spread3(lo, hi, gap){
  for (let t = 0; t < 300; t++){
    const xs = [ri(lo, hi), ri(lo, hi), ri(lo, hi)];
    if (Math.abs(xs[0] - xs[1]) >= gap && Math.abs(xs[0] - xs[2]) >= gap && Math.abs(xs[1] - xs[2]) >= gap) return xs;
  }
  return shuffle([lo, lo + gap, lo + gap * 2]);
}

function compareEasy(api){
  if (api.check){ platesCompare(api, { counts: spread3(1, 9, 2), least: chance(.3) }); return; }
  let a = ri(1, 8), b = ri(1, 8);
  for (let g = 0; g < 200 && Math.abs(a - b) < 3; g++){ a = ri(1, 8); b = ri(1, 8); }
  if (Math.abs(a - b) < 3){ a = 2; b = 7; }
  platesCompare(api, { counts: [a, b], least: chance(.3) });
}
function compareClose(api){
  if (api.check){
    // three close counts, and the trap kept: the fewest drawn biggest, the most drawn smallest
    const a = ri(4, 10), counts = shuffle([a, a + 1, a + 2]), sizes = [2.6, 2.6, 2.6];
    if (chance(.6)){ sizes[counts.indexOf(a)] = 4.4; sizes[counts.indexOf(a + 2)] = 2.2; }
    platesCompare(api, { counts, sizes, least: chance(.35) });
    return;
  }
  // same count-difference of 1-2, but the smaller group is drawn LARGER on purpose:
  // the child has to count instead of judging by how much space it fills.
  let a = ri(4, 11), b = a + pick([1, 2]) * (chance(.5) ? 1 : -1);
  b = clamp(b, 2, 12);
  if (a === b) b = a + 1;
  const sizes = [2.6, 2.6];
  if (chance(.6)){ const small = a < b ? 0 : 1; sizes[small] = 4.4; sizes[1 - small] = 2.2; }
  platesCompare(api, { counts: [a, b], sizes, least: chance(.35) });
}
function compareThree(api){
  const set = new Set();
  for (let g = 0; g < 300 && set.size < 3; g++) set.add(ri(2, 12));
  [2, 7, 12].forEach(v => { if (set.size < 3) set.add(v); });
  platesCompare(api, { counts: Array.from(set), least: chance(.45) });
}
function compareNumerals(api){
  // two numerals, or three for a check on another day
  const nums = [ri(1, 20)];
  for (let g = 0; g < 400 && nums.length < (api.check ? 3 : 2); g++){
    const v = ri(1, 20);
    if (nums.indexOf(v) < 0) nums.push(v);
  }
  const two = nums.length === 2;
  const most = chance(.6);
  const sorted = nums.slice().sort((x, y) => x - y);
  const ans = most ? sorted[sorted.length - 1] : sorted[0];
  api.item('numcmp:' + sorted.join('_') + ':' + (most ? 'g' : 'l'),
    'すうじ ' + nums.join(' と ') + ' の くらべ');
  api.setPrompt(two ? (most ? 'かずが <b>おおきい</b> のは どっち？' : 'かずが <b>ちいさい</b> のは どっち？')
                    : (most ? 'いちばん <b>おおきい</b> かずは どれ？' : 'いちばん <b>ちいさい</b> かずは どれ？'),
                two ? (most ? '数が大きいのは、どっち？' : '数が小さいのは、どっち？')
                    : (most ? '一番大きい数は、どれ？' : '一番小さい数は、どれ？'));
  api.field.append(el('div.hintline', { text: 'すうじで くらべよう' }));
  api.buildChoices(shuffle(nums), ans);
  const hi2 = sorted[sorted.length - 1];
  const line = Coach.once(() => {
    const l = el('div.numline.cmpline', { style: { flexWrap: 'nowrap' } });
    for (let v = 1; v <= Math.max(10, hi2); v++){
      const c = el('div.nn', { text: String(v) });
      if (nums.indexOf(v) >= 0) c.classList.add('near');
      l.append(c);
    }
    api.field.append(l);
    return l;
  });
  api.coach({
    text: 'かずの ならびで あとに でて くる ほうが おおきい',
    say: '数の並びで、後に出てくるほうが、大きいよ。',
    tool(){ line(); },
    walk(){
      const cells = $$('.nn', line());
      return sorted.map((v, i) => i === sorted.length - 1
        ? { at: cells[v - 1], say: `${numKana(v)}が、一番後ろ。`, ms: 1900 }
        : { at: cells[v - 1], say: numKana(v), ms: 1100 });
    }
  });
}

/** The quantity stays the same when the spacing changes. This asks about
    conservation directly instead of merely making large icons look numerous. */
function conserveNumber(api){
  const n = ri(4, 8), thing = pick(THINGS);
  api.item('conserve:' + n, n + 'こを ひろげても おなじ');
  api.setPrompt('よく みていてね。ならびかたを かえるよ', 'よく見ていてね。並び方を変えるよ。');
  const row = el('div.conserve-row');
  for (let i = 0; i < n; i++) row.append(el('span', { text: thing.e }));
  api.field.append(row);
  api.later(() => {
    row.classList.add('spread');
    Sound.sfx.swoosh();
    api.later(() => {
      api.setPrompt('ひろげたら、かずは かわった？', '広げたら、数は変わった？');
      api.buildChoices(['おなじ', 'かわった'], 'おなじ');
    }, 650);
  }, 650);
  const things = Array.from(row.children);
  api.coach({
    text: 'ひろげる まえと あとで かぞえて みよう',
    say: '広げる前と後で、数えてみよう。',
    tool(){ things.forEach((x, i) => Coach.tag(x, i + 1)); },
    walk(){
      const steps = [{ act(){ row.classList.remove('spread'); $$('.ctag', row).forEach(t => t.remove()); }, ms: 900 }];
      things.forEach((x, i) => steps.push({ at: x, act(){ Coach.tag(x, i + 1); }, say: numKana(i + 1), ms: 480 }));
      steps.push({ act(){ row.classList.add('spread'); Sound.sfx.swoosh(); }, say: '広げても…', ms: 1300 });
      things.forEach((x, i) => steps.push({ at: x, say: numKana(i + 1), ms: 480 }));
      steps.push({ say: `どちらも、${koKana(n)}。`, ms: 1700 });
      return steps;
    }
  });
}

/* ============================================================
   6. なんばんめ — ordinal position vs cardinal amount
   ============================================================ */
const CRITTERS = ['🐰','🐻','🦊','🐯','🐨','🐸','🐷','🐮','🐼','🐵','🦁','🐔','🐧','🦉'];

function ordinalRow(api, n, dir, target){
  const critters = sample(CRITTERS, n);
  const label = { front: 'まえ', back: 'うしろ', left: 'ひだり', right: 'みぎ' }[dir];
  api.item('ord:' + dir + ':' + target, label + 'から ' + target + 'ばんめ');
  api.setPrompt(`${label}から ${numTag(target)}ばんめ の どうぶつを タップ`,
                `${label}から${banmeKana(target)}の動物をタップ。`);
  const idxWanted = (dir === 'front' || dir === 'left') ? target - 1 : n - target;
  const q = el('div.queue');
  const mirror = n - 1 - idxWanted;      // the same 「◯ばんめ」 counted from the other end
  critters.forEach((c, i) => {
    const item = el('div.qi', { text: c });
    tappable(item, () => {
      if (api.locked) return;
      if (i === idxWanted){ item.classList.add('correct'); api.correct(); }
      else {
        item.classList.add('wrong');
        api.later(() => item.classList.remove('wrong'), 460);
        api.wrong(item, i === mirror ? 'rev' : null);
      }
    });
    q.append(item);
  });
  api.onShow(() => { const it = $$('.qi', q)[idxWanted]; if (it) it.click(); });
  // the marker sits at the end you count from and points into the line
  const fromLeft = (dir === 'front' || dir === 'left');
  const marker = fromLeft
    ? el('div.dirmark', null, label + 'から', arrowSVG('right'))
    : el('div.dirmark', null, arrowSVG('left'), label + 'から');
  api.field.append(el('div.row', { style: { flexWrap: 'nowrap', gap: 'calc(var(--u)*.6)', maxWidth: '100%' } },
    fromLeft ? marker : null, q, fromLeft ? null : marker));
  /* It used to number every animal from the end being counted from, which put the
     asked-for number on the right animal. Now only the start is marked; the counting
     is the child's, and the hand does it only when asked to show. */
  const fromStart = () => fromLeft ? $$('.qi', q) : $$('.qi', q).reverse();
  api.coach({
    text: `${label}から かぞえるよ。はじめは この こ`,
    say: `${label}から数えるよ。最初は、この子。`,
    tool(){ const first = fromStart()[0]; Coach.tag(first, 1, 'alt'); Coach.pulse([first, marker]); },
    walk(){
      return fromStart().slice(0, target).map((it, i) => ({
        at: it, act(){ Coach.tag(it, i + 1, 'alt'); },
        say: i + 1 === target ? banmeKana(target) : numKana(i + 1), ms: i + 1 === target ? 1600 : 600 }));
    }
  });
}

function ordinalVsCount(api, n){
  const critters = sample(CRITTERS, n);
  const k = ri(2, Math.min(4, n - 1));
  const countMode = chance(.5);
  api.item('ovc:' + (countMode ? 'ko' : 'me') + ':' + k, k + (countMode ? 'こ（ぜんぶ）' : 'ばんめ（ひとり）'));
  api.setPrompt(countMode
      ? `まえから ${numTag(k)}<b>こ</b> タップ　（${k}ひき ぜんぶ）`
      : `まえから ${numTag(k)}<b>ばんめ</b> だけ タップ`,
    countMode ? `前から${koKana(k)}、タップしてね。` : `前から${banmeKana(k)}だけタップしてね。`);
  const q = el('div.queue');
  const marked = new Set();
  critters.forEach((c, i) => {
    const item = el('div.qi', { text: c });
    tappable(item, () => {
      if (api.locked) return;
      if (countMode){
        if (marked.has(i)){ marked.delete(i); item.classList.remove('marked'); Sound.sfx.tap(); return; }
        marked.add(i); item.classList.add('marked'); Sound.sfx.count(marked.size - 1);
        if (marked.size === k){
          const ok = Array.from(marked).every(v => v < k);
          if (ok){ $$('.qi', q).forEach((x, j) => { if (j < k) x.classList.add('correct'); }); api.correct(); }
          else {
            api.wrong();
            marked.forEach(v => $$('.qi', q)[v].classList.remove('marked'));
            marked.clear();
          }
        }
      } else {
        if (i === k - 1){ item.classList.add('correct'); api.correct(); }
        else {
          item.classList.add('wrong');
          api.later(() => item.classList.remove('wrong'), 460);
          api.wrong(item, i === n - k ? 'rev' : null);
        }
      }
    });
    q.append(item);
  });
  api.onShow(() => {
    const items = $$('.qi', q);
    if (!countMode){ if (items[k - 1]) items[k - 1].click(); return; }
    items.forEach((x, i) => { if (i < k && !x.classList.contains('marked')) x.click(); });
  });
  api.field.append(el('div.row', { style: { flexWrap: 'nowrap', gap: 'calc(var(--u)*.6)', maxWidth: '100%' } },
    el('div.dirmark', null, 'まえ', arrowSVG('right')), q));
  api.coach({
    text: countMode ? `「${k}こ」は まえから ${k}ひき ぜんぶ` : `「${k}ばんめ」は その 1ぴき だけ`,
    say: countMode ? `${koKana(k)}は、前から${k}匹、全部だよ。` : `${banmeKana(k)}は、その一匹だけだよ。`,
    tool(){ Coach.tag($$('.qi', q)[0], 1, 'alt'); Coach.pulse($('.dirmark', api.field)); },
    walk(){
      const its = $$('.qi', q);
      return its.slice(0, k).map((it, i) => ({ at: it, act(){ Coach.tag(it, i + 1, 'alt'); }, say: numKana(i + 1), ms: 600 }))
        .concat([{ at: its[k - 1], act(){ Coach.pulse(countMode ? its.slice(0, k) : its[k - 1]); },
                   say: countMode ? `ここまで、全部で${koKana(k)}。` : `${banmeKana(k)}は、この子だけ。`, ms: 1900 }]);
    }
  });
}

function gridPosition(api, cols, rows){
  const cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push({ r, c });
  const pool = shuffle(CRITTERS.concat(CRITTERS)).slice(0, cols * rows);
  const tr = ri(1, rows), tc = ri(1, cols);
  api.item('grid:' + tr + '_' + tc, 'うえから ' + tr + '・ひだりから ' + tc);
  api.setPrompt(`うえから ${numTag(tr)}ばんめ、ひだりから ${numTag(tc)}ばんめ は だれ？`,
                `上から${banmeKana(tr)}、左から${banmeKana(tc)}は、だれ？`);
  const g = el('div.qgrid', { style: { '--gc': cols } });
  const items = [];
  cells.forEach((cell, i) => {
    const item = el('div.qi', { text: pool[i] });
    items.push(item);
    tappable(item, () => {
      if (api.locked) return;
      if (cell.r === tr - 1 && cell.c === tc - 1){ item.classList.add('correct'); api.correct(); }
      else {
        item.classList.add('wrong');
        api.later(() => item.classList.remove('wrong'), 460);
        // read the two axes the other way round: 「うえから3・ひだりから2」→「うえから2・ひだりから3」
        api.wrong(item, (cell.r === tc - 1 && cell.c === tr - 1) ? 'rev' : null);
      }
    });
    g.append(item);
  });
  api.onShow(() => {
    const at = cells.findIndex(c => c.r === tr - 1 && c.c === tc - 1);
    if (items[at]) items[at].click();
  });
  // two axes at once is hard enough without having to guess where counting starts
  api.field.append(el('div.axes', null,
    el('div.axis-x', null, 'ひだりから', arrowSVG('right')),
    el('div.axis-row', null,
      el('div.axis-y', null, 'うえ', arrowSVG('right')),
      g)));
  /* Lighting both the row and the column lit exactly one cell: the answer. The row
     alone is the first half of the method, and the child does the second. */
  const rowItems = () => items.filter((it, i) => cells[i].r === tr - 1);
  api.coach({
    text: `まず うえから ${tr}ばんめの よこの れつ`,
    say: `まず、上から${banmeKana(tr)}の、横の列を見つけよう。`,
    tool(){ rowItems().forEach(it => it.classList.add('rowhint')); Coach.pulse($('.axis-y', api.field)); },
    walk(){
      const firstCol = items.filter((it, i) => cells[i].c === 0);
      const steps = firstCol.slice(0, tr).map((it, i) => ({ at: it, act(){ Coach.tag(it, i + 1, 'alt'); }, say: numKana(i + 1), ms: 600 }));
      steps.push({ act(){ rowItems().forEach(it => it.classList.add('rowhint')); }, say: `上から${banmeKana(tr)}。次は、左から。`, ms: 1800 });
      rowItems().slice(0, tc).forEach((it, i) => steps.push({ at: it, act(){ Coach.tag(it, i + 1); }, say: numKana(i + 1), ms: 600 }));
      return steps;
    }
  });
}

Games.add({

  aim: '<b>「3こ」（いくつ分）と「3ばんめ」（順序）の区別</b>、そして「どこから数えるか」で答えが変わることの理解。小1の最初の単元でつまずきが集中する場所です。',

/* ============================================================
   7. おおきさ くらべ — length, capacity, ordering
   ============================================================ */
const MEAS_ICONS = ['✏️','🖍','🧵','🥕','🦴','🪵','🧹','🎋'];

/* one row = icon + a fixed-width track; the bar's width is a share of the track,
   so what the child sees is exactly proportional to the length being compared. */
function barRow(len, offset, color, cap){
  const track = el('div.track', null,
    offset ? el('div.gap', { style: { width: offset + '%' } }) : null,
    el('div.stickbar', { style: { width: len + '%', '--mc': color } }));
  return el('div.mrow', { role: 'button', tabindex: '0' }, el('div.cap', { text: cap }), track);
}

function lengthCompare(api, aligned){
  const n = ri(3, 4);
  const lens = [];
  for (let g = 0; g < 400 && lens.length < n; g++){
    const v = ri(24, 92);
    if (lens.every(x => Math.abs(x - v) >= 12)) lens.push(v);
  }
  while (lens.length < n) lens.push(28 + lens.length * 16);
  const cap = pick(MEAS_ICONS);
  const longest = chance(.55);
  const ans = longest ? Math.max.apply(null, lens) : Math.min.apply(null, lens);
  api.item('len:' + (aligned ? 'aligned' : 'ragged') + ':' + (longest ? 'L' : 'S') + ':' + n,
    (aligned ? 'はしが そろった ' : 'はしが ずれた ') + (longest ? 'いちばん ながい' : 'いちばん みじかい'));
  api.setPrompt(longest ? 'いちばん <b>ながい</b> のは どれ？' : 'いちばん <b>みじかい</b> のは どれ？',
                longest ? '一番長いのは、どれ？' : '一番短いのは、どれ？');
  const wrap = el('div.measure');
  const colors = shuffle(['var(--c-red)','var(--c-blue)','var(--c-green)','var(--c-purple)']);
  const ends = [];
  lens.forEach((L, i) => {
    const off = aligned ? 0 : ri(0, Math.max(0, Math.min(22, 97 - L)));
    ends.push(off + L);
    const row = barRow(L, off, colors[i % colors.length], cap);
    row.dataset.len = L;
    tappable(row, () => {
      if (api.locked) return;
      if (L === ans){ row.classList.add('correct'); api.correct(); }
      else {
        row.classList.add('wrong');
        api.later(() => row.classList.remove('wrong'), 460);
        // ragged starts: going by which bar reaches furthest right is the error
        // this level is about, and it is not the same as「ながさ」
        const furthest = !aligned && longest && (off + L) >= Math.max.apply(null, ends);
        api.wrong(row, furthest ? 'looks' : null);
      }
    });
    wrap.append(row);
  });
  api.field.append(wrap);
  api.onShow(() => {
    const r = $$('.mrow', wrap).find(x => Number(x.dataset.len) === ans);
    if (r) r.click();
  });
  if (!aligned) api.field.append(el('div.hintline', { text: 'はじまる ところが ちがうよ。ながさ だけを みてね' }));
  // sliding every bar back to a shared start line IS the lesson, so show it — and
  // put equal marks along the tracks, so an aligned set can be compared by more than eye
  const align = () => {
    $$('.track .gap', wrap).forEach(g => { g.style.transition = 'width .6s ease'; g.style.width = '0%'; });
    wrap.classList.add('lined');
    Coach.ticks(wrap);
  };
  api.coach({
    text: aligned ? 'めもりを みて ながさを くらべよう' : 'はじまりを そろえたよ。はしを くらべよう',
    say: aligned ? '目盛りを見て、長さを比べよう。' : '始まりをそろえたよ。端を、比べよう。',
    tool: align,
    walk(){
      align();
      const rows = $$('.mrow', wrap).sort((x, y) => longest ? x.dataset.len - y.dataset.len : y.dataset.len - x.dataset.len);
      return rows.map((r, i) => {
        const last = i === rows.length - 1;
        return { at: () => $('.stickbar', r), act(){ if (last) Coach.pulse(r); },
                 say: last ? (longest ? '一番長いのは、これ。' : '一番短いのは、これ。') : '', ms: last ? 1800 : 650 };
      });
    }
  });
}

function vesselSVG(w, h, fill, color){
  const W = 90, H = 130;
  const x = (W - w) / 2;
  const waterH = h * fill;
  return svg('svg', { viewBox: `0 0 ${W} ${H}`, width: 'calc(var(--u)*11)', height: 'calc(var(--u)*16)' },
    svg('rect', { x, y: H - h - 6, width: w, height: h, rx: 4, fill: 'var(--card)', stroke: 'var(--ink)', 'stroke-width': 3 }),
    svg('rect', { x: x + 3, y: H - waterH - 9, width: w - 6, height: waterH, rx: 3, fill: color, opacity: .85 }),
    svg('rect', { x, y: H - h - 6, width: w, height: h, rx: 4, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 3 }));
}

/* A shared unit for every glass in the question.
   The hint tells the child to count squares, so the squares have to be the same
   size in every glass and on both axes — 任意単位は同じ大きさでそろえる is the whole
   point of 1年生「かさくらべ」. The old hint derived its spacing from each glass's
   own width and height (`w / round(w / 13)`), so a wide glass got wide squares and
   a narrow one got narrow squares: counting them gave a tie or the wrong answer in
   about 2% of questions (面積 2442 と 3483 が どちらも18マス), and taught an invalid
   way of comparing in all of them.

   Sizing the water to whole multiples of one unit makes the count exact, so the
   answer the child reaches by counting is always the answer the question wants. */
const CAP_UNIT = 12;                    // SVG units, square
const CAP_COLS = [2, 3, 4];             // water width  = cols * CAP_UNIT
const CAP_ROWS = [5, 6, 7, 8, 9];       // water height = rows * CAP_UNIT
const CAP_FALLBACK = [[2, 9], [4, 6], [2, 5]];

function capSpec(cols, rows){
  return { cols, rows, cells: cols * rows,
           w: cols * CAP_UNIT + 6,      // vesselSVG insets the water by 3 a side
           h: rows * CAP_UNIT, fill: 1 };
}

function capacityCompare(api){
  const n = !api.check && chance(.5) ? 2 : 3;
  // far enough apart to be a fair question by eye as well as by counting
  const clearOf = (list, s) => list.every(o =>
    Math.abs(o.cells - s.cells) / Math.max(o.cells, s.cells) > 0.18);

  let specs = [];
  for (let attempt = 0; attempt < 60 && !specs.length; attempt++){
    const trial = [];
    for (let g = 0; g < 300 && trial.length < n; g++){
      const s = capSpec(pick(CAP_COLS), pick(CAP_ROWS));
      if (clearOf(trial, s)) trial.push(s);
    }
    if (trial.length < n) continue;
    // "tall" must not mean "much": keep looking for a set where the tallest glass
    // is not the fullest one, and only give up on that near the end
    const tallest = trial.reduce((a, b) => a.rows > b.rows ? a : b);
    const fullest = trial.reduce((a, b) => a.cells > b.cells ? a : b);
    if (attempt < 45 && tallest === fullest) continue;
    specs = trial;
  }
  if (specs.length < n) specs = CAP_FALLBACK.slice(0, n).map(([c, r]) => capSpec(c, r));

  const more = chance(.6);
  const ans = more ? Math.max.apply(null, specs.map(s => s.cells))
                   : Math.min.apply(null, specs.map(s => s.cells));
  api.item('cap:' + (more ? 'more' : 'less') + ':' + n, 'かさが ' + (more ? 'おおい' : 'すくない') + ' コップ');
  api.setPrompt(more ? 'ジュースが <b>おおい</b> のは どれ？' : 'ジュースが <b>すくない</b> のは どれ？',
                more ? 'ジュースが多いのは、どれ？' : 'ジュースが少ないのは、どれ？');
  const colors = shuffle(['var(--c-orange)','var(--c-red)','var(--c-purple)']);
  const wrap = el('div.vessels');
  const tallest = Math.max.apply(null, specs.map(s => s.rows));
  shuffle(specs).forEach((s, i) => {
    const v = el('div.vessel', null, vesselSVG(s.w, s.h, s.fill, colors[i % colors.length]));
    v.dataset.cells = s.cells;
    tappable(v, () => {
      if (api.locked) return;
      if (s.cells === ans){ v.classList.add('correct'); api.correct(); }
      else {
        v.classList.add('wrong');
        api.later(() => v.classList.remove('wrong'), 460);
        // 「せが たかい ＝ おおい」 — the hintline warns about it; this records it
        api.wrong(v, (more && s.rows === tallest) ? 'looks' : null);
      }
    });
    wrap.append(v);
  });
  api.onShow(() => {
    const v = $$('.vessel', wrap).find(x => Number(x.dataset.cells) === ans);
    if (v) v.click();
  });
  api.field.append(wrap, el('div.hintline', { text: 'せが たかい ＝ おおい とは かぎらないよ' }));
  // one unit, the same in every glass, dividing the water exactly
  const unitGrid = () => {
    $$('.vessel svg', wrap).forEach(sv => {
      const water = sv.querySelectorAll('rect')[1];
      if (!water || sv.querySelector('.unitgrid')) return;
      const x = +water.getAttribute('x'), y = +water.getAttribute('y');
      const w = +water.getAttribute('width'), h = +water.getAttribute('height');
      const g = svg('g', { class: 'unitgrid' });
      for (let gx = x; gx <= x + w + 0.1; gx += CAP_UNIT)
        g.append(svg('line', { x1: gx, y1: y, x2: gx, y2: y + h, stroke: 'rgba(255,255,255,.75)', 'stroke-width': 1 }));
      for (let gy = y; gy <= y + h + 0.1; gy += CAP_UNIT)
        g.append(svg('line', { x1: x, y1: gy, x2: x + w, y2: gy, stroke: 'rgba(255,255,255,.75)', 'stroke-width': 1 }));
      sv.append(g);
    });
  };
  api.coach({
    text: 'おなじ おおきさの ますが いくつ ぶんか かぞえよう',
    say: '同じ大きさのますが、いくつ分か、数えよう。',
    tool: unitGrid,
    walk(){
      unitGrid();
      return $$('.vessel', wrap).map(v => ({
        at: v,
        act(){ if (!$('.caplabel', v)) v.append(el('div.hintline.caplabel', { text: v.dataset.cells + 'ます' })); },
        say: numKana(Number(v.dataset.cells)) + 'ます', ms: 1400 }));
    }
  });
}

function orderBySize(api){
  const n = ri(3, 4);
  const lens = [];
  for (let g = 0; g < 400 && lens.length < n; g++){
    const v = ri(26, 94);
    if (lens.every(x => Math.abs(x - v) >= 14)) lens.push(v);
  }
  while (lens.length < n) lens.push(30 + lens.length * 18);
  const asc = chance(.5);
  const wanted = lens.slice().sort((a, b) => asc ? a - b : b - a);
  api.item('order:' + (asc ? 'asc' : 'desc') + ':' + n, n + 'つを ' + (asc ? 'みじかい' : 'ながい') + ' じゅんに');
  api.setPrompt(asc ? '<b>みじかい</b> じゅんに タップしよう' : '<b>ながい</b> じゅんに タップしよう',
                asc ? '短い順にタップしよう。' : '長い順にタップしよう。');
  const cap = pick(MEAS_ICONS);
  const colors = shuffle(['var(--c-red)','var(--c-blue)','var(--c-green)','var(--c-purple)']);
  const wrap = el('div.measure');
  let step = 0;
  shuffle(lens).forEach((L, i) => {
    const row = barRow(L, 0, colors[i % colors.length], cap);
    tappable(row, () => {
      if (api.locked || row.classList.contains('picked')) return;
      if (L === wanted[step]){
        step++;
        row.classList.add('picked');
        row.classList.remove('nexthint');
        row.prepend(el('div.ordno', { text: String(step) }));
        Sound.sfx.count(step - 1);
        if (step === n){ $$('.mrow', wrap).forEach(r => r.classList.add('correct')); api.correct(); }
      } else {
        row.classList.add('wrong');
        api.later(() => row.classList.remove('wrong'), 460);
        api.wrong(row);
      }
    });
    wrap.append(row);
  });
  api.field.append(wrap);
  // lighting the next bar picked it for the child; the marks let them pick it
  api.coach({
    text: asc ? 'のこりの なかで いちばん みじかいのは？' : 'のこりの なかで いちばん ながいのは？',
    say: asc ? '残りの中で、一番短いのは、どれ？' : '残りの中で、一番長いのは、どれ？',
    tool(){ Coach.ticks(wrap); },
    walk(){
      Coach.ticks(wrap);
      const wantNow = wanted[step];
      const r = $$('.mrow', wrap).find(x => Math.abs(parseFloat($('.stickbar', x).style.width) - wantNow) < 0.01);
      return r ? [{ at: () => $('.stickbar', r), act(){ r.classList.add('nexthint'); },
                    say: asc ? 'これが、次に短い。' : 'これが、次に長い。', ms: 1700 }] : [];
    }
  });
  api.onShow(() => {
    wanted.slice(step).forEach(len => {
      const r = $$('.mrow', wrap).find(x => !x.classList.contains('picked')
        && Math.abs(parseFloat($('.stickbar', x).style.width) - len) < 0.01);
      if (r) r.click();
    });
  });
}

/* ---- 12-g-calc.js ---- */
/* ===========================================================
   12 — WORLD 3「けいさんの やま」 いくつといくつ・10のおともだち・たし／ひき
   =========================================================== */
'use strict';

/** In a 集中練習 session the engine names the exact fact this question should ask.
    These generators read it, so a fact the child keeps missing can come round
    several times in one sitting; きょうの れんしゅう on its own gives one particular
    fact about a turn a fortnight. Returns the numbers in the key, or null. */
function wanted(api, re){
  const m = api.want && re.exec(api.want);
  return m ? m.slice(1).map(Number) : null;
}

/* ---------- shared: bond diagram ---------- */
function bondNode(whole, known, unknownLabel){
  const legs = svg('svg', { viewBox: '0 0 100 20', class: 'legs' },
    svg('path', { d: 'M50 0 L18 18 M50 0 L82 18', stroke: 'var(--ink)', 'stroke-width': 3,
                  'stroke-linecap': 'round', fill: 'none' }));
  return el('div.bond', null,
    el('div.whole', { text: String(whole) }),
    legs,
    el('div.parts', null,
      el('div.part.known', { text: String(known) }),
      el('div.part.unknown', { text: unknownLabel == null ? '?' : String(unknownLabel) })));
}

/* five/ten frame with a known part in blue and the missing part as empty holes */
function partFrame(whole, known){
  const cols = whole > 5 ? 5 : whole;
  const f = el('div.tenframe', { style: { '--cols': cols } });
  for (let i = 0; i < whole; i++){
    const cell = el('div.cell' + (i >= known ? '.hole' : ''));
    if (i < known) cell.append(el('div.dot'));
    f.append(cell);
  }
  return f;
}

/* ============================================================
   8. いくつと いくつ — number bonds (decompose & compose)
   ============================================================ */
function decompose(api, whole, pad){
  const w = wanted(api, /^dec:(\d+)-(\d+)$/);
  const aim = w && w[0] >= 2 && w[1] >= 1 && w[1] < w[0];
  if (aim) whole = w[0];
  const known = aim ? w[1] : ri(1, whole - 1), ans = whole - known;
  api.item('dec:' + whole + '-' + known, whole + ' は ' + known + ' と ' + ans);
  api.setPrompt(`${numTag(whole)} は ${numTag(known)} と いくつ？`,
                `${numKana(whole)}は、${numKana(known)}といくつ？`);
  const frame = partFrame(whole, known);
  const frameset = el('div.frameset', null, frame);
  const bond = bondNode(whole, known, null);
  /* At the top level the picture *is* the answer: 「10は4といくつ」 with a ten-frame
     on screen is solved by counting the six empty cells, not by remembering that
     10 is 4 and 6. The keypad took guessing out of this level; leaving the frame up
     left counting in, which is the strategy the level exists to replace. So the
     frame comes back the moment the child answers — and earlier if they get stuck —
     where it confirms what they said instead of telling them. */
  if (!pad) api.field.append(frameset);
  api.field.append(bond);
  const showFrame = () => { if (!frameset.isConnected) api.field.prepend(frameset); };
  const showParts = {
    correctOpts: { delay: 1500 },
    onPick(){
      showFrame();
      // show the two parts making the whole (scoped to this question's own nodes)
      const cells = $$('.cell', frame);
      for (let i = known; i < whole; i++){
        api.later(() => {
          if (!cells[i].firstChild){ cells[i].classList.remove('hole'); cells[i].append(el('div.dot.b')); Sound.sfx.place(); }
        }, (i - known) * 170 + 200);
      }
      $('.part.unknown', bond).textContent = String(ans);
    }
  };
  if (pad) api.buildPad(ans, showParts);
  else api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 1, whole))), ans, showParts);
  /* The empty cells become the child's to fill, counting on from the part they can
     see. What they added is the answer, in red, made with their own taps. */
  let walking = false;
  const fill = Coach.once(() => Coach.fillable(api, $$('.cell', frame), { from: known,
    onDone(){ if (walking) return; Coach.pulse($$('.dot.b', frame)); Sound.say('赤い丸は、いくつ？', { delay: 80 }); } }));
  api.coach({
    text: `あいて いる ところを タップして ${whole}に しよう`,
    say: `空いているところをタップして、${numKana(whole)}にしよう。`,
    tool(){ showFrame(); fill(); },
    walk(){
      walking = true;
      showFrame();
      const steps = fill().steps();
      $$('.cell', frame).slice(known).forEach((c, i) => steps.push({ at: c, act(){ Coach.tag(c, i + 1, 'alt'); }, say: numKana(i + 1), ms: 620 }));
      steps.push({ say: `${numKana(known)}と${numKana(ans)}で、${numKana(whole)}。`, ms: 2100 });
      return steps;
    }
  });
}

function compose(api, maxWhole, pad){
  const w = wanted(api, /^com:(\d+)\+(\d+)$/);
  const aim = w && w[0] >= 1 && w[1] >= 1 && w[0] + w[1] <= maxWhole;
  const a = aim ? w[0] : ri(1, maxWhole - 1);
  const b = aim ? w[1] : ri(1, maxWhole - a), ans = a + b;
  api.item('com:' + a + '+' + b, a + ' と ' + b + ' で ' + ans);
  api.setPrompt(`${numTag(a)} と ${numTag(b)} で いくつ？`,
                `${numKana(a)}と${numKana(b)}で、いくつ？`);
  const slots = a + b > 5 ? 10 : 5;
  const f = el('div.tenframe', { style: { '--cols': 5 } });
  for (let i = 0; i < slots; i++){
    const cell = el('div.cell');
    if (i < a) cell.append(el('div.dot'));
    else if (i < a + b) cell.append(el('div.dot.b'));
    f.append(cell);
  }
  const frameset = el('div.frameset', null, f);
  if (!pad) api.field.append(frameset);          // countable at the top level: see decompose
  const box = el('span.box', { text: '?' });
  api.field.append(
    el('div.eq', null, String(a), el('span.op', { text: 'と' }), String(b), el('span.op', { text: 'で' }), box));
  const showFrame = () => { if (!frameset.isConnected) api.field.prepend(frameset); };
  const reveal = revealed(() => { fillBlank(box, ans); showFrame(); }, { delay: 1400 });
  if (pad) api.buildPad(ans, reveal);
  else api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 1, maxWhole + 2))), ans, reveal);
  const cnt = Coach.once(() => Coach.countable(api, $$('.dot', f)));
  api.coach({
    text: 'あおと あかを ぜんぶ かぞえよう',
    say: '青と赤を、全部数えよう。',
    tool(){ showFrame(); cnt(); },
    walk(){ showFrame(); return cnt().steps(); }
  });
}

/** Make two different decompositions. There is no single hidden answer: every
    split is valid, and the child succeeds by producing a genuinely different one. */
function makeTwoWays(api){
  const whole = ri(6, 9);
  api.item('ways:' + whole, whole + ' を 2とおりに わける');
  api.setPrompt(`${numTag(whole)} を ちがう 2つの やりかたで わけよう`,
                `${numKana(whole)}を、違う二つのやり方で分けよう。`);
  const made = [], board = el('div.ways-board');
  let accepting = true;
  api.field.append(board);

  const draw = () => {
    clear(board);
    made.forEach((a, i) => board.append(
      el('div.way', null,
        el('span.no', { text: String(i + 1) }),
        bondNode(whole, a, whole - a))));
  };
  const build = () => {
    clear(api.choices);
    accepting = true;
    for (let a = 1; a < whole; a++){
      const b = el('button.choice', { type: 'button', text: String(a) });
      b.addEventListener('click', () => {
        if (api.locked || !accepting) return;
        accepting = false;                    // a double tap is one construction
        const same = made.some(x => Math.min(x, whole - x) === Math.min(a, whole - a));
        if (same){
          api.wrong(b);
          Sound.say('同じ分け方だね。違う分け方も作ってみよう。', { delay: 250 });
          api.later(() => { accepting = true; }, 360);
          return;
        }
        made.push(a);
        b.classList.add('correct');
        draw();
        Sound.say(`${numKana(a)}と${numKana(whole-a)}。`, { delay: 120 });
        if (made.length >= 2) api.later(() => api.correct({ quiet: true, delay: 900 }), 350);
        else api.later(build, 350);
      });
      api.choices.append(b);
    }
  };
  draw();
  build();
  const unused = () => {
    const used = new Set(made.map(x => Math.min(x, whole - x)));
    return Array.from({ length: whole - 1 }, (_, i) => i + 1)
      .find(x => !used.has(Math.min(x, whole - x))) || 1;
  };
  api.coach({
    text: () => { const a = unused(); return a + ' と ' + (whole - a) + ' に わけることも できるよ'; },
    say: () => { const a = unused(); return `${numKana(a)}と${numKana(whole - a)}に、分けることもできるよ。`; },
    tool(){ if (!$('.tenframe', api.field)) api.field.append(el('div.frameset', null, tenFrameNode(whole, 5, { total: whole > 5 ? 10 : 5 }))); },
    walk(){
      const a = unused();
      const b = $$('.choice', api.choices).find(x => Number(x.textContent) === a);
      return b ? [{ at: b, say: `${numKana(a)}を押してみよう。`, ms: 1700 }] : [];
    }
  });
  api.onShow(() => {
    const press = v => { const b = $$('.choice', api.choices).find(x => Number(x.textContent) === v); if (b) b.click(); };
    const taken = new Set(made.map(x => Math.min(x, whole - x)));
    const picks = [1, 2, 3].filter(v => !taken.has(v)).slice(0, 2 - made.length);
    press(picks[0]);
    if (picks[1] != null) api.later(() => press(picks[1]), 450);
  });
}

/* ============================================================
   9. １０の おともだち — make ten
   ============================================================ */
function fillToTen(api){
  const w = wanted(api, /^fill10:(\d+)$/);
  const start = (w && w[0] >= 2 && w[0] <= 8) ? w[0] : ri(2, 8);
  api.item('fill10:' + start, start + ' から 10 まで あと ' + (10 - start));
  api.setPrompt(`わくが <b>10</b> に なるように タップして たそう`, '枠が10になるように、タップして足そう。');
  const f = el('div.tenframe', { style: { '--cols': 5 } });
  const cells = [];
  for (let i = 0; i < 10; i++){
    const cell = el('div.cell' + (i >= start ? '.tappable' : ''));
    if (i < start) cell.append(el('div.dot'));
    cells.push(cell); f.append(cell);
  }
  let count = start;
  const readout = el('div.hintline', { text: 'いま ' + count + 'こ' });
  cells.forEach((cell, i) => {
    if (i < start) return;
    cell.addEventListener('click', () => {
      if (api.locked || cell.firstChild) return;
      cell.append(el('div.dot.b'));
      count++;
      Sound.sfx.count(count - 1);
      Sound.say(numKana(count), { delay: 0, rate: 1.08 });
      readout.textContent = 'いま ' + count + 'こ';
      if (count === 10){
        api.later(() => {
          const add = 10 - start;
          api.setPrompt(`${numTag(start)} に <b>いくつ たした？</b>`,
                        `${numKana(start)}に、いくつ足した？`);
          api.buildChoices(shuffle([add].concat(distractors(add, 2, 1, 9))), add, {
            correctOpts: { delay: 900 }
          });
        }, 300);
      }
    });
  });
  api.field.append(el('div.frameset', null, f), readout);
  api.coach({ walk(){ return cells.filter(c => !c.firstChild).map(c => ({ at: c, act(){ c.click(); }, ms: 620 })); } });
  api.onHint(() => { readout.textContent = 'いま ' + count + 'こ　／　あと ' + (10 - count) + 'こ'; });
  api.onShow(() => {
    cells.filter(c => !c.firstChild).forEach(c => c.click());
    api.later(() => { const b = $('.choice.correct') || $$('.choice', api.choices).find(x => x.textContent === String(10 - start)); if (b) b.click(); }, 650);
  });
}

function partnerOfTen(api, pad){
  const w = wanted(api, /^ten:(\d+)$/);
  const a = (w && w[0] >= 1 && w[0] <= 9) ? w[0] : ri(1, 9), ans = 10 - a;
  api.item('ten:' + a, a + ' と ' + ans + ' で 10');
  api.setPrompt(`${numTag(a)} と いくつで <b>10</b>？`, `${numKana(a)}といくつで、10？`);
  const f = el('div.tenframe', { style: { '--cols': 5 } });
  const cells = [];
  for (let i = 0; i < 10; i++){
    const cell = el('div.cell' + (i >= a ? '.hole' : ''));
    if (i < a) cell.append(el('div.dot'));
    cells.push(cell); f.append(cell);
  }
  /* Same reason as いくつと いくつ L3: 「2と いくつで 10？」 above two blue dots and
     eight empty cells is a counting question wearing a retrieval question's clothes.
     The equation stays — that is the question; the frame is the answer. */
  const frameset = el('div.frameset', null, f);
  if (!pad) api.field.append(frameset);
  const box = el('span.box', { text: '?' });
  api.field.append(
    el('div.eq', null, String(a), el('span.op', { text: 'と' }), box, el('span.op', { text: 'で' }), '10'));
  const showFrame = () => { if (!frameset.isConnected) api.field.prepend(frameset); };
  const fillIn = () => {
    fillBlank(box, ans);
    showFrame();
    for (let i = a; i < 10; i++){
      api.later(() => {
        if (!cells[i].firstChild){ cells[i].classList.remove('hole'); cells[i].append(el('div.dot.b')); Sound.sfx.place(); }
      }, (i - a) * 150 + 200);
    }
  };
  if (pad) api.buildPad(ans, revealed(fillIn, { delay: 1500 }));
  else api.buildChoices(shuffle([ans].concat(distractors(ans, 3, 1, 9))), ans, revealed(fillIn, { delay: 1500 }));
  let walking = false;
  const fill = Coach.once(() => Coach.fillable(api, cells, { from: a,
    onDone(){ if (walking) return; Coach.pulse($$('.dot.b', f)); Sound.say('赤い丸は、いくつ？', { delay: 80 }); } }));
  api.coach({
    text: '10に なるまで タップして みよう',
    say: '10になるまで、タップしてみよう。',
    tool(){ showFrame(); fill(); },
    walk(){
      walking = true;
      showFrame();
      const steps = fill().steps();
      cells.slice(a).forEach((c, i) => steps.push({ at: c, act(){ Coach.tag(c, i + 1, 'alt'); }, say: numKana(i + 1), ms: 620 }));
      steps.push({ say: `${numKana(a)}と${numKana(ans)}で、10。`, ms: 1900 });
      return steps;
    }
  });
}

function pairHunt(api){
  const w = wanted(api, /^pair:(\d+)$/);
  const a = (w && w[0] >= 1 && w[0] <= 9) ? w[0] : ri(1, 9), b = 10 - a;
  const others = [];
  while (others.length < 3){
    const v = ri(1, 9);
    if (v !== a && v !== b && others.indexOf(v) < 0) others.push(v);
  }
  const cards = shuffle([a, b].concat(others));
  api.item('pair:' + Math.min(a, b), Math.min(a, b) + ' と ' + Math.max(a, b) + ' の ペア');
  api.setPrompt('たすと <b>10</b> に なる 2まいを えらぼう', '足すと10になる2枚を選ぼう。');
  const picked = [];
  const row = api.choices;
  cards.forEach(v => {
    const c = el('button.choice', { type: 'button', text: String(v) });
    c.addEventListener('click', () => {
      if (api.locked || c.classList.contains('correct')) return;
      if (picked.indexOf(c) >= 0){
        picked.splice(picked.indexOf(c), 1); c.classList.remove('picked');
        c.style.borderColor = ''; Sound.sfx.tap(); return;
      }
      picked.push(c); c.style.borderColor = 'var(--accent)'; Sound.sfx.tap();
      if (picked.length === 2){
        const sum = Number(picked[0].textContent) + Number(picked[1].textContent);
        if (sum === 10){ picked.forEach(p => p.classList.add('correct')); api.correct(); }
        else {
          picked.forEach(p => { p.classList.add('wrong'); p.style.borderColor = ''; api.later(() => p.classList.remove('wrong'), 460); });
          api.wrong();
          Sound.say(`合わせて${numKana(sum)}になったよ。`, { delay: 320 });
          picked.length = 0;
        }
      }
    });
    row.append(c);
  });
  api.field.append(el('div.hintline', { text: '1と9、2と8、3と7、4と6、5と5' }));
  /* Hold one card, and find its partner by filling a frame from it — the glow on
     one card of the pair is kept, the other is found by counting. */
  const frame = Coach.once(() => {
    const fr = el('div.tenframe', { style: { '--cols': 5 } });
    const cs = [];
    for (let i = 0; i < 10; i++){ const c = el('div.cell' + (i >= a ? '.hole' : '')); if (i < a) c.append(el('div.dot')); cs.push(c); fr.append(c); }
    api.field.prepend(el('div.frameset', null, fr));
    return Coach.fillable(api, cs, { from: a });
  });
  const cardOf = v => $$('.choice', row).find(c => Number(c.textContent) === v);
  api.coach({
    text: `${a} と あわせて 10に なる カードは？`,
    say: `${numKana(a)}と合わせて、10になるカードは、どれ？`,
    tool(){ const one = cardOf(a); if (one) one.classList.add('glow'); frame(); },
    walk(){ return frame().steps().concat([{ at: cardOf(b), say: `${numKana(a)}と${numKana(b)}で、10。`, ms: 2000 }]); }
  });
  api.onShow(() => {
    picked.slice().forEach(p => p.click());             // put down whatever is held
    const cs = $$('.choice', row);
    const c1 = cs.find(c => Number(c.textContent) === a);
    const c2 = cs.find(c => c !== c1 && Number(c.textContent) === b);
    [c1, c2].forEach(c => { if (c) c.click(); });
  });
}

/** Build ten from three numbers. Multiple answers are accepted; the app evaluates
    the child's construction instead of asking them to recognise one prepared pair. */
function threeMakeTen(api){
  api.item('three10', '3つの かずで 10を つくる');
  api.setPrompt('3つの すうじを えらんで <b>10</b> を つくろう',
                '三つの数字を選んで、10を作ろう。');
  const picked = [];
  let accepting = true;
  const readout = el('div.three-sum', { text: '? ＋ ? ＋ ? ＝ 10' });
  api.field.append(readout);
  const redraw = () => {
    const vals = picked.concat(['?', '?', '?']).slice(0, 3);
    readout.textContent = vals.join(' ＋ ') + ' ＝ 10';
  };
  for (let v = 0; v <= 9; v++){
    const b = el('button.choice.padkey', { type: 'button', text: String(v) });
    b.addEventListener('click', () => {
      if (api.locked || !accepting) return;
      picked.push(v); redraw(); Sound.sfx.tap();
      if (picked.length < 3) return;
      accepting = false;
      const sum = picked.reduce((a, x) => a + x, 0);
      if (sum === 10){
        b.classList.add('correct');
        api.correct({ delay: 1400 });
      } else {
        api.wrong(b);
        Sound.say(`合わせると${numKana(sum)}だね。10になるように変えてみよう。`, { delay: 280 });
        api.later(() => { picked.length = 0; redraw(); accepting = true; }, 650);
      }
    });
    api.choices.append(b);
  }
  api.choices.classList.add('pad');
  const key = v => $$('.padkey', api.choices).find(k => k.textContent === String(v));
  api.coach({
    text: 'まず 5を えらんで、のこりの 5を 2つに わけよう',
    say: 'まず5を選んで、残りの5を、二つに分けよう。',
    tool(){ Coach.pulse(key(5)); },
    walk(){
      return [{ at: key(5), say: 'ご', ms: 1000 }, { at: key(2), say: 'に', ms: 1000 },
              { at: key(3), say: 'さん。5と2と3で、10。', ms: 2300 }];
    }
  });
  api.onShow(() => {
    picked.length = 0; redraw(); accepting = true;
    [5, 2, 3].forEach(v => { const k = key(v); if (k) k.click(); });
  });
}

/* ============================================================
   10-11. たしざん / ひきざん — story scene then symbol
   ============================================================ */
/* Two clusters with a gap between them, so "3 and 2" stays visible as 3 and 2
   even after they have joined. A single evenly-spaced row dissolves the structure
   the question is about. */
function clusterSpots(n, cx){
  const per = Math.min(3, n);
  const rows = Math.ceil(n / per);
  const out = [];
  for (let i = 0; i < n; i++){
    const r = Math.floor(i / per), c = i % per;
    const inRow = Math.min(per, n - r * per);
    out.push([cx + (c - (inRow - 1) / 2) * 12, 48 + (r - (rows - 1) / 2) * 23]);
  }
  return out;
}

function storyScene(api, a, b, op, thing, onReady){
  const scene = el('div.scene');
  scene.append(el('div.' + (thing.e === '🐟' ? 'pond' : 'ground')));
  api.field.append(scene);
  const actors = [];
  const place = (spots, cls, hidden) => spots.forEach(p => {
    const n = el('div.actor.' + cls, { text: thing.e, style: { left: p[0] + '%', top: p[1] + '%' } });
    n.dataset.homeLeft = p[0] + '%';
    /* translate(160%) is relative to the emoji, not the scene. Place newcomers
       outside the scene itself until their arrival starts. */
    if (hidden) n.style.left = '112%';
    scene.append(n); actors.push(n);
  });

  if (op === '+'){
    place(clusterSpots(a, 30), 'g1', false);
    place(clusterSpots(b, 72), 'g2', true);
  } else {
    const spots = clusterSpots(a, 50);
    place(spots.slice(0, a - b), 'g1', false);
    place(spots.slice(a - b), 'g2', false);
  }

  api.later(() => {
    Sound.sfx.swoosh();
    if (op === '+'){
      actors.forEach(n => { if (n.classList.contains('g2')) n.style.left = n.dataset.homeLeft; });
    } else {
      actors.forEach(n => {
        if (!n.classList.contains('g2')) return;
        n.classList.add('leaving');
        n.style.transform = 'translate(160%,-160%)';
      });
    }
    api.later(onReady, 900);
  }, 950);
}

/** a ＋ b with each number tinted like its group in the picture */
function eqNode(a, b, op){
  return el('div.eq', null,
    el('span.n1', { text: String(a) }),
    el('span.op', { text: op === '+' ? '＋' : '−' }),
    el('span.n2', { text: String(b) }),
    el('span.op', { text: '＝' }),
    el('span.box', { text: '?' }));
}

function addStory(api, max){
  const w = wanted(api, /^sum:(\d+)\+(\d+)$/);
  const aim = w && w[0] >= 1 && w[1] >= 1 && w[0] + w[1] <= max;
  const a = aim ? w[0] : ri(1, max - 1);
  const b = aim ? w[1] : ri(1, max - a), ans = a + b;
  const thing = pick(THINGS);
  api.item('sum:' + a + '+' + b, a + ' ＋ ' + b);
  api.setPrompt(`${thing.e} が ${numTag(a)}つ。${numTag(b)}つ やってきたよ`,
                `${thing.n}が${tsuKana(a)}。${tsuKana(b)}、やってきたよ。`);
  storyScene(api, a, b, '+', thing, () => {
    api.setPrompt('ぜんぶで いくつ？', '全部でいくつ？');
    const eq = eqNode(a, b, '+');
    api.field.append(eq);
    // the child's answer belongs inside the sentence, not next to it
    api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 1, max + 2, 2))), ans,
      revealed(() => fillBlank($('.box', eq), ans)));
    // the picture is still there after the story: count it, both groups together
    const cnt = Coach.once(() => Coach.countable(api, $$('.actor', api.field)));
    api.coach({
      text: 'ぜんぶ タップして かぞえよう',
      say: '全部タップして、数えよう。',
      tool(){ cnt(); },
      walk(){ return cnt().steps(); }
    });
  });
}

function subStory(api, max){
  const w = wanted(api, /^rest:(\d+)-(\d+)$/);
  const aim = w && w[0] >= 2 && w[0] <= max && w[1] >= 1 && w[1] < w[0];
  const a = aim ? w[0] : ri(2, max);
  const b = aim ? w[1] : ri(1, a - 1), ans = a - b;
  const thing = pick(THINGS);
  api.item('rest:' + a + '-' + b, a + ' − ' + b);
  api.setPrompt(`${thing.e} が ${numTag(a)}つ。${numTag(b)}つ いなくなるよ`,
                `${thing.n}が${tsuKana(a)}。${tsuKana(b)}、いなくなるよ。`);
  storyScene(api, a, b, '-', thing, () => {
    api.setPrompt('のこりは いくつ？', '残りは、いくつ？');
    const eq = eqNode(a, b, '-');
    api.field.append(eq);
    api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 0, max, 2))), ans,
      revealed(() => fillBlank($('.box', eq), ans)));
    /* The ones that left come back faint, so what is left can be told apart from
       what went and counted — the difference between「のこり」and「ぜんぶ」 on screen. */
    const back = () => $$('.actor.g2', api.field).forEach(x => {
      x.classList.remove('leaving');
      x.classList.add('coachgone');
      x.style.transform = 'translate(-50%,-50%)';
    });
    const cnt = Coach.once(() => Coach.countable(api, $$('.actor.g1', api.field)));
    api.coach({
      text: 'いなく なったのは うすい ほう。のこりを かぞえよう',
      say: 'いなくなったのは、薄いほう。残りを、数えよう。',
      tool(){ back(); cnt(); },
      walk(){ back(); return cnt().steps(); }
    });
  });
}

function symbolCalc(api, op, max, pad){
  let a, b, ans;
  const w = wanted(api, op === '+' ? /^sum:(\d+)\+(\d+)$/ : /^rest:(\d+)-(\d+)$/);
  const aim = op === '+'
    ? (w && w[0] >= 1 && w[1] >= 1 && w[0] + w[1] <= max)
    : (w && w[0] >= 2 && w[0] <= max && w[1] >= 1 && w[1] <= w[0]);
  if (aim){ a = w[0]; b = w[1]; ans = op === '+' ? a + b : a - b; }
  else if (op === '+'){ a = ri(1, max - 1); b = ri(1, max - a); ans = a + b; }
  else { a = ri(2, max); b = ri(1, a); ans = a - b; }
  api.item((op === '+' ? 'sum:' + a + '+' + b : 'rest:' + a + '-' + b),
    a + (op === '+' ? ' ＋ ' : ' − ') + b);
  api.setPrompt('しきを みて こたえよう',
    `${numKana(a)}、${op === '+' ? 'たす' : 'ひく'}、${numKana(b)}は？`);
  const eq = eqNode(a, b, op);
  api.field.append(eq);
  const reveal = revealed(() => fillBlank($('.box', eq), ans));
  if (pad) api.buildPad(ans, reveal);
  else api.buildChoices(shuffle([ans].concat(distractors(ans, 3, 0, max + 2, 2))), ans, reveal);
  const frame = Coach.once(() => {
    const f = el('div.tenframe', { style: { '--cols': 5 } });
    for (let i = 0; i < 10; i++){
      const cell = el('div.cell');
      if (op === '+'){ if (i < a) cell.append(el('div.dot')); else if (i < a + b) cell.append(el('div.dot.b')); }
      else { if (i < a - b) cell.append(el('div.dot')); else if (i < a) cell.append(el('div.dot.b.coachgone')); }
      f.append(cell);
    }
    api.field.append(el('div.frameset', null, f));
    return f;
  });
  const cnt = Coach.once(() => Coach.countable(api, $$(op === '+' ? '.dot' : '.dot:not(.b)', frame())));
  api.coach({
    text: op === '+' ? 'あおと あかを あわせて かぞえよう' : 'うすい まるは ひいた ぶん。のこりを かぞえよう',
    say: op === '+' ? '青と赤を、合わせて数えよう。' : '薄い丸は、引いた分。残りを、数えよう。',
    tool(){ cnt(); },
    walk(){ return cnt().steps(); }
  });
}

function differenceQ(api, max, pad){
  const w = wanted(api, /^diff:(\d+)-(\d+)$/);
  const aim = w && w[0] >= 3 && w[0] <= max && w[1] >= 1 && w[1] < w[0];
  const a = aim ? w[0] : ri(3, max);
  const b = aim ? w[1] : ri(1, a - 1), ans = a - b;
  const t1 = pick(THINGS); let t2 = pick(THINGS);
  while (t2.e === t1.e) t2 = pick(THINGS);
  api.item('diff:' + a + '-' + b, a + ' と ' + b + ' の ちがい');
  api.setPrompt(`どちらが <b>いくつ</b> おおい？`, 'どちらが、いくつ多い？');
  /* No icon at the head of the row. `.mrow` was built for the bar chart, where the
     cap is a pencil icon beside a bar; here the row *is* the objects, and a cap drawn
     from the same emoji at the same size is simply one more of them — 「10 − 8」 sat
     under eleven balloons and nine bunches of grapes. The row says what it is. */
  const board = el('div.measure.countrows');
  [[t1, a], [t2, b]].forEach(([t, n]) => {
    const row = el('div.mrow', { style: { cursor: 'default' } });
    const g = el('div.row.pairline', { style: { gap: 'calc(var(--u)*.25)' } });
    for (let i = 0; i < n; i++) g.append(el('span.item', { text: t.e, style: { fontSize: 'calc(var(--u)*2.4)' } }));
    row.append(g);
    board.append(row);
  });
  const eq = eqNode(a, b, '-');
  api.field.append(board, eq);
  const reveal = revealed(() => fillBlank($('.box', eq), ans));
  if (pad) api.buildPad(ans, reveal);
  else api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 0, max, 2))), ans, reveal);
  // the top row's items past the bottom row's length are what does not pair up
  const rowsEl = $$('.mrow', board);
  const topItems = () => $$('.item', rowsEl[0]), botItems = () => $$('.item', rowsEl[1]);
  const cnt = Coach.once(() => {
    const left = topItems().slice(b);
    left.forEach(x => x.classList.add('coachleft'));
    return Coach.countable(api, left);
  });
  api.coach({
    text: 'ペアに ならない ぶんを かぞえよう',
    say: '上と下をペアにして、ペアにならない分を、数えよう。',
    tool(){ cnt(); },
    walk(){
      const t = topItems();
      return botItems().map((x, i) => ({ at: x, act(){ Coach.pulse([t[i], x]); }, ms: 380 })).concat(cnt().steps());
    }
  });
}

/* ===========================================================
   13 — WORLD 4「かたちの もり」 かたち・なかまわけ・きまり・とけい
   =========================================================== */
'use strict';

const SHAPE_COLORS = ['var(--c-red)','var(--c-blue)','var(--c-green)','var(--c-purple)','var(--c-orange)','var(--c-pink)'];

/* ============================================================
   12. かたち
   ============================================================ */
const KIND_JA = { circle: 'まる', triangle: 'さんかく', square: 'しかく' };
const KIND_MEMBERS = {
  circle:   ['circle', 'oval'],
  triangle: ['tri', 'tri2', 'rtri'],
  square:   ['square', 'rect']
};
const OTHERS = ['diamond', 'pentagon', 'hexagon', 'trapezoid', 'star', 'heart', 'semi'];

function findAllShapes(api){
  const target = pick(['circle', 'triangle', 'square']);
  const nTarget = ri(2, 4);
  const cells = [];
  for (let i = 0; i < nTarget; i++) cells.push({ name: pick(KIND_MEMBERS[target]), hit: true });
  const otherKinds = ['circle', 'triangle', 'square'].filter(k => k !== target);
  // 「しかく」means four-sided, so a rhombus or trapezoid would be a fair answer too:
  // keep every other quadrilateral out of the distractors when squares are the target
  const others = target === 'square'
    ? OTHERS.filter(k => k !== 'diamond' && k !== 'trapezoid')
    : OTHERS;
  const nOther = ri(4, 6);
  for (let i = 0; i < nOther; i++){
    const src = chance(.7) ? KIND_MEMBERS[pick(otherKinds)] : others;
    cells.push({ name: pick(src), hit: false });
  }
  api.item('find:' + target, KIND_JA[target] + ' を さがす');
  api.setPrompt(`<b>${KIND_JA[target]}</b> を ぜんぶ タップしよう`, `${KIND_JA[target]}を全部タップしよう。`);
  const grid = el('div.shapegrid');
  const tally = el('div.tally');
  const drawTally = () => {
    clear(tally);
    tally.append(el('span.lbl', { text: 'みつけた' }));
    for (let i = 0; i < nTarget; i++) tally.append(el('span.dot' + (i < found ? '.on' : '')));
  };
  let found = 0;
  shuffle(cells).forEach((c, i) => {
    const rot = c.name === 'square' || c.name === 'rect' ? ri(-18, 18) : ri(0, 359);
    const b = el('button.shapebtn', { type: 'button' }, shapeSVG(c.name, SHAPE_COLORS[i % SHAPE_COLORS.length], rot));
    b.addEventListener('click', () => {
      if (api.locked || b.classList.contains('picked')) return;
      if (c.hit){
        b.classList.add('picked'); found++; Sound.sfx.count(found - 1); drawTally();
        if (found === nTarget){ $$('.shapebtn.picked', grid).forEach(x => x.classList.add('correct')); api.correct(); }
      } else {
        b.classList.add('wrong'); api.later(() => b.classList.remove('wrong'), 460); api.wrong(b);
      }
    });
    b.dataset.hit = c.hit ? '1' : '0';
    grid.append(b);
  });
  drawTally();
  api.field.append(grid, tally, el('div.hintline', { text: 'むきが かわっても おなじ かたちだよ' }));
  api.onShow(() => {
    $$('.shapebtn', grid).forEach(b => {
      if (b.dataset.hit === '1' && !b.classList.contains('picked')) b.click();
    });
  });
  api.coach({
    text: () => KIND_JA[target] + 'は ぜんぶで ' + nTarget + 'こ。のこり ' + (nTarget - found) + 'こ',
    say: () => `${KIND_JA[target]}は、全部で${koKana(nTarget)}。残りは、${koKana(nTarget - found)}。`,
    // one plain example of the shape beside the tally, to hold in mind while looking
    tool(){
      if ($('.swatch', api.field)) return;
      const s = shapeSVG(KIND_MEMBERS[target][0], 'var(--ink-faint)', 0);
      s.classList.add('swatch');
      tally.before(s);
      Coach.pulse(s);
    },
    walk(){
      return $$('.shapebtn', grid).filter(b => b.dataset.hit === '1' && !b.classList.contains('picked'))
        .map(b => ({ at: b, act(){ Coach.pulse(b); }, say: `これも、${KIND_JA[target]}。`, ms: 1400 }));
    }
  });
}

    }
  });

/* --- silhouette puzzles: build a picture out of shapes --- */
const PUZZLES = [
  { name: 'おうち', pieces: [
      { pts: [[20,34],[80,34],[80,72],[20,72]] },
      { pts: [[50,6],[86,34],[14,34]] } ] },
  { name: 'ヨット', pieces: [
      { pts: [[14,54],[86,54],[74,72],[26,72]] },
      { pts: [[48,8],[48,50],[18,50]] },
      { pts: [[54,14],[54,50],[82,50]] } ] },
  { name: 'ロケット', pieces: [
      { pts: [[38,26],[62,26],[62,64],[38,64]] },
      { pts: [[50,4],[64,26],[36,26]] },
      { pts: [[38,50],[38,72],[24,72]] },
      { pts: [[62,50],[62,72],[76,72]] } ] },
  { name: 'ちょうちょ', pieces: [
      { pts: [[48,38],[16,14],[16,38]] },
      { pts: [[52,38],[84,14],[84,38]] },
      { pts: [[48,42],[16,66],[16,42]] },
      { pts: [[52,42],[84,66],[84,42]] } ] },
  { name: 'おおきな き', pieces: [
      { pts: [[44,58],[56,58],[56,74],[44,74]] },
      { pts: [[50,8],[76,38],[24,38]] },
      { pts: [[50,28],[82,60],[18,60]] } ] }
];

function bbox(pts){
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  const y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
}

/* Two pieces are the same piece only if they are the same shape in the same
   orientation. The old signature was 頂点数:幅x高さ, which made ちょうちょ's four
   right triangles — the same triangle in four different orientations — all read as
   `3:32x24`, so any tile fitted any hole and the puzzle could be finished without
   looking at the shapes at all. ロケット's two fins (mirror images) collided the
   same way. Normalising the corners to the piece's own bounding box keeps genuinely
   identical pieces interchangeable while telling ◤ from ◥; sorting makes the
   comparison independent of the order the corners were authored in. */
function signature(pts){
  const b = bbox(pts);
  return pts.map(p => (Math.round((p[0] - b.x0) * 2) / 2) + ',' + (Math.round((p[1] - b.y0) * 2) / 2))
            .sort()
            .join(' ');
}

function shapePuzzle(api){
  const pz = pick(PUZZLES);
  api.item('puz:' + pz.name, pz.name + ' を つくる');
  api.setPrompt(`かたちを はめて <b>${pz.name}</b> を つくろう`, `形をはめて、${pz.name}を作ろう。`);
  const box = el('div.shapefield');
  const s = svg('svg', { viewBox: '0 0 100 80', preserveAspectRatio: 'xMidYMid meet' });
  box.append(s);
  const tray = el('div.shapes-tray');
  api.field.append(box, tray);

  const boxes = pz.pieces.map(p => bbox(p.pts));
  const biggest = Math.max.apply(null, boxes.map(b => Math.max(b.w, b.h)));
  const edge = c => 'color-mix(in srgb, ' + c + ' 60%, var(--ink) 40%)';

  const slots = pz.pieces.map((p, i) => {
    const poly = svg('polygon', {
      points: p.pts.map(q => q.join(',')).join(' '),
      fill: 'var(--trace-guide)', stroke: 'var(--ink-faint)', 'stroke-width': 1.6,
      'stroke-dasharray': '3 2.4', 'data-drop': '', style: 'cursor:pointer'
    });
    poly.dataset.sig = signature(p.pts);
    s.append(poly);
    return poly;
  });

  /* One viewBox unit in screen pixels. The picture is letterboxed inside its box
     (preserveAspectRatio="meet"), so the scale is whichever axis runs out first. */
  function unitPx(){
    const r = s.getBoundingClientRect();
    return r.width ? Math.min(r.width / 100, r.height / 80) : 0;
  }

  /* Which hole was this drop meant for? A five-year-old aiming at ちょうちょ's wing
     or the tree's trunk misses by a few millimetres, and this level is about
     telling shapes apart, not about fine motor control — so a drop anywhere in the
     picture counts as an attempt at the nearest empty hole. Being generous about
     *where* must not be generous about *which*: the shape still has to match. */
  function nearestSlot(pt){
    if (!pt) return null;
    const fr = box.getBoundingClientRect();
    const slack = 10;
    if (pt.x < fr.left - slack || pt.x > fr.right + slack
     || pt.y < fr.top - slack || pt.y > fr.bottom + slack) return null;
    let best = null, bestD = Infinity;
    slots.forEach(sl => {
      if (sl.dataset.filled === '1') return;
      const r = sl.getBoundingClientRect();
      const dx = Math.max(r.left - pt.x, 0, pt.x - r.right);
      const dy = Math.max(r.top - pt.y, 0, pt.y - r.bottom);
      // landing inside a hole's box wins outright; the centre only breaks ties
      const d = Math.hypot(dx, dy) * 1000
              + Math.hypot(pt.x - (r.left + r.right) / 2, pt.y - (r.top + r.bottom) / 2);
      if (d < bestD){ bestD = d; best = sl; }
    });
    return best;
  }

  const colors = shuffle(SHAPE_COLORS);
  let filled = 0;
  const dd = UI.makeDragDrop({
    /* The piece in the child's hand is drawn at exactly the size of the hole it is
       going into. The tray tile has to be a tap-sized box whatever the piece, so
       tile size can never mean hole size; the thing being dragged can. */
    ghost(item){
      const k = unitPx();
      if (!k) return null;
      const i = +item.dataset.idx, b = boxes[i], pad = 1.6;
      const sv = svg('svg', {
        viewBox: `${b.x0 - pad} ${b.y0 - pad} ${b.w + pad * 2} ${b.h + pad * 2}`,
        width:  ((b.w + pad * 2) * k).toFixed(1),
        height: ((b.h + pad * 2) * k).toFixed(1)
      }, svg('polygon', {
        points: pz.pieces[i].pts.map(q => q.join(',')).join(' '),
        fill: item.dataset.color, stroke: edge(item.dataset.color),
        'stroke-width': 1.6, 'stroke-linejoin': 'round'
      }));
      return el('div.piece-ghost', null, sv);
    },
    onDrop(item, target, pt){
      if (api.locked) return;
      const slot = (target.dataset.sig && target.dataset.filled !== '1')
        ? target : nearestSlot(pt);
      if (!slot) return;
      if (item.dataset.sig === slot.dataset.sig){
        slot.setAttribute('fill', item.dataset.color);
        slot.setAttribute('stroke', edge(item.dataset.color));
        slot.setAttribute('stroke-dasharray', '');
        slot.setAttribute('stroke-width', '1.6');
        slot.classList.remove('glow');
        slot.dataset.filled = '1';
        item.classList.add('used');
        filled++;
        Sound.sfx.place();
        if (filled === slots.length) api.later(() => api.correct(), 260);
      } else {
        slot.animate([{ opacity: 1 }, { opacity: .35 }, { opacity: 1 }], { duration: 300 });
        api.wrong(item);
        dd.select(item);            // stay picked up so the next slot is one tap away
      }
    }
  });
  slots.forEach(sl => dd.bindTarget(sl));
  dd.bindTarget(box);               // a near miss still reaches the hole it aimed at

  /* Every tray tile is drawn on one scale, so a piece that is half the size of
     another looks half the size here too — that is the only clue the child has for
     which hole a tile belongs in. The square root softens the ratio: at true scale
     the tree's trunk would be a 10px sliver in a tap-sized box. */
  shuffle(pz.pieces.map((p, i) => ({ p, i }))).forEach(({ p, i }) => {
    const color = colors[i % colors.length];
    const b = boxes[i];
    const span = Math.max(b.w, b.h);
    const S = span / (Math.sqrt(span / biggest) * 0.82);
    const t = el('div.shapetile');
    const mini = svg('svg', { viewBox: `${b.cx - S / 2} ${b.cy - S / 2} ${S} ${S}` },
      svg('polygon', { points: p.pts.map(q => q.join(',')).join(' '), fill: color,
        stroke: edge(color), 'stroke-width': S * 0.028, 'stroke-linejoin': 'round' }));
    t.append(mini);
    t.dataset.sig = signature(p.pts);
    t.dataset.color = color;
    t.dataset.idx = i;
    dd.bindItem(t);
    tray.append(t);
  });
  api.field.append(el('div.hintline', { text: 'ゆびで はめて みよう' }));
  /* Glowing the one hole a piece fits finished the puzzle for the child. The piece is
     picked up and every open hole with as many corners is marked: which way round it
     goes is still theirs to see (ちょうちょ's four triangles all light up). */
  api.coach({
    text: 'おなじ かたちの あなを さがそう。むきも みてね',
    say: '同じ形の穴を探そう。向きも、よく見てね。',
    tool(){
      const t = $('.shapetile:not(.used)', tray);
      if (!t) return;
      dd.select(t);
      const corners = pz.pieces[+t.dataset.idx].pts.length;
      Coach.pulse(slots.filter((sl, i) => sl.dataset.filled !== '1' && pz.pieces[i].pts.length === corners));
    },
    walk(){
      const t = $('.shapetile.sel:not(.used)', tray) || $('.shapetile:not(.used)', tray);
      if (!t) return [];
      const slot = slots.find(sl => sl.dataset.filled !== '1' && sl.dataset.sig === t.dataset.sig);
      return [{ at: t, act(){ dd.select(t); }, say: 'この形は…', ms: 1300 },
              { at: slot, act(){ if (slot) slot.classList.add('glow'); }, say: 'ここに、ぴったり。', ms: 1900 }];
    }
  });
  // every piece into its own hole (SVG polygons have no .click(), so the event is sent)
  api.onShow(() => {
    $$('.shapetile:not(.used)', tray).forEach(t => {
      const slot = slots.find(sl => sl.dataset.filled !== '1' && sl.dataset.sig === t.dataset.sig);
      if (!slot) return;
      dd.select(t);
      slot.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    });
  });
}

/* ============================================================
   13. なかまわけ — classification
   ============================================================ */
const CATS = {
  fruit:   { lbl: 'くだもの', e: '🍎', c: 'var(--c-red)',    items: ['🍎','🍓','🍌','🍇','🍑','🍉','🍊','🍐'] },
  animal:  { lbl: 'どうぶつ', e: '🐰', c: 'var(--c-orange)', items: ['🐰','🐻','🦊','🐯','🐨','🐷','🐮','🐵'] },
  vehicle: { lbl: 'のりもの', e: '🚗', c: 'var(--c-blue)',   items: ['🚗','🚌','🚂','✈️','🚲','🚒','🚕','🛵'] },
  veg:     { lbl: 'やさい',   e: '🥕', c: 'var(--c-green)',  items: ['🥕','🌽','🥦','🍆','🥔','🧅','🫑','🥬'] },
  bug:     { lbl: 'むし',     e: '🐞', c: 'var(--c-purple)', items: ['🐞','🦋','🐝','🐛','🦗','🕷','🐜','🪲'] }
};
/* Solid crayon-coloured shapes: when the axis is colour, the colour has to be the
   only thing that varies, and it must not be at the mercy of an emoji font. */
const COLOR_SHAPES = ['circle', 'square', 'tri', 'star', 'heart', 'oval'];
const COLOR_CATS = {
  red:    { lbl: 'あか',   c: 'var(--c-red)',    swatch: 'circle' },
  blue:   { lbl: 'あお',   c: 'var(--c-blue)',   swatch: 'circle' },
  yellow: { lbl: 'きいろ', c: 'var(--c-yellow)', swatch: 'circle' }
};

function sortGame(api, catset, nBins, byColor){
  const keys = sample(Object.keys(catset), nBins);
  const perBin = nBins === 2 ? 3 : 2;
  api.item('sort:' + keys.slice().sort().join('_'),
    keys.map(k => catset[k].lbl).join('・') + ' に わける');
  api.setPrompt(byColor ? 'おなじ いろの ばしょに いれてね' : 'なかまの ばしょに いれてね',
                byColor ? '同じ色の場所に入れてね。' : '仲間の場所に入れてね。');
  const mark = k => {
    const c = catset[k];
    if (!byColor) return el('span', { text: c.e });
    const sv = shapeSVG(c.swatch, c.c, 0);
    sv.setAttribute('width', 'calc(var(--u)*2)'); sv.setAttribute('height', 'calc(var(--u)*2)');
    return sv;
  };
  const bins = el('div.bins');
  const binMap = {};
  keys.forEach(k => {
    const c = catset[k];
    const b = el('div.bin', { style: { '--bc': c.c } },
      el('div.lbl', null, mark(k), ' ' + c.lbl),
      el('div.hold'));
    b.dataset.cat = k;
    binMap[k] = b;
    bins.append(b);
  });
  const tray = el('div.tray');
  api.field.append(bins, tray);

  const picks = [];
  keys.forEach(k => {
    if (byColor) sample(COLOR_SHAPES, perBin).forEach(shape => picks.push({ shape, k }));
    else sample(catset[k].items, perBin).forEach(e => picks.push({ e, k }));
  });
  let placed = 0;
  const totalItems = picks.length;

  const dd = UI.makeDragDrop({
    onDrop(item, target){
      if (api.locked) return;
      if (item.dataset.cat === target.dataset.cat){
        const copy = item.firstElementChild ? item.firstElementChild.cloneNode(true) : el('span', { text: item.textContent });
        $('.hold', target).append(el('span.item', null, copy));
        item.classList.add('gone');
        placed++;
        Sound.sfx.place();
        if (placed === totalItems) api.later(() => api.correct(), 300);
      } else {
        target.classList.add('nope');
        api.later(() => target.classList.remove('nope'), 440);
        api.wrong(item);
      }
    }
  });
  Object.values(binMap).forEach(b => dd.bindTarget(b));
  api.onShow(() => {
    $$('.tile', tray).forEach(t => {
      if (t.classList.contains('gone')) return;
      dd.select(t);
      binMap[t.dataset.cat].click();
    });
  });
  shuffle(picks).forEach(p => {
    let t;
    if (byColor){
      const sv = shapeSVG(p.shape, catset[p.k].c, 0);
      sv.setAttribute('width', 'calc(var(--u)*3.4)'); sv.setAttribute('height', 'calc(var(--u)*3.4)');
      t = el('div.tile.shapetile2', null, sv);
    } else {
      t = el('div.tile', { text: p.e });
    }
    t.dataset.cat = p.k;
    dd.bindItem(t);
    tray.append(t);
  });
  api.field.append(el('div.hintline', { text: 'ゆびで はこに いれてね' }));
  // the piece in hand and the pictures on the boxes — not a glow on the right box
  api.coach({
    text: byColor ? 'いろを よく みて はこを えらぼう' : 'なんの なかまかな？ はこの えを みてね',
    say: byColor ? '色をよく見て、箱を選ぼう。' : '何の仲間かな？箱の絵を、見てね。',
    tool(){
      const t = $('.tile:not(.gone)', tray);
      if (t) dd.select(t);
      Coach.pulse($$('.bin .lbl', bins));
    },
    walk(){
      const t = $('.tile.sel:not(.gone)', tray) || $('.tile:not(.gone)', tray);
      if (!t) return [];
      const bin = binMap[t.dataset.cat];
      return [{ at: t, act(){ dd.select(t); }, ms: 1000 },
              { at: $('.lbl', bin), act(){ bin.classList.add('glow'); }, say: `${catset[t.dataset.cat].lbl}の箱。`, ms: 1900 }];
    }
  });
}

  aim: 'ものを<b>ある観点でグループにまとめる</b>力。分類ができると「同じものがいくつあるか」を数えられるようになり、表やグラフ、データの見方の入り口になります。',
