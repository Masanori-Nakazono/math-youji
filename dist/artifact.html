const STICKER_POOL = ['🐰','🐻','🐼','🦊','🐯','🦁','🐨','🐸','🐵','🐧','🐤','🦉','🦄','🐢','🐬','🐳','🦋','🐝','🐞','🦕','🦖','🐙','🦀','🐡','🐘','🦒','🦓','🦔','🐿','🦥','🐠','🐟','🦈','🐌','🐛','🕊','🦩','🦜','🐴','🐑','🌻','🌸','🌈','🍎','🍓','🍇','🍑','🍉','🍌','🥕','🌽','🍄','🍒','🥝','🍍','🥥','🌷','🌼','🌺','🍀','🍰','🧁','🍩','🎂','🍬','🍭','🍦','🍪','🍫','🥐','🚀','🚂','⛵️','🎈','🎁','🏆','👑','💎','🔔','🎨','🎺','🪁','🧸','🪀','🎏','🎐','🛼','🎠','🎪','🏰','⚽️','🏀','🎾','🥁','🎹','⭐️','🌙','☀️','⛄️','🌟'];
/* Stickers are handed out by slot position, not by hash, so no level shares an
   emoji with another while the pool is large enough. */
let STICKER_INDEX = null;
function stickerSlots(){
  if (STICKER_INDEX) return STICKER_INDEX;
  STICKER_INDEX = {};
  let i = 0;
  Games.list.forEach(g => g.levels.forEach((lv, li) => {
    STICKER_INDEX[g.id + ':' + li] = i++;
    STICKER_INDEX[g.id + ':' + li + ':g'] = i++;
  }));
  return STICKER_INDEX;
}
function stickerFor(key){
  const slots = stickerSlots();
  if (key in slots) return STICKER_POOL[slots[key] % STICKER_POOL.length];
  let h = 0;                                   // daily-streak stickers etc.
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return STICKER_POOL[h % STICKER_POOL.length];
}

const Session = (() => {
  let node, titleEl, pipsEl, promptTxt, fieldEl, choicesEl, speakBtn, moodEl, feedbackEl;
  let refit = () => {};
  let plan = [];          // [{game, level, levelIndex}]
  let idx = 0, mistakes = 0, firstTryRight = 0, wrongThisQ = 0;
  let locked = false, mode = 'level', curGame = null, curLevelIdx = 0;
  let hintBtns = [], hintFn = null, hintExtras = [], hintShown = false, lastSpeech = '';
  /* What this question is *about*. Every generator names its item, so the app can
     avoid asking the same fact twice in one sitting, steer toward the facts this
     child keeps missing, and tell the parent which ones they are. */
  let curItem = null, curLabel = null;
  let focusKeys = [];             // the facts a 集中練習 session is aimed at
  /* ---------- how long the answer took ----------
     けいさんの やま is named for「考えずに言える」— an answer that arrives rather than
     one that is worked out. Right-first-time cannot tell those apart: a child who
     counts eight empty cells for nine seconds and a child who remembers both score a
     clean answer, and only the second makes a carry sum fast. So time the first
     response, and only where speed is actually the goal (`game.fluent`). */
  let askedAt = 0, respondedMs = null, swiftCount = 0;
  function markResponse(){
    if (respondedMs == null && askedAt) respondedMs = Math.round(performance.now() - askedAt);
  }
  let usedItems = new Set();      // the shuffle bag for the current session
  let shaky = [];                 // facts missed this session, for the result screen

  /* ---------- timer lifecycle ----------
     Every delayed callback in a question is tied to an epoch. Leaving a question
     (next question, quit, a new level) bumps the epoch and clears the pending
     timers, so a slow animation from the previous question can never write into
     the current one — or, worse, answer it. */
  let epoch = 0;
  const timers = new Map();          // id -> { fn, epoch }, so tests can run them on demand
  function later(fn, ms){
    const mine = epoch;
    const id = setTimeout(() => { timers.delete(id); if (mine === epoch) fn(); }, ms);
    timers.set(id, { fn, epoch: mine });
    return id;
  }
  function killTimers(){
    epoch++;
    timers.forEach((v, id) => clearTimeout(id));
    timers.clear();
  }

  /** Test seam: run every pending question timer now instead of waiting for it.
      Lets the regression suite check what happens *after* an answer, which is where
      the interaction bugs live. */
  function flushTimers(limit){
    let ran = 0;
    for (let pass = 0; pass < (limit || 12) && timers.size; pass++){
      const due = Array.from(timers.entries());
      due.forEach(([id, t]) => { clearTimeout(id); timers.delete(id); if (t.epoch === epoch){ t.fn(); ran++; } });
    }
    return ran;
  }

  function build(){
    if (node) return node;
    titleEl   = el('h2');
    pipsEl    = el('div.pips');
    promptTxt = el('div.txt');
    fieldEl   = el('div.playfield');
    choicesEl = el('div.choices');
    feedbackEl = el('div.feedback', { hidden: true });
    speakBtn  = el('button.btn.btn-ghost.btn-round', {
      'aria-label': 'もういちど きく', title: 'もういちど きく',
      onclick(){ Sound.sfx.tap(); if (lastSpeech) Sound.say(lastSpeech, { delay: 40 }); }
    }, '🔊');
    moodEl = mascotSVG('idle', 'talk');
    moodEl.style.width = 'calc(var(--u)*4.6)';
    moodEl.style.height = 'calc(var(--u)*4.6)';

    node = el('div#play', null,
      el('div.topbar', null,
        el('button.btn.btn-ghost.btn-round.backbtn', { 'aria-label': 'もどる', onclick: quit }, '←'),
        titleEl, pipsEl),
      el('div.prompt', null, moodEl,
        el('div.txtwrap', null, promptTxt, feedbackEl), speakBtn),
      fieldEl, choicesEl);
    UI.register('play', node);
    refit = UI.watchFit(fieldEl);
    return node;
  }

  function setMood(m){
    const fresh = mascotSVG(m, m === 'cheer' ? 'cheer' : 'talk');
    fresh.style.width = 'calc(var(--u)*4.6)';
    fresh.style.height = 'calc(var(--u)*4.6)';
    moodEl.replaceWith(fresh);
    moodEl = fresh;
  }

  /** Wrong answers have to be visible, not just audible: a device with no
      Japanese voice must still show the child that something happened. */
  function showFeedback(kind, text){
    feedbackEl.hidden = false;
    feedbackEl.className = 'feedback ' + kind;
    clear(feedbackEl);
    feedbackEl.append(el('span.mk', { text: kind === 'oops' ? '？' : '💡' }), text);
    feedbackEl.animate
      && feedbackEl.animate([{ transform: 'translateX(-.4em)' }, { transform: 'none' }], { duration: 260 });
  }
  function clearFeedback(){ feedbackEl.hidden = true; clear(feedbackEl); }

  function quit(){
    killTimers();
    Sound.hush();
    Sound.sfx.tap();
    if (mode === 'level') Levels.render(curGame); else Home.render();
    UI.show(mode === 'level' ? 'levels' : 'home', { replace: true });
  }

  /* ---------- public entry points ---------- */
  function startLevel(game, levelIndex){
    build();
    killTimers();
    mode = 'level'; curGame = game; curLevelIdx = levelIndex;
    const lv = game.levels[levelIndex];
    const n = lv.n || 8;
    plan = [];
    for (let i = 0; i < n; i++) plan.push({ game, level: lv, levelIndex });
    titleEl.textContent = game.name + '　' + lv.t;
    begin();
  }

  function startDaily(count){
    build();
    killTimers();
    mode = 'daily'; curGame = null;
    const pool = [];
    Games.list.forEach(g => {
      g.levels.forEach((lv, i) => {
        if (Store.levelUnlocked(g.id, i)) pool.push({ game: g, level: lv, levelIndex: i });
      });
    });
    if (!pool.length){                       // nothing unlocked yet — never leave an empty plan
      Home.render();
      UI.show('home', { replace: true });
      return;
    }
    const n = count || 10;
    plan = drawDailyPlan(pool, n);
    titleEl.textContent = 'きょうの れんしゅう';
    begin();
  }

  /* Three or four facts, ten questions: enough for each of them to come round
     several times in one sitting. More than four and it is another sampler. */
  const MAX_FOCUS_FACTS = 4;

  /** Practise the handful of facts this child keeps missing, several times each.

      きょうの れんしゅう is a *review* instrument: ten questions spread over every
      unlocked level. Measured over three weeks, that gives one particular fact
      —「4と6で10」— about one turn a fortnight, and leaves two or three of the nine
      make-ten facts untouched entirely. Nothing in the app could ask the same fact
      twice in one sitting, because the shuffle bag that stops a level repeating
      itself also stops it concentrating. This is the other half of the pair: the
      bag is drawn from the weak set instead of from the level. */
  function startFocus(keys, opts){
    build();
    killTimers();
    const o = opts || {};
    const want = [];
    (keys || []).forEach(k => {
      if (want.length >= MAX_FOCUS_FACTS || want.some(x => x.want === k)) return;
      const at = Store.factOrigin(k);
      if (!at) return;                                   // never met: nowhere to ask it
      const cut = at.lastIndexOf(':');
      const g = Games.byId[at.slice(0, cut)], li = Number(at.slice(cut + 1));
      if (!g || !g.levels[li] || !Store.levelUnlocked(g.id, li)) return;
      want.push({ game: g, level: g.levels[li], levelIndex: li, want: k });
    });
    if (!want.length){ startDaily(10); return; }         // nothing to aim at yet
    mode = 'focus'; curGame = null;
    focusKeys = want.map(x => x.want);
    plan = [];
    /* Round-robin, not shuffled. A B C A B C spaces each fact out inside the
       sitting, which is what retrieval practice wants; massing them back to back
       would let the child copy the last answer instead of retrieving it. */
    const n = o.n || 10;
    for (let i = 0; i < n; i++) plan.push(want[i % want.length]);
    titleEl.textContent = 'にがて あつめ';
    begin();
  }

  /** How badly this child needs this level today.
      The old round-robin handed every game the same ~0.66 questions a day whether
      the child was at 10% or 97%, which made the daily set a sampler rather than
      practice. This is the same 10 questions, aimed. */
  /* Where a child with no record yet should start. The README's roadmap says the
     first two months belong to かずの しま; until this, the roadmap existed only as
     prose on the parent page. */
  const STARTER_WORLD = { shima: 1.7, umi: 0.85, yama: 0.5, mori: 0.7 };

  function dailyWeight(p){
    const acc  = Store.recentAccuracy(p.game.id, p.levelIndex);
    const seen = Store.recentCount(p.game.id, p.levelIndex);
    const need = acc == null ? 1 : 1 - acc;                    // 0 solid … 1 struggling
    const cold = Math.min(1, Store.daysSince(p.game.id, p.levelIndex) / 14);
    /* On day one every level scores the same on need (1) and cold (1), so `focus`
       was the only thing separating them — which put いくつと いくつ, the hardest
       thing in the app, in front of a child who could not yet count to ten. Ramp
       the priority in with the evidence that earns it. */
    const focus = 1 + ((p.game.focus || 1) - 1) * Math.min(1, seen / 8);
    const done  = Store.stars(p.game.id, p.levelIndex) >= 3 ? 0.45 : 1;
    const start = seen ? 1 : (STARTER_WORLD[p.game.world] || 0.8);
    return (0.35 + need * 1.6 + cold * 0.8) * focus * done * start;
  }

  function drawDailyPlan(pool, n){
    const bag = pool.map(p => ({ p, w: dailyWeight(p) }));
    const out = [], perGame = {}, perLevel = {};
    // caps keep an aimed set from turning into a single-topic grind, and keep the
    // ten questions coming from at least four different games
    const MAX_GAME = 3, MAX_LEVEL = 2;
    for (let guard = 0; out.length < n && guard < n * 40; guard++){
      let total = 0;
      for (const x of bag) total += x.w;
      if (total <= 0) break;
      let r = Math.random() * total, hit = null;
      for (const x of bag){ r -= x.w; if (r <= 0){ hit = x; break; } }
      if (!hit) break;
      const gid = hit.p.game.id, lk = gid + ':' + hit.p.levelIndex;
      if ((perGame[gid] || 0) >= MAX_GAME || (perLevel[lk] || 0) >= MAX_LEVEL){ hit.w = 0; continue; }
      perGame[gid] = (perGame[gid] || 0) + 1;
      perLevel[lk] = (perLevel[lk] || 0) + 1;
      hit.w *= 0.45;                       // taper, so the weakest topic leads without owning the set
      out.push(hit.p);
    }
    while (out.length < n) out.push(pool[ri(0, pool.length - 1)]);
    return shuffle(out);                   // interleave: the same topic should not run in a block
  }

  function begin(){
    idx = 0; mistakes = 0; firstTryRight = 0; swiftCount = 0;
    if (mode !== 'focus') focusKeys = [];
    usedItems = new Set(); shaky = [];
    clear(pipsEl);
    plan.forEach(() => pipsEl.append(el('div.pip')));
    UI.show('play');
    nextQuestion();
  }

  /* ---------- question lifecycle ---------- */
  function api(){
    const mine = epoch;
    const stale = () => mine !== epoch;
    const a = {
      field: fieldEl,
      choices: choicesEl,
      level: plan[idx].level,
      levelIndex: plan[idx].levelIndex,
      game: plan[idx].game,
      setPrompt(html, speech){
        if (stale()) return;
        promptTxt.innerHTML = html;
        lastSpeech = speech != null ? speech : String(html).replace(/<[^>]*>/g, '');
        Sound.say(lastSpeech, { delay: 220 });
      },
      say(t, o){ if (stale()) return; lastSpeech = t; Sound.say(t, o); },
      /** Name the fact this question asks. `label` is what the result screen and
          the parent page will call it. Optional: a game that names nothing simply
          keeps the old purely-random behaviour. */
      item(key, label){
        if (stale() || key == null) return;
        curItem = a.game.id + ':' + key;
        curLabel = label || null;
      },
      /** In a 集中練習 session, the fact this question is supposed to ask (the part
          of the item key after the game id), or null in a normal session.

          A generator that reads this hits the requested fact on its first build.
          One that ignores it still works: the engine re-rolls it and settles for
          the same level, which is the right topic if not the exact fact. */
      get want(){
        const w = plan[idx] && plan[idx].want;
        if (!w) return null;
        const p = a.game.id + ':';
        return w.indexOf(p) === 0 ? w.slice(p.length) : null;
      },
      onHint(fn){ if (!stale()) hintFn = fn; },
      correct(o){ if (!stale()) onCorrect(o || {}); },
      wrong(target){ if (!stale()) onWrong(target); },
      /** delayed work that dies with the question */
      later(fn, ms){ return later(fn, ms); },
      get locked(){ return locked; },

      /** A fixed 0–10 keypad.

          Picking the answer out of three options is recognition; the goal these
          levels are named for ("考えずに言える") is retrieval, and the two are not
          the same skill. Eleven keys that never change position ask the child to
          produce the number instead of discriminating between three candidates —
          and drop what guessing alone is worth from 33% to 9%.

          Facing eleven blank keys with no idea is discouraging, so the keypad
          registers its own hint: after two wrong answers it dims everything more
          than two away, leaving a handful to think between. */
      buildPad(answer, opts){
        if (stale()) return choicesEl;
        const o = opts || {};
        const lo = o.lo == null ? 0 : o.lo, hi = o.hi == null ? 10 : o.hi;
        clear(choicesEl);
        askedAt = performance.now();     // a story animation is not thinking time
        choicesEl.classList.add('pad');
        choicesEl.dataset.built = '1';
        /* No hintBtns: the engine's fallback dims one more wrong answer on every
           mistake, and stacked on the narrowing below that left just two keys —
           a coin flip, which is the opposite of what the keypad is for. The
           narrowing is the visible response to a second wrong answer. */
        hintBtns = [];
        const keys = [];
        let settled = false;
        for (let v = lo; v <= hi; v++){
          const b = el('button.choice.padkey', { type: 'button', text: String(v) });
          const val = v;
          b.addEventListener('click', () => {
            if (locked || stale()) return;
            markResponse();
            if (val === answer){
              if (settled) return;
              settled = true;
              b.classList.add('correct');
              keys.forEach(x => { if (x !== b) x.disabled = true; });
              if (o.onPick && o.onPick(val, b) === false) return;
              a.correct(o.correctOpts);
            } else {
              b.classList.add('wrong', 'tried');
              later(() => b.classList.remove('wrong'), 460);
              a.wrong(b);
            }
          });
          keys.push(b);
          choicesEl.append(b);
        }
        hintExtras.push(() => {
          keys.forEach(b => {
            if (Math.abs(Number(b.textContent) - answer) > 2) b.classList.add('dim');
          });
        });
        return choicesEl;
      },

      /** Big tappable answer buttons.
          opts.onPick(value, button) runs on a correct pick; returning false keeps
          the question open (used by questions that ask for several answers). */
      buildChoices(values, answer, opts){
        if (stale()) return choicesEl;
        const o = opts || {};
        clear(choicesEl);
        askedAt = performance.now();
        choicesEl.dataset.built = '1';
        hintBtns = [];
        let settled = false;              // one accepted answer per set of buttons
        values.forEach(v => {
          const val = (v && typeof v === 'object' && 'v' in v) ? v.v : v;
          const b = el('button.choice' + (o.cls ? '.' + o.cls : ''), { type: 'button' });
          const content = o.render ? o.render(val, v) : String(val);
          if (content && content.nodeType) b.append(content); else b.textContent = content;
          const hit = o.match ? o.match(val, answer) : val === answer;
          b.addEventListener('click', () => {
            if (locked || stale()) return;
            markResponse();
            if (hit){
              /* A five-year-old taps twice. The picked button was never disabled —
                 only its neighbours were — so a second tap ran onPick again. In a
                 question with several blanks that skipped a blank and then threw,
                 leaving the child on a question they could no longer finish.
                 `settled` belongs to this set of buttons: the next set (the next
                 blank) gets a fresh one. */
              if (settled) return;
              settled = true;
              b.classList.add('correct');
              $$('.choice', choicesEl).forEach(x => { if (x !== b) x.disabled = true; });
              if (o.onPick && o.onPick(val, b) === false) return;
              a.correct(o.correctOpts);
            } else {
              b.classList.add('wrong', 'tried');
              later(() => b.classList.remove('wrong'), 460);
              a.wrong(b);
            }
          });
          if (!hit) hintBtns.push(b);
          choicesEl.append(b);
        });
        return choicesEl;
      }
    };
    return a;
  }

  function resetSurface(){
    locked = false; hintBtns = []; hintFn = null; hintExtras = []; hintShown = false;
    askedAt = 0; respondedMs = null;
    curItem = null; curLabel = null;
    clear(fieldEl); clear(choicesEl); delete choicesEl.dataset.built;
    choicesEl.classList.remove('pad');
    clearFeedback();
    fieldEl.className = 'playfield';
  }

  /* How hard to look for a better question before settling.
     TRIES builds are cheap (the whole build-storm test does 25 per level), and a
     rejected build dies with its epoch, so nothing it scheduled can survive. */
  const TRIES = 7, PICKY = 2, DUE_ENOUGH = 0.55;
  /* A generator that ignores api.want has to be re-rolled onto the fact. Levels
     name between five and forty-five facts, so this lands most of the time and
     falls back to the same level when it does not. */
  const FOCUS_TRIES = 24;

  /** Draw a question, re-rolling to avoid repeating a fact and to favour the ones
      this child owes practice to. The generator is random, so we cannot go back to
      an earlier draw — we accept the one that is on screen when we stop. */
  function drawQuestion(step){
    const tries = step.want ? FOCUS_TRIES : TRIES;
    for (let t = 0; t < tries; t++){
      killTimers();
      resetSurface();
      try{
        step.level.make(api());
      }catch(err){
        console.error('question build failed', err);
        promptTxt.textContent = 'よみこみに しっぱいしました';
        return;
      }
      if (!curItem) return;                      // this game does not name its items
      if (step.want){
        // the shuffle bag is deliberately out of the way here: repeating the fact
        // inside one sitting is the entire point of a 集中練習 session
        if (curItem === step.want || t === tries - 1) return;
        continue;
      }
      if (t === tries - 1){
        // the bag is empty (every fact has come up already): start a fresh pass
        if (usedItems.has(curItem)) usedItems.clear();
        usedItems.add(curItem);
        return;
      }
      if (usedItems.has(curItem)) continue;
      if (t >= PICKY || Store.factDue(curItem) >= DUE_ENOUGH){
        usedItems.add(curItem);
        return;
      }
    }
  }

  function nextQuestion(){
    killTimers();
    wrongThisQ = 0;
    $$('.pip', pipsEl).forEach((p, i) => p.classList.toggle('now', i === idx));
    setMood('idle');
    const step = plan[idx];
    if (mode !== 'level'){
      titleEl.textContent = (mode === 'daily' ? 'きょうの れんしゅう' : 'にがて あつめ') + '　' + step.game.name;
    }
    drawQuestion(step);
    // hand-built answer surfaces (plates, a queue of animals, the clock hand) never
    // call buildChoices, so start their clock here
    if (!askedAt) askedAt = performance.now();
    UI.fitPlayfield(fieldEl);     // size this question to the room it has
    refit();                      // and again next frame, once fonts/SVGs have settled
  }

  function onWrong(target){
    if (locked) return;
    markResponse();
    wrongThisQ++;
    mistakes++;
    Sound.sfx.wrong();
    setMood('soft');
    if (target && target.classList){
      target.classList.add('wrong');
      later(() => target.classList.remove('wrong'), 460);
    }
    if (wrongThisQ === 1){
      showFeedback('oops', 'もういちど やってみよう');
      Sound.say('惜しいね。もう一度やってみよう。', { delay: 260 });
    } else if (wrongThisQ >= 2){
      // The game's own hint is preferred, but the choice-dimming fallback runs too:
      // a hint that only speaks would leave a muted device with no feedback at all.
      if (!hintShown){
        hintShown = true;
        showFeedback('hint', 'ヒントを だすね');
        Sound.say('ヒントを出すね。', { delay: 260 });
        if (hintFn){ try{ hintFn(wrongThisQ); }catch(e){ console.error('hint failed', e); } }
        hintExtras.forEach(fn => { try{ fn(); }catch(e){ console.error('hint failed', e); } });
      }
      const live = hintBtns.filter(b => !b.classList.contains('dim'));
      if (live.length > 1) live[ri(0, live.length - 1)].classList.add('dim');
    }
  }

  function onCorrect(o){
    if (locked) return;
    locked = true;
    markResponse();
    clearFeedback();
    const clean = wrongThisQ === 0;
    if (clean) firstTryRight++;
    const g = plan[idx].game;
    const timed = g.fluent && clean ? respondedMs : null;
    if (timed != null && timed <= FLUENT_FAST_MS) swiftCount++;
    Store.noteOutcome(g.id, plan[idx].levelIndex, clean);
    if (curItem){
      Store.noteFact(curItem, clean, curLabel, g.id + ':' + plan[idx].levelIndex, timed);
      if (!clean && !shaky.some(x => x.key === curItem)){
        shaky.push({ key: curItem, label: curLabel || plan[idx].game.name });
      }
    }
    Sound.sfx.correct();
    setMood('happy');
    const pip = $$('.pip', pipsEl)[idx];
    if (pip){ pip.classList.remove('now'); pip.classList.add(wrongThisQ === 0 ? 'done' : 'miss'); }
    if (!o.quiet){
      UI.bigMark('◯');
      const praise = wrongThisQ === 0
        ? pick(['やったね！', '正解！', 'すごい！', '上手だね！', 'ばっちり！', 'その調子！'])
        : pick(['できたね！', 'よく頑張ったね！', 'その通り！']);
      Sound.say(praise, { delay: 320 });
    }
    if ((idx + 1) % 4 === 0) UI.confetti(22);
    later(() => {
      idx++;
      if (idx >= plan.length) finish();
      else nextQuestion();
    }, o.delay || 950);
  }

  /** 3 = every question right first time, 0 = under half. Levels vary in length,
      so grade the share, not the count. */
  function starsFor(right, total){
    if (!total) return 0;
    const r = right / total;
    return r >= 1 ? 3 : r >= 0.75 ? 2 : r >= 0.5 ? 1 : 0;
  }

  function finish(){
    killTimers();
    const total = plan.length;
    /* Stars used to be `mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1` — one star was
       guaranteed for finishing, so the unlock gate really only asked whether the
       child had sat through the level. Grade the questions answered right first
       time instead, and let a session score nothing. */
    const stars = starsFor(firstTryRight, total);
    /* ★★★ says every answer was right first time. This says they arrived — which is
       the thing these levels are actually for, and the thing three stars could not
       distinguish from nine seconds of counting. Only on the games where speed is
       the stated goal, and never on きょうの れんしゅう, which mixes them all. */
    const swift = stars === 3 && total > 0 && mode !== 'daily'
                  && plan.every(p => p.game.fluent) && swiftCount / total >= 0.75;
    // a session that did not pass should not get a party; it gets an invitation
    if (stars >= 1){ Sound.sfx.finish(); UI.confetti(60); }
    else Sound.sfx.place();
    let newSticker = null;
    if (mode === 'level'){
      const key = curGame.id + ':' + curLevelIdx;
      Store.recordLevel(curGame.id, curLevelIdx, stars, firstTryRight, total);
      if (swift) Store.recordSwift(curGame.id, curLevelIdx);
      // a sticker means "cleared", so it waits for a pass
      if (stars >= 1){
        if (Store.addSticker(key)) newSticker = { emoji: stickerFor(key), gold: stars === 3 };
        else if (stars === 3 && Store.addSticker(key + ':g')){
          newSticker = { emoji: stickerFor(key + ':g'), gold: true };
        }
      }
    } else {
      if (mode === 'daily') Store.recordPractice(firstTryRight, total);
      else Store.recordFocus(firstTryRight, total);
      // one sticker per calendar day, per set
      const key = (mode === 'daily' ? 'daily:' : 'focus:') + Store.todayKey();
      if (Store.addSticker(key)) newSticker = { emoji: stickerFor(key), gold: stars === 3 };
    }
    Result.show({ stars, right: firstTryRight, total, mode, game: curGame, levelIndex: curLevelIdx,
                  sticker: newSticker, shaky: shaky.slice(0, 3), focusKeys: focusKeys.slice(), swift });
  }

  return {
    startLevel, startDaily, startFocus, build,
    _test: {
      flushTimers,
      get idx(){ return idx; },
      get planLength(){ return plan.length; },
      get planGames(){ return plan.map(p => p.game.id + ':' + p.levelIndex); },
      get item(){ return curItem; },
      /** Test seam: finish the current question without using its own input.
          Lets the suite measure what the engine *draws* for levels it cannot
          drive by clicking (tracing, dragging, turning the clock hand). */
      forceCorrect(){ onCorrect({ quiet: true, delay: 0 }); },
      get shaky(){ return shaky.slice(); },
      get locked(){ return locked; },
      get mistakes(){ return mistakes; },
      get pending(){ return timers.size; },
      get mode(){ return mode; },
      get responseMs(){ return respondedMs; },
      get planItems(){ return plan.map(p => p.want || null); }
    }
  };
})();

/* ===========================================================
   10 — WORLD 1「かずの しま」 数える・すうじ・じゅんばん・なぞりがき
   =========================================================== */
'use strict';

const THINGS = [
  { e: '🍎', n: 'りんご' }, { e: '🍓', n: 'いちご' }, { e: '🍌', n: 'バナナ' },
  { e: '🍇', n: 'ぶどう' }, { e: '🐟', n: 'さかな' }, { e: '🐤', n: 'ひよこ' },
  { e: '🐱', n: 'ねこ' },   { e: '🐶', n: 'いぬ' },   { e: '🚗', n: 'くるま' },
  { e: '⚽️', n: 'ボール' }, { e: '🌸', n: 'おはな' }, { e: '⭐️', n: 'ほし' },
  { e: '🧁', n: 'ケーキ' }, { e: '🎈', n: 'ふうせん' }, { e: '🐞', n: 'てんとうむし' },
  { e: '🦋', n: 'ちょうちょ' }, { e: '🍩', n: 'ドーナツ' }, { e: '🐸', n: 'かえる' }
];

/* ============================================================
   1. かぞえよう — one-to-one correspondence & cardinality
   ============================================================ */
function makeCountField(api, count, thing, layout){
  const field = el('div.objfield');
  const pts = layout === 'line' ? lineup(count, .5) : scatter(count);
  const objs = [];
  pts.forEach((p, i) => {
    const o = el('div.obj', { style: { left: (p[0] * 100) + '%', top: (p[1] * 100) + '%' } }, thing.e);
    o.dataset.i = i;
    objs.push(o);
    field.append(o);
  });
  api.field.append(field);
  return objs;
}

function countQuestion(api, lo, hi, layout){
  const thing = pick(THINGS);
  const count = ri(lo, hi);
  api.item('count' + (layout === 'line' ? 'L' : 'S') + ':' + count, count + 'こ を かぞえる');
  api.setPrompt(`${thing.n}を ひとつずつ タップして かぞえよう`, `${thing.n}を、ひとつずつタップして数えよう。`);
  const objs = makeCountField(api, count, thing, layout);
  let done = 0;
  const tap = (o) => {
    if (o.classList.contains('counted') || api.locked) return;
    done++;
    o.classList.add('counted');
    o.append(el('span.tag', { text: String(done) }));
    Sound.sfx.count(done - 1);
    Sound.say(numKana(done), { delay: 0, rate: 1.08 });
    if (done === count) api.later(ask, 620);
  };
  objs.forEach(o => {
    tappable(o, () => tap(o));
  });

  function ask(){
    api.setPrompt(`${thing.n}は ぜんぶで いくつ？`, `${thing.n}は、全部でいくつ？`);
    const n = hi <= 5 ? 3 : 4;
    const vals = shuffle([count].concat(distractors(count, n - 1, 1, Math.max(hi + 2, 6))));
    api.buildChoices(vals, count);
  }
}

function giveQuestion(api, lo, hi){
  const thing = pick(THINGS);
  const target = ri(lo, hi);
  const total = Math.min(14, target + ri(3, 5));
  api.item('give:' + target, target + 'こ だけ とりだす');
  api.setPrompt(`${thing.n}を ${numTag(target)}こ とって かごに いれよう`, `${thing.n}を${koKana(target)}、とって、かごに入れよう。`);
  const objs = makeCountField(api, total, thing, 'scatter');
  const picked = new Set();
  const basketCount = el('div.n', { text: '0' });
  const basketItems = el('div.items');
  const basket = el('div.basket', null,
    el('div.b', { text: '🧺' }), basketItems, basketCount);
  $('.objfield', api.field).append(basket);
  const doneBtn = el('button.btn.btn-accent', { text: 'できた！' });
  api.choices.append(doneBtn);
  const refresh = () => {
    basketCount.textContent = String(picked.size);
    clear(basketItems);
    for (let i = 0; i < Math.min(picked.size, 12); i++) basketItems.append(el('span', { text: thing.e }));
  };
  refresh();
  objs.forEach(o => tappable(o, () => {
    if (api.locked) return;
    const i = o.dataset.i;
    if (picked.has(i)){ picked.delete(i); o.classList.remove('picked'); Sound.sfx.tap(); }
    else { picked.add(i); o.classList.add('picked'); Sound.sfx.count(picked.size - 1); Sound.say(numKana(picked.size), { delay: 0, rate: 1.08 }); }
    refresh();
  }));
  doneBtn.addEventListener('click', () => {
    if (api.locked) return;
    if (picked.size === target){ doneBtn.classList.add('choice', 'correct'); api.correct(); }
    else {
      api.wrong(doneBtn);
      Sound.say(picked.size > target ? 'ちょっと多いみたい。' : 'ちょっと足りないみたい。', { delay: 300 });
    }
  });
  api.onHint(() => {
    basket.classList.add('want');
    basket.append(el('div.want', { text: 'ほしいのは ' + target + 'こ' }));
  });
}

/* ============================================================
   2. すうじ どれかな — numeral ↔ quantity
   ============================================================ */
/* Every plate is the same size with the same 6x2 lattice of slots: the child has
   to count, because the card that looks biggest is no longer the one with most. */
function groupNode(count, thing){
  const rows = count > 6 ? 2 : 1;          // keep the group vertically centred in the plate
  const g = el('div.slots', { style: { '--rows': rows } });
  for (let i = 0; i < rows * 6; i++) g.append(el('span.slot', null, i < count ? thing.e : ''));
  return g;
}

function numToQty(api, lo, hi){        // numeral shown → pick the matching group
  const n = ri(lo, hi), thing = pick(THINGS);
  api.item('n2q:' + n, 'すうじ ' + n + ' → その かず');
  api.setPrompt(`${thing.e} が ${numTag(n)}こ あるのは どれ？`, `${thing.n}が${koKana(n)}、あるのは、どれ？`);
  const big = el('div', { style: { fontFamily: 'var(--fs-num)', fontWeight: 800, fontSize: 'calc(var(--u)*11)', lineHeight: 1, color: 'var(--c-red)' }, text: String(n) });
  api.field.append(big);
  const opts = shuffle([n].concat(distractors(n, 2, Math.max(1, lo - 1), Math.min(12, hi + 2), 2)));
  clear(api.choices);
  opts.forEach(v => {
    const plate = el('div.plate.fixed', null, groupNode(v, thing));
    tappable(plate, () => {
      if (api.locked) return;
      if (v === n){ plate.classList.add('correct'); api.correct(); }
      else { plate.classList.add('wrong'); api.later(() => plate.classList.remove('wrong'), 460); api.wrong(plate); }
    });
    api.choices.append(plate);
  });
}

function qtyToNum(api, lo, hi){        // group shown → pick the numeral
  const n = ri(lo, hi), thing = pick(THINGS);
  api.item('q2n:' + n, n + 'こ → すうじ ' + n);
  api.setPrompt(`${thing.n}は いくつ？ すうじを えらぼう`, `${thing.n}はいくつ？数字を選ぼう。`);
  const wrap = el('div.row', { style: { maxWidth: 'calc(var(--u)*40)' } });
  for (let i = 0; i < n; i++) wrap.append(el('span.item', { text: thing.e, style: { fontSize: 'calc(var(--u)*4.4)' } }));
  api.field.append(wrap);
  const c = hi <= 5 ? 3 : 4;
  api.buildChoices(shuffle([n].concat(distractors(n, c - 1, 1, hi + 3))), n);
}

function tenFrameNode(count, cols, opts){
  const o = opts || {};
  const f = el('div.tenframe', { style: { '--cols': cols } });
  const total = o.total != null ? o.total : cols * 2;
  for (let i = 0; i < total; i++){
    const cell = el('div.cell');
    if (i < count) cell.append(el('div.dot' + (o.second != null && i >= o.second ? '.b' : '')));
    f.append(cell);
  }
  return f;
}

function teenQuestion(api){            // 11-20 with a filled ten-frame + loose ones
  const n = ri(11, 20), thing = pick(THINGS);
  api.item('teen:' + n, n + ' を 10と ' + (n - 10) + ' で みる');
  api.setPrompt('ぜんぶで いくつ？', '全部でいくつ？');
  const box = el('div.frameset');
  box.append(tenFrameNode(10, 5));
  const rest = el('div.row', { style: { maxWidth: 'calc(var(--u)*22)' } });
  for (let i = 0; i < n - 10; i++) rest.append(el('span.item', { text: thing.e, style: { fontSize: 'calc(var(--u)*3.2)' } }));
  box.append(rest);
  api.field.append(box, el('div.hintline', { text: '10の わくが いっぱい ＋ のこり' }));
  api.buildChoices(shuffle([n].concat(distractors(n, 3, 10, 20))), n);
}

/* ============================================================
   3. かずの じゅんばん — sequence, next/before, skip counting
   ============================================================ */
function lineFill(api, lo, hi, gaps){
  const nums = range(lo, hi);
  const inner = nums.slice(1, -1);
  const holes = sample(inner, Math.min(gaps, inner.length)).sort((a, b) => a - b);
  api.item('fill:' + holes[0], holes[0] + ' が ぬけた ならび');
  const line = el('div.numline');
  const cells = {};
  nums.forEach(v => {
    const isHole = holes.indexOf(v) >= 0;
    const n = el('div.nn' + (isHole ? '.gap' : ''), { text: isHole ? '?' : String(v) });
    cells[v] = n;
    line.append(n);
  });
  api.field.append(line);

  let qi = 0;
  function askNext(){
    nums.forEach(v => cells[v].classList.remove('now'));
    const target = holes[qi];
    cells[target].classList.add('now');
    api.setPrompt('ひかって いる ところに はいる かずは？', '光っているところに入る数は？');

    // A distractor must never be another hole's answer — that answer is also
    // "correct" on the number line, and marking it wrong is simply unfair.
    const banned = holes.filter(v => v !== target);
    const pool = nums.filter(v => v !== target && banned.indexOf(v) < 0)
                     .sort((a, b) => Math.abs(a - target) - Math.abs(b - target));
    const wrong = sample(pool.slice(0, 5), Math.min(2, pool.length));

    api.buildChoices(shuffle([target].concat(wrong)), target, {
      onPick(){
        cells[target].textContent = String(target);
        cells[target].classList.remove('now', 'gap');
        cells[target].classList.add('filled');
        Sound.sfx.place();
        qi++;
        if (qi < holes.length){
          api.later(askNext, 620);
          return false;            // more holes to go: keep this question open
        }
        return true;               // last hole — let the engine finish the question
      }
    });
    api.onHint(() => {
      [target - 1, target + 1].forEach(v => { if (cells[v]) cells[v].classList.add('near'); });
    });
  }
  askNext();
}

function nextBefore(api, hi){
  const mode = pick(['next', 'before', 'between']);
  const n = ri(2, hi - 1);
  let ans, html, speech;
  if (mode === 'next'){ ans = n + 1; html = `${numTag(n)} の つぎの かずは？`; speech = `${numKana(n)}の次の数は？`; }
  else if (mode === 'before'){ ans = n - 1; html = `${numTag(n)} の まえの かずは？`; speech = `${numKana(n)}の前の数は？`; }
  else { ans = n; html = `${numTag(n - 1)} と ${numTag(n + 1)} の あいだの かずは？`; speech = `${numKana(n-1)}と${numKana(n+1)}の間の数は？`; }
  api.item('nb:' + mode + ':' + ans,
    mode === 'next' ? n + ' の つぎ' : mode === 'before' ? n + ' の まえ' : (n - 1) + ' と ' + (n + 1) + ' の あいだ');
  api.setPrompt(html, speech);
  const line = el('div.numline');
  for (let v = Math.max(1, ans - 3); v <= Math.min(hi, ans + 3); v++){
    line.append(el('div.nn' + (v === ans ? '.gap.now' : ''), { text: v === ans ? '?' : String(v) }));
  }
  api.field.append(line);
  api.buildChoices(shuffle([ans].concat(distractors(ans, 3, 1, hi))), ans);
}

function skipCount(api){
  const step = pick([2, 5, 2, 10]);
  const start = step === 2 ? pick([2, 4, 6]) : step;
  const seq = [0, 1, 2, 3].map(i => start + i * step);
  const ans = seq[3];
  api.item('skip' + step + ':' + ans, step + 'ずつ ふえて ' + ans);
  api.setPrompt(`${step}ずつ ふえて いくよ。つぎは？`, `${numKana(step)}ずつ増えていくよ。次は？`);
  const line = el('div.numline');
  seq.forEach((v, i) => line.append(el('div.nn' + (i === 3 ? '.gap.now' : ''), { text: i === 3 ? '?' : String(v) })));
  api.field.append(line);
  api.buildChoices(shuffle([ans].concat(distractors(ans, 3, 1, ans + step * 2, step))), ans);
}

Games.add({
  id: 'seq', name: 'かずの じゅんばん', ico: '🪜', world: 'shima', color: 'var(--c-blue)',
  aim: '数を<b>並びとして</b>とらえ、「つぎ・まえ・あいだ」が言える力。数直線の感覚は、くり上がりの計算やものさしの読み取りにそのままつながります。',
  levels: [
    { t: '1〜10', d: 'あいた ところを うめる', make: api => lineFill(api, 1, 10, 2) },
    { t: '1〜20', d: 'もっと ながい ならび', make: api => { const lo = ri(6, 11); return lineFill(api, lo, lo + 9, 2); } },

/* ============================================================
   4. すうじを なぞろう — numeral formation
   ============================================================ */
function traceQuestion(api, digits){
  const d = String(pick(digits));
  const strokes = DIGIT_STROKES[d];
  api.item('trace:' + d, d + ' の かきかた');
  api.setPrompt(`${numTag(d)} を ゆびで なぞろう`, `${numKana(Number(d))}を指でなぞろう。`);

  const box = el('div.tracebox');
  const s = svg('svg', { viewBox: '0 0 100 140', preserveAspectRatio: 'xMidYMid meet' });
  const gGuide = svg('g'), gDone = svg('g'), gLive = svg('g'), gMark = svg('g');
  s.append(gGuide, gDone, gLive, gMark);
  box.append(s, el('div.trace-numlabel', { text: 'なぞりがき' }));
  api.field.append(box);

  strokes.forEach(st => {
    gGuide.append(svg('path', { d: toPath(st), class: 'trace-guide', fill: 'none',
      'stroke-width': 17, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    gGuide.append(svg('path', { d: toPath(st), class: 'trace-outline', fill: 'none',
      'stroke-width': 2, 'stroke-linecap': 'round' }));
  });

  let si = 0, progress = 0, drawing = false;
  let strays = 0, nudged = false, idleTimer = null;
  const TOL = 15, START_TOL = 22;

  function armIdle(){
    clearTimeout(idleTimer);
    idleTimer = api.later(() => {           // no progress for a while: show, don't scold
      if (si >= strokes.length) return;
      nudged = true;
      showGuide();
      Sound.say('赤い点から、なぞってみよう。', { delay: 100 });
    }, 9000);
  }
  function showGuide(){
    if ($('.trace-ghost', box) || si >= strokes.length) return;
    gMark.append(svg('path', { d: toPath(strokes[si]), class: 'trace-ghost', stroke: 'var(--accent)',
      'stroke-width': 3, 'stroke-dasharray': '4 4', fill: 'none', opacity: .9 }));
  }

  function startMark(){
    clear(gMark);
    if (si >= strokes.length) return;
    const p = strokes[si][0];
    const q = strokes[si][Math.min(6, strokes[si].length - 1)];
    gMark.append(svg('circle', { cx: p[0], cy: p[1], r: 6.5, class: 'trace-start pulse' }));
    gMark.append(svg('text', { x: p[0], y: p[1] + 2.6, 'text-anchor': 'middle', fill: '#fff',
      'font-size': 7.5, 'font-weight': 800, 'font-family': 'var(--fs-num)' }, String(si + 1)));
    const a = Math.atan2(q[1] - p[1], q[0] - p[0]);
    gMark.append(svg('path', {
      d: `M${p[0] + Math.cos(a) * 11} ${p[1] + Math.sin(a) * 11} l${Math.cos(a) * 8} ${Math.sin(a) * 8}`,
      stroke: 'var(--c-red)', 'stroke-width': 3, 'stroke-linecap': 'round', opacity: .7
    }));
  }
  function redraw(){
    clear(gLive);
    if (si < strokes.length && progress > 1){
      gLive.append(svg('path', { d: toPath(strokes[si].slice(0, progress)), class: 'trace-live', fill: 'none',
        'stroke-width': 13, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    }
  }
  function pt(e){
    const m = s.getScreenCTM();
    if (!m) return null;
    const p = s.createSVGPoint();
    p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(m.inverse());
    return [q.x, q.y];
  }
  function onDown(e){
    const p = pt(e); if (!p || si >= strokes.length) return;
    const st = strokes[si];
    const near = dist(p[0], p[1], st[progress ? Math.min(progress, st.length - 1) : 0][0],
                                  st[progress ? Math.min(progress, st.length - 1) : 0][1]);
    if (near <= START_TOL){
      drawing = true;
      clearTimeout(idleTimer);
      box.setPointerCapture && box.setPointerCapture(e.pointerId);
      e.preventDefault();
    } else {
      // touched the wrong place: bounce the start dot toward the finger, and after a
      // couple of tries count it as a miss so the hint fires and the stars are honest
      const dot = $('.trace-start', box);
      if (dot && dot.animate) dot.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.6)' }, { transform: 'scale(1)' }],
        { duration: 420 });
      if (++strays % 2 === 0) api.wrong();
      armIdle();
    }
  }
  function onMove(e){
    if (!drawing || si >= strokes.length) return;
    e.preventDefault();
    const p = pt(e); if (!p) return;
    const st = strokes[si];
    const look = Math.min(st.length - 1, progress + 26);
    for (let i = Math.max(progress, 1); i <= look; i++){
      if (dist(p[0], p[1], st[i][0], st[i][1]) <= TOL) progress = Math.max(progress, i + 1);
    }
    redraw();
    armIdle();
    if (progress >= st.length - 2) completeStroke();
  }
  function completeStroke(){
    drawing = false;
    clearTimeout(idleTimer);
    gDone.append(svg('path', { d: toPath(strokes[si]), class: 'trace-done', fill: 'none',
      'stroke-width': 13, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
    clear(gLive);
    Sound.sfx.place();
    si++; progress = 0;
    if (si >= strokes.length){
      clear(gMark);
      api.later(() => api.correct(), 220);
    } else {
      startMark();
      armIdle();
      Sound.say('次の線も、なぞってね。', { delay: 150 });
    }
  }
  function onUp(){ drawing = false; }

  box.addEventListener('pointerdown', onDown);
  box.addEventListener('pointermove', onMove);
  box.addEventListener('pointerup', onUp);
  box.addEventListener('pointercancel', onUp);
  box.addEventListener('pointerleave', onUp);

  api.onHint(showGuide);
  box.addEventListener('pointerdown', () => { if (nudged) clearTimeout(idleTimer); });
  startMark();
  redraw();
  armIdle();
}

/* ===========================================================
   11 — WORLD 2「くらべる うみ」 くらべる・なんばんめ・おおきさ
   =========================================================== */
'use strict';

/* ============================================================
   5. どっちが おおい — quantity beats appearance
   ============================================================ */
function platesCompare(api, opts){
  const o = opts || {};
  const thing = pick(THINGS);
  const want = o.least ? 'least' : 'most';
  const counts = o.counts;
  const answer = want === 'most' ? Math.max.apply(null, counts) : Math.min.apply(null, counts);
  const sorted = counts.slice().sort((x, y) => x - y);
  api.item('cmp:' + sorted.join('_') + ':' + want,
    sorted.join(' と ') + ' の ' + (want === 'most' ? 'おおい ほう' : 'すくない ほう'));
  api.setPrompt(want === 'most' ? 'どっちが <b>おおい</b>？' : 'どっちが <b>すくない</b>？',
                want === 'most' ? 'どっちが多い？' : 'どっちが少ない？');
  if (counts.length > 2){
    api.setPrompt(want === 'most' ? 'いちばん <b>おおい</b> のは どれ？' : 'いちばん <b>すくない</b> のは どれ？',
                  want === 'most' ? '一番多いのは、どれ？' : '一番少ないのは、どれ？');
  }
  const wrap = el('div.row', { style: { gap: 'calc(var(--u)*1.4)' } });
  const order = shuffle(counts.map((c, i) => ({ c, i })));
  let solved = false;
  order.forEach(({ c, i }) => {
    const size = o.sizes ? o.sizes[i] : null;
    const plate = el('div.plate', {
      style: { minWidth: 'calc(var(--u)*' + (counts.length > 2 ? 11 : 15) + ')' } });
    const g = el('div.row', { style: { maxWidth: 'calc(var(--u)*' + (counts.length > 2 ? 10 : 14) + ')' } });
    for (let k = 0; k < c; k++){
      g.append(el('span.item', { text: thing.e, style: { fontSize: 'calc(var(--u)*' + (size || 2.8) + ')' } }));
    }
    plate.append(g);
    tappable(plate, () => {
      if (api.locked || solved) return;
      if (c === answer){ solved = true; plate.classList.add('correct'); api.correct(); }
      else { plate.classList.add('wrong'); api.later(() => plate.classList.remove('wrong'), 460); api.wrong(plate); }
    });
    wrap.append(plate);
    plate.dataset.count = c;
  });
  api.field.append(wrap);
  api.onHint(() => {
    $$('.plate', wrap).forEach(p => {
      if (!$('.hintline', p)) p.append(el('div.hintline', { text: p.dataset.count + 'こ' }));
    });
  });
}

function compareEasy(api){
  let a = ri(1, 8), b = ri(1, 8);
  for (let g = 0; g < 200 && Math.abs(a - b) < 3; g++){ a = ri(1, 8); b = ri(1, 8); }
  if (Math.abs(a - b) < 3){ a = 2; b = 7; }
  platesCompare(api, { counts: [a, b], least: chance(.3) });
}
function compareClose(api){
  // same count-difference of 1-2, but the smaller group is drawn LARGER on purpose:
  // the child has to count instead of judging by how much space it fills.
  let a = ri(4, 11), b = a + pick([1, 2]) * (chance(.5) ? 1 : -1);
  b = clamp(b, 2, 12);
  if (a === b) b = a + 1;
  const sizes = [2.6, 2.6];
  if (chance(.6)){ const small = a < b ? 0 : 1; sizes[small] = 4.4; sizes[1 - small] = 2.2; }
  platesCompare(api, { counts: [a, b], sizes, least: chance(.35) });
}
function compareThree(api){
  const set = new Set();
  for (let g = 0; g < 300 && set.size < 3; g++) set.add(ri(2, 12));
  [2, 7, 12].forEach(v => { if (set.size < 3) set.add(v); });
  platesCompare(api, { counts: Array.from(set), least: chance(.45) });
}
function compareNumerals(api){
  let a = ri(1, 20), b = ri(1, 20);
  for (let g = 0; g < 200 && a === b; g++) b = ri(1, 20);
  if (a === b) b = a === 20 ? 1 : a + 1;
  const most = chance(.6);
  const ans = most ? Math.max(a, b) : Math.min(a, b);
  api.item('numcmp:' + Math.min(a, b) + '_' + Math.max(a, b) + ':' + (most ? 'g' : 'l'),
    'すうじ ' + a + ' と ' + b + ' の くらべ');
  api.setPrompt(most ? 'かずが <b>おおきい</b> のは どっち？' : 'かずが <b>ちいさい</b> のは どっち？',
                most ? '数が大きいのは、どっち？' : '数が小さいのは、どっち？');
  api.field.append(el('div.hintline', { text: 'すうじで くらべよう' }));
  api.buildChoices(shuffle([a, b]), ans);
}

  aim: '<b>見た目の大きさや広がりに惑わされず</b>、数そのもので多い少ないを判断する力。「大きい物が少しある方が多く見える」段階を、数えて確かめる経験で越えていきます。',

});

/* ============================================================
   6. なんばんめ — ordinal position vs cardinal amount
   ============================================================ */
const CRITTERS = ['🐰','🐻','🦊','🐯','🐨','🐸','🐷','🐮','🐼','🐵','🦁','🐔','🐧','🦉'];

function ordinalRow(api, n, dir, target){
  const critters = sample(CRITTERS, n);
  const label = { front: 'まえ', back: 'うしろ', left: 'ひだり', right: 'みぎ' }[dir];
  api.item('ord:' + dir + ':' + target, label + 'から ' + target + 'ばんめ');
  api.setPrompt(`${label}から ${numTag(target)}ばんめ の どうぶつを タップ`,
                `${label}から${banmeKana(target)}の動物をタップ。`);
  const idxWanted = (dir === 'front' || dir === 'left') ? target - 1 : n - target;
  const q = el('div.queue');
  critters.forEach((c, i) => {
    const item = el('div.qi', { text: c });
    tappable(item, () => {
      if (api.locked) return;
      if (i === idxWanted){ item.classList.add('correct'); api.correct(); }
      else { item.classList.add('wrong'); api.later(() => item.classList.remove('wrong'), 460); api.wrong(item); }
    });
    q.append(item);
  });
  // the marker sits at the end you count from and points into the line
  const fromLeft = (dir === 'front' || dir === 'left');
  const marker = fromLeft
    ? el('div.dirmark', null, label + 'から', arrowSVG('right'))
    : el('div.dirmark', null, arrowSVG('left'), label + 'から');
  api.field.append(el('div.row', { style: { flexWrap: 'nowrap', gap: 'calc(var(--u)*.6)', maxWidth: '100%' } },
    fromLeft ? marker : null, q, fromLeft ? null : marker));
  api.onHint(() => {
    $$('.qi', q).forEach((item, i) => {
      const k = fromLeft ? i + 1 : n - i;
      if (!$('.hintline', item)) item.prepend(el('div.hintline', { text: String(k), style: { fontSize: 'calc(var(--u)*1.1)' } }));
    });
  });
}

function ordinalVsCount(api, n){
  const critters = sample(CRITTERS, n);
  const k = ri(2, Math.min(4, n - 1));
  const countMode = chance(.5);
  api.item('ovc:' + (countMode ? 'ko' : 'me') + ':' + k, k + (countMode ? 'こ（ぜんぶ）' : 'ばんめ（ひとり）'));
  api.setPrompt(countMode
      ? `まえから ${numTag(k)}<b>こ</b> タップ　（${k}ひき ぜんぶ）`
      : `まえから ${numTag(k)}<b>ばんめ</b> だけ タップ`,
    countMode ? `前から${koKana(k)}、タップしてね。` : `前から${banmeKana(k)}だけタップしてね。`);
  const q = el('div.queue');
  const marked = new Set();
  critters.forEach((c, i) => {
    const item = el('div.qi', { text: c });
    tappable(item, () => {
      if (api.locked) return;
      if (countMode){
        if (marked.has(i)){ marked.delete(i); item.classList.remove('marked'); Sound.sfx.tap(); return; }
        marked.add(i); item.classList.add('marked'); Sound.sfx.count(marked.size - 1);
        if (marked.size === k){
          const ok = Array.from(marked).every(v => v < k);
          if (ok){ $$('.qi', q).forEach((x, j) => { if (j < k) x.classList.add('correct'); }); api.correct(); }
          else {
            api.wrong();
            marked.forEach(v => $$('.qi', q)[v].classList.remove('marked'));
            marked.clear();
          }
        }
      } else {
        if (i === k - 1){ item.classList.add('correct'); api.correct(); }
        else { item.classList.add('wrong'); api.later(() => item.classList.remove('wrong'), 460); api.wrong(item); }
      }
    });
    q.append(item);
  });
  api.field.append(el('div.row', { style: { flexWrap: 'nowrap', gap: 'calc(var(--u)*.6)', maxWidth: '100%' } },
    el('div.dirmark', null, 'まえ', arrowSVG('right')), q));
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', {
      text: countMode ? '「◯こ」は まえから その かずだけ ぜんぶ' : '「◯ばんめ」は そのひとり だけ' }));
  });
}

function gridPosition(api, cols, rows){
  const cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push({ r, c });
  const pool = shuffle(CRITTERS.concat(CRITTERS)).slice(0, cols * rows);
  const tr = ri(1, rows), tc = ri(1, cols);
  api.item('grid:' + tr + '_' + tc, 'うえから ' + tr + '・ひだりから ' + tc);
  api.setPrompt(`うえから ${numTag(tr)}ばんめ、ひだりから ${numTag(tc)}ばんめ は だれ？`,
                `上から${banmeKana(tr)}、左から${banmeKana(tc)}は、だれ？`);
  const g = el('div.qgrid', { style: { '--gc': cols } });
  cells.forEach((cell, i) => {
    const item = el('div.qi', { text: pool[i] });
    tappable(item, () => {
      if (api.locked) return;
      if (cell.r === tr - 1 && cell.c === tc - 1){ item.classList.add('correct'); api.correct(); }
      else { item.classList.add('wrong'); api.later(() => item.classList.remove('wrong'), 460); api.wrong(item); }
    });
    g.append(item);
  });
  // two axes at once is hard enough without having to guess where counting starts
  api.field.append(el('div.axes', null,
    el('div.axis-x', null, 'ひだりから', arrowSVG('right')),
    el('div.axis-row', null,
      el('div.axis-y', null, 'うえ', arrowSVG('right')),
      g)));
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    $$('.qi', g).forEach((item, i) => {
      if (cells[i].c === tc - 1) item.classList.add('colhint');
      if (cells[i].r === tr - 1) item.classList.add('rowhint');
    });
    api.field.append(el('div.hintline', { text: 'まず うえから かぞえて、つぎに ひだりから かぞえよう' }));
  });
}

/* ============================================================
   7. おおきさ くらべ — length, capacity, ordering
   ============================================================ */
const MEAS_ICONS = ['✏️','🖍','🧵','🥕','🦴','🪵','🧹','🎋'];

/* one row = icon + a fixed-width track; the bar's width is a share of the track,
   so what the child sees is exactly proportional to the length being compared. */
function barRow(len, offset, color, cap){
  const track = el('div.track', null,
    offset ? el('div.gap', { style: { width: offset + '%' } }) : null,
    el('div.stickbar', { style: { width: len + '%', '--mc': color } }));
  return el('div.mrow', { role: 'button', tabindex: '0' }, el('div.cap', { text: cap }), track);
}

function lengthCompare(api, aligned){
  const n = ri(3, 4);
  const lens = [];
  for (let g = 0; g < 400 && lens.length < n; g++){
    const v = ri(24, 92);
    if (lens.every(x => Math.abs(x - v) >= 12)) lens.push(v);
  }
  while (lens.length < n) lens.push(28 + lens.length * 16);
  const cap = pick(MEAS_ICONS);
  const longest = chance(.55);
  const ans = longest ? Math.max.apply(null, lens) : Math.min.apply(null, lens);
  api.item('len:' + (aligned ? 'aligned' : 'ragged') + ':' + (longest ? 'L' : 'S') + ':' + n,
    (aligned ? 'はしが そろった ' : 'はしが ずれた ') + (longest ? 'いちばん ながい' : 'いちばん みじかい'));
  api.setPrompt(longest ? 'いちばん <b>ながい</b> のは どれ？' : 'いちばん <b>みじかい</b> のは どれ？',
                longest ? '一番長いのは、どれ？' : '一番短いのは、どれ？');
  const wrap = el('div.measure');
  const colors = shuffle(['var(--c-red)','var(--c-blue)','var(--c-green)','var(--c-purple)']);
  lens.forEach((L, i) => {
    const off = aligned ? 0 : ri(0, Math.max(0, Math.min(22, 97 - L)));
    const row = barRow(L, off, colors[i % colors.length], cap);
    tappable(row, () => {
      if (api.locked) return;
      if (L === ans){ row.classList.add('correct'); api.correct(); }
      else { row.classList.add('wrong'); api.later(() => row.classList.remove('wrong'), 460); api.wrong(row); }
    });
    wrap.append(row);
  });
  api.field.append(wrap);
  if (!aligned) api.field.append(el('div.hintline', { text: 'はじまる ところが ちがうよ。ながさ だけを みてね' }));
  // sliding every bar back to a shared start line IS the lesson, so show it
  api.onHint(() => {
    $$('.track .gap', wrap).forEach(g => { g.style.transition = 'width .6s ease'; g.style.width = '0%'; });
    wrap.classList.add('lined');
    api.field.append(el('div.hintline', { text: 'はじまりを そろえて みたよ' }));
  });
}

function vesselSVG(w, h, fill, color){
  const W = 90, H = 130;
  const x = (W - w) / 2;
  const waterH = h * fill;
  return svg('svg', { viewBox: `0 0 ${W} ${H}`, width: 'calc(var(--u)*11)', height: 'calc(var(--u)*16)' },
    svg('rect', { x, y: H - h - 6, width: w, height: h, rx: 4, fill: 'var(--card)', stroke: 'var(--ink)', 'stroke-width': 3 }),
    svg('rect', { x: x + 3, y: H - waterH - 9, width: w - 6, height: waterH, rx: 3, fill: color, opacity: .85 }),
    svg('rect', { x, y: H - h - 6, width: w, height: h, rx: 4, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 3 }));
}

/* A shared unit for every glass in the question.
   The hint tells the child to count squares, so the squares have to be the same
   size in every glass and on both axes — 任意単位は同じ大きさでそろえる is the whole
   point of 1年生「かさくらべ」. The old hint derived its spacing from each glass's
   own width and height (`w / round(w / 13)`), so a wide glass got wide squares and
   a narrow one got narrow squares: counting them gave a tie or the wrong answer in
   about 2% of questions (面積 2442 と 3483 が どちらも18マス), and taught an invalid
   way of comparing in all of them.

   Sizing the water to whole multiples of one unit makes the count exact, so the
   answer the child reaches by counting is always the answer the question wants. */
const CAP_UNIT = 12;                    // SVG units, square
const CAP_COLS = [2, 3, 4];             // water width  = cols * CAP_UNIT
const CAP_ROWS = [5, 6, 7, 8, 9];       // water height = rows * CAP_UNIT
const CAP_FALLBACK = [[2, 9], [4, 6], [2, 5]];

function capSpec(cols, rows){
  return { cols, rows, cells: cols * rows,
           w: cols * CAP_UNIT + 6,      // vesselSVG insets the water by 3 a side
           h: rows * CAP_UNIT, fill: 1 };
}

function capacityCompare(api){
  const n = chance(.5) ? 2 : 3;
  // far enough apart to be a fair question by eye as well as by counting
  const clearOf = (list, s) => list.every(o =>
    Math.abs(o.cells - s.cells) / Math.max(o.cells, s.cells) > 0.18);

  let specs = [];
  for (let attempt = 0; attempt < 60 && !specs.length; attempt++){
    const trial = [];
    for (let g = 0; g < 300 && trial.length < n; g++){
      const s = capSpec(pick(CAP_COLS), pick(CAP_ROWS));
      if (clearOf(trial, s)) trial.push(s);
    }
    if (trial.length < n) continue;
    // "tall" must not mean "much": keep looking for a set where the tallest glass
    // is not the fullest one, and only give up on that near the end
    const tallest = trial.reduce((a, b) => a.rows > b.rows ? a : b);
    const fullest = trial.reduce((a, b) => a.cells > b.cells ? a : b);
    if (attempt < 45 && tallest === fullest) continue;
    specs = trial;
  }
  if (specs.length < n) specs = CAP_FALLBACK.slice(0, n).map(([c, r]) => capSpec(c, r));

  const more = chance(.6);
  const ans = more ? Math.max.apply(null, specs.map(s => s.cells))
                   : Math.min.apply(null, specs.map(s => s.cells));
  api.item('cap:' + (more ? 'more' : 'less') + ':' + n, 'かさが ' + (more ? 'おおい' : 'すくない') + ' コップ');
  api.setPrompt(more ? 'ジュースが <b>おおい</b> のは どれ？' : 'ジュースが <b>すくない</b> のは どれ？',
                more ? 'ジュースが多いのは、どれ？' : 'ジュースが少ないのは、どれ？');
  const colors = shuffle(['var(--c-orange)','var(--c-red)','var(--c-purple)']);
  const wrap = el('div.vessels');
  shuffle(specs).forEach((s, i) => {
    const v = el('div.vessel', null, vesselSVG(s.w, s.h, s.fill, colors[i % colors.length]));
    tappable(v, () => {
      if (api.locked) return;
      if (s.cells === ans){ v.classList.add('correct'); api.correct(); }
      else { v.classList.add('wrong'); api.later(() => v.classList.remove('wrong'), 460); api.wrong(v); }
    });
    wrap.append(v);
  });
  api.field.append(wrap, el('div.hintline', { text: 'せが たかい ＝ おおい とは かぎらないよ' }));
  // one unit, the same in every glass, dividing the water exactly
  api.onHint(() => {
    $$('.vessel svg', wrap).forEach(sv => {
      const water = sv.querySelectorAll('rect')[1];
      if (!water || sv.querySelector('.unitgrid')) return;
      const x = +water.getAttribute('x'), y = +water.getAttribute('y');
      const w = +water.getAttribute('width'), h = +water.getAttribute('height');
      const g = svg('g', { class: 'unitgrid' });
      for (let gx = x; gx <= x + w + 0.1; gx += CAP_UNIT)
        g.append(svg('line', { x1: gx, y1: y, x2: gx, y2: y + h, stroke: 'rgba(255,255,255,.75)', 'stroke-width': 1 }));
      for (let gy = y; gy <= y + h + 0.1; gy += CAP_UNIT)
        g.append(svg('line', { x1: x, y1: gy, x2: x + w, y2: gy, stroke: 'rgba(255,255,255,.75)', 'stroke-width': 1 }));
      sv.append(g);
    });
    api.field.append(el('div.hintline', { text: 'おなじ おおきさの ますが いくつ ぶんか かぞえよう' }));
  });
}

function orderBySize(api){
  const n = ri(3, 4);
  const lens = [];
  for (let g = 0; g < 400 && lens.length < n; g++){
    const v = ri(26, 94);
    if (lens.every(x => Math.abs(x - v) >= 14)) lens.push(v);
  }
  while (lens.length < n) lens.push(30 + lens.length * 18);
  const asc = chance(.5);
  const wanted = lens.slice().sort((a, b) => asc ? a - b : b - a);
  api.item('order:' + (asc ? 'asc' : 'desc') + ':' + n, n + 'つを ' + (asc ? 'みじかい' : 'ながい') + ' じゅんに');
  api.setPrompt(asc ? '<b>みじかい</b> じゅんに タップしよう' : '<b>ながい</b> じゅんに タップしよう',
                asc ? '短い順にタップしよう。' : '長い順にタップしよう。');
  const cap = pick(MEAS_ICONS);
  const colors = shuffle(['var(--c-red)','var(--c-blue)','var(--c-green)','var(--c-purple)']);
  const wrap = el('div.measure');
  let step = 0;
  shuffle(lens).forEach((L, i) => {
    const row = barRow(L, 0, colors[i % colors.length], cap);
    tappable(row, () => {
      if (api.locked || row.classList.contains('picked')) return;
      if (L === wanted[step]){
        step++;
        row.classList.add('picked');
        row.classList.remove('nexthint');
        row.prepend(el('div.ordno', { text: String(step) }));
        Sound.sfx.count(step - 1);
        if (step === n){ $$('.mrow', wrap).forEach(r => r.classList.add('correct')); api.correct(); }
      } else {
        row.classList.add('wrong');
        api.later(() => row.classList.remove('wrong'), 460);
        api.wrong(row);
      }
    });
    wrap.append(row);
  });
  api.field.append(wrap);
  api.onHint(() => {
    const wantNow = wanted[step];
    $$('.mrow', wrap).forEach(r => {
      const bar = $('.stickbar', r);
      if (bar && Math.abs(parseFloat(bar.style.width) - wantNow) < 0.01) r.classList.add('nexthint');
    });
    api.field.append(el('div.hintline', { text: asc ? 'ひかって いるのが つぎに みじかい よ' : 'ひかって いるのが つぎに ながい よ' }));
  });
}

/* ---- 12-g-calc.js ---- */
/* ===========================================================
   12 — WORLD 3「けいさんの やま」 いくつといくつ・10のおともだち・たし／ひき
   =========================================================== */
'use strict';

/** In a 集中練習 session the engine names the exact fact this question should ask.
    These generators read it, so a fact the child keeps missing can come round
    several times in one sitting; きょうの れんしゅう on its own gives one particular
    fact about a turn a fortnight. Returns the numbers in the key, or null. */
function wanted(api, re){
  const m = api.want && re.exec(api.want);
  return m ? m.slice(1).map(Number) : null;
}

/* ---------- shared: bond diagram ---------- */
function bondNode(whole, known, unknownLabel){
  const legs = svg('svg', { viewBox: '0 0 100 20', class: 'legs' },
    svg('path', { d: 'M50 0 L18 18 M50 0 L82 18', stroke: 'var(--ink)', 'stroke-width': 3,
                  'stroke-linecap': 'round', fill: 'none' }));
  return el('div.bond', null,
    el('div.whole', { text: String(whole) }),
    legs,
    el('div.parts', null,
      el('div.part.known', { text: String(known) }),
      el('div.part.unknown', { text: unknownLabel == null ? '?' : String(unknownLabel) })));
}

/* five/ten frame with a known part in blue and the missing part as empty holes */
function partFrame(whole, known){
  const cols = whole > 5 ? 5 : whole;
  const f = el('div.tenframe', { style: { '--cols': cols } });
  for (let i = 0; i < whole; i++){
    const cell = el('div.cell' + (i >= known ? '.hole' : ''));
    if (i < known) cell.append(el('div.dot'));
    f.append(cell);
  }
  return f;
}

/* ============================================================
   8. いくつと いくつ — number bonds (decompose & compose)
   ============================================================ */
function decompose(api, whole, pad){
  const w = wanted(api, /^dec:(\d+)-(\d+)$/);
  const aim = w && w[0] >= 2 && w[1] >= 1 && w[1] < w[0];
  if (aim) whole = w[0];
  const known = aim ? w[1] : ri(1, whole - 1), ans = whole - known;
  api.item('dec:' + whole + '-' + known, whole + ' は ' + known + ' と ' + ans);
  api.setPrompt(`${numTag(whole)} は ${numTag(known)} と いくつ？`,
                `${numKana(whole)}は、${numKana(known)}といくつ？`);
  const frame = partFrame(whole, known);
  const frameset = el('div.frameset', null, frame);
  const bond = bondNode(whole, known, null);
  /* At the top level the picture *is* the answer: 「10は4といくつ」 with a ten-frame
     on screen is solved by counting the six empty cells, not by remembering that
     10 is 4 and 6. The keypad took guessing out of this level; leaving the frame up
     left counting in, which is the strategy the level exists to replace. So the
     frame comes back the moment the child answers — and earlier if they get stuck —
     where it confirms what they said instead of telling them. */
  if (!pad) api.field.append(frameset);
  api.field.append(bond);
  const showFrame = () => { if (!frameset.isConnected) api.field.prepend(frameset); };
  const showParts = {
    correctOpts: { delay: 1500 },
    onPick(){
      showFrame();
      // show the two parts making the whole (scoped to this question's own nodes)
      const cells = $$('.cell', frame);
      for (let i = known; i < whole; i++){
        api.later(() => {
          if (!cells[i].firstChild){ cells[i].classList.remove('hole'); cells[i].append(el('div.dot.b')); Sound.sfx.place(); }
        }, (i - known) * 170 + 200);
      }
      $('.part.unknown', bond).textContent = String(ans);
    }
  };
  if (pad) api.buildPad(ans, showParts);
  else api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 1, whole))), ans, showParts);
  if (pad) api.onHint(showFrame);
}

function compose(api, maxWhole, pad){
  const w = wanted(api, /^com:(\d+)\+(\d+)$/);
  const aim = w && w[0] >= 1 && w[1] >= 1 && w[0] + w[1] <= maxWhole;
  const a = aim ? w[0] : ri(1, maxWhole - 1);
  const b = aim ? w[1] : ri(1, maxWhole - a), ans = a + b;
  api.item('com:' + a + '+' + b, a + ' と ' + b + ' で ' + ans);
  api.setPrompt(`${numTag(a)} と ${numTag(b)} で いくつ？`,
                `${numKana(a)}と${numKana(b)}で、いくつ？`);
  const slots = a + b > 5 ? 10 : 5;
  const f = el('div.tenframe', { style: { '--cols': 5 } });
  for (let i = 0; i < slots; i++){
    const cell = el('div.cell');
    if (i < a) cell.append(el('div.dot'));
    else if (i < a + b) cell.append(el('div.dot.b'));
    f.append(cell);
  }
  const frameset = el('div.frameset', null, f);
  if (!pad) api.field.append(frameset);          // countable at the top level: see decompose
  api.field.append(
    el('div.eq', null, String(a), el('span.op', { text: 'と' }), String(b), el('span.op', { text: 'で' }), el('span.box', { text: '?' })));
  const showFrame = () => { if (!frameset.isConnected) api.field.prepend(frameset); };
  if (pad){
    api.buildPad(ans, { correctOpts: { delay: 1200 }, onPick(){ showFrame(); } });
    api.onHint(showFrame);
  } else {
    api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 1, maxWhole + 2))), ans);
  }
}

/* ============================================================
   9. １０の おともだち — make ten
   ============================================================ */
function fillToTen(api){
  const w = wanted(api, /^fill10:(\d+)$/);
  const start = (w && w[0] >= 2 && w[0] <= 8) ? w[0] : ri(2, 8);
  api.item('fill10:' + start, start + ' から 10 まで あと ' + (10 - start));
  api.setPrompt(`わくが <b>10</b> に なるように タップして たそう`, '枠が10になるように、タップして足そう。');
  const f = el('div.tenframe', { style: { '--cols': 5 } });
  const cells = [];
  for (let i = 0; i < 10; i++){
    const cell = el('div.cell' + (i >= start ? '.tappable' : ''));
    if (i < start) cell.append(el('div.dot'));
    cells.push(cell); f.append(cell);
  }
  let count = start;
  const readout = el('div.hintline', { text: 'いま ' + count + 'こ' });
  cells.forEach((cell, i) => {
    if (i < start) return;
    cell.addEventListener('click', () => {
      if (api.locked || cell.firstChild) return;
      cell.append(el('div.dot.b'));
      count++;
      Sound.sfx.count(count - 1);
      Sound.say(numKana(count), { delay: 0, rate: 1.08 });
      readout.textContent = 'いま ' + count + 'こ';
      if (count === 10){
        api.later(() => {
          api.setPrompt(`${numTag(start)} と ${numTag(10 - start)} で <b>10</b>！`,
                        `${numKana(start)}と${numKana(10 - start)}で、10！`);
          api.correct({ quiet: true, delay: 1400 });
          UI.bigMark('◯');
        }, 300);
      }
    });
  });
  api.field.append(el('div.frameset', null, f), readout);
  api.onHint(() => { readout.textContent = 'いま ' + count + 'こ　／　あと ' + (10 - count) + 'こ'; });
}

function partnerOfTen(api, pad){
  const w = wanted(api, /^ten:(\d+)$/);
  const a = (w && w[0] >= 1 && w[0] <= 9) ? w[0] : ri(1, 9), ans = 10 - a;
  api.item('ten:' + a, a + ' と ' + ans + ' で 10');
  api.setPrompt(`${numTag(a)} と いくつで <b>10</b>？`, `${numKana(a)}といくつで、10？`);
  const f = el('div.tenframe', { style: { '--cols': 5 } });
  const cells = [];
  for (let i = 0; i < 10; i++){
    const cell = el('div.cell' + (i >= a ? '.hole' : ''));
    if (i < a) cell.append(el('div.dot'));
    cells.push(cell); f.append(cell);
  }
  /* Same reason as いくつと いくつ L3: 「2と いくつで 10？」 above two blue dots and
     eight empty cells is a counting question wearing a retrieval question's clothes.
     The equation stays — that is the question; the frame is the answer. */
  const frameset = el('div.frameset', null, f);
  if (!pad) api.field.append(frameset);
  api.field.append(
    el('div.eq', null, String(a), el('span.op', { text: 'と' }), el('span.box', { text: '?' }), el('span.op', { text: 'で' }), '10'));
  const showFrame = () => { if (!frameset.isConnected) api.field.prepend(frameset); };
  if (pad){
    api.buildPad(ans, {
      correctOpts: { delay: 1500 },
      onPick(){
        showFrame();
        for (let i = a; i < 10; i++){
          api.later(() => {
            if (!cells[i].firstChild){ cells[i].classList.remove('hole'); cells[i].append(el('div.dot.b')); Sound.sfx.place(); }
          }, (i - a) * 150 + 200);
        }
      }
    });
    api.onHint(showFrame);
  } else {
    api.buildChoices(shuffle([ans].concat(distractors(ans, 3, 1, 9))), ans);
  }
}

function pairHunt(api){
  const w = wanted(api, /^pair:(\d+)$/);
  const a = (w && w[0] >= 1 && w[0] <= 9) ? w[0] : ri(1, 9), b = 10 - a;
  const others = [];
  while (others.length < 3){
    const v = ri(1, 9);
    if (v !== a && v !== b && others.indexOf(v) < 0) others.push(v);
  }
  const cards = shuffle([a, b].concat(others));
  api.item('pair:' + Math.min(a, b), Math.min(a, b) + ' と ' + Math.max(a, b) + ' の ペア');
  api.setPrompt('たすと <b>10</b> に なる 2まいを えらぼう', '足すと10になる2枚を選ぼう。');
  const picked = [];
  const row = api.choices;
  cards.forEach(v => {
    const c = el('button.choice', { type: 'button', text: String(v) });
    c.addEventListener('click', () => {
      if (api.locked || c.classList.contains('correct')) return;
      if (picked.indexOf(c) >= 0){
        picked.splice(picked.indexOf(c), 1); c.classList.remove('picked');
        c.style.borderColor = ''; Sound.sfx.tap(); return;
      }
      picked.push(c); c.style.borderColor = 'var(--accent)'; Sound.sfx.tap();
      if (picked.length === 2){
        const sum = Number(picked[0].textContent) + Number(picked[1].textContent);
        if (sum === 10){ picked.forEach(p => p.classList.add('correct')); api.correct(); }
        else {
          picked.forEach(p => { p.classList.add('wrong'); p.style.borderColor = ''; api.later(() => p.classList.remove('wrong'), 460); });
          api.wrong();
          Sound.say(`合わせて${numKana(sum)}になったよ。`, { delay: 320 });
          picked.length = 0;
        }
      }
    });
    row.append(c);
  });
  api.field.append(el('div.hintline', { text: '1と9、2と8、3と7、4と6、5と5' }));
  api.onHint(() => {
    const one = $$('.choice', row).find(c => Number(c.textContent) === a);
    if (one) one.classList.add('glow');
  });
}

/* ============================================================
   10-11. たしざん / ひきざん — story scene then symbol
   ============================================================ */
/* Two clusters with a gap between them, so "3 and 2" stays visible as 3 and 2
   even after they have joined. A single evenly-spaced row dissolves the structure
   the question is about. */
function clusterSpots(n, cx){
  const per = Math.min(3, n);
  const rows = Math.ceil(n / per);
  const out = [];
  for (let i = 0; i < n; i++){
    const r = Math.floor(i / per), c = i % per;
    const inRow = Math.min(per, n - r * per);
    out.push([cx + (c - (inRow - 1) / 2) * 12, 48 + (r - (rows - 1) / 2) * 23]);
  }
  return out;
}

function storyScene(api, a, b, op, thing, onReady){
  const scene = el('div.scene');
  scene.append(el('div.' + (thing.e === '🐟' ? 'pond' : 'ground')));
  api.field.append(scene);
  const actors = [];
  const place = (spots, cls, hidden) => spots.forEach(p => {
    const n = el('div.actor.' + cls, { text: thing.e, style: { left: p[0] + '%', top: p[1] + '%' } });
    // offset in % of the scene, not vw: a vw offset left newcomers visible inside the frame
    if (hidden) n.style.transform = 'translate(160%,-50%)';
    scene.append(n); actors.push(n);
  });

  if (op === '+'){
    place(clusterSpots(a, 30), 'g1', false);
    place(clusterSpots(b, 72), 'g2', true);
  } else {
    const spots = clusterSpots(a, 50);
    place(spots.slice(0, a - b), 'g1', false);
    place(spots.slice(a - b), 'g2', false);
  }

  api.later(() => {
    Sound.sfx.swoosh();
    if (op === '+'){
      actors.forEach(n => { if (n.classList.contains('g2')) n.style.transform = 'translate(-50%,-50%)'; });
    } else {
      actors.forEach(n => {
        if (!n.classList.contains('g2')) return;
        n.classList.add('leaving');
        n.style.transform = 'translate(160%,-160%)';
      });
    }
    api.later(onReady, 900);
  }, 950);
}

/** a ＋ b with each number tinted like its group in the picture */
function eqNode(a, b, op){
  return el('div.eq', null,
    el('span.n1', { text: String(a) }),
    el('span.op', { text: op === '+' ? '＋' : '−' }),
    el('span.n2', { text: String(b) }),
    el('span.op', { text: '＝' }),
    el('span.box', { text: '?' }));
}

function addStory(api, max){
  const w = wanted(api, /^sum:(\d+)\+(\d+)$/);
  const aim = w && w[0] >= 1 && w[1] >= 1 && w[0] + w[1] <= max;
  const a = aim ? w[0] : ri(1, max - 1);
  const b = aim ? w[1] : ri(1, max - a), ans = a + b;
  const thing = pick(THINGS);
  api.item('sum:' + a + '+' + b, a + ' ＋ ' + b);
  api.setPrompt(`${thing.e} が ${numTag(a)}つ。${numTag(b)}つ やってきたよ`,
                `${thing.n}が${tsuKana(a)}。${tsuKana(b)}、やってきたよ。`);
  storyScene(api, a, b, '+', thing, () => {
    api.setPrompt('ぜんぶで いくつ？', '全部でいくつ？');
    api.field.append(eqNode(a, b, '+'));
    api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 1, max + 2, 2))), ans);
  });
}

function subStory(api, max){
  const w = wanted(api, /^rest:(\d+)-(\d+)$/);
  const aim = w && w[0] >= 2 && w[0] <= max && w[1] >= 1 && w[1] < w[0];
  const a = aim ? w[0] : ri(2, max);
  const b = aim ? w[1] : ri(1, a - 1), ans = a - b;
  const thing = pick(THINGS);
  api.item('rest:' + a + '-' + b, a + ' − ' + b);
  api.setPrompt(`${thing.e} が ${numTag(a)}つ。${numTag(b)}つ いなくなるよ`,
                `${thing.n}が${tsuKana(a)}。${tsuKana(b)}、いなくなるよ。`);
  storyScene(api, a, b, '-', thing, () => {
    api.setPrompt('のこりは いくつ？', '残りは、いくつ？');
    api.field.append(eqNode(a, b, '-'));
    api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 0, max, 2))), ans);
  });
}

function symbolCalc(api, op, max, pad){
  let a, b, ans;
  const w = wanted(api, op === '+' ? /^sum:(\d+)\+(\d+)$/ : /^rest:(\d+)-(\d+)$/);
  const aim = op === '+'
    ? (w && w[0] >= 1 && w[1] >= 1 && w[0] + w[1] <= max)
    : (w && w[0] >= 2 && w[0] <= max && w[1] >= 1 && w[1] <= w[0]);
  if (aim){ a = w[0]; b = w[1]; ans = op === '+' ? a + b : a - b; }
  else if (op === '+'){ a = ri(1, max - 1); b = ri(1, max - a); ans = a + b; }
  else { a = ri(2, max); b = ri(1, a); ans = a - b; }
  api.item((op === '+' ? 'sum:' + a + '+' + b : 'rest:' + a + '-' + b),
    a + (op === '+' ? ' ＋ ' : ' − ') + b);
  api.setPrompt('しきを みて こたえよう',
    `${numKana(a)}、${op === '+' ? 'たす' : 'ひく'}、${numKana(b)}は？`);
  api.field.append(eqNode(a, b, op));
  if (pad) api.buildPad(ans);
  else api.buildChoices(shuffle([ans].concat(distractors(ans, 3, 0, max + 2, 2))), ans);
  api.onHint(() => {
    if ($('.tenframe', api.field)) return;
    const f = el('div.tenframe', { style: { '--cols': 5 } });
    for (let i = 0; i < 10; i++){
      const cell = el('div.cell');
      if (op === '+'){ if (i < a) cell.append(el('div.dot')); else if (i < a + b) cell.append(el('div.dot.b')); }
      else { if (i < a - b) cell.append(el('div.dot')); else if (i < a) cell.append(el('div.dot.b')); }
      f.append(cell);
    }
    api.field.append(el('div.frameset', null, f),
      el('div.hintline', { text: op === '+' ? 'あおと あかを あわせて かぞえよう' : 'あかは いなくなった ぶん。あおを かぞえよう' }));
  });
}

function differenceQ(api, max, pad){
  const w = wanted(api, /^diff:(\d+)-(\d+)$/);
  const aim = w && w[0] >= 3 && w[0] <= max && w[1] >= 1 && w[1] < w[0];
  const a = aim ? w[0] : ri(3, max);
  const b = aim ? w[1] : ri(1, a - 1), ans = a - b;
  const t1 = pick(THINGS); let t2 = pick(THINGS);
  while (t2.e === t1.e) t2 = pick(THINGS);
  api.item('diff:' + a + '-' + b, a + ' と ' + b + ' の ちがい');
  api.setPrompt(`どちらが <b>いくつ</b> おおい？`, 'どちらが、いくつ多い？');
  const board = el('div.measure');
  [[t1, a], [t2, b]].forEach(([t, n]) => {
    const row = el('div.mrow', { style: { cursor: 'default' } }, el('div.cap', { text: t.e }));
    const g = el('div.row', { style: { gap: 'calc(var(--u)*.25)' } });
    for (let i = 0; i < n; i++) g.append(el('span.item', { text: t.e, style: { fontSize: 'calc(var(--u)*2.4)' } }));
    row.append(g);
    board.append(row);
  });
  api.field.append(board, eqNode(a, b, '-'));
  if (pad) api.buildPad(ans);
  else api.buildChoices(shuffle([ans].concat(distractors(ans, 2, 0, max, 2))), ans);
  api.onHint(() => {
    if ($('.hintline', api.field)) return;
    api.field.append(el('div.hintline', { text: 'うえと したを 1つずつ ペアに して、あまりを かぞえよう' }));
  });
}
