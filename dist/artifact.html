});

/* ============================================================
   14. きまり さがし — patterns
   ============================================================ */
const PAT_TOKENS = ['🔴','🔵','🟡','🟢','🟣','🟠','⭐️','🌙','🍎','🍌','🐰','🐻'];
const TOKEN_NAME = { '🔴': 'あか', '🔵': 'あお', '🟡': 'きいろ', '🟢': 'みどり', '🟣': 'むらさき', '🟠': 'オレンジ',
                     '⭐️': 'ほし', '🌙': 'つき', '🍎': 'りんご', '🍌': 'バナナ', '🐰': 'うさぎ', '🐻': 'くま' };

function patternQuestion(api, unitKind, blanks){
  const kinds = { AB: [0, 1], AAB: [0, 0, 1], ABB: [0, 1, 1], ABC: [0, 1, 2], ABBA: [0, 1, 1, 0] };
  const unit = kinds[unitKind];
  const need = Math.max.apply(null, unit) + 1;
  const toks = sample(PAT_TOKENS, need);
  const seq = [];
  const wanted = Math.min(10, unit.length * 3 + ri(0, unit.length - 1));   // must stay on one line
  while (seq.length < wanted) seq.push(toks[unit[seq.length % unit.length]]);
  const total = seq.length;
  const holes = [];
  for (let i = 0; i < blanks; i++) holes.push(total - 1 - i);
  holes.sort((a, b) => a - b);
  api.item('pat:' + unitKind + ':' + blanks, unitKind + ' の くりかえし');
  api.setPrompt('つづきは どれ？ きまりを みつけよう', '続きは、どれ？きまりを見つけよう。');
  const train = el('div.train');
  const cars = seq.map((t, i) => {
    const isHole = holes.indexOf(i) >= 0;
    const c = el('div.car' + (isHole ? '.blank' : ''), { text: isHole ? '' : t });
    train.append(c);
    return c;
  });
  api.field.append(train);

  let hi = 0;
  function askHole(){
    if (hi >= holes.length) return;
    const at = holes[hi];
    cars.forEach(c => c.classList.remove('now'));
    cars[at].classList.add('blank', 'now');
    const ans = seq[at];
    const opts = shuffle(toks.concat(sample(PAT_TOKENS.filter(t => toks.indexOf(t) < 0), Math.max(0, 3 - need))));
    api.buildChoices(opts.slice(0, Math.max(3, need)), ans, {
      cls: 'pic',
      render: v => el('span', { text: v, style: { fontSize: 'calc(var(--u)*3.2)' } }),
      onPick(){
        cars[at].textContent = ans;
        cars[at].classList.remove('blank', 'now');
        cars[at].classList.add('filled');
        Sound.sfx.place();
        hi++;
        if (hi < holes.length){ api.later(askHole, 560); return false; }
        return true;
      }
    });
  }
  askHole();
  api.coach({
    text: unit.length + 'つずつ おなじ ならびが くりかえして いるよ',
    say: `${tsuKana(unit.length)}ずつ、同じ並びが、繰り返しているよ。`,
    tool(){ cars.forEach((c, i) => { if (Math.floor(i / unit.length) % 2 === 0) c.classList.add('unitmark'); }); },
    // the hand reads the train aloud in its rhythm and stops at the gap
    walk(){
      const at = holes[hi];
      const steps = [];
      for (let i = 0; i < at; i++) steps.push({ at: cars[i], say: TOKEN_NAME[seq[i]] || '', ms: 560 });
      steps.push({ at: cars[at], say: 'つぎは？', ms: 1500 });
      return steps;
    }
  });
}

/** Let the child author the repeating unit, then show the rule they created. */
function createPattern(api){
  const opts = sample(PAT_TOKENS, 5), chosen = [];
  api.item('create:AB', 'じぶんで 2つの くりかえしを つくる');
  api.setPrompt('すきな 2つを えらんで、きまりを つくろう',
                '好きな二つを選んで、きまりを作ろう。');
  const train = el('div.train');
  for (let i = 0; i < 8; i++) train.append(el('div.car.empty'));
  api.field.append(train);
  opts.forEach(v => {
    const b = el('button.choice.pic', { type: 'button', text: v });
    b.addEventListener('click', () => {
      if (api.locked) return;
      if (chosen.indexOf(v) >= 0) return;     // a child's double tap is one choice
      chosen.push(v);
      const cars = $$('.car', train);
      cars.forEach((c, i) => {
        if (i >= chosen.length && chosen.length < 2) return;
        c.classList.remove('empty');
        c.textContent = chosen[i % chosen.length];
      });
      b.classList.add('picked');
      if (chosen.length === 2){
        $$('.choice.picked', api.choices).forEach(x => x.classList.add('correct'));
        api.setPrompt('できた きまりを こえに だして いってみよう',
                      'できた決まりを、声に出して言ってみよう。');
        api.later(() => api.correct({ quiet: true, delay: 1300 }), 500);
      }
    });
    api.choices.append(b);
  });
  api.coach({
    text: () => chosen.length ? chosen[0] + ' の つぎに くるものを えらぼう' : 'すきな えを 2つ えらぼう',
    say: () => chosen.length ? '次に来るものを、選ぼう。' : '好きな絵を、二つ選ぼう。',
    tool(){ Coach.pulse($$('.choice:not(.picked)', api.choices)); },
    walk(){ return $$('.choice:not(.picked)', api.choices).slice(0, 2).map(b => ({ at: b, ms: 900 })); }
  });
  api.onShow(() => {
    $$('.choice:not(.picked)', api.choices).slice(0, 2 - chosen.length).forEach(b => b.click());
  });
}

/* ============================================================
   15. とけい — reading the clock
   ============================================================ */
/* Only times that mean one thing to a five-year-old regardless of am/pm. */
const HOUR_SCENES = { 7: '🌅 あさごはん', 12: '🍛 おひるごはん', 3: '🧃 おやつ' };

function readClock(api, half){
  const h = ri(1, 12);
  const m = half && chance(.5) ? 30 : 0;
  api.item('read:' + h + ':' + m, h + 'じ' + (m === 30 ? 'はん' : '') + ' を よむ');
  api.setPrompt('なんじ かな？', '何時かな？');
  const c = clockSVG(h, m);
  c.style.width = 'calc(var(--u)*22)';
  c.style.height = 'calc(var(--u)*22)';
  api.field.append(c);
  if (m === 0 && HOUR_SCENES[h]) api.field.append(el('div.hintline', { text: HOUR_SCENES[h] }));
  const ans = h + ':' + m;
  const opts = new Set([ans]);
  let guard = 0;
  while (opts.size < 4 && guard++ < 60){
    const hh = ri(1, 12), mm = half ? pick([0, 30]) : 0;
    opts.add(hh + ':' + mm);
  }
  api.buildChoices(shuffle(Array.from(opts)), ans, {
    render: v => {
      const [hh, mm] = v.split(':');
      return hh + 'じ' + (mm === '30' ? 'はん' : '');
    }
  });
  const handH = $('.hand-h', c), handM = $('.hand-m', c);
  const numEl = v => $$('text', c).find(t => t.textContent === String(v));
  api.coach({
    text: m === 30 ? 'ながい はりが 6 なら「はん」。みじかい はりを みてね' : 'みじかい はりが さす すうじを よもう',
    say: m === 30 ? '長い針が6なら、はん。短い針を、よく見てね。' : '短い針が指している数字を、読もう。',
    tool(){ Coach.pulse(m === 30 ? [handH, handM] : handH); },
    walk(){
      const next = h % 12 + 1;
      if (m === 30) return [
        { at: numEl(6), act(){ numEl(6).classList.add('goal'); }, say: '長い針が6。だから、はん。', ms: 2300 },
        { at: numEl(h), act(){ numEl(h).classList.add('goal'); numEl(next).classList.add('goal'); },
          say: `短い針は、${numKana(h)}と${numKana(next)}の間。`, ms: 2500 },
        { at: numEl(h), say: `過ぎたほうを読んで、${jiKana(h, true)}。`, ms: 2300 }];
      return [{ at: handH, act(){ Coach.pulse(handH); }, say: '短い針は…', ms: 1300 },
              { at: numEl(h), act(){ numEl(h).classList.add('goal'); }, say: `${numKana(h)}を指しているね。`, ms: 2100 }];
    }
  });
}

function pickClock(api, half){
  const h = ri(1, 12), m = half && chance(.5) ? 30 : 0;
  api.item('pick:' + h + ':' + m, h + 'じ' + (m === 30 ? 'はん' : '') + ' の とけいを えらぶ');
  api.setPrompt(`<b>${h}じ${m === 30 ? 'はん' : ''}</b> の とけいは どれ？`,
                `${jiKana(h, m === 30)}の時計は、どれ？`);
  const opts = [{ h, m }];
  let guard = 0;
  while (opts.length < 3 && guard++ < 60){
    const hh = ri(1, 12), mm = half ? pick([0, 30]) : 0;
    if (!opts.some(o => o.h === hh && o.m === mm)) opts.push({ h: hh, m: mm });
  }
  clear(api.choices);
  // the number the LONG hand points at, which is the one a five-year-old reads first
  const longHand = m === 30 ? 6 : 12;
  shuffle(opts).forEach(o => {
    const wrap = el('div.clock-choice', null, clockSVG(o.h, o.m, { numerals: true }));
    wrap.dataset.t = o.h + ':' + o.m;
    tappable(wrap, () => {
      if (api.locked) return;
      if (o.h === h && o.m === m){ wrap.classList.add('correct'); api.correct(); }
      else {
        wrap.classList.add('wrong');
        api.later(() => wrap.classList.remove('wrong'), 460);
        api.wrong(wrap, (o.h === longHand && o.h !== h) ? 'hand' : null);
      }
    });
    api.choices.append(wrap);
  });
  const next = h % 12 + 1;
  api.coach({
    text: m === 30 ? `ながい はりが 6、みじかい はりが ${h}と ${next}の あいだ` : `みじかい はりが ${h}を さす とけい`,
    say: m === 30 ? `長い針が6で、短い針が、${numKana(h)}と${numKana(next)}の間の時計。`
                  : `短い針が、${numKana(h)}を指している時計。`,
    tool(){ Coach.pulse($$('.clock-choice .hand-h', api.choices)); },
    walk(){
      return $$('.clock-choice', api.choices).map(w => {
        const [hh, mm] = w.dataset.t.split(':').map(Number);
        return { at: w, say: `これは、${jiKana(hh, mm === 30)}。`, ms: 1800 };
      });
    }
  });
  api.onShow(() => {
    const w = $$('.clock-choice', api.choices).find(x => x.dataset.t === h + ':' + m);
    if (w) w.click();
  });
}

function setClock(api, hand){
  const minuteMode = hand === 'minute';
  const targetHour = ri(1, 12), target = minuteMode ? 30 : targetHour;
  api.item(minuteMode ? 'sethalf:' + targetHour : 'set:' + targetHour,
    minuteMode ? targetHour + 'じはん に ながいはりを あわせる' : targetHour + 'じ に みじかいはりを あわせる');
  api.setPrompt(minuteMode
      ? `<b>${targetHour}じはん</b> に なるように ながい はりを うごかそう`
      : `<b>${targetHour}じ</b> に なるように みじかい はりを うごかそう`,
    minuteMode
      ? `${jiKana(targetHour, true)}になるように、長い針を動かそう。`
      : `${jiKana(targetHour)}になるように、短い針を動かそう。`);
  let cur = minuteMode ? pick([0, 5, 10, 15, 20, 40, 45, 50, 55]) : ri(1, 12);
  for (let g = 0; g < 100 && cur === target; g++)
    cur = minuteMode ? pick([0, 5, 10, 15, 20, 40, 45, 50, 55]) : ri(1, 12);
  if (cur === target) cur = minuteMode ? 0 : (targetHour === 12 ? 1 : targetHour + 1);
  const holder = el('div', {
    style: { touchAction: 'none' }, role: 'group',
    'aria-label': minuteMode ? 'ながい はりを うごかす とけい' : 'みじかい はりを うごかす とけい'
  });
  api.field.append(holder);
  const readout = el('div.clock-readout', { role: 'status', 'aria-live': 'polite', 'aria-atomic': 'true' });
  api.field.append(readout);

  const clock = clockSVG(minuteMode ? targetHour : cur, minuteMode ? cur : 0, { cls: 'pickable' });
  clock.style.width = 'calc(var(--u)*26)';
  clock.style.height = 'calc(var(--u)*26)';
  holder.append(clock);
  const hourHand = $('.hand-h', clock);
  const minuteHand = $('.hand-m', clock);

  function paint(){
    if (minuteMode){
      const ma = (cur / 60) * Math.PI * 2 - Math.PI / 2;
      /* The short hand moves continuously as the long hand moves. */
      const ha = (((targetHour % 12) + cur / 60) / 12) * Math.PI * 2 - Math.PI / 2;
      minuteHand.setAttribute('x2', (50 + Math.cos(ma) * 33).toFixed(2));
      minuteHand.setAttribute('y2', (50 + Math.sin(ma) * 33).toFixed(2));
      hourHand.setAttribute('x2', (50 + Math.cos(ha) * 21).toFixed(2));
      hourHand.setAttribute('y2', (50 + Math.sin(ha) * 21).toFixed(2));
      readout.textContent = cur === 30 ? targetHour + 'じはん' : 'ながい はりは ' + cur + 'ふん';
      holder.setAttribute('aria-label', readout.textContent + '。ながい はりを うごかす とけい');
    } else {
      // rebuilding the SVG would destroy the node that received pointerdown
      const a = ((cur % 12) / 12) * Math.PI * 2 - Math.PI / 2;
      hourHand.setAttribute('x2', (50 + Math.cos(a) * 21).toFixed(2));
      hourHand.setAttribute('y2', (50 + Math.sin(a) * 21).toFixed(2));
      readout.textContent = 'いま ' + cur + 'じ';
      holder.setAttribute('aria-label', readout.textContent + '。みじかい はりを うごかす とけい');
    }
  }

  let down = false;
  function setFrom(e){
    const r = clock.getBoundingClientRect();
    if (!r.width) return;
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    let ang = Math.atan2(dy, dx) + Math.PI / 2;
    if (ang < 0) ang += Math.PI * 2;
    let v;
    if (minuteMode){
      v = Math.round(ang / (Math.PI * 2) * 12) * 5;
      if (v === 60) v = 0;
    } else {
      v = Math.round(ang / (Math.PI * 2) * 12);
      if (v === 0) v = 12;
    }
    if (v !== cur){ cur = v; Sound.sfx.tap(); paint(); }
  }
  clock.addEventListener('pointerdown', e => {
    if (api.locked) return;
    down = true;
    e.preventDefault();
    try{ if (clock.setPointerCapture) clock.setPointerCapture(e.pointerId); }catch(err){}
    setFrom(e);
  });
  clock.addEventListener('pointermove', e => { if (down && !api.locked){ e.preventDefault(); setFrom(e); } });
  const release = () => { down = false; };
  clock.addEventListener('pointerup', release);
  clock.addEventListener('pointercancel', release);
  paint();

  const check = el('button.btn.btn-accent', { text: 'これで いい？',
    onclick(){
      if (api.locked) return;
      if (cur === target) api.correct(); else { api.wrong(check); }
    } });
  api.onShow(() => { cur = target; paint(); api.later(() => api.correct(), 500); });
  const controls = minuteMode
    ? [
        el('button.btn.clock-adjust', {
          type: 'button', text: 'ながい はりを 12に',
          onclick(){ if (!api.locked){ cur = 0; Sound.sfx.tap(); paint(); } }
        }),
        el('button.btn.clock-adjust', {
          type: 'button', text: 'ながい はりを 6に',
          onclick(){ if (!api.locked){ cur = 30; Sound.sfx.tap(); paint(); } }
        })
      ]
    : [
        el('button.btn.clock-adjust', {
          type: 'button', text: '1じ もどす',
          onclick(){ if (!api.locked){ cur = cur === 1 ? 12 : cur - 1; Sound.sfx.tap(); paint(); } }
        }),
        el('button.btn.clock-adjust', {
          type: 'button', text: '1じ すすめる',
          onclick(){ if (!api.locked){ cur = cur === 12 ? 1 : cur + 1; Sound.sfx.tap(); paint(); } }
        })
      ];
  api.choices.append(...controls, check);
  api.coach({
    text: minuteMode ? '「はん」の とき、ながい はりは 6を さすよ' : 'みじかい はりが ' + targetHour + ' を さすように まわそう',
    say: minuteMode ? 'はん、の時、長い針は6を指すよ。' : `短い針が、${numKana(targetHour)}を指すように、回そう。`,
    tool(){
      $$('text', clock).forEach(t => {
        if (t.textContent === String(minuteMode ? 6 : targetHour)) t.classList.add('goal');
      });
    },
    // the hand turns the hand, one number at a time, and leaves「これで いい？」to the child
    walk(){
      const goal = target, steps = [];
      let v = cur;
      for (let g = 0; g < 13 && v !== goal; g++){
        v = minuteMode ? (v + 5) % 60 : v % 12 + 1;
        const vv = v;
        steps.push({ at: minuteMode ? minuteHand : hourHand, act(){ cur = vv; Sound.sfx.tap(); paint(); }, ms: 380 });
      }
      steps.push({ at: check, say: 'できたら、これでいい、を押そう。', ms: 1900 });
      return steps;
    }
  });
}

Games.add({

});

/* ---- 14-g-ichinen.js ---- */
/* ===========================================================
   14 — WORLD 5「1ねんせいの きょうしつ」 小学1年生・はじめの単元
   ===========================================================
   This world is shut until every 入学前 level has been cleared (see `Progress` in 05).

   What goes in it is not "next year's arithmetic brought forward". The first
   weeks of 小学1年生 go back over ground the child has already walked on — and
   ask for the part the 入学前 games never asked for:

   *「同じものの集まり」*  かぞえよう asks how many are there; a 1年生 is asked to
   *make the group first* —「くだものを ぜんぶ」— and only then to count it. The
   number is a property of a set someone decided on, not of whatever happens to be
   on the table. なかまわけ sorts things into given boxes; here the child chooses
   the rule and gathers to it.

   *「1対1対応」*  どっちが おおい is answered by counting both sides. A 1年生 is
   asked to pair them off instead: put one against one, and read the answer off
   what is left over. That is the same operation as 求差 (「いくつ おおい」) and it
   is where ひきざん's second meaning comes from, so it is worth doing with the
   fingers before it is done with a number.

   The other two games are where those two ideas are heading: 20までの かず
   (10 のまとまりと ばら) and しき (putting a story into ＋ and −, and reading a
   ＋ or − back out as a story).
   =========================================================== */
'use strict';

/* ============================================================
   17. なかまづくり — sets: a group made on purpose, then counted
   ============================================================ */

/** Two kinds of thing scattered together. Tap every one of the named kind — and
    only then say how many there were. Counting comes second here on purpose:
    the group has to exist before it has a number. */
function collectSame(api){
  const [kA, kB] = sample(Object.keys(CATS), 2);
  const target = CATS[kA], other = CATS[kB];
  const n = ri(3, 6), m = ri(2, 5);
  api.item('same:' + kA + ':' + n, target.lbl + ' の なかま ' + n + 'こ');
  api.setPrompt(`<b>${target.lbl}</b> の なかまを ぜんぶ タップしよう`,
                `${target.lbl}の仲間を、全部タップしよう。`);

  const items = shuffle(
    sample(target.items, n).map(e => ({ e, hit: true }))
      .concat(sample(other.items, m).map(e => ({ e, hit: false }))));
  const field = el('div.objfield');
  const pts = scatter(items.length);
  const objs = [];
  items.forEach((it, i) => {
    const o = el('div.obj', { style: { left: (pts[i][0] * 100) + '%', top: (pts[i][1] * 100) + '%' } }, it.e);
    o.dataset.hit = it.hit ? '1' : '0';
    objs.push(o);
    field.append(o);
  });
  api.field.append(field);

  let done = 0;
  objs.forEach(o => tappable(o, () => {
    if (api.locked || o.classList.contains('counted')) return;
    if (o.dataset.hit !== '1'){
      o.classList.add('notmine');
      api.later(() => o.classList.remove('notmine'), 460);
      api.wrong(o);
      Sound.say(`それは${target.lbl}の仲間じゃないね。`, { delay: 260 });
      return;
    }
    done++;
    o.classList.add('counted');
    o.append(el('span.tag', { text: String(done) }));
    Sound.sfx.count(done - 1);
    Sound.say(numKana(done), { delay: 0, rate: 1.08 });
    if (done === n) api.later(ask, 640);
  }));

  function ask(){
    api.setPrompt(`あつめた <b>${target.lbl}</b> は ぜんぶで いくつ？`,
                  `集めた${target.lbl}は、全部でいくつ？`);
    api.buildChoices(shuffle([n].concat(distractors(n, 2, 1, n + 3))), n);
    const counted = objs.filter(o => o.classList.contains('counted'))
      .sort((p, q) => Number(($('.tag', p) || {}).textContent) - Number(($('.tag', q) || {}).textContent));
    api.coach({
      text: 'あつめた かずを もういちど みよう',
      say: '集めた数を、もう一度見よう。',
      tool(){ Coach.pulse(counted); },
      walk(){ return counted.map((o, i) => ({ at: o, say: numKana(i + 1), ms: 620 })); }
    });
  }

  const remaining = () => objs.filter(o => o.dataset.hit === '1' && !o.classList.contains('counted'));
  api.coach({
    text: target.lbl + 'は ' + target.items.slice(0, 4).join(' ') + ' の なかま',
    say: `${target.lbl}の仲間を、探そう。`,
    tool(){ const left = remaining()[0]; if (left) left.classList.add('glow'); },
    // the hand gathers them: showing the rule is putting it to use
    walk(){ return remaining().map(o => ({ at: o, act(){ o.click(); }, ms: 800 })); }
  });
}

/** The same things laid out one kind per row, ends lined up. This is the picture
    graph 1年生 build in「せいり」: once each group is a row, どれが おおい is read
    off the length instead of counted twice. */
function groupChart(api){
  const keys = sample(Object.keys(CATS), api.check ? 3 : ri(2, 3));
  const counts = [];
  keys.forEach(() => {
    let v = ri(2, 7), guard = 0;
    while (counts.indexOf(v) >= 0 && guard++ < 60) v = ri(2, 7);
    counts.push(v);
  });
  const rows = keys.map((k, i) => ({ k, cat: CATS[k], n: counts[i], items: sample(CATS[k].items, counts[i]) }));
  const board = el('div.measure.chartboard');
  const asCount = chance(.45);
  const most = chance(.6);
  const target = asCount ? pick(rows) : null;
  const wantN = asCount ? target.n
    : (most ? Math.max.apply(null, counts) : Math.min.apply(null, counts));

  /* The row's label is a word, not another one of the things in the row. It used to
     be the category's emoji at the same size as the items, so「くだものの なかまは
     いくつ？」sat over seven fruit with 6 as the right answer — and the number the
     child counted was not even on the buttons. A picture graph labels its rows;
     it does not put a spare apple at the head of the apple row. */
  rows.forEach(r => {
    const row = el('div.mrow', { style: { cursor: asCount ? 'default' : 'pointer' } },
      el('div.cap.caplbl', { text: r.cat.lbl }));
    const g = el('div.row', { style: { gap: 'calc(var(--u)*.3)', justifyContent: 'flex-start' } });
    r.items.forEach(e => g.append(el('span.item', { text: e, style: { fontSize: 'calc(var(--u)*2.4)' } })));
    row.append(g);
    row.dataset.n = r.n;
    if (!asCount){
      api.onShow(() => {
        const t = $$('.mrow', board).find(x => Number(x.dataset.n) === wantN);
        if (t) t.click();
      });
      tappable(row, () => {
        if (api.locked) return;
        if (r.n === wantN){ row.classList.add('correct'); api.correct(); }
        else {
          row.classList.add('wrong');
          api.later(() => row.classList.remove('wrong'), 460);
          api.wrong(row);
        }
      });
    }
    board.append(row);
    r.el = row;
  });
  api.field.append(board);

  if (asCount){
    api.item('chart:' + target.k + ':' + target.n, target.cat.lbl + ' は ' + target.n + 'こ');
    api.setPrompt(`${target.cat.e} <b>${target.cat.lbl}</b> の なかまは いくつ？`,
                  `${target.cat.lbl}の仲間は、いくつ？`);
    api.buildChoices(shuffle([wantN].concat(distractors(wantN, 2, 1, 9))), wantN);
  } else {
    api.item('chartcmp:' + counts.slice().sort((a, b) => a - b).join('_') + ':' + (most ? 'g' : 'l'),
      counts.slice().sort((a, b) => a - b).join('と') + ' の ' + (most ? 'おおい' : 'すくない') + ' ほう');
    api.setPrompt(most ? 'いちばん <b>おおい</b> なかまは どれ？' : 'いちばん <b>すくない</b> なかまは どれ？',
                  most ? '一番多い仲間は、どれ？' : '一番少ない仲間は、どれ？');
  }
  /* Putting each row's count at its end answered both kinds of question. Counting
     one row is the child's to do; comparing is done by the rows' ends. */
  if (asCount){
    const cnt = Coach.once(() => Coach.countable(api, $$('.item', target.el)));
    api.coach({
      text: `${target.cat.lbl}の れつを かぞえよう`,
      say: `${target.cat.lbl}の列を、数えよう。`,
      tool(){ cnt(); },
      walk(){ return cnt().steps(); }
    });
  } else {
    const ends = () => rows.map(r => $$('.item', r.el).pop());
    api.coach({
      text: 'はしを そろえて ながさを くらべよう',
      say: '端をそろえて、長さを比べよう。',
      tool(){ Coach.pulse(ends()); },
      walk(){
        return rows.map(r => ({ at: $$('.item', r.el).pop(), act(){ if (!$('.ordno', r.el)) r.el.append(el('span.ordno', { text: String(r.n) })); },
                                say: koKana(r.n), ms: 1300 }));
      }
    });
  }
}

/** Five things, four of one kind. Naming the one that does not belong means
    holding the rule in mind, which is the other half of making a group. */
function oddOneOut(api){
  const [kA, kB] = sample(Object.keys(CATS), 2);
  const four = sample(CATS[kA].items, 4);
  const odd = pick(CATS[kB].items);
  api.item('odd:' + kA + '_' + kB, CATS[kA].lbl + ' の なかに ' + CATS[kB].lbl);
  api.setPrompt('なかまはずれは どれ？', '仲間はずれは、どれ？');
  api.field.append(el('div.hintline', { text: 'ほかの 4つと ちがう なかまを さがそう' }));
  api.buildChoices(shuffle(four.concat([odd])), odd);
  const btnOf = e => $$('.choice', api.choices).find(b => b.textContent === e);
  api.coach({
    text: '4つは ' + CATS[kA].lbl + ' の なかまだよ',
    say: `四つは、${CATS[kA].lbl}の仲間だよ。`,
    tool(){ Coach.pulse($('.hintline', api.field)); },
    walk(){
      return four.map(e => ({ at: btnOf(e), say: CATS[kA].lbl, ms: 800 }))
        .concat([{ at: btnOf(odd), say: `これは、${CATS[kB].lbl}。`, ms: 1900 }]);
    }
  });
}

/** No single right answer: the child picks the rule first, then gathers to it.
    Both rules on the table are true of the same pile, so the app cannot be
    "guessed" — it can only be answered by holding one rule and applying it. */
function ownGroup(api){
  const keys = sample(Object.keys(CATS), 3);
  const per = 3;
  api.item('own:' + keys.slice().sort().join('_'), 'じぶんで きめて あつめる');
  api.setPrompt('あつめる なかまを じぶんで えらぼう', '集める仲間を、自分で選ぼう。');

  const picks = [];
  keys.forEach(k => sample(CATS[k].items, per).forEach(e => picks.push({ e, k })));
  const field = el('div.objfield');
  const pts = scatter(picks.length);
  const objs = [];
  shuffle(picks).forEach((p, i) => {
    const o = el('div.obj', { style: { left: (pts[i][0] * 100) + '%', top: (pts[i][1] * 100) + '%' } }, p.e);
    o.dataset.cat = p.k;
    objs.push(o);
    field.append(o);
  });
  api.field.append(field);

  let chosen = null, done = 0;
  keys.forEach(k => {
    const b = el('button.choice.pic', { type: 'button', text: CATS[k].lbl });
    b.addEventListener('click', () => {
      if (api.locked || chosen) return;
      chosen = k;
      Sound.sfx.tap();
      clear(api.choices);
      const cat = CATS[k];
      api.setPrompt(`<b>${cat.lbl}</b> を ぜんぶ あつめよう`, `${cat.lbl}を、全部集めよう。`);
      objs.forEach(o => tappable(o, () => tap(o)));
    });
    api.choices.append(b);
  });

  function tap(o){
    if (api.locked || o.classList.contains('counted')) return;
    if (o.dataset.cat !== chosen){
      o.classList.add('notmine');
      api.later(() => o.classList.remove('notmine'), 460);
      api.wrong(o);
      Sound.say(`それは${CATS[chosen].lbl}の仲間じゃないね。`, { delay: 260 });
      return;
    }
    done++;
    o.classList.add('counted');
    o.append(el('span.tag', { text: String(done) }));
    Sound.sfx.count(done - 1);
    Sound.say(numKana(done), { delay: 0, rate: 1.08 });
    if (done === per){
      api.later(() => {
        api.setPrompt(`${CATS[chosen].lbl} の なかまが <b>${per}</b>こ あつまったね！`,
                      `${CATS[chosen].lbl}の仲間が、${koKana(per)}集まったね。`);
        api.correct({ quiet: true, delay: 1200 });
        UI.bigMark('◯');
      }, 320);
    }
  }

  const left = () => objs.filter(o => o.dataset.cat === chosen && !o.classList.contains('counted'));
  api.coach({
    text: () => chosen ? CATS[chosen].lbl + 'は ' + CATS[chosen].items.slice(0, 4).join(' ') : 'どれでも いいよ。ひとつ えらんでね',
    say: () => chosen ? `${CATS[chosen].lbl}の仲間を、探そう。` : 'どれでもいいよ。一つ選んでね。',
    tool(){ if (chosen){ const o = left()[0]; if (o) o.classList.add('glow'); } },
    walk(){ return chosen ? left().map(o => ({ at: o, act(){ o.click(); }, ms: 800 })) : []; }
  });
  api.onShow(() => {
    if (!chosen){ const b = $('.choice', api.choices); if (b) b.click(); }
    left().forEach(o => o.click());
  });

/* ============================================================
   18. 1たい1で くらべる — one-to-one correspondence
   ============================================================ */
/* Two rows, and a pair is made by touching one from each. The pair takes a number
   on both halves, so the correspondence stays visible after the tap — this is the
   線でむすぶ of the textbook, done with a finger.

   Pairing is never wrong. Any top with any bottom is a legitimate pair, so there
   is nothing to guess at here: the question only starts once the pairing runs out
   and the child can see what is left over. */
function pairUp(api, na, nb, onSettled, opts){
  const t1 = pick(THINGS);
  let t2 = pick(THINGS);
  for (let g = 0; g < 40 && t2.e === t1.e; g++) t2 = pick(THINGS);

  /* One column per pair position, the same width in both rows, and no wrapping.
     Centred wrapping rows made this game unreadable: seven stars under five fish
     came out as five-and-two on a second line, and unequal rows that did fit were
     centred against each other, so no pair stood above its partner. The leftover
     — which is the answer to every question here — has to be the bit sticking out
     at the right-hand end. */
  const board = el('div.pairboard', {
    style: { '--pn': String(Math.max(na, nb) + ((opts && opts.extra) || 0)) } });
  const rowA = el('div.pairrow'), rowB = el('div.pairrow');
  const made = { a: t1, b: t2, na, nb, pairs: 0, rowA, rowB, board };
  let marked = null, settled = false;

  function itemsOf(row){ return $$('.pairitem', row); }

  function settle(){
    settled = true;
    [rowA, rowB].forEach(r => itemsOf(r).forEach(x => {
      if (!x.classList.contains('paired')) x.classList.add('leftover');
    }));
    if (marked){ marked.classList.remove('marked'); marked = null; }
    onSettled(made);
  }

  function tap(it){
    // once the pairing has run out the board is the answer, not an input: a tap on
    // a leftover must not put a selection ring round it while the question is being read
    if (api.locked || settled || it.classList.contains('paired')) return;
    if (!marked || marked.dataset.side === it.dataset.side){
      if (marked) marked.classList.remove('marked');
      marked = it;
      it.classList.add('marked');
      Sound.sfx.tap();
      return;
    }
    made.pairs++;
    [marked, it].forEach(x => {
      x.classList.remove('marked');
      x.classList.add('paired');
      x.append(el('span.tag', { text: String(made.pairs) }));
    });
    marked = null;
    Sound.sfx.count(made.pairs - 1);
    Sound.say(numKana(made.pairs), { delay: 0, rate: 1.08 });
    if (made.pairs === Math.min(na, nb)) api.later(settle, 620);
  }

  const fill = (row, thing, n, side) => {
    for (let i = 0; i < n; i++){
      const it = el('div.qi.pairitem', { text: thing.e });
      it.dataset.side = side;
      tappable(it, () => tap(it));
      row.append(it);
    }
  };
  fill(rowA, t1, na, 'a');
  fill(rowB, t2, nb, 'b');
  board.append(rowA, el('div.pairgap', { 'aria-hidden': 'true' }), rowB);
  api.field.append(board);

  api.setPrompt(`${t1.e} と ${t2.e} を <b>1つずつ</b> ペアに しよう`,
                `${t1.n}と${t2.n}を、一つずつペアにしよう。`);
  const free = row => itemsOf(row).find(x => !x.classList.contains('paired'));
  api.coach({
    text: 'うえを 1つ タップ、つぎに したを 1つ タップ',
    say: '上を一つタップ、次に、下を一つタップ。',
    tool(){ const a = free(rowA); if (a && !marked){ marked = a; a.classList.add('marked'); } },
    // pairing is never wrong, so this only ever runs when asked to show: every pair, in order
    walk(){
      const as = itemsOf(rowA).filter(x => !x.classList.contains('paired'));
      const bs = itemsOf(rowB).filter(x => !x.classList.contains('paired'));
      const steps = [{ act(){ if (marked){ marked.classList.remove('marked'); marked = null; } }, ms: 200 }];
      for (let i = 0; i < Math.min(as.length, bs.length); i++){
        steps.push({ at: as[i], act(){ tap(as[i]); }, ms: 520 }, { at: bs[i], act(){ tap(bs[i]); }, ms: 760 });
      }
      return steps;
    }
  });
  return made;
}

/* Each of these three names its item *before* calling pairUp, not inside the
   settle callback: the engine reads the item straight after make() returns, and an
   unnamed question drops out of the shuffle bag and out of 集中練習. */

/** Which row has something left over — including「おなじ」, which is the case a
    child who only ever counts the longer row never meets. */
function pairWhichMore(api){
  const same = chance(.3);
  const na = ri(3, 7);
  let nb = same ? na : clamp(na + pick([1, 2, -1, -2]), 2, 8);
  if (!same && nb === na) nb = na + 1;
  api.item('more:' + Math.min(na, nb) + '_' + Math.max(na, nb),
    na === nb ? na + ' と ' + nb + ' は おなじ'
              : Math.max(na, nb) + ' と ' + Math.min(na, nb) + ' の くらべ');
  pairUp(api, na, nb, made => {
    const A = made.na, B = made.nb;
    const ans = A === B ? 'おなじ' : (A > B ? made.a.e : made.b.e);
    api.setPrompt('ペアに ならなかったのは どっち？　どちらが <b>おおい</b>？',
                  'ペアにならなかったのは、どっち？　どちらが多い？');
    api.buildChoices(shuffle([made.a.e, made.b.e, 'おなじ']), ans);
    api.coach({
      text: 'ペアに なれなかった のは どっちの れつ？',
      say: 'ペアになれなかったのは、どっちの列？',
      tool(){ Coach.pulse($$('.pairitem.leftover', made.board)); },
      walk(){
        const left = $$('.pairitem.leftover', made.board);
        return left.length ? left.map((x, i) => ({ at: x, say: i ? '' : '余ったのは、こっち。', ms: i ? 700 : 1600 }))
                           : [{ at: made.board, say: 'どれも、ペアになったね。', ms: 1900 }];
      }
    });
  });
}

/** 求差. The leftover *is* the difference — the child reads it off the board
    instead of taking one number away from another. */
function pairHowManyMore(api){
  const na = ri(3, 9);
  let nb = clamp(na + pick([1, 2, 3, -1, -2, -3]), 2, 9);
  if (nb === na) nb = na === 9 ? 8 : na + 1;
  api.item('diff1to1:' + Math.max(na, nb) + '-' + Math.min(na, nb),
    Math.max(na, nb) + ' と ' + Math.min(na, nb) + ' の ちがい');
  pairUp(api, na, nb, made => {
    const A = made.na, B = made.nb;
    const big = A > B ? made.a : made.b, ans = Math.abs(A - B);
    api.setPrompt(`${big.e} は いくつ <b>おおい</b>？`, `${big.n}は、いくつ多い？`);
    const box = el('span.box', { text: '?' });
    api.field.append(el('div.eq', null,
      String(Math.max(A, B)), el('span.op', { text: '−' }), String(Math.min(A, B)),
      el('span.op', { text: '＝' }), box));
    api.buildPad(ans, revealed(() => {
      fillBlank(box, ans);
      // the leftovers are the answer: number them so the sentence and the board agree
      $$('.pairitem.leftover', made.board).forEach((x, i) => {
        if (!$('.tag, .ctag', x)) x.append(el('span.tag.left', { text: String(i + 1) }));
      });
    }, { delay: 1500 }));
    // the leftovers used to arrive numbered; now they are the child's to count
    const cnt = Coach.once(() => Coach.countable(api, $$('.pairitem.leftover', made.board)));
    api.coach({
      text: 'あまった ぶんを かぞえよう',
      say: '余った分を、数えよう。',
      tool(){ cnt(); },
      walk(){ return cnt().steps(); }
    });
  });
}

/** Making the two rows the same length. Same difference, opposite direction:
    「あと いくつ たすと おなじ」 is where 求補 comes from. */
function pairMakeSame(api){
  const big = ri(4, 8), small = clamp(big - ri(1, 3), 1, 7);
  // either row can be the short one: always shortening the bottom row would let a
  // child answer from where the gap is rather than from how big it is
  const flip = chance(.5);
  const na = flip ? small : big, nb = flip ? big : small;
  const byTapping = chance(.5);
  api.item('same1to1:' + big + '-' + small, small + ' を ' + big + ' に そろえる');
  // the tapping version grows the short row past the long one, so hold the columns
  pairUp(api, na, nb, made => {
    const A = made.na, B = made.nb;
    const short = A < B ? made.rowA : made.rowB;
    const shortThing = A < B ? made.a : made.b;
    const need = Math.abs(A - B);
    if (byTapping){
      api.setPrompt(`${shortThing.e} を たして <b>おなじ かず</b>に しよう`,
                    `${shortThing.n}を足して、同じ数にしよう。`);
      let added = 0;
      for (let i = 0; i < need + 2; i++){
        const slot = el('div.cell.tappable.pairslot');
        tappable(slot, () => {
          if (api.locked || slot.dataset.filled === '1') return;
          slot.dataset.filled = '1';
          slot.classList.remove('tappable');
          slot.textContent = shortThing.e;
          added++;
          Sound.sfx.place();
          if (added === need){
            $$('.pairslot', short).forEach(s => { if (s.dataset.filled !== '1') s.remove(); });
            api.later(() => {
              api.setPrompt(`どちらも <b>${Math.max(A, B)}</b>こ。おなじに なったね！`,
                            `どちらも${koKana(Math.max(A, B))}。同じになったね。`);
              api.correct({ quiet: true, delay: 1300 });
              UI.bigMark('◯');
            }, 300);
          }
        });
        short.append(slot);
      }
      api.coach({
        text: 'あまって いる ぶんだけ たそう',
        say: '余っている分だけ、足そう。',
        tool(){ $$('.pairitem.leftover', made.board).forEach(x => x.classList.add('marked')); },
        walk(){
          const left = $$('.pairitem.leftover', made.board);
          const slot = $$('.pairslot', short).find(s => s.dataset.filled !== '1');
          return left.map((x, i) => ({ at: x, say: numKana(i + 1), ms: 650 }))
            .concat(slot ? [{ at: slot, say: 'その分、ここに足そう。', ms: 1900 }] : []);
        }
      });
      api.onShow(() => {
        $$('.pairslot', short).filter(s => s.dataset.filled !== '1').slice(0, need - added).forEach(s => s.click());
      });
    } else {
      api.setPrompt(`おなじ かずに するには ${shortThing.e} が あと いくつ？`,
                    `同じ数にするには、${shortThing.n}があといくつ？`);
      api.buildPad(need, {
        correctOpts: { delay: 1400 },
        onPick(){
          for (let i = 0; i < need; i++){
            api.later(() => {
              short.append(el('div.qi.pairitem.paired.added', { text: shortThing.e }));
            }, i * 200 + 200);
          }
        }
      });
      const cnt = Coach.once(() => Coach.countable(api, $$('.pairitem.leftover', made.board)));
      api.coach({
        text: 'あまって いる ぶんが たりない かずだよ',
        say: '余っている分が、足りない数だよ。数えよう。',
        tool(){ cnt(); },
        walk(){ return cnt().steps(); }
      });
    }
  }, { extra: byTapping ? 2 : 0 });
}

/* ============================================================
   19. 20までの かず — ten and some more
   ============================================================ */
/* A full ten-frame is one thing, not ten: that is the whole idea of place value,
   and it is the reason 1年生 spend weeks on 11〜20 before touching くり上がり. The
   left frame is never re-counted here — it is always exactly ten. */
function teenFrames(total, opts){
  const o = opts || {};
  const ones = Math.max(0, total - 10);
  const ten = el('div.tenframe.fullten', { style: { '--cols': 5 } });
  for (let i = 0; i < 10; i++) ten.append(el('div.cell', null, el('div.dot')));
  const rest = el('div.tenframe', { style: { '--cols': 5 } });
  /* 11〜19 needs a second full ten-frame. Five cells worked only through 15:
     16 was drawn as「10と5」while the prompt and keypad expected 16. */
  for (let i = 0; i < 10; i++){
    const c = el('div.cell' + (i >= ones ? '.hole' : ''));
    if (i < ones) c.append(el('div.dot.b'));
    rest.append(c);
  }
  const set = el('div.frameset', null,
    el('div.framelabel', null, ten, el('small', { text: o.mute ? '' : '10' })),
    el('div.framelabel', null, rest, el('small', { text: o.mute ? '' : String(ones) })));
  return set;
}

function tenAndSome(api){
  const ones = ri(1, 9), total = 10 + ones;
  api.item('teen:' + total, '10と ' + ones + ' で ' + total);
  api.setPrompt(`<b>10</b> と <b>${ones}</b> で いくつ？`, `10と${numKana(ones)}で、いくつ？`);
  const box = el('span.box', { text: '?' });
  const frames = teenFrames(total);
  api.field.append(frames,
    el('div.eq', null, '10', el('span.op', { text: 'と' }), String(ones),
      el('span.op', { text: 'で' }), box));
  api.buildPad(total, revealed(() => fillBlank(box, total), { lo: 10, hi: 20 }));
  const [ten, rest] = $$('.tenframe', frames);
  const cnt = Coach.once(() => Coach.countable(api, $$('.dot', rest), { from: 10 }));
  api.coach({
    text: 'ひだりは ぴったり 10。じゅうの つぎから かぞえよう',
    say: '左は数えなくていいよ。ぴったり10。じゅうの次から、数えよう。',
    tool(){ Coach.pulse(ten); cnt(); },
    walk(){ return [{ at: ten, say: 'じゅう', ms: 1000 }].concat(cnt().steps()); }
  });
}

/** The other direction: given 14, say how many are left over once ten are taken
    as one group. Reading a teen number as「10と4」is the skill, not saying it. */
function teenSplit(api){
  const total = ri(11, 19), ones = total - 10;
  api.item('teensplit:' + total, total + ' は 10と ' + ones);
  api.setPrompt(`<b>${total}</b> は 10と いくつ？`, `${numKana(total)}は、10といくつ？`);
  const box = el('span.box', { text: '?' });
  const frames = teenFrames(total, { mute: true });
  api.field.append(frames,
    el('div.eq', null, String(total), el('span.op', { text: 'は' }), '10',
      el('span.op', { text: 'と' }), box));
  api.buildPad(ones, revealed(() => fillBlank(box, ones), { lo: 0, hi: 10 }));
  const [ten, rest] = $$('.tenframe', frames);
  const cnt = Coach.once(() => Coach.countable(api, $$('.dot', rest)));
  api.coach({
    text: 'ひだりは 10。みぎの あかい まるを かぞえよう',
    say: '左は、10。右の赤い丸を、数えよう。',
    tool(){ Coach.pulse(ten); cnt(); },
    walk(){ return [{ at: ten, say: 'じゅう', ms: 1000 }].concat(cnt().steps()); }
  });
}

/** 12+3, 17−4 — the ten stays whole and only the ones move. This is the last
    step before くり上がり, and the one that makes くり上がり make sense. */
function teenCalc(api){
  const plus = chance(.55);
  const ones = plus ? ri(1, 5) : ri(4, 9);
  const b = plus ? ri(1, 9 - ones) : ri(1, ones - 1);
  const a = 10 + ones, ans = plus ? a + b : a - b;
  api.item((plus ? 'teensum:' : 'teenrest:') + a + (plus ? '+' : '-') + b,
    a + (plus ? ' ＋ ' : ' − ') + b);
  api.setPrompt('しきを みて こたえよう',
                `${numKana(a)}、${plus ? 'たす' : 'ひく'}、${numKana(b)}は？`);
  const box = el('span.box', { text: '?' });
  const bEl = el('span', { text: String(b) });
  api.field.append(el('div.eq', null,
    String(a), el('span.op', { text: plus ? '＋' : '−' }), bEl,
    el('span.op', { text: '＝' }), box));
  api.buildPad(ans, revealed(() => fillBlank(box, ans), { lo: 10, hi: 20 }));
  const frames = Coach.once(() => { const s = teenFrames(a, { mute: true }); api.field.prepend(s); return s; });
  api.coach({
    text: plus ? '10は そのまま。ばらの ' + ones + ' に ' + b + ' を たそう'
               : '10は そのまま。ばらの ' + ones + ' から ' + b + ' を ひこう',
    say: plus ? `10はそのまま。ばらの${numKana(ones)}に、${numKana(b)}を足そう。`
              : `10はそのまま。ばらの${numKana(ones)}から、${numKana(b)}を引こう。`,
    tool(){ frames(); },
    walk(){
      const [ten, rest] = $$('.tenframe', frames());
      const dots = $$('.dot', rest);
      const steps = [{ at: ten, say: 'じゅう', ms: 1000 }];
      if (plus){
        dots.forEach((d, i) => steps.push({ at: d, act(){ Coach.tag(d, 11 + i); }, say: numKana(11 + i), ms: 620 }));
        for (let i = 1; i <= b; i++) steps.push({ at: bEl, say: numKana(a + i), ms: 680 });
      } else {
        dots.slice(ones - b).forEach(d => steps.push({ at: d, act(){ d.classList.add('coachgone'); }, ms: 450 }));
        dots.slice(0, ones - b).forEach((d, i) => steps.push({ at: d, act(){ Coach.tag(d, 11 + i); }, say: numKana(11 + i), ms: 620 }));
      }
      return steps;
    }
  });
}

/* ============================================================
   20. しきに かこう — the story and the sentence
   ============================================================ */
/* たしざん / ひきざん already ask for the answer to a story. 1年生 are asked for
   something else first: which sentence the story *is*. Choosing between 5＋2 and
   5−2 for the same picture, and then reading 5−2 back out as a story, is where
   ＋ and − stop being buttons and start being meanings (合併・増加 / 求残・求差). */
function pickEquation(api){
  const plus = chance(.5);
  const a = ri(2, 7), b = ri(1, Math.min(4, a - 1)), thing = pick(THINGS);
  const ans = (plus ? a + '＋' + b : a + '−' + b);
  api.item((plus ? 'shiki+:' : 'shiki-:') + a + '_' + b,
    a + (plus ? ' ＋ ' : ' − ') + b + ' の しき');
  api.setPrompt(
    plus ? `${thing.e} が ${numTag(a)}つ。${numTag(b)}つ やってきたよ`
         : `${thing.e} が ${numTag(a)}つ。${numTag(b)}つ いなくなるよ`,
    plus ? `${thing.n}が${tsuKana(a)}。${tsuKana(b)}、やってきたよ。`
         : `${thing.n}が${tsuKana(a)}。${tsuKana(b)}、いなくなるよ。`);
  storyScene(api, a, b, plus ? '+' : '-', thing, () => {
    api.setPrompt('この おはなしの <b>しき</b> は どれ？', 'このお話の式は、どれ？');
    // a third option with a different second number, kept inside 1..a-1 so that
    // 「5−6」 never appears on a screen a six-year-old is reading
    const pool = range(1, plus ? 9 - a : a - 1).filter(v => v !== b);
    const other = pool.length ? pick(pool) : b + 1;
    const opts = [ans, (plus ? a + '−' + b : a + '＋' + b), a + (plus ? '＋' : '−') + other];
    api.buildChoices(shuffle(opts), ans);
    /* The story again, instead of a rule about it: seeing them arrive (or leave) a
       second time is what「ふえた」means. */
    const replay = () => {
      const g2 = $$('.actor.g2', api.field);
      g2.forEach(n => {
        n.style.transition = 'none';
        if (plus) n.style.left = '112%';

/* Quantity stories should stay scenes a child can picture. The generic object
   bank includes cars and animals, which produced「ねこを食べました」. */
const WORD_THINGS = [
  { e: '🍎', n: 'りんご' }, { e: '🍓', n: 'いちご' }, { e: '🍌', n: 'バナナ' },
  { e: '🍇', n: 'ぶどう' }, { e: '🧁', n: 'ケーキ' }, { e: '🍩', n: 'ドーナツ' }
];

function plusOrMinus(api){
  const st = pick(WORD_STORIES);
  const plus = st.op === '+';
  const a = plus ? ri(2, 6) : ri(3, 9);
  const b = plus ? ri(1, 10 - a) : ri(1, a - 1);
  const ans = plus ? a + b : a - b;
  const thing = pick(WORD_THINGS);
  api.item((plus ? 'word+:' : 'word-:') + a + '_' + b,
    a + (plus ? ' ＋ ' : ' − ') + b + ' の おはなし');
  api.setPrompt('この おはなしは <b>たしざん</b>？ <b>ひきざん</b>？',
                st.s(a, b, thing) + st.q + '足し算か、引き算か、選ぼう。');
  const card = el('div.storycard', null,
    el('div.e', { text: thing.e }),
    el('div.lines', null,
      el('div.tx', { text: st.t(a, b, thing) }),
      el('div.qx', { text: st.q })));
  api.field.append(card);
  const eq = el('div.eq', null,
    String(a), el('span.op.opbox', { text: '?' }), String(b),
    el('span.op', { text: '＝' }), el('span.box', { text: '?' }));
  api.field.append(eq);
  api.buildChoices(['＋', '−'], plus ? '＋' : '−', {
    onPick(v){
      $('.opbox', eq).textContent = v;
      $('.opbox', eq).classList.add('filled');
      Sound.sfx.place();
      api.later(() => {
        api.setPrompt(st.q, st.q);
        api.buildPad(ans, revealed(() => fillBlank($('.box', eq), ans)));
      }, 420);
      return false;                    // the operation was only half the question
    }
  });
  // the word in the story that decides it, marked where the child is reading
  const markVerb = () => {
    const tx = $('.tx', card);
    if (!tx || $('mark', tx)) return;
    const s = tx.textContent;
    const m = /(もらいました|ふえました|たべました|あげました)/.exec(s);
    if (!m) return;
    clear(tx);
    tx.append(s.slice(0, m.index), el('mark', { text: m[1] }), s.slice(m.index + m[1].length));
  };
  api.coach({
    text: plus ? 'ふえた・もらった → ＋' : 'へった・たべた・あげた → −',
    say: plus ? '増えた、もらった、は、たす。' : '食べた、あげた、は、ひく。',
    tool: markVerb,
    walk(){
      markVerb();
      return [{ at: () => $('mark', card), say: plus ? '増えたお話。' : '減ったお話。', ms: 1700 },
              { at: () => $('.opbox', eq), say: plus ? 'だから、たす。' : 'だから、ひく。', ms: 1700 }];
    }
  });
}

/** The reverse direction: here is 5−2, which story is it about? A child who can
    only run stories forwards has not yet got the sentence. */
function matchStory(api){
  const plus = chance(.5);
  const a = plus ? ri(2, 6) : ri(4, 9);
  const b = plus ? ri(1, 10 - a) : ri(1, a - 2);
  const thing = pick(WORD_THINGS);
  let c = b + pick([1, 2]);
  if (!plus && c >= a) c = b - 1 || b + 1;
  api.item((plus ? 'read+:' : 'read-:') + a + '_' + b,
    a + (plus ? ' ＋ ' : ' − ') + b + ' に あう おはなし');
  api.setPrompt(`<b>${a} ${plus ? '＋' : '−'} ${b}</b> の おはなしは どれ？`,
                `${numKana(a)}、${plus ? 'たす' : 'ひく'}、${numKana(b)}のお話は、どれ？`);
  const opEl = el('span.op', { text: plus ? '＋' : '−' });
  api.field.append(el('div.eq', null, String(a), opEl, String(b)));
  const line = (n, verb) => `${thing.n}が ${a}こ。\n${n}こ ${verb}`;
  const right   = plus ? line(b, 'もらった') : line(b, 'たべた');
  const wrongOp = plus ? line(b, 'たべた')   : line(b, 'もらった');
  const wrongN  = plus ? line(c, 'もらった') : line(c, 'たべた');
  api.buildChoices(shuffle([right, wrongOp, wrongN]), right, {
    cls: 'story',
    speech: v => v.replace(/\n/g, '。'),
    // one sentence per line: a narrow button breaks Japanese wherever it likes,
    // and 「た/べた」 across two lines is not something a six-year-old should have
    // to reassemble before they can answer
    render: v => el('span', null, v.split('\n').map((t, i) => i ? [el('br'), t] : t))
  });
  api.coach({
    text: plus ? '＋ は ふえる おはなし。かずも おなじか みてね' : '− は へる おはなし。かずも おなじか みてね',
    say: plus ? 'たす、は、増えるお話。数も同じか、見てね。' : 'ひく、は、減るお話。数も同じか、見てね。',
    tool(){ Coach.pulse(opEl); },
    walk(){
      const flat = s => s.replace(/\s/g, '');
      const btn = $$('.choice', api.choices).find(x => flat(x.textContent) === flat(right));
      return [{ at: opEl, say: plus ? 'たす、だから、増える。' : 'ひく、だから、減る。', ms: 1900 },
              { at: btn, say: `${numKana(b)}こ、${plus ? 'もらった' : 'たべた'}お話。`, ms: 2000 }];
    }
  });
}

/* ===========================================================
   89 — first-run diagnostic, recommendations, and real-world missions
   =========================================================== */
'use strict';

const Diagnostic = (() => {
  const ORDER = ['count', 'numeral', 'seq', 'compare', 'ordinal', 'measure',
                 'bond', 'shape', 'pattern', 'clock'];

  function shouldRun(){
    return !Store.data.diagnostic
      && Store.totalStars() === 0
      && Object.keys(Store.data.recent || {}).length === 0;
  }

  function recommendFrom(outcomes){
    const xs = outcomes || [];
    for (const id of ORDER){
      const x = xs.find(o => o.gameId === id);
      if (x && !x.clean) return { gameId: id, levelIndex: 0 };
    }
    return { gameId: 'flash', levelIndex: 0 };
  }

  /* The order the six-month roadmap actually walks. 「いまの おすすめ」 used to know
     only five of the sixteen 入学前 games, so a child who followed it every day was
     told to replay いくつと いくつ L1 for the rest of the year: 180 simulated days of
     きょうの れんしゅう + おすすめ cleared 15 of the 48 levels at 95% accuracy and 33 at
     75% — the door that opens 小学1年生 never opened, and the *more* accurate the
     child, the less they were moved on, because the only way past those five games
     was the「struggling」rescue below, which an accurate child never trips.

     Everything registered is walked, in curriculum order; a game added later and
     not named here still lands at the end rather than dropping out. */
  const ROADMAP = ['count', 'flash', 'numeral', 'seq', 'trace',
                   'compare', 'ordinal', 'measure',
                   'bond', 'ten', 'add', 'sub',
                   'shape', 'sort', 'pattern', 'clock',
                   'g1set', 'g1pair', 'g1teen', 'g1shiki'];
  function roadmap(){
    const seen = new Set(), out = [];
    ROADMAP.forEach(id => { if (Games.byId[id]){ out.push(id); seen.add(id); } });
    Games.list.forEach(g => { if (!seen.has(g.id)) out.push(g.id); });
    return out;
  }

  /* Done with a level = it has its clear sticker. Deliberately the same thing the
     door counts, so the level おすすめ names is always a level the door is waiting
     for — and a ★★★ level can never be recommended again. */
  /* A provisional clear counts as done here — the day it was earned, naming it again
     would send the child straight back — until a check on another day fails. Then
     the gap is real, and おすすめ goes back for it. */
  const cleared = (id, i) => Store.hasSticker(id + ':' + i) && !Store.checkFailed(id + ':' + i);

  /* A level tried three times without a pass has already opened the next one — the
     rule that no child is left at a padlock. おすすめ did not follow it: it named the
     first uncleared level, so one level a child could not yet pass was named every
     day and nothing after it ever came up. Once it has had its three goes it rests
     for a few days, and the roadmap moves on; it comes back afterwards, and it comes
     back at once if there is nothing else left to name. */
  const REST_DAYS = 3;
  const resting = (id, i) => !cleared(id, i) && Store.plays(id, i) >= 3 && Store.daysSince(id, i) < REST_DAYS;

  function nextUncleared(){
    for (const skipResting of [true, false]){
      for (const id of roadmap()){
        const g = Games.byId[id];
        if (!g) continue;
        for (let i = 0; i < g.levels.length; i++){
          if (!levelOpen(g, i) || cleared(id, i)) continue;
          if (skipResting && resting(id, i)) continue;
          return { gameId: id, levelIndex: i };
        }
      }
    }
    return null;
  }

  /** The weakest open level with enough evidence to say so, or null.
      `unclearedOnly` leaves out levels that already have their clear sticker. */
  function weakestLevel(unclearedOnly){
    let weakest = null;
    Games.list.forEach(g => g.levels.forEach((lv, i) => {
      if (!levelOpen(g, i)) return;
      if (unclearedOnly && (cleared(g.id, i) || resting(g.id, i))) return;
      const n = Store.recentCount(g.id, i);
      if (n < 4) return;
      const acc = Store.recentAccuracy(g.id, i);
      if (!weakest || acc < weakest.acc) weakest = { gameId: g.id, levelIndex: i, acc };
    }));
    return weakest;
  }

  /* Below this, the child is not making progress and the day is better spent going
     back. It used to be .75 — but 75% first-try is a pass (★★), so an ordinary child
     was held on the same level instead of being shown the next one. Rescue is for
     being stuck, not for being imperfect. */
  const STUCK = 0.60;

  function current(){
    /* Rescue is for a level the child has not got past yet. A cleared level that
       has gone shaky is what きょうの れんしゅう and にがて あつめ are for — rescuing it
       here had no exit: a child at 40% on a cleared level was named it day after day
       (a median of 49 days in simulation) while nothing new came up. An uncleared
       level does have one: clearing it takes it out of here. */
    const stuck = weakestLevel(true);
    if (stuck && stuck.acc < STUCK) return stuck;

    /* はじめの ぼうけん picked a starting point; honour it until it is cleared. */
    const first = Store.data.diagnostic && Store.data.diagnostic.recommended;
    if (first && Games.byId[first.gameId]
        && levelOpen(Games.byId[first.gameId], first.levelIndex || 0)
        && !cleared(first.gameId, first.levelIndex || 0)
        && !resting(first.gameId, first.levelIndex || 0)) return first;

    const next = nextUncleared();
    if (next) return next;

    // everything open is cleared: go back to whatever is shakiest rather than
    // naming a level that has nothing left to give
    const weakest = weakestLevel();
    if (weakest) return weakest;
    let lowest = null;
    Games.list.forEach(g => g.levels.forEach((lv, i) => {
      if (!levelOpen(g, i)) return;
      const s = Store.stars(g.id, i);
      if (!lowest || s < lowest.stars) lowest = { gameId: g.id, levelIndex: i, stars: s };
    }));
    return lowest || { gameId: 'count', levelIndex: 0 };
  }

  function startRecommended(){
    const r = current(), g = r && Games.byId[r.gameId];
    if (g && g.levels[r.levelIndex]) Session.startLevel(g, r.levelIndex);
    else Session.startDaily(10);
  }

  return { shouldRun, recommendFrom, current, startRecommended, nextUncleared };
})();

  function stopHold(){
    clearTimeout(holdTimer); holdTimer = null; holdDone = null;
    if (doneBtn) doneBtn.classList.remove('holding');
  }
  function holdToConfirm(onDone){
    doneBtn.classList.add('holdbtn');
    doneBtn.style.setProperty('--hold', HOLD_MS + 'ms');
    doneBtn.onpointerdown = e => {
      e.preventDefault();
      stopHold();
      doneBtn.classList.add('holding');
      holdDone = () => { stopHold(); held = true; onDone(); };
      holdTimer = setTimeout(holdDone, HOLD_MS);
    };
    doneBtn.onpointerup = doneBtn.onpointerleave = doneBtn.onpointercancel = stopHold;
    doneBtn.onclick = () => {
      if (held){ held = false; return; }             // the click that ends a finished press
      Sound.say('おうちの人が、2秒長押ししてね。', { delay: 60 });
    };
  }
  function plainButton(onclick){
    stopHold();
    doneBtn.classList.remove('holdbtn');
    doneBtn.onpointerdown = doneBtn.onpointerup = doneBtn.onpointerleave = doneBtn.onpointercancel = null;
    doneBtn.onclick = onclick;
  }

  function open(mission){
    build();
    titleEl.textContent = 'きょうの さんすう ミッション';
    promptEl.textContent = mission.text;
    noteEl.textContent = mission.prompt;
    doneBtn.textContent = 'おうちのひとが ながおし（2びょう）';
    holdToConfirm(() => {
      Store.completeMission(mission.day);
      Sound.sfx.finish();
      Home.render();
      UI.show('home', { replace: true });
    });
    UI.show('mission');
    Sound.say(mission.text + '。' + mission.prompt, { delay: 250 });
  }

  function openReview(mission){
    build();
    titleEl.textContent = 'きのうの ミッション';
    promptEl.textContent = mission.text;
    noteEl.textContent = 'どんな ふうに できたか、おうちのひとに おはなししよう';
    doneBtn.textContent = 'おはなし できた！';
    plainButton(() => {
      Store.reviewMission(mission.day);
      Sound.sfx.correct();
      Home.render();
      UI.show('home', { replace: true });
    });
    UI.show('mission');
    Sound.say('昨日のミッション、どんなふうにできたかお話ししよう。', { delay: 250 });
  }

  function resultCard(gameId){
    const m = forGame(gameId || 'count');
    const b = el('button.result-mission', { type: 'button', onclick(){ open(m); } },
      el('b', { text: 'きょうの さんすう ミッション' }),
      el('span', { text: m.text }),
      el('small', { text: m.done ? 'できました！' : 'おうちのひとと やってみよう' }));
    return b;
  }

  return { forGame, yesterdayReview, open, openReview, resultCard,
           /** test seam: end a press that has started, without waiting two seconds */
           _test: { finishHold(){ if (holdDone) holdDone(); } } };
})();

    onclick(){ Sound.sfx.tap(); Sound.say(typeof text === 'function' ? text() : text, { delay: 60 }); } }, '🔊');

/* ---------------------------------------------------------- TITLE */
const Title = (() => {

      text: 'はじめる',
      onclick(){
        if (starting) return;
        starting = true;
        Sound.unlock();
        Sound.sfx.unlockSfx();
        Sound.say('数の冒険へ、ようこそ！', { delay: 260 });
        Sound.probeVoice(1200).then(hasVoice => {

         difference between「アプリを開いた」and「わたしの ぼうけん」. The field was in

      el('div.tag', { text: Store.name
