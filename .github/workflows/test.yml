name: Regression tests

on:
  pull_request:
  push:
    # main runs these from the deploy workflow, before it builds
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # the suite runs against dist/, so it has to be the dist/ that src/ produces
      - name: Build the single-file app
        run: ./build.sh
      - name: Fail if the committed dist is out of date
        run: git diff --exit-code -- dist/ || {
            echo "::error::dist/ does not match src/. Run ./build.sh and commit the result.";
            exit 1;
          }

      - name: Install Chromium for the test page
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Check voice loading and playback lifecycle
        run: node tools/test-voices.cjs

      - name: Verify natural voices and offline settings in a browser
        env:
          SILENT_AUDIO: '1'
        run: node tools/test-voice-browser.cjs

      - name: Run the regression suite in a browser
        run: node tools/run-tests.cjs

      - name: Verify review fixes, backup compatibility and keyboard controls
        run: |
          node tools/test-motivation.cjs
          node tools/test-review-fixes.cjs

      - name: Verify per-question counts and saved learning sessions
        run: |
          node tools/test-session-store.cjs
          node tools/test-session-browser.cjs

      - name: Verify one-question learning and later-day mastery checks
        run: |
          node tools/test-short-store.cjs
          node tools/test-short-browser.cjs
          node tools/test-adaptive-short.cjs
          node tools/test-short-gold.cjs

      - name: Verify responsive number keys and daily endings
        run: |
          node tools/test-responsive-keypad.cjs
          node tools/test-day-ending.cjs

      - name: Verify picture controls, short-course progress and sticker navigation
        run: |
          node tools/test-playfield-access.cjs
          node tools/test-short-progress-ui.cjs
          node tools/test-sticker-book.cjs

      - name: Verify current-stage coaching, consistent entrances and answer pacing
        run: |
          STAGE_COACH_HTML=dist/kazu-no-bouken.html node tools/test-stage-coaching.cjs
          node tools/test-short-entry.cjs
          node tools/test-answer-pacing.cjs
          STAGE_COACH_HTML=dist/artifact.html node tools/test-stage-coaching.cjs
          PACING_HTML=dist/artifact.html node tools/test-answer-pacing.cjs

      - name: Verify parent guidance follows recent learning
        run: node tools/test-parent-guidance.cjs

      - name: Verify editable answers, island decoration and resumable home missions
        run: |
          INPUT_REVISION_HTML=dist/kazu-no-bouken.html node tools/test-input-revision.cjs
          node tools/test-island-editor.cjs
          MISSION_RESUME_HTML=dist/kazu-no-bouken.html node tools/test-mission-resume.cjs
          INPUT_REVISION_HTML=dist/artifact.html node tools/test-input-revision.cjs
          MISSION_RESUME_HTML=dist/artifact.html node tools/test-mission-resume.cjs

      - name: Verify island treasure chests and saved keepsakes
        run: node tools/test-treasures.cjs

      - name: Verify post-clear adventures and special stickers
        run: node tools/test-transfer.cjs

      - name: Verify textbook review lessons and persistence in the first lap
        run: |
          node tools/test-review.cjs
          node tools/test-review-scaffold.cjs
          node tools/test-review-help.cjs

      - name: Verify answer audio and tracing recovery
        run: node tools/test-input-accessibility.cjs

      - name: Verify separate learning records, legacy migration and backup merging
        run: node tools/test-round-store.cjs

      - name: Verify round navigation, visible identity and saved selection
        run: node tools/test-round-navigation.cjs

      - name: Verify offline Pokémon artwork and rarity rewards
        run: node tools/test-pokemon.cjs
